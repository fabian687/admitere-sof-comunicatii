<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="FDM împarte frecvența în subbenzi, TDM împarte timpul în sloturi">
  <text x="200" y="18" text-anchor="middle" class="t-b">FDM · frecvența se împarte</text>
  <g stroke-width="1.5">
    <rect x="70" y="30" width="310" height="28" rx="6" class="f-acs s-acc"/>
    <rect x="70" y="62" width="310" height="28" rx="6" class="f-ams s-amb"/>
    <rect x="70" y="94" width="310" height="28" rx="6" class="f-bls s-blu"/>
    <rect x="70" y="126" width="310" height="28" rx="6" class="f-res s-red"/>
  </g>
  <g class="t-b" text-anchor="middle"><text x="225" y="49">canal 1</text><text x="225" y="81">canal 2</text><text x="225" y="113">canal 3</text><text x="225" y="145">canal 4</text></g>
  <text x="4" y="96" style="font-size:12px" class="t-mut">frecvență</text>
  <text x="4" y="112" style="font-size:12px" class="t-mut">↑</text>
  <text x="380" y="172" text-anchor="end" style="font-size:12px" class="t-mut">timp → (fiecare canal, tot timpul)</text>
  <line x1="10" y1="184" x2="390" y2="184" class="s-line" stroke-width="1.5"/>
  <text x="200" y="208" text-anchor="middle" class="t-b">TDM · timpul se împarte</text>
  <g stroke-width="1.5">
    <rect x="20" y="220" width="45" height="40" class="f-acs s-acc"/><rect x="65" y="220" width="45" height="40" class="f-ams s-amb"/>
    <rect x="110" y="220" width="45" height="40" class="f-bls s-blu"/><rect x="155" y="220" width="45" height="40" class="f-res s-red"/>
    <rect x="200" y="220" width="45" height="40" class="f-acs s-acc"/><rect x="245" y="220" width="45" height="40" class="f-ams s-amb"/>
    <rect x="290" y="220" width="45" height="40" class="f-bls s-blu"/><rect x="335" y="220" width="45" height="40" class="f-res s-red"/>
  </g>
  <g class="t-b" text-anchor="middle"><text x="42" y="245">1</text><text x="87" y="245">2</text><text x="132" y="245">3</text><text x="177" y="245">4</text><text x="222" y="245">1</text><text x="267" y="245">2</text><text x="312" y="245">3</text><text x="357" y="245">4</text></g>
  <path d="M20 270 H200" class="s-mut" stroke-width="1.5" fill="none"/><path d="M200 270 H380" class="s-mut" stroke-width="1.5" fill="none"/>
  <text x="110" y="288" text-anchor="middle" style="font-size:12px" class="t-mut">un cadru (125 µs)</text>
  <text x="290" y="288" text-anchor="middle" style="font-size:12px" class="t-mut">următorul cadru</text>
  <text x="200" y="310" text-anchor="middle" style="font-size:12px" class="t-mut">fiecare canal: toată banda, dar doar o felie de timp</text>
</svg>
