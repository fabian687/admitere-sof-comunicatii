  <g class="t-b" style="font-size:12px"><text x="20" y="274">1 · Sergent</text><text x="28" y="230">2 · Sergent-major</text><text x="36" y="186">3 · Plutonier</text><text x="44" y="142">4 · Plutonier-major</text><text x="52" y="98">5 · Plutonier adjutant</text><text x="60" y="54">6 · Plt. adj. principal</text></g>
