<svg viewBox="0 0 400 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comutația de circuite cu cale rezervată față de comutația de pachete">
  <text x="200" y="18" text-anchor="middle" class="t-b">CIRCUITE · calea e rezervată</text>
  <g stroke-width="5" class="s-acc" fill="none"><path d="M70 68 H126"/><path d="M154 68 H246"/><path d="M274 68 H330"/></g>
  <g class="f-paper s-ink" stroke-width="1.5"><rect x="10" y="50" width="60" height="36" rx="8"/><rect x="330" y="50" width="60" height="36" rx="8"/></g>
  <circle cx="140" cy="68" r="14" class="f-acs s-acc" stroke-width="2"/><circle cx="260" cy="68" r="14" class="f-acs s-acc" stroke-width="2"/>
  <g class="t-b" text-anchor="middle"><text x="40" y="73">A</text><text x="360" y="73">B</text></g>
  <text x="200" y="118" text-anchor="middle" style="font-size:13px" class="t-mut">stabilire → transfer → eliberare</text>
  <text x="200" y="136" text-anchor="middle" style="font-size:13px" class="t-mut">calea rămâne ocupată și în pauze</text>
  <line x1="10" y1="152" x2="390" y2="152" class="s-line" stroke-width="1.5"/>
  <text x="200" y="176" text-anchor="middle" class="t-b">PACHETE · bucăți pe drumuri diferite</text>
  <g class="s-line" stroke-width="2" fill="none">
    <path d="M70 248 L130 212"/><path d="M70 248 L130 284"/><path d="M130 212 L270 212"/><path d="M130 284 L270 284"/><path d="M130 212 L270 284"/><path d="M130 284 L270 212"/><path d="M270 212 L330 248"/><path d="M270 284 L330 248"/>
  </g>
  <g class="f-paper s-ink" stroke-width="1.5"><rect x="10" y="230" width="60" height="36" rx="8"/><rect x="330" y="230" width="60" height="36" rx="8"/></g>
  <g class="f-bls s-blu" stroke-width="2"><circle cx="130" cy="212" r="14"/><circle cx="130" cy="284" r="14"/><circle cx="270" cy="212" r="14"/><circle cx="270" cy="284" r="14"/></g>
  <g class="t-b" text-anchor="middle"><text x="40" y="253">A</text><text x="360" y="253">B</text></g>
  <g stroke-width="1"><rect x="90" y="225" width="14" height="14" class="f-amb s-ink"/><rect x="190" y="205" width="14" height="14" class="f-amb s-ink"/><rect x="90" y="263" width="14" height="14" class="f-acc s-ink"/><rect x="190" y="277" width="14" height="14" class="f-acc s-ink"/><rect x="298" y="263" width="14" height="14" class="f-red s-ink"/></g>
  <text x="200" y="320" text-anchor="middle" style="font-size:13px" class="t-mut">pachetele împart liniile cu alți utilizatori</text>
</svg>
