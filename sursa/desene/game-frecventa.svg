<svg viewBox="0 0 400 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gamele de frecvență">
  <g stroke-width="1.5" class="s-ink">
    <rect x="4" y="40" width="64" height="46" class="f-paper"/><rect x="68" y="40" width="64" height="46" class="f-paper"/>
    <rect x="132" y="40" width="64" height="46" class="f-ams"/><rect x="196" y="40" width="64" height="46" class="f-acs"/>
    <rect x="260" y="40" width="64" height="46" class="f-paper"/><rect x="324" y="40" width="64" height="46" class="f-paper"/>
  </g>
  <g text-anchor="middle" class="t-b t-l"><text x="36" y="69">LF</text><text x="100" y="69">MF</text><text x="164" y="69" class="t-amb">HF</text><text x="228" y="69" class="t-acc">VHF</text><text x="292" y="69">UHF</text><text x="356" y="69">SHF</text></g>
  <g text-anchor="middle" class="t-m" style="font-size:11px"><text x="4" y="104" text-anchor="start">30k</text><text x="68" y="104">300k</text><text x="132" y="104">3M</text><text x="196" y="104">30M</text><text x="260" y="104">300M</text><text x="324" y="104">3G</text><text x="388" y="104" text-anchor="end">30G</text></g>
  <text x="200" y="26" text-anchor="middle" class="t-mut">frecvența crește spre dreapta →</text>
  <path d="M132 120 h64" class="s-amb" stroke-width="3"/><path d="M196 120 h64" class="s-acc" stroke-width="3"/>
  <g text-anchor="end"><text x="188" y="142" class="t-amb t-b">HF 3–30 MHz</text><text x="188" y="158" class="t-amb" style="font-size:12px">unde scurte</text><text x="188" y="173" class="t-amb" style="font-size:12px">distanțe mari</text></g>
  <g text-anchor="start"><text x="206" y="142" class="t-acc t-b">VHF 30–300 MHz</text><text x="206" y="158" class="t-acc" style="font-size:12px">unde ultrascurte</text><text x="206" y="173" class="t-acc" style="font-size:12px">tactic: 30–88 MHz</text></g>
  <text x="200" y="202" text-anchor="middle" class="t-mut">← unde lungi · · · · · · · · · · · unde scurte →</text>
