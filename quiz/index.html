<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Grile SOF Comunicații</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f5f1; --card:#ffffff; --ink:#1d2321; --muted:#5d6763; --line:#dcdcd4;
  --accent:#1f5f4a; --accent-ink:#ffffff; --ok:#1f7a4a; --ok-bg:#e3f3e9; --bad:#b3261e; --bad-bg:#fbe7e5;
  --chip:#ecebe4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121614; --card:#1b201e; --ink:#e7ece9; --muted:#9aa5a0; --line:#2c3431;
    --accent:#5fbf98; --accent-ink:#0d1311; --ok:#6fd39b; --ok-bg:#163126; --bad:#ff8a80; --bad-bg:#3a1c1a;
    --chip:#242b28; color-scheme:dark;
  }
}
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#121614; --card:#1b201e; --ink:#e7ece9; --muted:#9aa5a0; --line:#2c3431;
  --accent:#5fbf98; --accent-ink:#0d1311; --ok:#6fd39b; --ok-bg:#163126; --bad:#ff8a80; --bad-bg:#3a1c1a;
  --chip:#242b28;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding-block:16px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
h1{font-size:1.35rem;margin:.2rem 0 .2rem}
h2{font-size:1.05rem;margin:1.4rem 0 .6rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
p.sub{color:var(--muted);margin:.2rem 0 1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:12px 14px;font:inherit;cursor:pointer;text-align:left;width:100%}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{width:auto;flex:1 1 auto;text-align:center}
.grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:2px 10px;font-size:.8rem;color:var(--muted);margin-left:6px}
.q{font-weight:600;font-size:1.05rem;margin:.2rem 0 .8rem}
.opt{display:block;margin:8px 0}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ex{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--chip);border-radius:6px;font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:.9rem;flex-wrap:wrap}
.top span{min-width:0}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:default}
.bar{height:6px;background:var(--chip);border-radius:9px;overflow:hidden;margin:8px 0 2px}
.bar>i{display:block;height:100%;background:var(--accent)}
.big{font-size:2.4rem;font-weight:700;margin:.2rem 0}
.okc{color:var(--ok)} .badc{color:var(--bad)}
small{color:var(--muted)}
a{color:var(--accent)}
.rev{border-top:1px solid var(--line);padding:10px 0}
.hidden{display:none}
</style>

<script>
const DATA = [{"id": "L01", "t": "Constituția României", "k": "L", "q": [["Potrivit Constituției, România este stat:", ["național, suveran și federal", "suveran, independent și confederal", "unitar, divizibil în regiuni autonome", "național, suveran și independent, unitar și indivizibil"], 3, "Art. 1 alin. (1)."], ["Forma de guvernământ a statului român este:", ["republica federală", "republica", "republica prezidențială federativă", "monarhia constituțională"], 1, "Art. 1 alin. (2)."], ["Statul român se organizează potrivit principiului:", ["supremației puterii executive asupra celorlalte puteri", "unității puterilor în stat", "subordonării puterii judecătorești față de Parlament", "separației și echilibrului puterilor – legislativă, executivă și judecătorească"], 3, "Art. 1 alin. (4)."], ["Suveranitatea națională aparține:", ["Președintelui României", "Parlamentului României", "Guvernului și Parlamentului împreună", "poporului român"], 3, "Art. 2 alin. (1). Poporul o exercită prin organele reprezentative și prin referendum."], ["Poporul român exercită suveranitatea națională:", ["prin Președinte și Guvern", "numai prin Parlament", "numai prin referendum", "prin organele sale reprezentative și prin referendum"], 3, "Art. 2 alin. (1)."], ["Care afirmație este corectă privind exercitarea suveranității?", ["Președintele exercită suveranitatea în nume propriu în stare de război", "suveranitatea poate fi delegată unei persoane prin referendum", "partidele parlamentare pot exercita suveranitatea în nume propriu", "niciun grup și nicio persoană nu pot exercita suveranitatea în nume propriu"], 3, "Art. 2 alin. (2)."], ["Teritoriul României este:", ["alienabil prin lege organică", "inalienabil doar în timp de război", "inalienabil", "divizibil prin referendum"], 2, "Art. 3 alin. (1)."], ["Frontierele țării se stabilesc prin:", ["hotărâre a CSAT", "hotărâre a Guvernului", "lege organică, cu respectarea principiilor și a normelor dreptului internațional", "decret al Președintelui"], 2, "Art. 3 alin. (2)."], ["Din punct de vedere administrativ, teritoriul României este organizat în:", ["regiuni, județe și comune", "regiuni de dezvoltare și municipii", "provincii și județe", "comune, orașe și județe"], 3, "Art. 3 alin. (3). Unele orașe sunt declarate municipii."], ["Ce interzice art. 3 din Constituție cu privire la teritoriu?", ["înființarea de noi județe", "staționarea trupelor străine în orice condiții", "strămutarea sau colonizarea de populații străine", "schimbarea denumirii localităților"], 2, "Art. 3 alin. (4)."], ["Statul român are ca fundament:", ["egalitatea dintre puterile statului", "suveranitatea Parlamentului", "unitatea politică a partidelor", "unitatea poporului român și solidaritatea cetățenilor săi"], 3, "Art. 4 alin. (1)."], ["Dreptul la identitate (art. 6) este garantat:", ["persoanelor aparținând minorităților naționale", "numai cetățenilor români cu domiciliul în străinătate", "apatrizilor cu drept de ședere", "numai cetățenilor străini aflați în România"], 0, "Art. 6 – identitatea etnică, culturală, lingvistică și religioasă."], ["Tratatele ratificate de Parlament, potrivit legii:", ["fac parte din dreptul intern", "au prioritate față de Constituție în orice situație", "au valoare de recomandare", "se aplică numai după aprobarea prin referendum"], 0, "Art. 11 alin. (2)."], ["Dacă un tratat la care România urmează să devină parte cuprinde dispoziții contrare Constituției:", ["Președintele poate ratifica tratatul prin decret", "ratificarea lui poate avea loc numai după revizuirea Constituției", "tratatul se ratifică, iar dispozițiile contrare nu se aplică", "tratatul se aplică direct, cu prioritate față de Constituție"], 1, "Art. 11 alin. (3)."], ["Drapelul României este tricolor, culorile fiind așezate vertical, în ordinea următoare începând de la lance:", ["albastru, galben, roșu", "albastru, roșu, galben", "galben, albastru, roșu", "roșu, galben, albastru"], 0, "Art. 12 alin. (1)."], ["Ziua națională a României este:", ["1 Decembrie", "10 Mai", "26 Iunie", "24 Ianuarie"], 0, "Art. 12 alin. (2)."], ["Imnul național al României este:", ["„Deșteaptă-te, române!”", "„Trei culori”", "„Pe-al nostru steag e scris Unire”", "„Hora Unirii”"], 0, "Art. 12 alin. (3)."], ["Stema țării și sigiliul statului se stabilesc prin:", ["decrete prezidențiale", "legi organice", "hotărâri ale Guvernului", "ordine ale ministrului apărării"], 1, "Art. 12 alin. (4)."], ["Potrivit art. 15 din Constituție, legea dispune numai pentru viitor, cu excepția:", ["legilor de ratificare a tratatelor", "legii penale sau contravenționale mai favorabile", "legilor organice", "legii civile mai favorabile"], 1, "Art. 15 alin. (2) – principiul neretroactivității."], ["Funcțiile și demnitățile publice, civile sau militare, pot fi ocupate de persoanele care:", ["au cetățenia română și domiciliul în țară", "au cetățenia unui stat UE", "au cetățenia română, indiferent de domiciliu", "au orice cetățenie și domiciliul în țară"], 0, "Art. 16 alin. (3)."], ["Cetățenii români aflați în străinătate:", ["nu mai au obligații față de statul român", "au doar obligații fiscale față de statul român", "pierd dreptul la protecția statului român după 5 ani", "se bucură de protecția statului român și trebuie să-și îndeplinească obligațiile, cu excepția celor incompatibile cu absența din țară"], 3, "Art. 17."], ["Cetățeanul român poate fi extrădat:", ["niciodată, în nicio situație", "la cererea oricărui stat, fără condiții", "numai cu aprobarea Președintelui României", "în baza convențiilor internaționale la care România este parte, în condițiile legii și pe bază de reciprocitate"], 3, "Art. 19 alin. (2). Cetățeanul român NU poate fi expulzat."], ["Expulzarea sau extrădarea se hotărăște de:", ["Președintele României", "Guvern", "justiție", "Ministerul Afacerilor Interne"], 2, "Art. 19 alin. (4)."], ["Dacă există neconcordanțe între pactele și tratatele privind drepturile fundamentale ale omului și legile interne:", ["au prioritate reglementările internaționale, cu excepția cazului în care legile interne conțin dispoziții mai favorabile", "au prioritate întotdeauna legile interne", "decide Președintele care reglementare se aplică", "se aplică reglementarea mai nouă"], 0, "Art. 20 alin. (2)."], ["Jurisdicțiile speciale administrative sunt:", ["facultative și gratuite", "facultative și cu taxă", "obligatorii și cu taxă", "obligatorii și gratuite"], 0, "Art. 21 alin. (4)."], ["Potrivit Constituției, pedeapsa cu moartea:", ["se poate aplica pentru infracțiuni contra securității naționale", "este interzisă", "se poate aplica numai de instanțele militare", "se poate aplica numai în timp de război"], 1, "Art. 22 alin. (3)."], ["Reținerea unei persoane nu poate depăși:", ["72 de ore", "48 de ore", "24 de ore", "30 de zile"], 2, "Art. 23 alin. (3)."], ["Arestarea preventivă se dispune:", ["de comandantul unității, pentru militari", "de judecător și numai în cursul procesului penal", "de poliție, pentru maximum 24 de ore", "de procuror, în orice moment"], 1, "Art. 23 alin. (4)."], ["În cursul urmăririi penale, arestarea preventivă se poate dispune pentru cel mult ... și nu poate depăși în total ...", ["30 de zile; 180 de zile", "30 de zile; 60 de zile", "24 de ore; 30 de zile", "60 de zile; 120 de zile"], 0, "Art. 23 alin. (5). Prelungirea se face cu câte cel mult 30 de zile."], ["În faza de judecată, instanța este obligată să verifice periodic legalitatea și temeinicia arestării preventive:", ["nu mai târziu de 60 de zile", "nu mai târziu de 180 de zile", "numai la cererea inculpatului", "nu mai târziu de 30 de zile"], 0, "Art. 23 alin. (6)."], ["Învinuirea se aduce la cunoștința persoanei reținute sau arestate:", ["în cel mai scurt termen, numai în prezența unui avocat ales sau numit din oficiu", "numai la prima înfățișare în instanță", "în 48 de ore, fără prezența avocatului", "în scris, prin poștă"], 0, "Art. 23 alin. (8)."], ["Până la rămânerea definitivă a hotărârii judecătorești de condamnare, persoana:", ["este considerată nevinovată", "își pierde drepturile electorale", "este considerată vinovată dacă a fost arestată", "este considerată suspectă și poate fi sancționată administrativ"], 0, "Art. 23 alin. (11) – prezumția de nevinovăție."], ["Sancțiunea privativă de libertate poate fi:", ["de natură penală sau disciplinară", "de natură administrativă, dacă o decide prefectul", "numai de natură penală", "de natură penală sau contravențională"], 2, "Art. 23 alin. (13)."], ["Care NU este o excepție legală de la inviolabilitatea domiciliului prevăzută de art. 27?", ["prevenirea răspândirii unei epidemii", "efectuarea unui control fiscal de rutină", "executarea unui mandat de arestare sau a unei hotărâri judecătorești", "înlăturarea unei primejdii privind viața, integritatea fizică sau bunurile unei persoane"], 1, "Art. 27 alin. (2) prevede patru excepții; a patra este apărarea securității naționale sau a ordinii publice."], ["Percheziția se dispune de:", ["ofițerul de poliție judiciară", "comandantul unității militare", "judecător", "procuror"], 2, "Art. 27 alin. (3)."], ["Percheziția pe timp de noapte:", ["este permisă oricând cu aprobarea procurorului", "este interzisă, cu excepția delictului flagrant", "este permisă numai în cazul militarilor", "este permisă doar în stare de urgență"], 1, "Art. 27 alin. (4)."], ["Care dintre următoarele este garantat ca inviolabil de art. 28 (secretul corespondenței)?", ["registrele publice", "declarațiile de avere", "convorbirile telefonice", "datele publicate pe site-urile publice"], 2, "Art. 28 – scrisori, telegrame, trimiteri poștale, convorbiri telefonice și alte mijloace legale de comunicare."], ["Potrivit art. 29, statul sprijină cultele religioase inclusiv prin înlesnirea asistenței religioase în:", ["numai în instituțiile publice centrale", "numai în școli", "armată, spitale, penitenciare, aziluri și orfelinate", "în partidele politice"], 2, "Art. 29 alin. (5)."], ["Potrivit art. 30, cenzura:", ["de orice fel este interzisă", "este permisă pentru publicațiile care critică Guvernul", "se poate institui prin hotărâre a CSAT", "este permisă în timp de pace pentru presa militară"], 0, "Art. 30 alin. (2)."], ["Care dintre următoarele este interzisă prin lege potrivit art. 30 alin. (7)?", ["îndemnul la război de agresiune", "critica actelor Guvernului", "înființarea de publicații", "exprimarea opiniilor religioase"], 0, "Defăimarea țării, îndemnul la război de agresiune, la ură, discriminare, separatism teritorial, violență publică sunt interzise."], ["Dreptul la informație nu trebuie să prejudicieze:", ["interesele partidelor politice", "activitatea comercială a firmelor", "imaginea autorităților publice", "măsurile de protecție a tinerilor sau securitatea națională"], 3, "Art. 31 alin. (3)."], ["Dreptul de vot se exercită de la vârsta de:", ["16 ani", "18 ani, împliniți până la începutul anului electoral", "21 de ani", "18 ani, împliniți până în ziua alegerilor inclusiv"], 3, "Art. 36 alin. (1)."], ["Vârsta minimă pentru a fi ales în Senat este:", ["30 de ani", "35 de ani", "33 de ani", "23 de ani"], 2, "Art. 37 alin. (2)."], ["Vârsta minimă pentru a fi ales Președinte al României este:", ["40 de ani", "35 de ani", "30 de ani", "33 de ani"], 1, "Art. 37 alin. (2)."], ["Vârsta minimă pentru a fi ales în Camera Deputaților sau în organele administrației publice locale este:", ["23 de ani", "18 ani", "25 de ani", "33 de ani"], 0, "Art. 37 alin. (2)."], ["Întrunirile (mitingurile, demonstrațiile, procesiunile) sunt libere și se pot organiza:", ["oricând, inclusiv cu arme de autoapărare", "numai cu aprobarea Guvernului", "numai de partidele politice", "numai în mod pașnic, fără niciun fel de arme"], 3, "Art. 39."], ["Care dintre următoarele categorii NU poate face parte din partide politice, potrivit art. 40 alin. (3)?", ["pensionarii militari", "funcționarii din administrația locală aleși", "membrii activi ai armatei", "studenții instituțiilor civile de învățământ"], 2, "Art. 40 alin. (3): judecătorii CCR, avocații poporului, magistrații, membrii activi ai armatei, polițiștii și alte categorii stabilite prin lege organică."], ["Potrivit Constituției, asociațiile cu caracter secret sunt:", ["interzise", "permise dacă nu sunt politice", "permise doar pentru structurile militare", "permise cu aprobarea SRI"], 0, "Art. 40 alin. (4)."], ["Durata normală a zilei de lucru este:", ["în medie, de cel mult 8 ore", "de cel mult 10 ore", "de cel mult 12 ore, pentru militari", "de exact 8 ore, fără excepție"], 0, "Art. 41 alin. (3)."], ["Care dintre următoarele NU constituie muncă forțată, potrivit art. 42?", ["munca impusă unui salariat de angajator fără plată", "munca impusă unui minor de către o firmă privată", "activitățile pentru îndeplinirea îndatoririlor militare", "munca impusă pentru motive politice"], 2, "Art. 42 alin. (2) lit. a)."], ["Exproprierea se poate face:", ["prin hotărâre a consiliului local, cu despăgubire ulterioară", "numai pentru cauză de utilitate publică, stabilită potrivit legii, cu dreaptă și prealabilă despăgubire", "numai în timp de război", "pentru orice interes al statului, fără despăgubire"], 1, "Art. 44 alin. (3)."], ["Potrivit art. 44 alin. (8), averea dobândită licit:", ["se prezumă ilicită până la proba contrară", "poate fi confiscată dacă proprietarul nu poate dovedi proveniența", "nu poate fi confiscată, iar caracterul licit al dobândirii se prezumă", "poate fi confiscată în stare de urgență"], 2, "Art. 44 alin. (8)."], ["Potrivit art. 48, căsătoria religioasă:", ["înlocuiește căsătoria civilă", "este obligatorie pentru militari", "poate fi celebrată înaintea căsătoriei civile", "poate fi celebrată numai după căsătoria civilă"], 3, "Art. 48 alin. (2)."], ["Este interzisă angajarea ca salariați a minorilor sub vârsta de:", ["14 ani", "16 ani", "18 ani", "15 ani"], 3, "Art. 49 alin. (4)."], ["Exercitarea dreptului de petiționare este:", ["permisă numai organizațiilor legal constituite", "supusă unei taxe judiciare de timbru", "permisă doar prin avocat", "scutită de taxă"], 3, "Art. 51 alin. (3)."], ["Pentru prejudiciile cauzate prin erorile judiciare răspunde patrimonial:", ["statul", "Consiliul Superior al Magistraturii", "exclusiv judecătorul care a pronunțat hotărârea", "Ministerul Justiției, numai dacă erorile sunt intenționate"], 0, "Art. 52 alin. (3). Răspunderea statului nu înlătură răspunderea magistraților care au acționat cu rea-credință sau gravă neglijență."], ["Exercițiul unor drepturi sau al unor libertăți poate fi restrâns:", ["prin ordin al ministrului de interne", "numai prin lege și numai dacă se impune, după caz, pentru apărarea securității naționale, a ordinii, a sănătății ori a moralei publice etc.", "prin hotărâre a Guvernului, oricând este necesar", "prin decret al Președintelui, fără alte condiții"], 1, "Art. 53 alin. (1)."], ["Restrângerea exercițiului unor drepturi trebuie să fie:", ["aprobată prin referendum", "permanentă și aplicată tuturor cetățenilor", "proporțională cu situația care a determinat-o, aplicată nediscriminatoriu și fără a aduce atingere existenței dreptului", "aplicată numai militarilor"], 2, "Art. 53 alin. (2)."], ["Potrivit art. 54, fidelitatea față de țară este:", ["o obligație doar în timp de război", "facultativă pentru cetățenii cu dublă cetățenie", "sacră", "o obligație doar a militarilor"], 2, "Art. 54 alin. (1). Militarii depun jurământul cerut de lege."], ["Potrivit art. 55, cetățenii pot fi încorporați:", ["de la 18 ani până la 40 de ani", "de la 20 de ani până la 45 de ani, inclusiv voluntarii", "de la 18 ani până la 35 de ani", "de la vârsta de 20 de ani și până la vârsta de 35 de ani, cu excepția voluntarilor"], 3, "Art. 55 alin. (3)."], ["Apărarea țării reprezintă pentru cetățeni:", ["o obligație doar în stare de război", "doar un drept", "un drept și o obligație", "doar o obligație a militarilor"], 2, "Art. 55 alin. (1)."], ["Potrivit art. 57, cetățenii români, cetățenii străini și apatrizii trebuie să-și exercite drepturile și libertățile constituționale:", ["numai cu aprobarea autorităților", "cu bună-credință, fără să încalce drepturile și libertățile celorlalți", "în limita stabilită de CSAT", "numai pe teritoriul României"], 1, "Art. 57."], ["Comandantul forțelor armate ale României este:", ["șeful Statului Major al Apărării", "ministrul apărării naționale", "prim-ministrul", "Președintele României"], 3, "Art. 92 alin. (1)."], ["Funcția de președinte al Consiliului Suprem de Apărare a Țării este îndeplinită de:", ["ministrul apărării naționale", "prim-ministrul", "președintele Senatului", "Președintele României"], 3, "Art. 92 alin. (1)."], ["Mobilizarea parțială sau totală a forțelor armate se declară de Președinte:", ["prin decret, fără nicio aprobare", "cu aprobarea prealabilă a Parlamentului", "la propunerea șefului Statului Major al Apărării", "cu avizul Guvernului, fără aprobarea Parlamentului"], 1, "Art. 92 alin. (2)."], ["În cazuri excepționale, hotărârea Președintelui privind mobilizarea se supune ulterior aprobării Parlamentului în cel mult:", ["48 de ore de la adoptare", "5 zile de la adoptare", "24 de ore de la adoptare", "10 zile de la adoptare"], 1, "Art. 92 alin. (2)."], ["În caz de agresiune armată îndreptată împotriva țării, dacă Parlamentul nu se află în sesiune, acesta se convoacă de drept în:", ["48 de ore de la declanșarea agresiunii", "24 de ore de la declanșarea agresiunii", "5 zile de la declanșarea agresiunii", "72 de ore de la declanșarea agresiunii"], 1, "Art. 92 alin. (3)."], ["Starea de asediu sau starea de urgență se instituie de:", ["Președintele României, potrivit legii", "prim-ministru, cu avizul CSAT", "Parlament, la propunerea Guvernului", "ministrul afacerilor interne"], 0, "Art. 93 alin. (1)."], ["După instituirea stării de asediu sau de urgență, Președintele cere Parlamentului încuviințarea măsurii adoptate în cel mult:", ["30 de zile", "24 de ore", "5 zile de la luarea acesteia", "48 de ore"], 2, "Art. 93 alin. (1)."], ["Dacă Parlamentul nu se află în sesiune la instituirea stării de asediu sau de urgență, el se convoacă de drept în cel mult:", ["48 de ore de la instituirea stării", "5 zile de la instituirea stării", "72 de ore de la instituirea stării", "24 de ore de la instituirea stării"], 0, "Art. 93 alin. (2). Parlamentul funcționează pe toată durata stării."], ["Potrivit art. 118, armata este subordonată exclusiv:", ["Parlamentului", "voinței poporului", "ministrului apărării naționale", "Guvernului"], 1, "Art. 118 alin. (1)."], ["Structura sistemului național de apărare și statutul cadrelor militare se stabilesc prin:", ["ordin al ministrului apărării naționale", "hotărâre a CSAT", "lege organică", "hotărâre a Guvernului"], 2, "Art. 118 alin. (2)."], ["Organizarea de activități militare sau paramilitare în afara unei autorități statale este:", ["permisă pentru asociațiile sportive", "interzisă", "permisă cu aviz de la MApN", "permisă în timp de pace"], 1, "Art. 118 alin. (4)."], ["Trupele străine pot intra, staționa sau trece pe teritoriul României:", ["numai în condițiile legii sau ale tratatelor internaționale la care România este parte", "oricând, dacă sunt state membre NATO", "numai cu aprobarea Președintelui, prin decret", "numai în timp de război"], 0, "Art. 118 alin. (5)."], ["Organismul care organizează și coordonează unitar activitățile care privesc apărarea țării și securitatea națională este:", ["Consiliul Suprem de Apărare a Țării", "Statul Major al Apărării", "Guvernul României", "Ministerul Apărării Naționale"], 0, "Art. 119."]]}, {"id": "L02", "t": "Legea 45/1994 a apărării naționale", "k": "L", "q": [["Potrivit Legii nr. 45/1994, apărarea națională reprezintă:", ["activitatea desfășurată exclusiv de Ministerul Apărării Naționale în timp de război", "ansamblul de măsuri și activități adoptate și desfășurate de statul român pentru a garanta suveranitatea națională, independența și unitatea statului, integritatea teritorială și democrația constituțională", "ansamblul alianțelor militare din care face parte România", "totalitatea forțelor armate ale României"], 1, "Art. 1."], ["Măsurile privind apărarea națională sunt obligatorii pentru:", ["numai pentru instituțiile publice", "numai pentru militari", "toți cetățenii, instituțiile publice și private și agenții economici, indiferent de forma de proprietate", "numai pentru agenții economici cu capital de stat"], 2, "Art. 2."], ["Normele privind apărarea națională NU se bazează, potrivit art. 3, pe:", ["Constituție", "doctrina militară", "regulamentele interne ale agenților economici", "tratatele la care România este parte"], 2, "Art. 3: Constituție, legi, doctrina militară, normele de drept internațional recunoscute, tratatele."], ["În cazul unei agresiuni armate de mare amploare, care depășește capacitatea forțelor armate:", ["se suspendă activitatea Parlamentului", "se solicită exclusiv sprijinul NATO", "se mobilizează toate resursele umane și materiale necesare", "se declară automat starea de urgență în toate județele"], 2, "Art. 4."], ["Sistemul național de apărare cuprinde:", ["Parlamentul, Guvernul și CSAT", "armata, poliția, jandarmeria și serviciile de informații", "conducerea, forțele, resursele și infrastructura teritorială", "forțele terestre, aeriene și navale"], 2, "Art. 6."], ["Conducerea sistemului național de apărare se realizează:", ["de comandanții militari județeni", "exclusiv de autoritățile constituționale", "exclusiv de Ministerul Apărării Naționale", "de Statul Major al Apărării, în pace și război"], 1, "Art. 7."], ["Care dintre următoarele NU face parte din conducerea sistemului național de apărare, potrivit art. 7?", ["Consiliul Suprem de Apărare a Țării", "comandanții unităților militare", "autoritățile administrației publice locale cu atribuții în domeniul apărării", "Parlamentul"], 1, "Art. 7: Parlament, Președinte, CSAT, Guvern, MApN, autorități locale cu atribuții."], ["Conducerea strategică militară se realizează prin:", ["Centrul Militar Zonal", "Consiliul Suprem de Apărare a Țării", "Comandamentul Logistic Întrunit", "Centrul Național Militar de Comandă"], 3, "Art. 8."], ["În timp de război, în fiecare județ și în municipiul București există:", ["un consiliu militar ales de consiliul județean", "un comandament NATO", "un comandant militar, subordonat Centrului Național Militar de Comandă", "un prefect militar numit de ministrul apărării"], 2, "Art. 9."], ["Forțele sistemului național de apărare cuprind:", ["numai armata", "armata și poliția locală", "forțele terestre și forțele navale", "forțele armate și forțele de protecție"], 3, "Art. 10–12."], ["Din forțele de protecție fac parte:", ["forțele serviciilor de informații", "forțele terestre", "protecția civilă și voluntarii Crucii Roșii", "unitățile de poliție militară"], 2, "Art. 12."], ["Forțele sistemului de apărare pot folosi pentru instruire terenuri și bunuri în condițiile legii rechizițiilor, cu obligația:", ["de a le păstra până la finalul anului", "de a le restitui în starea inițială", "de a plăti o taxă anuală fixă", "de a le cumpăra după exercițiu"], 1, "Art. 13."], ["Resursele umane ale apărării sunt reprezentate de:", ["populația aptă să desfășoare activități în domeniul apărării", "numai militarii activi", "toți cetățenii, indiferent de vârstă și aptitudini", "numai rezerviștii"], 0, "Art. 15."], ["Cetățenii apți pentru serviciul militar care s-au sustras, din vina lor, de la îndeplinirea acestuia:", ["nu pot ocupa funcții de conducere în instituțiile publice", "nu pot vota", "nu pot călători în străinătate", "pierd cetățenia română"], 0, "Art. 16."], ["Cheltuielile pentru apărare se asigură:", ["din contribuția obligatorie a cetățenilor", "numai din donații", "numai din fondurile NATO", "de la bugetul de stat și din alte surse prevăzute de lege"], 3, "Art. 19."], ["Infrastructura teritorială a sistemului de apărare cuprinde:", ["numai cazărmile", "clădirile ministerelor", "numai drumurile naționale", "lucrările și amenajările de pe teritoriu care pot fi utilizate pentru apărare"], 3, "Art. 20."], ["Pentru amplasarea unor obiective de investiții noi, ministerele, autoritățile și agenții economici au nevoie de avizul:", ["Centrului Militar Județean", "Statului Major General (în prezent Statul Major al Apărării)", "consiliului local", "Parlamentului"], 1, "Art. 21."], ["Militarizarea agenților economici care susțin direct efortul de apărare poate fi dispusă de:", ["ministerul economiei", "prefect", "Consiliul Suprem de Apărare a Țării", "consiliul județean"], 2, "Art. 22."], ["Nomenclatorul și nivelul rezervelor de tehnică și materiale constituite din timp de pace se aprobă de:", ["Consiliul Suprem de Apărare a Țării", "ministrul finanțelor", "comandanții de unități", "Parlament"], 0, "Art. 23."], ["Exercițiile de mobilizare pentru verificarea pregătirii se execută după un plan aprobat de:", ["Consiliul Suprem de Apărare a Țării", "consiliile locale", "Guvern", "Statul Major al Forțelor Terestre"], 0, "Art. 24."], ["Comenzile pentru apărare se execută de instituții și agenți economici:", ["facultativ, în timp de pace", "numai în timp de război", "numai dacă sunt finanțate de NATO", "integral și la termen, pe bază de contract în timp de pace și cu prioritate în timp de război"], 3, "Art. 25."], ["Potrivit Legii 45/1994, armata constituie:", ["o structură subordonată Ministerului Afacerilor Interne", "singura componentă a sistemului de apărare", "nucleul forțelor armate", "componenta de protecție civilă"], 2, "Art. 26."], ["Armata se compune din:", ["unitățile de luptă și unitățile de rezervă", "organele centrale ale MApN, categoriile de forțe și organele militare teritoriale", "statul major, centrele de selecție și școlile militare", "forțele terestre, poliția și jandarmeria"], 1, "Art. 27."], ["Categoriile de forțe ale armatei sunt:", ["forțele terestre, jandarmeria și poliția de frontieră", "forțele de protecție și forțele armate", "forțele speciale, forțele aeriene și forțele cibernetice", "forțele terestre, forțele aeriene și forțele navale"], 3, "Art. 29 (textul legii folosește denumirile „forțele terestre, aviația și apărarea antiaeriană, marina militară”)."], ["Organele militare teritoriale sunt:", ["comandamentele de brigadă", "prefecturile", "statele majore ale categoriilor de forțe", "centrele militare zonale, județene și de sector"], 3, "Art. 30."], ["Guvernul conduce activitatea de apărare la nivelul județelor prin:", ["primari", "comandanții de brigăzi", "prefecți", "centrele militare de sector"], 2, "Art. 32."], ["Pregătirea forțelor și planificarea și conducerea mobilizării armatei este atribuția:", ["Ministerului Finanțelor", "Crucii Roșii", "autorităților administrației publice locale", "Ministerului Apărării Naționale"], 3, "Art. 33."], ["Pe timpul mobilizării și războiului, miniștrii alocă resursele din domeniul lor:", ["cu prioritate pentru nevoile apărării", "numai după aprobarea consiliilor locale", "proporțional cu populația județelor", "numai pentru protecția civilă"], 0, "Art. 34."], ["Monografiile economico-militare sunt ținute la zi de:", ["Statul Major al Forțelor Navale", "autoritățile administrației publice locale", "comandanții de pluton", "Parlament"], 1, "Art. 35."]]}, {"id": "L03", "t": "Legea 346/2006 privind MApN", "k": "L", "q": [["Potrivit Legii 346/2006, managementul spectrului de frecvențe radio alocat pentru apărare este o atribuție a:", ["Ministerului Apărării Naționale", "Autorității Naționale pentru Comunicații, exclusiv", "Ministerului Afacerilor Interne", "Serviciului de Telecomunicații Speciale"], 0, "Art. 5 – managementul spectrului radio pentru apărare și al resurselor de comunicații, IT și apărare cibernetică."], ["Care dintre următoarele este o atribuție a MApN prevăzută de art. 5?", ["gestionarea sistemului public de pensii", "organizarea alegerilor locale", "emiterea pașapoartelor", "managementul activității oficiale de cifru și al sistemelor criptografice din armată"], 3, "Art. 5."], ["Organizarea și conducerea mobilizării armatei, rechiziția de bunuri și chemarea persoanelor fizice la prestări de servicii în interes public sunt atribuții ale:", ["Ministerului Apărării Naționale", "Ministerului Justiției", "consiliilor județene", "Parlamentului"], 0, "Art. 5."], ["MApN participă la dezvoltarea capabilităților de apărare cibernetică:", ["numai la cererea NATO", "în colaborare cu alte instituții stabilite prin lege", "numai în timp de război", "exclusiv, fără alte instituții"], 1, "Art. 5."], ["Gestionarea sistemului pensiilor militare de stat este, potrivit art. 5, o atribuție a:", ["Ministerului Apărării Naționale", "Casei Naționale de Pensii Publice, exclusiv", "Ministerului Finanțelor", "centrelor militare județene, exclusiv"], 0, "Art. 5."], ["Potrivit art. 6, prin structurile desemnate, MApN NU este autoritate națională în domeniul:", ["pregătirii, brevetării și perfecționării scafandrilor", "aviației civile", "naval militar", "activității oficiale de criptologie, pentru componentele specifice"], 1, "Art. 6: autoritate navală militară, scafandri, informații geospațiale pentru apărare, criptologie."], ["MApN este autoritate națională în proiectarea, realizarea și asigurarea:", ["informațiilor geospațiale pentru apărare", "rețelelor de telefonie mobilă civile", "cadastrului imobiliar civil", "prognozei meteo pentru agricultură"], 0, "Art. 6 lit. c)."], ["Stabilirea limitelor zonelor de siguranță ale navelor militare și a regimului porturilor militare intră în atribuțiile MApN ca:", ["autoritate navală militară națională", "autoritate de scafandri", "autoritate de criptologie", "autoritate geospațială"], 0, "Art. 6 alin. (2)."], ["Verificarea periodică a scafandrilor brevetați, pentru reconfirmarea aptitudinilor, este asigurată de MApN în calitate de:", ["autoritate de criptologie", "autoritate națională în pregătirea, brevetarea și perfecționarea scafandrilor", "autoritate navală militară", "autoritate sanitară"], 1, "Art. 6 alin. (3)."], ["Structura de forțe a armatei se grupează în:", ["forțe terestre, aeriene și navale; forțe pentru sprijin de luptă; forțe pentru sprijin logistic; forțe pentru operații speciale; forțe pentru apărare cibernetică; alte forțe", "forțe NATO și forțe naționale", "forțe de pace și forțe de război", "forțe active și forțe de rezervă"], 0, "Art. 28 alin. (1)."], ["Dimensiunea structurii de forțe a armatei se stabilește prin:", ["hotărâre a consiliilor județene", "documentele de planificare a apărării", "ordin al comandantului de brigadă", "regulamentul de ordine interioară"], 1, "Art. 28 alin. (2)."], ["Forțele pentru sprijin logistic sunt reprezentate de:", ["Comandamentul Apărării Cibernetice", "Comandamentul Logistic Întrunit", "Comandamentul Forțelor pentru Operații Speciale", "Statul Major al Forțelor Terestre"], 1, "Art. 31 alin. (1)."], ["Forțele pentru apărare cibernetică includ:", ["Comandamentul Logistic Întrunit", "Comandamentul Apărării Cibernetice, mari unități, unități și alte structuri", "Statul Major al Forțelor Aeriene", "numai Serviciul de Telecomunicații Speciale"], 1, "Art. 33."], ["Categoriile de forțe cuprind, între altele:", ["serviciile publice comunitare", "prefecturile", "instituții militare de învățământ și unități de instrucție", "inspectoratele pentru situații de urgență"], 2, "Art. 29."], ["Misiunile și responsabilitățile structurii de forțe se stabilesc prin ordin al:", ["comandantului centrului militar județean", "prim-ministrului", "ministrului apărării naționale sau al șefului Statului Major al Apărării, când este împuternicit de ministru", "Președintelui României, exclusiv"], 2, "Art. 34."], ["În funcție de nivelul capacității de luptă, forțele armatei se organizează în:", ["6 categorii", "4 categorii", "3 categorii", "2 categorii"], 1, "Art. 35: gata de acțiune permanent; nivel ridicat; nivel redus; structuri constituite la mobilizare."], ["Forțele cu nivel redus al capacității de luptă devin gata de acțiune:", ["numai după aprobarea NATO", "imediat, fără completare", "numai în timp de pace", "după ridicarea capacității de luptă prin completare sau mobilizare"], 3, "Art. 35 lit. c)."], ["Structurile constituite la mobilizare sunt destinate:", ["misiunilor permanente NATO", "exclusiv instruirii rezerviștilor în timp de pace", "generării și regenerării forțelor și realizării sistemului de rezistență armată pe teritoriul național", "protecției civile"], 2, "Art. 35 lit. d)."], ["Care dintre următoarele NU este o atribuție a structurilor de poliție militară, potrivit art. 36?", ["paza și escortarea prizonierilor de război", "controlul și îndrumarea circulației coloanelor militare", "ordinea interioară și disciplina militară în obiectivele militare", "conducerea operațiilor speciale în străinătate"], 3, "Art. 36."], ["Atribuțiile, organizarea și funcționarea poliției militare se stabilesc prin:", ["regulament al unității", "lege specială", "hotărâre a Guvernului", "ordin al ministrului"], 1, "Art. 36 alin. (2)."], ["Forțele pentru operații speciale constituie:", ["componenta de protecție civilă", "componenta specializată, de reacție rapidă, la nivel strategic", "o structură a Ministerului Afacerilor Interne", "componenta de rezervă a armatei"], 1, "Art. 37 alin. (1)."], ["Care dintre următoarele NU este o misiune a forțelor pentru operații speciale, potrivit art. 37?", ["paza obiectivelor civile de interes local", "cercetare specială", "asistență militară", "acțiuni directe"], 0, "Art. 37: cercetare specială, acțiuni directe, asistență militară, acțiuni neconvenționale, misiuni complementare."], ["Conducerea forțelor pentru operații speciale se exercită de:", ["președintele CSAT, direct", "șeful Statului Major al Apărării, prin Comandamentul Forțelor pentru Operații Speciale", "comandantul Comandamentului Logistic Întrunit", "ministrul afacerilor interne"], 1, "Art. 37 alin. (2)."], ["Structurile de conducere și de forțe puse la dispoziția NATO:", ["nu pot participa la misiuni", "rămân exclusiv sub comanda primarilor", "se integrează în structura de comandă și control și în structura de forțe a NATO", "se desființează în timp de pace"], 2, "Art. 38."], ["Personalul Ministerului Apărării Naționale este format din:", ["personal militar și polițiști", "numai personal militar", "personal militar și personal civil", "personal militar și rezerviști voluntari, exclusiv"], 2, "Art. 43 alin. (1)."], ["Nomenclatorul funcțiilor de general din armată se aprobă de:", ["șeful Statului Major al Apărării", "ministrul apărării naționale", "Consiliul Suprem de Apărare a Țării", "Parlament"], 2, "Art. 43 alin. (2)."], ["Transformarea unei funcții de general într-o funcție civilă se aprobă de:", ["CSAT, la propunerea ministrului apărării naționale", "șeful Statului Major al Apărării", "comandantul categoriei de forțe", "Guvern, la propunerea Parlamentului"], 0, "Art. 43 alin. (3)."], ["Evidența efectivelor Direcției generale de informații a apărării se ține:", ["împreună cu cea a forțelor terestre", "separat de cea a ministerului", "la centrele militare județene", "de NATO"], 1, "Art. 44."], ["Care dintre următoarele categorii NU se include în necesarul de efective al MApN, potrivit art. 45?", ["soldații și gradații profesioniști aflați în instrucția de bază", "ofițerii din statele majore ale categoriilor de forțe", "subofițerii din unitățile de comunicații", "maiștrii militari din unitățile de mentenanță"], 0, "Art. 45 alin. (1) lit. c): militarii în termen și cu termen redus, soldații și gradații profesioniști în instrucția de bază, elevii și studenții."]]}, {"id": "L04", "t": "Legea 80/1995 – statutul cadrelor militare", "k": "L", "q": [["Potrivit Legii 80/1995, cadrele militare sunt:", ["cetățeni români cărora li s-a acordat, în condițiile legii, grad de ofițer, maistru militar sau subofițer", "persoanele angajate civil în MApN", "toți cetățenii români care au satisfăcut serviciul militar", "soldații și gradații profesioniști cu peste 5 ani vechime"], 0, "Art. 1."], ["Cadrele militare sunt grupate în următoarele corpuri:", ["generali, ofițeri și subofițeri", "ofițeri, subofițeri și soldați profesioniști", "ofițeri, subofițeri și personal civil", "ofițeri, maiștri militari și subofițeri"], 3, "Art. 2 alin. (1)."], ["În MApN, primul grad din corpul subofițerilor este:", ["sergent", "caporal", "fruntaș", "plutonier"], 0, "Art. 2 alin. (2¹) lit. A."], ["Care este ordinea crescătoare corectă a gradelor de subofițer în MApN?", ["sergent, sergent-major, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal", "caporal, sergent, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal", "sergent, plutonier, sergent-major, plutonier-major, plutonier adjutant, plutonier adjutant principal", "sergent, sergent-major, plutonier-major, plutonier, plutonier adjutant principal, plutonier adjutant"], 0, "Art. 2 alin. (2¹)."], ["Cel mai înalt grad din corpul subofițerilor în MApN este:", ["plutonier adjutant principal", "plutonier-major", "maistru militar principal", "plutonier adjutant"], 0, "Art. 2."], ["Gradele de maistru militar, în ordine crescătoare, sunt:", ["clasa I, a II-a, a III-a, a IV-a, a V-a, maistru militar principal", "clasa a III-a, a II-a, clasa I", "maistru militar, maistru militar principal, maistru militar șef", "clasa a V-a, a IV-a, a III-a, a II-a, clasa I, maistru militar principal"], 3, "Art. 2 alin. (2¹) lit. A¹."], ["Gradele de ofițer inferior sunt:", ["căpitan, maior, colonel", "locotenent, căpitan, maior", "sublocotenent, locotenent, locotenent-colonel", "sublocotenent (aspirant), locotenent, căpitan"], 3, "Art. 2."], ["Gradul de maior corespunde, în aviație și marină, gradului de:", ["căpitan-comandor", "comandor", "contraamiral", "locotenent-comandor"], 3, "Art. 2."], ["Gradul de colonel corespunde, în aviație și marină, gradului de:", ["locotenent-comandor", "comandor", "căpitan-comandor", "viceamiral"], 1, "Art. 2."], ["Gradul de general-maior are însemnul de:", ["patru stele", "două stele", "trei stele", "o stea"], 1, "Art. 2: general de brigadă (1), general-maior (2), general-locotenent (3), general (4)."], ["Gradul de mareșal se poate acorda:", ["în timp de război, pentru merite militare excepționale, de Președintele României, generalilor sau amiralilor cu 4 stele", "la ieșirea la pensie, generalilor cu peste 30 de ani vechime", "în timp de pace, de ministrul apărării, oricărui general", "de Parlament, la propunerea CSAT, în timp de pace"], 0, "Art. 2 alin. (3)."], ["Potrivit art. 3, gradul militar:", ["se pierde automat la trecerea în rezervă", "este un drept al titularului și se pierde numai în cazurile și condițiile prevăzute de lege", "este o funcție, nu un drept", "aparține MApN și poate fi retras oricând de comandant"], 1, "Art. 3."], ["Situațiile în care se pot afla cadrele militare sunt:", ["în activitate, în rezervă sau în retragere", "în activitate, în concediu sau în misiune", "în serviciu, în afara serviciului sau în retragere", "activ, pasiv sau mobilizat"], 0, "Art. 4."], ["Cadrul militar aflat în captivitate:", ["își pierde gradul", "își menține calitatea de cadru militar în activitate", "trece automat în rezervă", "trece automat în retragere"], 1, "Art. 4 lit. a)."], ["Pot fi cadre militare în activitate numai persoanele care au:", ["domiciliul în țară, indiferent de cetățenie", "cetățenia unui stat membru NATO", "cetățenia română și domiciliul în țară", "cetățenia română, indiferent de domiciliu"], 2, "Art. 4 lit. a)."], ["Cadrele militare sunt în retragere atunci când:", ["potrivit legii, nu mai pot fi chemate în serviciul militar", "sunt suspendate din funcție", "urmează un curs de carieră", "sunt în concediu fără plată"], 0, "Art. 4 lit. c)."], ["Ghidul carierei militare pentru MApN se aprobă prin:", ["lege organică", "decret prezidențial", "ordin al ministrului apărării", "hotărâre a Guvernului"], 3, "Art. 5."], ["În exercitarea atribuțiilor, ofițerii, maiștrii militari și subofițerii:", ["sunt învestiți cu exercițiul autorității publice și beneficiază de protecția legii penale", "au rang de demnitari ai statului", "au statut de funcționari publici civili", "au imunitate penală totală"], 0, "Art. 6 alin. (1)."], ["Potrivit art. 7, profesia militară implică:", ["scutirea de obligațiile constituționale", "numai drepturi suplimentare", "îndatoriri suplimentare și interzicerea sau restrângerea exercițiului unor drepturi și libertăți", "aceleași drepturi și îndatoriri ca orice salariat"], 2, "Art. 7."], ["Ce prevede art. 8 cu privire la ordinele contrare legii, obiceiurilor războiului și convențiilor internaționale?", ["se execută, iar răspunderea revine comandantului", "se execută după confirmarea scrisă a ordinului", "nu pot fi ordonate și nu este permisă executarea lor; neexecutarea nu atrage răspunderea penală sau civilă a subordonatului", "se execută numai în timp de război"], 2, "Art. 8 alin. (1) lit. b)."], ["Ordinele trebuie executate, potrivit art. 8:", ["după aprobarea scrisă a eșalonului superior", "întocmai și la timp", "numai dacă sunt date în scris", "numai în prezența unui martor"], 1, "Art. 8 alin. (1) lit. b)."], ["Păstrarea secretului militar, de stat și de serviciu este:", ["un drept al cadrelor militare", "obligatorie numai în timp de război", "o îndatorire principală a cadrelor militare", "o obligație numai a ofițerilor"], 2, "Art. 8 alin. (1) lit. f)."], ["Cadrele militare în activitate au, potrivit art. 8 alin. (2), obligația:", ["să participe la misiuni în afara teritoriului statului român", "să urmeze studii universitare", "să fie membre ale unui sindicat militar", "să locuiască în incinta unității"], 0, "Art. 8 alin. (2)."], ["Care dintre următoarele situații permite, la cerere, exceptarea de la participarea la misiuni în afara țării?", ["cadrul militar are peste 40 de ani", "cadrul militar urmează un curs de limbă străină", "cadrul militar formează o familie monoparentală", "cadrul militar a mai participat la o misiune"], 2, "Art. 8 alin. (3)."], ["Concediul fără plată acordat pentru a-și urma soțul/soția trimis(ă) în misiune permanentă în străinătate poate dura:", ["până la 1 an", "până la 4 ani", "până la 6 luni", "până la 2 ani"], 1, "Art. 14¹ alin. (1)."], ["Concediul fără plată pentru alte cazuri temeinic motivate poate dura:", ["până la 30 de zile", "până la 3 ani", "până la 4 ani", "până la 1 an"], 3, "Art. 14¹ alin. (2)."], ["Pe durata concediului fără plată, cadrul militar:", ["își păstrează toate drepturile bănești", "primește 50% din soldă", "este suspendat din funcție și nu beneficiază de drepturi din partea MApN, cu excepția folosirii locuinței de serviciu", "trece automat în rezervă"], 2, "Art. 14¹ alin. (5)."], ["Concediul anual plătit pentru formare profesională este de până la:", ["10 zile calendaristice", "30 de zile calendaristice", "5 zile lucrătoare", "15 zile lucrătoare"], 3, "Art. 14³. Nu se scade din concediul de odihnă."], ["Cadrele militare care urmează cursurile de zi ale unei instituții de învățământ superior beneficiază:", ["de concediu fără plată", "de concediu de odihnă dublu", "numai de permisii", "de vacanțe, în locul concediilor de odihnă"], 3, "Art. 16."], ["Pentru situații personale sau familiale deosebite, cadrele militare pot primi:", ["concediu de formare profesională", "permisii, cu durata și competențele stabilite prin regulamentele militare", "concediu de studii", "detașare"], 1, "Art. 17."], ["Timpul acordat pentru permisii, scutiri și concedii medicale:", ["nu se scade din concediul de odihnă", "se recuperează prin ore suplimentare", "se scade din concediul suplimentar", "se scade din concediul de odihnă"], 0, "Art. 18."], ["La declararea mobilizării sau a stării de război, concediile cadrelor militare:", ["continuă până la expirare", "se transformă în concedii fără plată", "se întrerup, iar cadrele militare se prezintă de îndată la unități", "se compensează în bani"], 2, "Art. 19."], ["Compensația lunară pentru chirie poate fi de până la:", ["25% din solda lunară", "100% din solda lunară", "10% din solda lunară", "50% din solda lunară"], 3, "Art. 20¹ alin. (1)."], ["Soțul/soția cadrului militar mutat în interesul serviciului, care și-a întrerupt activitatea din cauza mutării, primește o indemnizație lunară de 50% din solda cadrului militar, până la reîncadrare, dar cel mult:", ["9 luni", "12 luni", "6 luni", "3 luni"], 0, "Art. 20¹ alin. (4)."], ["La decesul unui cadru militar în activitate, familia primește un ajutor egal cu:", ["o soldă lunară", "două solde lunare", "șase solde lunare", "trei solde lunare"], 1, "Art. 23."], ["Dreptul de a purta uniforma militară după trecerea în rezervă sau retragere se poate acorda cadrelor cu cel puțin:", ["20 de ani de serviciu militar și distincții în activitate, sau celor care au adus servicii deosebite", "25 de ani de serviciu, exclusiv ofițerilor", "15 ani de serviciu, indiferent de distincții", "10 ani de serviciu militar"], 0, "Art. 27."], ["Potrivit art. 28, cadrelor militare în activitate le este interzis:", ["să se asocieze în organizații sportive", "să facă parte din partide politice, să candideze în alegeri și să declare sau să participe la grevă", "să adere la culte religioase", "să urmeze studii universitare civile"], 1, "Art. 28."], ["Cadrele militare în activitate pot candida pentru funcția de Președinte al României?", ["nu, le este interzis prin art. 28", "da, numai pentru Parlamentul European", "da, cu aprobarea ministrului", "da, după 10 ani de activitate"], 0, "Art. 28 lit. b)."], ["Exprimarea în public a opiniilor politice de către cadrele militare în activitate:", ["este permisă pe rețelele sociale", "nu este permisă", "este permisă în afara orelor de program", "este permisă numai în uniformă"], 1, "Art. 29 lit. a)."], ["Prezentarea în public a informațiilor cu caracter militar de către cadrele militare:", ["este permisă oricând", "este permisă cu acordul colegilor", "nu este permisă, cu excepția celor care au astfel de atribuții, potrivit ordinului ministrului", "este permisă numai după trecerea în rezervă"], 2, "Art. 29 lit. c)."], ["Asocierea cadrelor militare în activitate este permisă în organizații profesionale, culturale, sportive, cu excepția:", ["celor cu caracter sportiv", "celor caritabile", "celor cu caracter sindical sau care contravin unicității comenzii, ordinii și disciplinei", "celor tehnico-științifice"], 2, "Art. 29 lit. e)."], ["Participarea cadrelor militare în activitate la mitinguri sau demonstrații cu caracter politic sau sindical:", ["este permisă cu aprobarea comandantului", "este permisă în civil", "este permisă în zilele libere", "este interzisă, cu excepția activităților desfășurate în misiune"], 3, "Art. 29 lit. g)."], ["Deplasarea cadrelor militare în străinătate se face:", ["în condițiile stabilite prin ordin al ministrului apărării", "liber, fără nicio restricție", "numai cu aprobarea Parlamentului", "numai în misiune"], 0, "Art. 29 lit. h)."], ["Pe timpul stării de urgență, asediu, mobilizare și război, pentru cadrele militare:", ["se suspendă primirea în audiență și soluționarea petițiilor", "se suspendă jurământul militar", "se acordă concediu suplimentar", "se dublează solda"], 0, "Art. 29 lit. i)."], ["Potrivit art. 30, cadrelor militare în activitate le este interzis:", ["să dețină o locuință proprietate personală", "să fie membre în asociații sportive", "să urmeze cursuri postuniversitare", "să fie asociat unic sau să participe direct la administrarea ori conducerea unor societăți comerciale (cu excepțiile legale)"], 3, "Art. 30 alin. (2) lit. b)."], ["Cadrele în rezervă concentrate sau mobilizate:", ["pot desfășura activitate politică în unitate", "trebuie să demisioneze din partide", "pierd dreptul de vot", "pot rămâne membre ale partidelor și sindicatelor, dar nu pot desfășura activități politice sau sindicale în unități"], 3, "Art. 31."], ["Disciplina militară se bazează, potrivit art. 32, pe:", ["acceptarea conștientă a normelor, pe recompense și pe sancțiuni disciplinare", "exclusiv pe sancțiuni", "exclusiv pe recompense", "pe contractul colectiv de muncă"], 0, "Art. 32 alin. (1)."], ["Prerogativa disciplinară aparține:", ["instanței de judecată", "sindicatului", "comandantului sau șefului", "consiliului de onoare"], 2, "Art. 32 alin. (3)."], ["Care dintre următoarele este o recompensă prevăzută de art. 33?", ["diminuarea soldei de funcție", "înaintarea în gradul următor înainte de termen", "mustrarea scrisă", "retrogradarea în funcție"], 1, "Art. 33."], ["Încălcarea cu vinovăție de către cadrele militare a îndatoririlor de serviciu atrage răspunderea:", ["disciplinară, materială, civilă sau penală, după caz", "numai penală", "numai disciplinară", "numai materială"], 0, "Art. 34 alin. (1)."], ["Abaterea disciplinară este fapta săvârșită cu vinovăție prin care se încalcă legi, regulamente, ordine sau dispoziții ale comandanților:", ["numai dacă produce un prejudiciu material", "chiar dacă constituie infracțiune", "numai în timpul serviciului", "dacă nu constituie infracțiune"], 3, "Art. 34¹."], ["Care dintre următoarele NU este o sancțiune disciplinară prevăzută de art. 35 pentru cadrele militare?", ["trecerea în rezervă", "amânarea înaintării în gradul următor", "arestul la unitate", "avertismentul"], 2, "Art. 35 alin. (1)."], ["Amânarea înaintării în gradul următor, ca sancțiune disciplinară, se aplică pe o perioadă de:", ["3–5 ani", "3 luni", "6 luni", "1–2 ani"], 3, "Art. 35 alin. (1) lit. e)."], ["Pentru aceeași abatere disciplinară se aplică:", ["cel mult două sancțiuni", "o sancțiune pentru fiecare zi de abatere", "sancțiuni cumulate, la decizia comandantului", "o singură sancțiune"], 3, "Art. 35 alin. (2)."], ["Sancțiunea disciplinară se aplică în termen de cel mult ... de la constatarea abaterii, dar nu mai târziu de ... de la săvârșirea ei.", ["6 luni; 2 ani", "1 an; 3 ani", "3 luni; 1 an", "30 de zile; 6 luni"], 0, "Art. 35 alin. (3)."], ["Degradarea militară se aplică:", ["automat, la orice condamnare penală", "militarilor în activitate, în rezervă sau în retragere condamnați prin hotărâre judecătorească la pedeapsa complementară a degradării militare", "prin decizia consiliului de onoare", "numai militarilor în activitate, prin ordin al comandantului"], 1, "Art. 69."], ["Sunt scoși din evidența militară ofițerii, maiștrii militari și subofițerii care:", ["au trecut în retragere", "au fost sancționați cu mustrare scrisă", "au împlinit 60 de ani", "au renunțat (cu aprobare) la cetățenia română sau au dobândit altă cetățenie și și-au stabilit domiciliul în străinătate"], 3, "Art. 70."], ["Scoaterea din evidența militară a generalilor se face prin:", ["ordin al șefului Statului Major General (în prezent Statul Major al Apărării)", "ordin al comandantului centrului militar județean", "hotărâre a Guvernului", "decret al Președintelui"], 0, "Art. 71 lit. a)."], ["Cei degradați care au beneficiat de amnistie, grațiere sau reabilitare sunt reluați în evidența militară și li se poate acorda:", ["numai gradul avut anterior, obligatoriu", "orice grad militar, până la cel avut anterior, inclusiv", "numai gradul de soldat", "un grad superior celui avut anterior"], 1, "Art. 72 alin. (2)."], ["Restituirea gradului în urma amnistiei, grațierii sau reabilitării:", ["implică automat rechemarea în activitate", "nu implică de drept rechemarea în activitate", "se face numai prin hotărâre a Guvernului", "implică plata soldei pe perioada degradării"], 1, "Art. 72 alin. (5)."], ["Dacă printr-o nouă hotărâre judecătorească se dispune achitarea sau se înlătură pedeapsa degradării militare:", ["sunt reluați în evidență numai după 5 ani", "cei în cauză sunt reluați în evidență cu gradul avut, iar perioada se ia în calcul la stagiul în grad", "sunt reluați în evidență cu gradul de soldat", "nu mai pot fi reluați în evidență"], 1, "Art. 72 alin. (1)."]]}, {"id": "L05", "t": "Legea 121/2011 – misiuni în afara țării", "k": "L", "q": [["Legea 121/2011 reglementează:", ["protecția informațiilor clasificate", "regimul armelor și munițiilor deținute de MApN", "participarea forțelor armate la misiuni și operații în afara teritoriului statului român", "statutul cadrelor militare"], 2, "Art. 1."], ["Potrivit Legii 121/2011, forțele armate participă la misiuni și operații de:", ["poliție, jandarmerie și protecție civilă", "numai asistență umanitară", "apărare colectivă, ocupație și administrare a teritoriilor", "apărare colectivă, răspuns la crize, pace și asistență umanitară"], 3, "Art. 2 alin. (1)."], ["Misiunile și operațiile prevăzute de Legea 121/2011 se pot desfășura:", ["sub mandat ONU sau OSCE, sub conducerea NATO sau UE, ori în coaliții", "numai sub mandat ONU", "numai în cadrul NATO", "numai sub comandă națională"], 0, "Art. 2 alin. (2)."], ["Misiunile de asistență umanitară se pot desfășura și:", ["numai în timp de război", "la solicitarea statului afectat", "fără acordul statului afectat", "numai la solicitarea unei organizații neguvernamentale"], 1, "Art. 2 alin. (3)."], ["Pentru pregătire, forțele armate pot participa, în țară sau în străinătate, la:", ["exerciții, antrenamente și ceremoniale", "alegeri", "misiuni de poliție locală", "activități comerciale"], 0, "Art. 3 alin. (3)."], ["Structurile care participă la misiuni în afara teritoriului se încadrează, de regulă, cu:", ["personal civil contractual, exclusiv", "rezerviști fără pregătire", "personal profesionalizat", "militari în termen"], 2, "Art. 14 alin. (1)."], ["Selecționarea personalului și durata participării la misiuni se stabilesc prin:", ["decret prezidențial", "hotărâre a CSAT, pentru fiecare militar", "hotărâre a Parlamentului", "ordin al ministrului apărării naționale"], 3, "Art. 14 alin. (2)."], ["Dacă MApN nu are specialiștii necesari pentru o misiune, pot fi selecționați:", ["persoane fără cetățenie română", "elevi ai liceelor militare", "rezerviști voluntari sau salariați civili", "militari ai altor state, exclusiv"], 2, "Art. 15 alin. (2)."], ["Pe durata pregătirii și a participării la misiune, contractele individuale de muncă sau raporturile de serviciu ale personalului civil și ale rezerviștilor:", ["se suspendă", "încetează", "se prelungesc automat cu durata misiunii", "se transformă în contracte pe durată determinată"], 0, "Art. 15 alin. (3)."], ["Personalul care participă la misiuni în afara teritoriului beneficiază de un concediu de odihnă suplimentar de:", ["1 zi pentru fiecare lună", "2,5 zile pentru fiecare lună de prezență în zona de operații", "5 zile pentru fiecare lună", "10 zile pe misiune, indiferent de durată"], 1, "Art. 16 alin. (1) lit. a)."], ["Personalul aflat în misiune are dreptul la decontarea transportului pentru o călătorie în țară și retur:", ["lunar", "o dată pe an", "la fiecare 6 luni", "la fiecare 3 luni"], 2, "Art. 16 alin. (1) lit. c)."], ["Pe perioada participării la misiuni, soldele/salariile lunare brute ale personalului:", ["nu pot fi diminuate", "se plătesc de organizația internațională", "se reduc cu 50%", "se suspendă"], 0, "Art. 16 alin. (3)."], ["Pentru merite deosebite, curaj, eroism și devotament în misiuni, personalului i se pot acorda:", ["locuințe gratuite în proprietate", "decorații, potrivit legii", "grade de general", "scutire de impozit pe viață"], 1, "Art. 17."], ["Soțul/soția și rudele de gradul I pot vizita personalul spitalizat în străinătate:", ["câte 5 zile, după internare și la fiecare lună de spitalizare, pe cheltuiala MApN", "o singură dată, 10 zile, pe cheltuiala proprie", "nelimitat, pe cheltuiala spitalului", "câte 3 zile, la fiecare 3 luni"], 0, "Art. 18 alin. (4)."], ["Cheltuielile de spitalizare pentru personalul evacuat medical în străinătate sunt suportate de:", ["Casa Națională de Asigurări de Sănătate", "militarul în cauză", "Ministerul Apărării Naționale", "statul pe teritoriul căruia se află spitalul"], 2, "Art. 18 alin. (3)."]]}, {"id": "L06", "t": "Legea 122/2011 – regimul armelor, uzul de armă", "k": "L", "q": [["Potrivit Legii 122/2011, „uzul de armă” reprezintă:", ["tragerea cu armamentul din dotare în scopul îndeplinirii misiunii", "instruirea în poligon", "scoaterea armei din toc în prezența unei persoane", "portul armei în timpul serviciului"], 0, "Art. 3 lit. l)."], ["„Consemnul” reprezintă, potrivit Legii 122/2011:", ["totalitatea obligațiilor generale și specifice ale personalului aflat în misiune", "parola de recunoaștere", "lista persoanelor care au acces în unitate", "ordinul de zi pe unitate"], 0, "Art. 3 lit. b)."], ["Forța minimă reprezintă:", ["numai folosirea mijloacelor neletale", "forța folosită numai după 3 somații", "forța care nu poate cauza niciodată rănirea", "forța strict necesară, ca grad, intensitate și durată, pentru îndeplinirea misiunii"], 3, "Art. 3 lit. d)."], ["Forța letală este forța:", ["folosită numai de forțele speciale", "a cărei folosire poate cauza decesul persoanei sau o rănire gravă cu același efect", "folosită numai împotriva vehiculelor", "folosită exclusiv în timp de război"], 1, "Art. 3 lit. e)."], ["Intenția ostilă reprezintă:", ["refuzul de a prezenta actul de identitate", "amenințarea iminentă cu folosirea forței împotriva statului, armatei, persoanelor sau bunurilor desemnate", "orice declarație politică împotriva armatei", "fotografierea unui obiectiv militar"], 1, "Art. 3 lit. g)."], ["În misiunile individuale, intenția ostilă se stabilește de:", ["procuror", "Parlament", "ministrul apărării", "executant"], 3, "Art. 3 lit. g)."], ["Regulile de angajare sunt:", ["regulile de angajare a personalului civil în MApN", "reglementările care stabilesc circumstanțele, condițiile, gradul și modul în care se pot folosi armamentul și dispozitivele militare", "contractele soldaților profesioniști", "regulile de încadrare în funcții"], 1, "Art. 3 lit. k)."], ["Zona militară restricționată este:", ["zona de frontieră a statului", "o zonă terestră, aeriană, maritimă sau fluvială sub controlul forțelor naționale ori aliate, în care accesul și circulația persoanelor și tehnicii străine de acestea sunt limitate", "zona dintr-o unitate unde se servește masa", "orice teren deținut de MApN, inclusiv locuințele de serviciu"], 1, "Art. 3 lit. m)."], ["Potrivit Legii 122/2011, echipamentul radioelectric este:", ["un dispozitiv de bruiaj exclusiv militar", "un aparat sau o instalație care funcționează cu ajutorul undelor radio", "orice dispozitiv conectat la rețeaua electrică", "orice aparat cu baterie"], 1, "Art. 3 lit. c²)."], ["Persoanele desemnate sunt:", ["militarii aflați în concediu", "persoanele stabilite prin consemn sau ordin de misiune, a căror protecție permite folosirea forței, inclusiv a celei letale", "persoanele trecute pe lista de vizitatori", "toți civilii aflați în apropierea unității"], 1, "Art. 3 lit. i)."], ["Principiile care stau la baza uzului de armă sunt:", ["descurajarea, intimidarea și pedepsirea", "legalitatea, proporționalitatea, gradualitatea, utilizarea limitată și evitarea surprinderii", "secretul, viteza și precizia", "rapiditatea, surprinderea și eficiența maximă"], 1, "Art. 14."], ["Armele de foc se folosesc:", ["numai la ordinul procurorului", "ca primă soluție, pentru descurajare", "numai în timp de război", "ca ultimă soluție, numai când mijloacele neletale nu pot fi folosite"], 3, "Art. 14 alin. (2)."], ["Care dintre următoarele este un caz legal de uz de armă potrivit art. 15?", ["împotriva celor care încearcă să intre sau să iasă ilegal din obiective militare ori zone militare restricționate delimitate public", "împotriva celor care fotografiază unitatea de pe drumul public", "împotriva celor care insultă santinela", "împotriva celor care refuză să-și spună numele în afara unității"], 0, "Art. 15 alin. (1) lit. c)."], ["Se poate face uz de armă pentru a împiedica:", ["plecarea unui vizitator fără să semneze registrul", "intrarea unui militar întârziat în unitate", "fuga de sub escortă sau evadarea persoanelor aflate legal în detenție ori reținere", "părăsirea postului de către un coleg"], 2, "Art. 15 alin. (1) lit. e)."], ["Potrivit art. 15, se poate face uz de armă împotriva dronelor:", ["numai dacă sunt militare", "folosite pentru comiterea unui act ostil", "în orice situație, fără condiții", "care zboară la peste 10 km de unitate"], 1, "Art. 15 alin. (1) lit. h)."], ["Ordinea corectă a somației legale este:", ["foc de avertisment – „Stai!” – „Stai, că trag!”", "„Mâinile sus!” – „Stai!” – foc de avertisment orizontal", "„Stai!” – „Stai, că trag!” – foc de avertisment în plan vertical", "„Stai, că trag!” – „Stai!” – foc în picioare"], 2, "Art. 16."], ["Focul de avertisment se trage:", ["spre vehicul", "în plan orizontal, deasupra capului", "în plan vertical", "în pământ, în fața persoanei"], 2, "Art. 16."], ["Somația este obligatorie înainte de uzul de armă în cazurile în care persoanele:", ["atacă persoanele desemnate", "acționează în cadrul unui atac terorist", "atacă personalul de pază", "încearcă să intre sau să iasă ilegal din obiectivul militar, încearcă să evadeze sau împiedică militarii să execute misiuni de luptă"], 3, "Art. 16 alin. (1): cazurile c), e), f)."], ["În cazul unui atac asupra personalului de pază, se poate face uz de armă fără somație:", ["niciodată", "numai cu aprobarea ofițerului de serviciu", "întotdeauna, fără nicio condiție", "dacă nu există timpul necesar pentru somație"], 3, "Art. 16 alin. (4)."], ["Împotriva celor care împiedică militarii să execute misiuni de luptă, uzul de armă este permis numai după:", ["două focuri de avertisment", "aprobarea scrisă a procurorului", "o somație rostită de trei ori consecutiv: „Părăsiți …, vom folosi arme de foc!”", "o singură somație „Stai!”"], 2, "Art. 17."], ["Împotriva autovehiculelor, focul se trage, pe cât posibil:", ["în rezervorul de combustibil", "în parbriz", "în conducătorul auto", "în pneuri, până la oprirea acestora"], 3, "Art. 16 alin. (5)."], ["La uzul de armă, se trage astfel încât să se:", ["neutralizeze definitiv persoana", "tragă la cap, pentru eficiență", "tragă numai în aer", "imobilizeze persoana, de regulă prin tragerea la picioare"], 3, "Art. 18."], ["Focul încetează:", ["imediat ce scopul urmărit a fost atins", "după golirea încărcătorului", "numai la ordinul comandantului", "după 3 focuri"], 0, "Art. 18."], ["Uzul de armă este interzis împotriva:", ["bărbaților cu vârsta peste 60 de ani, în orice situație", "persoanelor care nu vorbesc limba română", "copiilor și femeilor cu semne vizibile de sarcină, cu excepția cazului în care aceștia comit un atac armat", "militarilor străini"], 2, "Art. 20."], ["Uzul de armă este interzis și atunci când:", ["ar pune în pericol viața altor persoane sau s-ar încălca teritoriul, spațiul aerian ori apele unui stat vecin", "persoana fuge", "persoana este înarmată", "este noapte"], 0, "Art. 20."], ["După uzul de armă, militarul care a tras:", ["nu are obligația să raporteze", "raportează în maximum 7 zile", "raportează de îndată pe cale ierarhică", "raportează numai dacă a rănit pe cineva"], 2, "Art. 23."], ["Dacă în urma uzului de armă s-a produs moartea sau vătămarea unei persoane, comandantul unității:", ["anunță primăria", "anunță de îndată procurorul competent", "anunță familia, în 48 de ore", "întocmește doar un raport intern"], 1, "Art. 23."], ["Uzul de armă făcut în condițiile Legii 122/2011:", ["atrage automat sancțiunea disciplinară", "este întotdeauna infracțiune", "înlătură caracterul penal al faptei", "trebuie aprobat ulterior de Parlament"], 2, "Art. 23."], ["În operațiile din afara teritoriului, regulile de angajare se transmit spre analiză:", ["Ministerului Afacerilor Externe", "comandantului de pluton", "Parlamentului", "autorității naționale militare (Statul Major al Apărării)"], 3, "Art. 25."], ["Autoritatea națională militară poate formula, față de regulile de angajare contrare legislației naționale:", ["un veto verbal", "amenzi", "un ordin de retragere a NATO", "restricții (rezerve) naționale, în scris"], 3, "Art. 25 alin. (3)."], ["Regulile de angajare aprobate:", ["sunt obligatorii și nu limitează dreptul inerent la autoapărare", "sunt facultative", "interzic autoapărarea", "se aplică numai ofițerilor"], 0, "Art. 26."], ["Personalul care acționează în limitele mandatului și ale regulilor de angajare aprobate:", ["răspunde penal în orice situație", "răspunde civil, dar nu penal", "răspunde disciplinar automat", "nu răspunde pentru folosirea forței"], 3, "Art. 29."], ["Potrivit Legii 122/2011, dispozitivele militare includ și sisteme care emit:", ["numai gaze lacrimogene", "semnale de radiodifuziune comercială", "numai proiectile cinetice", "semnale de bruiaj, energie dirijată, microunde de mare putere sau laser"], 3, "Art. 3 lit. c)."], ["Potrivit art. 19, se va evita, pe cât posibil, uzul de armă împotriva:", ["dronelor", "minorilor, femeilor și bătrânilor", "militarilor străini", "vehiculelor"], 1, "Art. 19."]]}, {"id": "L07", "t": "Legea 182/2002 – informațiile clasificate", "k": "L", "q": [["Potrivit Legii 182/2002, clasele de secretizare sunt:", ["secrete de stat și secrete de serviciu", "secret, strict secret și strict secret de importanță deosebită", "secrete militare și secrete civile", "confidențial, secret și top secret"], 0, "Art. 15 lit. c)."], ["Nivelurile de secretizare atribuite informațiilor secrete de stat sunt:", ["strict secret de importanță deosebită, strict secret și secret", "confidențial, secret și strict secret", "nesecret, secret și strict secret", "secret de serviciu, secret și strict secret"], 0, "Art. 15 lit. f) și art. 18."], ["Informațiile a căror divulgare neautorizată este de natură să producă daune de o gravitate excepțională securității naționale se clasifică:", ["secret", "strict secret", "strict secret de importanță deosebită", "secret de serviciu"], 2, "Art. 15 lit. f)."], ["Informațiile a căror divulgare neautorizată este de natură să producă daune grave securității naționale se clasifică:", ["strict secret de importanță deosebită", "strict secret", "secret de serviciu", "secret"], 1, "Art. 15 lit. f)."], ["Informațiile a căror divulgare poate prejudicia o persoană juridică de drept public sau privat sunt:", ["informații strict secrete", "informații secrete de stat de nivel secret", "informații secrete de serviciu", "informații de interes public"], 2, "Art. 15 lit. e)."], ["Potrivit art. 15, noțiunea de „informații” cuprinde:", ["numai documentele scrise pe hârtie", "numai documentele cu ștampilă", "orice documente, date, obiecte sau activități, indiferent de suport, formă, mod de exprimare sau de punere în circulație", "numai datele stocate electronic"], 2, "Art. 15 lit. a)."], ["Certificatul de securitate este documentul care atestă:", ["nivelul de pregătire militară", "verificarea și acreditarea persoanei de a deține, de a avea acces și de a lucra cu informații clasificate", "calificarea profesională în comunicații", "dreptul de a purta armă"], 1, "Art. 15 lit. k)."], ["Care dintre următoarele NU este o formă de protecție a informațiilor clasificate potrivit art. 9?", ["protecția fizică", "protecția personalului", "protecția juridică", "protecția comercială"], 3, "Art. 9: juridică, procedurală, fizică, a personalului, a surselor."], ["Coordonarea la nivel național a programelor de protecție a informațiilor clasificate este asigurată de:", ["Ministerul Apărării Naționale", "Consiliul Suprem de Apărare a Țării", "Parlament", "Ministerul Afacerilor Interne"], 1, "Art. 14."], ["Standardele naționale de protecție a informațiilor clasificate se stabilesc de:", ["fiecare unitate militară", "Serviciul Român de Informații, cu acordul Autorității Naționale de Securitate", "Ministerul Apărării Naționale, singur", "Guvern, cu avizul Parlamentului"], 1, "Art. 6 alin. (1)."], ["Dacă normele interne privind protecția informațiilor clasificate contravin normelor NATO:", ["se aplică reglementările NATO", "se aplică normele interne", "decide instanța de contencios", "se aplică norma mai favorabilă cetățeanului"], 0, "Art. 6 alin. (3)."], ["Potrivit art. 4, unul dintre obiectivele protecției informațiilor clasificate este:", ["facilitarea accesului presei la documentele militare", "publicarea listelor de secrete de stat", "promovarea imaginii instituțiilor", "asigurarea securității sistemelor informatice și de transmitere a informațiilor clasificate"], 3, "Art. 4 lit. b)."], ["Reverificarea autorizațiilor de acces este obligatorie și se face cu prioritate atunci când:", ["persoana își schimbă domiciliul în același oraș", "există indicii că autorizația nu mai este compatibilă cu interesele de securitate", "persoana este avansată în grad", "persoana pleacă în concediu de odihnă"], 1, "Art. 10 alin. (3)."], ["Potrivit art. 17, constituie secrete de stat informațiile care reprezintă:", ["numărul de telefon al centralei publice a ministerului", "programul de lucru public al unității", "denumirea unităților militare publicată oficial", "datele, schemele și programele referitoare la sistemele de comunicații și la rețelele de calculatoare speciale și militare, inclusiv mecanismele de protecție"], 3, "Art. 17 lit. e)."], ["Cifrul de stat și alte elemente criptologice stabilite de autoritățile competente reprezintă:", ["informații secrete de serviciu", "informații de interes public", "informații secrete de stat", "informații neclasificate"], 2, "Art. 17 lit. c)."], ["Nivelul „strict secret de importanță deosebită” poate fi atribuit, între alții, de:", ["comandanți de batalion", "prim-ministru și miniștri", "subsecretari de stat", "directori de direcție din ministere"], 1, "Art. 19 lit. a)."], ["Contestarea clasificării informațiilor, a duratei sau a nivelului de secretizare se face la:", ["ORNISS", "Curtea Constituțională", "autoritatea care a clasificat informația, iar soluționarea se face potrivit legii contenciosului administrativ", "Ministerul Justiției"], 2, "Art. 20."], ["Oficiul Registrului Național al Informațiilor Secrete de Stat (ORNISS) este organizat:", ["în cadrul SRI", "în subordinea Parlamentului", "în subordinea MApN", "în subordinea Guvernului"], 3, "Art. 21 alin. (1)."], ["Listele cuprinzând informațiile secrete de stat pe niveluri de secretizare se aprobă și se actualizează prin:", ["decizie a ORNISS", "lege organică", "hotărâre a Guvernului", "ordin al ministrului apărării"], 2, "Art. 22 alin. (2)."], ["Potrivit art. 24, nivelul de secretizare se înscrie:", ["numai pe coperta dosarului", "numai pe prima pagină", "pe fiecare pagină a documentului", "numai în registrul de evidență"], 2, "Art. 24 alin. (1)."], ["Este interzisă clasificarea ca secrete de stat a informațiilor în scopul:", ["protecției cifrului de stat", "protecției planurilor militare", "protecției sistemelor de comunicații militare", "ascunderii încălcărilor legii sau a erorilor administrative"], 3, "Art. 24 alin. (5)."], ["Persoanele autorizate care copiază, extrag sau rezumă conținutul unor documente secrete:", ["au obligația de a aplica pe noul document mențiunile aflate pe documentul original", "trebuie să declasifice documentul", "pot reduce nivelul de secretizare", "pot elimina mențiunile de clasificare"], 0, "Art. 24 alin. (9)."], ["Coordonarea generală și controlul măsurilor de protecție a secretelor de stat se realizează de:", ["Ministerul Afacerilor Externe", "Serviciul Român de Informații, printr-o unitate specializată", "Statul Major al Apărării", "Curtea de Conturi"], 1, "Art. 25 alin. (1)."], ["Coordonarea și controlul protecției secretelor de stat pentru atașații militari și reprezentanții militari la organismele internaționale revin:", ["Ministerului Afacerilor Externe", "structurii specializate a Ministerului Apărării Naționale", "ORNISS", "SIE"], 1, "Art. 26 alin. (2)."], ["Protecția informațiilor clasificate NATO este reglementată, autorizată și controlată de:", ["Ministerul Apărării Naționale", "Comandamentul NATO de la Bruxelles", "Autoritatea Națională de Securitate (ANS)", "STS"], 2, "Art. 27."], ["Accesul la informațiile secrete de stat este permis:", ["pe baza unei cereri verbale aprobate de șeful direct", "oricărei persoane cu cazier curat", "numai pe baza unei autorizații scrise, emise de conducătorul persoanei juridice care deține informațiile, după notificarea prealabilă a ORNISS", "pe baza gradului militar"], 2, "Art. 28 alin. (1)."], ["Autorizația de acces la informații secrete de stat este valabilă:", ["cel mult 1 an", "pe durată nedeterminată", "cel mult 10 ani", "cel mult 4 ani"], 3, "Art. 28 alin. (4)."], ["Refuzul eliberării autorizației sau retragerea motivată a acesteia determină:", ["trecerea în rezervă", "suspendarea din funcție pe 30 de zile", "automat interdicția de acces la informațiile secrete de stat", "obligația de a plăti o amendă"], 2, "Art. 28 alin. (5)."], ["Informațiile secrete de serviciu se stabilesc de:", ["Parlament", "ANS", "ORNISS", "conducătorul persoanei juridice, pe baza normelor prevăzute prin hotărâre a Guvernului"], 3, "Art. 31 alin. (1)."], ["Neglijența în păstrarea informațiilor secrete de serviciu atrage:", ["doar răspunderea civilă", "numai avertisment", "răspunderea penală a persoanelor vinovate, potrivit legii", "nicio răspundere"], 2, "Art. 31 alin. (4)."], ["Este interzisă clasificarea ca secrete de serviciu a informațiilor care:", ["privesc structura internă a unei unități militare", "sunt destinate să asigure informarea cetățenilor asupra unor probleme de interes public sau personal", "privesc programul de pază al unității", "privesc datele personale ale angajaților"], 1, "Art. 33."], ["Obligația persoanelor de a proteja informațiile clasificate care le-au fost încredințate:", ["încetează la data încetării raporturilor de muncă", "continuă și după încetarea raporturilor de muncă sau de serviciu, pe toată perioada menținerii clasificării", "durează 1 an după încetarea raporturilor de muncă", "încetează la trecerea în rezervă"], 1, "Art. 36 alin. (2)."], ["Înainte de ocuparea unui post care presupune acces la informații clasificate, persoana:", ["depune o garanție bănească", "trece un examen la ORNISS", "semnează un contract cu SRI", "dă un angajament scris de confidențialitate"], 3, "Art. 36 alin. (3)."], ["Răspunderea pentru protecția informațiilor clasificate revine:", ["conducătorului autorității sau persoanei juridice deținătoare", "fiecărui cetățean", "exclusiv ORNISS", "exclusiv SRI"], 0, "Art. 37 alin. (2)."], ["Transmiterea informațiilor secrete de stat prin cablu sau eter:", ["este interzisă fără folosirea cifrului de stat sau a altor elemente criptologice stabilite de autoritățile competente", "este permisă pe frecvențe VHF", "este permisă în timp de război", "este permisă dacă rețeaua este militară"], 0, "Art. 38 alin. (2)."], ["Persoanele din armată vinovate de divulgarea intenționată a secretelor de stat sau de neglijență care a facilitat divulgarea:", ["sunt mutate în altă unitate", "pierd 10% din soldă pe 3 luni", "primesc avertisment", "își pierd irevocabil calitatea pe care o au"], 3, "Art. 39 alin. (2)."], ["Încălcarea normelor privind protecția informațiilor clasificate atrage răspunderea:", ["exclusiv civilă", "disciplinară, contravențională, civilă sau penală, după caz", "exclusiv disciplinară", "exclusiv penală"], 1, "Art. 39 alin. (1)."], ["Contravențiile la normele privind protecția informațiilor clasificate se stabilesc prin:", ["ordin al ministrului apărării", "decizie a CSAT", "regulament al SRI", "hotărâre a Guvernului"], 3, "Art. 40 alin. (1)."], ["Sancțiunile contravenționale privind informațiile clasificate se pot aplica:", ["numai funcționarilor publici", "numai persoanelor fizice", "și persoanelor juridice", "numai militarilor"], 2, "Art. 40 alin. (2)."]]}, {"id": "L08", "t": "HG 585/2002 – standardele de protecție", "k": "L", "q": [["Potrivit HG 585/2002, nivelului „strict secret de importanță deosebită” îi corespunde nivelul NATO:", ["NATO TOP SECRET", "NATO SECRET", "NATO CONFIDENTIAL", "NATO RESTRICTED"], 0, "Art. 2."], ["Nivelului național „strict secret” îi corespunde nivelul NATO:", ["NATO SECRET", "NATO RESTRICTED", "NATO TOP SECRET", "NATO CONFIDENTIAL"], 0, "Art. 2."], ["Nivelului național „secret” îi corespunde nivelul NATO:", ["NATO SECRET", "NATO TOP SECR
