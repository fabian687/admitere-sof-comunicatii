ET", "NATO CONFIDENTIAL", "NATO RESTRICTED"], 2, "Art. 2 – atenție, nu „NATO SECRET”."], ["Informațiilor „secret de serviciu” le corespunde nivelul NATO:", ["NATO RESTRICTED", "NATO SECRET", "NATO UNCLASSIFIED", "NATO CONFIDENTIAL"], 0, "Art. 2."], ["Standardele naționale de protecție a informațiilor clasificate sunt obligatorii pentru:", ["numai persoanele cu grad de ofițer", "orice persoană fizică sau juridică ce gestionează informații clasificate", "numai instituțiile militare", "numai SRI"], 1, "Art. 2."], ["Care dintre următoarele NU este Autoritate Desemnată de Securitate (ADS) potrivit HG 585/2002?", ["Serviciul de Protecție și Pază", "Serviciul de Telecomunicații Speciale", "Ministerul Educației", "Ministerul Apărării Naționale"], 2, "Art. 3: MApN, MAI, MJ, SRI, SIE, SPP, STS."], ["Principiul „necesității de a cunoaște” înseamnă că:", ["informațiile se fac publice la cerere", "accesul la informații clasificate se acordă numai persoanelor care au nevoie de ele pentru îndeplinirea atribuțiilor de serviciu", "comandantul cunoaște toate informațiile din unitate", "orice persoană cu certificat are acces la orice informație de nivelul respectiv"], 1, "Art. 3 și art. 33."], ["Ghidul de clasificare a informațiilor se aprobă:", ["de șeful compartimentului de documente clasificate", "prin hotărâre a Guvernului", "personal și în scris de împuterniciții sau funcționarii superiori abilitați să atribuie niveluri de secretizare", "de ORNISS"], 2, "Art. 5."], ["Listele informațiilor secrete de serviciu se stabilesc de:", ["ORNISS", "Guvern", "SRI", "conducătorii unităților deținătoare"], 3, "Art. 7."], ["Verificarea corectitudinii clasificării unei informații se face, potrivit art. 11, de:", ["destinatarul documentului", "instanța de contencios", "ORNISS", "șeful ierarhic al emitentului"], 3, "Art. 11."], ["Termenul maxim de clasificare pentru informațiile „strict secret de importanță deosebită” este de până la:", ["75 de ani", "50 de ani", "30 de ani", "100 de ani"], 3, "Art. 12."], ["Termenul maxim de clasificare pentru informațiile „strict secret” este de până la:", ["25 de ani", "100 de ani", "30 de ani", "50 de ani"], 3, "Art. 12."], ["Termenul maxim de clasificare pentru informațiile „secret” este de până la:", ["10 ani", "30 de ani", "50 de ani", "100 de ani"], 1, "Art. 12."], ["Termenele de clasificare pot fi prelungite prin:", ["lege organică", "decizie a emitentului, fără alte formalități", "ordin al ministrului apărării", "hotărâre a Guvernului"], 3, "Art. 12."], ["Un document realizat din extrase cumulate cu niveluri diferite de secretizare primește:", ["nivelul „secret de serviciu”", "automat nivelul „strict secret de importanță deosebită”", "cel mai mic nivel dintre extrase", "nivelul de secretizare al extrasului cu cea mai înaltă clasificare"], 3, "Art. 14."], ["Supraevaluarea sau subevaluarea clasificării unei informații poate fi contestată de:", ["orice persoană fizică sau juridică română, în contencios administrativ", "numai de ORNISS", "numai de SRI", "numai de emitent"], 0, "Art. 17."], ["Informațiile secrete de stat se declasifică prin:", ["expirarea a 5 ani de la emitere", "hotărâre a Guvernului, la solicitarea motivată a emitentului", "ordin al ministrului", "decizia oricărui deținător"], 1, "Art. 19."], ["Care dintre următoarele NU este un caz de declasificare prevăzut de art. 20?", ["termenul de clasificare a expirat", "divulgarea informației nu mai poate prejudicia siguranța națională", "informația a fost clasificată de o persoană neîmputernicită", "informația a fost copiată de mai multe ori"], 3, "Art. 20."], ["La schimbarea nivelului de secretizare, vechea inscripție:", ["se acoperă cu o etichetă opacă", "se taie cu o linie oblică, iar noua clasă și data se scriu deasupra sau dedesubtul ei", "rămâne neschimbată, iar noul nivel se trece doar în registru", "se șterge cu corector"], 1, "Art. 22."], ["Informațiile clasificate compromise sau pierdute se declasifică:", ["după 30 de zile de la pierdere", "numai după o cercetare care confirmă compromiterea sau pierderea, cu acordul scris al emitentului", "automat, la constatarea pierderii", "la cererea oricărui angajat"], 1, "Art. 23."], ["Accesul la informații clasificate se acordă numai persoanelor care:", ["sunt rude cu emitentul", "dețin certificat de securitate sau autorizație de acces valabilă pentru nivelul respectiv și au nevoie de informații pentru îndeplinirea atribuțiilor", "au grad de ofițer", "au peste 5 ani vechime în instituție"], 1, "Art. 33."], ["Persoanele care au acces la informații „strict secret de importanță deosebită” sunt consemnate în:", ["carnetul de muncă", "condica de serviciu", "registrul de intrări-ieșiri al unității", "fișa de consultare"], 3, "Art. 34."], ["În situații de criză, calamități sau evenimente neprevăzute, conducătorul unității poate acorda acces temporar la informații clasificate unor persoane fără certificat, cu condiția ca acestea să semneze:", ["un proces-verbal de distrugere", "un contract de muncă pe durată determinată", "angajamentul de confidențialitate, iar ORNISS să fie anunțat cât mai curând", "o declarație de avere"], 2, "Art. 36."], ["Numărul de înregistrare al unui document „strict secret de importanță deosebită” este precedat de:", ["litera S", "un zero (0)", "două zerouri (00)", "trei zerouri (000)"], 3, "Prefixele: 0 – secret; 00 – strict secret; 000 – SSID; S – secret de serviciu."], ["Numărul de înregistrare al unui document „secret de serviciu” este precedat de:", ["două zerouri (00)", "litera S", "litera X", "un zero (0)"], 1, "HG 585/2002, Cap. III – marcarea."], ["Numărul de înregistrare al unui document „secret” este precedat de:", ["litera S", "trei zerouri (000)", "un zero (0)", "două zerouri (00)"], 2, "HG 585/2002, Cap. III."], ["Anexele unui document clasificat se clasifică:", ["obligatoriu cu nivelul documentului principal", "întotdeauna cu un nivel mai mic", "după conținutul propriu", "nu se clasifică"], 2, "HG 585/2002 – marcarea."], ["Multiplicarea documentelor clasificate se face:", ["numai la firme specializate din exterior", "de orice angajat, la orice copiator", "numai cu aprobarea ORNISS pentru fiecare copie", "numai de persoane autorizate și numai în încăperi special destinate"], 3, "HG 585/2002, art. 66–74."], ["Distrugerea documentelor clasificate se face astfel încât:", ["să poată fi reconstituite la nevoie", "să se păstreze prima pagină", "reconstituirea lor să fie imposibilă", "să se arhiveze o copie scanată nesecurizată"], 2, "HG 585/2002, art. 76–80."], ["Informațiile „strict secret de importanță deosebită” și „strict secret” se gestionează în:", ["zone de securitate clasa I", "zona administrativă", "zone de securitate clasa II", "orice birou închis cu cheia"], 0, "HG 585/2002, Cap. IV."], ["Informațiile „secret” se gestionează, de regulă, în:", ["spații publice", "zona administrativă", "zone de securitate clasa III", "zone de securitate clasa II"], 3, "HG 585/2002, Cap. IV."], ["Combinațiile încuietorilor containerelor de securitate se schimbă periodic, de regulă la ... și nu mai rar de ...", ["6 luni; 12 luni", "1 lună; 3 luni", "1 an; 5 ani", "3 luni; 2 ani"], 0, "HG 585/2002, Cap. IV. Se schimbă și la schimbarea personalului sau la compromitere."], ["În zonele în care se lucrează cu informații clasificate, accesul cu aparate de fotografiat, filmat sau înregistrat audio-video:", ["este permis numai personalului civil", "este interzis, în afara situațiilor aprobate", "este permis dacă aparatele sunt închise", "este permis oricui"], 1, "HG 585/2002, Cap. IV."], ["Fotografierea, filmarea și cartografierea în obiectivele care prezintă importanță deosebită pentru protecția secretelor de stat sunt:", ["permise oricui de pe domeniul public", "permise turiștilor", "permise jurnaliștilor acreditați fără alte formalități", "interzise, cu excepția celor autorizate"], 3, "HG 585/2002, Cap. V."], ["Potrivit HG 585/2002, persoanele cu certificat de securitate sau autorizație de acces sunt instruite:", ["numai în caz de incident de securitate", "o singură dată, la angajare", "la acordarea certificatului și periodic, instruirea consemnându-se în fișa de pregătire individuală", "numai la cerere"], 2, "Art. 35."]]}, {"id": "L09", "t": "HG 106/2011 – Ghidul carierei militare", "k": "L", "q": [["Potrivit Ghidului carierei militare, cariera militară reprezintă:", ["succesiunea de funcții ocupate de ofițeri, maiștri militari și subofițeri, de la intrarea în sistem până la trecerea în rezervă sau în retragere", "numărul de ani petrecuți în aceeași unitate", "totalitatea cursurilor absolvite", "succesiunea gradelor obținute, fără legătură cu funcțiile"], 0, "Art. 1 alin. (2)."], ["Cadrele militare în activitate sunt, potrivit ghidului:", ["soldații și gradații profesioniști", "orice persoane care lucrează în MApN", "cetățeni ai statelor NATO încadrați în MApN", "cetățeni români cu domiciliul stabil în România, cărora li s-a acordat grad de ofițer, maistru militar sau subofițer"], 3, "Art. 2."], ["Cadrele militare își păstrează specialitatea militară:", ["pe toată durata carierei; trecerea în altă specialitate se face în funcție de nevoile instituției", "până la înaintarea în gradul de plutonier", "maximum 10 ani", "până la primul curs de carieră"], 0, "Art. 3."], ["Încadrarea, numirea și promovarea cadrelor militare se fac:", ["exclusiv după vechime", "în funcții prevăzute în statele de organizare, ținând seama de specialitate, nevoi, opțiuni, competență și conduită morală", "prin tragere la sorți", "exclusiv după vârstă"], 1, "Art. 4."], ["Comisiile de selecție pentru promovare, înaintare în grad și trecerea în corpul ofițerilor sunt:", ["permanente, iar hotărârile lor pot fi atacate la CSAT", "temporare, iar hotărârile lor sunt definitive", "numite de Parlament", "alese de militari prin vot"], 1, "Art. 5."], ["Cursurile de carieră se urmează:", ["în perioada stagiului în gradul deținut", "după înaintarea în gradul următor", "numai după 20 de ani de serviciu", "numai înainte de intrarea în sistem"], 0, "Art. 6."], ["Normele de organizare și funcționare a sistemului de selecție se stabilesc prin:", ["lege organică", "hotărâre a CSAT", "decret prezidențial", "ordin al ministrului apărării naționale"], 3, "Art. 8."], ["Maiștrii militari și subofițerii sunt confirmați în specialitate prin:", ["vechime de 5 ani", "examen la CSAT", "absolvirea programului de pregătire", "aprobarea comandantului de pluton"], 2, "Art. 21."], ["Înaintarea sergenților în gradul de sergent-major (respectiv maiștri militari clasa a V-a în clasa a IV-a), dacă îndeplinesc condițiile, se face:", ["numai după absolvirea cursului de plutonier", "numai cu aprobarea ministrului", "numai prin concurs național", "fără analiza comisiei de selecție"], 3, "Art. 22."], ["Pentru înaintarea sergentului-major în gradul de plutonier este necesară, între altele:", ["absolvirea cursului de plutonier", "absolvirea unei facultăți", "vechime de 20 de ani", "absolvirea cursului de plutonier adjutant"], 0, "Art. 23."], ["Pentru înaintarea plutonierului-major în gradul de plutonier adjutant este necesară, între altele:", ["absolvirea cursului de plutonier", "licența în științe militare", "participarea la o misiune externă", "absolvirea cursului de plutonier adjutant"], 3, "Art. 25."], ["Pentru înaintarea în gradul de plutonier adjutant principal se cer, între altele, calificative de cel puțin:", ["„foarte bun” în perioada stagiului", "„satisfăcător”", "„bun”", "„excepțional” în toți anii de carieră"], 0, "Art. 26."], ["Una dintre condițiile pentru trecerea maiștrilor militari/subofițerilor în corpul ofițerilor este:", ["vârsta de cel puțin 40 de ani", "calificativul „foarte bun” în ultimii 3 ani de activitate", "gradul de plutonier adjutant principal", "vechimea de minimum 20 de ani"], 1, "Art. 27."], ["Pentru trecerea în corpul ofițerilor, maiștrii militari/subofițerii trebuie să aibă:", ["doar diploma de bacalaureat", "studii universitare de licență (ciclul I Bologna) sau studii superioare de lungă durată", "studii postliceale", "doctorat"], 1, "Art. 27."], ["Trecerea maiștrilor militari/subofițerilor în corpul ofițerilor se realizează:", ["numai în timp de război", "la cerere, fără alte condiții", "automat, după 10 ani de activitate", "în funcție de nevoile MApN, prin absolvirea cursului de formare a ofițerilor în activitate, cu acces prin concurs"], 3, "Art. 27–28."]]}, {"id": "L10", "t": "RG-1 – Regulamentul de ordine interioară în unitate", "k": "L", "q": [["Relațiile de subordonare dintre militari (șef – subordonat) se stabilesc în funcție de:", ["vârsta militarilor", "funcțiile pe care le ocupă militarii", "vechimea în armată", "gradul militar, exclusiv"], 1, "Relațiile de subordonare au la bază funcția; cele de superioritate/inferioritate au la bază gradul."], ["Relațiile de superioritate–inferioritate (ierarhie militară) se stabilesc în funcție de:", ["vârstă", "unitatea din care fac parte", "funcție", "gradul militar"], 3, "RG-1, relațiile dintre militari."], ["La primirea unui ordin, militarul:", ["îl discută cu colegii înainte de a-l executa", "confirmă că a înțeles, îl execută întocmai și la timp și raportează executarea", "îl execută doar dacă este de acord cu el", "cere ordinul în scris înainte de a-l executa"], 1, "RG-1 / Legea 80, art. 8."], ["Ordinele contrare legii, obiceiurilor războiului și convențiilor internaționale:", ["se execută numai în prezența unui martor", "se execută dacă vin de la un general", "nu se execută", "se execută și apoi se raportează"], 2, "RG-1 / Legea 80/1995, art. 8 lit. b)."], ["În relațiile dintre militari, salută primul:", ["militarul mai în vârstă", "militarul care are mai multe decorații", "subordonatul pe șef și inferiorul pe superior", "șeful pe subordonat"], 2, "RG-1, salutul militar."], ["Militarii care se află în formație:", ["salută numai generalii", "nu salută niciodată", "salută fiecare individual", "nu salută individual; salută comandantul formației"], 3, "RG-1, salutul militar."], ["Fără acoperământ, salutul se execută prin:", ["ridicarea mâinii stângi", "luarea poziției de drepți și întoarcerea capului spre cel salutat", "o înclinare a corpului", "ducerea mâinii la tâmplă"], 1, "RG-1, salutul militar."], ["Purtarea uniformei militare în combinație cu articole de îmbrăcăminte civilă:", ["este permisă în zilele libere", "este permisă iarna", "este permisă cu aprobarea colegilor", "este interzisă"], 3, "RG-1, portul uniformei."], ["Semnul personal de identitate (placheta de identificare) se poartă:", ["numai în cazarmă", "la gât, pe timpul misiunilor, exercițiilor, tragerilor și ori de câte ori se ordonă", "în buzunarul de la piept, permanent", "numai în concediu"], 1, "RG-1, art. 101–103."], ["Scutirile medicale se acordă de:", ["comandantul de grupă", "colegii de cameră", "ofițerul de serviciu", "medicul unității"], 3, "RG-1, scutiri și concedii medicale."], ["Permisia se acordă militarilor pentru:", ["studii universitare", "participarea la mitinguri", "odihnă anuală", "situații personale sau familiale deosebite (de exemplu căsătorie, naștere, deces în familie)"], 3, "RG-1, art. 126–131; Legea 80/1995, art. 17."], ["Raportul personal se prezintă:", ["pe cale ierarhică, începând cu șeful nemijlocit", "numai în scris, prin poștă", "direct ministrului apărării, în orice situație", "prin intermediul presei"], 0, "RG-1, rapoartele personale."], ["Prin raportul personal, militarul se poate adresa comandantului:", ["numai în timpul concediului", "în nume propriu, cu cereri, propuneri sau reclamații privind probleme personale sau de serviciu", "numai cu reclamații împotriva colegilor", "în numele întregii subunități"], 1, "RG-1, rapoartele personale – nu se admit rapoarte colective."], ["Accesul în unitatea militară se face:", ["prin orice poartă deschisă", "numai prin punctul de control, pe bază de legitimație sau permis de acces", "pe orice cale, dacă militarul este în uniformă", "fără nicio verificare, în timpul programului"], 1, "RG-1, accesul în unitate."], ["Activitatea zilnică în unitate se desfășoară conform:", ["programului stabilit de fiecare militar", "programului stabilit de sindicat", "programului zilnic aprobat de comandantul unității", "programului primăriei"], 2, "RG-1, activitatea zilnică."]]}, {"id": "L11", "t": "Regulamentul serviciului interior (M.26/2025)", "k": "L", "q": [["Potrivit Regulamentului serviciului interior (M.26/2025), serviciul interior cuprinde:", ["serviciul de permanență și serviciul de pază, exclusiv", "serviciul de gardă, serviciul de zi și serviciul de noapte", "serviciul de permanență, serviciul operativ, serviciul de continuitate a conducerii, serviciul tehnic de monitorizare și avertizare, serviciul de pază și intervenție", "serviciul de pază, serviciul de cantină și serviciul de transport"], 2, "Ordinul M.26/2025 – cinci tipuri de servicii."], ["Regulamentul serviciului interior aprobat prin Ordinul M.26/2025 a intrat în vigoare la:", ["1 martie 2025", "14 februarie 2025", "1 iunie 2025", "1 ianuarie 2025"], 0, "Ordinul M.26/2025, art. 2."], ["Serviciul interior se organizează:", ["la nivelul fiecărei garnizoane, în comun cu Poliția", "la nivelul fiecărui obiectiv militar", "numai la nivelul Statului Major al Apărării", "numai la nivelul brigăzii"], 1, "RSI, dispoziții generale."], ["Dacă într-un obiectiv militar funcționează o singură unitate, comandantul obiectivului este:", ["comandantul garnizoanei", "șeful de stat major al eșalonului superior", "ofițerul de serviciu", "comandantul acelei unități"], 3, "RSI."], ["Executarea serviciului interior constituie:", ["o activitate voluntară", "atribuție de serviciu pentru personalul militar și civil al MApN, prevăzută în fișa postului", "o activitate exclusiv a soldaților", "o activitate plătită separat, pe bază de contract"], 1, "RSI."], ["Care dintre următoarele este o categorie de măsuri de siguranță opozabile terților?", ["percheziția domiciliilor din apropiere", "închiderea magazinelor din oraș", "confiscarea autoturismelor din zonă", "interzicerea sau limitarea utilizării unor dispozitive electronice"], 3, "RSI – măsuri de interzicere/avertizare/semnalizare; control, detecție, supraveghere; limitarea accesului și circulației; limitarea dispozitivelor electronice."], ["În zona militară restricționată, comandantul obiectivului poate dispune, cu respectarea compatibilității electromagnetice:", ["tăierea alimentării cu energie a localității", "interzicerea temporară sau bruierea emisiilor electromagnetice", "confiscarea telefoanelor tuturor trecătorilor", "interceptarea convorbirilor telefonice ale civililor"], 1, "RSI, măsuri de siguranță."], ["Limitele zonei militare restricționate din proximitatea obiectivului sunt propuse de:", ["prefect", "comandantul obiectivului militar", "ofițerul de serviciu", "primarul localității"], 1, "RSI."], ["Somațiile santinelei, în ordinea legală, sunt:", ["„Mâinile sus!”, „Stai, că trag!”", "foc de avertisment, apoi „Stai!”", "„Cine e acolo?”, foc de avertisment, „Stai!”", "„Stai!”, „Stai, că trag!”, apoi foc de avertisment în plan vertical"], 3, "RSI și Legea 122/2011, art. 16."], ["Personalul care urmează să execute serviciul interior înarmat trebuie să fie:", ["absolvent de studii superioare", "mai în vârstă de 30 de ani", "căsătorit", "apt din punct de vedere medical și psihologic"], 3, "RSI – examinarea medicală și asistența psihologică."], ["Încărcarea și descărcarea armamentului personalului din serviciu se fac:", ["oriunde în unitate", "în dormitor", "în fața punctului de control, pe drumul public", "numai în locurile special amenajate, sub supraveghere"], 3, "RSI – armamentul și muniția personalului."]]}, {"id": "L12", "t": "RG-3 – Regulamentul disciplinei militare", "k": "L", "q": [["Regulamentul disciplinei militare a fost aprobat prin:", ["HG 106/2011", "Ordinul M.26/2025", "Ordinul ministrului apărării naționale nr. M.64/2013", "Ordinul M.38/2016"], 2, "RG-3."], ["Dreptul comandantului/șefului de a acorda recompense și de a aplica sancțiuni disciplinare se numește:", ["competență civilă", "autoritate administrativă", "prerogativă disciplinară", "drept de veto"], 2, "Legea 80/1995, art. 32 alin. (3); RG-3."], ["Care dintre următoarele este o sancțiune disciplinară aplicabilă soldaților și gradaților profesioniști?", ["amânarea înaintării în gradul următor pe o perioadă de 1–2 ani", "arestul la domiciliu", "amenda contravențională", "degradarea militară"], 0, "Legea 384/2006, art. 28."], ["Care dintre următoarele NU este o sancțiune disciplinară pentru soldații și gradații profesioniști?", ["mustrarea scrisă", "trecerea în retragere", "încetarea contractului din motive disciplinare", "avertismentul"], 1, "Legea 384/2006, art. 28."], ["Sancțiunea disciplinară cea mai gravă pentru un soldat/gradat profesionist este:", ["retrogradarea în funcție", "avertismentul", "mustrarea scrisă", "încetarea contractului din motive disciplinare"], 3, "Legea 384/2006, art. 28 lit. e)."], ["Sancțiunile disciplinare aplicabile soldaților și gradaților profesioniști (cu excepția avertismentului) nu pot fi aplicate:", ["fără o cercetare prealabilă efectuată de comisii, sub sancțiunea nulității absolute", "înainte de 6 luni de la abatere", "fără aprobarea Parlamentului", "fără acordul militarului sancționat"], 0, "Legea 384/2006, art. 30 alin. (1)."], ["Singura sancțiune care se poate aplica soldaților și gradaților profesioniști fără cercetare prealabilă este:", ["retrogradarea în funcție", "mustrarea scrisă", "încetarea contractului", "avertismentul"], 3, "Legea 384/2006, art. 30 alin. (1)."], ["Comandantul are la dispoziție, pentru a stabili aplicarea unei sancțiuni după ce a luat cunoștință de abatere, cel mult:", ["6 luni", "5 zile lucrătoare", "30 de zile calendaristice", "2 ani"], 2, "Legea 384/2006, art. 29 alin. (1)."], ["O abatere a unui soldat/gradat profesionist poate fi sancționată numai dacă a fost adusă la cunoștința comandantului în termen de:", ["1 an de la săvârșire", "2 ani de la săvârșire", "30 de zile de la săvârșire", "6 luni de la săvârșire"], 3, "Legea 384/2006, art. 29 alin. (3)."], ["Soldații și gradații profesioniști pot primi distincții nemateriale și avantaje financiare pentru îndeplinirea cu deosebită profesionalitate a sarcinilor, în condițiile stabilite prin:", ["decizia comandantului de grupă", "lege organică specială pentru fiecare militar", "hotărâre a Parlamentului", "ordin al ministrului apărării naționale"], 3, "Legea 384/2006, art. 27."]]}, {"id": "S01", "t": "Bazele comunicațiilor și informaticii militare", "k": "S", "q": [["Sprijinul de comunicații și informatică are ca scop principal:", ["asigurarea schimbului de informații necesar comenzii și controlului forțelor", "asigurarea hranei și echipamentului trupelor", "asigurarea pazei obiectivelor militare", "asigurarea transportului de muniție"], 0, "Rolul SCI în operații."], ["Sprijinul de comunicații și informatică face parte din categoria:", ["sprijinului medical", "forțelor de manevră", "sprijinului de luptă", "forțelor de protecție civilă"], 2, "SCI este un sprijin al conducerii, un sprijin de luptă."], ["Cerința ca informația să ajungă la destinatar în timp util se numește:", ["operativitate", "interoperabilitate", "multiplexare", "polarizare"], 0, "Cerințele comunicațiilor militare."], ["Capacitatea sistemului de comunicații de a funcționa chiar dacă unele elemente sunt scoase din funcțiune se numește:", ["directivitate", "modulație", "fiabilitate (siguranță în funcționare)", "operativitate"], 2, "Se obține prin rute alternative și mijloace de rezervă."], ["Capacitatea de a comunica cu structuri ale altor state aliate (NATO) se numește:", ["fiabilitate", "interoperabilitate", "mobilitate", "continuitate"], 1, "Cerințele comunicațiilor militare."], ["Potrivit regulilor de responsabilitate pentru realizarea legăturilor, de legătura cu subordonații răspunde:", ["subordonatul", "eșalonul superior", "vecinul din dreapta", "structura logistică"], 1, "Regula „de sus în jos”."], ["În cazul legăturii între vecini, răspunderea pentru realizarea legăturii revine, de regulă:", ["eșalonului inferior", "unității cu efectivul cel mai mare", "unității din stânga față de cea din dreapta", "unității din dreapta față de cea din stânga"], 2, "Regula „de la stânga la dreapta”."], ["Între o structură care sprijină și una sprijinită, legătura o realizează:", ["structura sprijinită", "cea mai apropiată unitate civilă", "structura care sprijină", "eșalonul inferior celor două"], 2, "Regula „de la sprijin la sprijinit”."], ["Care dintre următoarele mijloace de legătură este cel mai greu de interceptat și bruiat de inamic?", ["legătura radio HF", "legătura radio VHF", "legătura prin satelit", "legătura prin fir"], 3, "Firul nu radiază energie în spațiu, deci nu poate fi bruiat sau localizat ușor."], ["În timpul deplasării trupelor, mijlocul principal de legătură este:", ["semnalizarea cu fanioane", "curierul pe jos", "radioul", "cablul de campanie"], 2, "Radioul permite legătura în mișcare."], ["Modul de organizare a legăturilor în care punctele de comandă sunt legate prin noduri interconectate, astfel încât traficul poate ocoli un nod distrus, se numește:", ["pe direcții (radial)", "liniar simplu", "pe axă", "în rețea (nodal)"], 3, "Organizarea în rețea are fiabilitatea cea mai mare."], ["Modul de organizare în care de la PC-ul superior pleacă câte o legătură directă spre fiecare subordonat se numește:", ["în inel", "pe axă", "în rețea", "pe direcții (radial)"], 3, "Moduri de organizare a legăturilor."], ["Centrul de comunicații al punctului de comandă reprezintă:", ["clădirea statului major", "totalitatea mijloacelor de comunicații dispuse la PC, organizate să lucreze unitar", "punctul de alimentare cu combustibil", "un singur post radio"], 1, "Elemente de tactica armei."], ["Semnalul analogic este semnalul care:", ["poate lua doar două valori, 0 și 1", "are întotdeauna frecvența de 1 kHz", "se transmite numai prin fibră optică", "variază continuu în timp"], 3, "Bazele comunicațiilor."], ["Banda de frecvențe a canalului telefonic standard pentru voce este:", ["300–3400 Hz", "3–30 MHz", "20 Hz–20 kHz", "30–88 MHz"], 0, "Canalul telefonic standard."], ["Procesul prin care informația (de exemplu vocea) este „pusă” pe o undă purtătoare de frecvență mare se numește:", ["modulație", "eșantionare", "demodulație", "multiplexare"], 0, "Bazele comunicațiilor."], ["Modulația în care variază amplitudinea purtătoarei se numește:", ["modulație de frecvență (MF/FM)", "modulație de fază (PM)", "modulație în cod de impulsuri (PCM)", "modulație de amplitudine (MA/AM)"], 3, "Tipuri de modulație."], ["Comparativ cu modulația de amplitudine, modulația de frecvență este:", ["imposibil de folosit în VHF", "identică din punctul de vedere al zgomotului", "mai puțin sensibilă la zgomote și perturbații", "mai sensibilă la zgomote"], 2, "FM are imunitate mai bună la zgomot."], ["Modulația cu bandă laterală unică (BLU/SSB) are avantajul că:", ["nu are nevoie de antenă", "ocupă jumătate din bandă și economisește putere", "ocupă dublul benzii", "se folosește numai în fibră optică"], 1, "Se transmite o singură bandă laterală, fără purtătoare."], ["Modul de lucru în care transmisia se face în ambele sensuri, dar alternativ (nu simultan), ca la stațiile radio cu PTT, se numește:", ["multiplex", "transmisie unidirecțională (broadcast)", "duplex", "semi-duplex"], 3, "Moduri de lucru. În terminologia radio militară, lucrul alternativ pe o singură frecvență se mai numește „simplex”."], ["Modul de lucru în care transmisia are loc simultan în ambele sensuri se numește:", ["duplex", "broadcast", "simplex", "semi-duplex"], 0, "Moduri de lucru."], ["Bătaia (distanța de legătură) a unei stații radio NU depinde de:", ["culoarea carcasei stației", "înălțimea antenei", "relieful terenului", "puterea emițătorului"], 0, "Bătaia depinde de putere, sensibilitate, antenă, frecvență, teren, zgomot."], ["Pentru a mări bătaia unei legături VHF și a ocoli obstacolele de teren se folosește:", ["trecerea pe AM", "reducerea puterii emițătorului", "o stație de retranslație (releu) dispusă pe un punct înalt", "o antenă mai scurtă"], 2, "Retranslația."], ["Gama de unde HF (unde scurte, decametrice) corespunde frecvențelor:", ["3–30 MHz", "300 kHz–3 MHz", "300 MHz–3 GHz", "30–300 MHz"], 0, "Gamele de frecvențe."], ["Gama de unde VHF (unde ultrascurte, metrice) corespunde frecvențelor:", ["3–30 MHz", "30–300 MHz", "30–300 kHz", "300 MHz–3 GHz"], 1, "Gamele de frecvențe."], ["Undele decametrice (scurte) corespund gamei:", ["LF", "VHF", "UHF", "HF"], 3, "HF: λ între 100 m și 10 m."], ["Banda VHF folosită de stațiile radio tactice de luptă (NATO) este de aproximativ:", ["88–108 MHz", "1–2 GHz", "3–30 MHz", "30–88 MHz"], 3, "Banda tactică VHF FM."], ["Relația dintre lungimea de undă λ și frecvența f este:", ["λ = c / f, unde c este viteza luminii", "λ = c · f", "λ = f / c", "λ = 1 / (c · f)"], 0, "c = 3·10⁸ m/s."], ["Care este lungimea de undă a unui semnal cu frecvența de 30 MHz?", ["10 m", "3 m", "100 m", "1 m"], 0, "λ = 300/30 = 10 m."], ["Care este lungimea de undă a unui semnal cu frecvența de 300 MHz?", ["0,1 m", "1 m", "10 m", "100 m"], 1, "λ = 300/300 = 1 m."], ["O antenă verticală „bici” în sfert de undă pentru frecvența de 75 MHz are lungimea teoretică de:", ["1 m", "4 m", "0,5 m", "2 m"], 0, "λ = 300/75 = 4 m; λ/4 = 1 m."], ["Un dipol în semiundă pentru frecvența de 150 MHz are lungimea teoretică de:", ["0,5 m", "4 m", "1 m", "2 m"], 2, "λ = 300/150 = 2 m; λ/2 = 1 m."], ["Funcția antenei de emisie este de a:", ["transforma semnalul electric de radiofrecvență în undă electromagnetică radiată în spațiu", "cripta semnalul", "stoca energia electrică", "amplifica semnalul audio"], 0, "Antene."], ["Antena verticală de tip „bici” are, în plan orizontal, o diagramă de radiație:", ["nulă", "omnidirecțională", "puternic directivă, într-o singură direcție", "bidirecțională, numai înainte și înapoi"], 1, "Bună pentru rețele radio."], ["Pentru legăturile radioreleu punct tre următoarele este un dezavantaj al legăturii radio?", ["poate fi interceptată, bruiată, iar stația poate fi localizată prin radiogoniometrie", "nu permite legătura în mișcare", "nu poate transmite voce", "se realizează foarte greu"], 0, "Dezavantajele radioului."], ["Determinarea poziției unei stații radio inamice prin măsurarea direcției din care vin emisiile ei se numește:", ["multiplexare", "modulație", "radiolocație activă", "radiogoniometrie"], 3, "Localizarea emițătoarelor."], ["Măsurile luate de propriile forțe pentru a-și proteja comunicațiile împotriva bruiajului și interceptării (de exemplu saltul de frecvență) fac parte din:", ["contra-contramăsurile electronice (ECCM)", "măsurile de protecție civilă", "măsurile de sprijin electronic (ESM)", "contramăsurile electronice (ECM)"], 0, "FH este ECCM (EPM)."], ["Saltul de frecvență (FH) reprezintă:", ["schimbarea manuală a frecvenței de către operator la fiecare mesaj", "schimbarea pseudo-aleatoare și sincronă a frecvenței de lucru de către toate stațiile din rețea, de multe ori pe secundă", "creșterea frecvenței pe măsură ce stația se încălzește", "lucrul pe două frecvențe fixe, una pentru emisie și una pentru recepție"], 1, "Definiția FH."], ["Saltul de frecvență este o tehnică de tip:", ["spectru împrăștiat (spread spectrum)", "modulație de amplitudine cu purtătoare", "multiplexare în frecvență pe fir", "comutație de circuite"], 0, "FH împrăștie semnalul pe o bandă largă."], ["Care dintre următoarele NU este un avantaj al saltului de frecvență?", ["rezistența la bruiaj", "nu necesită sincronizarea stațiilor din rețea", "posibilitatea funcționării mai multor rețele în aceeași bandă", "probabilitatea redusă de interceptare"], 1, "FH necesită obligatoriu sincronizare."], ["Rezistența la bruiaj a stațiilor cu salt de frecvență se explică prin faptul că:", ["stațiile nu emit deloc în timpul bruiajului", "stațiile emit cu putere de 10 ori mai mare", "stațiile folosesc numai modulație de amplitudine", "bruiajul pe o frecvență afectează doar o mică parte din salturi, iar erorile pot fi corectate"], 3, "Performanțele FH."], ["Probabilitatea redusă de interceptare (LPI) a stațiilor FH se datorează faptului că:", ["ascultătorul neautorizat nu cunoaște frecvența pe care va emite stația în momentul următor", "stațiile nu folosesc antene", "stațiile lucrează doar noaptea", "semnalul este transmis prin cablu"], 0, "Performanțele FH."], ["Pentru ca stațiile să poată lucra în salt de frecvență în aceeași rețea, trebuie să aibă în comun:", ["doar aceeași putere de emisie", "doar același tip de antenă", "setul de frecvențe, cheia de salt (TRANSEC), sincronizarea de timp și identificatorul rețelei", "doar același indicativ de apel"], 2, "Elementele necesare lucrului în FH."], ["Cheia care determină ordinea pseudo-aleatoare a salturilor de frecvență este de tip:", ["TRANSEC (securitatea transmisiei)", "parolă de rețea Wi-Fi", "PIN de acces la stație", "cod Morse"], 0, "Cheia de salt."], ["Fără sincronizarea timpului între stații, în regim de salt de frecvență:", ["legătura se realizează automat pe AM", "legătura se realizează, dar cu volum mai mic", "nu se poate realiza legătura", "legătura se realizează numai noaptea"], 2, "Sincronizarea este obligatorie."], ["Saltul de frecvență oferă rezistență la fadingul selectiv deoarece:", ["elimină complet reflexiile", "crește automat înălțimea antenei", "o frecvență afectată de fading influențează doar câteva salturi", "folosește o singură frecvență foarte stabilă"], 2, "Performanțele FH."], ["Posibilitatea ca mai multe rețele FH să lucreze în aceeași bandă de frecvențe se obține prin:", ["folosirea de chei/identificatori diferiți pentru fiecare rețea", "folosirea aceleiași chei pentru toate rețelele", "reducerea numărului de stații la două", "lucrul exclusiv în frecvență fixă"], 0, "Utilizare eficientă a spectrului."], ["Comparativ cu lucrul în frecvență fixă, lucrul în salt de frecvență este:", ["mai vulnerabil la bruiaj", "identic din punctu  realizată între două stații se numește:", ["direcție radio", "trunchi", "rețea radio", "nod de comunicații"], 0, "Organizarea legăturilor radio."], ["Stația care conduce rețeaua radio (deschide/închide rețeaua, controlează traficul, impune tăcerea radio) se numește:", ["stația necunoscută", "stația de retranslație", "stația de control al rețelei (NCS)", "stația subordonată"], 2, "NCS."], ["De regulă, stația de control al rețelei este stația:", ["comandantului / eșalonului superior", "celui mai tânăr operator", "de retranslație", "cea mai îndepărtată de punctul de comandă"], 0, "Organizarea rețelelor."], ["Într-o rețea dirijată (directed net):", ["nu există stație de control al rețelei", "se transmite numai în clar", "stațiile subordonate pot comunica între ele numai cu aprobarea stației de control al rețelei", "stațiile comunică liber, fără aprobare"], 2, "Tipuri de rețele."], ["Într-o rețea liberă (free net):", ["tăcerea radio este permanentă", "se lucrează numai pe frecvență fixă", "stațiile pot comunica direct între ele, fără aprobarea prealabilă a stației de control", "nicio stație nu poate emite fără aprobare"], 2, "Tipuri de rețele."], ["Tipul de rețea (liberă sau dirijată) se stabilește de:", ["stația de control al rețelei", "fiecare operator, după preferință", "operatorul care emite primul", "inamic"], 0, "NCS decide modul de control."], ["Indicativul de apel (call sign) reprezintă:", ["puterea emițătorului", "codul de criptare", "denumirea convențională a unei stații radio, folosită în locul numelor reale", "frecvența de lucru"], 2, "Indicativele protejează identitatea stațiilor."], ["Înainte de a emite, operatorul trebuie, în primul rând:", ["să transmită un ton de test lung", "să schimbe antena", "să mărească puterea la maximum", "să asculte frecvența, pentru a nu întrerupe alt trafic"], 3, "Disciplina radio."], ["Transmisiile radio trebuie să fie cât mai scurte deoarece:", ["regulamentul interzice frazele cu peste 3 cuvinte", "fiecare secundă de emisie tic NATO:", ["ADAM BRAVO CHARLIE", "ALFA BRAVO CHARLIE", "ALFA BRAVO CHARLES", "ALPHA BETA CHARLIE"], 1, "Alfabetul fonetic NATO."], ["Cifra 9 se pronunță, în radiotelefonie (NATO):", ["NINE-TEN", "NOVEM", "NAIN", "NIN-ER"], 3, "Pronunția cifrelor."], ["Cifra 3 se pronunță, în radiotelefonie (NATO):", ["TEREI", "THRI", "TREE", "TRES"], 2, "Pronunția cifrelor."], ["Cuvântul de procedură „OVER” înseamnă:", ["schimbul s-a încheiat și nu aștept răspuns", "am înțeles și voi executa", "transmisia mea s-a încheiat și aștept răspuns", "repetă transmisia"], 2, "Prowords."], ["Cuvântul de procedură „OUT” înseamnă:", ["așteaptă câteva secunde", "aștept răspuns", "repetă", "transmisia s-a încheiat și nu aștept răspuns"], 3, "Prowords."], ["Folosirea împreună a cuvintelor de procedură „OVER” și „OUT” la sfârșitul unei transmisii este:", ["obligatorie în rețelele dirijate", "corectă, este forma oficială de încheiere", "greșită, deoarece au sensuri contradictorii", "permisă numai de NCS"], 2, "„Over and out” este o greșeală de procedură."], ["Cuvântul de procedură „ROGER” înseamnă:", ["corectez", "am recepționat satisfăcător ultima transmisie", "am înțeles și voi executa", "repetă"], 1, "Prowords."], ["Cuvântul de procedură „WILCO” înseamnă:", ["repetă mesajul", "am primit mesajul, l-am înțeles și voi executa", "așteaptă", "am recepționat, dar nu voi executa"], 1, "WILCO include sensul lui ROGER."], ["Pentru a cere repetarea unei transmisii (sau a unei părți din ea) se folosește cuvântul de procedură:", ["ROGER", "OVER", "SAY AGAIN", "REPEAT"], 2, "„REPEAT” nu se folosește, deoarece în artilerie înseamnă repetarea tragerii."], ["Cuvântul de procedură folosit înaintea unui cuvânt spus pe litere cu alfabetul fonetic este:", ["FIGURES", "BREAK", "WAIT", "I SPELL"], 3, "Prowords."], ["Cuvântul de procedură „CORRECTION” se folosește atunci când:", ["se impune tăcerea radio", "se încheie schimbul de mesaje", "operatorul cere corespondentului să corecteze antena", "operatorul a greșit și continuă de la ultimul cuvânt transmis corect"], 3, "Prowords."], ["Cuvântul de procedură „WAIT OUT” înseamnă:", ["așteaptă, voi reveni mai târziu (pauză mai lungă)", "tăcere radio", "am terminat definitiv", "așteaptă câteva secunde, revin imediat"], 0, "Prowords."], ["Pentru a cere corespondentului să repete mesajul primit, ca verificare, se folosește:", ["I SAY AGAIN", "ACKNOWLEDGE", "READ BACK", "SAY AGAIN"], 2, "Prowords."], ["Răspunsul la o verificare radio, atunci când semnalul este puternic și perfect inteligibil, este:", ["NOTHING HEARD", "LOUD AND CLEAR", "GOOD AND DISTORTED", "WEAK AND READABLE"], 1, "Radio check."], ["În răspunsul la verificarea radio, termenul „UNREADABLE” arată că:", ["semnalul are fading", "semnalul este foarte puternic", "transmisia nu poate fi înțeleasă", "transmisia este perfect clară"], 2, "Radio check – inteligibilitate."], ["Cuvântul de procedură „THIS IS” este urmat de:", ["indicativul stației care transmite (propriul indicativ)", "indicativul stației chemate", "textul mesajului", "frecvența de lucru"], 0, "Ex.: „BRAVO 2, THIS IS ALFA 1”."], ["Cuvântul de procedură folosit pentru a anula o transmisie greșită este:", ["CORRECTION", "I SAY AGAIN", "DISREGARD THIS TRANSMISSION – OUT", "WAIT"], 2, "Prowords."], ["Atunci când stația chemată nu răspunde, stația care cheamă poate raporta:", ["WILCO", "ROGER", "LOUD AND CLEAR", "NOTHING HEARD"], 3, "Prowords."], ["Când operatorul nu a identificat stația care l-a chemat, folosește:", ["UNKNOWN STATION", "BREAK", "THIS IS", "WILCO"], 0, "Prowords."], ["Numărul 1500 se transmite, cifră cu cifră, astfel:", ["WUN FIFE ZE-RO ZE-RO", "ONE FIVE HUNDRED", "WUN FIVE OH OH", "FIFTEEN HUNDRED"], 0, "Pronunția cifrelor."], ["La apăsarea tastei de emisie (PTT), operatorul trebuie:", ["să vorbească imediat, foarte tare", "să aștepte o clipă înainte de a vorbi, pentru a nu pierde primul cuvânt", "să elibereze imediat tasta", "să sufle în microfon pentru test"], 1, "Reguli de vorbire."]]}, {"id": "S04", "t": "Sprijinul C&I în operațiile Forțelor Terestre", "k": "S", "q": [["La nivel tactic, principalul mijloc de comunicații care permite legătura pe timpul mișcării este:", ["rețeaua locală de date (LAN)", "rețeaua radio de luptă (CNR)", "centrala telefonică a PC", "rețeaua de fibră optică fixă"], 1, "Infrastructura C&I."], ["„Coloana vertebrală” a sistemului de comunicații de campanie, formată din noduri interconectate prin legături de mare capacitate, este:", ["semnalizarea vizuală", "sistemul de zonă (de trunchiuri / de transport)", "rețeaua radio a grupei", "curierul"], 1, "Sistemul de zonă."], ["Nodurile care conectează punctele de comandă la sistemul de zonă se numesc:", ["noduri de acces", "stații de retranslație", "centre de mentenanță", "noduri de tranzit"], 0, "Arhitectura sistemului de zonă."], ["Avantajul principal al unei rețele de noduri în ochiuri (rețea „mesh”) este că:", ["nu poate fi interceptată", "funcționează fără energie electrică", "nu necesită echipamente de comutație", "traficul poate fi re-rutat automat pe altă cale dacă un nod sau o legătură este distrusă"], 3, "Fiabilitate prin redundanță."], ["Legăturile de mare capacitate dintre nodurile sistemului de zonă se realizează, de regulă, prin:", ["stații radio portabile VHF", "radioreleu, satelit și fibră/cablu", "curieri pe jos", "semnalizare cu rachete"], 1, "Sistemul de zonă."], ["Rețeaua locală care leagă celulele statului major din interiorul punctului de comandă face parte din:", ["rețeaua de avertizare a populației", "sistemul local al punctului de comandă", "sistemul satelitar strategic", "rețeaua radio de luptă"], 1, "Sistemul local."], ["Comunicațiile prin satelit sunt folosite în special pentru:", ["legături în interiorul vehiculului", "semnalizarea vizuală", "legături la distanțe mari, dincolo de linia de vedere", "legături între două telefoane din același cort"], 2, "Satelit – BLOS."], ["Securitatea comunicațiilor (COMSEC) se referă în principal la:", ["alimentarea cu energie a ației de mesaje este:", ["imposibilitatea transmiterii de text", "întârzierile mari și variabile și necesarul mare de memorie în noduri", "rezervarea permanentă a căii", "necesitatea fibrei optice"], 1, "Comutația de mesaje."], ["În comutația de pachete, mesajul este:", ["transmis pe o cale rezervată", "transmis integral, ca un singur bloc", "transformat în semnal analogic", "împărțit în pachete de lungime limitată, fiecare cu propriul antet"], 3, "Comutația de pachete."], ["Avantajul principal al comutației de pachete este:", ["lipsa antetelor", "folosirea eficientă a liniilor, prin partajarea statistică între utilizatori", "întârzierea perfect constantă", "garantarea ordinii pachetelor în orice variantă"], 1, "Comutația de pachete."], ["În varianta datagramă a comutației de pachete:", ["fiecare pachet este rutat independent și pachetele pot sosi în altă ordine", "toate pachetele urmează aceeași cale stabilită în prealabil", "pachetele nu au adresă", "se rezervă o cale fizică"], 0, "Datagramă."], ["În varianta circuit virtual a comutației de pachete:", ["fiecare pachet urmează o cale diferită", "se stabilește o cale logică, iar toate pachetele urmează aceeași cale și sosesc în ordine", "nu există fază de stabilire a conexiunii", "pachetele conțin întotdeauna adresa completă a destinației"], 1, "Circuit virtual."], ["Protocolul IP (Internet) folosește comutația de pachete de tip:", ["datagramă (fără conexiune)", "comutație de circuite", "circuit virtual", "comutație de mesaje"], 0, "Exemplu."], ["Care dintre următoarele tehnologii folosește circuite virtuale?", ["ATM", "Ethernet clasic", "IP", "radiodifuziunea AM"], 0, "ATM, X.25 și Frame Relay sunt orientate pe conexiune."], ["În transmisia asincronă (start-stop):", ["se transmite doar semnal analogic", "nu există biți de sincronizare", "datele se transmit în blocuri mari, cu ceasuri permanent sincronizate", "fiecare caracter este încadrat de un bit de start și de unul sau mai mulți biți de stop"], 3, "Transmisia a const $ = s => document.querySelector(s);
const app = $("#app");
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function stat(key){return store[key]||{ok:0,bad:0};}
function mark(key,ok){const s=stat(key); ok?s.ok++:s.bad++; s.last=ok?1:0; store[key]=s; save();}

let S = null; // sesiunea curentă

function home(){
  clearInterval(window._t);
  const wrong = all.filter(x => stat(x.key).last===0);
  const seen = all.filter(x => store[x.key]).length;
  let h = `<h1>Grile — Admitere SOF Comunicații (017)</h1>
  <p class="sub">${all.length} întrebări · ai lucrat ${seen} · ${wrong.length} de refăcut</p>
  <div class="card"><div class="grid">
    <button class="btn primary" onclick="startSim()">Simulare examen<br><small style="color:inherit;opacity:.85">25 specialitate + 20 legislație · 90 min</small></button>
    <button class="btn" onclick="startPractice(all,'Toate amestecate',30)">30 de întrebări la întâmplare</button>
    <button class="btn" onclick="startPractice(wrong,'Greșelile mele',999)" ${wrong.length?'':'disabled'}>Refă greșelile (${wrong.length})</button>
    <button class="btn" id="resetBtn" onclick="resetAll()">Șterge progresul</button>
  </div></div>`;
  for (const k of ["S","L"]){
    h += `<h2>${k==="S"?"Pregătire de specialitate":"Legislație"}</h2><div class="grid">`;
    DATA.filter(c=>c.k===k).forEach(c=>{
      const qs = all.filter(x=>x.cid===c.id);
      const done = qs.filter(x=>stat(x.key).last===1).length;
      h += `<button class="btn" onclick="startChapter('${c.id}')">${esc(c.id)} · ${esc(c.t)}<br><small>${done}/${qs.length} corecte la ultima încercare</small></button>`;
    });
    h += `</div>`;
  }
  app.innerHTML = h; window.scrollTo(0,0);
}
let resetArmed=false;
function resetAll(){ const b=document.getElementById("resetBtn"); if(!resetArmed){ resetArmed=true; b.textContent="Apasă din nou pentru a șterge tot"; setTimeout(()=>{resetArmed=false; const x=document.getElementById("resetBtn"); if(x) x.textContent="Șterge progresul";},4000); return; } resetArmed=false; store={}; save(); home(); }
function startChapter(cid){ const qs = all.filter(x=>x.cid===cid); startPractice(qs, DATA.find(c=>c.id===cid).t, 999, true); }
function startPractice(pool,title,n,ordered){
  const list = (ordered?pool:shuffle(pool)).slice(0,n);
  S = {mode:"practice", title, list:list.map(x=>({...x, perm:shuffle([0,1,2,3])})), i:0, ans:{}};
  render();
}
function startSim(){
  const spec = shuffle(all.filter(x=>x.k==="S")).slice(0,25);
  const leg = shuffle(all.filter(x=>x.k==="L")).slice(0,20);
  S = {mode:"sim", title:"Simulare examen", list:[...spec,...leg].map(x=>({...x, perm:shuffle([0,1,2,3])})), i:0, ans:{}, end:Date.now()+90*60*1000};
  clearInterval(window._t); window._t = setInterval(()=>{ const el=$("#timer"); if(!el) return; const r=S.end-Date.now(); if(r<=0){ finish(); return;} const m=Math.floor(r/60000), s=Math.floor(r/1000)%60; el.textContent=`⏱ ${m}:${String(s).padStart(2,"0")}`; },1000);
  render();
}
function render(){
  const it = S.list[S.i], n=S.list.length, chosen=S.ans[S.i];
  const showFb = S.mode==="practice" && chosen!==undefined;
  let h = `<div class="top"><a href="#" onclick="home();return false">← Meniu</a><span>${esc(S.title)}</span><span id="timer"></span></div>
  <div class="bar"><i style="width:${(S.i+1)/n*100}%"></i></div><small>Întrebarea ${S.i+1} din ${n}${S.mode==="sim"?(S.i<25?" · Specialitate":" · Legislație"):""} <span class="chip">${esc(it.cid)}</span></small>
  <div class="card"><div class="q">${esc(it.q)}</div>`;
  it.perm.forEach((oi,pos)=>{
    let cls="btn opt";
    if(showFb){ if(oi===it.a) cls+=" ok"; else if(oi===chosen) cls+=" bad"; }
    else if(chosen===oi) cls+=" sel";
    h += `<button class="${cls}" onclick="pick(${oi})" ${showFb?"disabled":""}><b>${L[pos]})</b> ${esc(it.o[oi])}</button>`;
  });
  if(showFb){ h += `<div class="ex"><b class="${chosen===it.a?"okc":"badc"}">${chosen===it.a?"Corect.":"Greșit."}</b> Răspuns: <b>${esc(it.o[it.a])}</b>${it.e?"<br>"+esc(it.e):""}</div>`; }
  h += `</div><div class="row">
    <button class="btn" onclick="go(-1)" ${S.i===0?"disabled":""}>← Înapoi</button>
    ${S.i<n-1?`<button class="btn primary" onclick="go(1)">Următoarea →</button>`:`<button class="btn primary" onclick="finish()">Termină</button>`}
  </div>`;
  if(S.mode==="sim") h += `<p><small>La simulare nu vezi răspunsurile până la final, ca la examen.</small></p>`;
  app.innerHTML = h; window.scrollTo(0,0);
}
function pick(oi){
  if(S.mode==="practice" && S.ans[S.i]!==undefined) return;
  S.ans[S.i]=oi;
  if(S.mode==="practice") mark(S.list[S.i].key, oi===S.list[S.i].a);
  render();
}
function go(d){ S.i=Math.max(0,Math.min(S.list.length-1,S.i+d)); render(); }
function finish(){
  clearInterval(window._t);
  const n=S.list.length; let ok=0, okS=0, okL=0, okLast10=0;
  S.list.forEach((it,i)=>{ const good=S.ans[i]===it.a; if(good){ok++; if(it.k==="S") okS++; else {okL++; if(i>=35) okLast10++;}} if(S.mode==="sim" && S.ans[i]!==undefined) mark(it.key, good); });
  let h = `<div class="top"><a href="#" onclick="home();return false">← Meniu</a><span>${esc(S.title)}</span><span></span></div><div class="card">`;
  if(S.mode==="sim"){
    const nota=(1+0.2*ok).toFixed(2);
    h += `<div>Nota obținută</div><div class="big ${ok>=20?"okc":"badc"}">${nota}</div>
    <div>${ok} corecte din 45 · specialitate ${okS}/25 · legislație ${okL}/20 · ultimii 10 de legislație ${okLast10}/10</div>
    <p><small>${ok>=20?"Peste minimul de 5,00. Ca să intri, contează locul în clasament: țintește 8+ (35 de corecte).":"Sub 5,00 (ai nevoie de minimum 20 de corecte). Refă capitolele unde ai greșit."}</small></p>`;
  } else {
    h += `<div class="big">${ok}/${n}</div><div>corecte</div>`;
  }
  h += `</div><h2>Revizuire</h2>`;
  S.list.forEach((it,i)=>{ const c=S.ans[i]; const good=c===it.a;
    h += `<div class="rev"><b class="${good?"okc":"badc"}">${i+1}. ${good?"✓":"✗"}</b> ${esc(it.q)}<br>
    ${good?"":`<small>Ai ales: ${c===undefined?"—":esc(it.o[c])}</small><br>`}<small>Corect: <b>${esc(it.o[it.a])}</b>${it.e?" — "+esc(it.e):""}</small></div>`; });
  h += `<div class="row" style="margin-top:12px"><button class="btn primary" onclick="home()">Înapoi la meniu</button></div>`;
  app.innerHTML=h; window.scrollTo(0,0);
}
home();
</script>
</body>
</html>
