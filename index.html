asului de cuantizare", "jumătate din pasul de cuantizare (±Δ/2)"], "a": 3, "e": "Zgomotul de cuantizare."}, {"id": "S09-014", "p": 2, "q": "Zgomotul de cuantizare poate fi redus prin:", "o": ["creșterea numărului de biți pe eșantion", "folosirea unei antene mai lungi", "eliminarea filtrului anti-aliasing", "reducerea frecvenței de eșantionare sub 2·f_max"], "a": 0, "e": "Mai mulți biți → pași mai mici."}, {"id": "S09-022", "p": 2, "q": "Un semnal cu f_max = 5 kHz este eșantionat la 8 kHz. Consecința este:", "o": ["eliminarea zgomotului de cuantizare", "refacerea perfectă a semnalului", "dublarea debitului", "apariția aliasingului, semnalul nu mai poate fi refăcut corect"], "a": 3, "e": "8 kHz < 10 kHz."}, {"id": "S09-026", "p": 2, "q": "Principalul avantaj al transmisiei digitale față de cea analogică pe distanțe mari este:", "o": ["regenerarea semnalului în repetoare, astfel încât zgomotul nu se acumulează", "imposibilitatea apariției erorilor", "lipsa nevoii de sincronizare", "banda mai îngustă necesară"], "a": 0, "e": "Regenerarea."}, {"id": "S09-027", "p": 2, "q": "Un dezavantaj al transmisiei digitale a vocii (PCM) față de transmisia analogică este:", "o": ["nu poate fi multiplexată", "necesită o lărgime de bandă mai mare", "zgomotul se acumulează la fiecare repetor", "nu poate fi criptată"], "a": 1, "e": "64 kbit/s față de 4 kHz."}, {"id": "S09-029", "p": 2, "q": "Singura pierdere ireversibilă de informație în procesul PCM (când eșantionarea respectă teorema) apare la:", "o": ["cuantizare", "transmisia fără erori", "codare", "eșantionare"], "a": 0, "e": "Eroarea de cuantizare."}, {"id": "S11-009", "p": 2, "q": "Un semnal cu frecvența maximă de 6 kHz este eșantionat la 10 kHz. Se poate reface corect semnalul?", "o": ["da, dacă se folosesc 16 biți pe eșantion", "da, dacă se folosește compandare", "nu, apare aliasing, deoarece 10 kHz < 12 kHz", "da, deoarece 10 kHz > 6 kHz"], "a": 2, "e": "fₑ trebuie să fie ≥ 12 kHz."}, {"id": "S11-014", "p": 2, "q": "Un amplificator cu câștigul de 20 dB mărește puterea semnalului de:", "o": ["2 ori", "20 de ori", "10 ori", "100 de ori"], "a": 3, "e": "10^(20/10)."}, {"id": "S11-023", "p": 2, "q": "Frecvența de 3 MHz corespunde unei lungimi de undă de:", "o": ["100 m", "1000 m", "1 m", "10 m"], "a": 0, "e": "300 / 3."}, {"id": "S09-012", "p": 3, "q": "Numărul de niveluri de cuantizare disponibile la codarea pe 7 biți este:", "o": ["128", "14", "256", "64"], "a": 0, "e": "2⁷ = 128."}, {"id": "S09-015", "p": 3, "q": "Fiecare bit în plus pe eșantion îmbunătățește raportul semnal/zgomot de cuantizare cu aproximativ:", "o": ["1 dB", "6 dB", "3 dB", "10 dB"], "a": 1, "e": "SNR ≈ 6,02·n + 1,76 dB."}, {"id": "S09-016", "p": 3, "q": "Cuantizarea neuniformă (compandarea) se folosește în telefonie pentru că:", "o": ["reduce frecvența de eșantionare la jumătate", "permite transmisia analogică", "asigură o calitate bună și pentru semnalele slabe, fără creșterea numărului de biți", "elimină complet zgomotul de cuantizare"], "a": 2, "e": "Pași mici pentru amplitudini mici."}, {"id": "S09-017", "p": 3, "q": "Legea de compandare folosită în Europa (inclusiv în România) este:", "o": ["legea A", "legea Ohm", "legea Shannon", "legea µ"], "a": 0, "e": "Legea µ se folosește în America de Nord și Japonia."}, {"id": "S09-021", "p": 3, "q": "Un semnal audio este eșantionat la 44,1 kHz, pe 16 biți, în stereo (2 canale). Debitul PCM este de aproximativ:", "o": ["64 kbit/s", "1,41 Mbit/s", "705 kbit/s", "88,2 kbit/s"], "a": 1, "e": "44.100 × 16 × 2."}, {"id": "S09-023", "p": 3, "q": "În modulația delta (DM), fiecare eșantion este codat pe:", "o": ["1 bit", "8 biți", "4 biți", "16 biți"], "a": 0, "e": "Indică doar dacă semnalul crește sau scade."}, {"id": "S09-024", "p": 3, "q": "Defectul modulației delta care apare când semnalul variază mai repede decât poate urmări pasul fix se numește:", "o": ["supraîncărcarea pantei", "dispersie modală", "aliasing", "diafonie"], "a": 0, "e": "Modulația delta."}, {"id": "S09-025", "p": 3, "q": "Codarea ADPCM a vocii permite un debit tipic de:", "o": ["2,048 Mbit/s", "32 kbit/s", "64 kbit/s", "1,544 Mbit/s"], "a": 1, "e": "ADPCM."}, {"id": "S09-028", "p": 3, "q": "La recepție, după decodare, semnalul analogic este refăcut cu ajutorul:", "o": ["unui filtru trece-sus", "unei antene", "unui filtru trece-jos de refacere", "unui multiplexor FDM"], "a": 2, "e": "Conversia N/A."}, {"id": "S11-004", "p": 3, "q": "Un dipol λ/2 pentru frecvența de 10 MHz are lungimea teoretică de:", "o": ["7,5 m", "15 m", "30 m", "3 m"], "a": 1, "e": "λ = 30 m; λ/2 = 15 m."}, {"id": "S11-006", "p": 3, "q": "Orizontul radio dintre două antene aflate la 4 m și, respectiv, 25 m înălțime este de aproximativ:", "o": ["12 km", "50 km", "29 km", "120 km"], "a": 2, "e": "4,12 × (2 + 5)."}, {"id": "S11-007", "p": 3, "q": "Două stații de radioreleu au antenele pe catarge de 100 m. Orizontul radio dintre ele este de aproximativ:", "o": ["41 km", "824 km", "200 km", "82 km"], "a": 3, "e": "4,12 × (10 + 10)."}, {"id": "S11-011", "p": 3, "q": "Numărul de niveluri de cuantizare la codarea pe 16 biți este:", "o": ["256", "1024", "32", "65.536"], "a": 3, "e": "2¹⁶."}, {"id": "S11-012", "p": 3, "q": "Un canal fără zgomot de 3 kHz transmite un semnal cu 16 niveluri. Debitul maxim Nyquist este:", "o": ["6 kbit/s", "96 kbit/s", "24 kbit/s", "48 kbit/s"], "a": 2, "e": "2 × 3000 × log₂16 = 2 × 3000 × 4."}, {"id": "S11-013", "p": 3, "q": "Un canal de 1 MHz are puterea semnalului egală cu puterea zgomotului (S/N = 0 dB). Capacitatea Shannon este:", "o": ["0 bit/s", "1 Mbit/s", "2 Mbit/s", "0,5 Mbit/s"], "a": 1, "e": "10⁶ × log₂(1 + 1)."}, {"id": "S11-015", "p": 3, "q": "O putere de 100 mW exprimată în dBm este:", "o": ["2 dBm", "100 dBm", "20 dBm", "10 dBm"], "a": 2, "e": "10 · log₁₀(100)."}, {"id": "S11-016", "p": 3, "q": "O putere de 0 dBm corespunde unei puteri de:", "o": ["1 W", "10 mW", "1 mW", "0 W"], "a": 2, "e": "dBm este referit la 1 mW."}, {"id": "S11-017", "p": 3, "q": "Două tronsoane de cablu atenuează 3 dB și, respectiv, 7 dB. Atenuarea totală este:", "o": ["10 dB, adică puterea scade de 10 ori", "4 dB", "21 dB", "10 dB, adică puterea scade de 2 ori"], "a": 0, "e": "Atenuările în dB se adună."}, {"id": "S11-019", "p": 3, "q": "Un comutator crossbar 50 × 50 are:", "o": ["50 de puncte de comutație", "100 de puncte de comutație", "250 de puncte de comutație", "2500 de puncte de comutație"], "a": 3, "e": "50²."}, {"id": "S11-020", "p": 3, "q": "Un grup FDM de 12 canale telefonice a câte 4 kHz ocupă o bandă de:", "o": ["12 kHz", "4 kHz", "64 kHz", "48 kHz"], "a": 3, "e": "12 × 4 kHz."}, {"id": "S11-021", "p": 3, "q": "Debitul purtătoarei T1, cu cadre de 193 de biți transmise de 8000 de ori pe secundă, este:", "o": ["1,536 Mbit/s", "2,048 Mbit/s", "193 kbit/s", "1,544 Mbit/s"], "a": 3, "e": "193 × 8000."}, {"id": "S11-022", "p": 3, "q": "Dacă puterea emițătorului crește de la 1 W la 10 W, nivelul semnalului crește cu:", "o": ["10 dB", "100 dB", "9 dB", "3 dB"], "a": 0, "e": "10 · log₁₀(10)."}]}, {"nr": 9, "id": "statutul-cadrelor", "t": "Statutul cadrelor militare", "tema": "Legea 80/1995 – grade, situații, îndatoriri, drepturi, interdicții, disciplină, degradare", "parte": "L", "stele": 3, "itemi": "2–3", "timp": "70 min", "sursa": "Legea 80/1995 – Cap. I art. 1–6; Cap. II art. 7–35; Cap. V art. 69–72", "ps": "<p>După curs devii <strong>subofițer<\/strong>, deci <strong>cadru militar<\/strong>. Legea asta e „contractul” tău cu statul: <strong>ce grade există<\/strong>, <strong>ce trebuie să faci<\/strong>, <strong>ce primești<\/strong>, <strong>ce n-ai voie<\/strong>, <strong>cum ești sancționat<\/strong> și <strong>când îți pierzi gradul<\/strong>.<\/p>", "fise": [{"t": "Cine sunt cadrele militare", "h": "<ul>\n<li><strong>Cadrele militare<\/strong> = <strong>cetățeni români<\/strong> care au primit grad de <strong>ofițer, maistru militar sau subofițer<\/strong>. Sunt <strong>în serviciul națiunii<\/strong>.<\/li>\n<li><strong>3 corpuri:<\/strong> <strong>ofițeri<\/strong>, <strong>maiștri militari<\/strong>, <strong>subofițeri<\/strong>.<\/li>\n<li><strong>Gradul<\/strong> este un <strong>drept<\/strong> al tău și se pierde <strong>numai<\/strong> în cazurile prevăzute de lege.<\/li>\n<li>În exercitarea atribuțiilor exerciți <strong>autoritatea publică<\/strong> și ești protejat de <strong>legea penală<\/strong> (cine te atacă în serviciu răspunde mai grav).<\/li>\n<\/ul>"}, {"t": "Gradele – scara ta de carieră", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gradele de subofițer\">\n  <g stroke-width=\"1.5\">\n    <rect x=\"20\" y=\"236\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-acs s-acc\"/>\n    <rect x=\"52\" y=\"192\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-acs s-acc\"/>\n    <rect x=\"84\" y=\"148\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"116\" y=\"104\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"148\" y=\"60\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"180\" y=\"16\" width=\"200\" height=\"38\" rx=\"8\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-b\"><text x=\"34\" y=\"260\">1 · Sergent<\/text><text x=\"66\" y=\"216\">2 · Sergent-major<\/text><text x=\"98\" y=\"172\">3 · Plutonier<\/text><text x=\"130\" y=\"128\">4 · Plutonier-major<\/text><text x=\"162\" y=\"84\">5 · Plutonier adjutant<\/text><text x=\"192\" y=\"40\">6 · Plt. adjutant principal<\/text><\/g>\n  <text x=\"250\" y=\"262\" class=\"t-acc t-b\" style=\"font-size:12px\">← gradul tău după curs<\/text>\n  <text x=\"20\" y=\"40\" class=\"t-mut\" style=\"font-size:12px\">2 × S<\/text><text x=\"20\" y=\"56\" class=\"t-mut\" style=\"font-size:12px\">4 × P<\/text>\n<\/svg><figcaption>Gradele de subofițer, de jos în sus. Primul tău grad după curs este sergent.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Corp<\/th>\n<th>Grade, de jos în sus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Subofițeri<\/strong><\/td>\n<td><strong>sergent<\/strong> → <strong>sergent-major<\/strong> → <strong>plutonier<\/strong> → <strong>plutonier-major<\/strong> → <strong>plutonier adjutant<\/strong> → <strong>plutonier adjutant principal<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Maiștri militari<\/strong><\/td>\n<td>clasa a <strong>V-a<\/strong> → a IV-a → a III-a → a II-a → clasa <strong>I<\/strong> → <strong>maistru militar principal<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ofițeri inferiori<\/strong><\/td>\n<td><strong>sublocotenent<\/strong> → <strong>locotenent<\/strong> → <strong>căpitan<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ofițeri superiori<\/strong><\/td>\n<td><strong>maior<\/strong> → <strong>locotenent-colonel<\/strong> → <strong>colonel<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Generali<\/strong><\/td>\n<td>general de brigadă ⭐ → general-maior ⭐⭐ → general-locotenent ⭐⭐⭐ → general ⭐⭐⭐⭐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>În aviație și marină:<\/strong> maior = <strong>locotenent-comandor<\/strong>; locotenent-colonel = <strong>căpitan-comandor<\/strong>; colonel = <strong>comandor<\/strong>.<\/p>\n<p><strong>Mareșal<\/strong> = cel mai înalt grad. Îl dă <strong>Președintele<\/strong>, <strong>numai în război<\/strong>, generalilor cu <strong>4 stele<\/strong>, pentru merite excepționale.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Subofițerii: „2 S + 4 P”<\/strong> → <strong>S<\/strong>ergent, <strong>S<\/strong>ergent-major, apoi <strong>P<\/strong>lutonier, <strong>P<\/strong>lutonier-major, <strong>P<\/strong>lutonier adjutant, <strong>P<\/strong>lutonier adjutant principal.<\/p><\/aside>"}, {"t": "Cele 3 situații ale unui cadru militar", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situația<\/th>\n<th>Când<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>În activitate<\/strong><\/td>\n<td>ocupă o <strong>funcție militară<\/strong>. Rămâne în activitate și când e la <strong>curs<\/strong>, <strong>suspendat<\/strong>, <strong>pus la dispoziție<\/strong>, <strong>bolnav<\/strong> sau <strong>în captivitate<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>În rezervă<\/strong><\/td>\n<td>nu are funcție, dar <strong>poate fi chemat<\/strong> (concentrat sau mobilizat)<\/td>\n<\/tr>\n<tr>\n<td><strong>În retragere<\/strong><\/td>\n<td><strong>nu mai poate fi chemat<\/strong> deloc<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>⚠️ În activitate pot fi <strong>doar cei cu cetățenie română și domiciliul în țară<\/strong>.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la un fotbalist: <strong>în activitate<\/strong> = e în lot; <strong>în rezervă<\/strong> = nu joacă, dar poate fi chemat; <strong>în retragere<\/strong> = s-a lăsat de fotbal.<\/p><\/aside>"}, {"t": "Îndatoririle principale (art. 8)", "h": "<ol>\n<li><strong>Loialitate<\/strong> față de stat și armată; să lupte pentru țară, <strong>chiar cu prețul vieții<\/strong>.<\/li>\n<li>Să respecte <strong>jurământul<\/strong> și regulamentele; să execute ordinele <strong>întocmai și la timp<\/strong>.<\/li>\n<li>Să prețuiască <strong>onoarea<\/strong> armatei și <strong>demnitatea uniformei<\/strong>.<\/li>\n<li>Să se pregătească și să-și <strong>instruiască subordonații<\/strong>.<\/li>\n<li>Să țină tehnica și armamentul <strong>în stare de funcționare<\/strong>.<\/li>\n<li>Să păstreze <strong>secretul militar, de stat și de serviciu<\/strong>.<\/li>\n<\/ol>\n<p>⚠️ <strong>Ordinele ilegale:<\/strong> nu ți se pot da și <strong>nu ai voie să execuți<\/strong> ordine contrare <strong>legii, obiceiurilor războiului și convențiilor internaționale<\/strong>. Dacă <strong>refuzi<\/strong> un astfel de ordin, <strong>nu răspunzi<\/strong> nici penal, nici civil.<\/p>\n<p><strong>Misiunile externe:<\/strong> cadrele în activitate au <strong>obligația<\/strong> să participe. Pot fi scutite, la cerere, cei cu <strong>familie monoparentală<\/strong>, <strong>întreținători unici<\/strong>, cu <strong>părinți sau soț invalizi<\/strong>, cu <strong>soțul în aceeași misiune<\/strong>, la <strong>calamități<\/strong>.<\/p>"}, {"t": "Drepturile, cu cifre", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Dreptul<\/th>\n<th>Cifra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Solda<\/strong> = solda de grad + solda de funcție + gradații + indemnizații<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Concediu fără plată<\/strong> pentru a-ți <strong>urma soțul în străinătate<\/strong> sau pentru <strong>organizații internaționale<\/strong><\/td>\n<td><strong>până la 4 ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Concediu fără plată<\/strong> pentru alte motive<\/td>\n<td><strong>până la 1 an<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Concediu de formare profesională<\/strong> (plătit)<\/td>\n<td><strong>până la 15 zile lucrătoare/an<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Compensația pentru chirie<\/strong> (mutat în altă garnizoană, fără locuință)<\/td>\n<td><strong>până la 50%<\/strong> din soldă<\/td>\n<\/tr>\n<tr>\n<td><strong>Soțul rămas fără serviciu<\/strong> la mutare<\/td>\n<td><strong>50%<\/strong> din solda ta, <strong>max 9 luni<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ajutor la deces<\/strong> pentru familie<\/td>\n<td><strong>2 solde lunare<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Uniforma după trecerea în rezervă<\/strong><\/td>\n<td>după <strong>20 de ani<\/strong> de serviciu + distincții<\/td>\n<\/tr>\n<tr>\n<td><strong>Pensie<\/strong><\/td>\n<td>pensie militară de stat<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Permisiile<\/strong> sunt pentru <strong>situații personale sau familiale deosebite<\/strong>; regulile sunt în regulamente.<\/li>\n<li>⚠️ <strong>Permisiile, scutirile și concediile medicale NU se scad<\/strong> din concediul de odihnă.<\/li>\n<li>La <strong>cursuri de zi<\/strong> primești <strong>vacanțe<\/strong> în loc de concediu.<\/li>\n<li><strong>Mobilizare sau război<\/strong> → concediile <strong>se întrerup<\/strong>, iar tu te prezinți <strong>imediat<\/strong> la unitate.<\/li>\n<li>Familia are <strong>asistență medicală gratuită<\/strong>.<\/li>\n<\/ul>"}, {"t": "Ce NU ai voie: interdicții și restrângeri ⚠️", "h": "<p><strong>Art. 28 – INTERZIS complet:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td>să fii membru de <strong>partid<\/strong> sau să faci <strong>propagandă politică<\/strong><\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td>să <strong>candidezi<\/strong> (local, Parlament, Parlamentul European, Președinte)<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td>să declari sau să participi la <strong>grevă<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Art. 29 – permis, dar cu limite:<\/strong><\/p>\n<ul>\n<li><strong>nu<\/strong> îți exprimi <strong>opiniile politice în public<\/strong>;<\/li>\n<li><strong>nu<\/strong> spui în public lucruri <strong>contra intereselor țării și ale armatei<\/strong>;<\/li>\n<li><strong>nu<\/strong> prezinți în public <strong>informații militare<\/strong> (doar cei desemnați);<\/li>\n<li><strong>religia<\/strong> e liberă, cu excepția cultelor contrare ordinii publice;<\/li>\n<li><strong>asocierea<\/strong> e permisă (sport, cultură, profesie), dar <strong>nu în sindicate<\/strong>;<\/li>\n<li><strong>nu<\/strong> participi la <strong>mitinguri politice sau sindicale<\/strong>;<\/li>\n<li><strong>călătoriile în străinătate<\/strong> se fac după <strong>ordinul ministrului<\/strong>;<\/li>\n<li>în <strong>stare de urgență, asediu, mobilizare, război<\/strong> se <strong>suspendă audiențele și petițiile<\/strong>.<\/li>\n<\/ul>\n<p><strong>Art. 30:<\/strong> nu ai voie să ai <strong>alte funcții<\/strong> sau să fii <strong>asociat unic / administrator<\/strong> de firmă.<\/p>\n<p><strong>Art. 31:<\/strong> rezerviștii <strong>concentrați<\/strong> pot rămâne în partide, dar <strong>nu fac politică în unitate<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Art. 28 = NU deloc<\/strong> (partid, candidatură, grevă). <strong>Art. 29 = DA, dar cu limite.<\/strong><\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca un <strong>arbitru de fotbal<\/strong>: are voie să iubească fotbalul, dar nu are voie să poarte tricoul unei echipe pe teren. Militarul servește <strong>toată țara<\/strong>, nu un partid.<\/p><\/aside>"}, {"t": "Disciplina, recompensele și sancțiunile", "h": "<ul>\n<li><strong>Disciplina militară<\/strong> se bazează pe <strong>acceptarea conștientă<\/strong> a normelor, pe <strong>recompense<\/strong> și pe <strong>sancțiuni<\/strong>.<\/li>\n<li><strong>Prerogativa disciplinară<\/strong> (dreptul de a recompensa și sancționa) aparține <strong>comandantului/șefului<\/strong>.<\/li>\n<li><strong>Abaterea disciplinară<\/strong> = fapta făcută <strong>cu vinovăție<\/strong> prin care încalci legi, regulamente sau ordine, <strong>dacă nu e infracțiune<\/strong>.<\/li>\n<li>Răspunderea poate fi <strong>disciplinară, materială, civilă sau penală<\/strong>.<\/li>\n<\/ul>\n<p><strong>Recompense:<\/strong> înaintare în grad <strong>excepțional<\/strong> sau <strong>înainte de termen<\/strong>, <strong>decorații<\/strong>, medalii, alte recompense.<\/p>\n<p><strong>Sancțiunile (7), de la ușor la greu:<\/strong><\/p>\n<ol>\n<li><strong>avertisment<\/strong>;<\/li>\n<li><strong>mustrare scrisă<\/strong>;<\/li>\n<li><strong>diminuarea soldei de funcție<\/strong> (max 3 luni);<\/li>\n<li><strong>diminuarea soldei de comandă<\/strong> (max 3 luni);<\/li>\n<li><strong>amânarea înaintării în grad<\/strong>, <strong>1–2 ani<\/strong>;<\/li>\n<li><strong>retrogradarea în funcție<\/strong>;<\/li>\n<li><strong>trecerea în rezervă<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>⚠️ <strong>O abatere = o singură sancțiune.<\/strong><\/li>\n<li>⚠️ Termene: <strong>6 luni<\/strong> de la <strong>constatare<\/strong>, dar <strong>nu mai târziu de 2 ani<\/strong> de la <strong>faptă<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>6 luni / 2 ani<\/strong>: șeful are 6 luni de când află, dar nu mai mult de 2 ani de când s-a întâmplat.<\/p><\/aside>"}, {"t": "Degradarea și scoaterea din evidență (art. 69–72)", "h": "<ul>\n<li><strong>Degradarea militară<\/strong> = pierderea gradului, ca <strong>pedeapsă complementară<\/strong>, dată de <strong>instanță<\/strong> (activ, rezervă sau retragere).<\/li>\n<li><strong>Scoaterea din evidență<\/strong> = pentru cei care <strong>renunță la cetățenia română<\/strong> sau iau <strong>altă cetățenie și se mută în străinătate<\/strong>.<\/li>\n<li><strong>Generalii<\/strong>: prin ordinul <strong>șefului Statului Major (General / al Apărării)<\/strong>; ceilalți: prin ordinul <strong>comandanților desemnați<\/strong>.<\/li>\n<li><strong>Revenirea:<\/strong><\/li>\n<li><strong>achitare<\/strong> → îți <strong>recapeți gradul<\/strong>; perioada contează la vechime; poți cere despăgubiri;<\/li>\n<li><strong>amnistie, grațiere, reabilitare<\/strong> → poți primi <strong>orice grad, până la cel avut<\/strong>; <strong>nu<\/strong> ești rechemat automat în activitate;<\/li>\n<li><strong>cetățenia recăpătată<\/strong> → poți fi reluat în evidență la <strong>repatriere<\/strong>.<\/li>\n<\/ul>"}], "flash": [["Cele 3 corpuri ale cadrelor militare?", "<b>Ofițeri, maiștri militari, subofițeri<\/b>."], ["Primul grad de subofițer?", "<b>Sergent<\/b>."], ["Gradele de subofițer, în ordine?", "<b>Sergent, sergent-major, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal<\/b>."], ["Cel mai înalt grad de subofițer?", "<b>Plutonier adjutant principal<\/b>."], ["Maior / colonel în aviație și marină?", "<b>Locotenent-comandor<\/b> / <b>comandor<\/b>."], ["General-maior are câte stele?", "<b>Două<\/b>."], ["Mareșal – cine, când, cui?", "<b>Președintele<\/b>, <b>numai în război<\/b>, generalilor cu <b>4 stele<\/b>."], ["Cele 3 situații ale cadrelor?", "<b>Activitate, rezervă, retragere<\/b>."], ["Cadrul militar în captivitate e…?", "Tot <b>în activitate<\/b>."], ["Condiția pentru activitate?", "<b>Cetățenie română și domiciliu în țară<\/b>."], ["Ordinul contrar legii?", "<b>Nu se execută<\/b>; refuzul nu atrage răspundere."], ["Ordinele se execută…?", "<b>Întocmai și la timp<\/b>."], ["Concediu fără plată pentru a-ți urma soțul în străinătate?", "<b>Până la 4 ani<\/b>."], ["Concediu fără plată pentru alte motive?", "<b>Până la 1 an<\/b>."], ["Concediu de formare profesională?", "<b>Până la 15 zile lucrătoare/an<\/b>."], ["Compensația pentru chirie?", "<b>Până la 50%<\/b> din soldă."], ["Ajutorul la deces?", "<b>2 solde lunare<\/b>."], ["Uniforma în rezervă – după câți ani?", "<b>20 de ani<\/b> + distincții."], ["Permisiile se scad din concediu?", "<b>Nu<\/b>."], ["Ce e interzis prin art. 28?", "<b>Partid, candidatură, grevă<\/b>."], ["Pot cadrele candida la Președinție?", "<b>Nu.<\/b>"], ["Opinii politice în public?", "<b>Nu<\/b> sunt permise."], ["Sindicat?", "<b>Nu<\/b>; alte asociații da."], ["Pe ce se bazează disciplina militară?", "<b>Acceptarea conștientă<\/b>, <b>recompense<\/b>, <b>sancțiuni<\/b>."], ["Cui aparține prerogativa disciplinară?", "<b>Comandantului/șefului<\/b>."], ["Abaterea disciplinară – condiția?", "Să <b>nu fie infracțiune<\/b>."], ["Sancțiunile cadrelor, în ordine?", "Avertisment, mustrare scrisă, diminuare soldă funcție, diminuare soldă comandă, amânare înaintare 1–2 ani, retrogradare în funcție, <b>trecere în rezervă<\/b>."], ["Câte sancțiuni pentru o abatere?", "<b>Una singură<\/b>."], ["Termenele de aplicare a sancțiunii?", "<b>6 luni<\/b> de la constatare, max <b>2 ani<\/b> de la faptă."], ["Degradarea militară o dă…?", "<b>Instanța<\/b>, ca pedeapsă complementară."], ["După amnistie, ce grad poți primi?", "<b>Orice grad, până la cel avut<\/b>."]], "q": [{"id": "L04-002", "p": 1, "q": "Cadrele militare sunt grupate în următoarele corpuri:", "o": ["generali, ofițeri și subofițeri", "ofițeri, subofițeri și soldați profesioniști", "ofițeri, subofițeri și personal civil", "ofițeri, maiștri militari și subofițeri"], "a": 3, "e": "Art. 2 alin. (1)."}, {"id": "L04-003", "p": 1, "q": "În MApN, primul grad din corpul subofițerilor este:", "o": ["sergent", "caporal", "fruntaș", "plutonier"], "a": 0, "e": "Art. 2 alin. (2¹) lit. A."}, {"id": "L04-004", "p": 1, "q": "Care este ordinea crescătoare corectă a gradelor de subofițer în MApN?", "o": ["sergent, sergent-major, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal", "caporal, sergent, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal", "sergent, plutonier, sergent-major, plutonier-major, plutonier adjutant, plutonier adjutant principal", "sergent, sergent-major, plutonier-major, plutonier, plutonier adjutant principal, plutonier adjutant"], "a": 0, "e": "Art. 2 alin. (2¹)."}, {"id": "L04-005", "p": 1, "q": "Cel mai înalt grad din corpul subofițerilor în MApN este:", "o": ["plutonier adjutant principal", "plutonier-major", "maistru militar principal", "plutonier adjutant"], "a": 0, "e": "Art. 2."}, {"id": "L04-011", "p": 1, "q": "Gradul de mareșal se poate acorda:", "o": ["în timp de război, pentru merite militare excepționale, de Președintele României, generalilor sau amiralilor cu 4 stele", "la ieșirea la pensie, generalilor cu peste 30 de ani vechime", "în timp de pace, de ministrul apărării, oricărui general", "de Parlament, la propunerea CSAT, în timp de pace"], "a": 0, "e": "Art. 2 alin. (3)."}, {"id": "L04-013", "p": 1, "q": "Situațiile în care se pot afla cadrele militare sunt:", "o": ["în activitate, în rezervă sau în retragere", "în activitate, în concediu sau în misiune", "în serviciu, în afara serviciului sau în retragere", "activ, pasiv sau mobilizat"], "a": 0, "e": "Art. 4."}, {"id": "L04-015" const $ = s => document.querySelector(s);

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const stars = n => "★".repeat(n) + "☆".repeat(3-n);

function qStats(c){ let ok=0, seen=0; c.q.forEach(q=>{ const s=st.q[q.id]; if(s!==undefined){ seen++; if(s===1) ok++; } }); return {ok, seen, n:c.q.length}; }

let curRoute = "home", T = null;
function route(){
  clearInterval(T);

  if (!h) return home();
  if (h==="examen") return page("examen","Cum arată examenul");

  if (h==="greseli") return wrongs();
  const m = h.match(/^([cfg])-(.+)$/);
  if (m){ const c = CH.find(x=>x.id===m[2]); if (c){ if (m[1]==="c") return chapter(c); if (m[1]==="f") return flash(c); return grile(c); } }
  home();
}

function chapter(c){
  st.last = c.id; save();
  const i = CH.indexOf(c), nx = CH[i+1];
  let h = `<header class="ch-head"><div class="ch-no">Capitolul ${pad(c.nr)} · ${PART[c.parte]}</div>

  if (c.ps) h += `<div class="ps"><div class="lbl">Pe scurt</div>${c.ps}</div>`;
  c.fise.forEach((f,k) => { h += `<article class="fisa" id="f${k+1}"><div class="fisa-h"><span class="n">${c.nr}.${k+1}</span><h2>${esc(f.t)}</h2></div>${f.h}</article>`; });
  if (c.sursa) h += `<p class="muted" style="font-size:14px">Bibliografie: ${esc(c.sursa)}</p>`;
  h += `<div class="ch-end"><h3>Ai citit capitolul? Acum fixează-l.</h3><div class="row">
      ${c.flash.length?`<a class="btn pri" href="#f-${c.id}">Flashcards (${c.flash.length})</a>`:''}
      <a class="btn ${c.flash.length?'':'pri'}" href="#g-${c.id}">Grile (${c.q.length})</a>
      <button class="btn" id="markRead">${st.read[c.id]?'✓ Capitol citit':'Marchează ca citit'}</button>
    </div>${nx?`<p style="margin-top:18px"><a class="btn" href="#c-${nx.id}">Capitolul ${pad(nx.nr)}: ${esc(nx.t)} →</a></p>`:''}</div>`;
  show(h, c.id);
  $("#markRead").onclick = () => { st.read[c.id] = !st.read[c.id]; save(); chapter(c); document.getElementById("markRead").scrollIntoView({block:"center"}); };
}

function flash(c){
  let deck = c.flash.map((x,i)=>i), pos = 0, known = 0, flipped = false;
  function draw(){
    if (pos >= deck.length){
      show(`<div class="ch-head"><div class="ch-no">Flashcards · cap. ${pad(c.nr)}</div><h1>Gata!</h1></div>
        <p>Ai trecut prin toate cele ${c.flash.length} cartonașe. Cele pe care nu le știai au revenit până le-ai știut.</p>
        <div class="row"><a class="btn pri" href="#g-${c.id}">Treci la grile (${c.q.length})</a><button class="btn" id="again">Încă o dată</button><a class="btn" href="#c-${c.id}">Înapoi la capitol</a></div>`, c.id);
      $("#again").onclick = () => flash(c); return;
    }
    const card = c.flash[deck[pos]];
    show(`<div class="qtop"><a href="#c-${c.id}">← Cap. ${pad(c.nr)}</a><span>Cartonașul ${Math.min(pos+1,deck.length)} din ${deck.length} · știute ${known}</span></div>
      <div class="bar" style="margin:8px 0"><i style="width:${known/c.flash.length*100}%"></i></div>
      <div class="fc-wrap"><button class="fc ${flipped?'flip':''}" id="card" aria-label="Întoarce cartonașul">
        <div class="fc-side fc-f"><div class="k">Întrebare</div><div class="x">${card[0]}</div><div class="hint">Atinge ca să vezi răspunsul</div></div>
        <div class="fc-side fc-b"><div class="k">Răspuns</div><div class="x">${card[1]}</div></div>
      </button></div>
      <div class="row"><button class="btn" id="no" ${flipped?'':'disabled'}>Nu știam</button><button class="btn pri" id="yes" ${flipped?'':'disabled'}>Știam</button></div>
      <p class="muted" style="font-size:14px">„Nu știam” pune cartonașul din nou la coadă.</p>`, c.id);
    $("#card").onclick = () => { flipped = !flipped; $("#card").classList.toggle("flip", flipped); $("#no").disabled = $("#yes").disabled = !flipped; };
    $("#yes").onclick = () => { known++; pos++; flipped=false; draw(); };
    $("#no").onclick = () => { deck.push(deck[pos]); pos++; flipped=false; draw(); };
  }
  draw();
}

/* ---------- grile ---------- */
function allQ(){ const a=[]; CH.forEach(c=>c.q.forEach(q=>a.push(Object.assign({cid:c.id, cnr:c.nr, parte:c.parte}, q)))); return a; }
function grile(c){
  const list = c.q.map(q=>Object.assign({cid:c.id, cnr:c.nr, parte:c.parte}, q));
  quiz({title:`Grile · cap. ${pad(c.nr)}`, back:`#c-${c.id}`, list, cur:c.id, practice:true, filter:true});
}
function wrongs(){
  const list = allQ().filter(q=>st.q[q.id]===0);
  if (!list.length){ show(`<div class="ch-head"><h1>Refă greșelile</h1></div><p>Nu ai nicio grilă greșită salvată. Rezolvă grilele de la capitole sau o simulare; ce greșești apare aici.</p><a class="btn pri" href="#">Înapoi la cuprins</a>`, "greseli"); return; }
  quiz({title:`Refă greșelile (${list.length})`, back:"#", list:shuffle(list), cur:"greseli", practice:true});
}
function pickWeighted(pool, n){
  const w = {1:3, 2:2, 3:1}; const bag = pool.slice(), out = [];
  while (out.length < n && bag.length){
    const tot = bag.reduce((a,q)=>a+w[q.p],0); let r = Math.random()*tot, k=0;
    for (; k<bag.length; k++){ r -= w[bag[k].p]; if (r<=0) break; }
    out.push(bag.splice(Math.min(k,bag.length-1),1)[0]);
  }
  return out;
}
function simIntro(){
  show(`<div class="ch-head"><div class="ch-no">Antrenament</div><h1>Simulare de examen</h1></div>
    <div class="fisa"><p><b>Exact ca la examen:</b> 45 de itemi (25 de specialitate și 20 de legislație), 90 de minute, un singur răspuns corect. Răspunsurile le vezi abia la final.</p>
    <p>Nota = <b>1 + 0,20 × răspunsuri corecte</b>. Minim de admitere: <b>5,00</b> (20 corecte). Țintă: <b>8,20</b> (36 corecte) sau mai mult.</p>
    <p class="muted">Întrebările se aleg la întâmplare, dar cele „foarte probabile” apar mai des. Fiecare simulare e diferită.</p></div>
    <div class="row"><button class="btn pri" id="go">Pornește cronometrul</button><a class="btn" href="#">Înapoi</a></div>`, "simulare");
  $("#go").onclick = () => {
    const a = allQ();
    const list = [...shuffle(pickWeighted(a.filter(q=>q.parte==="S"),25)), ...shuffle(pickWeighted(a.filter(q=>q.parte==="L"),20))];
    quiz({title:"Simulare de examen", back:"#simulare", list, cur:"simulare", practice:false, end:Date.now()+90*60000});
  };
}
function quiz(S){
  S.i = 0; S.ans = {}; S.perm = S.list.map(()=>[0,1,2,3]);
  S.view = S.list;
  function setFilter(p){ S.view = p ? S.list.filter(q=>q.p===p) : S.list; S.i = 0; S.ans = {}; draw(); }
  if (S.end){ T = setInterval(()=>{ const el=$("#timer"); const r=S.end-Date.now(); if(r<=0){ finish(); return; } if(el) el.textContent=`⏱ ${Math.floor(r/60000)}:${pad(Math.floor(r/1000)%60)}`; },1000); }
  function draw(){
    if (!S.view.length){ show(`<p>Nicio grilă în această categorie.</p>`, S.cur); return; }
    const it = S.view[S.i], ch = S.ans[S.i], fb = S.practice && ch!==undefined;
    let h = `<div class="qtop"><a href="${S.back}">← Înapoi</a><span>${esc(S.title)}</span><span id="timer" class="mono"></span></div>`;
    if (S.filter){ h += `<div style="margin:12px 0" class="seg">${[0,1,2,3].map(p=>`<button data-p="${p}" class="${(S.fp||0)===p?'on':''}">${p?PRIO[p]:'Toate'}</button>`).join('')}</div>`; }
    h += `<div class="bar" style="margin:8px 0"><i style="width:${(S.i+1)/S.view.length*100}%"></i></div>
      <div class="qtop"><span>Întrebarea ${S.i+1} din ${S.view.length}${S.end?(S.i<25?' · Specialitate':' · Legislație'):''}</span><span class="prio p${it.p}">${PRIO[it.p]}</span></div>
      <div class="q">${esc(it.q)}</div>`;
    it.o.forEach((o,k) => {
      let cls = "opt";
      if (fb){ if (k===it.a) cls+=" ok"; else if (k===ch) cls+=" bad"; } else if (ch===k) cls+=" sel";
      h += `<button class="${cls}" data-k="${k}" ${fb?'disabled':''}><b>${"abcd"[k]})</b><span>${esc(o)}</span></button>`;
    });
    if (fb) h += `<div class="fb"><b class="${ch===it.a?'okc':'badc'}">${ch===it.a?'Corect.':'Greșit.'}</b> Răspunsul corect: <b>${esc(it.o[it.a])}</b>${it.e?`<br><span class="muted">${esc(it.e)}</span>`:''}${it.cid&&S.cur==='greseli'?`<br><a href="#c-${it.cid}">Recitește capitolul ${pad(it.cnr)}</a>`:''}</div>`;
    h += `<div class="row" style="margin-top:12px"><button class="btn" id="prev" ${S.i===0?'disabled':''}>← Înapoi</button>
      ${S.i<S.view.length-1?`<button class="btn pri" id="next">Următoarea →</button>`:`<button class="btn pri" id="fin">Termină</button>`}</div>`;
    show(h, S.cur);
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ const k=+b.dataset.k; if (S.practice && S.ans[S.i]!==undefined) return; S.ans[S.i]=k; if (S.practice){ st.q[it.id] = k===it.a?1:0; save(); } draw(); });
    app.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{ S.fp=+b.dataset.p; setFilter(S.fp); });
    const pv=$("#prev"), nx=$("#next"), fn=$("#fin");
    if (pv) pv.onclick=()=>{ S.i--; draw(); };
    if (nx) nx.onclick=()=>{ S.i++; draw(); };
    if (fn) fn.onclick=finish;
  }
  function finish(){
    clearInterval(T);
    let ok=0, okS=0, okL=0, last10=0;
    S.view.forEach((q,i)=>{ const g=S.ans[i]===q.a; if(g){ ok++; if(q.parte==="S") okS++; else { okL++; if(i>=35) last10++; } } if(!S.practice && S.ans[i]!==undefined) st.q[q.id]=g?1:0; });
    save();
    let h = `<div class="qtop"><a href="${S.back}">← Înapoi</a><span>${esc(S.title)}</span><span></span></div><div class="fisa" style="padding-bottom:16px">`;
    if (S.end){ const nota=(1+0.2*ok).toFixed(2).replace(".",",");
      h += `<div class="muted">Nota obținută</div><div class="big ${ok>=20?'okc':'badc'}">${nota}</div>
      <div>${ok} corecte din 45 · specialitate ${okS}/25 · legislație ${okL}/20 · ultimii 10 de legislație ${last10}/10</div>
      <p class="muted">${ok>=36?'Excelent: peste ținta de 8,20.':ok>=20?'Peste minimul de 5,00. Țintește 8,20 (36 de corecte), pentru că intrarea se face în ordinea notelor.':'Sub 5,00. Refă capitolele de unde ai greșit și încearcă din nou.'}</p>`;
    } else h += `<div class="big">${ok}/${S.view.length}</div><div class="muted">răspunsuri corecte</div>`;
    h += `</div><div class="row"><a class="btn pri" href="#greseli">Refă greșelile</a><a class="btn" href="#">Cuprins</a></div><div class="toc-h" style="margin-top:22px">Revizuire</div>`;
    S.view.forEach((q,i)=>{ const c=S.ans[i], g=c===q.a;
      h += `<div class="rev"><b class="${g?'okc':'badc'}">${i+1}. ${g?'✓':'✗'}</b> ${esc(q.q)}${g?'':`<small>Ai ales: ${c===undefined?'—':esc(q.o[c])}</small>`}<small>Corect: <b>${esc(q.o[q.a])}</b>${q.e?' · '+esc(q.e):''}</small></div>`; });
    show(h, S.cur);
  }
  draw();
}
route();
</script>
