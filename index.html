o": ["înlocuiește căsătoria civilă", "este obligatorie pentru militari", "poate fi celebrată înaintea căsătoriei civile", "poate fi celebrată numai după căsătoria civilă"], "a": 3, "e": "Art. 48 alin. (2)."}, {"id": "L01-056", "p": 3, "q": "Pentru prejudiciile cauzate prin erorile judiciare răspunde patrimonial:", "o": ["statul", "Consiliul Superior al Magistraturii", "exclusiv judecătorul care a pronunțat hotărârea", "Ministerul Justiției, numai dacă erorile sunt intenționate"], "a": 0, "e": "Art. 52 alin. (3). Răspunderea statului nu înlătură răspunderea magistraților care au acționat cu rea-credință sau gravă neglijență."}, {"id": "L01-058", "p": 3, "q": "Restrângerea exercițiului unor drepturi trebuie să fie:", "o": ["aprobată prin referendum", "permanentă și aplicată tuturor cetățenilor", "proporțională cu situația care a determinat-o, aplicată nediscriminatoriu și fără a aduce atingere existenței dreptului", "aplicată numai militarilor"], "a": 2, "e": "Art. 53 alin. (2)."}, {"id": "L01-062", "p": 3, "q": "Potrivit art. 57, cetățenii români, cetățenii străini și apatrizii trebuie să-și exercite drepturile și libertățile constituționale:", "o": ["numai cu aprobarea autorităților", "cu bună-credință, fără să încalce drepturile și libertățile celorlalți", "în limita stabilită de CSAT", "numai pe teritoriul României"], "a": 1, "e": "Art. 57."}]}, {"nr": 3, "id": "unde-radio", "t": "Undele radio, frecvențele și antenele", "tema": "Rolul comunicațiilor militare, elemente de tactica armei, bazele comunicațiilor, linii radio, antene", "parte": "S", "stele": 3, "itemi": "3–4", "timp": "75 min", "sursa": "F.T.-T.-5.1 Manualul instrucției soldatului/gradatului voluntar din arma comunicații și informatică (2007), Cap. I art. 11–15, Cap. II art. 29–32, 37, Cap. III art. 140–152, 215–243, 267–299", "ps": "<p>Baza întregii specialități. Afli <strong>de ce există comunicațiile militare<\/strong>, <strong>ce mijloace de legătură există<\/strong>, <strong>cum circulă un semnal<\/strong>, <strong>gamele de frecvență<\/strong> (HF, VHF…) și <strong>cum funcționează antena<\/strong>. Ai și o singură formulă de știut: <strong>λ = 300 / f<\/strong>.<\/p>", "fise": [{"t": "De ce există comunicațiile militare", "h": "<p>Un comandant nu poate conduce dacă nu poate <strong>da ordine<\/strong> și <strong>primi rapoarte<\/strong>. Comunicațiile sunt <strong>sistemul nervos<\/strong> al armatei.<\/p>\n<ul>\n<li><strong>Sprijinul de comunicații și informatică (SCI)<\/strong> asigură <strong>schimbul de informații<\/strong> necesar <strong>comenzii și controlului<\/strong> forțelor.<\/li>\n<li>Este un <strong>sprijin de luptă<\/strong>: nu luptă direct, dar fără el nimeni nu poate lupta organizat.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Corpul omenesc: creierul (comandantul) nu poate mișca mâna (trupele) dacă <strong>nervii<\/strong> (comunicațiile) sunt tăiați.<\/p><\/aside>"}, {"t": "Cele 4 cerințe ale comunicațiilor militare", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cerință<\/th>\n<th>Ce înseamnă<\/th>\n<th>Întrebarea de control<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Operativitate<\/strong><\/td>\n<td>informația ajunge <strong>la timp<\/strong><\/td>\n<td>„Ajunge ordinul înainte să fie prea târziu?”<\/td>\n<\/tr>\n<tr>\n<td><strong>Fiabilitate<\/strong> (siguranță)<\/td>\n<td>sistemul merge <strong>chiar dacă un element cade<\/strong><\/td>\n<td>„Dacă pică o stație, mai am legătură?”<\/td>\n<\/tr>\n<tr>\n<td><strong>Continuitate<\/strong><\/td>\n<td>legătura <strong>nu se întrerupe<\/strong>, nici în deplasare<\/td>\n<td>„Am legătură și când ne mutăm?”<\/td>\n<\/tr>\n<tr>\n<td><strong>Securitate<\/strong><\/td>\n<td>inamicul <strong>nu află<\/strong> ce vorbim și unde suntem<\/td>\n<td>„Ne poate asculta sau localiza?”<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>În plus: <strong>mobilitate<\/strong>, <strong>flexibilitate<\/strong>, <strong>interoperabilitate<\/strong> (să putem vorbi cu aliații NATO), <strong>supraviețuire<\/strong> (rezistență la bruiaj și lovituri).<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>O-F-C-S<\/strong>: <strong>O<\/strong>perativitate, <strong>F<\/strong>iabilitate, <strong>C<\/strong>ontinuitate, <strong>S<\/strong>ecuritate.<\/p><\/aside>"}, {"t": "Cine răspunde de legătură", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Regula<\/th>\n<th>Cine face legătura<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>De sus în jos<\/strong><\/td>\n<td><strong>eșalonul superior<\/strong> face legătura cu <strong>subordonații<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>De la sprijin la sprijinit<\/strong><\/td>\n<td>cine <strong>sprijină<\/strong> face legătura cu cel <strong>sprijinit<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>De la întăritor la întărit<\/strong><\/td>\n<td>cine <strong>e dat în întărire<\/strong> face legătura cu cel întărit<\/td>\n<\/tr>\n<tr>\n<td><strong>De la stânga la dreapta<\/strong><\/td>\n<td>între vecini, <strong>cel din stânga<\/strong> o face spre <strong>cel din dreapta<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Indiferent de reguli, <strong>oricine<\/strong> constată că legătura s-a rupt ia măsuri să o refacă.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca într-o familie: <strong>părintele<\/strong> îl sună pe copil, nu invers. Cel care <strong>vine să ajute<\/strong> își anunță venirea celui ajutat.<\/p><\/aside>"}, {"t": "Mijloacele de legătură", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mijloc<\/th>\n<th>✅ Avantaj<\/th>\n<th>❌ Dezavantaj<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Radio<\/strong><\/td>\n<td>rapid, <strong>merge în mișcare<\/strong><\/td>\n<td>poate fi <strong>interceptat, bruiat, localizat<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Radioreleu<\/strong><\/td>\n<td>capacitate mare, pe direcții<\/td>\n<td>doar <strong>în linie de vedere<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Satelit<\/strong><\/td>\n<td>distanțe foarte mari<\/td>\n<td>scump, dependent de satelit<\/td>\n<\/tr>\n<tr>\n<td><strong>Fir / cablu<\/strong><\/td>\n<td><strong>cel mai sigur<\/strong>: nu poate fi bruiat sau ascultat ușor<\/td>\n<td><strong>greu de instalat și de mutat<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Curieri<\/strong> (mijloace mobile)<\/td>\n<td>foarte siguri<\/td>\n<td><strong>lenți<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Semnalizare<\/strong> (rachete, fanioane, sirene)<\/td>\n<td>simplu, imediat<\/td>\n<td>doar mesaje <strong>convenite dinainte<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>În mișcare → radio.<\/strong> <strong>Pe loc, cu mult trafic → fir sau radioreleu.<\/strong> <strong>Secret maxim → fir sau curier.<\/strong> <strong>Departe → HF sau satelit.<\/strong> Nimic nu e perfect, de aceea mijloacele <strong>se combină<\/strong>.<\/p><\/aside>"}, {"t": "Cum se organizează legăturile", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mod<\/th>\n<th>Cum arată<\/th>\n<th>Plus / minus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pe direcții (radial)<\/strong><\/td>\n<td>de la comandant <strong>câte o legătură directă<\/strong> spre fiecare subordonat<\/td>\n<td>sigur, dar consumă multe mijloace<\/td>\n<\/tr>\n<tr>\n<td><strong>Pe axă<\/strong><\/td>\n<td>o <strong>linie principală<\/strong> de-a lungul direcției de acțiune, la care se leagă subordonații<\/td>\n<td>economic, dar vulnerabil dacă se rupe axa<\/td>\n<\/tr>\n<tr>\n<td><strong>În rețea (nodal)<\/strong><\/td>\n<td><strong>noduri<\/strong> legate în ochiuri; traficul ocolește un nod distrus<\/td>\n<td><strong>cel mai fiabil<\/strong>, mai complex<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Centrul de comunicații al punctului de comandă (PC)<\/strong> = <strong>toate mijloacele<\/strong> de comunicații de la PC, organizate să lucreze <strong>împreună<\/strong>: stații radio, radioreleu, centrală telefonică, criptare, curieri.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Pe direcții<\/strong> = te suni cu fiecare prieten separat. <strong>În rețea<\/strong> = drumurile dintr-un oraș: dacă una e blocată, ocolești pe alta.<\/p><\/aside>"}, {"t": "Cum circulă un semnal", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Lanțul de transmisiune\">\n  <defs><marker id=\"ar1\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10z\" class=\"f-ink\"/><\/marker><\/defs>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\">\n    <rect x=\"4\" y=\"60\" width=\"72\" height=\"44\" rx=\"8\"/><rect x=\"164\" y=\"60\" width=\"72\" height=\"44\" rx=\"8\"/><rect x=\"324\" y=\"60\" width=\"72\" height=\"44\" rx=\"8\"/>\n  <\/g>\n  <rect x=\"84\" y=\"60\" width=\"72\" height=\"44\" rx=\"8\" class=\"f-acs s-acc\" stroke-width=\"1.5\"/>\n  <rect x=\"244\" y=\"60\" width=\"72\" height=\"44\" rx=\"8\" class=\"f-acs s-acc\" stroke-width=\"1.5\"/>\n  <g text-anchor=\"middle\" class=\"t-b\" style=\"font-size:11px\"><text x=\"40\" y=\"87\">SURSĂ<\/text><text x=\"120\" y=\"87\">EMIȚĂTOR<\/text><text x=\"200\" y=\"87\">CANAL<\/text><text x=\"280\" y=\"87\">RECEPTOR<\/text><text x=\"360\" y=\"87\">DESTINAȚ.<\/text><\/g>\n  <g class=\"s-ink\" stroke-width=\"1.5\" marker-end=\"url(#ar1)\"><line x1=\"76\" y1=\"82\" x2=\"83\" y2=\"82\"/><line x1=\"156\" y1=\"82\" x2=\"163\" y2=\"82\"/><line x1=\"236\" y1=\"82\" x2=\"243\" y2=\"82\"/><line x1=\"316\" y1=\"82\" x2=\"323\" y2=\"82\"/><\/g>\n  <path d=\"M200 20 v38\" class=\"s-red\" stroke-width=\"2\" marker-end=\"url(#ar1)\"/>\n  <text x=\"200\" y=\"14\" text-anchor=\"middle\" class=\"t-red t-b\">ZGOMOT + BRUIAJ<\/text>\n  <g text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\"><text x=\"40\" y=\"126\">vocea,<\/text><text x=\"40\" y=\"141\">datele<\/text>\n  <text x=\"120\" y=\"126\">stația<\/text><text x=\"120\" y=\"141\">care emite<\/text>\n  <text x=\"200\" y=\"126\">aer, cablu,<\/text><text x=\"200\" y=\"141\">fibră<\/text>\n  <text x=\"280\" y=\"126\">stația<\/text><text x=\"280\" y=\"141\">care primește<\/text>\n  <text x=\"360\" y=\"126\">omul care<\/text><text x=\"360\" y=\"141\">ascultă<\/text><\/g>\n  <text x=\"200\" y=\"185\" text-anchor=\"middle\" class=\"t-b\">Ca o scrisoare trimisă prin poștă<\/text>\n<\/svg><figcaption>Orice comunicație are aceeași schemă: cineva emite, mediul transportă, altcineva recepționează. Pe drum se adaugă zgomot.<\/figcaption><\/figure>\n\n<ul>\n<li><strong>Semnalul<\/strong> = ceea ce poartă informația (tensiune, curent, undă).<\/li>\n<li><strong>Analogic<\/strong> = variază <strong>continuu<\/strong> (vocea). <strong>Digital<\/strong> = doar <strong>0 și 1<\/strong>.<\/li>\n<li><strong>Banda vocii la telefon:<\/strong> <strong>300–3400 Hz<\/strong>.<\/li>\n<li><strong>Zgomotul<\/strong> = semnal nedorit. <strong>Raportul semnal/zgomot (S/N)<\/strong> spune cât de „curată” e recepția.<\/li>\n<\/ul>"}, {"t": "Modulația: cum „urcă” vocea pe o undă radio", "h": "<p>Vocea are frecvențe mici (sute de Hz). Ca s-o trimiți direct ți-ar trebui o antenă de <strong>zeci de kilometri<\/strong>. Așa că vocea se „pune” pe o <strong>undă purtătoare<\/strong> de frecvență mare. Asta se numește <strong>modulație<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tip<\/th>\n<th>Ce se modifică la purtătoare<\/th>\n<th>Unde e folosit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>MA (AM)<\/strong><\/td>\n<td><strong>amplitudinea<\/strong> (cât de „mare” e unda)<\/td>\n<td>radio pe unde medii<\/td>\n<\/tr>\n<tr>\n<td><strong>MF (FM)<\/strong><\/td>\n<td><strong>frecvența<\/strong> (cât de „deasă” e unda)<\/td>\n<td><strong>VHF tactic<\/strong>; mai <strong>rezistentă la zgomot<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>BLU (SSB)<\/strong><\/td>\n<td>AM cu <strong>o singură bandă laterală<\/strong>, fără purtătoare<\/td>\n<td><strong>HF<\/strong>; ocupă <strong>jumătate<\/strong> din bandă, economisește putere<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Purtătoarea e un <strong>camion<\/strong>, vocea e <strong>marfa<\/strong>. Modulația înseamnă să încarci marfa în camion ca să ajungă departe.<\/p><\/aside>"}, {"t": "Simplex, semi-duplex, duplex", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mod<\/th>\n<th>Ce înseamnă<\/th>\n<th>Exemplu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Simplex<\/strong> (unidirecțional)<\/td>\n<td>într-un singur sens<\/td>\n<td>radioul din mașină<\/td>\n<\/tr>\n<tr>\n<td><strong>Semi-duplex<\/strong><\/td>\n<td>în ambele sensuri, <strong>pe rând<\/strong><\/td>\n<td><strong>stația cu PTT<\/strong>: vorbești, apoi asculți<\/td>\n<\/tr>\n<tr>\n<td><strong>Duplex<\/strong><\/td>\n<td>în ambele sensuri, <strong>în același timp<\/strong><\/td>\n<td><strong>telefonul<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>În limbajul radio militar, „<strong>simplex<\/strong>” înseamnă și lucrul <strong>pe o singură frecvență<\/strong>, pe rând. La grilă, dacă te întreabă de <strong>stația cu PTT<\/strong>, răspunsul e <strong>semi-duplex<\/strong>.<\/p><\/aside>"}, {"t": "Gamele de frecvență", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gamele de frecvență\">\n  <g stroke-width=\"1.5\" class=\"s-ink\">\n    <rect x=\"4\" y=\"40\" width=\"64\" height=\"46\" class=\"f-paper\"/><rect x=\"68\" y=\"40\" width=\"64\" height=\"46\" class=\"f-paper\"/>\n    <rect x=\"132\" y=\"40\" width=\"64\" height=\"46\" class=\"f-ams\"/><rect x=\"196\" y=\"40\" width=\"64\" height=\"46\" class=\"f-acs\"/>\n    <rect x=\"260\" y=\"40\" width=\"64\" height=\"46\" class=\"f-paper\"/><rect x=\"324\" y=\"40\" width=\"64\" height=\"46\" class=\"f-paper\"/>\n  <\/g>\n  <g text-anchor=\"middle\" class=\"t-b t-l\"><text x=\"36\" y=\"69\">LF<\/text><text x=\"100\" y=\"69\">MF<\/text><text x=\"164\" y=\"69\" class=\"t-amb\">HF<\/text><text x=\"228\" y=\"69\" class=\"t-acc\">VHF<\/text><text x=\"292\" y=\"69\">UHF<\/text><text x=\"356\" y=\"69\">SHF<\/text><\/g>\n  <g text-anchor=\"middle\" class=\"t-m\" style=\"font-size:11px\"><text x=\"4\" y=\"104\" text-anchor=\"start\">30k<\/text><text x=\"68\" y=\"104\">300k<\/text><text x=\"132\" y=\"104\">3M<\/text><text x=\"196\" y=\"104\">30M<\/text><text x=\"260\" y=\"104\">300M<\/text><text x=\"324\" y=\"104\">3G<\/text><text x=\"388\" y=\"104\" text-anchor=\"end\">30G<\/text><\/g>\n  <text x=\"200\" y=\"26\" text-anchor=\"middle\" class=\"t-mut\">frecvența crește spre dreapta →<\/text>\n  <path d=\"M132 120 h64\" class=\"s-amb\" stroke-width=\"3\"/><path d=\"M196 120 h64\" class=\"s-acc\" stroke-width=\"3\"/>\n  <g text-anchor=\"end\"><text x=\"188\" y=\"142\" class=\"t-amb t-b\">HF 3–30 MHz<\/text><text x=\"188\" y=\"158\" class=\"t-amb\" style=\"font-size:12px\">unde scurte<\/text><text x=\"188\" y=\"173\" class=\"t-amb\" style=\"font-size:12px\">distanțe mari<\/text><\/g>\n  <g text-anchor=\"start\"><text x=\"206\" y=\"142\" class=\"t-acc t-b\">VHF 30–300 MHz<\/text><text x=\"206\" y=\"158\" class=\"t-acc\" style=\"font-size:12px\">unde ultrascurte<\/text><text x=\"206\" y=\"173\" class=\"t-acc\" style=\"font-size:12px\">tactic: 30–88 MHz<\/text><\/g>\n  <text x=\"200\" y=\"202\" text-anchor=\"middle\" class=\"t-mut\">← unde lungi · · · · · · · · · · · unde scurte →<\/text>\n<\/svg><figcaption>Gamele radio în ordine. Cu cât frecvența e mai mare, cu atât unda e mai scurtă.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Gama<\/th>\n<th>Frecvențe<\/th>\n<th>Undele se numesc<\/th>\n<th>Folosire militară<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LF<\/strong><\/td>\n<td>30–300 kHz<\/td>\n<td>lungi (kilometrice)<\/td>\n<td>navigație<\/td>\n<\/tr>\n<tr>\n<td><strong>MF<\/strong><\/td>\n<td>0,3–3 MHz<\/td>\n<td>medii<\/td>\n<td>radiodifuziune AM<\/td>\n<\/tr>\n<tr>\n<td><strong>HF<\/strong><\/td>\n<td><strong>3–30 MHz<\/strong><\/td>\n<td><strong>scurte (decametrice)<\/strong><\/td>\n<td><strong>distanțe mari<\/strong> (prin ionosferă)<\/td>\n<\/tr>\n<tr>\n<td><strong>VHF<\/strong><\/td>\n<td><strong>30–300 MHz<\/strong><\/td>\n<td><strong>ultrascurte (metrice)<\/strong><\/td>\n<td><strong>radio tactic: 30–88 MHz<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>UHF<\/strong><\/td>\n<td>0,3–3 GHz<\/td>\n<td>decimetrice<\/td>\n<td>radioreleu, aviație, satelit<\/td>\n<\/tr>\n<tr>\n<td><strong>SHF<\/strong><\/td>\n<td>3–30 GHz<\/td>\n<td>centimetrice<\/td>\n<td>radioreleu, satelit, radar<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Ordinea gamelor:<\/strong> <strong>L<\/strong>ow → <strong>M<\/strong>edium → <strong>H<\/strong>igh → <strong>V<\/strong>ery <strong>H<\/strong>igh → <strong>U<\/strong>ltra <strong>H<\/strong>igh → <strong>S<\/strong>uper <strong>H<\/strong>igh. Fiecare e de <strong>10 ori<\/strong> peste cea dinainte.<\/p><\/aside>"}, {"t": "Formula de aur: λ = 300 / f", "h": "<p><strong>Lungimea de undă (λ)<\/strong> = distanța dintre două „creste” ale undei.<\/p>\n<blockquote><p><strong>λ [metri] = 300 / f [MHz]<\/strong><\/p><\/blockquote><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>30 MHz<\/strong> → λ = 300/30 = <strong>10 m<\/strong>. <strong>75 MHz<\/strong> → λ = <strong>4 m<\/strong>. <strong>300 MHz<\/strong> → λ = <strong>1 m<\/strong>. <strong>7 MHz<\/strong> → λ ≈ <strong>43 m<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Valurile pe apă: <strong>valuri dese<\/strong> (frecvență mare) sunt <strong>scurte<\/strong>, <strong>valuri rare<\/strong> (frecvență mică) sunt <strong>lungi<\/strong>. Produsul lor e mereu același: viteza luminii.<\/p><\/aside>"}, {"t": "Antena", "h": "<p><strong>Antena<\/strong> transformă semnalul electric în <strong>undă radio<\/strong> (la emisie) și invers (la recepție). Aceeași antenă le face pe amândouă.<\/p>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 220\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Antena bici și dipolul\">\n  <rect x=\"40\" y=\"160\" width=\"100\" height=\"22\" rx=\"4\" class=\"f-line\"/>\n  <text x=\"90\" y=\"176\" text-anchor=\"middle\" style=\"font-size:12px\">stația / masa<\/text>\n  <line x1=\"90\" y1=\"160\" x2=\"90\" y2=\"40\" class=\"s-acc\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n  <path d=\"M110 40 v120\" class=\"s-mut\" stroke-width=\"1.2\"/><path d=\"M105 40 h10 M105 160 h10\" class=\"s-mut\" stroke-width=\"1.2\"/>\n  <text x=\"120\" y=\"104\" class=\"t-b t-acc t-l\">λ/4<\/text>\n  <text x=\"90\" y=\"24\" text-anchor=\"middle\" class=\"t-b\">BICI<\/text>\n  <text x=\"90\" y=\"204\" text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\">verticală, în toate direcțiile<\/text>\n  <line x1=\"215\" y1=\"100\" x2=\"290\" y2=\"100\" class=\"s-amb\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n  <line x1=\"306\" y1=\"100\" x2=\"381\" y2=\"100\" class=\"s-amb\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n  <circle cx=\"298\" cy=\"100\" r=\"5\" class=\"f-ink\"/><line x1=\"298\" y1=\"105\" x2=\"298\" y2=\"160\" class=\"s-ink\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"298\" y=\"176\" text-anchor=\"middle\" style=\"font-size:12px\">cablu spre stație<\/text>\n  <path d=\"M215 72 h166\" class=\"s-mut\" stroke-width=\"1.2\"/><path d=\"M215 67 v10 M381 67 v10\" class=\"s-mut\" stroke-width=\"1.2\"/>\n  <text x=\"298\" y=\"62\" text-anchor=\"middle\" class=\"t-b t-amb t-l\">λ/2<\/text>\n  <text x=\"298\" y=\"24\" text-anchor=\"middle\" class=\"t-b\">DIPOL<\/text>\n  <text x=\"298\" y=\"204\" text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\">două brațe de câte λ/4 · ≈ 73 Ω<\/text>\n<\/svg><figcaption>Antena bici are un sfert de lungime de undă. Dipolul are o jumătate.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Antena<\/th>\n<th>Lungimea<\/th>\n<th>Radiază<\/th>\n<th>Folosire<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bici<\/strong> (verticală)<\/td>\n<td><strong>λ/4<\/strong><\/td>\n<td><strong>în toate direcțiile<\/strong> (omnidirecțională)<\/td>\n<td><strong>rețele radio<\/strong> (corespondenții sunt peste tot)<\/td>\n<\/tr>\n<tr>\n<td><strong>Dipol<\/strong><\/td>\n<td><strong>λ/2<\/strong> (impedanță ≈ <strong>73 Ω<\/strong>)<\/td>\n<td>în două direcții<\/td>\n<td>HF, antene fixe<\/td>\n<\/tr>\n<tr>\n<td><strong>Directivă<\/strong> (Yagi, parabolă)<\/td>\n<td>—<\/td>\n<td><strong>într-o singură direcție<\/strong>, cu câștig mare<\/td>\n<td><strong>radioreleu<\/strong>, punct la punct<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Polarizarea<\/strong> = orientarea undei. Antena <strong>verticală<\/strong> dă polarizare <strong>verticală<\/strong>. ⚠️ <strong>Ambele antene trebuie să aibă aceeași polarizare.<\/strong><\/li>\n<li><strong>SWR (raportul de unde staționare)<\/strong> arată cât de bine e adaptată antena. <strong>Ideal: 1:1.<\/strong> Dacă e mare, puterea se întoarce în stație și se pierde.<\/li>\n<li><strong>Înălțimea antenei<\/strong> contează enorm în VHF: <strong>mai sus = mai departe<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Antena bici pentru <strong>75 MHz<\/strong>: λ = 4 m → λ/4 = <strong>1 m<\/strong>. Dipol pentru <strong>150 MHz<\/strong>: λ = 2 m → λ/2 = <strong>1 m<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Antena omnidirecțională e un <strong>bec<\/strong>: luminează în toate părțile. Antena directivă e o <strong>lanternă<\/strong>: bate departe, dar într-o singură direcție.<\/p><\/aside>"}, {"t": "Ce determină bătaia unei stații", "h": "<p><strong>Bătaia<\/strong> = distanța maximă la care ai legătură. Depinde de:<\/p>\n<ol>\n<li><strong>puterea<\/strong> emițătorului;<\/li>\n<li><strong>sensibilitatea<\/strong> receptorului;<\/li>\n<li><strong>antena<\/strong>: tip, <strong>înălțime<\/strong>, orientare;<\/li>\n<li><strong>frecvența<\/strong> (gama);<\/li>\n<li><strong>terenul<\/strong>: dealuri, păduri, clădiri;<\/li>\n<li><strong>zgomotul și bruiajul<\/strong>.<\/li>\n<\/ol>\n<p><strong>Retranslația (releul):<\/strong> o stație pe un <strong>punct înalt<\/strong> primește și <strong>retransmite<\/strong>. Așa <strong>mărești bătaia<\/strong> și <strong>ocolești obstacolele<\/strong>.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Releul e ca un om urcat pe deal care <strong>strigă mai departe<\/strong> ce aude de la tine.<\/p><\/aside>"}], "flash": [["Ce asigură sprijinul C&I?", "<b>Schimbul de informații<\/b> necesar comenzii și controlului forțelor."], ["Ce categorie de sprijin e SCI?", "<b>Sprijin de luptă<\/b>."], ["Cele 4 cerințe principale ale comunicațiilor?", "<b>Operativitate, fiabilitate, continuitate, securitate<\/b>."], ["Ce e operativitatea?", "Informația ajunge <b>la timp<\/b>."], ["Ce e interoperabilitatea?", "Capacitatea de a comunica <b>cu aliații (NATO)<\/b>."], ["Cine face legătura cu subordonații?", "<b>Eșalonul superior<\/b> (de sus în jos)."], ["Între vecini, cine face legătura?", "Cel din <b>stânga<\/b> spre cel din <b>dreapta<\/b>."], ["Între sprijin și sprijinit?", "<b>Cel care sprijină<\/b>."], ["Cel mai sigur mijloc față de interceptare?", "<b>Firul<\/b> (și curierii)."], ["Principalul mijloc în mișcare?", "<b>Radioul<\/b>."], ["Organizarea cea mai fiabilă a legăturilor?", "<b>În rețea (nodal)<\/b>: traficul ocolește nodurile distruse."], ["Ce e modulația?", "„Punerea” informației pe o <b>undă purtătoare<\/b> de frecvență mare."], ["AM vs FM?", "AM variază <b>amplitudinea<\/b>; FM variază <b>frecvența<\/b> și e mai rezistentă la zgomot."], ["Avantajul BLU (SSB)?", "Ocupă <b>jumătate din bandă<\/b> și economisește putere."], ["Stația cu PTT lucrează în…?", "<b>Semi-duplex<\/b> (pe rând)."], ["Telefonul lucrează în…?", "<b>Duplex<\/b> (simultan)."], ["Banda vocii la telefon?", "<b>300–3400 Hz<\/b>"], ["Gama HF?", "<b>3–30 MHz<\/b>, unde <b>scurte (decametrice)<\/b>."], ["Gama VHF?", "<b>30–300 MHz<\/b>, unde <b>ultrascurte (metrice)<\/b>."], ["Banda VHF tactică?", "<b>30–88 MHz<\/b>"], ["Formula lungimii de undă?", "<b>λ = 300 / f[MHz]<\/b> metri"], ["λ la 30 MHz? La 300 MHz?", "<b>10 m<\/b>. <b>1 m<\/b>."], ["Antena bici are lungimea…?", "<b>λ/4<\/b>; e verticală și <b>omnidirecțională<\/b>."], ["Antena bici pentru 75 MHz?", "λ = 4 m → <b>1 m<\/b>"], ["Dipolul are lungimea…? Impedanța?", "<b>λ/2<\/b>; aproximativ <b>73 Ω<\/b>."], ["Ce antenă la radioreleu?", "<b>Directivă<\/b> (câștig mare, o singură direcție)."], ["Polarizarea antenelor celor doi corespondenți?", "<b>Aceeași<\/b>."], ["SWR ideal?", "<b>1:1<\/b>"], ["Cum mărești bătaia VHF și ocolești dealurile?", "<b>Retranslație<\/b> (releu) pe un punct înalt."]], "q": [{"id": "S01-003", "p": 1, "q": "Cerința ca informația să ajungă la destinatar în timp util se numește:", "o": ["operativitate", "interoperabilitate", "multiplexare", "polarizare"], "a": 0, "e": "Cerințele comunicațiilor militare."}, {"id": "S01-006", "p": 1, "q": "Potrivit regulilor de responsabilitate pentru realizarea legăturilor, de legătura cu subordonații răspunde:", "o": ["subordonatul", "eșalonul superior", "vecinul din dreapta", "structura logistică"], "a": 1, "e": "Regula „de sus în jos”."}, {"id": "S01-007", "p": 1, "q": "În cazul legăturii între vecini, răspunderea pentru realizarea legăturii revine, de regulă:", "o": ["eșalonului inferior", "unității cu efectivul cel mai mare", "unității din stânga față de cea din dreapta", "unității din dreapta față de cea din stânga"], "a": 2, "e": "Regula „de la stânga la dreapta”."}, {"id": "S01-009", "p": 1, "q": "Care dintre următoarele mijloace de legătură este cel mai greu de interceptat și bruiat de inamic?", "o": ["legătura radio HF", "legătura radio VHF", "legătura prin satelit", "legătura prin fir"], "a": 3, "e": "Firul nu radiază energie în spațiu, deci nu poate fi bruiat sau localizat ușor."}, {"id": "S01-010", "p": 1, "q": "În timpul deplasării trupelor, mijlocul principal de legătură este:", "o": ["semnalizarea cu fanioane", "curierul pe jos", "radioul", "cablul de campanie"], "a": 2, "e": "Radioul permite legătura în mișcare."}, {"id": "S01-020", "p": 1, "q": "Modul de lucru în care transmisia se face în ambele sensuri, dar alternativ (nu simultan), ca la stațiile radio cu PTT, se numește:", "o": ["multiplex", "transmisie unidirecțională (broadcast)", "duplex", "semi-duplex"], "a": 3, "e": "Moduri de lucru. În terminologia radio militară, lucrul alternativ pe o singură frecvență se mai numește „simplex”."}, {"id": "S01-024", "p": 1, "q": "Gama de unde HF (unde scurte, decametrice) corespunde frecvențelor:", "o": ["3–30 MHz", "300 kHz–3 MHz", "300 MHz–3 GHz", "30–300 MHz"], "a": 0, "e": "Gamele de frecvențe."}, {"id": "S01-025", "p": 1, "q": "Gama de unde VHF (unde ultrascurte, metrice) corespunde frecvențelor:", "o": ["3–30 MHz", "30–300 MHz", "30–300 kHz", "300 MHz–3 GHz"], "a": 1, "e": "Gamele de frecvențe."}, {"id": "S01-027", "p": 1, "q": "Banda VHF folosită de stațiile radio tactice de luptă (NATO) este de aproximativ:", "o": ["88–108 MHz", "1–2 GHz", "3–30 MHz", "30–88 MHz"], "a": 3, "e": "Banda tactică VHF FM."}, {"id": "S01-028", "p": 1, "q": "Relația dintre lungimea de undă λ și frecvența f este:", "o": ["λ = c / f, unde c este viteza luminii", "λ = c · f", "λ = f / c", "λ = 1 / (c · f)"], "a": 0, "e": "c = 3·10⁸ m/s."}, {"id": "S01-029", "p": 1, "q": "Care este lungimea de undă a unui semnal cu frecvența de 30 MHz?", "o": ["10 m", "3 m", "100 m", "1 m"], "a": 0, "e": "λ = 300/30 = 10 m."}, {"id": "S01-031", "p": 1, "q": "O antenă verticală „bici” în sfert de undă pentru frecvența de 75 MHz are lungimea teoretică de:", "o": ["1 m", "4 m", "0,5 m", "2 m"], "a": 0, "e": "λ = 300/75 = 4 m; λ/4 = 1 m."}, {"id": "S01-034", "p": 1, "q": "Antena verticală de tip „bici” are, în plan orizontal, o diagramă de radiație:", "o": ["nulă", "omnidirecțională", "puternic directivă, într-o singură direcție", "bidirecțională, numai înainte și înapoi"], "a": 1, "e": "Bună pentru rețele radio."}, {"id": "S01-036", "p": 1, "q": "Pentru o legătură radio eficientă, antenele celor doi corespondenți trebuie să aibă:", "o": ["aceeași polarizare", "polarizări perpendiculare", "lungimi diferite", "culori diferite"], "a": 0, "e": "Nepotrivirea polarizării produce pierderi mari."}, {"id": "S01-040", "p": 1, "q": "Zona în care nu se recepționează nici unda de suprafață, nici unda reflectată de ionosferă, se numește:", "o": ["zonă de tăcere (skip zone)", "zonă Fresnel", "zonă de umbră electromagnetică artificială", "zonă de acoperire"], "a": 0, "e": "Specifică HF."}, {"id": "S01-041", "p": 1, "q": "Unda care se propagă în linie dreaptă de la antena de emisie la cea de recepție, caracteristică gamelor VHF/UHF, se numește:", "o": ["undă ionosferică", "undă directă", "undă reflectată de ionosferă", "undă de suprafață"], "a": 1, "e": "Propagare."}, {"id": "S01-001", "p": 2, "q": "Sprijinul de comunicații și informatică are ca scop principal:", "o": ["asigurarea schimbului de informații necesar comenzii și controlului forțelor", "asigurarea hranei și echipamentului trupelor", "asigurarea pazei obiectivelor militare", "asigurarea transportului de muniție"], "a": 0, "e": "Rolul SCI în operații."}, {"id": "S01-002", "p": 2, "q": "Sprijinul de comunicații și informatică face parte din categoria:", "o": ["sprijinului medical", "forțelor de manevră", "sprijinului de luptă", "forțelor de protecție civilă"], "a": 2, "e": "SCI este un sprijin al conducerii, un sprijin de luptă."}, {"id": "S01-004", "p": 2, "q": "Capacitatea sistemului de comunicații de a funcționa chiar dacă unele elemente sunt scoase din funcțiune se numește:", "o": ["directivitate", "modulație", "fiabilitate (siguranță în funcționare)", "operativitate"], "a": 2, "e": "Se obține prin rute alternative și mijloace de rezervă."}, {"id": "S01-005", "p": 2, "q": "Capacitatea de a comunica cu structuri ale altor state aliate (NATO) se numește:", "o": ["fiabilitate", "interoperabilitate", "mobilitate", "continuitate"], "a": 1, "e": "Cerințele comunicațiilor militare."}, {"id": "S01-008", "p": 2, "q": "Între o structură care sprijină și una sprijinită, legătura o realizează:", "o": ["structura sprijinită", "cea mai apropiată unitate civilă", "structura care sprijină", "eșalonul inferior celor două"], "a": 2, "e": "Regula „de la sprijin la sprijinit”."}, {"id": "S01-011", "p": 2, "q": "Modul de organizare a legăturilor în care punctele de comandă sunt legate prin noduri interconectate, astfel încât traficul poate ocoli un nod distrus, se numește:", "o": ["pe direcții (radial)", "liniar simplu", "pe axă", "în rețea (nodal)"], "a": 3, "e": "Organizarea în rețea are fiabilitatea cea mai mare."}, {"id": "S01-012", "p": 2, "q": "Modul de organizare în care de la PC-ul superior pleacă câte o legătură directă spre fiecare subordonat se numește:", "o": ["în inel", "pe axă", "în rețea", "pe direcții (radial)"], "a": 3, "e": "Moduri de organizare a legăturilor."}, {"id": "S01-014", "p": 2, "q": "Semnalul analogic este semnalul care:", "o": ["poate lua doar două valori, 0 și 1", "are întotdeauna frecvența de 1 kHz", "se transmite numai prin fibră optică", "variază continuu în timp"], "a": 3, "e": "Bazele comunicațiilor."}, {"id": "S01-015", "p": 2, "q": "Banda de frecvențe a canalului telefonic standard pentru voce este:", "o": ["300–3400 Hz", "3–30 MHz", "20 Hz–20 kHz", "30–88 MHz"], "a": 0, "e": "Canalul telefonic standard."}, {"id": "S01-016", "p": 2, "q": "Procesul prin care informația (de exemplu vocea) este „pusă” pe o undă purtătoare de frecvență mare se numește:", "o": ["modulație", "eșantionare", "demodulație", "multiplexare"], "a": 0, "e": "Bazele comunicațiilor."}, {"id": "S01-017", "p": 2, "q": "Modulația în care variază amplitudinea purtătoarei se numește:", "o": ["modulație de frecvență (MF/FM)", "modulație de fază (PM)", "modulație în cod de impulsuri (PCM)", "modulație de amplitudine (MA/AM)"], "a": 3, "e": "Tipuri de modulație."}, {"id": "S01-018", "p": 2, "q": "Comparativ cu modulația de amplitudine, modulația de frecvență este:", "o": ["imposibil de folosit în VHF", "identică din punctul de vedere al zgomotului", "mai puțin sensibilă la zgomote și perturbații", "mai sensibilă la zgomote"], "a": 2, "e": "FM are imunitate mai bună la zgomot."}, {"id": "S01-021", "p": 2, "q": "Modul de lucru în care transmisia are loc simultan în ambele sensuri se numește:", "o": ["duplex", "broadcast", "simplex", "semi-duplex"], "a": 0, "e": "Moduri de lucru."}, {"id": "S01-023", "p": 2, "q": "Pentru a mări bătaia unei legături VHF și a ocoli obstacolele de teren se folosește:", "o": ["trecerea pe AM", "reducerea puterii emițătorului", "o stație de retranslație (releu) dispusă pe un punct înalt", "o antenă mai scurtă"], "a": 2, "e": "Retranslația."}, {"id": "S01-026", "p": 2, "q": "Undele decametrice (scurte) corespund gamei:", "o": ["LF", "VHF", "UHF", "HF"], "a": 3, "e": "HF: λ între 100 m și 10 m."}, {"id": "S01-030", "p": 2, "q": "Care este lungimea de undă a unui semnal cu frecvența de 300 MHz?", "o": ["0,1 m", "1 m", "10 m", "100 m"], "a": 1, "e": "λ = 300/300 = 1 m."}, {"id": "S01-033", "p": 2, "q": "Funcția antenei de emisie este de a:", "o": ["transforma semnalul electric de radiofrecvență în undă electromagnetică radiată în spațiu", "cripta semnalul", "stoca energia electrică", "amplifica semnalul audio"], "a": 0, "e": "Antene."}, {"id": "S01-037", "p": 2, "q": "Antena verticală produce o undă cu polarizare:", "o": ["nedefinită", "circulară obligatoriu", "verticală", "orizontală"], "a": 2, "e": "Polarizarea este dată de orientarea câmpului electric."}, {"id": "S01-042", "p": 2, "q": "Gamele de frecvențe în ordine crescătoare sunt:", "o": ["MF, LF, HF, UHF, VHF, SHF", "HF, LF, MF, VHF, SHF, UHF", "VHF, HF, UHF, LF, MF, SHF", "LF, MF, HF, VHF, UHF, SHF"], "a": 3, "e": "Gamele de frecvențe."}, {"id": "S01-013", "p": 3, "q": "Centrul de comunicații al punctului de comandă reprezintă:", "o": ["clădirea statului major", "totalitatea mijloacelor de comunicații dispuse la PC, organizate să lucreze unitar", "punctul de alimentare cu combustibil", "un singur post radio"], "a": 1, "e": "Elemente de tactica armei."}, {"id": "S01-019", "p": 3, "q": "Modulația cu bandă laterală unică (BLU/SSB) are avantajul că:", "o": ["nu are nevoie de antenă", "ocupă jumătate din bandă și economisește putere", "ocupă dublul benzii", "se folosește numai în fibră optică"], "a": 1, "e": "Se transmite o singură bandă laterală, fără purtătoare."}, {"id": "S01-022", "p": 3, "q": "Bătaia (distanța de legătură) a unei stații radio NU depinde de:", "o": ["culoarea carcasei stației", "înălțimea antenei", "relieful terenului", "puterea emițătorului"], "a": 0, "e": "Bătaia depinde de putere, sensibilitate, antenă, frecvență, teren, zgomot."}, {"id": "S01-032", "p": 3, "q": "Un dipol în semiundă pentru frecvența de 150 MHz are lungimea teoretică de:", "o": ["0,5 m", "4 m", "1 m", "2 m"], "a": 2, "e": "λ = 300/150 = 2 m; λ/2 = 1 m."}, {"id": "S01-035", "p": 3, "q": "Pentru legăturile radioreleu punct la punct se folosesc, de regulă, antene:", "o": ["de tip ferită", "directive (cu câștig mare)", "fără polarizare", "omnidirecționale"], "a": 1, "e": "Antenele directive concentrează energia pe direcția corespondentului."}, {"id": "S01-038", "p": 3, "q": "Raportul de unde staționare (RUS/SWR) ideal pentru o antenă perfect adaptată este:", "o": ["10:1", "3:1", "1:1", "0:1"], "a": 2, "e": "SWR mare înseamnă putere reflectată."}, {"id": "S01-039", "p": 3, "q": "Impedanța de intrare a unui dipol în semiundă este de aproximativ:", "o": ["600 Ω", "300 Ω", "5 Ω", "73 Ω"], "a": 3, "e": "Antene."}]}, {"nr": 4, "id": "uz-de-arma", "t": "Uzul de armă și somațiile", "tema": "Legea 122/2011 privind regimul armelor, dispozitivelor militare și munițiilor", "parte": "L", "stele": 3, "itemi": "1–3", "timp": "50 min", "sursa": "Legea 122/2011 – Cap. I art. 1–3; Cap. III Secțiunea a 3-a art. 14–23, Secțiunea a 4-a art. 24–29", "ps": "<p>E legea pe care o aplici <strong>în post, ca santinelă<\/strong>. La examen pică aproape sigur <strong>somația<\/strong> („Stai!” → „Stai, că trag!” → foc de avertisment), <strong>cazurile<\/strong> în care poți trage, <strong>pe cine nu ai voie<\/strong> să tragi și <strong>ce faci după<\/strong>. Se învață ușor dacă îți imaginezi situațiile.<\/p>", "fise": [{"t": "Ce înseamnă „uz de armă” și câteva definiții", "h": "<ul>\n<li><strong>Uz de armă<\/strong> = <strong>tragerea<\/strong> cu armamentul din dotare <strong>ca să îndeplinești misiunea<\/strong>. (Doar scoaterea armei sau portul ei nu înseamnă uz de armă.)<\/li>\n<li><strong>Consemn<\/strong> = <strong>totalitatea obligațiilor<\/strong> tale în misiune (de exemplu ce ai de făcut ca santinelă).<\/li>\n<li><strong>Forță minimă<\/strong> = forța <strong>strict necesară<\/strong>, ca grad, intensitate și durată.<\/li>\n<li><strong>Forță letală<\/strong> = forța care <strong>poate ucide<\/strong> sau răni grav.<\/li>\n<li><strong>Intenție ostilă<\/strong> = <strong>amenințarea iminentă<\/strong> cu forța. În misiunile individuale o apreciază <strong>executantul<\/strong> (tu).<\/li>\n<li><strong>Act ostil<\/strong> = folosirea efectivă a forței împotriva ta, a forțelor proprii sau a persoanelor și bunurilor desemnate.<\/li>\n<li><strong>Persoane desemnate<\/strong> = cei pe care îi protejezi prin <strong>consemn<\/strong> sau <strong>ordin<\/strong>, inclusiv cu forță letală.<\/li>\n<li><strong>Reguli de angajare<\/strong> = <strong>când, cum și cât<\/strong> ai voie să folosești armamentul în operații.<\/li>\n<li><strong>Zonă militară restricționată<\/strong> = zonă (teren, aer, apă) controlată de armată, unde <strong>accesul străinilor e limitat<\/strong>.<\/li>\n<li>📡 <strong>Echipament radioelectric<\/strong> = aparat care funcționează <strong>cu unde radio<\/strong>. <strong>Drona<\/strong> = vehicul controlat <strong>de la distanță<\/strong> sau <strong>autonom<\/strong>.<\/li>\n<\/ul>"}, {"t": "Principiile: arma e ultima soluție", "h": "<p>Uzul de armă se face <strong>numai<\/strong> în cazurile din lege și <strong>cu forța minimă necesară<\/strong>. Principiile:<\/p>\n<p><strong>Legalitate · Proporționalitate · Gradualitate · Utilizare limitată · Evitarea surprinderii<\/strong><\/p>\n<p>⚠️ <strong>Armele de foc se folosesc ca ULTIMĂ SOLUȚIE<\/strong>, numai când <strong>mijloacele neletale<\/strong> nu se pot folosi.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>„LPGUE”<\/strong> → <strong>L<\/strong>egal, <strong>P<\/strong>roporțional, <strong>G<\/strong>radual, <strong>U<\/strong>tilizare limitată, <strong>E<\/strong>vitarea surprinderii.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Proporționalitate<\/strong> = nu tragi cu tunul după vrăbii. <strong>Gradualitate<\/strong> = urci pe trepte: vorbă → somație → foc în aer → foc țintit.<\/p><\/aside>"}, {"t": "Cele 8 cazuri în care poți trage", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Împotriva cui<\/th>\n<th>Somație?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>a<\/strong><\/td>\n<td>celor care <strong>atacă personalul de pază<\/strong>, escortă sau protecție (sau obiectivul, prin surprindere)<\/td>\n<td>poți <strong>fără<\/strong>, dacă nu e timp<\/td>\n<\/tr>\n<tr>\n<td><strong>b<\/strong><\/td>\n<td>celor care <strong>atacă persoanele desemnate<\/strong><\/td>\n<td>poți <strong>fără<\/strong>, dacă nu e timp<\/td>\n<\/tr>\n<tr>\n<td><strong>c<\/strong><\/td>\n<td>celor care încearcă să <strong>intre sau să iasă ilegal<\/strong> din obiectivul militar sau zona restricționată<\/td>\n<td>⚠️ <strong>OBLIGATORIE<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>d<\/strong><\/td>\n<td>celor care <strong>fug după o infracțiune<\/strong> și <strong>ripostează<\/strong> cu arme<\/td>\n<td>poți <strong>fără<\/strong>, dacă nu e timp<\/td>\n<\/tr>\n<tr>\n<td><strong>e<\/strong><\/td>\n<td>ca să împiedici <strong>evadarea<\/strong> sau fuga de sub escortă<\/td>\n<td>⚠️ <strong>OBLIGATORIE<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>f<\/strong><\/td>\n<td>celor care <strong>împiedică militarii să execute misiuni de luptă<\/strong><\/td>\n<td>⚠️ <strong>specială, de 3 ori<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>g<\/strong><\/td>\n<td>în <strong>intervenția contrateroristă<\/strong><\/td>\n<td>poți <strong>fără<\/strong>, dacă nu e timp<\/td>\n<\/tr>\n<tr>\n<td><strong>h<\/strong><\/td>\n<td>împotriva <strong>dronelor<\/strong> și <strong>echipamentelor radio<\/strong> folosite pentru un act ostil<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Somație obligatorie: C-E-F<\/strong> → <strong>C<\/strong>ontrolul accesului (intrare/ieșire ilegală), <strong>E<\/strong>vadare, <strong>F<\/strong>ront (împiedicarea misiunii de luptă).\n<strong>La atac<\/strong> (a, b, d, g) poți trage <strong>fără somație<\/strong>, dar <strong>doar dacă nu ai timp<\/strong> de ea.<\/p><\/aside>"}, {"t": "Somația, pas cu pas", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pașii somației\">\n  <defs><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10z\" class=\"f-mut\"/><\/marker><\/defs>\n  <g stroke-width=\"1.5\">\n    <rect x=\"30\" y=\"8\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-acs s-acc\"/>\n    <rect x=\"30\" y=\"78\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-ams s-amb\"/>\n    <rect x=\"30\" y=\"148\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-ams s-amb\"/>\n    <rect x=\"30\" y=\"218\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-m t-b t-l\"><text x=\"44\" y=\"36\">1<\/text><text x=\"44\" y=\"106\">2<\/text><text x=\"44\" y=\"176\">3<\/text><text x=\"44\" y=\"246\">4<\/text><\/g>\n  <g class=\"t-b t-l\"><text x=\"70\" y=\"36\">„Stai!”<\/text><text x=\"70\" y=\"106\">„Stai, că trag!”<\/text><text x=\"70\" y=\"176\">Foc în sus ↑<\/text><text x=\"70\" y=\"246\">Uz de armă<\/text><\/g>\n  <g class=\"s-mut\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"><line x1=\"155\" y1=\"52\" x2=\"155\" y2=\"76\"/><line x1=\"155\" y1=\"122\" x2=\"155\" y2=\"146\"/><line x1=\"155\" y1=\"192\" x2=\"155\" y2=\"216\"/><\/g>\n  <g class=\"t-mut\" style=\"font-size:12px\"><text x=\"290\" y=\"34\">somația<\/text><text x=\"290\" y=\"104\">avertizare<\/text><text x=\"290\" y=\"168\">foc de<\/text><text x=\"290\" y=\"183\">avertisment<\/text><text x=\"290\" y=\"238\">țintește<\/text><text x=\"290\" y=\"253\">picioarele<\/text><\/g>\n  <text x=\"200\" y=\"290\" text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\">Treci la pasul următor doar dacă persoana NU se oprește.<\/text>\n<\/svg><figcaption>Ordinea legală a somației. Fiecare treaptă vine doar dacă persoana nu s-a oprit la cea dinainte.<\/figcaption><\/figure>\n\n<ol>\n<li><strong>„Stai!”<\/strong><\/li>\n<li>Dacă nu se oprește → <strong>„Stai, că trag!”<\/strong><\/li>\n<li>Dacă tot nu se oprește → <strong>foc de avertisment, în plan vertical<\/strong> (în sus).<\/li>\n<li>Dacă nici acum nu se supune → <strong>uz de armă<\/strong> împotriva persoanei.<\/li>\n<\/ol>\n<p><strong>Cazul f<\/strong> (cei care împiedică misiunea de luptă): somația se strigă <strong>de 3 ori la rând<\/strong>: <strong>„Părăsiți…, vom folosi arme de foc!”<\/strong><\/p>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Focul de avertisment e VERTICAL<\/strong>, nu orizontal și nu în pământ.<\/p><\/aside>"}, {"t": "Cum tragi și când e interzis", "h": "<p><strong>Cum tragi:<\/strong><\/p>\n<ul>\n<li>ținta e să <strong>imobilizezi<\/strong>, <strong>de regulă la picioare<\/strong>, ca să eviți moartea;<\/li>\n<li><strong>încetezi focul imediat<\/strong> ce scopul a fost atins;<\/li>\n<li>în <strong>vehicule<\/strong> tragi <strong>în pneuri<\/strong>;<\/li>\n<li>în <strong>drone<\/strong> tragi până la oprire sau neutralizare;<\/li>\n<li>răniților le dai <strong>primul ajutor<\/strong> de îndată ce misiunea permite.<\/li>\n<\/ul>\n<p><strong>Se evită<\/strong> pe cât posibil: <strong>minorii, femeile, bătrânii<\/strong>.<\/p>\n<p><strong>⚠️ ESTE INTERZIS<\/strong> uzul de armă împotriva:<\/p>\n<ul>\n<li><strong>copiilor<\/strong>;<\/li>\n<li><strong>femeilor cu semne vizibile de sarcină<\/strong>;<\/li>\n<\/ul>\n<p>…<strong>cu excepția<\/strong> cazului în care ei comit un <strong>atac armat<\/strong> care pune în pericol viața.<\/p>\n<p>E interzis și când <strong>pui în pericol alte persoane<\/strong> sau <strong>ai trage peste graniță<\/strong> (teritoriul, aerul sau apele altui stat).<\/p>"}, {"t": "După ce ai tras", "h": "<ol>\n<li><strong>Raportezi DE ÎNDATĂ<\/strong> pe cale ierarhică.<\/li>\n<li>Dacă cineva a fost <strong>rănit sau ucis<\/strong>, <strong>comandantul unității<\/strong> <strong>anunță de îndată procurorul<\/strong>.<\/li>\n<li>Uzul de armă <strong>făcut conform legii<\/strong> <strong>înlătură caracterul penal<\/strong> al faptei. Nu ești infractor dacă ai respectat legea.<\/li>\n<\/ol>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca după un accident rutier: oprești, dai primul ajutor, anunți. Dacă ai respectat regulile, nu ești vinovat.<\/p><\/aside>"}, {"t": "Exersează: ce faci în situațiile astea?", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situația<\/th>\n<th>Cazul<\/th>\n<th>Ce faci<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cineva sare gardul unității noaptea și fuge spre depozit<\/td>\n<td><strong>c<\/strong><\/td>\n<td>„Stai!” → „Stai, că trag!” → foc vertical → tragi la picioare<\/td>\n<\/tr>\n<tr>\n<td>Cineva te atacă direct cu un cuțit, de aproape<\/td>\n<td><strong>a<\/strong><\/td>\n<td>poți trage <strong>fără somație<\/strong>, dacă n-ai timp<\/td>\n<\/tr>\n<tr>\n<td>Un deținut escortat o rupe la fugă<\/td>\n<td><strong>e<\/strong><\/td>\n<td>somație <strong>obligatorie<\/strong>, apoi uz de armă<\/td>\n<\/tr>\n<tr>\n<td>Un grup blochează drumul coloanei care pleacă la luptă<\/td>\n<td><strong>f<\/strong><\/td>\n<td>„Părăsiți…, vom folosi arme de foc!” <strong>de 3 ori<\/strong><\/td>\n<\/tr>\n<tr>\n<td>O femeie vizibil însărcinată intră neautorizat, neînarmată<\/td>\n<td>—<\/td>\n<td><strong>NU tragi<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ai rănit pe cineva<\/td>\n<td>—<\/td>\n<td>încetezi focul, dai primul ajutor, raportezi imediat<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"t": "Misiunile în afara țării (art. 24–29)", "h": "<ul>\n<li>Forța se folosește după <strong>legea română<\/strong>, <strong>tratate<\/strong>, <strong>mandatul internațional<\/strong>, <strong>regulile de angajare<\/strong> și <strong>restricțiile naționale<\/strong>.<\/li>\n<li>Regulile de angajare sunt analizate de <strong>autoritatea națională militară<\/strong> (<strong>Statul Major al Apărării<\/strong>). Ea poate pune <strong>restricții (rezerve) naționale, în scris<\/strong>.<\/li>\n<li>Regulile aprobate sunt <strong>obligatorii<\/strong>, dar <strong>nu limitează dreptul la autoapărare<\/strong>.<\/li>\n<li>Cine acționează în limitele mandatului și ale regulilor <strong>nu răspunde<\/strong>.<\/li>\n<\/ul>"}], "flash": [["Ce e „uzul de armă”?", "<b>Tragerea<\/b> cu armamentul din dotare pentru îndeplinirea misiunii."], ["Ce e consemnul?", "<b>Totalitatea obligațiilor<\/b> personalului în misiune."], ["Forța minimă?", "Forța <b>strict necesară<\/b> (grad, intensitate, durată)."], ["Cine stabilește intenția ostilă în misiunile individuale?", "<b>Executantul<\/b> (tu)."], ["Principiile uzului de armă?", "<b>Legalitate, proporționalitate, gradualitate, utilizare limitată, evitarea surprinderii<\/b>."], ["Arma de foc este…?", "<b>Ultima soluție<\/b>, când mijloacele neletale nu se pot folosi."], ["Somația, în ordine?", "<b>„Stai!” → „Stai, că trag!” → foc de avertisment vertical<\/b> → uz de armă."], ["Cum se trage focul de avertisment?", "<b>În plan vertical<\/b> (în sus)."], ["Când e obligatorie somația?", "La <b>intrare/ieșire ilegală<\/b>, <b>evadare<\/b> și <b>împiedicarea misiunii de luptă<\/b> (C-E-F)."], ["Somația pentru cei care împiedică misiunea de luptă?", "<b>„Părăsiți…, vom folosi arme de foc!”<\/b> de <b>3 ori<\/b>."], ["La atacul asupra santinelei poți trage fără somație?", "<b>Da<\/b>, dacă <b>nu ai timp<\/b> de somație."], ["Unde țintești?", "Să <b>imobilizezi<\/b>, de regulă <b>la picioare<\/b>."], ["Când încetezi focul?", "<b>Imediat<\/b> ce scopul a fost atins."], ["În vehicule tragi…?", "<b>În pneuri<\/b>."], ["Pe cine e interzis să tragi?", "<b>Copii<\/b> și <b>femei vizibil însărcinate<\/b> (excepție: atac armat)."], ["Pe cine eviți pe cât posibil?", "<b>Minori, femei, bătrâni<\/b>."], ["Primul lucru după ce ai tras?", "<b>Raportezi de îndată<\/b> pe cale ierarhică."], ["Cine anunță procurorul dacă e un rănit/mort?", "<b>Comandantul unității<\/b>, de îndată."], ["Uzul de armă legal…?", "<b>Înlătură caracterul penal<\/b> al faptei."], ["Cine analizează regulile de angajare în misiunile externe?", "<b>Autoritatea națională militară<\/b> (Statul Major al Apărării)."]], "q": [{"id": "L06-001", "p": 1, "q": "Potrivit Legii 122/2011, „uzul de armă” reprezintă:", "o": ["tragerea cu armamentul din dotare în scopul îndeplinirii misiunii", "instruirea în poligon", "scoaterea armei din toc în prezența unei persoane", "portul armei în timpul serviciului"], "a": 0, "e": "Art. 3 lit. l)."}, {"id": "L06-002", "p": 1, "q": "„Consemnul” reprezintă, potrivit Legii 122/2011:", "o": ["totalitatea obligațiilor generale și specifice ale personalului aflat în misiune", "parola de recunoaștere", "lista persoanelor care au acces în unitate", "ordinul de zi pe unitate"], "a": 0, "e": "Art. 3 lit. b)."}, {"id": "L06-011", "p": 1, "q": "Principiile care stau la baza uzului de armă sunt:", "o": ["descurajarea, intimidarea și pedepsirea", "legalitatea, proporționalitatea, gradualitatea, utilizarea limitată și evitarea surprinderii", "secretul, viteza și precizia", "rapiditatea, surprinderea și eficiența maximă"], "a": 1, "e": "Art. 14."}, {"id": "L06-012", "p": 1, "q": "Armele de foc se folosesc:", "o": ["numai la ordinul procurorului", "ca primă soluție, pentru descurajare", "numai în timp de război", "ca ultimă soluție, numai când mijloacele neletale nu pot fi folosite"], "a": 3, "e": "Art. 14 alin. (2)."}, {"id": "L06-013", "p": 1, "q": "Care dintre următoarele este un caz legal de uz de armă potrivit art. 15?", "o": ["împotriva celor care încearcă să intre sau să iasă ilegal din obiective militare ori zone militare restricționate delimitate public", "împotriva celor care fotografiază unitatea de pe drumul public", "împotriva celor care insultă santinela", "împotriva celor care refuză să-și spună numele în afara unității"], "a": 0, "e": "Art. 15 alin. (1) lit. c)."}, {"id": "L06-016", "p": 1, "q": "Ordinea corectă a somației legale este:", "o": ["foc de avertisment – „Stai!” – „Stai, că trag!”", "„Mâinile sus!” – „Stai!” – foc de avertisment orizontal", "„Stai!” – „Stai, că trag!” – foc de avertisment în plan vertical", "„Stai, că trag!” – „Stai!” – foc în picioare"], "a": 2, "e": "Art. 16."}, {"id": "L06-017", "p": 1, "q": "Focul de avertisment se trage:", "o": ["spre vehicul", "în plan orizontal, deasupra capului", "în plan vertical", "în pământ, în fața persoanei"], "a": 2, "e": "Art. 16."}, {"id": "L06-018", "p": 1, "q": "Somația este obligatorie înainte de uzul de armă în cazurile în care persoanele:", "o": ["atacă persoanele desemnate", "acționează în cadrul unui atac terorist", "atacă personalul de pază", "încearcă să intre sau să iasă ilegal din obiectivul militar, încearcă să evadeze sau împiedică militarii să execute misiuni de luptă"], "a": 3, "e": "Art. 16 alin. (1): cazurile c), e), f)."}, {"id": "L06-019", "p": 1, "q": "În cazul unui atac asupra personalului de pază, se poate face uz de armă fără somație:", "o": ["niciodată", "numai cu aprobarea ofițerului de serviciu", "întotdeauna, fără nicio condiție", "dacă nu există timpul necesar pentru somație"], "a": 3, "e": "Art. 16 alin. (4)."}, {"id": "L06-020", "p": 1, "q": "Împotriva celor care împiedică militarii să execute misiuni de luptă, uzul de armă este permis numai după:", "o": ["două focuri de avertisment", "aprobarea scrisă a procurorului", "o somație rostită de trei ori consecutiv: „Părăsiți …, vom folosi arme de foc!”", "o singură somație „Stai!”"], "a": 2, "e": "Art. 17."}, {"id": "L06-021", "p": 1, "q": "Împotriva autovehiculelor, focul se trage, pe cât posibil:", "o": ["în rezervorul de combustibil", "în parbriz", "în conducătorul auto", "în pneuri, până la oprirea acestora"], "a": 3, "e": "Art. 16 alin. (5)."}, {"id": "L06-022", "p": 1, "q": "La uzul de armă, se trage astfel încât să se:", "o": ["neutralizeze definitiv persoana", "tragă la cap, pentru eficiență", "tragă numai în aer", "imobilizeze persoana, de regulă prin tragerea la picioare"], "a": 3, "e": "Art. 18."}, {"id": "L06-024", "p": 1, "q": "Uzul de armă este interzis împotriva:", "o": ["bărbaților cu vârsta peste 60 de ani, în orice situație", "persoanelor care nu vorbesc limba română", "copiilor și femeilor cu semne vizibile de sarcină, cu excepția cazului în care aceștia comit un atac armat", "militarilor străini"], "a": 2, "e": "Art. 20."}, {"id": "L06-026", "p": 1, "q": "După uzul de armă, militarul care a tras:", "o": ["nu are obligația să raporteze", "raportează în maximum 7 zile", "raportează de îndată pe cale ierarhică", "raportează numai dacă a rănit pe cineva"], "a": 2, "e": "Art. 23."}, {"id": "L06-027", "p": 1, "q": "Dacă în urma uzului de armă s-a produs moartea sau vătămarea unei persoane, comandantul unității:", "o": ["anunță primăria", "anunță de îndată procurorul competent", "anunță familia, în 48 de ore", "întocmește doar un raport intern"], "a": 1, "e": "Art. 23."}, {"id": "L06-003", "p": 2, "q": "Forța minimă reprezintă:", "o": ["numai folosirea mijloacelor neletale", "forța folosită numai după 3 somații", "forța care nu poate cauza niciodată rănirea", "forța strict necesară, ca grad, intensitate și durată, pentru îndeplinirea misiunii"], "a": 3, "e": "Art. 3 lit. d)."}, {"id": "L06-004", "p": 2, "q": "Forța letală este forța:", "o": ["folosită numai de forțele speciale", "a cărei folosire poate cauza decesul persoanei sau o rănire gravă cu același efect", "folosită numai împotriva vehiculelor", "folosită exclusiv în timp de război"], "a": 1, "e": "Art. 3 lit. e)."}, {"id": "L06-005", "p": 2, "q": "Intenția ostilă reprezintă:", "o": ["refuzul de a prezenta actul de identitate", "amenințarea iminentă cu folosirea forței împotriva statului, armatei, persoanelor sau bunurilor desemnate", "orice declarație politică împotriva armatei", "fotografierea unui obiectiv militar"], "a": 1, "e": "Art. 3 lit. g)."}, {"id": "L06-007", "p": 2, "q": "Regulile de angajare sunt:", "o": ["regulile de angajare a personalului civil în MApN", "reglementările care stabilesc circumstanțele, condițiile, gradul și modul în care se pot folosi armamentul și dispozitivele militare", "contractele soldaților profesioniști", "regulile de încadrare în funcții"], "a": 1, "e": "Art. 3 lit. k)."}, {"id": "L06-008", "p": 2, "q": "Zona militară restricționată este:", "o": ["zona de frontieră a statului", "o zonă terestră, aeriană, maritimă sau fluvială sub controlul forțelor naționale ori aliate, în care accesul și circulația persoanelor și tehnicii străine de acestea sunt limitate", "zona dintr-o unitate unde se servește masa", "orice teren deținut de MApN, inclusiv locuințele de serviciu"], "a": 1, "e": "Art. 3 lit. m)."}, {"id": "L06-010", "p": 2, "q": "Persoanele desemnate sunt:", "o": ["militarii aflați în concediu", "persoanele stabilite prin consemn sau ordin de misiune, a căror protecție permite folosirea forței, inclusiv a celei letale", "persoanele trecute pe lista de vizitatori", "toți civilii aflați în apropierea unității"], "a": 1, "e": "Art. 3 lit. i)."}, {"id": "L06-014", "p": 2, "q": "Se poate face uz de armă pentru a împiedica:", "o": ["plecarea unui vizitator fără să semneze registrul", "intrarea unui militar întârziat în unitate", "fuga de sub escortă sau evadarea persoanelor aflate legal în detenție ori reținere", "părăsirea postului de către un coleg"], "a": 2, "e": "Art. 15 alin. (1) lit. e)."}, {"id": "L06-015", "p": 2, "q": "Potrivit art. 15, se poate face uz de armă împotriva dronelor:", "o": ["numai dacă sunt militare", "folosite pentru comiterea unui act ostil", "în orice situație, fără condiții", "care zboară la peste 10 km de unitate"], "a": 1, "e": "Art. 15 alin. (1) lit. h)."}, {"id": "L06-023", "p": 2, "q": "Focul încetează:", "o": ["imediat ce scopul urmărit a fost atins", "după golirea încărcătorului", "numai la ordinul comandantului", "după 3 focuri"], "a": 0, "e": "Art. 18."}, {"id": "L06-025", "p": 2, "q": "Uzul de armă este interzis și atunci când:", "o": ["ar pune în pericol viața altor persoane sau s-ar încălca teritoriul, spațiul aerian ori apele unui stat vecin", "persoana fuge", "persoana este înarmată", "este noapte"], "a": 0, "e": "Art. 20."}, {"id": "L06-028", "p": 2, "q": "Uzul de armă făcut în condițiile Legii 122/2011:", "o": ["atrage automat sancțiunea disciplinară", "este întotdeauna infracțiune", "înlătură caracterul penal al faptei", "trebuie aprobat ulterior de Parlament"], "a": 2, "e": "Art. 23."}, {"id": "L06-032", "p": 2, "q": "Personalul care acționează în limitele mandatului și ale regulilor de angajare aprobate:", "o": ["răspunde penal în orice situație", "răspunde civil, dar nu penal", "răspunde disciplinar automat", "nu răspunde pentru folosirea forței"], "a": 3, "e": "Art. 29."}, {"id": "L06-034", "p": 2, "q": "Potrivit art. 19, se va evita, pe cât posibil, uzul de armă împotriva:", "o": ["dronelor", "minorilor, femeilor și bătrânilor", "militarilor străini", "vehiculelor"], "a": 1, "e": "Art. 19."}, {"id": "L06-006", "p": 3, "q": "În misiunile individuale, intenția ostilă se stabilește de:", "o": ["procuror", "Parlament", "ministrul apărării", "executant"], "a": 3, "e": "Art. 3 lit. g)."}, {"id": "L06-009", "p": 3, "q": "Potrivit Legii 122/2011, echipamentul radioelectric este:", "o": ["un dispozitiv de bruiaj exclusiv militar", "un aparat sau o instalație care funcționează cu ajutorul undelor radio", "orice dispozitiv conectat la rețeaua electrică", "orice aparat cu baterie"], "a": 1, "e": "Art. 3 lit. c²)."}, {"id": "L06-029", "p": 3, "q": "În operațiile din afara teritoriului, regulile de angajare se transmit spre analiză:", "o": ["Ministerului Afacerilor Externe", "comandantului de pluton", "Parlamentului", "autorității naționale militare (Statul Major al Apărării)"], "a": 3, "e": "Art. 25."}, {"id": "L06-030", "p": 3, "q": "Autoritatea națională militară poate formula, față de regulile de angajare contrare legislației naționale:", "o": ["un veto verbal", "amenzi", "un ordin de retragere a NATO", "restricții (rezerve) naționale, în scris"], "a": 3, "e": "Art. 25 alin. (3)."}, {"id": "L06-031", "p": 3, "q": "Regulile de angajare aprobate:", "o": ["sunt obligatorii și nu limitează dreptul inerent la autoapărare", "sunt facultative", "interzic autoapărarea", "se aplică numai ofițerilor"], "a": 0, "e": "Art. 26."}, {"id": "L06-033", "p": 3, "q": "Potrivit Legii 122/2011, dispozitivele militare includ și sisteme care emit:", "o": ["numai gaze lacrimogene", "semnale de radiodifuziune comercială", "numai proiectile cinetice", "semnale de bruiaj, energie dirijată, microunde de mare putere sau laser"], "a": 3, "e": "Art. 3 lit. c)."}]}, {"nr": 5, "id": "propagarea", "t": "Cum ajung undele radio departe (propagarea)", "tema": "Propagarea undelor radio – unda de suprafață, ionosfera, unda directă, orizontul radio", "parte": "S", "stele": 3, "itemi": "2–3", "timp": "60 min", "sursa": "A. S. Tanenbaum, Rețele de calculatoare, ed. a III-a, pag. 86–92; F.T.-T.-5.1 și F.T.-T.-5.2 (propagarea undelor)", "ps": "<p>O undă radio poate ajunge la destinație pe <strong>3 drumuri<\/strong>: <strong>pe lângă pământ<\/strong> (unda de suprafață), <strong>reflectată din cer<\/strong> de ionosferă (unda spațială, în <strong>HF<\/strong>) sau <strong>în linie dreaptă<\/strong> (unda directă, în <strong>VHF<\/strong>). Dacă știi desenul de mai jos, știi tot capitolul.<\/p>", "fise": [{"t": "Cele 3 drumuri ale undei radio", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 270\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Unda de suprafață, unda spațială și zona de tăcere\">\n  <path d=\"M0 40 Q200 0 400 40 L400 64 Q200 24 0 64 Z\" class=\"f-bls\"/>\n  <text x=\"12\" y=\"28\" class=\"t-blu t-b\">IONOSFERA<\/text>\n  <path d=\"M0 236 Q200 196 400 236 L400 270 L0 270 Z\" class=\"f-acs\"/>\n  <path d=\"M0 236 Q200 196 400 236\" class=\"s-acc f-none\" stroke-width=\"2\"/>\n  <line x1=\"40\" y1=\"230\" x2=\"40\" y2=\"196\" class=\"s-ink\" stroke-width=\"3\"/>\n  <circle cx=\"40\" cy=\"194\" r=\"4\" class=\"f-amb\"/>\n  <path d=\"M44 226 Q90 214 128 210\" class=\"s-acc f-none\" stroke-width=\"3\"/>\n  <text x=\"78\" y=\"196\" text-anchor=\"middle\" class=\"t-acc t-b\" style=\"font-size:12px\">suprafață<\/text>\n  <path d=\"M44 196 L200 52 L356 212\" class=\"s-amb f-none\" stroke-width=\"3\"/>\n  <text x=\"118\" y=\"112\" class=\"t-amb t-b\">unda spațială (HF)<\/text>\n  <path d=\"M44 194 L150 100\" class=\"s-mut f-none\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n  <path d=\"M150 100 L250 10\" class=\"s-mut f-none\" stroke-width=\"2\" stroke-dasharray=\"5 4\"/>\n  <text x=\"254\" y=\"16\" class=\"t-mut\" style=\"font-size:12px\">peste MUF: se pierde<\/text>\n  <rect x=\"140\" y=\"214\" width=\"190\" height=\"20\" rx=\"4\" class=\"f-res\"/>\n  <text x=\"235\" y=\"229\" text-anchor=\"middle\" class=\"t-red t-b\" style=\"font-size:12px\">ZONA DE TĂCERE – nu se aude<\/text>\n  <circle cx=\"356\" cy=\"214\" r=\"6\" class=\"f-amb\"/>\n  <text x=\"356\" y=\"258\" text-anchor=\"middle\" class=\"t-b\" style=\"font-size:12px\">se aude<\/text>\n  <text x=\"40\" y=\"258\" text-anchor=\"middle\" class=\"t-b\" style=\"font-size:12px\">emițător<\/text>\n<\/svg><figcaption>HF: unda de suprafață merge pe lângă sol, unda spațială se întoarce din ionosferă. Între ele rămâne zona de tăcere. Unda directă (VHF) apare în desenul cu orizontul radio.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Drumul<\/th>\n<th>Cum merge<\/th>\n<th>Gama<\/th>\n<th>Cât de departe<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Unda de suprafață<\/strong><\/td>\n<td><strong>pe lângă sol<\/strong>, urmând curbura Pământului<\/td>\n<td>LF, MF, HF de jos<\/td>\n<td>zeci–sute de km<\/td>\n<\/tr>\n<tr>\n<td><strong>Unda spațială<\/strong> (ionosferică)<\/td>\n<td>urcă, <strong>se întoarce din ionosferă<\/strong> și coboară departe<\/td>\n<td><strong>HF<\/strong><\/td>\n<td>sute–<strong>mii<\/strong> de km<\/td>\n<\/tr>\n<tr>\n<td><strong>Unda directă<\/strong><\/td>\n<td><strong>în linie dreaptă<\/strong>, de la antenă la antenă<\/td>\n<td><strong>VHF, UHF<\/strong><\/td>\n<td>până la <strong>orizont<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Unda de suprafață<\/strong> = apa care curge pe lângă pământ. <strong>Unda spațială<\/strong> = mingea aruncată în tavan care cade departe. <strong>Unda directă<\/strong> = lanterna: luminează doar ce „vede”.<\/p><\/aside>"}, {"t": "Regula de buzunar a frecvenței", "h": "<ul>\n<li><strong>Frecvență mică<\/strong> → unda <strong>ocolește obstacolele<\/strong>, „curge” pe lângă Pământ, dar transportă <strong>puține date<\/strong>.<\/li>\n<li><strong>Frecvență mare<\/strong> → unda se comportă <strong>ca lumina<\/strong>: merge <strong>drept<\/strong>, face <strong>umbre<\/strong> în spatele dealurilor, se <strong>reflectă<\/strong>, e <strong>absorbită de ploaie<\/strong> (la GHz).<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Cu cât frecvența crește, cu atât unda seamănă mai mult cu lumina.<\/strong><\/p><\/aside>"}, {"t": "Ionosfera: „oglinda” din cer pentru HF", "h": "<p><strong>Ionosfera<\/strong> = straturi de aer <strong>ionizat de Soare<\/strong>, la <strong>60–500 km<\/strong> altitudine.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Strat<\/th>\n<th>Unde<\/th>\n<th>Ce face<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>D<\/strong><\/td>\n<td>60–90 km<\/td>\n<td>există <strong>doar ziua<\/strong>; <strong>absoarbe<\/strong> frecvențele joase. <strong>Dispare noaptea.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>E<\/strong><\/td>\n<td>90–130 km<\/td>\n<td>ziua, reflectă parțial<\/td>\n<\/tr>\n<tr>\n<td><strong>F1, F2<\/strong><\/td>\n<td>200–400 km<\/td>\n<td><strong>F2 e cel mai important pentru HF la distanță<\/strong>. <strong>Noaptea F1 și F2 se unesc<\/strong> într-un singur strat F.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>MUF<\/strong> (frecvența maximă utilizabilă) = cea mai mare frecvență care <strong>încă se mai întoarce<\/strong> spre Pământ. ⚠️ <strong>Peste MUF, unda trece prin ionosferă și se pierde în spațiu.<\/strong><\/p>\n<p><strong>Ziua sau noaptea?<\/strong><\/p>\n<ul>\n<li><strong>Ziua<\/strong> Soarele ionizează puternic → poți folosi <strong>frecvențe HF mai mari<\/strong>.<\/li>\n<li><strong>Noaptea<\/strong> ionizarea scade → MUF scade → <strong>cobori frecvența<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ionosfera e ca o <strong>plasă de tenis<\/strong>: ziua e întinsă și ține și mingi rapide (frecvențe mari). Noaptea se lasă, iar mingile rapide trec prin ea, așa că trebuie să arunci mai încet (frecvențe mai mici).<\/p><\/aside><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Ai legătură HF ziua pe <strong>8 MHz<\/strong>, iar seara dispare. Ce faci? <strong>Cobori frecvența<\/strong> (de exemplu la 4–5 MHz).<\/p><\/aside>"}, {"t": "Zona de tăcere și NVIS", "h": "<p><strong>Zona de tăcere<\/strong> = zona în care <strong>nu se aude nimic<\/strong>: unda de suprafață <strong>s-a stins<\/strong>, iar unda spațială <strong>încă n-a coborât<\/strong>.<\/p>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Doi operatori HF la <strong>60 km<\/strong> unul de altul <strong>nu se aud<\/strong>, dar o stație la <strong>600 km<\/strong> se aude bine. De ce? Sunt în <strong>zona de tăcere<\/strong>.<\/p><\/aside>\n<p><strong>Soluția: NVIS<\/strong> (<em>Near Vertical Incidence Skywave<\/em>):<\/p>\n<ul>\n<li>trimiți unda <strong>aproape vertical<\/strong>, în sus;<\/li>\n<li>ea se întoarce <strong>în jurul tău<\/strong>, pe o rază de <strong>0–300 km<\/strong>, deci <strong>acoperă zona de tăcere<\/strong> și văile dintre munți;<\/li>\n<li>folosești <strong>frecvențe HF joase (2–10 MHz)<\/strong> și o <strong>antenă orizontală, montată jos<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>E ca un <strong>duș<\/strong>: arunci apa drept în sus și cade peste tot în jurul tău.<\/p><\/aside>"}, {"t": "Orizontul radio în VHF", "h": "<p>În VHF, unda merge în linie dreaptă, iar <strong>Pământul e curbat<\/strong>. Așa că bătaia e limitată de <strong>orizont<\/strong>.<\/p>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 200\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Orizontul radio\">\n  <path d=\"M0 200 Q200 100 400 200 Z\" class=\"f-acs\"/>\n  <path d=\"M0 200 Q200 100 400 200\" class=\"s-acc f-none\" stroke-width=\"2\"/>\n  <line x1=\"70\" y1=\"172\" x2=\"70\" y2=\"96\" class=\"s-ink\" stroke-width=\"3\"/><circle cx=\"70\" cy=\"94\" r=\"4\" class=\"f-amb\"/>\n  <line x1=\"330\" y1=\"172\" x2=\"330\" y2=\"122\" class=\"s-ink\" stroke-width=\"3\"/><circle cx=\"330\" cy=\"120\" r=\"4\" class=\"f-amb\"/>\n  <line x1=\"70\" y1=\"94\" x2=\"330\" y2=\"120\" class=\"s-amb\" stroke-width=\"2.5\" stroke-dasharray=\"7 5\"/>\n  <text x=\"58\" y=\"138\" text-anchor=\"end\" class=\"t-b t-m\">h₁<\/text><text x=\"342\" y=\"150\" class=\"t-b t-m\">h₂<\/text>\n  <text x=\"200\" y=\"88\" text-anchor=\"middle\" class=\"t-amb t-b\">unda directă trece „peste cocoașă”<\/text>\n  <text x=\"200\" y=\"40\" text-anchor=\"middle\" class=\"t-b t-l t-m\">d ≈ 4,12 · (√h₁ + √h₂) km<\/text>\n  <text x=\"200\" y=\"62\" text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\">antene mai înalte → legătură mai lungă<\/text>\n  <text x=\"200\" y=\"168\" text-anchor=\"middle\" class=\"t-acc t-b\">curbura Pământului<\/text>\n<\/svg><figcaption>Cu cât antenele sunt mai sus, cu atât „se văd” de mai departe peste curbura Pământului.<\/figcaption><\/figure>\n\n<blockquote><p><strong>d [km] ≈ 4,12 × (√h₁ + √h₂)<\/strong>   (h₁, h₂ = înălțimile antenelor, în <strong>metri<\/strong>)<\/p><\/blockquote><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Antene la <strong>4 m<\/strong> și <strong>4 m<\/strong>: d = 4,12 × (2 + 2) ≈ <strong>16 km<\/strong>.\nAntene la <strong>9 m<\/strong> și <strong>16 m<\/strong>: d = 4,12 × (3 + 4) ≈ <strong>29 km<\/strong>.\nReleu la <strong>100 m<\/strong> și stație la <strong>4 m<\/strong>: d = 4,12 × (10 + 2) ≈ <strong>49 km<\/strong>.<\/p><\/aside>\n<ul>\n<li>Orizontul <strong>radio<\/strong> e cu ~15% <strong>mai departe<\/strong> decât cel <strong>optic<\/strong> (3,57·√h), pentru că atmosfera (<strong>refracția troposferică<\/strong>) curbează puțin unda în jos.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca atunci când te urci pe un bloc: vezi mai departe. De aceea <strong>releele se pun pe dealuri<\/strong>.<\/p><\/aside>"}, {"t": "Atenuarea și alte fenomene", "h": "<ul>\n<li>În spațiu liber, puterea scade cu <strong>pătratul distanței (1/d²)<\/strong>. <strong>Distanța dublă → −6 dB<\/strong> (de 4 ori mai slab).<\/li>\n<li>Pierderea crește și cu <strong>frecvența<\/strong>.<\/li>\n<li><strong>Fading<\/strong> = semnalul <strong>scade și crește periodic<\/strong>, pentru că mai multe unde sosesc pe drumuri diferite și se „bat” între ele.<\/li>\n<li><strong>Ploaia<\/strong> atenuează la frecvențe <strong>de ordinul GHz<\/strong>.<\/li>\n<li><strong>Ducting troposferic<\/strong> = rar, unda VHF/UHF ajunge <strong>anormal de departe<\/strong> din cauza vremii.<\/li>\n<li><strong>Difuzia troposferică (tropo-scatter)<\/strong> = legături <strong>dincolo de orizont<\/strong>, folosind împrăștierea undelor în troposferă.<\/li>\n<li><strong>Activitatea solară<\/strong> (ciclu de ~11 ani, furtuni solare) influențează <strong>HF<\/strong>.<\/li>\n<li><strong>Viteza undelor radio<\/strong> = <strong>3·10⁸ m/s<\/strong> (viteza luminii), <strong>aceeași pentru orice frecvență<\/strong>. Au fost prezise de <strong>Maxwell<\/strong> și demonstrate de <strong>Hertz<\/strong>.<\/li>\n<\/ul>"}], "flash": [["Cele 3 drumuri ale undei radio?", "<b>Unda de suprafață<\/b>, <b>unda spațială (ionosferică)<\/b>, <b>unda directă<\/b>."], ["Cum se propagă LF/MF?", "Ca <b>undă de suprafață<\/b>, pe lângă sol."], ["Cum ajunge HF la mii de km?", "Prin <b>reflexie pe ionosferă<\/b> (unda spațială)."], ["Cum se propagă VHF/UHF?", "Prin <b>undă directă<\/b>, în linie de vedere."], ["Unde e atenuarea undei de suprafață cea mai mică?", "Deasupra <b>apei sărate (mării)<\/b>."], ["Ce e ionosfera?", "Straturi de aer <b>ionizat de Soare<\/b>, la 60–500 km."], ["Stratul care absoarbe ziua și dispare noaptea?", "<b>Stratul D<\/b>."], ["Stratul cel mai important pentru HF la distanță?", "<b>F2<\/b> (noaptea, F1 și F2 se unesc în <b>F<\/b>)."], ["Ce e MUF?", "<b>Frecvența maximă utilizabilă<\/b>: cea mai mare care încă se întoarce din ionosferă."], ["Ce se întâmplă peste MUF?", "Unda <b>trece prin ionosferă<\/b> și se pierde."], ["Noaptea, în HF, folosești frecvențe…?", "<b>Mai mici<\/b> decât ziua."], ["Ce e zona de tăcere?", "Zona dintre sfârșitul undei de suprafață și locul unde <b>revine unda spațială<\/b>."], ["Ce e NVIS?", "Unda HF trimisă <b>aproape vertical<\/b>, pentru 0–300 km; acoperă zona de tăcere."], ["NVIS – ce frecvențe și ce antenă?", "<b>HF joase (2–10 MHz)<\/b>, antenă <b>orizontală, joasă<\/b>."], ["Formula orizontului radio?", "<b>d ≈ 4,12(√h₁ + √h₂)<\/b> km, h în metri."], ["Antene la 9 m și 16 m – orizontul?", "4,12 × 7 ≈ <b>29 km<\/b>."], ["De ce e orizontul radio mai departe decât cel optic?", "Din cauza <b>refracției troposferice<\/b>."], ["Distanța se dublează – cu cât scade semnalul?", "<b>6 dB<\/b> (de 4 ori)."], ["Ce e fadingul?", "Variația semnalului din cauza <b>interferenței undelor<\/b> sosite pe drumuri diferite."], ["Ploaia afectează ce frecvențe?", "Pe cele de <b>ordinul GHz<\/b>."], ["Viteza undelor radio?", "<b>3·10⁸ m/s<\/b>, aceeași pentru orice frecvență."], ["Cine a prezis undele EM? Cine le-a demonstrat?", "<b>Maxwell<\/b>; <b>Hertz<\/b>."]], "q": [{"id": "S10-005", "p": 1, "q": "Undele radio de frecvență joasă (LF, MF) se propagă în principal:", "o": ["ca unde de suprafață, urmând curbura Pământului", "prin fibră optică", "prin reflexie pe ionosferă, la mii de km, ziua", "numai în linie de vedere"], "a": 0, "e": "Propagarea undelor joase."}, {"id": "S10-007", "p": 1, "q": "Legăturile radio la distanțe de mii de kilometri, fără relee sau sateliți, se realizează în principal în gama:", "o": ["UHF, prin undă de suprafață", "VHF, prin undă directă", "HF, prin unda spațială reflectată de ionosferă", "SHF, prin difracție"], "a": 2, "e": "Unda ionosferică."}, {"id": "S10-008", "p": 1, "q": "Ionosfera este:", "o": ["stratul de ozon care absoarbe undele VHF", "un satelit de comunicații", "un ansamblu de straturi de aer ionizat de radiația solară, la aproximativ 60–500 km altitudine", "stratul de nori de la 1–2 km"], "a": 2, "e": "Ionosfera."}, {"id": "S10-009", "p": 1, "q": "Stratul ionosferic care există numai ziua și absoarbe frecvențele joase (MF, HF de jos) este:", "o": ["stratul D", "stratul F2", "stratul E", "stratul F1"], "a": 0, "e": "Stratul D dispare noaptea."}, {"id": "S10-010", "p": 1, "q": "Stratul ionosferic cel mai important pentru legăturile HF la distanțe mari este:", "o": ["troposfera", "stratul E sporadic, exclusiv", "stratul D", "stratul F (F2)"], "a": 3, "e": "Stratul F2."}, {"id": "S10-012", "p": 1, "q": "Frecvența maximă utilizabilă (MUF) reprezintă:", "o": ["frecvența de rezonanță a antenei bici", "frecvența minimă la care stația poate emite", "frecvența de eșantionare a vocii", "cea mai mare frecvență care, pe o anumită legătură, mai este reflectată de ionosferă spre Pământ"], "a": 3, "e": "MUF."}, {"id": "S10-013", "p": 1, "q": "O undă HF cu frecvența mai mare decât MUF:", "o": ["devine undă de suprafață", "se reflectă mai bine", "străpunge ionosfera și nu se mai întoarce spre Pământ", "se transformă în undă directă"], "a": 2, "e": "MUF."}, {"id": "S10-014", "p": 1, "q": "Pe timpul nopții, pentru legăturile HF prin ionosferă se folosesc, de regulă:", "o": ["numai frecvențe VHF", "frecvențe mai mici decât ziua", "frecvențe mai mari decât ziua", "aceleași frecvențe ca ziua, fără excepție"], "a": 1, "e": "MUF scade noaptea."}, {"id": "S10-016", "p": 1, "q": "Zona de tăcere (skip zone) în gama HF este:", "o": ["zona din spatele unui deal în VHF", "zona dintre limita de acțiune a undei de suprafață și punctul în care revine pe Pământ unda reflectată de ionosferă", "zona de deasupra ionosferei", "zona din jurul antenei, unde semnalul e prea puternic"], "a": 1, "e": "Zona de tăcere."}, {"id": "S10-018", "p": 1, "q": "Tehnica NVIS (Near Vertical Incidence Skywave) în HF constă în:", "o": ["folosirea undei directe la distanțe de mii de km", "folosirea unei antene parabolice spre satelit", "transmiterea prin fibră optică", "trimiterea undei aproape vertical spre ionosferă, pentru acoperirea unei zone de 0–300 km, inclusiv a zonei de tăcere"], "a": 3, "e": "NVIS."}, {"id": "S10-022", "p": 1, "q": "Undele din gamele VHF/UHF/SHF se propagă în principal:", "o": ["prin ghid de undă Pământ–ionosferă", "prin reflexie pe ionosferă", "prin undă directă, în linie de vedere", "ca undă de suprafață pe mii de km"], "a": 2, "e": "Unda directă."}, {"id": "S10-001", "p": 2, "q": "Viteza de propagare a undelor electromagnetice în vid este de aproximativ:", "o": ["3·10⁵ m/s", "dependentă de frecvență: mai mare la frecvențe mari", "340 m/s", "3·10⁸ m/s, indiferent de frecvență"], "a": 3, "e": "Viteza luminii."}, {"id": "S10-003", "p": 2, "q": "În spațiu liber, puterea semnalului recepționat scade, cu distanța d, proporțional cu:", "o": ["1/d²", "1/d", "d²", "1/d⁴"], "a": 0, "e": "Legea inversului pătratului."}, {"id": "S10-015", "p": 2, "q": "O legătură HF care funcționa ziua pe 8 MHz nu mai funcționează seara. Măsura corectă este:", "o": ["coborârea frecvenței de lucru", "creșterea frecvenței la 20 MHz", "scurtarea antenei", "trecerea pe polarizare circulară"], "a": 0, "e": "Seara MUF scade."}, {"id": "S10-017", "p": 2, "q": "Doi operatori HF aflați la 60 km unul de altul nu se aud, deși stații aflate la 600 km se aud bine. Cauza probabilă este:", "o": ["aflarea lor în zona de tăcere", "folosirea polarizării verticale", "prea multă putere de emisie", "defectarea ambelor stații"], "a": 0, "e": "Zona de tăcere."}, {"id": "S10-019", "p": 2, "q": "Pentru legăturile NVIS se folosesc, de regulă:", "o": ["frecvențe SHF și antene parabolice", "frecvențe VHF și antene bici înalte", "frecvențe HF înalte (25–30 MHz) și antene verticale înalte", "frecvențe HF joase (aprox. 2–10 MHz) și antene orizontale dispuse la mică înălțime"], "a": 3, "e": "NVIS."}, {"id": "S10-028", "p": 2, "q": "Cu cât frecvența unei unde radio este mai mare, cu atât:", "o": ["unda se propagă mai mult în linie dreaptă, ca lumina, și ocolește mai greu obstacolele", "unda ocolește mai ușor obstacolele", "unda se reflectă mai bine pe ionosferă", "unda de suprafață ajunge mai departe"], "a": 0, "e": "Regula de buzunar a propagării."}, {"id": "S10-002", "p": 3, "q": "Existența undelor electromagnetice a fost prezisă teoretic de:", "o": ["Hertz", "Maxwell", "Morse", "Marconi"], "a": 1, "e": "Hertz le-a demonstrat experimental."}, {"id": "S10-004", "p": 3, "q": "Dacă distanța dintre emițător și receptor se dublează (spațiu liber), nivelul semnalului scade cu:", "o": ["20 dB", "10 dB", "6 dB", "3 dB"], "a": 2, "e": "Putere de 4 ori mai mică."}, {"id": "S10-006", "p": 3, "q": "Atenuarea undei de suprafață este cea mai mică deasupra:", "o": ["pădurii", "nisipului uscat", "apei sărate (mării)", "zonelor urbane"], "a": 2, "e": "Conductivitatea solului."}, {"id": "S10-011", "p": 3, "q": "Pe timpul nopții, straturile F1 și F2:", "o": ["se unesc într-un singur strat F", "dispar complet", "se transformă în stratul D", "coboară sub 50 km"], "a": 0, "e": "Variația zi/noapte."}, {"id": "S10-020", "p": 3, "q": "Variația periodică a nivelului semnalului recepționat, produsă de interferența undelor sosite pe drumuri diferite, se numește:", "o": ["multiplexare", "modulație", "fading", "aliasing"], "a": 2, "e": "Fading."}, {"id": "S10-021", "p": 3, "q": "Activitatea solară influențează în special propagarea în gama:", "o": ["VHF în linie de vedere", "prin cablu coaxial", "prin fibră optică", "HF, prin modificarea ionizării ionosferei"], "a": 3, "e": "Ciclul solar de ~11 ani."}, {"id": "S10-023", "p": 3, "q": "Orizontul r
