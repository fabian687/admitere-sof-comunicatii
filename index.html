trong>decorații<\/strong>, pentru servicii excepționale, acte de eroism sau merite deosebite;<\/li>\n<li><strong>distincții nemateriale (morale)<\/strong> și <strong>avantaje financiare (materiale)<\/strong> pentru îndeplinirea <strong>cu deosebită profesionalitate<\/strong> a sarcinilor. Se stabilesc prin <strong>ordin al ministrului<\/strong> (adică prin RG-3).<\/li>\n<\/ul>\n<p>Exemple orientative de recompense <strong>morale<\/strong>: mulțumiri, felicitări (verbal sau în formație), evidențiere prin ordin de zi, diplome, insigne, cartea de onoare, ridicarea unei sancțiuni. <strong>Materiale<\/strong>: premii în bani sau obiecte.<\/p>\n<blockquote><p>✍️ <strong>Lista exactă<\/strong> și <strong>cine acordă fiecare recompensă<\/strong> sunt în <strong>Anexa 3<\/strong>. Completeaz-o în tabelul de la final.<\/p><\/blockquote>"}, {"t": "Abaterea disciplinară (art. 51–59)", "h": "<p><strong>Abaterea disciplinară<\/strong> = fapta făcută <strong>cu vinovăție<\/strong>, prin care se încalcă <strong>legi, regulamente, ordine sau dispoziții<\/strong>, <strong>dacă nu constituie infracțiune<\/strong>.<\/p>\n<p>Exemple tipice: <strong>întârzierea sau absența nemotivată<\/strong>, <strong>părăsirea postului<\/strong>, <strong>alcool în serviciu<\/strong>, <strong>neexecutarea ordinelor<\/strong>, <strong>portul incorect al uniformei<\/strong>, <strong>atitudine necuviincioasă<\/strong> față de superiori, <strong>încălcarea consemnului<\/strong>, <strong>neglijarea armamentului<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p>Dacă fapta e <strong>infracțiune<\/strong> (de exemplu furt), nu mai e doar abatere disciplinară.<\/p><\/aside>"}, {"t": "Sancțiunile soldaților și gradaților profesioniști ⚠️", "h": "<p><strong>Legea 384/2006, art. 28<\/strong> – sancțiunile pe care le poți primi:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lit.<\/th>\n<th>Sancțiunea<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td><strong>avertismentul<\/strong><\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td><strong>mustrarea scrisă<\/strong><\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td><strong>retrogradarea în funcție<\/strong> (pe o funcție inferioară)<\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td><strong>amânarea înaintării în gradul următor<\/strong>, pe <strong>1–2 ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td>e)<\/td>\n<td><strong>încetarea contractului<\/strong> din motive disciplinare<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Cea mai gravă<\/strong> = <strong>încetarea contractului<\/strong> din motive disciplinare.<\/li>\n<li><strong>Cea mai ușoară<\/strong> = <strong>avertismentul<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Compară cu cadrele militare<\/strong> (Legea 80, art. 35): acolo apar în plus <strong>diminuarea soldei<\/strong> de funcție/comandă și <strong>trecerea în rezervă<\/strong>, în loc de încetarea contractului.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: „Care <strong>NU<\/strong> e sancțiune pentru soldați?” → caută ceva ce apare doar la cadre (de exemplu <strong>trecerea în rezervă<\/strong>) sau ceva inventat.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la <strong>școală<\/strong>: avertisment, apoi mustrare scrisă, apoi scăderea notei la purtare, apoi exmatricularea. Aici, ultima treaptă e încetarea contractului.<\/p><\/aside>"}, {"t": "Termene și cercetarea prealabilă ⚠️", "h": "<p><strong>Legea 384/2006, art. 29:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Termen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comandantul stabilește <strong>sancțiunea<\/strong> după ce află de abatere<\/td>\n<td>cel mult <strong>30 de zile calendaristice<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Sancțiunea se <strong>execută<\/strong> după comunicarea deciziei<\/td>\n<td>cel mult <strong>30 de zile calendaristice<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Abaterea poate fi sancționată doar dacă a fost <strong>cunoscută<\/strong> de comandant<\/td>\n<td><strong>în 6 luni<\/strong> de la săvârșire<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Art. 30 – cercetarea prealabilă:<\/strong> ⚠️ <strong>Nicio sancțiune, cu excepția avertismentului, nu se aplică fără cercetare prealabilă<\/strong>, făcută de <strong>comisii<\/strong>, <strong>sub sancțiunea nulității absolute<\/strong>.<\/p>\n<p><strong>Reguli generale la aplicare:<\/strong><\/p>\n<ul>\n<li>pentru <strong>o abatere<\/strong> → <strong>o singură sancțiune<\/strong>;<\/li>\n<li>sancțiunea este <strong>proporțională<\/strong> cu gravitatea faptei; se ține seama de împrejurări, urmări, comportarea anterioară;<\/li>\n<li>militarul are dreptul să fie <strong>ascultat<\/strong> și să-și prezinte <strong>apărarea<\/strong>;<\/li>\n<li>sancțiunea se <strong>comunică<\/strong> militarului și se consemnează în documentele lui.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>30 – 30 – 6<\/strong>: 30 de zile ca să hotărască, 30 de zile ca să execute, 6 luni de când s-a făcut fapta ca să afle.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: <strong>avertismentul<\/strong> e singura sancțiune dată <strong>fără cercetare prealabilă<\/strong>. Toate celelalte au nevoie de cercetare, altfel sunt <strong>nule<\/strong>.<\/p><\/aside>"}, {"t": "Căile de atac (art. 80)", "h": "<ul>\n<li>Militarul sancționat are dreptul să <strong>conteste<\/strong> sancțiunea, în <strong>termenul<\/strong> și pe <strong>calea<\/strong> prevăzute de <strong>art. 80<\/strong> și de lege. Calea finală este <strong>instanța de judecată<\/strong>.<\/li>\n<li>⚠️ <strong>Termenul exact<\/strong> și <strong>autoritatea la care se depune contestația<\/strong> se citesc <strong>din art. 80<\/strong>. Nu le dăm aici din memorie, fiindcă nu le-am putut verifica în textul oficial.<\/li>\n<\/ul>"}, {"t": "Competențele comandanților (Anexele 2 și 3)", "h": "<ul>\n<li><strong>Principiul:<\/strong> cu cât comandantul e <strong>mai sus<\/strong> în ierarhie, cu atât poate da <strong>mai multe și mai grele<\/strong> sancțiuni (sau recompense mai mari).<\/li>\n<li><strong>comandant de grupă / pluton:<\/strong> cele mai ușoare (felicitare, avertisment);<\/li>\n<li><strong>comandant de companie / batalion:<\/strong> mai multe;<\/li>\n<li><strong>comandant de unitate<\/strong> și mai sus: și sancțiunile grele (<strong>retrogradare<\/strong>, <strong>amânarea înaintării<\/strong>, <strong>încetarea contractului<\/strong>).<\/li>\n<li>Un comandant superior poate aplica orice sancțiune pe care o poate aplica subordonatul lui.<\/li>\n<\/ul>\n<blockquote><p>✍️ <strong>Cifrele și tabelele exacte<\/strong> sunt în <strong>Anexa 2<\/strong> (sancțiuni) și <strong>Anexa 3<\/strong> (recompense). Completează tabelul de la final.<\/p><\/blockquote>"}, {"t": "De completat cu regulamentul în față", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nr.<\/th>\n<th>Întrebare<\/th>\n<th>Unde cauți<\/th>\n<th>Răspunsul tău<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Definiția exactă a disciplinei militare<\/td>\n<td>art. 2<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Definiția exactă a autorității militare<\/td>\n<td>art. 9–10<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Lista exactă a recompenselor morale pentru soldați și gradați<\/td>\n<td>art. 47–50<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Lista exactă a recompenselor materiale<\/td>\n<td>art. 47–50<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Exemple de abateri enumerate în regulament<\/td>\n<td>art. 51–59<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Lista sancțiunilor (compar cu tabelul de mai sus)<\/td>\n<td>art. 60–68<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Cum se aplică și se execută fiecare sancțiune; când se radiază<\/td>\n<td>art. 60–68<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Termenul de contestare, la cine, cine soluționează<\/td>\n<td>art. 80<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td><strong>Anexa 2:<\/strong> sancțiunile pe fiecare comandant (pluton / companie / batalion / unitate)<\/td>\n<td>Anexa 2<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td><strong>Anexa 3:<\/strong> recompensele pe fiecare comandant<\/td>\n<td>Anexa 3<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "flash": [["Cu ce act a fost aprobat RG-3?", "<b>Ordinul M.64/2013<\/b>."], ["Dreptul comandantului de a recompensa și sancționa?", "<b>Prerogativa disciplinară<\/b>."], ["Disciplina militară se bazează pe…?", "<b>Acceptarea conștientă<\/b>, recompense, sancțiuni."], ["Cum se poate da un ordin?", "<b>Verbal, în scris sau prin mijloace tehnice<\/b>."], ["Ce ordine nu se execută?", "Cele contrare <b>legii, obiceiurilor războiului, convențiilor internaționale<\/b>."], ["Abaterea disciplinară – condiția?", "Fapta <b>cu vinovăție<\/b>, <b>dacă nu e infracțiune<\/b>."], ["Recompensele soldaților sunt stabilite prin…?", "<b>Ordin al ministrului<\/b> (RG-3)."], ["Sancțiunile soldaților și gradaților profesioniști?", "<b>Avertisment, mustrare scrisă, retrogradare în funcție, amânarea înaintării 1–2 ani, încetarea contractului<\/b>."], ["Cea mai gravă sancțiune pentru un soldat?", "<b>Încetarea contractului<\/b> din motive disciplinare."], ["Sancțiunea fără cercetare prealabilă?", "<b>Avertismentul<\/b>."], ["Fără cercetare prealabilă, sancțiunea este…?", "<b>Nulă absolut<\/b>."], ["Timp pentru stabilirea sancțiunii?", "Cel mult <b>30 de zile calendaristice<\/b>."], ["Timp pentru executarea sancțiunii?", "Cel mult <b>30 de zile calendaristice<\/b> de la comunicare."], ["Abaterea trebuie adusă la cunoștința comandantului în…?", "<b>6 luni<\/b> de la săvârșire."], ["Câte sancțiuni pentru o abatere?", "<b>Una singură<\/b>."], ["Ce are în plus față de soldați un cadru militar?", "<b>Diminuarea soldei<\/b> și <b>trecerea în rezervă<\/b> (Legea 80)."], ["Cum e sancțiunea față de faptă?", "<b>Proporțională<\/b> cu gravitatea."], ["Ce drept are militarul înainte de sancțiune?", "Să fie <b>ascultat<\/b> și să se <b>apere<\/b>."], ["Calea finală de contestare?", "<b>Instanța de judecată<\/b>."], ["Care comandant poate da sancțiunile grele?", "Cel de <b>unitate<\/b> și mai sus."]], "q": [{"id": "L12-003", "p": 1, "q": "Care dintre următoarele este o sancțiune disciplinară aplicabilă soldaților și gradaților profesioniști?", "o": ["amânarea înaintării în gradul următor pe o perioadă de 1–2 ani", "arestul la domiciliu", "amenda contravențională", "degradarea militară"], "a": 0, "e": "Legea 384/2006, art. 28."}, {"id": "L12-004", "p": 1, "q": "Care dintre următoarele NU este o sancțiune disciplinară pentru soldații și gradații profesioniști?", "o": ["mustrarea scrisă", "trecerea în retragere", "încetarea contractului din motive disciplinare", "avertismentul"], "a": 1, "e": "Legea 384/2006, art. 28."}, {"id": "L12-006", "p": 1, "q": "Sancțiunile disciplinare aplicabile soldaților și gradaților profesioniști (cu excepția avertismentului) nu pot fi aplicate:", "o": ["fără o cercetare prealabilă efectuată de comisii, sub sancțiunea nulității absolute", "înainte de 6 luni de la abatere", "fără aprobarea Parlamentului", "fără acordul militarului sancționat"], "a": 0, "e": "Legea 384/2006, art. 30 alin. (1)."}, {"id": "L12-007", "p": 1, "q": "Singura sancțiune care se poate aplica soldaților și gradaților profesioniști fără cercetare prealabilă este:", "o": ["retrogradarea în funcție", "mustrarea scrisă", "încetarea contractului", "avertismentul"], "a": 3, "e": "Legea 384/2006, art. 30 alin. (1)."}, {"id": "L12-009", "p": 1, "q": "O abatere a unui soldat/gradat profesionist poate fi sancționată numai dacă a fost adusă la cunoștința comandantului în termen de:", "o": ["1 an de la săvârșire", "2 ani de la săvârșire", "30 de zile de la săvârșire", "6 luni de la săvârșire"], "a": 3, "e": "Legea 384/2006, art. 29 alin. (3)."}, {"id": "L12-002", "p": 2, "q": "Dreptul comandantului/șefului de a acorda recompense și de a aplica sancțiuni disciplinare se numește:", "o": ["competență civilă", "autoritate administrativă", "prerogativă disciplinară", "drept de veto"], "a": 2, "e": "Legea 80/1995, art. 32 alin. (3); RG-3."}, {"id": "L12-005", "p": 2, "q": "Sancțiunea disciplinară cea mai gravă pentru un soldat/gradat profesionist este:", "o": ["retrogradarea în funcție", "avertismentul", "mustrarea scrisă", "încetarea contractului din motive disciplinare"], "a": 3, "e": "Legea 384/2006, art. 28 lit. e)."}, {"id": "L12-008", "p": 2, "q": "Comandantul are la dispoziție, pentru a stabili aplicarea unei sancțiuni după ce a luat cunoștință de abatere, cel mult:", "o": ["6 luni", "5 zile lucrătoare", "30 de zile calendaristice", "2 ani"], "a": 2, "e": "Legea 384/2006, art. 29 alin. (1)."}, {"id": "L12-001", "p": 3, "q": "Regulamentul disciplinei militare a fost aprobat prin:", "o": ["HG 106/2011", "Ordinul M.26/2025", "Ordinul ministrului apărării naționale nr. M.64/2013", "Ordinul M.38/2016"], "a": 2, "e": "RG-3."}, {"id": "L12-010", "p": 3, "q": "Soldații și gradații profesioniști pot primi distincții nemateriale și avantaje financiare pentru îndeplinirea cu deosebită profesionalitate a sarcinilor, în condițiile stabilite prin:", "o": ["decizia comandantului de grupă", "lege organică specială pentru fiecare militar", "hotărâre a Parlamentului", "ordin al ministrului apărării naționale"], "a": 3, "e": "Legea 384/2006, art. 27."}]}, {"nr": 19, "id": "ordine-interioara", "t": "Ordinea interioară în unitate (RG-1)", "tema": "RG-1 Regulamentul de ordine interioară în unitate (Ordinul M.38/2016)", "parte": "L", "stele": 1, "itemi": "0–1", "timp": "40 min", "sursa": "RG-1 (Ordinul M.38/2016) – art. 5–23, 24–26, 27–37, 84–97, 98–105, 106–121, 122–125, 126–131, 132–143, 186–217, Anexa 3", "ps": "<p>Cum arată <strong>viața de zi cu zi într-o unitate<\/strong>: cine îți dă ordine, cum saluți, cum porți uniforma, ce e învoirea și permisia, cum faci un raport și cum intri în unitate. Pică <strong>regulile logice<\/strong> (cine salută primul, salutul în formație, raportul personal); <strong>cifrele exacte<\/strong> le iei din regulament.<\/p>", "fise": [{"t": "Avertisment: regulamentul nu e public integral", "h": "<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>RG-1 (M.38/2016) nu este publicat integral online.<\/strong> Capitolul îți dă <strong>structura, logica și regulile generale<\/strong> valabile în armată, ca să știi ce cauți. <strong>Cifrele exacte<\/strong> (zile de permisie, ore, distanțe) se iau <strong>direct din regulament<\/strong>, <strong>de la unitate<\/strong> (instructor, biroul documente, biblioteca unității).<\/p>\n<p><strong>Metoda:<\/strong> la final e un <strong>tabel de completat<\/strong>. Ia regulamentul, caută articolele indicate și completează-l cu pixul. Înveți de <strong>două ori<\/strong> mai bine decât citind. <strong>Nu inventăm cifre.<\/strong><\/p><\/aside>"}, {"t": "Cele 3 feluri de relații între militari (art. 5–23)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Relația<\/th>\n<th>Pe ce se bazează<\/th>\n<th>Exemplu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>De subordonare<\/strong> (șef – subordonat)<\/td>\n<td><strong>funcția<\/strong><\/td>\n<td>comandantul de pluton și militarii din pluton<\/td>\n<\/tr>\n<tr>\n<td><strong>De ierarhie militară<\/strong> (superior – inferior)<\/td>\n<td><strong>gradul<\/strong><\/td>\n<td>un plutonier din altă subunitate față de un sergent<\/td>\n<\/tr>\n<tr>\n<td><strong>De egalitate / colegialitate<\/strong><\/td>\n<td>același grad, fără subordonare<\/td>\n<td>doi sergenți din plutoane diferite<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Șeful<\/strong> îți dă ordine pentru că <strong>îl ai pe stat<\/strong> (funcție). <strong>Superiorul<\/strong> are doar <strong>grad mai mare<\/strong>: îl saluți și îl respecți, dar nu e neapărat șeful tău.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Șeful<\/strong> e <strong>profesorul tău de clasă<\/strong>. <strong>Superiorul<\/strong> e un <strong>elev din anul mai mare<\/strong>: îi spui „salut” politicos, dar nu-ți dă note.<\/p><\/aside>"}, {"t": "Ordinele și adresarea", "h": "<ul>\n<li><strong>Ordinul<\/strong> se dă de regulă <strong>pe cale ierarhică<\/strong>.<\/li>\n<li>Subordonatul confirmă că a înțeles (<strong>„Am înțeles!”<\/strong>), îl execută <strong>întocmai și la timp<\/strong>, apoi <strong>raportează<\/strong> executarea.<\/li>\n<li>⚠️ <strong>Ordinele contrare legii, obiceiurilor războiului și convențiilor internaționale nu se execută<\/strong> (și Legea 80/1995, art. 8).<\/li>\n<li><strong>Adresarea:<\/strong> <strong>„Domnule / Doamnă” + gradul<\/strong> (ex. „Domnule plutonier”), cu politețe și respect reciproc.<\/li>\n<li>Șefii <strong>își cunosc subordonații<\/strong>, le apără drepturile și dau <strong>exemplu personal<\/strong>.<\/li>\n<\/ul>"}, {"t": "Salutul militar", "h": "<ul>\n<li>Salutul este o <strong>formă de respect reciproc<\/strong> și o manifestare a disciplinei.<\/li>\n<li>Salută <strong>primul<\/strong>: <strong>subordonatul pe șef<\/strong>, <strong>inferiorul pe superior<\/strong>. La grade egale salută <strong>cel mai politicos<\/strong>.<\/li>\n<li><strong>Cu acoperământ:<\/strong> <strong>mâna dreaptă la acoperământ<\/strong>.<\/li>\n<li><strong>Fără acoperământ:<\/strong> poziția de <strong>drepți<\/strong> și <strong>întoarcerea capului<\/strong> spre cel salutat.<\/li>\n<li><strong>În formație<\/strong>, militarii <strong>nu salută individual<\/strong>: salută <strong>comandantul formației<\/strong>.<\/li>\n<li>Se salută și <strong>Drapelul de luptă<\/strong>, <strong>Imnul național<\/strong>, monumentele eroilor, convoaiele funerare militare.<\/li>\n<\/ul>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: <strong>în formație nu salută fiecare<\/strong>. Salută doar comandantul formației.<\/p><\/aside>"}, {"t": "Personalul civil și comportarea (art. 24–37)", "h": "<ul>\n<li><strong>Relațiile cu personalul civil<\/strong> din armată: <strong>respect reciproc<\/strong> și <strong>raporturile de subordonare din statul de organizare<\/strong>. Un civil poate fi șeful unui militar dacă așa e funcția.<\/li>\n<li>În <strong>locuri publice<\/strong> și <strong>mijloace de transport<\/strong>: ținută îngrijită, comportare civilizată, fără gesturi care lezează prestigiul uniformei.<\/li>\n<li><strong>Nu consumi alcool<\/strong> în uniformă în locuri publice și <strong>nu te prezinți la serviciu sub influența alcoolului<\/strong>.<\/li>\n<li>Militarii dau <strong>sprijin<\/strong> în situații de urgență (accidente, calamități).<\/li>\n<\/ul>"}, {"t": "Activitatea zilnică (art. 84–97)", "h": "<p>Se desfășoară după <strong>programul zilnic<\/strong> aprobat de <strong>comandantul unității<\/strong>.<\/p>\n<p><strong>Momentele principale:<\/strong> <strong>deșteptarea → înviorarea → inspecția de dimineață → instrucția / programul de lucru → masa → apelul de seară → stingerea<\/strong>.<\/p>\n<ul>\n<li>Cei cazați în unitate au un <strong>timp de odihnă (somn) neîntrerupt<\/strong>, stabilit de regulament.<\/li>\n<li><strong>Apelul de seară<\/strong> verifică prezența și transmite ordinele pentru ziua următoare.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>zi de tabără<\/strong>: ai program, ai oră de trezire, de masă și de stingere.<\/p><\/aside>"}, {"t": "Uniforma, identitatea, bijuteriile, frizura (art. 98–105)", "h": "<ul>\n<li><strong>Uniforma<\/strong> se poartă <strong>corect și complet<\/strong>. ⚠️ <strong>Este interzisă combinarea uniformei cu haine civile.<\/strong><\/li>\n<li><strong>Semnul personal de identitate<\/strong> (<strong>placheta<\/strong>) se poartă <strong>la gât<\/strong>, în <strong>misiuni, exerciții, trageri<\/strong> și când se ordonă. Conține datele de identificare.<\/li>\n<li><strong>Semnul individual de avertizare medicală<\/strong>: pentru cei cu <strong>afecțiuni sau alergii<\/strong> de care trebuie să se știe în urgență.<\/li>\n<li><strong>Bijuteriile<\/strong>: <strong>discret<\/strong>, de regulă doar <strong>verigheta<\/strong> și <strong>ceasul<\/strong>.<\/li>\n<li><strong>Frizura bărbați<\/strong>: păr <strong>scurt și îngrijit<\/strong>, <strong>față rasă zilnic<\/strong>; mustața, dacă e permisă, <strong>îngrijită<\/strong>. <strong>Femei<\/strong>: păr <strong>strâns<\/strong>, să nu împiedice portul acoperământului.<\/li>\n<\/ul>\n<blockquote><p>✍️ Regulile exacte (lungimi, ce e permis) sunt în art. 101–105: vezi tabelul de la final.<\/p><\/blockquote>"}, {"t": "Igiena, scutiri, învoiri, permisii (art. 106–131)", "h": "<ul>\n<li><strong>Igiena<\/strong> individuală și colectivă (dormitoare, spălătoare, sala de mese) zilnic.<\/li>\n<li><strong>Asistența medicală<\/strong> o dă <strong>medicul unității<\/strong>.<\/li>\n<li><strong>Scutirile medicale<\/strong> (de efort, instrucție, serviciu) le acordă <strong>medicul<\/strong>; se comunică comandantului de subunitate.<\/li>\n<li><strong>Concediile medicale<\/strong> nu se scad din concediul de odihnă (Legea 80/1995, art. 18).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Noțiune<\/th>\n<th>Ce este<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Învoirea<\/strong><\/td>\n<td><strong>absență aprobată<\/strong> de la program pentru <strong>câteva ore<\/strong> sau în afara programului (de ex. ieșirea din garnizoană)<\/td>\n<\/tr>\n<tr>\n<td><strong>Permisia<\/strong><\/td>\n<td>absență de <strong>una sau mai multe zile<\/strong> pentru <strong>situații personale sau familiale deosebite<\/strong> (căsătorie, naștere copil, deces în familie etc.)<\/td>\n<\/tr>\n<tr>\n<td><strong>Concediul de odihnă<\/strong><\/td>\n<td>dreptul anual prevăzut de lege<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Cine aprobă și <strong>câte zile<\/strong> → din regulament (tabelul de la final).<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Învoire = ore. Permisie = zile.<\/strong><\/p><\/aside>"}, {"t": "Raportul personal (art. 132–143)", "h": "<ul>\n<li>Prin <strong>raportul personal<\/strong>, militarul se adresează comandantului cu <strong>cereri, propuneri sau reclamații<\/strong> privind <strong>probleme personale sau de serviciu<\/strong>.<\/li>\n<li>Se prezintă <strong>pe cale ierarhică<\/strong>, începând cu <strong>șeful nemijlocit<\/strong>. Poate fi <strong>verbal<\/strong> sau <strong>scris<\/strong>.<\/li>\n<li>Se <strong>înregistrează<\/strong> și se <strong>soluționează în termen<\/strong>; militarul primește <strong>răspuns<\/strong>.<\/li>\n<li>⚠️ <strong>Nu se admit rapoarte colective<\/strong>: fiecare raportează <strong>în nume propriu<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>cerere la școală<\/strong>: o scrii tu, o dai prin diriginte, primești răspuns scris. Nu o semnează toată clasa.<\/p><\/aside>"}, {"t": "Tabere, transporturi, accesul în unitate (art. 186–217)", "h": "<ul>\n<li><strong>Tabere și cartiruire<\/strong>: aceleași reguli de ordine interioară, adaptate; se organizează serviciul interior, igiena și paza.<\/li>\n<li><strong>Transporturi militare<\/strong> (feroviar, auto, naval, aerian): se numește un <strong>comandant al transportului (eșalonului)<\/strong>; nu părăsești vagonul/vehiculul fără aprobare; se respectă regulile de siguranță.<\/li>\n<li><strong>Accesul în unitate<\/strong>: <strong>numai prin punctul de control<\/strong>, cu <strong>legitimație militară / permis de acces<\/strong>. <strong>Vizitatorii<\/strong> au nevoie de aprobare, sunt <strong>înregistrați<\/strong> și, de regulă, <strong>însoțiți<\/strong>.<\/li>\n<\/ul>"}, {"t": "De completat cu regulamentul în față", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nr.<\/th>\n<th>Întrebare<\/th>\n<th>Unde cauți<\/th>\n<th>Răspunsul tău<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>De la ce distanță (pași) începi salutul și până când îl ții?<\/td>\n<td>art. 5–23<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Cine salută primul la grade egale?<\/td>\n<td>art. 5–23<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Formula exactă de raportare la un superior<\/td>\n<td>art. 5–23<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Cât durează somnul neîntrerupt al celor cazați?<\/td>\n<td>art. 84–97<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Ce cuprinde programul zilnic și cine îl aprobă?<\/td>\n<td>art. 84–97<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Ce date sunt pe semnul de identitate? Câte bucăți are?<\/td>\n<td>art. 101–103<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Ce bijuterii sunt permise în uniformă?<\/td>\n<td>art. 101–103<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Reguli exacte pentru frizură, barbă, mustață<\/td>\n<td>art. 104–105<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>9<\/td>\n<td>Ce tipuri de scutiri medicale există?<\/td>\n<td>art. 122–125<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>10<\/td>\n<td>Zile de permisie pentru căsătorie / naștere / deces; cine aprobă<\/td>\n<td>art. 126–131<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>11<\/td>\n<td>Cine aprobă învoirea și pe ce durată maximă<\/td>\n<td>art. 126–131<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>12<\/td>\n<td>În cât timp se răspunde la raportul personal<\/td>\n<td>art. 132–143<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>13<\/td>\n<td>Ce este interzis la rapoartele personale<\/td>\n<td>art. 132–143<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>14<\/td>\n<td>Documente la accesul în unitate; cum intră vizitatorii<\/td>\n<td>art. 186–217<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>15<\/td>\n<td>Ce conține Anexa 3 (3 rânduri)<\/td>\n<td>Anexa 3<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "flash": [["Relația șef – subordonat se bazează pe…?", "<b>Funcție<\/b>."], ["Relația superior – inferior se bazează pe…?", "<b>Grad<\/b> (ierarhie militară)."], ["La primirea unui ordin, militarul…?", "Confirmă (<b>„Am înțeles!”<\/b>), execută <b>întocmai și la timp<\/b>, <b>raportează<\/b> executarea."], ["Ordinele contrare legii…?", "<b>Nu se execută<\/b>."], ["Cum te adresezi?", "<b>„Domnule/Doamnă” + gradul<\/b>."], ["Cine salută primul?", "<b>Subordonatul pe șef, inferiorul pe superior<\/b>."], ["Salutul în formație?", "Militarii <b>nu salută individual<\/b>; salută <b>comandantul formației<\/b>."], ["Salutul fără acoperământ?", "<b>Poziția de drepți<\/b> și <b>întoarcerea capului<\/b> spre cel salutat."], ["Uniforma combinată cu haine civile?", "<b>Interzis<\/b>."], ["Placheta de identificare se poartă…?", "<b>La gât<\/b>, în misiuni, exerciții, trageri și când se ordonă."], ["Cine acordă scutirile medicale?", "<b>Medicul<\/b>."], ["Cine aprobă programul zilnic?", "<b>Comandantul unității<\/b>."], ["Învoire sau permisie – care e pe ore?", "<b>Învoirea<\/b>. Permisia e pe <b>zile<\/b>."], ["Permisia se acordă pentru…?", "<b>Situații personale sau familiale deosebite<\/b>."], ["Raportul personal se prezintă…?", "<b>Pe cale ierarhică<\/b>, începând cu șeful nemijlocit."], ["Cu ce poți veni prin raportul personal?", "<b>Cereri, propuneri, reclamații<\/b>."], ["Rapoarte colective?", "<b>Nu se admit<\/b>."], ["Accesul în unitate se face…?", "<b>Numai prin punctul de control<\/b>, cu legitimație sau permis."], ["Vizitatorii?", "Aprobare, <b>înregistrare<\/b>, de regulă <b>însoțire<\/b>."], ["Cine conduce un transport militar?", "<b>Comandantul transportului (eșalonului)<\/b>."]], "q": [{"id": "L10-001", "p": 1, "q": "Relațiile de subordonare dintre militari (șef – subordonat) se stabilesc în funcție de:", "o": ["vârsta militarilor", "funcțiile pe care le ocupă militarii", "vechimea în armată", "gradul militar, exclusiv"], "a": 1, "e": "Relațiile de subordonare au la bază funcția; cele de superioritate/inferioritate au la bază gradul."}, {"id": "L10-002", "p": 1, "q": "Relațiile de superioritate–inferioritate (ierarhie militară) se stabilesc în funcție de:", "o": ["vârstă", "unitatea din care fac parte", "funcție", "gradul militar"], "a": 3, "e": "RG-1, relațiile dintre militari."}, {"id": "L10-003", "p": 1, "q": "La primirea unui ordin, militarul:", "o": ["îl discută cu colegii înainte de a-l executa", "confirmă că a înțeles, îl execută întocmai și la timp și raportează executarea", "îl execută doar dacă este de acord cu el", "cere ordinul în scris înainte de a-l executa"], "a": 1, "e": "RG-1 / Legea 80, art. 8."}, {"id": "L10-005", "p": 1, "q": "În relațiile dintre militari, salută primul:", "o": ["militarul mai în vârstă", "militarul care are mai multe decorații", "subordonatul pe șef și inferiorul pe superior", "șeful pe subordonat"], "a": 2, "e": "RG-1, salutul militar."}, {"id": "L10-011", "p": 1, "q": "Permisia se acordă militarilor pentru:", "o": ["studii universitare", "participarea la mitinguri", "odihnă anuală", "situații personale sau familiale deosebite (de exemplu căsătorie, naștere, deces în familie)"], "a": 3, "e": "RG-1, art. 126–131; Legea 80/1995, art. 17."}, {"id": "L10-012", "p": 1, "q": "Raportul personal se prezintă:", "o": ["pe cale ierarhică, începând cu șeful nemijlocit", "numai în scris, prin poștă", "direct ministrului apărării, în orice situație", "prin intermediul presei"], "a": 0, "e": "RG-1, rapoartele personale."}, {"id": "L10-004", "p": 2, "q": "Ordinele contrare legii, obiceiurilor războiului și convențiilor internaționale:", "o": ["se execută numai în prezența unui martor", "se execută dacă vin de la un general", "nu se execută", "se execută și apoi se raportează"], "a": 2, "e": "RG-1 / Legea 80/1995, art. 8 lit. b)."}, {"id": "L10-006", "p": 2, "q": "Militarii care se află în formație:", "o": ["salută numai generalii", "nu salută niciodată", "salută fiecare individual", "nu salută individual; salută comandantul formației"], "a": 3, "e": "RG-1, salutul militar."}, {"id": "L10-007", "p": 2, "q": "Fără acoperământ, salutul se execută prin:", "o": ["ridicarea mâinii stângi", "luarea poziției de drepți și întoarcerea capului spre cel salutat", "o înclinare a corpului", "ducerea mâinii la tâmplă"], "a": 1, "e": "RG-1, salutul militar."}, {"id": "L10-009", "p": 2, "q": "Semnul personal de identitate (placheta de identificare) se poartă:", "o": ["numai în cazarmă", "la gât, pe timpul misiunilor, exercițiilor, tragerilor și ori de câte ori se ordonă", "în buzunarul de la piept, permanent", "numai în concediu"], "a": 1, "e": "RG-1, art. 101–103."}, {"id": "L10-010", "p": 2, "q": "Scutirile medicale se acordă de:", "o": ["comandantul de grupă", "colegii de cameră", "ofițerul de serviciu", "medicul unității"], "a": 3, "e": "RG-1, scutiri și concedii medicale."}, {"id": "L10-013", "p": 2, "q": "Prin raportul personal, militarul se poate adresa comandantului:", "o": ["numai în timpul concediului", "în nume propriu, cu cereri, propuneri sau reclamații privind probleme personale sau de serviciu", "numai cu reclamații împotriva colegilor", "în numele întregii subunități"], "a": 1, "e": "RG-1, rapoartele personale – nu se admit rapoarte colective."}, {"id": "L10-014", "p": 2, "q": "Accesul în unitatea militară se face:", "o": ["prin orice poartă deschisă", "numai prin punctul de control, pe bază de legitimație sau permis de acces", "pe orice cale, dacă militarul este în uniformă", "fără nicio verificare, în timpul programului"], "a": 1, "e": "RG-1, accesul în unitate."}, {"id": "L10-008", "p": 3, "q": "Purtarea uniformei militare în combinație cu articole de îmbrăcăminte civilă:", "o": ["este permisă în zilele libere", "este permisă iarna", "este permisă cu aprobarea colegilor", "este interzisă"], "a": 3, "e": "RG-1, portul uniformei."}, {"id": "L10-015", "p": 3, "q": "Activitatea zilnică în unitate se desfășoară conform:", "o": ["programului stabilit de fiecare militar", "programului stabilit de sindicat", "programului zilnic aprobat de comandantul unității", "programului primăriei"], "a": 2, "e": "RG-1, activitatea zilnică."}]}, {"nr": 20, "id": "serviciul-interior", "t": "Serviciul interior (Ordinul M.26/2025)", "tema": "Regulamentul serviciului interior (Ordinul M.26/14.02.2025)", "parte": "L", "stele": 1, "itemi": "0–1", "timp": "35 min", "sursa": "Regulamentul serviciului interior, Ordinul M.26/2025 – art. 6, 7; art. 8 alin. (2)–(4); art. 9–15; 18–23; 28–30; 31–33; 142–145", "ps": "<p>Cum e organizată <strong>paza și ordinea într-un obiectiv militar<\/strong>: cele <strong>5 tipuri de servicii<\/strong>, cine le execută, armamentul, odihna după serviciu, <strong>zonele restricționate<\/strong> și <strong>somațiile santinelei<\/strong>. Pică <strong>cele 4 somații în ordine<\/strong> și <strong>categoriile de servicii<\/strong>.<\/p>", "fise": [{"t": "Avertisment: publicat doar în extras", "h": "<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Regulamentul a fost <strong>publicat în Monitorul Oficial doar în extras<\/strong>. Unele detalii (ore exacte, număr de cartușe, formulele de identificare) <strong>se iau direct din regulament, la unitate<\/strong>. Mai jos ai <strong>tot ce e public și sigur<\/strong>, plus un <strong>tabel de completat<\/strong>. <strong>Nu inventăm cifre.<\/strong><\/p><\/aside>\n<p><strong>Date:<\/strong> aprobat prin <strong>Ordinul M.26/14.02.2025<\/strong>, publicat în <strong>M.Of. nr. 162/24.02.2025<\/strong>, <strong>în vigoare de la 1 martie 2025<\/strong>. A abrogat regulamentul anterior (M.20/2022).<\/p>"}, {"t": "Noțiuni de bază", "h": "<ul>\n<li><strong>Obiectiv militar<\/strong> = <strong>cazarmă, tabără de instrucție, zonă de dislocare<\/strong>, <strong>depozit, port, aeroport, aerodrom, poligon<\/strong>, aflate în <strong>proprietatea, administrarea sau paza MApN<\/strong>.<\/li>\n<li><strong>Comandantul obiectivului:<\/strong><\/li>\n<li>dacă e <strong>o singură unitate<\/strong> → <strong>comandantul acelei unități<\/strong>;<\/li>\n<li>dacă sunt <strong>mai multe unități<\/strong> → numit prin <strong>ordin al comandantului eșalonului superior<\/strong> comun.<\/li>\n<li><strong>Serviciul interior se organizează la nivelul fiecărui obiectiv militar.<\/strong> În tabere și zone de dislocare se organizează pe baza <strong>datelor din recunoaștere<\/strong>, la ordinul comandantului unității organizatoare.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Obiectivul militar e ca <strong>o școală<\/strong>: are un <strong>director<\/strong> (comandantul obiectivului). Dacă în aceeași clădire sunt două școli, directorul e numit de <strong>inspectoratul<\/strong> de deasupra lor.<\/p><\/aside>"}, {"t": "Cele 5 tipuri de servicii ⚠️", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lit.<\/th>\n<th>Serviciul<\/th>\n<th>Pe scurt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td><strong>de permanență<\/strong><\/td>\n<td>ofițerul de serviciu, ajutorul, subofițerul de la punctul de control etc. → <strong>ordine interioară și controlul accesului<\/strong><\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td><strong>operativ<\/strong><\/td>\n<td><strong>conducerea operativă<\/strong> și transmiterea ordinelor/informărilor<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td><strong>de continuitate a conducerii<\/strong><\/td>\n<td><strong>continuitatea actului de comandă<\/strong> în afara programului<\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td><strong>tehnic de monitorizare și avertizare<\/strong><\/td>\n<td>monitorizează <strong>sistemele tehnice<\/strong> (alarmă, video, senzori) și avertizează<\/td>\n<\/tr>\n<tr>\n<td>e)<\/td>\n<td><strong>de pază și intervenție<\/strong><\/td>\n<td><strong>santinele, patrule, grupe de intervenție<\/strong> → paza obiectivului<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>„P-O-C-T-P”<\/strong>: <strong>P<\/strong>ermanență, <strong>O<\/strong>perativ, <strong>C<\/strong>ontinuitate, <strong>T<\/strong>ehnic, <strong>P<\/strong>ază și intervenție.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>echipă de pază la un muzeu<\/strong>: cineva e la recepție (permanența), cineva ia deciziile (operativ), cineva înlocuiește șeful noaptea (continuitatea), cineva se uită la camere (tehnic), cineva patrulează (pază).<\/p><\/aside>"}, {"t": "Cine execută serviciul și cum e selecționat", "h": "<ul>\n<li>Serviciul interior este <strong>atribuție de serviciu<\/strong> a <strong>personalului militar și civil al MApN<\/strong>. Se trece în <strong>fișa postului<\/strong> (excepție: personalul scutit prin reglementări specifice).<\/li>\n<li>Personalul se <strong>selecționează<\/strong> dintre cei cu <strong>pregătirea necesară<\/strong>, <strong>apți medical și psihologic<\/strong>, cu <strong>conduită corespunzătoare<\/strong>.<\/li>\n<li><strong>Numirea<\/strong> se face prin <strong>ordinul de zi pe unitate (OZU)<\/strong>.<\/li>\n<li><strong>Examinarea medicală și asistența psihologică:<\/strong> personalul din serviciu, mai ales cel <strong>înarmat<\/strong>, este <strong>verificat medical<\/strong> înainte de intrarea în serviciu și are <strong>asistență psihologică<\/strong>. Cine <strong>nu este apt<\/strong> nu intră în serviciu.<\/li>\n<\/ul>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: cine face serviciul înarmat trebuie să fie <strong>apt medical și psihologic<\/strong>, nu „oricine e disponibil”.<\/p><\/aside>"}, {"t": "Armamentul, încărcarea, odihna", "h": "<ul>\n<li>Personalul din serviciu primește <strong>armament și muniție<\/strong> conform regulamentului și consemnului, <strong>pe bază de semnătură<\/strong>.<\/li>\n<li><strong>Încărcarea și descărcarea<\/strong> armamentului se fac <strong>numai în locuri special amenajate<\/strong> (punct de încărcare-descărcare), sub supraveghere.<\/li>\n<li><strong>Folosirea armamentului (uzul de armă)<\/strong> se face <strong>numai<\/strong> în condițiile <strong>Legii 122/2011<\/strong> (vezi capitolul despre uzul de armă).<\/li>\n<li>După serviciu (de regulă <strong>24 de ore<\/strong>) urmează <strong>timp de odihnă și recuperare<\/strong>, cu durata din regulament. În acest timp <strong>nu se planifică alte activități<\/strong>, cu excepțiile din regulament.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la <strong>șoferii de TIR<\/strong>: după tură ai <strong>pauză obligatorie<\/strong>, ca să nu conduci obosit.<\/p><\/aside>"}, {"t": "Măsuri de siguranță opozabile terților", "h": "<p>În <strong>zonele militare restricționate<\/strong> din jurul obiectivelor se pot stabili <strong>4 categorii<\/strong> de măsuri:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>#<\/th>\n<th>Categoria<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>interzicere, avertizare sau semnalizare<\/strong> (panouri, indicatoare)<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>control, detecție și supraveghere<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>interzicerea sau limitarea accesului și circulației<\/strong> persoanelor și vehiculelor<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td><strong>interzicerea sau limitarea folosirii unor dispozitive electronice<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Comandanții obiectivelor<\/strong> pot dispune, între altele:<\/p>\n<ul>\n<li>dispozitive de <strong>avertizare<\/strong> pe perimetru;<\/li>\n<li>📡 <strong>interzicerea temporară sau bruiajul emisiilor electromagnetice<\/strong>, cu respectarea <strong>compatibilității electromagnetice<\/strong>;<\/li>\n<li><strong>redirecționarea sau restricționarea traficului<\/strong> pietonal/rutier, prin structurile MAI, cu sprijinul <strong>poliției militare<\/strong>;<\/li>\n<li><strong>scanarea bagajelor de mână<\/strong> la intrare și ieșire;<\/li>\n<li>verificarea cu <strong>detectoare mobile<\/strong> de arme și dispozitive explozive improvizate;<\/li>\n<li><strong>supraveghere video<\/strong> a participanților la activitățile MApN;<\/li>\n<li><strong>interzicerea depozitării materialelor inflamabile<\/strong> în zonă;<\/li>\n<li><strong>semnale sonore<\/strong> pentru alertarea personalului și dirijarea subunităților de pază.<\/li>\n<\/ul>\n<p><strong>Limitele zonei<\/strong> le propune <strong>comandantul obiectivului<\/strong>. Limitele geografice, restricțiile și durata se stabilesc de reprezentanții MApN, după <strong>consultarea autorităților<\/strong>, prin <strong>protocol de cooperare<\/strong> sau cu <strong>acordul scris<\/strong> al proprietarilor terenului.<\/p>\n<blockquote><p>📡 Ca viitor operator de comunicații: <strong>bruiajul emisiilor<\/strong> apare aici, cu condiția <strong>compatibilității electromagnetice<\/strong>.<\/p><\/blockquote>"}, {"t": "Somațiile santinelei ⚠️", "h": "<p>Conform <strong>Legii 122/2011, art. 16–17<\/strong>, în ordine:<\/p>\n<ol>\n<li><strong>„Stai!”<\/strong><\/li>\n<li><strong>„Stai, că trag!”<\/strong><\/li>\n<li><strong>foc de avertisment în plan vertical<\/strong><\/li>\n<li><strong>uz de armă<\/strong>, țintind să imobilizezi (de regulă la picioare).<\/li>\n<\/ol>\n<ul>\n<li>Pentru cei care împiedică misiunile de luptă: <strong>de 3 ori<\/strong> „Părăsiți…, vom folosi arme de foc!”.<\/li>\n<li><strong>Identificarea<\/strong> celor care se apropie de post se face după <strong>consemnul postului<\/strong> (cu <strong>parolă / semnal de recunoaștere<\/strong> stabilit pentru fiecare zi); persoana necunoscută este <strong>oprită și reținută<\/strong> până sosește <strong>șeful de gardă / patrula<\/strong>.<\/li>\n<\/ul>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Pașii somației\">\n  <defs><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\"><path d=\"M0 0 L10 5 L0 10z\" class=\"f-mut\"/><\/marker><\/defs>\n  <g stroke-width=\"1.5\">\n    <rect x=\"30\" y=\"8\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-acs s-acc\"/>\n    <rect x=\"30\" y=\"78\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-ams s-amb\"/>\n    <rect x=\"30\" y=\"148\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-ams s-amb\"/>\n    <rect x=\"30\" y=\"218\" width=\"250\" height=\"44\" rx=\"10\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-m t-b t-l\"><text x=\"44\" y=\"36\">1<\/text><text x=\"44\" y=\"106\">2<\/text><text x=\"44\" y=\"176\">3<\/text><text x=\"44\" y=\"246\">4<\/text><\/g>\n  <g class=\"t-b t-l\"><text x=\"70\" y=\"36\">„Stai!”<\/text><text x=\"70\" y=\"106\">„Stai, că trag!”<\/text><text x=\"70\" y=\"176\">Foc în sus ↑<\/text><text x=\"70\" y=\"246\">Uz de armă<\/text><\/g>\n  <g class=\"s-mut\" stroke-width=\"1.5\" marker-end=\"url(#ar2)\"><line x1=\"155\" y1=\"52\" x2=\"155\" y2=\"76\"/><line x1=\"155\" y1=\"122\" x2=\"155\" y2=\"146\"/><line x1=\"155\" y1=\"192\" x2=\"155\" y2=\"216\"/><\/g>\n  <g class=\"t-mut\" style=\"font-size:12px\"><text x=\"290\" y=\"34\">somația<\/text><text x=\"290\" y=\"104\">avertizare<\/text><text x=\"290\" y=\"168\">foc de<\/text><text x=\"290\" y=\"183\">avertisment<\/text><text x=\"290\" y=\"238\">țintește<\/text><text x=\"290\" y=\"253\">picioarele<\/text><\/g>\n  <text x=\"200\" y=\"290\" text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\">Treci la pasul următor doar dacă persoana NU se oprește.<\/text>\n<\/svg><figcaption>Somațiile în ordine: strigi „Stai!”, apoi „Stai, că trag!”, apoi foc de avertisment în plan vertical, abia la urmă uz de armă.<\/figcaption><\/figure>\n\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Strigi, strigi tare, tragi în aer, tragi în ținta de imobilizare.<\/strong> Niciodată nu sari peste pași.<\/p><\/aside>"}, {"t": "De completat cu regulamentul în față", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nr.<\/th>\n<th>Întrebare<\/th>\n<th>Unde cauți<\/th>\n<th>Răspunsul tău<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Ce cuprinde fiecare din cele 5 tipuri de serviciu (funcții concrete)<\/td>\n<td>art. 6–7<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Cine nu poate fi numit în serviciu (incompatibilități)<\/td>\n<td>art. 9–15<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Cine face examinarea medicală, când, și ce se întâmplă dacă nu ești apt<\/td>\n<td>art. 18–23<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Ce armament și câtă muniție primește santinela / patrula / ofițerul de serviciu<\/td>\n<td>art. 28–30<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Unde și cum se face încărcarea/descărcarea<\/td>\n<td>art. 28–30<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Câte ore de odihnă și recuperare după serviciu<\/td>\n<td>art. 31–33<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>7<\/td>\n<td>Formula exactă de identificare la apropierea de post<\/td>\n<td>art. 142–145<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>Ce face santinela după identificare / reținere; pe cine anunță<\/td>\n<td>art. 142–145<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "flash": [["Când a intrat în vigoare Regulamentul serviciului interior M.26/2025?", "<b>1 martie 2025<\/b>."], ["Cu ce ordin a fost aprobat?", "<b>Ordinul M.26/14.02.2025<\/b>."], ["Unde se organizează serviciul interior?", "<b>La nivelul fiecărui obiectiv militar<\/b>."], ["Dacă în obiectiv e o singură unitate, comandantul obiectivului este…?", "<b>Comandantul acelei unități<\/b>."], ["Dacă sunt mai multe unități?", "Numit prin <b>ordin al comandantului eșalonului superior<\/b> comun."], ["Executarea serviciului interior este…?", "<b>Atribuție de serviciu<\/b> (în fișa postului)."], ["Câte tipuri de servicii?", "<b>5<\/b>: permanență, operativ, continuitate a conducerii, tehnic de monitorizare și avertizare, pază și intervenție."], ["Cum se numește personalul din serviciu?", "Numit prin <b>ordinul de zi pe unitate (OZU)<\/b>."], ["Cum trebuie să fie cine execută serviciul înarmat?", "<b>Apt medical și psihologic<\/b>."], ["Unde se încarcă și se descarcă armamentul?", "<b>Numai în locuri special amenajate<\/b>."], ["Uzul de armă se face după…?", "<b>Legea 122/2011<\/b>."], ["Categorii de măsuri opozabile terților?", "<b>Interzicere/avertizare, control/detecție, limitarea accesului, limitarea dispozitivelor electronice<\/b>."], ["Ce poate dispune comandantul legat de emisii?", "<b>Interzicerea temporară sau bruiajul<\/b>, cu respectarea compatibilității electromagnetice."], ["Cine propune limitele zonei restricționate?", "<b>Comandantul obiectivului<\/b>."], ["Somațiile santinelei, în ordine?", "<b>„Stai!” → „Stai, că trag!” → foc de avertisment în plan vertical → uz de armă<\/b>."], ["Persoana necunoscută la post?", "<b>Oprită și reținută<\/b> până sosește șeful de gardă / patrula."]], "q": [{"id": "L11-001", "p": 1, "q": "Potrivit Regulamentului serviciului interior (M.26/2025), serviciul interior cuprinde:", "o": ["serviciul de permanență și serviciul de pază, exclusiv", "serviciul de gardă, serviciul de zi și serviciul de noapte", "serviciul de permanență, serviciul operativ, serviciul de continuitate a conducerii, serviciul tehnic de monitorizare și avertizare, serviciul de pază și intervenție", "serviciul de pază, serviciul de cantină și serviciul de transport"], "a": 2, "e": "Ordinul M.26/2025 – cinci tipuri de servicii."}, {"id": "L11-002", "p": 1, "q": "Regulamentul serviciului interior aprobat prin Ordinul M.26/2025 a intrat în vigoare la:", "o": ["1 martie 2025", "14 februarie 2025", "1 iunie 2025", "1 ianuarie 2025"], "a": 0, "e": "Ordinul M.26/2025, art. 2."}, {"id": "L11-009", "p": 1, "q": "Somațiile santinelei, în ordinea legală, sunt:", "o": ["„Mâinile sus!”, „Stai, că trag!”", "foc de avertisment, apoi „Stai!”", "„Cine e acolo?”, foc de avertisment, „Stai!”", "„Stai!”, „Stai, că trag!”, apoi foc de avertisment în plan vertical"], "a": 3, "e": "RSI și Legea 122/2011, art. 16."}, {"id": "L11-003", "p": 2, "q": "Serviciul interior se organizează:", "o": ["la nivelul fiecărei garnizoane, în comun cu Poliția", "la nivelul fiecărui obiectiv militar", "numai la nivelul Statului Major al Apărării", "numai la nivelul brigăzii"], "a": 1, "e": "RSI, dispoziții generale."}, {"id": "L11-005", "p": 2, "q": "Executarea serviciului interior constituie:", "o": ["o activitate voluntară", "atribuție de serviciu pentru personalul militar și civil al MApN, prevăzută în fișa postului", "o activitate exclusiv a soldaților", "o activitate plătită separat, pe bază de contract"], "a": 1, "e": "RSI."}, {"id": "L11-006", "p": 2, "q": "Care dintre următoarele este o categorie de măsuri de siguranță opozabile terților?", "o": ["percheziția domiciliilor din apropiere", "închiderea magazinelor din oraș", "confiscarea autoturismelor din zonă", "interzicerea sau limitarea utilizării unor dispozitive electronice"], "a": 3, "e": "RSI – măsuri de interzicere/avertizare/semnalizare; control, detecție, supraveghere; limitarea accesului și circulației; limitarea dispozitivelor electronice."}, {"id": "L11-010", "p": 2, "q": "Personalul care urmează să execute serviciul interior înarmat trebuie să fie:", "o": ["absolvent de studii superioare", "mai în vârstă de 30 de ani", "căsătorit", "apt din punct de vedere medical și psihologic"], "a": 3, "e": "RSI – examinarea medicală și asistența psihologică."}, {"id": "L11-004", "p": 3, "q": "Dacă într-un obiectiv militar funcționează o singură unitate, comandantul obiectivului este:", "o": ["comandantul garnizoanei", "șeful de stat major al eșalonului superior", "ofițerul de serviciu", "comandantul acelei unități"], "a": 3, "e": "RSI."}, {"id": "L11-007", "p": 3, "q": "În zona militară restricționată, comandantul obiectivului poate dispune, cu respectarea compatibilității electromagnetice:", "o": ["tăierea alimentării cu energie a localității", "interzicerea temporară sau bruierea emisiilor electromagnetice", "confiscarea telefoanelor tuturor trecătorilor", "interceptarea convorbirilor telefonice ale civililor"], "a": 1, "e": "RSI, măsuri de siguranță."}, {"id": "L11-008", "p": 3, "q": "Limitele zonei militare restricționate din proximitatea obiectivului sunt propuse de:", "o": ["prefect", "comandantul obiectivului militar", "ofițerul de serviciu", "primarul localității"], "a": 1, "e": "RSI."}, {"id": "L11-011", "p": 3, "q": "Încărcarea și descărcarea armamentului personalului din serviciu se fac:", "o": ["oriunde în unitate", "în dormitor", "în fața punctului de control, pe drumul public", "numai în locurile special amenajate, sub supraveghere"], "a": 3, "e": "RSI – armamentul și muniția personalului."}]}], "pg": {"examen": "<h2>1. Cum arată examenul (Metodologia 2026–2027)<\/h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Ce se dă<\/strong><\/td>\n<td><strong>o singură probă<\/strong>: test grilă scris. <strong>Nu se dă probă practică<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Câte întrebări<\/strong><\/td>\n<td><strong>45<\/strong> = <strong>25 de pregătire de specialitate<\/strong> + <strong>20 de legislație<\/strong> (apărare și securitate națională)<\/td>\n<\/tr>\n<tr>\n<td><strong>Variante<\/strong><\/td>\n<td><strong>4 variante<\/strong>, <strong>un singur răspuns corect<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Timp<\/strong><\/td>\n<td><strong>90 de minute<\/strong> (2 minute pe întrebare, ai timp suficient)<\/td>\n<\/tr>\n<tr>\n<td><strong>Punctaj<\/strong><\/td>\n<td><strong>0,20 puncte<\/strong> pe răspuns corect + <strong>1 punct din oficiu<\/strong>. Nota se calculează cu două zecimale, <strong>fără rotunjire<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Nota minimă<\/strong><\/td>\n<td><strong>5,00<\/strong> = <strong>20 de răspunsuri corecte<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Media de admitere<\/strong><\/td>\n<td>= nota de la test (100%)<\/td>\n<\/tr>\n<tr>\n<td><strong>Locuri<\/strong><\/td>\n<td><strong>100 pe serie<\/strong> la Comunicații (017) + 25 la Tehnologia informației (108)<\/td>\n<\/tr>\n<tr>\n<td><strong>Departajare la medii egale<\/strong><\/td>\n<td>1) mai multe corecte la <strong>specialitate<\/strong>; 2) mai multe corecte la <strong>ultimii 10 itemi de legislație<\/strong>; 3) <strong>media de la bacalaureat<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Seria a II-a<\/strong><\/td>\n<td><strong>3 decembrie 2026<\/strong>: prezentare până la <strong>9:30<\/strong>, instructaj 9:30–10:30, intrare în sală până la <strong>10:30<\/strong>, proba <strong>11:00–12:30<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Rezultate<\/strong><\/td>\n<td>afișate în aceeași zi. Contestații: <strong>1 oră<\/strong> de la afișare. Soluționare: <strong>2 ore<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>Formula notei:<\/strong> nota = 1 + 0,20 × (răspunsuri corecte). Cu 20 corecte: 1 + 4 = <strong>5,00<\/strong>. Cu 36 corecte: 1 + 7,2 = <strong>8,20<\/strong>. Cu 45: <strong>10,00<\/strong>.<\/p><\/aside>\n<h3>Ce trebuie să ai la tine<\/h3>\n<ul>\n<li><strong>cartea de identitate<\/strong>;<\/li>\n<li><strong>diploma de bacalaureat<\/strong> sau copie legalizată, dacă nu e în dosarul trimis de biroul de recrutare;<\/li>\n<li><strong>pix cu pastă albastră<\/strong> (ia <strong>2–3<\/strong>).<\/li>\n<\/ul>\n<h3>Reguli din sală care te pot elimina ⚠️<\/h3>\n<ul>\n<li><strong>telefon, ceas inteligent, notițe, calculator<\/strong> în sală → <strong>eliminare<\/strong>;<\/li>\n<li>trebuie să fii în sală <strong>la deschiderea plicului<\/strong>, altfel <strong>pierzi dreptul<\/strong> de a participa;<\/li>\n<li>poți ieși <strong>după cel puțin 30 de minute<\/strong> și numai după predarea lucrării;<\/li>\n<li>ai voie cu <strong>o sticlă de apă<\/strong>.<\/li>\n<\/ul>\n<h3>Cum completezi formularul (ca să nu pierzi puncte aiurea)<\/h3>\n<ul>\n<li><strong>colorezi complet<\/strong> cercul variantei corecte, <strong>cu pastă albastră<\/strong>;<\/li>\n<li>dacă ai greșit: pui <strong>X<\/strong> peste varianta greșită și colorezi alta. ⚠️ <strong>O singură corectare pe întrebare<\/strong>;<\/li>\n<li><strong>contează doar formularul<\/strong>: ce scrii pe test sau pe ciornă <strong>nu se punctează<\/strong>;<\/li>\n<li>poți cere un formular nou (transcriere) dacă îl strici, în limita timpului.<\/li>\n<\/ul>\n<hr />\n<h2>2. Strategia de punctaj<\/h2>\n<ul>\n<li><strong>Nu există depunctare<\/strong> pentru răspuns greșit → <strong>NU lăsa nicio întrebare necompletată<\/strong>. La o ghicire ai 25% șanse.<\/li>\n<li><strong>Ținta realistă:<\/strong> <strong>≥ 36 de corecte (nota ≥ 8,20)<\/strong>. Ai 100 de locuri pe serie, dar concurența contează. Cu cât mai sus, cu atât mai sigur.<\/li>\n<li><strong>Specialitatea<\/strong> contează de <strong>două ori<\/strong>: are mai multe întrebări (25) și este <strong>primul criteriu de departajare<\/strong>.<\/li>\n<li><strong>Ordinea de lucru în sală:<\/strong>\n  1. <strong>Prima trecere (≈ 45 min):<\/strong> răspunde la tot ce știi sigur. La ce nu știi, pune un semn pe test și treci mai departe.\n  2. <strong>A doua trecere (≈ 25 min):<\/strong> întrebările marcate. Elimină variantele <strong>evident greșite<\/strong> și alege între cele rămase.\n  3. <strong>Ultimele 15–20 min:<\/strong> <strong>transcrie atent<\/strong> pe formular (dacă ai lucrat întâi pe test) și <strong>verifică<\/strong> să nu fi sărit vreun rând.<\/li>\n<\/ul>\n<h3>Trucuri pentru grilă<\/h3>\n<ul>\n<li>La legislație, variantele cu <strong>„întotdeauna”, „niciodată”, „oricând”, „fără nicio condiție”<\/strong> sunt <strong>de obicei greșite<\/strong>.<\/li>\n<li>La <strong>cifre<\/strong> (ore, zile, ani), cele 4 variante sunt de obicei cifre <strong>din aceeași lege<\/strong>. Învață-le <strong>în perechi<\/strong> (de exemplu <strong>24 h<\/strong> agresiune / <strong>48 h<\/strong> stare de asediu).<\/li>\n<li>Când două variante sunt <strong>aproape identice<\/strong>, una dintre ele e, de regulă, cea corectă.<\/li>\n<li>La „<strong>NU<\/strong> este…” citește întrebarea <strong>de două ori<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2>3. Planul de învățare – 5 săptămâni (29 octombrie – 2 decembrie)<\/h2>\n<p><strong>Ritm:<\/strong> <strong>6 zile pe săptămână<\/strong>, câte <strong>1,5–2 ore<\/strong>. O zi liberă pe săptămână.<\/p>\n<p><strong>Sesiunea zilnică:<\/strong><\/p>\n<ol>\n<li><strong>40 min<\/strong> citești capitolul (fișele);<\/li>\n<li><strong>30 min<\/strong> faci grilele din capitol;<\/li>\n<li><strong>10 min<\/strong> refaci ce ai greșit („Refă greșelile”);<\/li>\n<li><strong>10 min<\/strong> flashcard-uri din capitolul de ieri.<\/li>\n<\/ol>\n<p>Capitolele sunt ordonate <strong>după importanță<\/strong>: întâi cele cu <strong>3 stele<\/strong>, apoi cele cu 2, la urmă cele cu 1.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Săptămâna<\/th>\n<th>Capitole<\/th>\n<th>Obiectiv<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1<\/strong> (29 oct – 4 nov)<\/td>\n<td><strong>1<\/strong> Radiotelefonie · <strong>2<\/strong> Constituția · <strong>3<\/strong> Unde radio · <strong>4<\/strong> Uzul de armă · <strong>5<\/strong> Propagarea<\/td>\n<td>baza radio + cel mai mare capitol de legislație<\/td>\n<\/tr>\n<tr>\n<td><strong>2<\/strong> (5 – 11 nov)<\/td>\n<td><strong>6<\/strong> Salt de frecvență · <strong>7<\/strong> Informații clasificate · <strong>8<\/strong> Voce digitală (PCM) · <strong>9<\/strong> Statutul cadrelor · <strong>10<\/strong> Multiplexare · <strong>11<\/strong> Comutație<\/td>\n<td>tot ce e cu 3 stele, plus primele două cu 2 stele<\/td>\n<\/tr>\n<tr>\n<td><strong>3<\/strong> (12 – 18 nov)<\/td>\n<td><strong>12<\/strong> Medii de transmisie · <strong>13<\/strong> Apărarea națională · <strong>14<\/strong> MApN · <strong>15<\/strong> Sistemul C&amp;I · <strong>16<\/strong> Cariera<\/td>\n<td>restul capitolelor cu 2 stele<\/td>\n<\/tr>\n<tr>\n<td><strong>4<\/strong> (19 – 25 nov)<\/td>\n<td><strong>17<\/strong> Misiuni externe · <strong>18<\/strong> Disciplina · <strong>19<\/strong> Ordine interioară · <strong>20<\/strong> Serviciul interior, apoi <strong>recapitulare<\/strong>: flashcard-uri și „Refă greșelile” pe capitolele 1–9<\/td>\n<td>tot materialul parcurs o dată. La 18, 19, 20 ai <strong>regulamentele în față<\/strong> (tabelele „de completat”)<\/td>\n<\/tr>\n<tr>\n<td><strong>5<\/strong> (26 nov – 2 dec)<\/td>\n<td><strong>Simulări de examen<\/strong> (45 de itemi, 90 de minute), câte una la 1–2 zile, plus <strong>Recapitularea finală<\/strong> zilnic<\/td>\n<td>ținta: <strong>≥ 36/45<\/strong> constant<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Ultimele 2 zile (1–2 decembrie):<\/strong> doar <strong>recapitularea finală<\/strong> și <strong>greșelile<\/strong>. <strong>Fără materie nouă.<\/strong> Somn bun în noaptea dinainte.<\/p>\n<hr />\n<h2>4. Cum îl ajuți (pentru cel care îl pregătește)<\/h2>\n<ul>\n<li><strong>Explică-i logic temele de comunicații<\/strong>, nu le lăsa tocite:<\/li>\n<li><strong>Voce digitală (cap. 8)<\/strong> și <strong>Multiplexare (cap. 10)<\/strong> sunt <strong>calcule<\/strong>. Odată înțelese, nu mai trebuie memorate. Pune-l să <strong>reconstruiască<\/strong> singur 64 kbit/s și 2,048 Mbit/s.<\/li>\n<li><strong>Propagarea (cap. 5)<\/strong>: desenează pe o foaie Pământul, ionosfera și cele 3 tipuri de undă. <strong>Desenul rămâne în minte.<\/strong><\/li>\n<li><strong>Radiotelefonia (cap. 1)<\/strong>: <strong>jucați rolul<\/strong> a două stații radio, cu OVER / OUT / ROGER / WILCO, alfabetul fonetic și cifrele.<\/li>\n<li><strong>La legislație: întrebări-fulger.<\/strong> Citește-i o întrebare din grile, iar el răspunde <strong>fără variante<\/strong>. Dacă o știe fără variante, o știe sigur și cu variante.<\/li>\n<li><strong>Verifică săptămânal<\/strong> cu o simulare: nota lui trebuie să <strong>crească<\/strong>. Dacă stagnează la un capitol, reluați-l.<\/li>\n<li><strong>Rugămintea cea mai importantă:<\/strong> procurați <strong>RG-1, RG-3, Regulamentul serviciului interior<\/strong> și <strong>manualele F.T./C.I.<\/strong> de la unitate și completați <strong>tabelele „de completat”<\/strong> din capitolele <strong>15, 18, 19, 20<\/strong>. Aceste texte nu sunt publice integral, deci acolo materialul de aici e mai general.<\/li>\n<\/ul>", "recap": "<blockquote><p>De citit <strong>zilnic în ultima săptămână<\/strong> și <strong>în dimineața examenului<\/strong>. Detaliile sunt în capitole.<\/p><\/blockquote>\n<h2>LEGISLAȚIE<\/h2>\n<h3>Ore, zile, ani<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Valoare<\/th>\n<th>Sursa<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Reținerea<\/td>\n<td>max <strong>24 h<\/strong><\/td>\n<td>Constituție art. 23<\/td>\n<\/tr>\n<tr>\n<td>Arestarea preventivă (urmărire penală)<\/td>\n<td><strong>30 zile<\/strong>, prelungiri de câte <strong>30<\/strong>, total max <strong>180 zile<\/strong><\/td>\n<td>art. 23<\/td>\n<\/tr>\n<tr>\n<td>Verificarea arestării la judecată<\/td>\n<td>max <strong>60 zile<\/strong><\/td>\n<td>art. 23<\/td>\n<\/tr>\n<tr>\n<td>Agresiune armată → Parlament convocat<\/td>\n<td><strong>24 h<\/strong><\/td>\n<td>art. 92<\/td>\n<\/tr>\n<tr>\n<td>Mobilizare declarată excepțional → aprobare Parlament<\/td>\n<td>max <strong>5 zile<\/strong><\/td>\n<td>art. 92<\/td>\n<\/tr>\n<tr>\n<td>Stare de asediu/urgență → încuviințare<\/td>\n<td><strong>5 zile<\/strong>; Parlament convocat în <strong>48 h<\/strong><\/td>\n<td>art. 93<\/td>\n<\/tr>\n<tr>\n<td>Vârste: vot / deputat / senator / Președinte<\/td>\n<td><strong>18 / 23 / 33 / 35<\/strong><\/td>\n<td>art. 36–37<\/td>\n<\/tr>\n<tr>\n<td>Încorporare<\/td>\n<td><strong>20–35 ani<\/strong> (exceptând voluntarii)<\/td>\n<td>art. 55<\/td>\n<\/tr>\n<tr>\n<td>Interzis ca salariat<\/td>\n<td>sub <strong>15 ani<\/strong><\/td>\n<td>art. 49<\/td>\n<\/tr>\n<tr>\n<td>Ziua de muncă<\/td>\n<td>în medie max <strong>8 h<\/strong><\/td>\n<td>art. 41<\/td>\n<\/tr>\n<tr>\n<td>Concediu fără plată (urmarea soțului în străinătate / org. internaționale)<\/td>\n<td>până la <strong>4 ani<\/strong><\/td>\n<td>L 80, art. 14¹<\/td>\n<\/tr>\n<tr>\n<td>Concediu fără plată (alte motive)<\/td>\n<td>până la <strong>1 an<\/strong><\/td>\n<td>L 80, art. 14¹<\/td>\n<\/tr>\n<tr>\n<td>Concediu de formare profesională<\/td>\n<td>până la <strong>15 zile lucrătoare/an<\/strong><\/td>\n<td>L 80, art. 14³<\/td>\n<\/tr>\n<tr>\n<td>Compensația pentru chirie<\/td>\n<td>până la <strong>50%<\/strong> din soldă<\/td>\n<td>L 80, art. 20¹<\/td>\n<\/tr>\n<tr>\n<td>Indemnizația soțului rămas fără loc de muncă la mutare<\/td>\n<td><strong>50%<\/strong>, max <strong>9 luni<\/strong><\/td>\n<td>L 80, art. 20¹<\/td>\n<\/tr>\n<tr>\n<td>Ajutorul la deces<\/td>\n<td><strong>2 solde<\/strong><\/td>\n<td>L 80, art. 23<\/td>\n<\/tr>\n<tr>\n<td>Dreptul de a purta uniforma în rezervă<\/td>\n<td><strong>20 de ani<\/strong> de serviciu + distincții<\/td>\n<td>L 80, art. 27<\/td>\n<\/tr>\n<tr>\n<td>Sancțiune cadre: termen de aplicare<\/td>\n<td><strong>6 luni<\/strong> de la constatare / <strong>2 ani<\/strong> de la faptă<\/td>\n<td>L 80, art. 35<\/td>\n<\/tr>\n<tr>\n<td>Amânarea înaintării în grad<\/td>\n<td><strong>1–2 ani<\/strong><\/td>\n<td>L 80 art. 35; L 384 art. 28<\/td>\n<\/tr>\n<tr>\n<td>Sancțiune SGP: decizia / executarea<\/td>\n<td><strong>30 / 30 zile<\/strong><\/td>\n<td>L 384, art. 29<\/td>\n<\/tr>\n<tr>\n<td>Sancțiune SGP: abatere cunoscută în<\/td>\n<td><strong>6 luni<\/strong> de la faptă<\/td>\n<td>L 384, art. 29<\/td>\n<\/tr>\n<tr>\n<td>Misiuni externe: concediu suplimentar<\/td>\n<td><strong>2,5 zile / lună<\/strong><\/td>\n<td>L 121, art. 16<\/td>\n<\/tr>\n<tr>\n<td>Misiuni externe: călătorie decontată acasă<\/td>\n<td>o dată la <strong>6 luni<\/strong><\/td>\n<td>L 121, art. 16<\/td>\n<\/tr>\n<tr>\n<td>Vizită la rudele spitalizate în străinătate<\/td>\n<td><strong>5 zile<\/strong>, după internare și <strong>lunar<\/strong><\/td>\n<td>L 121, art. 18<\/td>\n<\/tr>\n<tr>\n<td>Autorizația de acces la secrete de stat<\/td>\n<td>max <strong>4 ani<\/strong><\/td>\n<td>L 182, art. 28<\/td>\n<\/tr>\n<tr>\n<td>Termene de clasificare SSID / SS / S<\/td>\n<td><strong>100 / 50 / 30 ani<\/strong><\/td>\n<td>HG 585, art. 12<\/td>\n<\/tr>\n<tr>\n<td>Combinațiile de la seifuri<\/td>\n<td>periodic, de regulă la <strong>6 luni<\/strong>, max <strong>12 luni<\/strong><\/td>\n<td>HG 585<\/td>\n<\/tr>\n<tr>\n<td>Mareșal<\/td>\n<td><strong>doar în război<\/strong>, de <strong>Președinte<\/strong>, generalilor cu <strong>4 stele<\/strong><\/td>\n<td>L 80, art. 2<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Cine decide ce<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Cine<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Comandantul forțelor armate / președintele CSAT<\/td>\n<td><strong>Președintele României<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Mobilizarea<\/td>\n<td><strong>Președintele<\/strong>, cu <strong>aprobarea prealabilă a Parlamentului<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Starea de asediu / urgență<\/td>\n<td><strong>Președintele<\/strong> (încuviințare Parlament în 5 zile)<\/td>\n<\/tr>\n<tr>\n<td>Coordonarea unitară a apărării și securității<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Militarizarea agenților economici<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nomenclatorul rezervelor; planul exercițiilor de mobilizare<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nomenclatorul funcțiilor de general<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Coordonarea națională a protecției informațiilor clasificate<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Standardele de protecție a informațiilor<\/td>\n<td><strong>SRI<\/strong> cu acordul <strong>ANS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Coordonarea și controlul protecției secretelor de stat<\/td>\n<td><strong>SRI<\/strong> (unitate specializată)<\/td>\n<\/tr>\n<tr>\n<td>Informațiile clasificate NATO<\/td>\n<td><strong>ANS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Evidența listelor de secrete de stat<\/td>\n<td><strong>ORNISS<\/strong> (subordonat <strong>Guvernului<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td>Aprobarea listelor de secrete de stat / declasificarea<\/td>\n<td><strong>Guvernul<\/strong> (hotărâre)<\/td>\n<\/tr>\n<tr>\n<td>Secretele de serviciu<\/td>\n<td><strong>conducătorul persoanei juridice<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Autorizația de acces<\/td>\n<td><strong>conducătorul unității<\/strong> + notificare <strong>ORNISS<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ghidul carierei militare<\/td>\n<td><strong>Guvernul<\/strong> (HG 106/2011)<\/td>\n<\/tr>\n<tr>\n<td>Normele sistemului de selecție / selecția pentru misiuni<\/td>\n<td><strong>ministrul apărării<\/strong> (ordin)<\/td>\n<\/tr>\n<tr>\n<td>Conducerea forțelor pentru operații speciale<\/td>\n<td><strong>șeful Statului Major al Apărării<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Analiza regulilor de angajare (misiuni externe)<\/td>\n<td><strong>autoritatea națională militară (SMAp)<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Uz de armă cu morți/răniți → anunță procurorul<\/td>\n<td><strong>comandantul unității<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Scoaterea din evidență: generali / ceilalți<\/td>\n<td><strong>ordin al șefului SMG (SMAp)<\/strong> / comandanții desemnați<\/td>\n<\/tr>\n<tr>\n<td>Redarea gradului: generali / ceilalți<\/td>\n<td><strong>decret prezidențial<\/strong> / <strong>ordin al șefului SMG<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Limitele zonei militare restricționate<\/td>\n<td>propuse de <strong>comandantul obiectivului<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Liste scurte<\/h3>\n<ul>\n<li><strong>Statul român:<\/strong> național, suveran, independent, unitar, indivizibil – <strong>republică<\/strong>.<\/li>\n<li><strong>Drapelul (de la lance):<\/strong> <strong>albastru – galben – roșu<\/strong>. <strong>Ziua națională:<\/strong> <strong>1 Decembrie<\/strong>. <strong>Imnul:<\/strong> „<strong>Deșteaptă-te, române!<\/strong>”.<\/li>\n<li><strong>Sistemul național de apărare:<\/strong> <strong>conducere – forțe – resurse – infrastructură teritorială<\/strong>.<\/li>\n<li><strong>Categoriile de forțe:<\/strong> <strong>terestre, aeriene, navale<\/strong>. <strong>Organe teritoriale:<\/strong> <strong>centre militare zonale, județene, de sector<\/strong>.<\/li>\n<li><strong>Structura de forțe (L 346):<\/strong> terestre/aeriene/navale; <strong>sprijin de luptă<\/strong>; <strong>sprijin logistic<\/strong> (Cdm. Logistic Întrunit); <strong>operații speciale<\/strong> (Cdm. FOS); <strong>apărare cibernetică<\/strong> (Cdm. Apărării Cibernetice); alte forțe.<\/li>\n<li><strong>MApN autoritate națională:<\/strong> <strong>navală militară, scafandri, informații geospațiale, criptologie<\/strong>.<\/li>\n<li><strong>Corpurile cadrelor militare:<\/strong> <strong>ofițeri, maiștri militari, subofițeri<\/strong>. <strong>Situații:<\/strong> <strong>activitate, rezervă, retragere<\/strong>.<\/li>\n<li><strong>Subofițeri:<\/strong> sergent → sergent-major → plutonier → plutonier-major → plutonier adjutant → <strong>plutonier adjutant principal<\/strong>.<\/li>\n<li><strong>Interzis cadrelor (L 80 art. 28):<\/strong> <strong>partid, candidatură, grevă<\/strong>.<\/li>\n<li><strong>Sancțiuni cadre (L 80):<\/strong> avertisment, mustrare scrisă, diminuarea soldei de funcție, diminuarea soldei de comandă, amânarea înaintării (1–2 ani), retrogradarea în funcție, <strong>trecerea în rezervă<\/strong>.<\/li>\n<li><strong>Sancțiuni SGP (L 384):<\/strong> avertisment, mustrare scrisă, retrogradare în funcție, amânarea înaintării (1–2 ani), <strong>încetarea contractului<\/strong>. <strong>Cercetare prealabilă obligatorie<\/strong>, cu excepția avertismentului.<\/li>\n<li><strong>Misiuni externe (L 121):<\/strong> <strong>apărare colectivă, răspuns la crize, pace, asistență umanitară<\/strong>.<\/li>\n<li><strong>Uz de armă – principii:<\/strong> legalitate, proporționalitate, gradualitate, utilizare limitată, nesurprindere. Arma = <strong>ultima soluție<\/strong>.<\/li>\n<li><strong>Somația:<\/strong> <strong>„Stai!” → „Stai, că trag!” → foc de avertisment vertical<\/strong>. <strong>Obligatorie<\/strong> la: <strong>intrare/ieșire ilegală, evadare, împiedicarea misiunii de luptă (de 3 ori „Părăsiți…”)<\/strong>. <strong>Interzis<\/strong> contra <strong>copiilor și femeilor vizibil însărcinate<\/strong> (excepție: atac armat).<\/li>\n<li><strong>Clasificare:<\/strong> <strong>secrete de stat<\/strong> (SSID / SS / S) și <strong>secrete de serviciu<\/strong>. NATO: <strong>SSID = TOP SECRET<\/strong>, <strong>SS = SECRET<\/strong>, <strong>S = CONFIDENTIAL<\/strong>, <strong>serviciu = RESTRICTED<\/strong>.<\/li>\n<li><strong>Prefixul numărului de înregistrare:<\/strong> <strong>0<\/strong> = secret, <strong>00<\/strong> = strict secret, <strong>000<\/strong> = SSID, <strong>S<\/strong> = secret de serviciu.<\/li>\n<li><strong>Formele de protecție:<\/strong> juridică, procedurală, fizică, a personalului, a surselor.<\/li>\n<li><strong>Serviciul interior (5):<\/strong> <strong>permanență, operativ, continuitate a conducerii, tehnic de monitorizare și avertizare, pază și intervenție<\/strong>.<\/li>\n<li><strong>Carieră:<\/strong> sergent → sergent-major <strong>fără comisie<\/strong>. Corpul ofițerilor: <strong>licență + „foarte bun” 3 ani + concurs + curs<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2>SPECIALITATE<\/h2>\n<h3>Cifre și formule<\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Valoare<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>λ<\/strong><\/td>\n<td><strong>300 / f[MHz]<\/strong> metri<\/td>\n<\/tr>\n<tr>\n<td>Antena bici / dipol<\/td>\n<td><strong>λ/4<\/strong> / <strong>λ/2<\/strong> (≈ 73 Ω)<\/td>\n<\/tr>\n<tr>\n<td>Orizontul radio<\/td>\n<td><strong>4,12 (√h₁ + √h₂)<\/strong> km<\/td>\n<\/tr>\n<tr>\n<td>HF / VHF / UHF<\/td>\n<td><strong>3–30 MHz<\/strong> / <strong>30–300 MHz<\/strong> / <strong>0,3–3 GHz<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Banda VHF tactică<\/td>\n<td><strong>30–88 MHz<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Canal telefonic<\/td>\n<td><strong>300–3400 Hz<\/strong>, <strong>4 kHz<\/strong> în FDM<\/td>\n<\/tr>\n<tr>\n<td>Eșantionare<\/td>\n<td><strong>fₑ ≥ 2 f_max<\/strong>; voce <strong>8 kHz<\/strong> → la <strong>125 µs<\/strong><\/td>\n<\/tr>\n<tr>\n<td>PCM voce<\/td>\n<td><strong>8000 × 8 = 64 kbit/s<\/strong>; niveluri <strong>2ⁿ<\/strong> (8 biți → 256)<\/td>\n<\/tr>\n<tr>\n<td>+1 bit<\/td>\n<td><strong>+6 dB<\/strong> SNR de cuantizare<\/td>\n<\/tr>\n<tr>\n<td>ADPCM / modulație delta<\/td>\n<td><strong>32 kbit/s<\/strong> / <strong>1 bit pe eșantion<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Nyquist<\/td>\n<td><strong>2B log₂V<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Shannon<\/td>\n<td><strong>B log₂(1+S/N)<\/strong>; 30 dB = 1000<\/td>\n<\/tr>\n<tr>\n<td>dB<\/td>\n<td>3 dB = ×2; 10 dB = ×10; <strong>dBm<\/strong>: 0 dBm = 1 mW, 30 dBm = 1 W<\/td>\n<\/tr>\n<tr>\n<td>Spațiu liber<\/td>\n<td>dublarea distanței = <strong>−6 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>T1<\/td>\n<td><strong>24<\/strong> canale, <strong>193<\/strong> biți/cadru, <strong>1,544 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td>E1<\/td>\n<td><strong>32<\/strong> sloturi (<strong>30<\/strong> voce), <strong>2,048 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td>PDH E1/E2/E3/E4<\/td>\n<td>2,048 / 8,448 / 34,368 / 139,264 Mbit/s<\/td>\n<\/tr>\n<tr>\n<td>SDH STM-1 / STM-4 / STM-16<\/td>\n<td><strong>155,52<\/strong> / <strong>622,08<\/strong> / <strong>2488,32<\/strong> Mbit/s<\/td>\n<\/tr>\n<tr>\n<td>Grup / supergrup FDM<\/td>\n<td><strong>12<\/strong> / <strong>60<\/strong> canale<\/td>\n<\/tr>\n<tr>\n<td>Celula ATM<\/td>\n<td><strong>53 octeți = 5 antet + 48 date<\/strong>; VPI/VCI<\/td>\n<\/tr>\n<tr>\n<td>Crossbar n×n<\/td>\n<td><strong>n²<\/strong> puncte<\/td>\n<\/tr>\n<tr>\n<td>Coaxial<\/td>\n<td><strong>50 Ω<\/strong> bandă de bază (digital) / <strong>75 Ω<\/strong> bandă largă (TV)<\/td>\n<\/tr>\n<tr>\n<td>Ferestre optice<\/td>\n<td><strong>0,85 / 1,30 / 1,55 µm<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Fibră monomod<\/td>\n<td>miez <strong>~8–10 µm<\/strong>, distanțe mari, laser<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3>Concepte-cheie<\/h3>\n<ul>\n<li><strong>Cerințele comunicațiilor:<\/strong> operativitate, fiabilitate, continuitate, securitate (+ mobilitate, interoperabilitate).<\/li>\n<li><strong>Responsabilitatea legăturii:<\/strong> <strong>de sus în jos<\/strong>, <strong>de la sprijin la sprijinit<\/strong>, <strong>de la stânga la dreapta<\/strong>.<\/li>\n<li><strong>FH:<\/strong> pseudo-aleator și sincron; <strong>anti-bruiaj, LPI, LPD, anti-fading, multe rețele în aceeași bandă<\/strong>. Necesită <strong>set de frecvențe + cheie TRANSEC + sincronizare + ID de rețea<\/strong>. FH = <strong>ECCM<\/strong>.<\/li>\n<li><strong>VHF:<\/strong> <strong>undă directă<\/strong>, linie de vedere, <strong>înălțimea antenei<\/strong> e decisivă, <strong>zone de umbră<\/strong> după dealuri.<\/li>\n<li><strong>HF:<\/strong> <strong>ionosferă<\/strong> (strat <strong>F2<\/strong>), <strong>MUF<\/strong>, <strong>noaptea frecvențe mai mici<\/strong>, <strong>zonă de tăcere<\/strong>, <strong>NVIS<\/strong> (2–10 MHz, antenă orizontală joasă, 0–300 km). Stratul <strong>D<\/strong> absoarbe ziua.<\/li>\n<li><strong>Rețea<\/strong> = 3+ stații; <strong>direcție<\/strong> = 2 stații; <strong>NCS<\/strong> = stația de control. <strong>Dirijată<\/strong> = cu aprobarea NCS; <strong>liberă<\/strong> = direct.<\/li>\n<li><strong>Prowords:<\/strong> OVER = aștept răspuns; OUT = terminat; <strong>niciodată împreună<\/strong>. ROGER = am primit; WILCO = am înțeles și execut; <strong>SAY AGAIN<\/strong> (nu „repeat”); I SPELL; CORRECTION; WAIT / WAIT OUT; READ BACK; LOUD AND CLEAR.<\/li>\n<li><strong>Cifre NATO:<\/strong> ZE-RO, WUN, TOO, TREE, FOW-ER, FIFE, SIX, SEV-EN, AIT, <strong>NIN-ER<\/strong>.<\/li>\n<li><strong>Comutație:<\/strong> <strong>circuite<\/strong> (cale rezervată, voce) / <strong>mesaje<\/strong> (store-and-forward integral) / <strong>pachete<\/strong> – <strong>datagramă<\/strong> (independent, altă ordine, IP) vs <strong>circuit virtual<\/strong> (aceeași cale, în ordine, ATM/X.25/FR).<\/li>\n<li><strong>STM<\/strong> = sloturi fixe (poziția identifică canalul); <strong>ATM<\/strong> = celule la cerere (eticheta identifică canalul).<\/li>\n<li><strong>FDM<\/strong> = frecvență (benzi de gardă); <strong>TDM<\/strong> = timp; <strong>WDM<\/strong> = FDM pe fibră. <strong>TSI<\/strong> = comutație temporală.<\/li>\n<li><strong>Torsadare<\/strong> → mai puține interferențe și diafonie. <strong>Fibră<\/strong> = reflexie totală internă; sursă LED/laser → fibră → fotodiodă.<\/li>\n<li><strong>A/N:<\/strong> <strong>eșantionare → cuantizare → codare<\/strong>; <strong>aliasing<\/strong> dacă fₑ &lt; 2f_max; compandare <strong>legea A<\/strong> (Europa).<\/li>\n<li><strong>COMSEC<\/strong> = criptare; <strong>TRANSEC<\/strong> = FH, putere mică, antene directive.<\/li>\n<li><strong>Sistemul C&amp;I:<\/strong> CNR (radio de luptă) + sistem de zonă (noduri de <strong>tranzit<\/strong> + noduri de <strong>acces<\/strong>, radioreleu, satelit) + sistemul <strong>local<\/strong> al PC.<\/li>\n<\/ul>"}};
const CH = D.ch, PG = D.pg;
const EXAM = new Date(2026, 11, 3, 11, 0, 0);
let st = {read:{}, q:{}, fc:{}, last:null};
try { st = Object.assign(st, JSON.parse(localStorage.getItem("manual-sof") || "{}")); } catch(e) {}
function save(){ try { localStorage.setItem("manual-sof", JSON.stringify(st)); } catch(e) {} }
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const stars = n => "★".repeat(n) + "☆".repeat(3-n);
const PART = {S:"Specialitate", L:"Legislație"};
const PRIO = {1:"Foarte probabil", 2:"Probabil", 3:"Mai rar"};
const pad = n => String(n).padStart(2,"0");
function daysLeft(){ const d = Math.ceil((EXAM - new Date())/86400000); return Math.max(0,d); }
function qStats(c){ let ok=0, seen=0; c.q.forEach(q=>{ const s=st.q[q.id]; if(s!==undefined){ seen++; if(s===1) ok++; } }); return {ok, seen, n:c.q.length}; }

function tocHTML(cur){
  let h = `<div class="toc"><div class="toc-h">Început</div>
    <a href="#" class="${cur==='home'?'on':''}"><span class="n">·</span><span>Coperta</span><span></span></a>
    <a href="#examen" class="${cur==='examen'?'on':''}"><span class="n">·</span><span>Cum arată examenul</span><span></span></a>
    <div class="toc-h">Capitole, în ordinea importanței</div>`;
