ne gestionează spectrul radio al apărării?", "<b>MApN<\/b>."], ["Ce face MApN cu comunicațiile?", "Gestionează <b>resursele de comunicații și IT<\/b>, <b>spectrul radio<\/b>, <b>sistemele criptografice<\/b>."], ["Mobilizarea armatei o organizează și conduce…?", "<b>MApN<\/b> (cu rechiziția și prestările de servicii)."], ["MApN și apărarea cibernetică?", "<b>Participă la dezvoltarea capabilităților<\/b> de apărare cibernetică."], ["Cine gestionează pensiile militare de stat?", "<b>MApN<\/b>."], ["Cele 4 domenii în care MApN e autoritate națională?", "<b>Navală militară, scafandri, informații geospațiale, criptologie<\/b> (N-S-G-C)."], ["Zonele de siguranță ale navelor și regimul porturilor militare?", "<b>Autoritate navală militară națională<\/b>."], ["Brevetarea și verificarea scafandrilor?", "<b>Autoritate națională în pregătirea scafandrilor<\/b>."], ["Câte categorii are structura de forțe?", "<b>6<\/b>."], ["Cele 6 categorii de forțe?", "<b>Terestre-aeriene-navale; sprijin de luptă; sprijin logistic; operații speciale; apărare cibernetică; alte forțe<\/b>."], ["Dimensiunea structurii de forțe se stabilește prin…?", "<b>Documentele de planificare a apărării<\/b>."], ["Forțele de sprijin logistic?", "<b>Comandamentul Logistic Întrunit<\/b>."], ["Forțele de apărare cibernetică includ…?", "<b>Comandamentul Apărării Cibernetice<\/b>."], ["Cine stabilește misiunile structurii de forțe?", "<b>Ministrul apărării<\/b> sau <b>șeful SMAp<\/b>, dacă e împuternicit."], ["Câte niveluri de capacitate de luptă?", "<b>4<\/b>."], ["Nivelul redus devine gata de acțiune…?", "<b>După completare sau mobilizare<\/b>."], ["La ce servesc structurile constituite la mobilizare?", "<b>Generarea și regenerarea forțelor<\/b> și <b>rezistența armată<\/b>."], ["Poliția militară asigură…?", "<b>Ordinea și disciplina<\/b> în obiective militare, <b>circulația<\/b> coloanelor, <b>paza și escortarea prizonierilor<\/b>, evacuarea persoanelor strămutate."], ["Organizarea poliției militare se stabilește prin…?", "<b>Lege specială<\/b>."], ["Forțele pentru operații speciale sunt…?", "Componenta <b>specializată, de reacție rapidă, strategică<\/b>."], ["Cele 5 misiuni ale forțelor speciale?", "<b>Cercetare specială, acțiuni directe, asistență militară, acțiuni neconvenționale, misiuni complementare<\/b>."], ["Cine conduce forțele pentru operații speciale?", "<b>Șeful SMAp<\/b>, prin <b>Comandamentul FOS<\/b>."], ["Forțele puse la dispoziția NATO?", "Se integrează în structura NATO; autoritatea după <b>procedurile NATO<\/b>."], ["Personalul MApN?", "<b>Militar și civil<\/b>."], ["Cine aprobă nomenclatorul funcțiilor de general?", "<b>CSAT<\/b>."], ["Transformarea unei funcții de general în funcție civilă?", "O aprobă <b>CSAT<\/b>."], ["Evidența efectivelor DGIA?", "Se ține <b>separat<\/b>."], ["Cine NU intră în necesarul de efective?", "<b>Elevii și studenții<\/b> instituțiilor militare, militarii în termen, soldații în instrucția de bază etc."]], "q": [{"id": "L03-001", "p": 1, "q": "Potrivit Legii 346/2006, managementul spectrului de frecvențe radio alocat pentru apărare este o atribuție a:", "o": ["Ministerului Apărării Naționale", "Autorității Naționale pentru Comunicații, exclusiv", "Ministerului Afacerilor Interne", "Serviciului de Telecomunicații Speciale"], "a": 0, "e": "Art. 5 – managementul spectrului radio pentru apărare și al resurselor de comunicații, IT și apărare cibernetică."}, {"id": "L03-006", "p": 1, "q": "Potrivit art. 6, prin structurile desemnate, MApN NU este autoritate națională în domeniul:", "o": ["pregătirii, brevetării și perfecționării scafandrilor", "aviației civile", "naval militar", "activității oficiale de criptologie, pentru componentele specifice"], "a": 1, "e": "Art. 6: autoritate navală militară, scafandri, informații geospațiale pentru apărare, criptologie."}, {"id": "L03-010", "p": 1, "q": "Structura de forțe a armatei se grupează în:", "o": ["forțe terestre, aeriene și navale; forțe pentru sprijin de luptă; forțe pentru sprijin logistic; forțe pentru operații speciale; forțe pentru apărare cibernetică; alte forțe", "forțe NATO și forțe naționale", "forțe de pace și forțe de război", "forțe active și forțe de rezervă"], "a": 0, "e": "Art. 28 alin. (1)."}, {"id": "L03-012", "p": 1, "q": "Forțele pentru sprijin logistic sunt reprezentate de:", "o": ["Comandamentul Apărării Cibernetice", "Comandamentul Logistic Întrunit", "Comandamentul Forțelor pentru Operații Speciale", "Statul Major al Forțelor Terestre"], "a": 1, "e": "Art. 31 alin. (1)."}, {"id": "L03-013", "p": 1, "q": "Forțele pentru apărare cibernetică includ:", "o": ["Comandamentul Logistic Întrunit", "Comandamentul Apărării Cibernetice, mari unități, unități și alte structuri", "Statul Major al Forțelor Aeriene", "numai Serviciul de Telecomunicații Speciale"], "a": 1, "e": "Art. 33."}, {"id": "L03-016", "p": 1, "q": "În funcție de nivelul capacității de luptă, forțele armatei se organizează în:", "o": ["6 categorii", "4 categorii", "3 categorii", "2 categorii"], "a": 1, "e": "Art. 35: gata de acțiune permanent; nivel ridicat; nivel redus; structuri constituite la mobilizare."}, {"id": "L03-023", "p": 1, "q": "Conducerea forțelor pentru operații speciale se exercită de:", "o": ["președintele CSAT, direct", "șeful Statului Major al Apărării, prin Comandamentul Forțelor pentru Operații Speciale", "comandantul Comandamentului Logistic Întrunit", "ministrul afacerilor interne"], "a": 1, "e": "Art. 37 alin. (2)."}, {"id": "L03-026", "p": 1, "q": "Nomenclatorul funcțiilor de general din armată se aprobă de:", "o": ["șeful Statului Major al Apărării", "ministrul apărării naționale", "Consiliul Suprem de Apărare a Țării", "Parlament"], "a": 2, "e": "Art. 43 alin. (2)."}, {"id": "L03-002", "p": 2, "q": "Care dintre următoarele este o atribuție a MApN prevăzută de art. 5?", "o": ["gestionarea sistemului public de pensii", "organizarea alegerilor locale", "emiterea pașapoartelor", "managementul activității oficiale de cifru și al sistemelor criptografice din armată"], "a": 3, "e": "Art. 5."}, {"id": "L03-003", "p": 2, "q": "Organizarea și conducerea mobilizării armatei, rechiziția de bunuri și chemarea persoanelor fizice la prestări de servicii în interes public sunt atribuții ale:", "o": ["Ministerului Apărării Naționale", "Ministerului Justiției", "consiliilor județene", "Parlamentului"], "a": 0, "e": "Art. 5."}, {"id": "L03-004", "p": 2, "q": "MApN participă la dezvoltarea capabilităților de apărare cibernetică:", "o": ["numai la cererea NATO", "în colaborare cu alte instituții stabilite prin lege", "numai în timp de război", "exclusiv, fără alte instituții"], "a": 1, "e": "Art. 5."}, {"id": "L03-007", "p": 2, "q": "MApN este autoritate națională în proiectarea, realizarea și asigurarea:", "o": ["informațiilor geospațiale pentru apărare", "rețelelor de telefonie mobilă civile", "cadastrului imobiliar civil", "prognozei meteo pentru agricultură"], "a": 0, "e": "Art. 6 lit. c)."}, {"id": "L03-015", "p": 2, "q": "Misiunile și responsabilitățile structurii de forțe se stabilesc prin ordin al:", "o": ["comandantului centrului militar județean", "prim-ministrului", "ministrului apărării naționale sau al șefului Statului Major al Apărării, când este împuternicit de ministru", "Președintelui României, exclusiv"], "a": 2, "e": "Art. 34."}, {"id": "L03-017", "p": 2, "q": "Forțele cu nivel redus al capacității de luptă devin gata de acțiune:", "o": ["numai după aprobarea NATO", "imediat, fără completare", "numai în timp de pace", "după ridicarea capacității de luptă prin completare sau mobilizare"], "a": 3, "e": "Art. 35 lit. c)."}, {"id": "L03-018", "p": 2, "q": "Structurile constituite la mobilizare sunt destinate:", "o": ["misiunilor permanente NATO", "exclusiv instruirii rezerviștilor în timp de pace", "generării și regenerării forțelor și realizării sistemului de rezistență armată pe teritoriul național", "protecției civile"], "a": 2, "e": "Art. 35 lit. d)."}, {"id": "L03-019", "p": 2, "q": "Care dintre următoarele NU este o atribuție a structurilor de poliție militară, potrivit art. 36?", "o": ["paza și escortarea prizonierilor de război", "controlul și îndrumarea circulației coloanelor militare", "ordinea interioară și disciplina militară în obiectivele militare", "conducerea operațiilor speciale în străinătate"], "a": 3, "e": "Art. 36."}, {"id": "L03-020", "p": 2, "q": "Atribuțiile, organizarea și funcționarea poliției militare se stabilesc prin:", "o": ["regulament al unității", "lege specială", "hotărâre a Guvernului", "ordin al ministrului"], "a": 1, "e": "Art. 36 alin. (2)."}, {"id": "L03-021", "p": 2, "q": "Forțele pentru operații speciale constituie:", "o": ["componenta de protecție civilă", "componenta specializată, de reacție rapidă, la nivel strategic", "o structură a Ministerului Afacerilor Interne", "componenta de rezervă a armatei"], "a": 1, "e": "Art. 37 alin. (1)."}, {"id": "L03-022", "p": 2, "q": "Care dintre următoarele NU este o misiune a forțelor pentru operații speciale, potrivit art. 37?", "o": ["paza obiectivelor civile de interes local", "cercetare specială", "asistență militară", "acțiuni directe"], "a": 0, "e": "Art. 37: cercetare specială, acțiuni directe, asistență militară, acțiuni neconvenționale, misiuni complementare."}, {"id": "L03-025", "p": 2, "q": "Personalul Ministerului Apărării Naționale este format din:", "o": ["personal militar și polițiști", "numai personal militar", "personal militar și personal civil", "personal militar și rezerviști voluntari, exclusiv"], "a": 2, "e": "Art. 43 alin. (1)."}, {"id": "L03-027", "p": 2, "q": "Transformarea unei funcții de general într-o funcție civilă se aprobă de:", "o": ["CSAT, la propunerea ministrului apărării naționale", "șeful Statului Major al Apărării", "comandantul categoriei de forțe", "Guvern, la propunerea Parlamentului"], "a": 0, "e": "Art. 43 alin. (3)."}, {"id": "L03-005", "p": 3, "q": "Gestionarea sistemului pensiilor militare de stat este, potrivit art. 5, o atribuție a:", "o": ["Ministerului Apărării Naționale", "Casei Naționale de Pensii Publice, exclusiv", "Ministerului Finanțelor", "centrelor militare județene, exclusiv"], "a": 0, "e": "Art. 5."}, {"id": "L03-008", "p": 3, "q": "Stabilirea limitelor zonelor de siguranță ale navelor militare și a regimului porturilor militare intră în atribuțiile MApN ca:", "o": ["autoritate navală militară națională", "autoritate de scafandri", "autoritate de criptologie", "autoritate geospațială"], "a": 0, "e": "Art. 6 alin. (2)."}, {"id": "L03-009", "p": 3, "q": "Verificarea periodică a scafandrilor brevetați, pentru reconfirmarea aptitudinilor, este asigurată de MApN în calitate de:", "o": ["autoritate de criptologie", "autoritate națională în pregătirea, brevetarea și perfecționarea scafandrilor", "autoritate navală militară", "autoritate sanitară"], "a": 1, "e": "Art. 6 alin. (3)."}, {"id": "L03-011", "p": 3, "q": "Dimensiunea structurii de forțe a armatei se stabilește prin:", "o": ["hotărâre a consiliilor județene", "documentele de planificare a apărării", "ordin al comandantului de brigadă", "regulamentul de ordine interioară"], "a": 1, "e": "Art. 28 alin. (2)."}, {"id": "L03-014", "p": 3, "q": "Categoriile de forțe cuprind, între altele:", "o": ["serviciile publice comunitare", "prefecturile", "instituții militare de învățământ și unități de instrucție", "inspectoratele pentru situații de urgență"], "a": 2, "e": "Art. 29."}, {"id": "L03-024", "p": 3, "q": "Structurile de conducere și de forțe puse la dispoziția NATO:", "o": ["nu pot participa la misiuni", "rămân exclusiv sub comanda primarilor", "se integrează în structura de comandă și control și în structura de forțe a NATO", "se desființează în timp de pace"], "a": 2, "e": "Art. 38."}, {"id": "L03-028", "p": 3, "q": "Evidența efectivelor Direcției generale de informații a apărării se ține:", "o": ["împreună cu cea a forțelor terestre", "separat de cea a ministerului", "la centrele militare județene", "de NATO"], "a": 1, "e": "Art. 44."}, {"id": "L03-029", "p": 3, "q": "Care dintre următoarele categorii NU se include în necesarul de efective al MApN, potrivit art. 45?", "o": ["soldații și gradații profesioniști aflați în instrucția de bază", "ofițerii din statele majore ale categoriilor de forțe", "subofițerii din unitățile de comunicații", "maiștrii militari din unitățile de mentenanță"], "a": 0, "e": "Art. 45 alin. (1) lit. c): militarii în termen și cu termen redus, soldații și gradații profesioniști în instrucția de bază, elevii și studenții."}]}, {"nr": 15, "id": "sistemul-ci", "t": "Sistemul C&I al Forțelor Terestre și plutonul C&I", "tema": "Sprijinul de comunicații și informatică în operațiile Forțelor Terestre; mijloacele de comunicații și informatică ale plutonului C&I", "parte": "S", "stele": 2, "itemi": "2–3", "timp": "60 min", "sursa": "F.T.-10 Manualul sprijinului de comunicații și informatică în operațiile Forțelor Terestre (Sibiu 2007), Cap. II art. 39–77, Cap. III art. 126–145 · F.T./T-4 Manualul pentru luptă al plutonului de comunicații și informatică (Sibiu 2007), Cap. II art. 22–28, 40–52", "ps": "<p>Cum arată <strong>rețeaua de comunicații a armatei<\/strong> de la general până la soldat, și <strong>ce are în dotare plutonul tău<\/strong> (viitoarea ta unitate). Înveți <strong>nivelurile sistemului<\/strong>, <strong>nodurile<\/strong>, <strong>COMSEC/TRANSEC<\/strong>, <strong>principiile<\/strong>, <strong>cine are ce structură C&amp;I<\/strong> și cele <strong>două subsisteme ale plutonului<\/strong>: <strong>local<\/strong> (în PC) și <strong>radio<\/strong> (spre exterior).<\/p>", "fise": [{"t": "Avertisment: manualele nu sunt publice", "h": "<aside class=\"co co-info\"><div class=\"co-h\">Bine de știut<\/div><p>Manualele <strong>F.T.-10<\/strong> și <strong>F.T./T-4<\/strong> nu sunt publice. Capitolul descrie <strong>arhitectura standard<\/strong> a unui sistem tactic de comunicații (NATO, la care s-a aliniat doctrina românească), explicată logic. <strong>Denumirile exacte<\/strong> ale structurilor din manualele din 2007 și <strong>modelele concrete<\/strong> de echipamente se verifică în manual și la unitate (tabelul „de completat” de la final).<\/p><\/aside>"}, {"t": "Ideea de bază: un sistem pe 3 niveluri", "h": "<p>Sistemul de comunicații și informatică (SCI) leagă <strong>toate punctele de comandă (PC)<\/strong>, de la nivel strategic până la soldat.<\/p>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 316\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Rețea radio de luptă, noduri ale sistemului de zonă și rețeaua locală a unui punct de comandă\">\n  <text x=\"200\" y=\"18\" text-anchor=\"middle\" class=\"t-b\">1 · Rețea radio de luptă (CNR)<\/text>\n  <g class=\"s-acc\" stroke-width=\"2\" stroke-dasharray=\"6 5\"><line x1=\"200\" y1=\"62\" x2=\"70\" y2=\"60\"/><line x1=\"200\" y1=\"62\" x2=\"130\" y2=\"84\"/><line x1=\"200\" y1=\"62\" x2=\"270\" y2=\"84\"/><line x1=\"200\" y1=\"62\" x2=\"330\" y2=\"60\"/><\/g>\n  <circle cx=\"200\" cy=\"62\" r=\"16\" class=\"f-acc\"/>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\"><circle cx=\"70\" cy=\"60\" r=\"11\"/><circle cx=\"130\" cy=\"84\" r=\"11\"/><circle cx=\"270\" cy=\"84\" r=\"11\"/><circle cx=\"330\" cy=\"60\" r=\"11\"/><\/g>\n  <text x=\"200\" y=\"98\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-mut\">NCS<\/text>\n  <line x1=\"10\" y1=\"110\" x2=\"390\" y2=\"110\" class=\"s-line\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"128\" text-anchor=\"middle\" class=\"t-b\">2 · Sistem de zonă (radioreleu)<\/text>\n  <g class=\"s-blu\" stroke-width=\"3\" fill=\"none\"><path d=\"M110 165 L200 148\"/><path d=\"M200 148 L290 165\"/><path d=\"M110 165 L200 190\"/><path d=\"M290 165 L200 190\"/><path d=\"M200 148 L200 190\"/><path d=\"M52 165 H96\"/><path d=\"M304 165 H348\"/><\/g>\n  <g class=\"f-bls s-blu\" stroke-width=\"2\"><circle cx=\"110\" cy=\"165\" r=\"13\"/><circle cx=\"200\" cy=\"148\" r=\"13\"/><circle cx=\"290\" cy=\"165\" r=\"13\"/><circle cx=\"200\" cy=\"190\" r=\"13\"/><\/g>\n  <g class=\"f-acs s-acc\" stroke-width=\"2\"><rect x=\"30\" y=\"154\" width=\"22\" height=\"22\" rx=\"4\"/><rect x=\"348\" y=\"154\" width=\"22\" height=\"22\" rx=\"4\"/><\/g>\n  <g style=\"font-size:12px\" text-anchor=\"middle\" class=\"t-mut\"><text x=\"41\" y=\"146\">acces<\/text><text x=\"359\" y=\"146\">acces<\/text><text x=\"200\" y=\"214\">noduri de tranzit (rețea în ochiuri)<\/text><\/g>\n  <path d=\"M41 176 V268 H90\" class=\"s-acc\" stroke-width=\"2.5\" fill=\"none\"/><path d=\"M359 176 V268 H310\" class=\"s-acc\" stroke-width=\"2.5\" fill=\"none\"/>\n  <text x=\"200\" y=\"236\" text-anchor=\"middle\" class=\"t-b\">3 · Rețeaua locală a PC<\/text>\n  <rect x=\"90\" y=\"244\" width=\"220\" height=\"62\" rx=\"10\" class=\"f-none s-mut\" stroke-width=\"1.5\" stroke-dasharray=\"6 5\"/>\n  <text x=\"200\" y=\"260\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-mut\">PUNCT DE COMANDĂ<\/text>\n  <g class=\"s-ink\" stroke-width=\"1.5\"><path d=\"M200 266 L130 296\"/><path d=\"M200 266 V296\"/><path d=\"M200 266 L270 296\"/><\/g>\n  <rect x=\"170\" y=\"264\" width=\"60\" height=\"16\" rx=\"4\" class=\"f-acs s-acc\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"277\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-b\">LAN<\/text>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\"><circle cx=\"130\" cy=\"296\" r=\"7\"/><circle cx=\"200\" cy=\"296\" r=\"7\"/><circle cx=\"270\" cy=\"296\" r=\"7\"/><\/g>\n<\/svg><figcaption>Rețea radio de luptă la nivel tactic, noduri de tranzit și de acces în sistemul de zonă, și rețeaua locală a unui punct de comandă.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nivel<\/th>\n<th>Cum se leagă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Strategic<\/strong><\/td>\n<td>sistem <strong>fix<\/strong> (permanent): fibră, radioreleu fix, centre de comunicații<\/td>\n<\/tr>\n<tr>\n<td><strong>Operativ<\/strong><\/td>\n<td>sistem de <strong>campanie de zonă<\/strong>: noduri + radioreleu + satelit<\/td>\n<\/tr>\n<tr>\n<td><strong>Tactic<\/strong><\/td>\n<td><strong>rețele radio de luptă (CNR)<\/strong> + sisteme locale la PC<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Componentele sunt <strong>complementare<\/strong>: fiecare face ce face mai bine.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca <strong>rețeaua de drumuri<\/strong>: autostrada (sistemul fix), drumurile naționale (sistemul de zonă) și potecile din sat (radioul de luptă). Ai nevoie de toate.<\/p><\/aside>"}, {"t": "Rețeaua radio de luptă (CNR)", "h": "<p><strong>CNR<\/strong> (<em>Combat Net Radio<\/em>) = stațiile <strong>HF, VHF, UHF<\/strong> ale unităților care luptă, organizate în <strong>rețele radio<\/strong>.<\/p>\n<ul>\n<li>Este <strong>principalul<\/strong> mijloc care <strong>merge în mișcare<\/strong> la nivelurile cele mai joase (grupă, pluton, companie, batalion).<\/li>\n<li><strong>VHF cu salt de frecvență (FH)<\/strong>, 30–88 MHz → distanțe <strong>mici și medii<\/strong>.<\/li>\n<li><strong>HF<\/strong> → distanțe <strong>mari<\/strong> și legătura cu cei aflați dincolo de linia de vedere.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p>La întrebarea „ce mijloc merge <strong>în mișcare<\/strong> la nivel tactic?” → <strong>rețeaua radio de luptă (CNR)<\/strong>.<\/p><\/aside>"}, {"t": "Sistemul de zonă – „coloana vertebrală”", "h": "<p>Sistemul de zonă (sistemul de trunchiuri) este <strong>coloana vertebrală<\/strong> (<em>backbone<\/em>) a comunicațiilor din teatrul de operații.<\/p>\n<ul>\n<li>Are <strong>noduri de comunicații<\/strong> legate între ele prin <strong>radioreleu de mare capacitate<\/strong> (trunchiuri multiplexate), <strong>satelit<\/strong> și <strong>fibră/cablu<\/strong>.<\/li>\n<li><strong>Noduri de tranzit (de trunchi)<\/strong> → formează <strong>rețeaua în ochiuri<\/strong> (<em>mesh<\/em>). Dacă un nod cade, traficul se <strong>re-rutează automat<\/strong> pe altă cale.<\/li>\n<li><strong>Noduri de acces<\/strong> → <strong>conectează punctele de comandă<\/strong> la rețea.<\/li>\n<li><strong>Puncte de acces radio<\/strong> pentru abonați mobili → stațiile de pe vehicule intră în rețea ca într-o rețea de telefonie mobilă.<\/li>\n<li>Oferă <strong>voce, date, video<\/strong>, cu capacitate mare, pe zone întinse.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Nodurile de tranzit<\/strong> sunt <strong>intersecțiile<\/strong> mari; <strong>nodurile de acces<\/strong> sunt <strong>intrările<\/strong> în fiecare cartier. Dacă o intersecție se blochează, ocolești pe altă stradă: asta e rețeaua în ochiuri.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: <strong>nod de acces<\/strong> = leagă un <strong>PC<\/strong> la rețea. <strong>Nod de tranzit<\/strong> = leagă <strong>noduri între ele<\/strong>.<\/p><\/aside>"}, {"t": "Alte piese ale sistemului", "h": "<ul>\n<li><strong>Sistemul local al PC<\/strong>: rețeaua locală (LAN, telefonie, terminale) din interiorul PC. Leagă <strong>celulele statului major<\/strong> între ele și cu <strong>nodul de acces<\/strong>.<\/li>\n<li><strong>Comunicațiile prin satelit<\/strong>: pentru <strong>distanțe mari<\/strong>, dincolo de linia de vedere (<strong>BLOS<\/strong>), pentru legătura cu <strong>eșaloanele superioare<\/strong> și cu <strong>forțele din misiuni externe<\/strong>.<\/li>\n<li><strong>Sistemul informatic (C2IS)<\/strong>: aplicațiile prin care statul major <strong>planifică<\/strong>, <strong>vede situația<\/strong> (imaginea operațională comună) și <strong>transmite ordine și rapoarte<\/strong>. Merge <strong>peste<\/strong> infrastructura de comunicații.<\/li>\n<li><strong>Managementul sistemului<\/strong>: planificarea și gestionarea <strong>frecvențelor<\/strong>, <strong>managementul rețelei<\/strong> (configurare, monitorizare, re-rutare) și al <strong>cheilor criptografice<\/strong>.<\/li>\n<\/ul>"}, {"t": "Securitatea: COMSEC, TRANSEC, INFOSEC", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Sigla<\/th>\n<th>Ce protejează<\/th>\n<th>Exemple<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>COMSEC<\/strong><\/td>\n<td><strong>comunicațiile<\/strong><\/td>\n<td><strong>criptare<\/strong>, chei, materiale criptografice<\/td>\n<\/tr>\n<tr>\n<td><strong>TRANSEC<\/strong><\/td>\n<td><strong>transmisia<\/strong><\/td>\n<td><strong>salt de frecvență<\/strong>, putere redusă, antene directive<\/td>\n<\/tr>\n<tr>\n<td><strong>INFOSEC<\/strong><\/td>\n<td><strong>informația<\/strong> din sisteme informatice<\/td>\n<td>parole, controlul accesului<\/td>\n<\/tr>\n<tr>\n<td>securitate <strong>fizică<\/strong> și a <strong>personalului<\/strong><\/td>\n<td>locurile și oamenii<\/td>\n<td>pază, verificarea persoanelor<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>COM<\/strong>SEC = <strong>COM<\/strong>unicații = <strong>cifrezi<\/strong>. <strong>TRAN<\/strong>SEC = <strong>TRAN<\/strong>smisie = <strong>ascunzi emisia<\/strong> (salt, putere mică).<\/p><\/aside>"}, {"t": "Principiile sprijinului C&I", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Principiu<\/th>\n<th>Ce înseamnă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Planificare centralizată, execuție descentralizată<\/strong><\/td>\n<td>un singur plan de comunicații, executat de fiecare eșalon<\/td>\n<\/tr>\n<tr>\n<td><strong>Redundanța<\/strong><\/td>\n<td><strong>cel puțin două căi<\/strong> independente către fiecare PC important<\/td>\n<\/tr>\n<tr>\n<td><strong>Prioritatea<\/strong><\/td>\n<td>întâi legăturile cele mai importante<\/td>\n<\/tr>\n<tr>\n<td><strong>Flexibilitatea<\/strong><\/td>\n<td>sistemul se reconfigurează după situație<\/td>\n<\/tr>\n<tr>\n<td><strong>Continuitatea<\/strong><\/td>\n<td>inclusiv pe timpul deplasării PC<\/td>\n<\/tr>\n<tr>\n<td><strong>Securitatea<\/strong><\/td>\n<td>criptare și protecție împotriva războiului electronic<\/td>\n<\/tr>\n<tr>\n<td><strong>Interoperabilitatea<\/strong><\/td>\n<td>compatibilitate cu aliații (NATO)<\/td>\n<\/tr>\n<tr>\n<td><strong>Standardizarea<\/strong><\/td>\n<td>echipamente și proceduri comune<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Deplasarea PC fără pierderea legăturii<\/strong> se face <strong>pe eșaloane<\/strong>: o parte a centrului de comunicații <strong>rămâne<\/strong> și ține legătura, cealaltă se <strong>mută<\/strong>, se instalează și <strong>preia<\/strong> legătura. Abia apoi se mută prima parte.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca atunci când <strong>muți o echipă de fotbal pe teren nou<\/strong>: jucătorii nu pleacă toți odată, ca să nu rămână poarta goală.<\/p><\/aside>"}, {"t": "Cine are ce structură C&I", "h": "<p><strong>Regula:<\/strong> <strong>fiecare eșalon<\/strong> are propria structură C&amp;I, potrivită ca mărime. Ea realizează <strong>centrul de comunicații<\/strong> al PC și legăturile cu subordonații („<strong>de sus în jos<\/strong>”).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Eșalon<\/th>\n<th>Structura C&amp;I tipică<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Statul Major / comandamente operative<\/strong><\/td>\n<td>structuri C&amp;I de nivel operativ (batalioane/regimente C&amp;I)<\/td>\n<\/tr>\n<tr>\n<td><strong>Divizie<\/strong><\/td>\n<td><strong>batalion de comunicații și informatică<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Brigadă<\/strong><\/td>\n<td><strong>batalion / companie de C&amp;I<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Batalion<\/strong><\/td>\n<td><strong>pluton de comunicații și informatică (Pl.C.I.)<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Companie<\/strong><\/td>\n<td><strong>grupă / echipă de comunicații<\/strong> (operatori radio)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Atribuții generale ale structurilor C&amp;I:<\/strong><\/p>\n<ul>\n<li><strong>planifică, instalează, exploatează și mențin<\/strong> sistemele eșalonului;<\/li>\n<li><strong>realizează centrele de comunicații<\/strong> ale PC;<\/li>\n<li>asigură <strong>securitatea<\/strong> comunicațiilor;<\/li>\n<li><strong>restabilesc<\/strong> legăturile întrerupte;<\/li>\n<li>asigură <strong>mentenanța<\/strong> echipamentelor;<\/li>\n<li>fac <strong>managementul frecvențelor<\/strong> și al rețelelor la nivelul lor.<\/li>\n<\/ul>\n<p>Șeful structurii C&amp;I este și <strong>consilierul comandantului<\/strong> pentru comunicații și informatică. La statul major corespunde compartimentului <strong>J6 / G6 / S6<\/strong>. La <strong>batalion și brigadă<\/strong> compartimentul se notează <strong>S6<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Batalion → pluton C&amp;I → S6.<\/strong> Plutonul tău e la batalion.<\/p><\/aside>"}, {"t": "Plutonul C&I – ce face", "h": "<p>Plutonul C&amp;I este structura de comunicații a <strong>batalionului<\/strong>. El:<\/p>\n<ul>\n<li><strong>instalează și exploatează centrul de comunicații al PC al batalionului<\/strong>;<\/li>\n<li>face legăturile PC batalion <strong>cu companiile<\/strong> (subordonați), <strong>cu eșalonul superior<\/strong> și <strong>cu vecinii / structurile care cooperează<\/strong>;<\/li>\n<li>asigură <strong>sistemul local<\/strong> al PC (telefonie, rețea de date, terminale);<\/li>\n<li>asigură <strong>securitatea<\/strong> comunicațiilor și <strong>mentenanța de nivel scăzut<\/strong>.<\/li>\n<\/ul>\n<p><strong>Compunere tipică (orientativ):<\/strong> comanda plutonului, <strong>grupa (grupele) radio<\/strong>, <strong>grupa de fir / telefonie<\/strong>, <strong>grupa de informatică / date<\/strong>, vehicule și echipamente de alimentare. Compunerea exactă e în F.T./T-4 art. 22–28.<\/p>"}, {"t": "Subsistemul local (în PC)", "h": "<p><strong>Ce este:<\/strong> mijloacele care asigură comunicațiile <strong>în interiorul PC<\/strong> și <strong>în imediata lui apropiere<\/strong>. Leagă <strong>celulele statului major<\/strong>, comandantul și punctele de lucru între ele și cu subsistemele de transport (radio, radioreleu).<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Componentă<\/th>\n<th>Rol<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Centrala (comutatorul) telefonică de campanie<\/strong><\/td>\n<td>face <strong>legăturile telefonice<\/strong> între abonații PC și cu exteriorul (prin trunchiuri)<\/td>\n<\/tr>\n<tr>\n<td><strong>Terminale telefonice<\/strong><\/td>\n<td>la fiecare abonat<\/td>\n<\/tr>\n<tr>\n<td><strong>Rețeaua locală de date (LAN)<\/strong><\/td>\n<td>leagă <strong>calculatoarele<\/strong> / terminalele (switch-uri, routere)<\/td>\n<\/tr>\n<tr>\n<td><strong>Cabluri de campanie<\/strong> (fir, multiperechi, fibră)<\/td>\n<td>mediul fizic al legăturilor locale<\/td>\n<\/tr>\n<tr>\n<td><strong>Echipamente de criptare<\/strong><\/td>\n<td>protejează traficul care <strong>iese din PC<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Interfețe cu radio / radioreleu<\/strong><\/td>\n<td>conectează sistemul local la rețelele exterioare<\/td>\n<\/tr>\n<tr>\n<td><strong>Surse de energie<\/strong> (grupuri electrogene, acumulatori)<\/td>\n<td>alimentează întregul centru<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>✅ <strong>Avantaje:<\/strong> capacitate mare, siguranță (prin fir e <strong>greu de interceptat și bruiat<\/strong>).\n❌ <strong>Dezavantaje:<\/strong> <strong>timp de instalare<\/strong> și <strong>mobilitate redusă<\/strong> față de radio.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>E ca <strong>telefonul și internetul din birou<\/strong>: stabile și sigure, dar legate de un loc.<\/p><\/aside>"}, {"t": "Subsistemul radio de campanie (spre exterior)", "h": "<p><strong>Ce este:<\/strong> stațiile radio ale plutonului (și ale batalionului) și rețelele organizate cu ele.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Componentă<\/th>\n<th>Rol<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Stații VHF (FH) portabile<\/strong> (<em>manpack<\/em>)<\/td>\n<td>pentru comandanți și operatori la pas; <strong>rețelele batalionului și ale companiilor<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Stații VHF (FH) vehiculare<\/strong><\/td>\n<td><strong>putere mai mare, antene mai înalte → bătaie mai mare<\/strong>, montate pe vehicule<\/td>\n<\/tr>\n<tr>\n<td><strong>Stații HF<\/strong><\/td>\n<td><strong>distanțe mari<\/strong>, dincolo de linia de vedere (cu eșalonul superior)<\/td>\n<\/tr>\n<tr>\n<td><strong>Stații de retranslație<\/strong><\/td>\n<td><strong>măresc bătaia<\/strong> și ocolesc obstacolele<\/td>\n<\/tr>\n<tr>\n<td><strong>Antene<\/strong><\/td>\n<td>adaptate gamei și distanței<\/td>\n<\/tr>\n<tr>\n<td><strong>Echipamente de date prin radio<\/strong><\/td>\n<td>mesaje text, poziții (GPS), date tactice<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Rețelele radio tipice ale batalionului:<\/strong><\/p>\n<ul>\n<li><strong>rețeaua de comandă a batalionului<\/strong> → <strong>NCS = stația comandantului de batalion<\/strong>;<\/li>\n<li><strong>rețeaua de comandă a eșalonului superior<\/strong> (brigadă) → batalionul este <strong>stație subordonată<\/strong>;<\/li>\n<li><strong>rețele de cooperare<\/strong> (artilerie, vecini);<\/li>\n<li><strong>rețele logistice / administrative<\/strong>;<\/li>\n<li>rețele de <strong>avertizare<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: în rețeaua <strong>batalionului<\/strong>, NCS e stația <strong>comandantului de batalion<\/strong>. În rețeaua <strong>brigăzii<\/strong>, batalionul e <strong>stație subordonată<\/strong>.<\/p><\/aside>"}, {"t": "Cum se leagă cele două subsisteme", "h": "<p><strong>Subsistemul local = „în PC”<\/strong> (fix, mult trafic, fir). <strong>Subsistemul radio = „spre exterior și în mișcare”<\/strong>.<\/p>\n<p><strong>Interfața<\/strong> dintre ele permite ca un ofițer din PC să vorbească de la telefonul lui cu o stație radio din teren.<\/p>\n<p><code>Eșalon superior (brigadă)\n        ▲  radio HF/VHF, radioreleu, satelit\n        │\nCENTRUL DE COMUNICAȚII AL PC BATALION\n  RADIO DE CAMPANIE  ◄─ interfață ─►  LOCAL (centrală, LAN, telefoane)\n        │ rețele radio de comandă\n        ▼\nCompaniile 1, 2, 3, compania de sprijin<\/code><\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Local = „în casă”. Radio = „în teren”. Interfața = „ușa” dintre ele.<\/strong><\/p><\/aside>"}, {"t": "De completat din manual / de la unitate", "h": "<p>Aici <strong>nu inventăm<\/strong> nimic. Notează din F.T./T-4 și din dotarea unității:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Răspunsul tău<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tipul stației VHF FH portabile (denumire, gamă, putere)<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Tipul stației VHF vehiculare (putere, bătaie)<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Tipul stației HF (gamă, moduri, putere)<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Tipul centralei telefonice de campanie (număr de abonați)<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Tipul cablului de campanie<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Compunerea exactă a Pl.C.I. (F.T./T-4 art. 22–28)<\/td>\n<td><strong>de completat<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "flash": [["Mijlocul principal care merge în mișcare la nivel tactic?", "<b>Rețelele radio de luptă (CNR)<\/b>."], ["CNR = ?", "<b>Combat Net Radio<\/b>: stații HF, VHF, UHF în rețele."], ["„Coloana vertebrală” a sistemului de campanie?", "<b>Sistemul de zonă<\/b> (noduri + radioreleu + satelit)."], ["Nodurile care conectează PC la sistemul de zonă?", "<b>Nodurile de acces<\/b>."], ["Nodurile care formează rețeaua în ochiuri?", "<b>Nodurile de tranzit (de trunchi)<\/b>."], ["Avantajul rețelei în ochiuri?", "Dacă un nod cade, traficul se <b>re-rutează<\/b> pe altă cale."], ["Legăturile de mare capacitate între noduri?", "<b>Radioreleu<\/b> (și satelit, fibră)."], ["Rețeaua locală a PC face parte din…?", "<b>Sistemul local al punctului de comandă<\/b>."], ["Satelitul se folosește pentru…?", "<b>Distanțe mari<\/b> (dincolo de linia de vedere) și legătura cu eșaloanele superioare / misiunile externe."], ["COMSEC?", "Securitatea <b>comunicațiilor<\/b>: criptare, chei."], ["TRANSEC?", "Securitatea <b>transmisiei<\/b>: salt de frecvență, putere redusă, antene directive."], ["INFOSEC?", "Securitatea <b>informației<\/b> din sistemele informatice."], ["Principiul „minimum 2 căi independente”?", "<b>Redundanța<\/b>."], ["Cum se deplasează centrul de comunicații fără să piardă legătura?", "<b>Pe eșaloane<\/b> (în salturi)."], ["Principiul de planificare a sprijinului C&I?", "<b>Planificare centralizată, execuție descentralizată<\/b>."], ["Structura C&I la batalion?", "<b>Plutonul de comunicații și informatică<\/b>."], ["Compartimentul C&I la batalion / brigadă?", "<b>S6<\/b>."], ["Structura C&I a fiecărui eșalon realizează în primul rând…?", "<b>Centrul de comunicații<\/b> al PC."], ["Gestionarea frecvențelor și monitorizarea rețelelor fac parte din…?", "<b>Managementul sistemului<\/b>."], ["Imaginea operațională comună și ordinele electronice vin de la…?", "<b>Sistemul informatic (C2IS)<\/b>."], ["Plutonul C&I instalează și exploatează în principal…?", "<b>Centrul de comunicații al PC batalion<\/b>."], ["Subsistemul local asigură comunicațiile…?", "<b>În interiorul PC<\/b> și în imediata lui apropiere."], ["Rolul centralei telefonice de campanie?", "Face <b>legăturile telefonice<\/b> între abonați și cu exteriorul."], ["Avantajul legăturilor prin fir?", "<b>Greu de interceptat și bruiat<\/b>."], ["Dezavantajul legăturilor prin fir față de radio?", "<b>Timp de instalare mai mare, mobilitate redusă<\/b>."], ["Subsistemul radio de campanie cuprinde…?", "<b>Stații VHF (FH) portabile și vehiculare, stații HF, retranslație<\/b>, antene, accesorii."], ["Stațiile HF se folosesc pentru…?", "<b>Distanțe mari<\/b> și legături dincolo de linia de vedere."], ["VHF vehiculare față de portabile?", "<b>Putere mai mare, bătaie mai mare<\/b>."], ["Ce permite unui abonat telefonic din PC să vorbească la radio?", "<b>Interfața<\/b> dintre sistemul local și cel radio."], ["NCS în rețeaua de comandă a batalionului?", "<b>Stația comandantului de batalion<\/b>."], ["În rețeaua brigăzii, stația batalionului e…?", "<b>Stație subordonată<\/b>."], ["Rolul echipamentelor de criptare din centrul de comunicații?", "Să <b>protejeze traficul<\/b> care iese din PC."]], "q": [{"id": "S04-001", "p": 1, "q": "La nivel tactic, principalul mijloc de comunicații care permite legătura pe timpul mișcării este:", "o": ["rețeaua locală de date (LAN)", "rețeaua radio de luptă (CNR)", "centrala telefonică a PC", "rețeaua de fibră optică fixă"], "a": 1, "e": "Infrastructura C&I."}, {"id": "S04-002", "p": 1, "q": "„Coloana vertebrală” a sistemului de comunicații de campanie, formată din noduri interconectate prin legături de mare capacitate, este:", "o": ["semnalizarea vizuală", "sistemul de zonă (de trunchiuri / de transport)", "rețeaua radio a grupei", "curierul"], "a": 1, "e": "Sistemul de zonă."}, {"id": "S04-003", "p": 1, "q": "Nodurile care conectează punctele de comandă la sistemul de zonă se numesc:", "o": ["noduri de acces", "stații de retranslație", "centre de mentenanță", "noduri de tranzit"], "a": 0, "e": "Arhitectura sistemului de zonă."}, {"id": "S04-008", "p": 1, "q": "Securitatea comunicațiilor (COMSEC) se referă în principal la:", "o": ["alimentarea cu energie a stațiilor", "protejarea conținutului comunicațiilor prin criptare și gestionarea cheilor", "protecția fizică a cazărmii", "planificarea deplasărilor"], "a": 1, "e": "COMSEC."}, {"id": "S04-009", "p": 1, "q": "Securitatea transmisiei (TRANSEC) cuprinde măsuri precum:", "o": ["criptarea documentelor pe hârtie", "saltul de frecvență, puterea redusă și antenele directive", "verificarea medicală a operatorilor", "paza depozitelor"], "a": 1, "e": "TRANSEC."}, {"id": "S04-010", "p": 1, "q": "Principiul care cere existența a cel puțin două căi independente de legătură către fiecare PC important se numește:", "o": ["redundanță (rezervă)", "centralizare", "standardizare", "simplitate"], "a": 0, "e": "Principiile SCI."}, {"id": "S04-013", "p": 1, "q": "La nivelul batalionului, structura de comunicații și informatică este, de regulă:", "o": ["batalionul de comunicații", "brigada de comunicații", "plutonul de comunicații și informatică", "regimentul de transmisiuni"], "a": 2, "e": "Structuri C&I din FT."}, {"id": "S04-014", "p": 1, "q": "Compartimentul de stat major responsabil de comunicații și informatică la nivel de batalion/brigadă se notează:", "o": ["S4", "S2", "S1", "S6"], "a": 3, "e": "S1 – personal, S2 – informații, S3 – operații, S4 – logistică, S6 – C&I."}, {"id": "S05-001", "p": 1, "q": "Plutonul de comunicații și informatică al batalionului instalează și exploatează, în principal:", "o": ["rețeaua strategică de fibră optică", "sistemul satelitar național", "centrul de comunicații al punctului de comandă al batalionului", "centrul de comunicații al diviziei"], "a": 2, "e": "Rolul Pl.C.I."}, {"id": "S05-002", "p": 1, "q": "Subsistemul local de comunicații asigură comunicațiile:", "o": ["numai cu sateliții", "în interiorul punctului de comandă și în imediata lui apropiere", "numai între vehicule aflate în mișcare", "între capitale de țară"], "a": 1, "e": "Subsistemul local."}, {"id": "S05-003", "p": 1, "q": "Care dintre următoarele face parte din subsistemul local de comunicații?", "o": ["stația radio HF a eșalonului superior", "satelitul de comunicații", "centrala telefonică de campanie și rețeaua locală de date", "stația de retranslație de pe un deal îndepărtat"], "a": 2, "e": "Componentele subsistemului local."}, {"id": "S05-005", "p": 1, "q": "Avantajul legăturilor prin fir din subsistemul local este:", "o": ["mobilitatea foarte mare", "instalarea instantanee", "siguranța mare față de interceptare și bruiaj", "bătaia de sute de kilometri"], "a": 2, "e": "Fir vs. radio."}, {"id": "S05-006", "p": 1, "q": "Dezavantajul principal al subsistemului local (prin fir) față de radio este:", "o": ["timpul de instalare și mobilitatea redusă", "bruierea foarte ușoară", "interceptarea foarte ușoară", "capacitatea foarte mică"], "a": 0, "e": "Fir vs. radio."}, {"id": "S05-007", "p": 1, "q": "Subsistemul radio de campanie al plutonului C&I cuprinde, în principal:", "o": ["centrala telefonică și cablurile multiperechi", "doar terminalele informatice", "stații radio VHF (portabile și vehiculare), stații HF, stații de retranslație și antene", "grupurile electrogene"], "a": 2, "e": "Subsistemul radio."}, {"id": "S04-004", "p": 2, "q": "Avantajul principal al unei rețele de noduri în ochiuri (rețea „mesh”) este că:", "o": ["nu poate fi interceptată", "funcționează fără energie electrică", "nu necesită echipamente de comutație", "traficul poate fi re-rutat automat pe altă cale dacă un nod sau o legătură este distrusă"], "a": 3, "e": "Fiabilitate prin redundanță."}, {"id": "S04-006", "p": 2, "q": "Rețeaua locală care leagă celulele statului major din interiorul punctului de comandă face parte din:", "o": ["rețeaua de avertizare a populației", "sistemul local al punctului de comandă", "sistemul satelitar strategic", "rețeaua radio de luptă"], "a": 1, "e": "Sistemul local."}, {"id": "S04-007", "p": 2, "q": "Comunicațiile prin satelit sunt folosite în special pentru:", "o": ["legături în interiorul vehiculului", "semnalizarea vizuală", "legături la distanțe mari, dincolo de linia de vedere", "legături între două telefoane din același cort"], "a": 2, "e": "Satelit – BLOS."}, {"id": "S04-011", "p": 2, "q": "Pentru a nu pierde legătura pe timpul deplasării punctului de comandă, centrul de comunicații se deplasează:", "o": ["doar după aprobarea Parlamentului", "numai noaptea, cu stațiile oprite", "tot deodată, cu întreruperea completă a legăturilor", "în eșaloane (salturi): o parte menține legătura, cealaltă se mută și preia legătura"], "a": 3, "e": "Continuitatea comunicațiilor."}, {"id": "S04-015", "p": 2, "q": "Structura C&I a fiecărui eșalon realizează, în primul rând:", "o": ["transportul muniției", "centrul de comunicații al punctului de comandă al eșalonului respectiv și legăturile cu subordonații", "asistența medicală", "paza cazărmii"], "a": 1, "e": "Structuri C&I."}, {"id": "S05-004", "p": 2, "q": "Rolul centralei (comutatorului) telefonice de campanie este:", "o": ["radiogoniometria stațiilor inamice", "criptarea mesajelor radio", "alimentarea cu energie a PC", "realizarea legăturilor telefonice între abonații PC și cu exteriorul, prin trunchiuri"], "a": 3, "e": "Subsistemul local."}, {"id": "S05-008", "p": 2, "q": "Stațiile radio HF din dotarea plutonului C&I sunt folosite în special pentru:", "o": ["legături la distanțe mari și dincolo de linia de vedere", "legături în interiorul cortului de comandă", "iluminarea PC", "rețeaua locală de calculatoare"], "a": 0, "e": "Subsistemul radio."}, {"id": "S05-009", "p": 2, "q": "Comparativ cu stațiile VHF portabile, stațiile VHF vehiculare au, de regulă:", "o": ["putere mai mare și antene mai înalte, deci bătaie mai mare", "aceeași bătaie, dar greutate mai mică", "putere mai mică și bătaie mai mică", "numai funcția de recepție"], "a": 0, "e": "Subsistemul radio."}, {"id": "S05-011", "p": 2, "q": "În rețeaua de comandă a batalionului, stația de control al rețelei (NCS) este, de regulă:", "o": ["stația de retranslație", "stația unei companii", "stația comandantului de batalion", "stația eșalonului inferior"], "a": 2, "e": "Rețelele batalionului."}, {"id": "S04-005", "p": 3, "q": "Legăturile de mare capacitate dintre nodurile sistemului de zonă se realizează, de regulă, prin:", "o": ["stații radio portabile VHF", "radioreleu, satelit și fibră/cablu", "curieri pe jos", "semnalizare cu rachete"], "a": 1, "e": "Sistemul de zonă."}, {"id": "S04-012", "p": 3, "q": "Principiul de planificare a sprijinului C&I este:", "o": ["fără planificare, execuție la inițiativă", "planificare descentralizată, execuție centralizată", "planificare numai la nivel de grupă", "planificare centralizată, execuție descentralizată"], "a": 3, "e": "Principiile SCI."}, {"id": "S04-016", "p": 3, "q": "Care dintre următoarele NU este o atribuție a structurilor de comunicații și informatică?", "o": ["managementul frecvențelor la nivelul lor", "instalarea și exploatarea sistemelor C&I", "executarea tragerilor de artilerie", "restabilirea legăturilor întrerupte"], "a": 2, "e": "Structuri C&I."}, {"id": "S04-017", "p": 3, "q": "Gestionarea frecvențelor radio și configurarea/monitorizarea rețelelor fac parte din:", "o": ["logistica de hrănire", "protecția civilă", "managementul sistemului de comunicații și informatică", "poliția militară"], "a": 2, "e": "Managementul SCI."}, {"id": "S04-018", "p": 3, "q": "Imaginea operațională comună, planificarea și transmiterea ordinelor în format electronic sunt asigurate de:", "o": ["rețeaua de alimentare cu energie", "sistemul de semnalizare acustică", "sistemul informatic de comandă și control (C2IS)", "stația de radiodifuziune"], "a": 2, "e": "C2IS."}, {"id": "S05-010", "p": 3, "q": "Elementul care permite unui abonat telefonic din PC să comunice printr-o stație radio cu un corespondent din teren este:", "o": ["interfața dintre subsistemul local și subsistemul radio", "antena bici", "acumulatorul", "casca operatorului"], "a": 0, "e": "Legătura dintre subsisteme."}, {"id": "S05-012", "p": 3, "q": "În rețeaua de comandă a brigăzii, stația batalionului are calitatea de:", "o": ["stație subordonată", "stație de bruiaj", "stație de control al rețelei", "stație necunoscută"], "a": 0, "e": "Rețelele batalionului."}, {"id": "S05-013", "p": 3, "q": "Echipamentele de criptare din centrul de comunicații al PC au rolul de a:", "o": ["amplifica semnalul radio", "proteja conținutul traficului care iese din PC", "mări bătaia stațiilor", "stoca energie"], "a": 1, "e": "COMSEC."}]}, {"nr": 16, "id": "cariera", "t": "Ghidul carierei militare", "tema": "HG nr. 106/2011 pentru aprobarea Ghidului carierei militare", "parte": "L", "stele": 2, "itemi": "1–2", "timp": "35 min", "sursa": "HG nr. 106/2011 – Cap. I art. 1–8; Cap. III art. 21–26; Cap. IV art. 27", "ps": "<p><strong>Harta carierei tale<\/strong>: de la sergent la plutonier adjutant principal, și drumul spre corpul ofițerilor. Pică des: <strong>ce e cariera militară<\/strong>, <strong>comisiile<\/strong> (temporare, hotărâri definitive), <strong>singurul pas fără comisie<\/strong> (sergent → sergent-major), <strong>cursurile<\/strong> și <strong>condițiile pentru ofițer<\/strong>.<\/p>", "fise": [{"t": "Ce este cariera militară (art. 1–4)", "h": "<p><strong>Art. 1.<\/strong> Ghidul stabilește <strong>cum și după ce reguli parcurgi cariera<\/strong>, pentru cadrele militare în activitate din MApN.<\/p>\n<p>⚠️ <strong>Cariera militară<\/strong> = <strong>succesiunea de funcții<\/strong> ocupate de ofițeri, maiștri militari și subofițeri, în raport cu <strong>cunoștințele, abilitățile și competențele<\/strong> lor, <strong>de la intrarea în sistem până la trecerea în rezervă sau în retragere<\/strong>.<\/p>\n<p><strong>Art. 2.<\/strong> Cadrele în activitate = <strong>cetățeni români cu domiciliul stabil în România<\/strong>, cărora li s-a dat grad de ofițer, maistru militar sau subofițer.<\/p>\n<p><strong>Art. 3.<\/strong> Cadrele sunt <strong>confirmate într-o armă / serviciu / specialitate<\/strong> și sunt <strong>militari profesioniști<\/strong>. <strong>Își păstrează specialitatea pe toată cariera<\/strong>. Schimbarea depinde de <strong>nevoile instituției<\/strong>.<\/p>\n<p><strong>Art. 4.<\/strong> <strong>Încadrarea, numirea și promovarea<\/strong> se fac în <strong>funcții din statele de organizare<\/strong>, ținând seama de: <strong>specialitate<\/strong>, <strong>nevoile instituției<\/strong>, <strong>opțiunile<\/strong> personale, <strong>competența profesională<\/strong> și <strong>conduita morală<\/strong>. Fiecare funcție are cod, grad, nivel de salarizare și nivel de studii.<\/p>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: cariera <strong>nu<\/strong> înseamnă doar gradele și <strong>nu<\/strong> doar vechimea. Înseamnă <strong>succesiunea de funcții<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>scară în clădire<\/strong>: fiecare treaptă e o funcție. Urci după cât ești de bun, după cât e nevoie și după postul liber, nu doar după anii pe care i-ai numărat.<\/p><\/aside>"}, {"t": "Comisiile de selecție (art. 5–8)", "h": "<p><strong>Art. 5.<\/strong> Se fac <strong>comisii de selecție temporare<\/strong> pentru: <strong>promovarea în funcții<\/strong>, <strong>înaintarea în grad<\/strong> și <strong>trecerea în corpul ofițerilor<\/strong>.<\/p>\n<p>⚠️ <strong>Comisiile sunt temporare. Hotărârile lor sunt definitive.<\/strong><\/p>\n<p><strong>Art. 6.<\/strong> Înaintarea în grad și trecerea în corpul ofițerilor cer îndeplinirea <strong>cumulativă<\/strong> a condițiilor din lege și din ghid (adică <strong>toate<\/strong>, nu doar una). <strong>Cursurile de carieră<\/strong> se urmează <strong>în perioada stagiului din gradul deținut<\/strong>.<\/p>\n<p><strong>Art. 7.<\/strong> Dacă ai stat în aceeași funcție <strong>stagiul minim<\/strong> și nu ești înaintat, poți fi <strong>menținut în funcție<\/strong> sau numit în alta <strong>fără promovare<\/strong> și <strong>fără evaluare de comisie<\/strong> (excepție: funcțiile unicat).<\/p>\n<p><strong>Art. 8.<\/strong> Normele sistemului de selecție se stabilesc prin <strong>ordin al ministrului apărării naționale<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Temporare, dar definitive<\/strong>: comisia se desface după ce lucrează, dar ce a hotărât <strong>nu se mai schimbă<\/strong>.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: normele sistemului de selecție se dau prin <strong>ordin al ministrului<\/strong>, nu prin lege, nu prin hotărâre CSAT, nu prin decret.<\/p><\/aside>"}, {"t": "Intrarea în corpul subofițerilor (art. 21)", "h": "<p>Subofițerii (și maiștrii militari) sunt <strong>confirmați în specialitate<\/strong> prin <strong>absolvirea programului de pregătire<\/strong> și <strong>numiți în funcții<\/strong> specifice.<\/p>\n<p>Cursul pe care îl vei da tu acum este exact acest program de pregătire.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la <strong>permisul de conducere<\/strong>: te înscrii la școală (cursul), iei examenul (absolvirea) și abia apoi ți se dă drumul pe drum (funcția).<\/p><\/aside>"}, {"t": "Scara carierei de subofițer (art. 22–26)", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Scara carierei de subofițer cu cursul și comisia de la fiecare treaptă\">\n  <g stroke-width=\"1.5\">\n    <rect x=\"10\" y=\"250\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-acs s-acc\"/>\n    <rect x=\"18\" y=\"206\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-acs s-acc\"/>\n    <rect x=\"26\" y=\"162\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"34\" y=\"118\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"42\" y=\"74\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"50\" y=\"30\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-b\" style=\"font-size:12px\"><text x=\"20\" y=\"274\">1 · Sergent<\/text><text x=\"28\" y=\"230\">2 · Sergent-major<\/text><text x=\"36\" y=\"186\">3 · Plutonier<\/text><text x=\"44\" y=\"142\">4 · Plutonier-major<\/text><text x=\"52\" y=\"98\">5 · Plutonier adjutant<\/text><text x=\"60\" y=\"54\">6 · Plt. adj. principal<\/text><\/g>\n  <text x=\"188\" y=\"274\" style=\"font-size:12px\" class=\"t-acc t-b\">← gradul tău după curs<\/text>\n  <g style=\"font-size:12px\">\n    <text x=\"196\" y=\"224\" class=\"t-acc t-b\">fără comisie<\/text>\n    <text x=\"204\" y=\"176\">curs plutonier<\/text><text x=\"204\" y=\"191\">+ comisie<\/text>\n    <text x=\"212\" y=\"132\">curs plutonier-major<\/text><text x=\"212\" y=\"147\">+ comisie<\/text>\n    <text x=\"220\" y=\"88\">curs plutonier adjutant<\/text><text x=\"220\" y=\"103\">+ comisie<\/text>\n    <text x=\"228\" y=\"44\">distincție, „foarte bun”<\/text><text x=\"228\" y=\"59\">înaltă calif. + comisie<\/text>\n  <\/g>\n<\/svg><figcaption>Scara carierei de subofițer: la fiecare treaptă apare cursul necesar și dacă se cere comisie. Singurul pas fără comisie este primul.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Art.<\/th>\n<th>Pasul<\/th>\n<th>Condiții<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>22<\/strong><\/td>\n<td><strong>Sergent → sergent-major<\/strong><\/td>\n<td>stagiul minim + calificativele cerute. ⚠️ <strong>Fără analiza comisiei.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>23<\/strong><\/td>\n<td><strong>Sergent-major → plutonier<\/strong><\/td>\n<td>stagiul + calificative + <strong>cursul de plutonier<\/strong>. <strong>Cu comisie.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>24<\/strong><\/td>\n<td><strong>Plutonier → plutonier-major<\/strong><\/td>\n<td>stagiul + calificative + <strong>cursul de plutonier-major<\/strong>. <strong>Cu comisie.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>25<\/strong><\/td>\n<td><strong>Plutonier-major → plutonier adjutant<\/strong><\/td>\n<td>stagiul + calificative + <strong>cursul de plutonier adjutant<\/strong>. <strong>Cu comisie.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>26<\/strong><\/td>\n<td><strong>Plutonier adjutant → plutonier adjutant principal<\/strong><\/td>\n<td>te <strong>distingi<\/strong> prin pregătire, ai <strong>înaltă calificare<\/strong>, stagiul minim, calificative <strong>cel puțin „foarte bun”<\/strong>. <strong>Cu comisie.<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Singurul pas fără comisie este primul.<\/strong> La ceilalți ai <strong>comisie<\/strong> și, până la plutonier adjutant, un <strong>curs cu numele gradului următor<\/strong>.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Cursul are numele gradului la care vrei să ajungi:<\/strong> vrei <strong>plutonier<\/strong> → cursul de <strong>plutonier<\/strong>; vrei <strong>plutonier-major<\/strong> → cursul de <strong>plutonier-major<\/strong>.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: la gradul final (<strong>plutonier adjutant principal<\/strong>) <strong>nu<\/strong> se cere curs, ci <strong>distincție + înaltă calificare + „foarte bun”<\/strong>.<\/p><\/aside>"}, {"t": "Drumul spre corpul ofițerilor (art. 27)", "h": "<p>Subofițerii (și maiștrii) pot trece în corpul ofițerilor dacă îndeplinesc <strong>cumulativ<\/strong>:<\/p>\n<ol>\n<li><strong>se disting<\/strong> prin competență și pregătire profesională;<\/li>\n<li>au <strong>studii universitare de licență<\/strong> (ciclul I Bologna) sau <strong>studii superioare de lungă durată<\/strong> (minimum 4 ani);<\/li>\n<li>au calificativul <strong>„foarte bun”<\/strong> în <strong>ultimii 3 ani<\/strong> de activitate.<\/li>\n<\/ol>\n<p>Mai departe:<\/p>\n<ul>\n<li>trecerea depinde de <strong>nevoile MApN<\/strong>;<\/li>\n<li>se face prin absolvirea <strong>cursului de formare a ofițerilor în activitate<\/strong>;<\/li>\n<li>accesul la curs este <strong>prin concurs<\/strong>, pe baza <strong>comisiei de selecție<\/strong>, în limita locurilor aprobate.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>„3 – L – FB”<\/strong>: <strong>3<\/strong> ani, <strong>L<\/strong>icență, <strong>F<\/strong>oarte <strong>B<\/strong>un.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: <strong>nu<\/strong> se cere gradul de plutonier adjutant principal, <strong>nici<\/strong> o vechime de 20 de ani, <strong>nici<\/strong> o vârstă anume.<\/p><\/aside>"}], "flash": [["Ce este cariera militară?", "<b>Succesiunea de funcții<\/b> ocupate, de la intrarea în sistem până la rezervă sau retragere."], ["Cine sunt cadrele militare în activitate?", "<b>Cetățeni români cu domiciliul stabil în România<\/b> cu grad de ofițer, maistru militar sau subofițer."], ["Își schimbă cadrele specialitatea?", "<b>Nu<\/b>; o păstrează pe toată cariera. Schimbarea doar după <b>nevoile instituției<\/b>."], ["În ce funcții se face încadrarea?", "În funcții din <b>statele de organizare<\/b>."], ["La numire se ține seama de…?", "<b>Specialitate, nevoi, opțiuni, competență, conduită morală<\/b>."], ["Comisiile de selecție sunt…?", "<b>Temporare<\/b>; hotărârile lor sunt <b>definitive<\/b>."], ["Pentru ce se fac comisii?", "<b>Promovarea în funcții<\/b>, <b>înaintarea în grad<\/b>, <b>trecerea în corpul ofițerilor<\/b>."], ["Condițiile pentru înaintare sunt…?", "<b>Cumulative<\/b> (toate)."], ["Când se urmează cursurile de carieră?", "<b>În perioada stagiului<\/b> din gradul deținut."], ["Normele sistemului de selecție se dau prin…?", "<b>Ordin al ministrului apărării naționale<\/b>."], ["Cum sunt confirmați subofițerii în specialitate?", "Prin <b>absolvirea programului de pregătire<\/b>."], ["Sergent → sergent-major: comisie?", "<b>Nu<\/b>, fără comisie."], ["Sergent-major → plutonier: ce curs?", "<b>Cursul de plutonier<\/b> (cu comisie)."], ["Plutonier → plutonier-major: ce curs?", "<b>Cursul de plutonier-major<\/b>."], ["Plutonier-major → plutonier adjutant: ce curs?", "<b>Cursul de plutonier adjutant<\/b>."], ["Plutonier adjutant principal: ce se cere?", "<b>Distincție, înaltă calificare, stagiul, calificative cel puțin „foarte bun”<\/b>."], ["Singurul pas fără comisie?", "<b>Sergent → sergent-major<\/b>."], ["Condițiile pentru trecerea în corpul ofițerilor?", "<b>Te distingi, licență (sau studii lungi), „foarte bun” în ultimii 3 ani<\/b>."], ["Ce calificativ pentru ofițer?", "<b>„Foarte bun”<\/b> în <b>ultimii 3 ani<\/b>."], ["Ce studii pentru ofițer?", "<b>Licență (ciclul I Bologna)<\/b> sau studii superioare de lungă durată (min. 4 ani)."], ["Cum se accede la cursul de ofițeri?", "<b>Prin concurs<\/b>, pe baza comisiei, în limita locurilor."], ["Trecerea în corpul ofițerilor depinde de…?", "<b>Nevoile MApN<\/b>."]], "q": [{"id": "L09-001", "p": 1, "q": "Potrivit Ghidului carierei militare, cariera militară reprezintă:", "o": ["succesiunea de funcții ocupate de ofițeri, maiștri militari și subofițeri, de la intrarea în sistem până la trecerea în rezervă sau în retragere", "numărul de ani petrecuți în aceeași unitate", "totalitatea cursurilor absolvite", "succesiunea gradelor obținute, fără legătură cu funcțiile"], "a": 0, "e": "Art. 1 alin. (2)."}, {"id": "L09-009", "p": 1, "q": "Înaintarea sergenților în gradul de sergent-major (respectiv maiștri militari clasa a V-a în clasa a IV-a), dacă îndeplinesc condițiile, se face:", "o": ["numai după absolvirea cursului de plutonier", "numai cu aprobarea ministrului", "numai prin concurs național", "fără analiza comisiei de selecție"], "a": 3, "e": "Art. 22."}, {"id": "L09-013", "p": 1, "q": "Una dintre condițiile pentru trecerea maiștrilor militari/subofițerilor în corpul ofițerilor este:", "o": ["vârsta de cel puțin 40 de ani", "calificativul „foarte bun” în ultimii 3 ani de activitate", "gradul de plutonier adjutant principal", "vechimea de minimum 20 de ani"], "a": 1, "e": "Art. 27."}, {"id": "L09-014", "p": 1, "q": "Pentru trecerea în corpul ofițerilor, maiștrii militari/subofițerii trebuie să aibă:", "o": ["doar diploma de bacalaureat", "studii universitare de licență (ciclul I Bologna) sau studii superioare de lungă durată", "studii postliceale", "doctorat"], "a": 1, "e": "Art. 27."}, {"id": "L09-003", "p": 2, "q": "Cadrele militare își păstrează specialitatea militară:", "o": ["pe toată durata carierei; trecerea în altă specialitate se face în funcție de nevoile instituției", "până la înaintarea în gradul de plutonier", "maximum 10 ani", "până la primul curs de carieră"], "a": 0, "e": "Art. 3."}, {"id": "L09-004", "p": 2, "q": "Încadrarea, numirea și promovarea cadrelor militare se fac:", "o": ["exclusiv după vechime", "în funcții prevăzute în statele de organizare, ținând seama de specialitate, nevoi, opțiuni, competență și conduită morală", "prin tragere la sorți", "exclusiv după vârstă"], "a": 1, "e": "Art. 4."}, {"id": "L09-005", "p": 2, "q": "Comisiile de selecție pentru promovare, înaintare în grad și trecerea în corpul ofițerilor sunt:", "o": ["permanente, iar hotărârile lor pot fi atacate la CSAT", "temporare, iar hotărârile lor sunt definitive", "numite de Parlament", "alese de militari prin vot"], "a": 1, "e": "Art. 5."}, {"id": "L09-010", "p": 2, "q": "Pentru înaintarea sergentului-major în gradul de plutonier este necesară, între altele:", "o": ["absolvirea cursului de plutonier", "absolvirea unei facultăți", "vechime de 20 de ani", "absolvirea cursului de plutonier adjutant"], "a": 0, "e": "Art. 23."}, {"id": "L09-011", "p": 2, "q": "Pentru înaintarea plutonierului-major în gradul de plutonier adjutant este necesară, între altele:", "o": ["absolvirea cursului de plutonier", "licența în științe militare", "participarea la o misiune externă", "absolvirea cursului de plutonier adjutant"], "a": 3, "e": "Art. 25."}, {"id": "L09-012", "p": 2, "q": "Pentru înaintarea în gradul de plutonier adjutant principal se cer, între altele, calificative de cel puțin:", "o": ["„foarte bun” în perioada stagiului", "„satisfăcător”", "„bun”", "„excepțional” în toți anii de carieră"], "a": 0, "e": "Art. 26."}, {"id": "L09-015", "p": 2, "q": "Trecerea maiștrilor militari/subofițerilor în corpul ofițerilor se realizează:", "o": ["numai în timp de război", "la cerere, fără alte condiții", "automat, după 10 ani de activitate", "în funcție de nevoile MApN, prin absolvirea cursului de formare a ofițerilor în activitate, cu acces prin concurs"], "a": 3, "e": "Art. 27–28."}, {"id": "L09-002", "p": 3, "q": "Cadrele militare în activitate sunt, potrivit ghidului:", "o": ["soldații și gradații profesioniști", "orice persoane care lucrează în MApN", "cetățeni ai statelor NATO încadrați în MApN", "cetățeni români cu domiciliul stabil în România, cărora li s-a acordat grad de ofițer, maistru militar sau subofițer"], "a": 3, "e": "Art. 2."}, {"id": "L09-006", "p": 3, "q": "Cursurile de carieră se urmează:", "o": ["în perioada stagiului în gradul deținut", "după înaintarea în gradul următor", "numai după 20 de ani de serviciu", "numai înainte de intrarea în sistem"], "a": 0, "e": "Art. 6."}, {"id": "L09-007", "p": 3, "q": "Normele de organizare și funcționare a sistemului de selecție se stabilesc prin:", "o": ["lege organică", "hotărâre a CSAT", "decret prezidențial", "ordin al ministrului apărării naționale"], "a": 3, "e": "Art. 8."}, {"id": "L09-008", "p": 3, "q": "Maiștrii militari și subofițerii sunt confirmați în specialitate prin:", "o": ["vechime de 5 ani", "examen la CSAT", "absolvirea programului de pregătire", "aprobarea comandantului de pluton"], "a": 2, "e": "Art. 21."}]}, {"nr": 17, "id": "misiuni-externe", "t": "Misiunile în afara teritoriului", "tema": "Legea nr. 121/2011 privind participarea forțelor armate la misiuni și operații în afara teritoriului statului român", "parte": "L", "stele": 1, "itemi": "0–1", "timp": "30 min", "sursa": "Legea nr. 121/2011 – Cap. I art. 1–3; Cap. IV art. 14–18", "ps": "<p>Capitol <strong>scurt și ușor<\/strong>. Spune <strong>în ce fel de misiuni<\/strong> merg militarii români în străinătate și <strong>ce drepturi au<\/strong>. Pică mai ales <strong>cele 4 tipuri de misiuni<\/strong> și <strong>cifrele<\/strong>: <strong>2,5 zile<\/strong> de concediu pe lună, o călătorie acasă la <strong>6 luni<\/strong>, vizită de <strong>5 zile<\/strong>.<\/p>", "fise": [{"t": "Obiectul legii și cele 4 tipuri de misiuni (art. 1–2)", "h": "<p><strong>Art. 1.<\/strong> Legea spune <strong>în ce condiții<\/strong> participă forțele armate române la <strong>misiuni și operații în afara teritoriului României<\/strong>.<\/p>\n<p><strong>Art. 2. Cele 4 tipuri:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lit.<\/th>\n<th>Tipul<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td><strong>apărare colectivă<\/strong> în cadrul <strong>NATO<\/strong> sau asigurarea securității statelor membre <strong>UE<\/strong><\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td><strong>răspuns la crize<\/strong><\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td><strong>pace<\/strong> (de sprijin al păcii)<\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td><strong>asistență umanitară<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Se desfășoară:<\/p>\n<ul>\n<li>sub <strong>mandat ONU sau OSCE<\/strong>;<\/li>\n<li>sub <strong>conducerea NATO sau UE<\/strong>;<\/li>\n<li>ori în <strong>coaliții<\/strong>.<\/li>\n<\/ul>\n<p>Misiunile de <strong>asistență umanitară<\/strong> se pot desfășura și <strong>la solicitarea statului afectat<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>„A-R-P-U”<\/strong>: <strong>A<\/strong>părare colectivă, <strong>R<\/strong>ăspuns la crize, <strong>P<\/strong>ace, <strong>U<\/strong>manitar.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca <strong>echipele de intervenție<\/strong>: unele apără (apărare colectivă), unele opresc o criză (răspuns la crize), unele păzesc liniștea (pace), unele ajută victimele (umanitar).<\/p><\/aside>"}, {"t": "Condiții generale (art. 3)", "h": "<ul>\n<li>Participarea se face <strong>în condițiile legii<\/strong> și conform <strong>obligațiilor asumate prin tratate<\/strong>.<\/li>\n<li>Forțele merg cu <strong>structurile, personalul, armamentul, tehnica și echipamentele<\/strong> necesare.<\/li>\n<li>Pentru pregătire, pot participa la <strong>exerciții, antrenamente și ceremoniale<\/strong>, <strong>în țară sau în străinătate<\/strong>.<\/li>\n<\/ul>"}, {"t": "Cine merge și cine hotărăște (art. 14–15)", "h": "<p><strong>Art. 14.<\/strong><\/p>\n<ul>\n<li>Structurile se încadrează, <strong>de regulă, cu personal profesionalizat<\/strong>.<\/li>\n<li><strong>Selecționarea<\/strong> și <strong>durata participării<\/strong> se stabilesc prin <strong>ordin al ministrului apărării naționale<\/strong>.<\/li>\n<\/ul>\n<p><strong>Art. 15.<\/strong><\/p>\n<ul>\n<li>Merge <strong>personal militar<\/strong> și, la nevoie, <strong>personal civil<\/strong> propriu.<\/li>\n<li>Dacă lipsesc specialiști, pot fi selecționați <strong>rezerviști voluntari<\/strong> sau <strong>salariați civili<\/strong>.<\/li>\n<li>Pe durata pregătirii și a misiunii, <strong>contractele de muncă / raporturile de serviciu se suspendă<\/strong>.<\/li>\n<li>Posturile rămase libere pot fi ocupate temporar, cu <strong>contracte pe durată determinată<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: contractele <strong>se suspendă<\/strong> (nu se desfac). Omul își păstrează locul de muncă.<\/p><\/aside>"}, {"t": "Drepturile cu cifre (art. 16) 🔢", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Dreptul<\/th>\n<th>Cifra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Concediu de odihnă suplimentar<\/strong><\/td>\n<td><strong>2,5 zile pentru fiecare lună<\/strong> de prezență în zona de operații<\/td>\n<\/tr>\n<tr>\n<td><strong>Transport decontat<\/strong>: o călătorie în țară și retur<\/td>\n<td><strong>la fiecare 6 luni<\/strong> (dacă nu îl suportă organizația internațională)<\/td>\n<\/tr>\n<tr>\n<td><strong>Drepturi salariale<\/strong><\/td>\n<td>potrivit legii; ⚠️ <strong>soldele/salariile NU pot fi diminuate<\/strong> pe perioada participării<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Cine participă la <strong>exerciții sau ceremoniale în străinătate<\/strong> are drepturile celor trimiși în <strong>deplasare temporară<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>2,5 pe lună. Acasă la 6 luni.<\/strong><\/p><\/aside>"}, {"t": "Decorații, răniți, deces (art. 17–18)", "h": "<p><strong>Art. 17.<\/strong> Pentru <strong>merite deosebite, curaj, eroism și devotament<\/strong> se pot acorda <strong>decorații<\/strong>.<\/p>\n<p><strong>Art. 18.<\/strong><\/p>\n<ul>\n<li><strong>Despăgubiri<\/strong> pentru <strong>invaliditate sau deces<\/strong>.<\/li>\n<li>Cine este <strong>evacuat medical<\/strong> în străinătate, plus însoțitorii, primește <strong>diurna<\/strong> misiunii.<\/li>\n<li><strong>Spitalizarea<\/strong> o plătește <strong>MApN<\/strong>.<\/li>\n<li>🔢 <strong>Soțul/soția și rudele de gradul I<\/strong> pot vizita personalul spitalizat în străinătate <strong>câte 5 zile<\/strong>, <strong>după internare<\/strong> și <strong>la fiecare lună<\/strong> de spitalizare, pe cheltuiala <strong>MApN<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Dacă te rănești departe de casă, <strong>statul îți plătește spitalul<\/strong> și îi aduce <strong>familia<\/strong> să te vadă.<\/p><\/aside>"}], "flash": [["Ce reglementează Legea 121/2011?", "Condițiile participării forțelor armate la <b>misiuni și operații în afara teritoriului<\/b>."], ["Cele 4 tipuri de misiuni?", "<b>Apărare colectivă, răspuns la crize, pace, asistență umanitară<\/b>."], ["Sub ce mandate se desfășoară?", "<b>ONU, OSCE<\/b>; sub conducerea <b>NATO sau UE<\/b>; sau în <b>coaliții<\/b>."], ["Misiunile umanitare se pot desfășura și…?", "<b>La solicitarea statului afectat<\/b>."], ["Pentru pregătire, forțele pot participa la…?", "<b>Exerciții, antrenamente, ceremoniale<\/b>, în țară sau în străinătate."], ["Cu ce personal se încadrează structurile, de regulă?", "<b>Personal profesionalizat<\/b>."], ["Selecția și durata participării se stabilesc prin…?", "<b>Ordin al ministrului apărării<\/b>."], ["Dacă lipsesc specialiști?", "Se pot selecționa <b>rezerviști voluntari<\/b> sau <b>salariați civili<\/b>."], ["Contractele de muncă ale civililor în misiune?", "Se <b>suspendă<\/b>."], ["Concediu suplimentar în zona de operații?", "<b>2,5 zile pentru fiecare lună<\/b>."], ["Transport decontat acasă și retur?", "O dată la <b>6 luni<\/b>."], ["Soldele pe durata misiunii?", "<b>Nu pot fi diminuate<\/b>."], ["Decorații pentru…?", "<b>Merite deosebite, curaj, eroism, devotament<\/b>."], ["Cine plătește spitalizarea în străinătate?", "<b>MApN<\/b>."], ["Vizita rudelor la cel spitalizat?", "<b>5 zile<\/b>, după internare și la fiecare lună; soț/soție și rude de gradul I."]], "q": [{"id": "L05-002", "p": 1, "q": "Potrivit Legii 121/2011, forțele armate participă la misiuni și operații de:", "o": ["poliție, jandarmerie și protecție civilă", "numai asistență umanitară", "apărare colectivă, ocupație și administrare a teritoriilor", "apărare colectivă, răspuns la crize, pace și asistență umanitară"], "a": 3, "e": "Art. 2 alin. (1)."}, {"id": "L05-003", "p": 1, "q": "Misiunile și operațiile prevăzute de Legea 121/2011 se pot desfășura:", "o": ["sub mandat ONU sau OSCE, sub conducerea NATO sau UE, ori în coaliții", "numai sub mandat ONU", "numai în cadrul NATO", "numai sub comandă națională"], "a": 0, "e": "Art. 2 alin. (2)."}, {"id": "L05-006", "p": 1, "q": "Structurile care participă la misiuni în afara teritoriului se încadrează, de regulă, cu:", "o": ["personal civil contractual, exclusiv", "rezerviști fără pregătire", "personal profesionalizat", "militari în termen"], "a": 2, "e": "Art. 14 alin. (1)."}, {"id": "L05-007", "p": 1, "q": "Selecționarea personalului și durata participării la misiuni se stabilesc prin:", "o": ["decret prezidențial", "hotărâre a CSAT, pentru fiecare militar", "hotărâre a Parlamentului", "ordin al ministrului apărării naționale"], "a": 3, "e": "Art. 14 alin. (2)."}, {"id": "L05-010", "p": 1, "q": "Personalul care participă la misiuni în afara teritoriului beneficiază de un concediu de odihnă suplimentar de:", "o": ["1 zi pentru fiecare lună", "2,5 zile pentru fiecare lună de prezență în zona de operații", "5 zile pentru fiecare lună", "10 zile pe misiune, indiferent de durată"], "a": 1, "e": "Art. 16 alin. (1) lit. a)."}, {"id": "L05-001", "p": 2, "q": "Legea 121/2011 reglementează:", "o": ["protecția informațiilor clasificate", "regimul armelor și munițiilor deținute de MApN", "participarea forțelor armate la misiuni și operații în afara teritoriului statului român", "statutul cadrelor militare"], "a": 2, "e": "Art. 1."}, {"id": "L05-004", "p": 2, "q": "Misiunile de asistență umanitară se pot desfășura și:", "o": ["numai în timp de război", "la solicitarea statului afectat", "fără acordul statului afectat", "numai la solicitarea unei organizații neguvernamentale"], "a": 1, "e": "Art. 2 alin. (3)."}, {"id": "L05-011", "p": 2, "q": "Personalul aflat în misiune are dreptul la decontarea transportului pentru o călătorie în țară și retur:", "o": ["lunar", "o dată pe an", "la fiecare 6 luni", "la fiecare 3 luni"], "a": 2, "e": "Art. 16 alin. (1) lit. c)."}, {"id": "L05-012", "p": 2, "q": "Pe perioada participării la misiuni, soldele/salariile lunare brute ale personalului:", "o": ["nu pot fi diminuate", "se plătesc de organizația internațională", "se reduc cu 50%", "se suspendă"], "a": 0, "e": "Art. 16 alin. (3)."}, {"id": "L05-014", "p": 2, "q": "Soțul/soția și rudele de gradul I pot vizita personalul spitalizat în străinătate:", "o": ["câte 5 zile, după internare și la fiecare lună de spitalizare, pe cheltuiala MApN", "o singură dată, 10 zile, pe cheltuiala proprie", "nelimitat, pe cheltuiala spitalului", "câte 3 zile, la fiecare 3 luni"], "a": 0, "e": "Art. 18 alin. (4)."}, {"id": "L05-005", "p": 3, "q": "Pentru pregătire, forțele armate pot participa, în țară sau în străinătate, la:", "o": ["exerciții, antrenamente și ceremoniale", "alegeri", "misiuni de poliție locală", "activități comerciale"], "a": 0, "e": "Art. 3 alin. (3)."}, {"id": "L05-008", "p": 3, "q": "Dacă MApN nu are specialiștii necesari pentru o misiune, pot fi selecționați:", "o": ["persoane fără cetățenie română", "elevi ai liceelor militare", "rezerviști voluntari sau salariați civili", "militari ai altor state, exclusiv"], "a": 2, "e": "Art. 15 alin. (2)."}, {"id": "L05-009", "p": 3, "q": "Pe durata pregătirii și a participării la misiune, contractele individuale de muncă sau raporturile de serviciu ale personalului civil și ale rezerviștilor:", "o": ["se suspendă", "încetează", "se prelungesc automat cu durata misiunii", "se transformă în contracte pe durată determinată"], "a": 0, "e": "Art. 15 alin. (3)."}, {"id": "L05-013", "p": 3, "q": "Pentru merite deosebite, curaj, eroism și devotament în misiuni, personalului i se pot acorda:", "o": ["locuințe gratuite în proprietate", "decorații, potrivit legii", "grade de general", "scutire de impozit pe viață"], "a": 1, "e": "Art. 17."}, {"id": "L05-015", "p": 3, "q": "Cheltuielile de spitalizare pentru personalul evacuat medical în străinătate sunt suportate de:", "o": ["Casa Națională de Asigurări de Sănătate", "militarul în cauză", "Ministerul Apărării Naționale", "statul pe teritoriul căruia se află spitalul"], "a": 2, "e": "Art. 18 alin. (3)."}]}, {"nr": 18, "id": "disciplina", "t": "Disciplina militară (RG-3) și sancțiunile soldaților", "tema": "RG-3 Regulamentul disciplinei militare (Ordinul M.64/2013) și Legea 384/2006", "parte": "L", "stele": 1, "itemi": "0–1", "timp": "40 min", "sursa": "RG-3 (Ordinul M.64/10.06.2013) – art. 2–8, 9–19, 47–50, 51–59, 60–68, 80, Anexele 2 și 3 · Legea 384/2006 (statutul soldaților și gradaților profesioniști) art. 26–30", "ps": "<p>Cum se ține <strong>ordinea și disciplina<\/strong> și ce <strong>sancțiuni<\/strong> primește un <strong>soldat sau gradat profesionist<\/strong> (adică tu, înainte de curs). Pică des: <strong>lista celor 5 sancțiuni<\/strong>, <strong>cea mai gravă<\/strong>, <strong>fără cercetare prealabilă doar avertismentul<\/strong> și <strong>termenele de 30 de zile și 6 luni<\/strong>.<\/p>", "fise": [{"t": "Avertisment: regulamentul nu e public integral", "h": "<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Anexa cu RG-3 a fost publicată în <strong>Monitorul Oficial 399 bis<\/strong>, care <strong>nu e disponibil gratuit online<\/strong>. Capitolul se bazează pe <strong>Legea 80/1995<\/strong>, pe <strong>Legea 384/2006<\/strong> (sancțiunile soldaților și gradaților profesioniști) și pe principiile generale ale RG-3. <strong>Anexele 2 și 3<\/strong> (tabelele de competențe) se văd <strong>în regulament, la unitate<\/strong>. Folosește tabelul „de completat” de la final. <strong>Nu inventăm cifre.<\/strong><\/p><\/aside>\n<p><strong>Date:<\/strong> aprobat prin <strong>Ordinul M.64/2013<\/strong>, publicat în <strong>M.Of. nr. 399/03.07.2013<\/strong>. Temei legal: Legea 80/1995, <strong>Legea 384/2006<\/strong>, Legea 346/2006.<\/p>\n<p><strong>Pentru tine:<\/strong> acum ești <strong>soldat/gradat profesionist<\/strong>, deci sancțiunile de mai jos se aplică <strong>ție<\/strong>. După curs vei fi cadru militar (Legea 80/1995, vezi capitolul despre statutul cadrelor).<\/p>"}, {"t": "Disciplina militară (art. 2–8)", "h": "<ul>\n<li><strong>Disciplina militară<\/strong> = <strong>starea de ordine<\/strong> din armată: <strong>respectarea strictă<\/strong> a <strong>legilor, regulamentelor, ordinelor și dispozițiilor<\/strong> comandanților.<\/li>\n<li>Este <strong>factor determinant al capacității operaționale<\/strong> (Legea 80, art. 32).<\/li>\n<li>Se bazează pe <strong>acceptarea conștientă<\/strong> a normelor, pe <strong>recompense<\/strong> și pe <strong>sancțiuni<\/strong>.<\/li>\n<li>Cere: respectarea <strong>ierarhiei<\/strong>, <strong>executarea întocmai și la timp<\/strong>, <strong>unicitatea comenzii<\/strong>, respect reciproc, păstrarea secretului.<\/li>\n<li><strong>Prerogativa disciplinară<\/strong> = dreptul comandantului/șefului de a <strong>acorda recompense<\/strong> și de a <strong>aplica sancțiuni<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Disciplina e ca <strong>regulile unui joc de echipă<\/strong>: dacă fiecare face ce vrea, echipa pierde.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: „dreptul de a recompensa și sancționa” se numește <strong>prerogativă disciplinară<\/strong>.<\/p><\/aside>"}, {"t": "Autoritatea militară (art. 9–19)", "h": "<ul>\n<li><strong>Autoritatea militară<\/strong> = <strong>dreptul și obligația<\/strong> comandantului/șefului de a <strong>da ordine<\/strong>, de a cere <strong>executarea<\/strong> lor și de a <strong>controla<\/strong> executarea, în limitele <strong>competenței<\/strong> lui.<\/li>\n<li>Se exercită <strong>asupra subordonaților<\/strong>, <strong>pe cale ierarhică<\/strong>.<\/li>\n<li><strong>Ordinul<\/strong> se dă <strong>verbal, în scris sau prin mijloace tehnice (de comunicații)<\/strong>. Trebuie să fie <strong>legal, clar, precis, concis<\/strong>.<\/li>\n<li>Comandantul <strong>răspunde<\/strong> pentru ordinele date; subordonatul pentru <strong>executarea<\/strong> lor.<\/li>\n<li>⚠️ <strong>Nu se dau și nu se execută<\/strong> ordine contrare <strong>legii, obiceiurilor războiului și convențiilor internaționale<\/strong>.<\/li>\n<\/ul>"}, {"t": "Recompensele (art. 47–50)", "h": "<p>Conform <strong>Legii 384/2006 (art. 26–27)<\/strong>, soldații și gradații profesioniști pot primi:<\/p>\n<ul>\n<li><s
