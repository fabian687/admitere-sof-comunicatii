asului de cuantizare", "jumătate din pasul de cuantizare (±Δ/2)"], "a": 3, "e": "Zgomotul de cuantizare."}, {"id": "S09-014", "p": 2, "q": "Zgomotul de cuantizare poate fi redus prin:", "o": ["creșterea numărului de biți pe eșantion", "folosirea unei antene mai lungi", "eliminarea filtrului anti-aliasing", "reducerea frecvenței de eșantionare sub 2·f_max"], "a": 0, "e": "Mai mulți biți → pași mai mici."}, {"id": "S09-022", "p": 2, "q": "Un semnal cu f_max = 5 kHz este eșantionat la 8 kHz. Consecința este:", "o": ["eliminarea zgomotului de cuantizare", "refacerea perfectă a semnalului", "dublarea debitului", "apariția aliasingului, semnalul nu mai poate fi refăcut corect"], "a": 3, "e": "8 kHz < 10 kHz."}, {"id": "S09-026", "p": 2, "q": "Principalul avantaj al transmisiei digitale față de cea analogică pe distanțe mari este:", "o": ["regenerarea semnalului în repetoare, astfel încât zgomotul nu se acumulează", "imposibilitatea apariției erorilor", "lipsa nevoii de sincronizare", "banda mai îngustă necesară"], "a": 0, "e": "Regenerarea."}, {"id": "S09-027", "p": 2, "q": "Un dezavantaj al transmisiei digitale a vocii (PCM) față de transmisia analogică este:", "o": ["nu poate fi multiplexată", "necesită o lărgime de bandă mai mare", "zgomotul se acumulează la fiecare repetor", "nu poate fi criptată"], "a": 1, "e": "64 kbit/s față de 4 kHz."}, {"id": "S09-029", "p": 2, "q": "Singura pierdere ireversibilă de informație în procesul PCM (când eșantionarea respectă teorema) apare la:", "o": ["cuantizare", "transmisia fără erori", "codare", "eșantionare"], "a": 0, "e": "Eroarea de cuantizare."}, {"id": "S11-009", "p": 2, "q": "Un semnal cu frecvența maximă de 6 kHz este eșantionat la 10 kHz. Se poate reface corect semnalul?", "o": ["da, dacă se folosesc 16 biți pe eșantion", "da, dacă se folosește compandare", "nu, apare aliasing, deoarece 10 kHz < 12 kHz", "da, deoarece 10 kHz > 6 kHz"], "a": 2, "e": "fₑ trebuie să fie ≥ 12 kHz."}, {"id": "S11-014", "p": 2, "q": "Un amplificator cu câștigul de 20 dB mărește puterea semnalului de:", "o": ["2 ori", "20 de ori", "10 ori", "100 de ori"], "a": 3, "e": "10^(20/10)."}, {"id": "S11-023", "p": 2, "q": "Frecvența de 3 MHz corespunde unei lungimi de undă de:", "o": ["100 m", "1000 m", "1 m", "10 m"], "a": 0, "e": "300 / 3."}, {"id": "S09-012", "p": 3, "q": "Numărul de niveluri de cuantizare disponibile la codarea pe 7 biți este:", "o": ["128", "14", "256", "64"], "a": 0, "e": "2⁷ = 128."}, {"id": "S09-015", "p": 3, "q": "Fiecare bit în plus pe eșantion îmbunătățește raportul semnal/zgomot de cuantizare cu aproximativ:", "o": ["1 dB", "6 dB", "3 dB", "10 dB"], "a": 1, "e": "SNR ≈ 6,02·n + 1,76 dB."}, {"id": "S09-016", "p": 3, "q": "Cuantizarea neuniformă (compandarea) se folosește în telefonie pentru că:", "o": ["reduce frecvența de eșantionare la jumătate", "permite transmisia analogică", "asigură o calitate bună și pentru semnalele slabe, fără creșterea numărului de biți", "elimină complet zgomotul de cuantizare"], "a": 2, "e": "Pași mici pentru amplitudini mici."}, {"id": "S09-017", "p": 3, "q": "Legea de compandare folosită în Europa (inclusiv în România) este:", "o": ["legea A", "legea Ohm", "legea Shannon", "legea µ"], "a": 0, "e": "Legea µ se folosește în America de Nord și Japonia."}, {"id": "S09-021", "p": 3, "q": "Un semnal audio este eșantionat la 44,1 kHz, pe 16 biți, în stereo (2 canale). Debitul PCM este de aproximativ:", "o": ["64 kbit/s", "1,41 Mbit/s", "705 kbit/s", "88,2 kbit/s"], "a": 1, "e": "44.100 × 16 × 2."}, {"id": "S09-023", "p": 3, "q": "În modulația delta (DM), fiecare eșantion este codat pe:", "o": ["1 bit", "8 biți", "4 biți", "16 biți"], "a": 0, "e": "Indică doar dacă semnalul crește sau scade."}, {"id": "S09-024", "p": 3, "q": "Defectul modulației delta care apare când semnalul variază mai repede decât poate urmări pasul fix se numește:", "o": ["supraîncărcarea pantei", "dispersie modală", "aliasing", "diafonie"], "a": 0, "e": "Modulația delta."}, {"id": "S09-025", "p": 3, "q": "Codarea ADPCM a vocii permite un debit tipic de:", "o": ["2,048 Mbit/s", "32 kbit/s", "64 kbit/s", "1,544 Mbit/s"], "a": 1, "e": "ADPCM."}, {"id": "S09-028", "p": 3, "q": "La recepție, după decodare, semnalul analogic este refăcut cu ajutorul:", "o": ["unui filtru trece-sus", "unei antene", "unui filtru trece-jos de refacere", "unui multiplexor FDM"], "a": 2, "e": "Conversia N/A."}, {"id": "S11-004", "p": 3, "q": "Un dipol λ/2 pentru frecvența de 10 MHz are lungimea teoretică de:", "o": ["7,5 m", "15 m", "30 m", "3 m"], "a": 1, "e": "λ = 30 m; λ/2 = 15 m."}, {"id": "S11-006", "p": 3, "q": "Orizontul radio dintre două antene aflate la 4 m și, respectiv, 25 m înălțime este de aproximativ:", "o": ["12 km", "50 km", "29 km", "120 km"], "a": 2, "e": "4,12 × (2 + 5)."}, {"id": "S11-007", "p": 3, "q": "Două stații de radioreleu au antenele pe catarge de 100 m. Orizontul radio dintre ele este de aproximativ:", "o": ["41 km", "824 km", "200 km", "82 km"], "a": 3, "e": "4,12 × (10 + 10)."}, {"id": "S11-011", "p": 3, "q": "Numărul de niveluri de cuantizare la codarea pe 16 biți este:", "o": ["256", "1024", "32", "65.536"], "a": 3, "e": "2¹⁶."}, {"id": "S11-012", "p": 3, "q": "Un canal fără zgomot de 3 kHz transmite un semnal cu 16 niveluri. Debitul maxim Nyquist este:", "o": ["6 kbit/s", "96 kbit/s", "24 kbit/s", "48 kbit/s"], "a": 2, "e": "2 × 3000 × log₂16 = 2 × 3000 × 4."}, {"id": "S11-013", "p": 3, "q": "Un canal de 1 MHz are puterea semnalului egală cu puterea zgomotului (S/N = 0 dB). Capacitatea Shannon este:", "o": ["0 bit/s", "1 Mbit/s", "2 Mbit/s", "0,5 Mbit/s"], "a": 1, "e": "10⁶ × log₂(1 + 1)."}, {"id": "S11-015", "p": 3, "q": "O putere de 100 mW exprimată în dBm este:", "o": ["2 dBm", "100 dBm", "20 dBm", "10 dBm"], "a": 2, "e": "10 · log₁₀(100)."}, {"id": "S11-016", "p": 3, "q": "O putere de 0 dBm corespunde unei puteri de:", "o": ["1 W", "10 mW", "1 mW", "0 W"], "a": 2, "e": "dBm este referit la 1 mW."}, {"id": "S11-017", "p": 3, "q": "Două tronsoane de cablu atenuează 3 dB și, respectiv, 7 dB. Atenuarea totală este:", "o": ["10 dB, adică puterea scade de 10 ori", "4 dB", "21 dB", "10 dB, adică puterea scade de 2 ori"], "a": 0, "e": "Atenuările în dB se adună."}, {"id": "S11-019", "p": 3, "q": "Un comutator crossbar 50 × 50 are:", "o": ["50 de puncte de comutație", "100 de puncte de comutație", "250 de puncte de comutație", "2500 de puncte de comutație"], "a": 3, "e": "50²."}, {"id": "S11-020", "p": 3, "q": "Un grup FDM de 12 canale telefonice a câte 4 kHz ocupă o bandă de:", "o": ["12 kHz", "4 kHz", "64 kHz", "48 kHz"], "a": 3, "e": "12 × 4 kHz."}, {"id": "S11-021", "p": 3, "q": "Debitul purtătoarei T1, cu cadre de 193 de biți transmise de 8000 de ori pe secundă, este:", "o": ["1,536 Mbit/s", "2,048 Mbit/s", "193 kbit/s", "1,544 Mbit/s"], "a": 3, "e": "193 × 8000."}, {"id": "S11-022", "p": 3, "q": "Dacă puterea emițătorului crește de la 1 W la 10 W, nivelul semnalului crește cu:", "o": ["10 dB", "100 dB", "9 dB", "3 dB"], "a": 0, "e": "10 · log₁₀(10)."}]}, {"nr": 9, "id": "statutul-cadrelor", "t": "Statutul cadrelor militare", "tema": "Legea 80/1995 – grade, situații, îndatoriri, drepturi, interdicții, disciplină, degradare", "parte": "L", "stele": 3, "itemi": "2–3", "timp": "70 min", "sursa": "Legea 80/1995 – Cap. I art. 1–6; Cap. II art. 7–35; Cap. V art. 69–72", "ps": "<p>După curs devii <strong>subofițer<\/strong>, deci <strong>cadru militar<\/strong>. Legea asta e „contractul” tău cu statul: <strong>ce grade există<\/strong>, <strong>ce trebuie să faci<\/strong>, <strong>ce primești<\/strong>, <strong>ce n-ai voie<\/strong>, <strong>cum ești sancționat<\/strong> și <strong>când îți pierzi gradul<\/strong>.<\/p>", "fise": [{"t": "Cine sunt cadrele militare", "h": "<ul>\n<li><strong>Cadrele militare<\/strong> = <strong>cetățeni români<\/strong> care au primit grad de <strong>ofițer, maistru militar sau subofițer<\/strong>. Sunt <strong>în serviciul națiunii<\/strong>.<\/li>\n<li><strong>3 corpuri:<\/strong> <strong>ofițeri<\/strong>, <strong>maiștri militari<\/strong>, <strong>subofițeri<\/strong>.<\/li>\n<li><strong>Gradul<\/strong> este un <strong>drept<\/strong> al tău și se pierde <strong>numai<\/strong> în cazurile prevăzute de lege.<\/li>\n<li>În exercitarea atribuțiilor exerciți <strong>autoritatea publică<\/strong> și ești protejat de <strong>legea penală<\/strong> (cine te atacă în serviciu răspunde mai grav).<\/li>\n<\/ul>"}, {"t": "Gradele – scara ta de carieră", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Gradele de subofițer\">\n  <g stroke-width=\"1.5\">\n    <rect x=\"20\" y=\"236\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-acs s-acc\"/>\n    <rect x=\"52\" y=\"192\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-acs s-acc\"/>\n    <rect x=\"84\" y=\"148\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"116\" y=\"104\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"148\" y=\"60\" width=\"170\" height=\"38\" rx=\"8\" class=\"f-ams s-amb\"/>\n    <rect x=\"180\" y=\"16\" width=\"200\" height=\"38\" rx=\"8\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-b\"><text x=\"34\" y=\"260\">1 · Sergent<\/text><text x=\"66\" y=\"216\">2 · Sergent-major<\/text><text x=\"98\" y=\"172\">3 · Plutonier<\/text><text x=\"130\" y=\"128\">4 · Plutonier-major<\/text><text x=\"162\" y=\"84\">5 · Plutonier adjutant<\/text><text x=\"192\" y=\"40\">6 · Plt. adjutant principal<\/text><\/g>\n  <text x=\"250\" y=\"262\" class=\"t-acc t-b\" style=\"font-size:12px\">← gradul tău după curs<\/text>\n  <text x=\"20\" y=\"40\" class=\"t-mut\" style=\"font-size:12px\">2 × S<\/text><text x=\"20\" y=\"56\" class=\"t-mut\" style=\"font-size:12px\">4 × P<\/text>\n<\/svg><figcaption>Gradele de subofițer, de jos în sus. Primul tău grad după curs este sergent.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Corp<\/th>\n<th>Grade, de jos în sus<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Subofițeri<\/strong><\/td>\n<td><strong>sergent<\/strong> → <strong>sergent-major<\/strong> → <strong>plutonier<\/strong> → <strong>plutonier-major<\/strong> → <strong>plutonier adjutant<\/strong> → <strong>plutonier adjutant principal<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Maiștri militari<\/strong><\/td>\n<td>clasa a <strong>V-a<\/strong> → a IV-a → a III-a → a II-a → clasa <strong>I<\/strong> → <strong>maistru militar principal<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ofițeri inferiori<\/strong><\/td>\n<td><strong>sublocotenent<\/strong> → <strong>locotenent<\/strong> → <strong>căpitan<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ofițeri superiori<\/strong><\/td>\n<td><strong>maior<\/strong> → <strong>locotenent-colonel<\/strong> → <strong>colonel<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Generali<\/strong><\/td>\n<td>general de brigadă ⭐ → general-maior ⭐⭐ → general-locotenent ⭐⭐⭐ → general ⭐⭐⭐⭐<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>În aviație și marină:<\/strong> maior = <strong>locotenent-comandor<\/strong>; locotenent-colonel = <strong>căpitan-comandor<\/strong>; colonel = <strong>comandor<\/strong>.<\/p>\n<p><strong>Mareșal<\/strong> = cel mai înalt grad. Îl dă <strong>Președintele<\/strong>, <strong>numai în război<\/strong>, generalilor cu <strong>4 stele<\/strong>, pentru merite excepționale.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Subofițerii: „2 S + 4 P”<\/strong> → <strong>S<\/strong>ergent, <strong>S<\/strong>ergent-major, apoi <strong>P<\/strong>lutonier, <strong>P<\/strong>lutonier-major, <strong>P<\/strong>lutonier adjutant, <strong>P<\/strong>lutonier adjutant principal.<\/p><\/aside>"}, {"t": "Cele 3 situații ale unui cadru militar", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situația<\/th>\n<th>Când<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>În activitate<\/strong><\/td>\n<td>ocupă o <strong>funcție militară<\/strong>. Rămâne în activitate și când e la <strong>curs<\/strong>, <strong>suspendat<\/strong>, <strong>pus la dispoziție<\/strong>, <strong>bolnav<\/strong> sau <strong>în captivitate<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>În rezervă<\/strong><\/td>\n<td>nu are funcție, dar <strong>poate fi chemat<\/strong> (concentrat sau mobilizat)<\/td>\n<\/tr>\n<tr>\n<td><strong>În retragere<\/strong><\/td>\n<td><strong>nu mai poate fi chemat<\/strong> deloc<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>⚠️ În activitate pot fi <strong>doar cei cu cetățenie română și domiciliul în țară<\/strong>.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la un fotbalist: <strong>în activitate<\/strong> = e în lot; <strong>în rezervă<\/strong> = nu joacă, dar poate fi chemat; <strong>în retragere<\/strong> = s-a lăsat de fotbal.<\/p><\/aside>"}, {"t": "Îndatoririle principale (art. 8)", "h": "<ol>\n<li><strong>Loialitate<\/strong> față de stat și armată; să lupte pentru țară, <strong>chiar cu prețul vieții<\/strong>.<\/li>\n<li>Să respecte <strong>jurământul<\/strong> și regulamentele; să execute ordinele <strong>întocmai și la timp<\/strong>.<\/li>\n<li>Să prețuiască <strong>onoarea<\/strong> armatei și <strong>demnitatea uniformei<\/strong>.<\/li>\n<li>Să se pregătească și să-și <strong>instruiască subordonații<\/strong>.<\/li>\n<li>Să țină tehnica și armamentul <strong>în stare de funcționare<\/strong>.<\/li>\n<li>Să păstreze <strong>secretul militar, de stat și de serviciu<\/strong>.<\/li>\n<\/ol>\n<p>⚠️ <strong>Ordinele ilegale:<\/strong> nu ți se pot da și <strong>nu ai voie să execuți<\/strong> ordine contrare <strong>legii, obiceiurilor războiului și convențiilor internaționale<\/strong>. Dacă <strong>refuzi<\/strong> un astfel de ordin, <strong>nu răspunzi<\/strong> nici penal, nici civil.<\/p>\n<p><strong>Misiunile externe:<\/strong> cadrele în activitate au <strong>obligația<\/strong> să participe. Pot fi scutite, la cerere, cei cu <strong>familie monoparentală<\/strong>, <strong>întreținători unici<\/strong>, cu <strong>părinți sau soț invalizi<\/strong>, cu <strong>soțul în aceeași misiune<\/strong>, la <strong>calamități<\/strong>.<\/p>"}, {"t": "Drepturile, cu cifre", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Dreptul<\/th>\n<th>Cifra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Solda<\/strong> = solda de grad + solda de funcție + gradații + indemnizații<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td><strong>Concediu fără plată<\/strong> pentru a-ți <strong>urma soțul în străinătate<\/strong> sau pentru <strong>organizații internaționale<\/strong><\/td>\n<td><strong>până la 4 ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Concediu fără plată<\/strong> pentru alte motive<\/td>\n<td><strong>până la 1 an<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Concediu de formare profesională<\/strong> (plătit)<\/td>\n<td><strong>până la 15 zile lucrătoare/an<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Compensația pentru chirie<\/strong> (mutat în altă garnizoană, fără locuință)<\/td>\n<td><strong>până la 50%<\/strong> din soldă<\/td>\n<\/tr>\n<tr>\n<td><strong>Soțul rămas fără serviciu<\/strong> la mutare<\/td>\n<td><strong>50%<\/strong> din solda ta, <strong>max 9 luni<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Ajutor la deces<\/strong> pentru familie<\/td>\n<td><strong>2 solde lunare<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Uniforma după trecerea în rezervă<\/strong><\/td>\n<td>după <strong>20 de ani<\/strong> de serviciu + distincții<\/td>\n<\/tr>\n<tr>\n<td><strong>Pensie<\/strong><\/td>\n<td>pensie militară de stat<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Permisiile<\/strong> sunt pentru <strong>situații personale sau familiale deosebite<\/strong>; regulile sunt în regulamente.<\/li>\n<li>⚠️ <strong>Permisiile, scutirile și concediile medicale NU se scad<\/strong> din concediul de odihnă.<\/li>\n<li>La <strong>cursuri de zi<\/strong> primești <strong>vacanțe<\/strong> în loc de concediu.<\/li>\n<li><strong>Mobilizare sau război<\/strong> → concediile <strong>se întrerup<\/strong>, iar tu te prezinți <strong>imediat<\/strong> la unitate.<\/li>\n<li>Familia are <strong>asistență medicală gratuită<\/strong>.<\/li>\n<\/ul>"}, {"t": "Ce NU ai voie: interdicții și restrângeri ⚠️", "h": "<p><strong>Art. 28 – INTERZIS complet:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td>să fii membru de <strong>partid<\/strong> sau să faci <strong>propagandă politică<\/strong><\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td>să <strong>candidezi<\/strong> (local, Parlament, Parlamentul European, Președinte)<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td>să declari sau să participi la <strong>grevă<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Art. 29 – permis, dar cu limite:<\/strong><\/p>\n<ul>\n<li><strong>nu<\/strong> îți exprimi <strong>opiniile politice în public<\/strong>;<\/li>\n<li><strong>nu<\/strong> spui în public lucruri <strong>contra intereselor țării și ale armatei<\/strong>;<\/li>\n<li><strong>nu<\/strong> prezinți în public <strong>informații militare<\/strong> (doar cei desemnați);<\/li>\n<li><strong>religia<\/strong> e liberă, cu excepția cultelor contrare ordinii publice;<\/li>\n<li><strong>asocierea<\/strong> e permisă (sport, cultură, profesie), dar <strong>nu în sindicate<\/strong>;<\/li>\n<li><strong>nu<\/strong> participi la <strong>mitinguri politice sau sindicale<\/strong>;<\/li>\n<li><strong>călătoriile în străinătate<\/strong> se fac după <strong>ordinul ministrului<\/strong>;<\/li>\n<li>în <strong>stare de urgență, asediu, mobilizare, război<\/strong> se <strong>suspendă audiențele și petițiile<\/strong>.<\/li>\n<\/ul>\n<p><strong>Art. 30:<\/strong> nu ai voie să ai <strong>alte funcții<\/strong> sau să fii <strong>asociat unic / administrator<\/strong> de firmă.<\/p>\n<p><strong>Art. 31:<\/strong> rezerviștii <strong>concentrați<\/strong> pot rămâne în partide, dar <strong>nu fac politică în unitate<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Art. 28 = NU deloc<\/strong> (partid, candidatură, grevă). <strong>Art. 29 = DA, dar cu limite.<\/strong><\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca un <strong>arbitru de fotbal<\/strong>: are voie să iubească fotbalul, dar nu are voie să poarte tricoul unei echipe pe teren. Militarul servește <strong>toată țara<\/strong>, nu un partid.<\/p><\/aside>"}, {"t": "Disciplina, recompensele și sancțiunile", "h": "<ul>\n<li><strong>Disciplina militară<\/strong> se bazează pe <strong>acceptarea conștientă<\/strong> a normelor, pe <strong>recompense<\/strong> și pe <strong>sancțiuni<\/strong>.<\/li>\n<li><strong>Prerogativa disciplinară<\/strong> (dreptul de a recompensa și sancționa) aparține <strong>comandantului/șefului<\/strong>.<\/li>\n<li><strong>Abaterea disciplinară<\/strong> = fapta făcută <strong>cu vinovăție<\/strong> prin care încalci legi, regulamente sau ordine, <strong>dacă nu e infracțiune<\/strong>.<\/li>\n<li>Răspunderea poate fi <strong>disciplinară, materială, civilă sau penală<\/strong>.<\/li>\n<\/ul>\n<p><strong>Recompense:<\/strong> înaintare în grad <strong>excepțional<\/strong> sau <strong>înainte de termen<\/strong>, <strong>decorații<\/strong>, medalii, alte recompense.<\/p>\n<p><strong>Sancțiunile (7), de la ușor la greu:<\/strong><\/p>\n<ol>\n<li><strong>avertisment<\/strong>;<\/li>\n<li><strong>mustrare scrisă<\/strong>;<\/li>\n<li><strong>diminuarea soldei de funcție<\/strong> (max 3 luni);<\/li>\n<li><strong>diminuarea soldei de comandă<\/strong> (max 3 luni);<\/li>\n<li><strong>amânarea înaintării în grad<\/strong>, <strong>1–2 ani<\/strong>;<\/li>\n<li><strong>retrogradarea în funcție<\/strong>;<\/li>\n<li><strong>trecerea în rezervă<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>⚠️ <strong>O abatere = o singură sancțiune.<\/strong><\/li>\n<li>⚠️ Termene: <strong>6 luni<\/strong> de la <strong>constatare<\/strong>, dar <strong>nu mai târziu de 2 ani<\/strong> de la <strong>faptă<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>6 luni / 2 ani<\/strong>: șeful are 6 luni de când află, dar nu mai mult de 2 ani de când s-a întâmplat.<\/p><\/aside>"}, {"t": "Degradarea și scoaterea din evidență (art. 69–72)", "h": "<ul>\n<li><strong>Degradarea militară<\/strong> = pierderea gradului, ca <strong>pedeapsă complementară<\/strong>, dată de <strong>instanță<\/strong> (activ, rezervă sau retragere).<\/li>\n<li><strong>Scoaterea din evidență<\/strong> = pentru cei care <strong>renunță la cetățenia română<\/strong> sau iau <strong>altă cetățenie și se mută în străinătate<\/strong>.<\/li>\n<li><strong>Generalii<\/strong>: prin ordinul <strong>șefului Statului Major (General / al Apărării)<\/strong>; ceilalți: prin ordinul <strong>comandanților desemnați<\/strong>.<\/li>\n<li><strong>Revenirea:<\/strong><\/li>\n<li><strong>achitare<\/strong> → îți <strong>recapeți gradul<\/strong>; perioada contează la vechime; poți cere despăgubiri;<\/li>\n<li><strong>amnistie, grațiere, reabilitare<\/strong> → poți primi <strong>orice grad, până la cel avut<\/strong>; <strong>nu<\/strong> ești rechemat automat în activitate;<\/li>\n<li><strong>cetățenia recăpătată<\/strong> → poți fi reluat în evidență la <strong>repatriere<\/strong>.<\/li>\n<\/ul>"}], "flash": [["Cele 3 corpuri ale cadrelor militare?", "<b>Ofițeri, maiștri militari, subofițeri<\/b>."], ["Primul grad de subofițer?", "<b>Sergent<\/b>."], ["Gradele de subofițer, în ordine?", "<b>Sergent, sergent-major, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal<\/b>."], ["Cel mai înalt grad de subofițer?", "<b>Plutonier adjutant principal<\/b>."], ["Maior / colonel în aviație și marină?", "<b>Locotenent-comandor<\/b> / <b>comandor<\/b>."], ["General-maior are câte stele?", "<b>Două<\/b>."], ["Mareșal – cine, când, cui?", "<b>Președintele<\/b>, <b>numai în război<\/b>, generalilor cu <b>4 stele<\/b>."], ["Cele 3 situații ale cadrelor?", "<b>Activitate, rezervă, retragere<\/b>."], ["Cadrul militar în captivitate e…?", "Tot <b>în activitate<\/b>."], ["Condiția pentru activitate?", "<b>Cetățenie română și domiciliu în țară<\/b>."], ["Ordinul contrar legii?", "<b>Nu se execută<\/b>; refuzul nu atrage răspundere."], ["Ordinele se execută…?", "<b>Întocmai și la timp<\/b>."], ["Concediu fără plată pentru a-ți urma soțul în străinătate?", "<b>Până la 4 ani<\/b>."], ["Concediu fără plată pentru alte motive?", "<b>Până la 1 an<\/b>."], ["Concediu de formare profesională?", "<b>Până la 15 zile lucrătoare/an<\/b>."], ["Compensația pentru chirie?", "<b>Până la 50%<\/b> din soldă."], ["Ajutorul la deces?", "<b>2 solde lunare<\/b>."], ["Uniforma în rezervă – după câți ani?", "<b>20 de ani<\/b> + distincții."], ["Permisiile se scad din concediu?", "<b>Nu<\/b>."], ["Ce e interzis prin art. 28?", "<b>Partid, candidatură, grevă<\/b>."], ["Pot cadrele candida la Președinție?", "<b>Nu.<\/b>"], ["Opinii politice în public?", "<b>Nu<\/b> sunt permise."], ["Sindicat?", "<b>Nu<\/b>; alte asociații da."], ["Pe ce se bazează disciplina militară?", "<b>Acceptarea conștientă<\/b>, <b>recompense<\/b>, <b>sancțiuni<\/b>."], ["Cui aparține prerogativa disciplinară?", "<b>Comandantului/șefului<\/b>."], ["Abaterea disciplinară – condiția?", "Să <b>nu fie infracțiune<\/b>."], ["Sancțiunile cadrelor, în ordine?", "Avertisment, mustrare scrisă, diminuare soldă funcție, diminuare soldă comandă, amânare înaintare 1–2 ani, retrogradare în funcție, <b>trecere în rezervă<\/b>."], ["Câte sancțiuni pentru o abatere?", "<b>Una singură<\/b>."], ["Termenele de aplicare a sancțiunii?", "<b>6 luni<\/b> de la constatare, max <b>2 ani<\/b> de la faptă."], ["Degradarea militară o dă…?", "<b>Instanța<\/b>, ca pedeapsă complementară."], ["După amnistie, ce grad poți primi?", "<b>Orice grad, până la cel avut<\/b>."]], "q": [{"id": "L04-002", "p": 1, "q": "Cadrele militare sunt grupate în următoarele corpuri:", "o": ["generali, ofițeri și subofițeri", "ofițeri, subofițeri și soldați profesioniști", "ofițeri, subofițeri și personal civil", "ofițeri, maiștri militari și subofițeri"], "a": 3, "e": "Art. 2 alin. (1)."}, {"id": "L04-003", "p": 1, "q": "În MApN, primul grad din corpul subofițerilor este:", "o": ["sergent", "caporal", "fruntaș", "plutonier"], "a": 0, "e": "Art. 2 alin. (2¹) lit. A."}, {"id": "L04-004", "p": 1, "q": "Care este ordinea crescătoare corectă a gradelor de subofițer în MApN?", "o": ["sergent, sergent-major, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal", "caporal, sergent, plutonier, plutonier-major, plutonier adjutant, plutonier adjutant principal", "sergent, plutonier, sergent-major, plutonier-major, plutonier adjutant, plutonier adjutant principal", "sergent, sergent-major, plutonier-major, plutonier, plutonier adjutant principal, plutonier adjutant"], "a": 0, "e": "Art. 2 alin. (2¹)."}, {"id": "L04-005", "p": 1, "q": "Cel mai înalt grad din corpul subofițerilor în MApN este:", "o": ["plutonier adjutant principal", "plutonier-major", "maistru militar principal", "plutonier adjutant"], "a": 0, "e": "Art. 2."}, {"id": "L04-011", "p": 1, "q": "Gradul de mareșal se poate acorda:", "o": ["în timp de război, pentru merite militare excepționale, de Președintele României, generalilor sau amiralilor cu 4 stele", "la ieșirea la pensie, generalilor cu peste 30 de ani vechime", "în timp de pace, de ministrul apărării, oricărui general", "de Parlament, la propunerea CSAT, în timp de pace"], "a": 0, "e": "Art. 2 alin. (3)."}, {"id": "L04-013", "p": 1, "q": "Situațiile în care se pot afla cadrele militare sunt:", "o": ["în activitate, în rezervă sau în retragere", "în activitate, în concediu sau în misiune", "în serviciu, în afara serviciului sau în retragere", "activ, pasiv sau mobilizat"], "a": 0, "e": "Art. 4."}, {"id": "L04-015" suspendate din funcție", "urmează un curs de carieră", "sunt în concediu fără plată"], "a": 0, "e": "Art. 4 lit. c)."}, {"id": "L04-017", "p": 3, "q": "Ghidul carierei militare pentru MApN se aprobă prin:", "o": ["lege organică", "decret prezidențial", "ordin al ministrului apărării", "hotărâre a Guvernului"], "a": 3, "e": "Art. 5."}, {"id": "L04-024", "p": 3, "q": "Care dintre următoarele situații permite, la cerere, exceptarea de la participarea la misiuni în afara țării?", "o": ["cadrul militar are peste 40 de ani", "cadrul militar urmează un curs de limbă străină", "cadrul militar formează o familie monoparentală", "cadrul militar a mai participat la o misiune"], "a": 2, "e": "Art. 8 alin. (3)."}, {"id": "L04-027", "p": 3, "q": "Pe durata concediului fără plată, cadrul militar:", "o": ["își păstrează toate drepturile bănești", "primește 50% din soldă", "este suspendat din funcție și nu beneficiază de drepturi din partea MApN, cu excepția folosirii locuinței de serviciu", "trece automat în rezervă"], "a": 2, "e": "Art. 14¹ alin. (5)."}, {"id": "L04-029", "p": 3, "q": "Cadrele militare care urmează cursurile de zi ale unei instituții de învățământ superior beneficiază:", "o": ["de concediu fără plată", "de concediu de odihnă dublu", "numai de permisii", "de vacanțe, în locul concediilor de odihnă"], "a": 3, "e": "Art. 16."}, {"id": "L04-033", "p": 3, "q": "Compensația lunară pentru chirie poate fi de până la:", "o": ["25% din solda lunară", "100% din solda lunară", "10% din solda lunară", "50% din solda lunară"], "a": 3, "e": "Art. 20¹ alin. (1)."}, {"id": "L04-034", "p": 3, "q": "Soțul/soția cadrului militar mutat în interesul serviciului, care și-a întrerupt activitatea din cauza mutării, primește o indemnizație lunară de 50% din solda cadrului militar, până la reîncadrare, dar cel mult:", "o": ["9 luni", "12 luni", "6 luni", "3 luni"], "a": 0, "e": "Art. 20¹ alin. (4)."}, {"id": "L04-035", "p": 3, "q": "La decesul unui cadru militar în activitate, familia primește un ajutor egal cu:", "o": ["o soldă lunară", "două solde lunare", "șase solde lunare", "trei solde lunare"], "a": 1, "e": "Art. 23."}, {"id": "L04-036", "p": 3, "q": "Dreptul de a purta uniforma militară după trecerea în rezervă sau retragere se poate acorda cadrelor cu cel puțin:", "o": ["20 de ani de serviciu militar și distincții în activitate, sau celor care au adus servicii deosebite", "25 de ani de serviciu, exclusiv ofițerilor", "15 ani de serviciu, indiferent de distincții", "10 ani de serviciu militar"], "a": 0, "e": "Art. 27."}, {"id": "L04-043", "p": 3, "q": "Deplasarea cadrelor militare în străinătate se face:", "o": ["în condițiile stabilite prin ordin al ministrului apărării", "liber, fără nicio restricție", "numai cu aprobarea Parlamentului", "numai în misiune"], "a": 0, "e": "Art. 29 lit. h)."}, {"id": "L04-044", "p": 3, "q": "Pe timpul stării de urgență, asediu, mobilizare și război, pentru cadrele militare:", "o": ["se suspendă primirea în audiență și soluționarea petițiilor", "se suspendă jurământul militar", "se acordă concediu suplimentar", "se dublează solda"], "a": 0, "e": "Art. 29 lit. i)."}, {"id": "L04-046", "p": 3, "q": "Cadrele în rezervă concentrate sau mobilizate:", "o": ["pot desfășura activitate politică în unitate", "trebuie să demisioneze din partide", "pierd dreptul de vot", "pot rămâne membre ale partidelor și sindicatelor, dar nu pot desfășura activități politice sau sindicale în unități"], "a": 3, "e": "Art. 31."}, {"id": "L04-058", "p": 3, "q": "Scoaterea din evidența militară a generalilor se face prin:", "o": ["ordin al șefului Statului Major General (în prezent Statul Major al Apărării)", "ordin al comandantului centrului militar județean", "hotărâre a Guvernului", "decret al Președintelui"], "a": 0, "e": "Art. 71 lit. a)."}, {"id": "L04-059", "p": 3, "q": "Cei degradați care au beneficiat de amnistie, grațiere sau reabilitare sunt reluați în evidența militară și li se poate acorda:", "o": ["numai gradul avut anterior, obligatoriu", "orice grad militar, până la cel avut anterior, inclusiv", "numai gradul de soldat", "un grad superior celui avut anterior"], "a": 1, "e": "Art. 72 alin. (2)."}, {"id": "L04-060", "p": 3, "q": "Restituirea gradului în urma amnistiei, grațierii sau reabilitării:", "o": ["implică automat rechemarea în activitate", "nu implică de drept rechemarea în activitate", "se face numai prin hotărâre a Guvernului", "implică plata soldei pe perioada degradării"], "a": 1, "e": "Art. 72 alin. (5)."}, {"id": "L04-061", "p": 3, "q": "Dacă printr-o nouă hotărâre judecătorească se dispune achitarea sau se înlătură pedeapsa degradării militare:", "o": ["sunt reluați în evidență numai după 5 ani", "cei în cauză sunt reluați în evidență cu gradul avut, iar perioada se ia în calcul la stagiul în grad", "sunt reluați în evidență cu gradul de soldat", "nu mai pot fi reluați în evidență"], "a": 1, "e": "Art. 72 alin. (1)."}]}, {"nr": 10, "id": "multiplexare", "t": "Trunchiuri și multiplexare", "tema": "Trunchiuri, multiplexare și comutație", "parte": "S", "stele": 2, "itemi": "1–2", "timp": "50 min", "sursa": "A. S. Tanenbaum, Rețele de calculatoare, ed. a III-a, 1998, pag. 108–114 și 120–128 (sistemul telefonic: trunchiuri și multiplexare, comutație)", "ps": "<p>Cum trimiți <strong>multe convorbiri pe același fir<\/strong>. Înveți <strong>bucla locală<\/strong> și <strong>trunchiul<\/strong>, cele trei feluri de multiplexare (<strong>FDM, WDM, TDM<\/strong>), cifrele lui <strong>T1 și E1<\/strong> și cum arată un <strong>comutator<\/strong> în centrală. Pică mai ales <strong>cifrele<\/strong>: <strong>2,048 Mbit/s<\/strong>, <strong>64 kbit/s<\/strong>, <strong>125 µs<\/strong>, <strong>n²<\/strong>.<\/p>", "fise": [{"t": "Bucla locală, trunchiul și centrala", "h": "<p>Rețeaua telefonică are <strong>3 piese<\/strong>:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Piesa<\/th>\n<th>Ce este<\/th>\n<th>Cum arată<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Bucla locală<\/strong> (<em>local loop<\/em>)<\/td>\n<td>legătura <strong>abonat – centrala locală<\/strong><\/td>\n<td><strong>o pereche de fire torsadate<\/strong>, semnal <strong>analogic<\/strong>, <strong>câte una pe abonat<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Trunchiul<\/strong> (<em>trunk<\/em>)<\/td>\n<td>legătura <strong>centrală – centrală<\/strong><\/td>\n<td><strong>digital<\/strong>, <strong>multiplexat<\/strong>: <strong>foarte multe convorbiri simultan<\/strong> (fibră, coaxial, radioreleu)<\/td>\n<\/tr>\n<tr>\n<td><strong>Centrala<\/strong> (oficiul de comutație)<\/td>\n<td>face <strong>comutația<\/strong><\/td>\n<td>leagă intrarea potrivită de ieșirea potrivită<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Bucla locală<\/strong> e <strong>aleea<\/strong> de la casa ta până la drumul principal: e doar a ta. <strong>Trunchiul<\/strong> e <strong>autostrada<\/strong> dintre orașe: pe ea merg mii de mașini deodată. <strong>Centrala<\/strong> e <strong>nodul rutier<\/strong> care trimite fiecare mașină pe drumul ei.<\/p><\/aside><aside class=\"co co-info\"><div class=\"co-h\">Bine de știut<\/div><p>În armată e la fel: un <strong>trunchi<\/strong> între două noduri de comunicații (de exemplu o legătură radioreleu) poartă <strong>multe canale<\/strong> de voce și date multiplexate.<\/p><\/aside>"}, {"t": "Ce înseamnă multiplexare", "h": "<p><strong>Multiplexare<\/strong> = <strong>mai multe semnale pe același mediu<\/strong> (fir, fibră, radioreleu).<\/p>\n<p><strong>De ce?<\/strong> Un mediu are capacitate <strong>mult mai mare<\/strong> decât un singur canal de voce. E <strong>mai ieftin<\/strong> să pui multe canale pe același mediu decât să tragi câte un fir pentru fiecare.<\/p>\n<ul>\n<li><strong>MUX (multiplexorul)<\/strong> = <strong>combină<\/strong> mai multe canale într-unul.<\/li>\n<li><strong>DEMUX (demultiplexorul)<\/strong> = le <strong>separă<\/strong> la celălalt capăt.<\/li>\n<\/ul>\n<p>Sunt <strong>3 feluri<\/strong>:<\/p>\n<ul>\n<li><strong>FDM<\/strong> – împarte <strong>frecvența<\/strong>;<\/li>\n<li><strong>WDM<\/strong> – împarte <strong>lungimea de undă<\/strong> (culoarea luminii), pe <strong>fibră<\/strong>;<\/li>\n<li><strong>TDM<\/strong> – împarte <strong>timpul<\/strong>.<\/li>\n<\/ul>"}, {"t": "FDM – fiecare cu frecvența lui", "h": "<p><strong>FDM<\/strong> (<em>Frequency Division Multiplexing<\/em>) = banda totală se <strong>împarte în subbenzi<\/strong>. Fiecare canal ocupă <strong>permanent<\/strong> subbanda lui.<\/p>\n<ul>\n<li>Între canale se lasă <strong>benzi de gardă<\/strong>, ca să nu se încurce între ele.<\/li>\n<li>Un canal telefonic primește <strong>4 kHz<\/strong> (3,1 kHz voce + benzi de gardă).<\/li>\n<li>Se potrivește semnalelor <strong>analogice<\/strong>.<\/li>\n<\/ul>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 320\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"FDM împarte frecvența în subbenzi, TDM împarte timpul în sloturi\">\n  <text x=\"200\" y=\"18\" text-anchor=\"middle\" class=\"t-b\">FDM · frecvența se împarte<\/text>\n  <g stroke-width=\"1.5\">\n    <rect x=\"70\" y=\"30\" width=\"310\" height=\"28\" rx=\"6\" class=\"f-acs s-acc\"/>\n    <rect x=\"70\" y=\"62\" width=\"310\" height=\"28\" rx=\"6\" class=\"f-ams s-amb\"/>\n    <rect x=\"70\" y=\"94\" width=\"310\" height=\"28\" rx=\"6\" class=\"f-bls s-blu\"/>\n    <rect x=\"70\" y=\"126\" width=\"310\" height=\"28\" rx=\"6\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-b\" text-anchor=\"middle\"><text x=\"225\" y=\"49\">canal 1<\/text><text x=\"225\" y=\"81\">canal 2<\/text><text x=\"225\" y=\"113\">canal 3<\/text><text x=\"225\" y=\"145\">canal 4<\/text><\/g>\n  <text x=\"4\" y=\"96\" style=\"font-size:12px\" class=\"t-mut\">frecvență<\/text>\n  <text x=\"4\" y=\"112\" style=\"font-size:12px\" class=\"t-mut\">↑<\/text>\n  <text x=\"380\" y=\"172\" text-anchor=\"end\" style=\"font-size:12px\" class=\"t-mut\">timp → (fiecare canal, tot timpul)<\/text>\n  <line x1=\"10\" y1=\"184\" x2=\"390\" y2=\"184\" class=\"s-line\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"208\" text-anchor=\"middle\" class=\"t-b\">TDM · timpul se împarte<\/text>\n  <g stroke-width=\"1.5\">\n    <rect x=\"20\" y=\"220\" width=\"45\" height=\"40\" class=\"f-acs s-acc\"/><rect x=\"65\" y=\"220\" width=\"45\" height=\"40\" class=\"f-ams s-amb\"/>\n    <rect x=\"110\" y=\"220\" width=\"45\" height=\"40\" class=\"f-bls s-blu\"/><rect x=\"155\" y=\"220\" width=\"45\" height=\"40\" class=\"f-res s-red\"/>\n    <rect x=\"200\" y=\"220\" width=\"45\" height=\"40\" class=\"f-acs s-acc\"/><rect x=\"245\" y=\"220\" width=\"45\" height=\"40\" class=\"f-ams s-amb\"/>\n    <rect x=\"290\" y=\"220\" width=\"45\" height=\"40\" class=\"f-bls s-blu\"/><rect x=\"335\" y=\"220\" width=\"45\" height=\"40\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-b\" text-anchor=\"middle\"><text x=\"42\" y=\"245\">1<\/text><text x=\"87\" y=\"245\">2<\/text><text x=\"132\" y=\"245\">3<\/text><text x=\"177\" y=\"245\">4<\/text><text x=\"222\" y=\"245\">1<\/text><text x=\"267\" y=\"245\">2<\/text><text x=\"312\" y=\"245\">3<\/text><text x=\"357\" y=\"245\">4<\/text><\/g>\n  <path d=\"M20 270 H200\" class=\"s-mut\" stroke-width=\"1.5\" fill=\"none\"/><path d=\"M200 270 H380\" class=\"s-mut\" stroke-width=\"1.5\" fill=\"none\"/>\n  <text x=\"110\" y=\"288\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-mut\">un cadru (125 µs)<\/text>\n  <text x=\"290\" y=\"288\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-mut\">următorul cadru<\/text>\n  <text x=\"200\" y=\"310\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-mut\">fiecare canal: toată banda, dar doar o felie de timp<\/text>\n<\/svg><figcaption>Sus, FDM: fiecare canal are bucata lui de frecvență, tot timpul. Jos, TDM: fiecare canal are toată banda, dar doar câte o felie de timp, pe rând.<\/figcaption><\/figure>\n\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Posturile de radio FM<\/strong>: fiecare emite <strong>pe frecvența lui<\/strong>, toate în același timp, și tu alegi una din ele.<\/p><\/aside>"}, {"t": "Ierarhia FDM: grup, supergrup, mastergrup", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nivel<\/th>\n<th>Ce conține<\/th>\n<th>Câte canale<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Grup<\/strong><\/td>\n<td>12 canale × 4 kHz = <strong>48 kHz<\/strong> (banda <strong>60–108 kHz<\/strong>)<\/td>\n<td><strong>12<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Supergrup<\/strong><\/td>\n<td><strong>5 grupuri<\/strong><\/td>\n<td><strong>60<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Grup master<\/strong> (mastergrup)<\/td>\n<td><strong>5 supergrupuri<\/strong><\/td>\n<td><strong>300<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>ℹ️ Standardul Bell folosește 10 supergrupuri = 600 de canale. Standardul CCITT/ITU: 5 supergrupuri = <strong>300<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>12 → ×5 → ×5<\/strong>: <strong>12<\/strong>, <strong>60<\/strong>, <strong>300<\/strong>. Un grup are <strong>12<\/strong> canale, ca <strong>lunile anului<\/strong>.<\/p><\/aside>"}, {"t": "WDM – FDM pe fibră optică", "h": "<p><strong>WDM<\/strong> (<em>Wavelength Division Multiplexing<\/em>) = <strong>FDM pe fibră optică<\/strong>.<\/p>\n<ul>\n<li>Fiecare canal folosește o <strong>lungime de undă diferită<\/strong> a luminii (altă „culoare”).<\/li>\n<li>Culorile se combină și se separă cu o <strong>prismă / rețea de difracție<\/strong>.<\/li>\n<li>Componentele sunt <strong>pasive<\/strong>, deci foarte fiabile.<\/li>\n<li>Permite <strong>capacități uriașe<\/strong> pe o singură fibră.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca <strong>lumina albă printr-o prismă<\/strong>: se desface în culori. La WDM fiecare culoare duce alt canal, pe aceeași fibră.<\/p><\/aside>"}, {"t": "TDM – fiecare la rândul lui", "h": "<p><strong>TDM<\/strong> (<em>Time Division Multiplexing<\/em>) = fiecare canal folosește <strong>toată banda<\/strong>, dar <strong>doar o felie scurtă de timp (slot)<\/strong>, <strong>pe rând<\/strong> (<em>round-robin<\/em>).<\/p>\n<ul>\n<li>Se potrivește perfect semnalelor <strong>digitale<\/strong>.<\/li>\n<li>Datele sunt organizate în <strong>cadre<\/strong>. Un cadru are <strong>câte un slot pentru fiecare canal<\/strong>.<\/li>\n<li>Cadrul se repetă de <strong>8000 de ori pe secundă<\/strong>, adică la fiecare <strong>125 µs<\/strong> (cât e eșantionarea vocii, vezi capitolul despre voce digitală).<\/li>\n<\/ul>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Durata cadrului: <strong>1 / 8000 s = 125 µs<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la <strong>frizer<\/strong> cu un singur scaun: fiecare client stă pe scaun <strong>câte puțin<\/strong>, pe rând, și apoi se reia runda.<\/p><\/aside>"}, {"t": "FDM sau TDM – comparația", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>FDM<\/strong><\/th>\n<th><strong>TDM<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ce se împarte<\/td>\n<td><strong>frecvența<\/strong> (banda)<\/td>\n<td><strong>timpul<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Fiecare canal are<\/td>\n<td>o <strong>subbandă<\/strong>, <strong>tot timpul<\/strong><\/td>\n<td><strong>toată banda<\/strong>, <strong>o felie de timp<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Cum se separă canalele<\/td>\n<td><strong>benzi de gardă<\/strong><\/td>\n<td><strong>sincronizare<\/strong> (bit/cuvânt de încadrare)<\/td>\n<\/tr>\n<tr>\n<td>Potrivit pentru<\/td>\n<td>semnale <strong>analogice<\/strong><\/td>\n<td>semnale <strong>digitale<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>F<\/strong>DM = <strong>F<\/strong>recvență. <strong>T<\/strong>DM = <strong>T<\/strong>imp. <strong>W<\/strong>DM = <strong>W<\/strong>ave (undă de lumină).<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: „benzi de gardă” merg cu <strong>FDM<\/strong>, nu cu TDM. TDM se ține în ordine prin <strong>sincronizare<\/strong>.<\/p><\/aside>"}, {"t": "T1 și E1 – purtătoarele digitale ⚠️", "h": "<p>Aici sunt <strong>calculele care pică<\/strong>.<\/p>\n<p><strong>E1 (Europa, inclusiv România):<\/strong><\/p>\n<ul>\n<li><strong>32 de sloturi<\/strong> × <strong>8 biți<\/strong> = <strong>256 de biți / cadru<\/strong>;<\/li>\n<li>256 × 8000 = <strong>2.048.000 bit/s = 2,048 Mbit/s<\/strong>;<\/li>\n<li>din cele 32 de sloturi: <strong>30 pentru voce/date<\/strong>, <strong>1 pentru sincronizare (încadrare)<\/strong>, <strong>1 pentru semnalizare<\/strong>.<\/li>\n<\/ul>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cadrul E1 cu 32 de sloturi\">\n  <text x=\"200\" y=\"18\" text-anchor=\"middle\" class=\"t-b\">Cadrul E1 · 32 de sloturi × 8 biți<\/text>\n  <g stroke-width=\"1\" class=\"s-ink\">\n    <rect x=\"24\" y=\"30\" width=\"22\" height=\"30\" class=\"f-ams\"/>\n    <rect x=\"46\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"68\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"90\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"112\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"134\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"156\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"178\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"200\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"222\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"244\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"266\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"288\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"310\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"332\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"354\" y=\"30\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"24\" y=\"68\" width=\"22\" height=\"30\" class=\"f-res\"/>\n    <rect x=\"46\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"68\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"90\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"112\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"134\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"156\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"178\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"200\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"222\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"244\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"266\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"288\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n    <rect x=\"310\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"332\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/><rect x=\"354\" y=\"68\" width=\"22\" height=\"30\" class=\"f-acs\"/>\n  <\/g>\n  <g text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-b\">\n    <text x=\"35\" y=\"50\">0<\/text><text x=\"57\" y=\"50\">1<\/text><text x=\"79\" y=\"50\">2<\/text><text x=\"101\" y=\"50\">3<\/text><text x=\"123\" y=\"50\">4<\/text><text x=\"145\" y=\"50\">5<\/text><text x=\"167\" y=\"50\">6<\/text><text x=\"189\" y=\"50\">7<\/text>\n    <text x=\"211\" y=\"50\">8<\/text><text x=\"233\" y=\"50\">9<\/text><text x=\"255\" y=\"50\">10<\/text><text x=\"277\" y=\"50\">11<\/text><text x=\"299\" y=\"50\">12<\/text><text x=\"321\" y=\"50\">13<\/text><text x=\"343\" y=\"50\">14<\/text><text x=\"365\" y=\"50\">15<\/text>\n    <text x=\"35\" y=\"88\">16<\/text><text x=\"57\" y=\"88\">17<\/text><text x=\"79\" y=\"88\">18<\/text><text x=\"101\" y=\"88\">19<\/text><text x=\"123\" y=\"88\">20<\/text><text x=\"145\" y=\"88\">21<\/text><text x=\"167\" y=\"88\">22<\/text><text x=\"189\" y=\"88\">23<\/text>\n    <text x=\"211\" y=\"88\">24<\/text><text x=\"233\" y=\"88\">25<\/text><text x=\"255\" y=\"88\">26<\/text><text x=\"277\" y=\"88\">27<\/text><text x=\"299\" y=\"88\">28<\/text><text x=\"321\" y=\"88\">29<\/text><text x=\"343\" y=\"88\">30<\/text><text x=\"365\" y=\"88\">31<\/text>\n  <\/g>\n  <g stroke-width=\"1\" class=\"s-ink\"><rect x=\"24\" y=\"118\" width=\"16\" height=\"16\" class=\"f-ams\"/><rect x=\"24\" y=\"142\" width=\"16\" height=\"16\" class=\"f-res\"/><rect x=\"24\" y=\"166\" width=\"16\" height=\"16\" class=\"f-acs\"/><\/g>\n  <g style=\"font-size:13px\"><text x=\"50\" y=\"131\">slot 0 = sincronizare (încadrare)<\/text><text x=\"50\" y=\"155\">slot 16 = semnalizare<\/text><text x=\"50\" y=\"179\">celelalte 30 = voce sau date (64 kbit/s)<\/text><\/g>\n  <text x=\"200\" y=\"214\" text-anchor=\"middle\" class=\"t-b t-amb\">32 × 8 × 8000 = 2.048.000 bit/s = 2,048 Mbit/s<\/text>\n<\/svg><figcaption>Cadrul E1: 32 de sloturi a câte 8 biți, repetat de 8000 de ori pe secundă. 30 de sloturi duc voce sau date, 1 duce sincronizarea, 1 duce semnalizarea.<\/figcaption><\/figure>\n\n<p><strong>T1 (America de Nord, Japonia):<\/strong><\/p>\n<ul>\n<li><strong>24 de canale<\/strong> × <strong>8 biți<\/strong> = 192 de biți + <strong>1 bit de încadrare<\/strong> = <strong>193 de biți / cadru<\/strong>;<\/li>\n<li>193 × 8000 = <strong>1,544 Mbit/s<\/strong>.<\/li>\n<\/ul>\n<p><strong>Un slot = un canal telefonic digital (DS0):<\/strong> 8 biți × 8000 = <strong>64 kbit/s<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Sistem<\/th>\n<th>Canale de voce<\/th>\n<th>Biți/cadru<\/th>\n<th>Debit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>T1<\/strong><\/td>\n<td><strong>24<\/strong><\/td>\n<td><strong>193<\/strong><\/td>\n<td><strong>1,544 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>E1<\/strong><\/td>\n<td><strong>30<\/strong> (+2 de serviciu)<\/td>\n<td><strong>256<\/strong><\/td>\n<td><strong>2,048 Mbit/s<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>E1:<\/strong> 32 × 8 × 8000 = <strong>2.048.000 bit/s = 2,048 Mbit/s<\/strong>.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: E1 are <strong>32 de sloturi<\/strong>, dar doar <strong>30 de canale de voce<\/strong>. Citește atent dacă întrebarea cere sloturi sau canale.<\/p><\/aside>"}, {"t": "PDH – ierarhia „aproape sincronă”", "h": "<p><strong>PDH<\/strong> (ierarhia digitală <strong>plesiocronă<\/strong>) = nivelurile se multiplexează cu ceasuri <strong>aproape<\/strong> sincrone. Diferențele se acoperă cu <strong>biți de justificare<\/strong>.<\/p>\n<p>Fiecare nivel ≈ <strong>4 × nivelul anterior<\/strong> (+ biți de justificare):<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nivel<\/th>\n<th>Debit<\/th>\n<th>Canale de 64 kbit/s<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>E1<\/strong><\/td>\n<td><strong>2,048<\/strong> Mbit/s<\/td>\n<td>30<\/td>\n<\/tr>\n<tr>\n<td><strong>E2<\/strong><\/td>\n<td><strong>8,448<\/strong> Mbit/s<\/td>\n<td>120<\/td>\n<\/tr>\n<tr>\n<td><strong>E3<\/strong><\/td>\n<td><strong>34,368<\/strong> Mbit/s<\/td>\n<td>480<\/td>\n<\/tr>\n<tr>\n<td><strong>E4<\/strong><\/td>\n<td><strong>139,264<\/strong> Mbit/s<\/td>\n<td>1920<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Plesio-<\/strong> = „aproape”. <strong>Plesiocron<\/strong> = <strong>aproape sincron<\/strong> → de aceea are nevoie de biți de justificare.<\/p><\/aside>"}, {"t": "SDH – ierarhia sincronă", "h": "<p><strong>SDH<\/strong> (ierarhia digitală <strong>sincronă<\/strong>; în America: <strong>SONET<\/strong>) = toate echipamentele au <strong>același ceas<\/strong>. Asta face mai ușoară extragerea unui singur canal.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>SDH<\/th>\n<th>SONET<\/th>\n<th>Debit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>—<\/td>\n<td>STS-1 / OC-1<\/td>\n<td>51,84 Mbit/s<\/td>\n<\/tr>\n<tr>\n<td><strong>STM-1<\/strong><\/td>\n<td>STS-3 / OC-3<\/td>\n<td><strong>155,52 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>STM-4<\/strong><\/td>\n<td>OC-12<\/td>\n<td><strong>622,08 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>STM-16<\/strong><\/td>\n<td>OC-48<\/td>\n<td><strong>2488,32 Mbit/s<\/strong> (≈ 2,5 Gbit/s)<\/td>\n<\/tr>\n<tr>\n<td><strong>STM-64<\/strong><\/td>\n<td>OC-192<\/td>\n<td>≈ <strong>10 Gbit/s<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Fiecare nivel este <strong>exact × 4<\/strong> față de cel anterior.<\/li>\n<li>Cadrul SDH durează tot <strong>125 µs<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Câte canale de 64 kbit/s încap teoretic în STM-1, fără biții de serviciu? 155.520 / 64 = <strong>2430<\/strong>. Practic, STM-1 transportă <strong>63 de fluxuri E1<\/strong> = <strong>1890<\/strong> de canale de voce.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>155 → 622 → 2488 → ~10 000<\/strong>: de fiecare dată <strong>× 4<\/strong>.<\/p><\/aside>"}, {"t": "Comutatorul spațial: crossbar", "h": "<p><strong>Comutația spațială<\/strong> = se face o <strong>cale fizică<\/strong> prin comutator, de la o intrare la o ieșire.<\/p>\n<p><strong>Crossbar<\/strong> (matrice de puncte de comutație): <strong>n intrări × n ieșiri<\/strong>, cu câte un punct de cruce la fiecare intersecție → <strong>n² puncte<\/strong>.<\/p>\n<ul>\n<li>✅ Avantaj: <strong>fără blocare<\/strong>. Orice intrare se poate lega de orice ieșire liberă.<\/li>\n<li>❌ Dezavantaj: <strong>n² crește foarte repede<\/strong>. 1000 de linii = <strong>1.000.000<\/strong> de puncte, majoritatea nefolosite.<\/li>\n<li><strong>Comutatoarele în mai multe etaje<\/strong> (multi-stage) folosesc mai puține puncte, dar pot avea <strong>blocare<\/strong>: nu găsești cale liberă deși ieșirea e liberă.<\/li>\n<\/ul>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Crossbar <strong>100 × 100<\/strong> → 100 × 100 = <strong>10.000<\/strong> de puncte.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Crossbar-ul e ca o <strong>tablă de șah<\/strong> în care fiecare pătrățel e un întrerupător: rândul = cine sună, coloana = cine e sunat.<\/p><\/aside>"}, {"t": "Comutatorul temporal: TSI", "h": "<p><strong>Comutația temporală<\/strong> lucrează pe semnale <strong>TDM<\/strong>. Ea <strong>schimbă ordinea sloturilor<\/strong> în cadru.<\/p>\n<ul>\n<li>Dispozitivul se numește <strong>TSI<\/strong> (<em>Time Slot Interchanger<\/em> – <strong>interschimbătorul de intervale de timp<\/strong>).<\/li>\n<li>Cum lucrează: sloturile cadrului de intrare se <strong>scriu într-o memorie (RAM)<\/strong> și se <strong>citesc în altă ordine<\/strong>, după o <strong>tabelă<\/strong>. Slotul canalului A ajunge pe poziția canalului B.<\/li>\n<li>Limitare: <strong>viteza memoriei<\/strong>.<\/li>\n<li>Centralele digitale moderne combină <strong>temporal + spațial<\/strong> (structuri <strong>T-S-T<\/strong>).<\/li>\n<\/ul>\n<p><strong>Ierarhia centralelor:<\/strong><\/p>\n<ul>\n<li><strong>centrala locală<\/strong> (<em>end office<\/em>) – aici sunt legați abonații;<\/li>\n<li><strong>centrala de tranzit / interurbană<\/strong> (<em>toll office<\/em>) – leagă centralele între ele prin <strong>trunchiuri<\/strong>;<\/li>\n<li>dacă trunchiul direct e ocupat, apelul poate fi <strong>rutat pe o cale alternativă<\/strong>, prin centrale de nivel superior.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>TSI-ul e ca un <strong>dirigent care reașază elevii în bănci<\/strong>: îi notează pe toți într-un catalog (memoria), apoi îi strigă în altă ordine.<\/p><\/aside>"}], "flash": [["Legătura abonat – centrala locală?", "<b>Bucla locală<\/b> (pereche de fire torsadate, analogică)."], ["Legătura centrală – centrală?", "<b>Trunchiul<\/b> (digital, multiplexat)."], ["Din ce e făcută clasic bucla locală?", "<b>Pereche de fire torsadate<\/b>."], ["Ce e multiplexarea?", "<b>Mai multe semnale pe același mediu<\/b>."], ["MUX / DEMUX?", "MUX <b>combină<\/b> canalele; DEMUX le <b>separă<\/b>."], ["FDM împarte…?", "<b>Frecvența<\/b> (banda) în subbenzi."], ["TDM împarte…?", "<b>Timpul<\/b> în sloturi, pe rând."], ["Ce se lasă între canalele FDM?", "<b>Benzi de gardă<\/b>."], ["WDM = ?", "<b>FDM pe fibră optică<\/b> (lungimi de undă diferite)."], ["Banda unui canal telefonic în FDM?", "<b>4 kHz<\/b>."], ["Grup FDM?", "<b>12 canale<\/b>, 48 kHz (60–108 kHz)."], ["Supergrup FDM?", "<b>5 grupuri = 60 de canale<\/b>."], ["Grup master (CCITT)?", "<b>5 supergrupuri = 300 de canale<\/b>."], ["FDM se potrivește semnalelor…? TDM?", "FDM – <b>analogice<\/b>; TDM – <b>digitale<\/b>."], ["T1 – câte canale?", "<b>24 de canale<\/b>."], ["Câți biți are un cadru T1?", "<b>193<\/b> (24 × 8 + 1 bit de încadrare)."], ["Debitul T1?", "<b>1,544 Mbit/s<\/b>."], ["Debitul E1?", "<b>2,048 Mbit/s<\/b>."], ["Un cadru E1 conține…?", "<b>32 de sloturi × 8 biți<\/b>: 30 voce, 1 sincronizare, 1 semnalizare."], ["Debitul unui canal telefonic digital?", "<b>64 kbit/s<\/b> (8 biți × 8000)."], ["Durata unui cadru TDM pentru voce?", "<b>125 µs<\/b> (1/8000 s)."], ["Ce e PDH?", "Ierarhia <b>plesiocronă<\/b> (aproape sincronă), cu <b>biți de justificare<\/b>."], ["E3 – ce debit are?", "≈ <b>34 Mbit/s<\/b> (34,368)."], ["STM-1?", "<b>155,52 Mbit/s<\/b>."], ["STM-4?", "<b>622,08 Mbit/s<\/b>."], ["Factorul între niveluri SDH?", "<b>× 4<\/b>."], ["Crossbar n × n – câte puncte?", "<b>n²<\/b>."], ["Crossbar 100 × 100?", "<b>10.000<\/b> de puncte."], ["Avantajul crossbar? Dezavantajul?", "<b>Fără blocare<\/b>; dar <b>n² crește foarte repede<\/b>."], ["Comutatorul în mai multe etaje poate avea…?", "<b>Blocare<\/b>."], ["TSI = ?", "<b>Interschimbătorul de intervale de timp<\/b>: schimbă ordinea sloturilor, prin <b>memorie<\/b>."]], "q": [{"id": "S07-004", "p": 1, "q": "Multiplexarea reprezintă:", "o": ["transformarea semnalului analogic în digital", "amplificarea semnalului", "criptarea semnalului", "transmiterea simultană a mai multor semnale pe același mediu de transmisie"], "a": 3, "e": "Definiție."}, {"id": "S07-005", "p": 1, "q": "În multiplexarea cu diviziune în frecvență (FDM):", "o": ["fiecare canal ocupă toată banda pentru un interval scurt de timp", "fiecare canal ocupă permanent o subbandă proprie din banda totală", "canalele se separă prin culoarea luminii", "nu sunt necesare benzi de gardă"], "a": 1, "e": "FDM."}, {"id": "S07-006", "p": 1, "q": "În multiplexarea cu diviziune în timp (TDM):", "o": ["canalele se transmit pe fire diferite", "canalele se separă prin polarizare", "fiecare canal folosește toată banda, dar doar într-un interval de timp (slot), pe rând", "fiecare canal folosește permanent o subbandă de frecvență"], "a": 2, "e": "TDM."}, {"id": "S07-008", "p": 1, "q": "Multiplexarea cu diviziune în lungime de undă (WDM) este folosită în:", "o": ["radioul HF", "fibra optică", "bucla locală analogică", "perechea torsadată"], "a": 1, "e": "WDM = FDM pe fibră."}, {"id": "S07-012", "p": 1, "q": "Purtătoarea T1 (folosită în America de Nord) multiplexează:", "o": ["32 de canale de voce, la 1,544 Mbit/s", "30 de canale de voce, la 2,048 Mbit/s", "12 canale de voce, la 64 kbit/s", "24 de canale de voce, la un debit de 1,544 Mbit/s"], "a": 3, "e": "T1."}, {"id": "S07-014", "p": 1, "q": "Purtătoarea E1 (standard european, folosit și în România) are un debit de:", "o": ["1,544 Mbit/s", "155,52 Mbit/s", "64 kbit/s", "2,048 Mbit/s"], "a": 3, "e": "E1 = 32 × 8 × 8000."}, {"id": "S07-015", "p": 1, "q": "Un cadru E1 conține:", "o": ["32 de intervale de timp a câte 8 biți, din care 30 pentru voce/date", "24 de intervale de timp, toate pentru voce", "64 de intervale de timp", "12 intervale de timp"], "a": 0, "e": "E1."}, {"id": "S07-016", "p": 1, "q": "Debitul unui canal telefonic digital (un slot TDM) este de:", "o": ["64 kbit/s", "4 kbit/s", "2,048 Mbit/s", "8 kbit/s"], "a": 0, "e": "8 biți × 8000 eșantioane/s."}, {"id": "S07-017", "p": 1, "q": "Cadrele TDM pentru voce digitală se repetă de 8000 de ori pe secundă; durata unui cadru este:", "o": ["125 µs", "8 ms", "64 µs", "1 ms"], "a": 0, "e": "1/8000 s."}, {"id": "S07-019", "p": 1, "q": "Debitul nivelului STM-1 din ierarhia SDH este de:", "o": ["622,08 Mbit/s", "51,84 Mbit/s", "2,048 Mbit/s", "155,52 Mbit/s"], "a": 3, "e": "SDH."}, {"id": "S07-022", "p": 1, "q": "Un comutator crossbar cu n intrări și n ieșiri are:", "o": ["n² puncte de comutație", "log₂n puncte de comutație", "2n puncte de comutație", "n puncte de comutație"], "a": 0, "e": "Crossbar."}, {"id": "S07-001", "p": 2, "q": "Legătura dintre aparatul telefonic al abonatului și centrala locală se numește:", "o": ["trunchi", "supergrup", "buclă locală", "cadru"], "a": 2, "e": "Structura sistemului telefonic."}, {"id": "S07-002", "p": 2, "q": "Linia de legătură dintre două centrale telefonice, care transportă simultan multe convorbiri multiplexate, se numește:", "o": ["buclă locală", "trunchi", "slot", "antenă"], "a": 1, "e": "Structura sistemului telefonic."}, {"id": "S07-003", "p": 2, "q": "Clasic, bucla locală este realizată din:", "o": ["o pereche de fire torsadate, cu semnal analogic", "legătură prin satelit", "fibră optică cu WDM", "ghid de undă"], "a": 0, "e": "Bucla locală."}, {"id": "S07-007", "p": 2, "q": "Între canalele unui sistem FDM se lasă:", "o": ["benzi de gardă, pentru a evita interferența", "biți de start și stop", "intervale de timp libere", "celule ATM goale"], "a": 0, "e": "FDM."}, {"id": "S07-023", "p": 2, "q": "Un comutator crossbar cu 100 de intrări și 100 de ieșiri are:", "o": ["200 de puncte de comutație", "10.000 de puncte de comutație", "1.000.000 de puncte de comutație", "100 de puncte de comutație"], "a": 1, "e": "100 × 100."}, {"id": "S07-024", "p": 2, "q": "Avantajul comutatorului crossbar este:", "o": ["numărul foarte mic de puncte de comutație", "comutarea temporală a sloturilor", "lipsa necesității de energie", "funcționarea fără blocare"], "a": 3, "e": "Crossbar."}, {"id": "S07-025", "p": 2, "q": "Dezavantajul principal al comutatorului crossbar pentru un număr mare de linii este:", "o": ["imposibilitatea comutării vocii", "numărul de puncte de comutație crește cu pătratul numărului de linii", "incompatibilitatea cu firul", "blocarea frecventă"], "a": 1, "e": "Crossbar."}, {"id": "S07-029", "p": 2, "q": "FDM se potrivește mai bine semnalelor ..., iar TDM semnalelor ...", "o": ["optice; radio", "digitale; analogice", "audio; video", "analogice; digitale"], "a": 3, "e": "FDM vs. TDM."}, {"id": "S07-009", "p": 3, "q": "În ierarhia FDM clasică, un grup cuprinde:", "o": ["30 de canale", "12 canale telefonice (48 kHz)", "60 de canale", "24 de canale"], "a": 1, "e": "Ierarhia FDM."}, {"id": "S07-010", "p": 3, "q": "În ierarhia FDM clasică, un supergrup cuprinde:", "o": ["2 grupuri, adică 24 de canale", "5 grupuri, adică 60 de canale", "12 grupuri, adică 144 de canale", "10 grupuri, adică 120 de canale"], "a": 1, "e": "Ierarhia FDM."}, {"id": "S07-011", "p": 3, "q": "Lărgimea de bandă alocată unui canal telefonic în FDM este de:", "o": ["300 Hz", "2 MHz", "64 kHz", "4 kHz"], "a": 3, "e": "3,1 kHz voce + benzi de gardă."}, {"id": "S07-013", "p": 3, "q": "Un cadru T1 are:", "o": ["53 de octeți", "192 de biți, fără încadrare", "193 de biți (24 × 8 + 1 bit de încadrare)", "256 de biți"], "a": 2, "e": "T1."}, {"id": "S07-018", "p": 3, "q": "Ierarhia digitală în care nivelurile sunt multiplexate cu ceasuri aproape sincrone, folosind biți de justificare, se numește:", "o": ["FDM", "ATM", "PDH (ierarhia digitală plesiocronă)", "SDH (ierarhia digitală sincronă)"], "a": 2, "e": "PDH."}, {"id": "S07-020", "p": 3, "q": "Debitul nivelului STM-4 din ierarhia SDH este de:", "o": ["34,368 Mbit/s", "2488,32 Mbit/s", "622,08 Mbit/s", "155,52 Mbit/s"], "a": 2, "e": "STM-4 = 4 × STM-1."}, {"id": "S07-021", "p": 3, "q": "Nivelul E3 din ierarhia PDH europeană are un debit de aproximativ:", "o": ["34 Mbit/s", "8 Mbit/s", "140 Mbit/s", "2 Mbit/s"], "a": 0, "e": "E1 2,048 / E2 8,448 / E3 34,368 / E4 139,264 Mbit/s."}, {"id": "S07-026", "p": 3, "q": "Comutatoarele în mai multe etaje (multi-stage) reduc numărul de puncte de comutație, dar pot prezenta:", "o": ["nevoia de antene directive", "imposibilitatea comutării", "lipsa multiplexării", "blocare (lipsa unei căi interne libere)"], "a": 3, "e": "Comutație spațială."}, {"id": "S07-027", "p": 3, "q": "Comutarea temporală se realizează cu un dispozitiv care schimbă ordinea intervalelor de timp dintr-un cadru TDM, numit:", "o": ["dipol", "modem", "interschimbător de intervale de timp (TSI)", "multiplexor FDM"], "a": 2, "e": "Comutație temporală."}, {"id": "S07-028", "p": 3, "q": "Principiul de funcționare al interschimbătorului de intervale de timp (TSI) este:", "o": ["sloturile cadrului de intrare sunt scrise într-o memorie și citite în altă ordine, conform unei tabele", "sloturile sunt amplificate și retransmise în aceeași ordine", "sloturile sunt transmise pe frecvențe diferite", "fiecare slot este transformat în semnal analogic"], "a": 0, "e": "TSI."}, {"id": "S07-030", "p": 3, "q": "Nivelurile SDH (STM-1, STM-4, STM-16) cresc de la un nivel la următorul cu un factor de:", "o": ["10", "8", "2", "4"], "a": 3, "e": "155,52 → 622,08 → 2488,32 Mbit/s."}]}, {"nr": 11, "id": "comutatie", "t": "Circuite, mesaje, pachete; STM și ATM", "tema": "Moduri de transfer pentru semnale digitale (comutație de circuite, mesaje, pachete; STM și ATM)", "parte": "S", "stele": 2, "itemi": "1–2", "timp": "50 min", "sursa": "T. Rădulescu, Rețele de telecomunicații, Thalia 2005, pag. 26–29, 52–61, 67–87, 327–341 · A. S. Tanenbaum, Rețele de calculatoare, ed. a III-a, 1998, pag. 56–60, 115–119, 416–419, 426–427", "ps": "<p><strong>Cum împarți o rețea între mulți utilizatori.<\/strong> Ori <strong>rezervi o cale<\/strong> pentru fiecare (comutație de <strong>circuite<\/strong>, STM), ori <strong>tai informația în bucăți<\/strong> și le trimiți când e nevoie (comutație de <strong>mesaje<\/strong> și <strong>pachete<\/strong>, ATM). Pică des: <strong>cele 3 faze<\/strong>, <strong>store-and-forward<\/strong>, <strong>datagramă vs circuit virtual<\/strong> și <strong>celula ATM de 53 de octeți<\/strong>.<\/p>", "fise": [{"t": "Cele două „filozofii”", "h": "<p>Ai multe surse (telefoane, calculatoare) care vor să trimită date prin <strong>aceeași rețea<\/strong>. Cum împarți rețeaua între ele?<\/p>\n<ol>\n<li><strong>Rezervi<\/strong> o cale pentru fiecare comunicare, cât durează ea → <strong>comutație de circuite<\/strong>. La nivel de transmisie: <strong>STM<\/strong>.<\/li>\n<li><strong>Nu rezervi nimic.<\/strong> Tai informația în bucăți și le trimiți <strong>când e nevoie<\/strong>, împărțind rețeaua cu ceilalți → <strong>comutație de mesaje / pachete<\/strong>. La nivel de transmisie: <strong>ATM<\/strong>.<\/li>\n<\/ol>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 340\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Comutația de circuite cu cale rezervată față de comutația de pachete\">\n  <text x=\"200\" y=\"18\" text-anchor=\"middle\" class=\"t-b\">CIRCUITE · calea e rezervată<\/text>\n  <g stroke-width=\"5\" class=\"s-acc\" fill=\"none\"><path d=\"M70 68 H126\"/><path d=\"M154 68 H246\"/><path d=\"M274 68 H330\"/><\/g>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\"><rect x=\"10\" y=\"50\" width=\"60\" height=\"36\" rx=\"8\"/><rect x=\"330\" y=\"50\" width=\"60\" height=\"36\" rx=\"8\"/><\/g>\n  <circle cx=\"140\" cy=\"68\" r=\"14\" class=\"f-acs s-acc\" stroke-width=\"2\"/><circle cx=\"260\" cy=\"68\" r=\"14\" class=\"f-acs s-acc\" stroke-width=\"2\"/>\n  <g class=\"t-b\" text-anchor=\"middle\"><text x=\"40\" y=\"73\">A<\/text><text x=\"360\" y=\"73\">B<\/text><\/g>\n  <text x=\"200\" y=\"118\" text-anchor=\"middle\" style=\"font-size:13px\" class=\"t-mut\">stabilire → transfer → eliberare<\/text>\n  <text x=\"200\" y=\"136\" text-anchor=\"middle\" style=\"font-size:13px\" class=\"t-mut\">calea rămâne ocupată și în pauze<\/text>\n  <line x1=\"10\" y1=\"152\" x2=\"390\" y2=\"152\" class=\"s-line\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"176\" text-anchor=\"middle\" class=\"t-b\">PACHETE · bucăți pe drumuri diferite<\/text>\n  <g class=\"s-line\" stroke-width=\"2\" fill=\"none\">\n    <path d=\"M70 248 L130 212\"/><path d=\"M70 248 L130 284\"/><path d=\"M130 212 L270 212\"/><path d=\"M130 284 L270 284\"/><path d=\"M130 212 L270 284\"/><path d=\"M130 284 L270 212\"/><path d=\"M270 212 L330 248\"/><path d=\"M270 284 L330 248\"/>\n  <\/g>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\"><rect x=\"10\" y=\"230\" width=\"60\" height=\"36\" rx=\"8\"/><rect x=\"330\" y=\"230\" width=\"60\" height=\"36\" rx=\"8\"/><\/g>\n  <g class=\"f-bls s-blu\" stroke-width=\"2\"><circle cx=\"130\" cy=\"212\" r=\"14\"/><circle cx=\"130\" cy=\"284\" r=\"14\"/><circle cx=\"270\" cy=\"212\" r=\"14\"/><circle cx=\"270\" cy=\"284\" r=\"14\"/><\/g>\n  <g class=\"t-b\" text-anchor=\"middle\"><text x=\"40\" y=\"253\">A<\/text><text x=\"360\" y=\"253\">B<\/text><\/g>\n  <g stroke-width=\"1\"><rect x=\"90\" y=\"225\" width=\"14\" height=\"14\" class=\"f-amb s-ink\"/><rect x=\"190\" y=\"205\" width=\"14\" height=\"14\" class=\"f-amb s-ink\"/><rect x=\"90\" y=\"263\" width=\"14\" height=\"14\" class=\"f-acc s-ink\"/><rect x=\"190\" y=\"277\" width=\"14\" height=\"14\" class=\"f-acc s-ink\"/><rect x=\"298\" y=\"263\" width=\"14\" height=\"14\" class=\"f-red s-ink\"/><\/g>\n  <text x=\"200\" y=\"320\" text-anchor=\"middle\" style=\"font-size:13px\" class=\"t-mut\">pachetele împart liniile cu alți utilizatori<\/text>\n<\/svg><figcaption>Sus: la comutația de circuite calea A–B e rezervată de la început până la sfârșit. Jos: la comutația de pachete, bucățile merg prin noduri și împart liniile cu alții.<\/figcaption><\/figure>\n\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Circuite<\/strong> = <strong>închiriezi un taxi<\/strong> doar pentru tine: e liber tot drumul, dar plătești și când stă la semafor. <strong>Pachete<\/strong> = <strong>autobuzul<\/strong>: împarți locul cu alții, e mai ieftin, dar uneori aștepți.<\/p><\/aside>"}, {"t": "Comutația de circuite", "h": "<p>Între cei doi corespondenți se face o <strong>cale rezervată, cap la cap<\/strong>, pe toată durata comunicării.<\/p>\n<p><strong>3 faze:<\/strong><\/p>\n<ol>\n<li><strong>Stabilirea<\/strong> conexiunii (apelul) – se rezervă calea;<\/li>\n<li><strong>Transferul<\/strong> datelor pe calea rezervată;<\/li>\n<li><strong>Eliberarea<\/strong> (desfacerea) conexiunii.<\/li>\n<\/ol>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>✅ Avantaje<\/th>\n<th>❌ Dezavantaje<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>întârziere mică și constantă<\/strong> după stabilire → ideal pentru <strong>voce în timp real<\/strong><\/td>\n<td>durează <strong>stabilirea<\/strong> legăturii<\/td>\n<\/tr>\n<tr>\n<td>ordinea datelor e <strong>garantată<\/strong><\/td>\n<td><strong>calea e ocupată și când nu se transmite nimic<\/strong> (pauzele din conversație) → <strong>ineficientă<\/strong> pentru date în rafale<\/td>\n<\/tr>\n<tr>\n<td>capacitatea e <strong>garantată<\/strong><\/td>\n<td>dacă un nod cade, <strong>conexiunea se pierde<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Exemplul clasic:<\/strong> <strong>rețeaua telefonică<\/strong> tradițională.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>S – T – E<\/strong>: <strong>S<\/strong>tabilire, <strong>T<\/strong>ransfer, <strong>E<\/strong>liberare.<\/p><\/aside>"}, {"t": "Comutația de mesaje", "h": "<ul>\n<li><strong>Nu<\/strong> se stabilește o cale în avans.<\/li>\n<li><strong>Tot mesajul<\/strong> e trimis primului nod. Nodul îl <strong>memorează complet<\/strong>, apoi îl <strong>retransmite<\/strong> mai departe.<\/li>\n<li>Asta se numește <strong>memorează și retransmite<\/strong> (<em>store-and-forward<\/em>).<\/li>\n<\/ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>✅<\/th>\n<th>❌<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>folosire mai bună a liniilor<\/td>\n<td><strong>întârzieri mari și variabile<\/strong><\/td>\n<\/tr>\n<tr>\n<td>nu trebuie stabilită legătura<\/td>\n<td>nodurile au nevoie de <strong>memorie mare<\/strong> (mesajele pot fi oricât de lungi)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>un mesaj lung <strong>blochează<\/strong> linia pentru ceilalți<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Exemplu istoric:<\/strong> rețelele de <strong>telegrafie<\/strong> (telex).<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>scrisoare care trece prin oficii poștale<\/strong>: fiecare oficiu o primește întreagă, o ține, apoi o trimite la următorul.<\/p><\/aside>"}, {"t": "Comutația de pachete", "h": "<ul>\n<li>Mesajul se <strong>împarte în pachete<\/strong> de <strong>lungime limitată<\/strong>. Fiecare are un <strong>antet<\/strong> (adresă, număr de ordine etc.).<\/li>\n<li>Fiecare pachet trece prin noduri tot prin <strong>memorează și retransmite<\/strong>.<\/li>\n<\/ul>\n<p><strong>Avantaje:<\/strong><\/p>\n<ul>\n<li><strong>Întârziere totală mai mică<\/strong> decât la mesaje: un nod retransmite primul pachet <strong>în timp ce îl primește pe al doilea<\/strong> (efect de <strong>„bandă rulantă”<\/strong>, <em>pipelining<\/em>).<\/li>\n<li><strong>Folosire foarte eficientă<\/strong> a liniilor: rețeaua se împarte <strong>statistic<\/strong> între utilizatori.<\/li>\n<li><strong>Robustețe<\/strong>: dacă un nod cade, pachetele îl pot <strong>ocoli<\/strong>.<\/li>\n<\/ul>\n<p><strong>Dezavantaje:<\/strong> <strong>întârziere variabilă<\/strong> (<em>jitter<\/em>), posibile <strong>pierderi<\/strong> și <strong>congestie<\/strong>.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Mutarea cu mai multe mașini mici<\/strong> în loc de un singur TIR: prima mașină pleacă deja în timp ce o încarci pe a doua. Ajungi mai repede.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: de ce pachetele sunt mai rapide decât mesajele? Răspunsul bun e <strong>„bandă rulantă”<\/strong>: nodul trimite un pachet <strong>în timp ce îl primește pe următorul<\/strong>.<\/p><\/aside>"}, {"t": "Datagramă sau circuit virtual ⚠️", "h": "<p>Comutația de pachete are <strong>două variante<\/strong>:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Datagramă<\/strong> (fără conexiune)<\/th>\n<th><strong>Circuit virtual<\/strong> (orientat pe conexiune)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Se stabilește conexiunea?<\/td>\n<td><strong>nu<\/strong><\/td>\n<td><strong>da<\/strong> (o „cale logică”)<\/td>\n<\/tr>\n<tr>\n<td>Drumul pachetelor<\/td>\n<td><strong>fiecare pachet independent<\/strong><\/td>\n<td>toate pe <strong>aceeași cale<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ordinea de sosire<\/td>\n<td><strong>poate fi diferită<\/strong> (se reordonează la destinație)<\/td>\n<td><strong>în ordine<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Adresa din pachet<\/td>\n<td><strong>adresa completă<\/strong> a destinației<\/td>\n<td>doar un <strong>identificator scurt<\/strong> al circuitului<\/td>\n<\/tr>\n<tr>\n<td>Dacă un nod cade<\/td>\n<td>pachetele <strong>ocolesc<\/strong><\/td>\n<td>circuitul virtual <strong>se pierde<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Exemple<\/td>\n<td><strong>IP (Internet)<\/strong><\/td>\n<td><strong>X.25, Frame Relay, ATM<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Circuitul virtual<\/strong> „pare” un circuit (cale fixă, ordine), dar <strong>nu rezervă resursele doar pentru tine<\/strong>: le împarte statistic cu ceilalți.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>IP = datagramă.<\/strong> X.25, Frame Relay, ATM = <strong>circuit virtual<\/strong>.<\/p><\/aside>"}, {"t": "Cele trei, una lângă alta", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Circuite<\/th>\n<th>Mesaje<\/th>\n<th>Pachete<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cale rezervată<\/td>\n<td><strong>da<\/strong><\/td>\n<td>nu<\/td>\n<td>nu (circuitul virtual: cale logică)<\/td>\n<\/tr>\n<tr>\n<td>Store-and-forward<\/td>\n<td>nu<\/td>\n<td><strong>da, tot mesajul<\/strong><\/td>\n<td><strong>da, pe pachete<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Întârziere<\/td>\n<td><strong>mică, constantă<\/strong><\/td>\n<td><strong>mare, variabilă<\/strong><\/td>\n<td>mică/medie, variabilă<\/td>\n<\/tr>\n<tr>\n<td>Eficiența liniei<\/td>\n<td>mică (la trafic în rafale)<\/td>\n<td>bună<\/td>\n<td><strong>foarte bună<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Potrivit pentru<\/td>\n<td><strong>voce<\/strong><\/td>\n<td>telegrame<\/td>\n<td><strong>date<\/strong> (și voce, cu QoS)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"t": "Sincron, asincron, plesiocron", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Transmisia<\/th>\n<th>Ce înseamnă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Asincronă (start-stop)<\/strong><\/td>\n<td>fiecare <strong>caracter<\/strong> are un <strong>bit de start<\/strong> și unul sau mai mulți <strong>biți de stop<\/strong>. Ceasul se sincronizează <strong>la fiecare caracter<\/strong>. Simplă, dar <strong>ineficientă<\/strong> (biți în plus).<\/td>\n<\/tr>\n<tr>\n<td><strong>Sincronă<\/strong><\/td>\n<td>datele merg în <strong>blocuri (cadre) lungi<\/strong>, iar ceasurile emițătorului și receptorului sunt <strong>sincronizate permanent<\/strong>. <strong>Eficientă<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Plesiocronă<\/strong><\/td>\n<td>ceasurile sunt <strong>„aproape”<\/strong> sincrone (aceeași frecvență nominală, mici abateri). Diferențele se compensează cu <strong>biți de umplere (justificare)<\/strong>. Exemplu: <strong>PDH<\/strong> (capitolul despre multiplexare).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Asincron<\/strong> = vorbești cu pauze și spui „start” și „stop” la fiecare cuvânt. <strong>Sincron<\/strong> = doi soldați care merg <strong>în pas<\/strong>, tot timpul.<\/p><\/aside>"}, {"t": "STM – modul de transfer sincron", "h": "<ul>\n<li>Se bazează pe <strong>TDM<\/strong>: fiecare canal primește <strong>un slot fix<\/strong> în fiecare cadru, <strong>periodic<\/strong>.<\/li>\n<li>Canalul se <strong>recunoaște după poziția<\/strong> lui în cadru.<\/li>\n<li><strong>Capacitatea e rezervată<\/strong> chiar dacă sursa n-are ce trimite → <strong>risipă<\/strong> la traficul în rafale.<\/li>\n<li>E echivalentul <strong>comutației de circuite<\/strong>. Exemplu: rețeaua telefonică digitală (canale de <strong>64 kbit/s<\/strong>).<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca un <strong>loc rezervat la cinema<\/strong>: e al tău, cu numărul tău, chiar dacă nu vii la film.<\/p><\/aside>"}, {"t": "ATM – celulele de 53 de octeți ⚠️", "h": "<p><strong>ATM<\/strong> (<em>Asynchronous Transfer Mode<\/em>) trimite informația în <strong>celule mici, de lungime fixă<\/strong>:<\/p>\n<p><strong>53 de octeți = 5 octeți antet + 48 de octeți informație utilă (payload).<\/strong><\/p>\n<ul>\n<li><strong>„Asincron”<\/strong> = celulele unei surse <strong>nu au poziții fixe<\/strong> în timp. Se trimit <strong>doar când există date<\/strong>; locul liber îl folosesc alții → <strong>multiplexare statistică<\/strong>.<\/li>\n<li>ATM e <strong>orientat pe conexiune<\/strong>: folosește <strong>circuite virtuale<\/strong>. Antetul are <strong>VPI<\/strong> (calea virtuală) și <strong>VCI<\/strong> (canalul virtual).<\/li>\n<li><strong>De ce celule mici și fixe?<\/strong><\/li>\n<li><strong>comutare rapidă în hardware<\/strong> (toate au aceeași lungime);<\/li>\n<li><strong>întârziere mică și previzibilă<\/strong> → bună pentru <strong>voce și video<\/strong>.<\/li>\n<li>Duce <strong>voce, date, video<\/strong> în aceeași rețea, cu <strong>clase de serviciu (QoS)<\/strong>: <strong>CBR<\/strong> (rată constantă, ex. voce), <strong>VBR<\/strong> (variabilă), <strong>ABR<\/strong> (disponibilă), <strong>UBR<\/strong> (nespecificată).<\/li>\n<li><strong>Straturi:<\/strong> <strong>fizic<\/strong> → <strong>ATM<\/strong> (comută celulele) → <strong>AAL<\/strong> (<em>ATM Adaptation Layer<\/em>, adaptează datele la celule).<\/li>\n<li>Viteze tipice: <strong>155,52<\/strong> și <strong>622,08 Mbit/s<\/strong> (peste SDH/SONET).<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>53 = 5 + 48.<\/strong> Antetul e mic (<strong>5<\/strong>), datele sunt aproape tot (<strong>48<\/strong>).<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Celulele ATM sunt ca <strong>containerele standard<\/strong> din port: toate au aceeași mărime, deci macaraua le mută repede, fără să se gândească.<\/p><\/aside>"}, {"t": "STM sau ATM – comparația", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>STM<\/strong><\/th>\n<th><strong>ATM<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Unitatea de transfer<\/td>\n<td><strong>slot<\/strong> fix, periodic<\/td>\n<td><strong>celulă de 53 de octeți<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Cum recunoști canalul<\/td>\n<td>după <strong>poziția<\/strong> în cadru<\/td>\n<td>după <strong>eticheta din antet (VPI/VCI)<\
