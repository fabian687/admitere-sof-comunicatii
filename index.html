<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Manualul candidatului SOF</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: manual de buzunar – cuprins lateral pe desktop, o coloană de lectură; fișe numerotate ca într-o carte */
:root{
  --bg:#edf0ea; --paper:#fbfcf9; --ink:#17201a; --mut:#5a685e; --line:#d3dacf;
  --acc:#2e5c3a; --acc-ink:#ffffff; --acc-soft:#e1ebe1;
  --amb:#a86b12; --amb-soft:#f5e9d2; --red:#a3312a; --red-soft:#f6e2df; --blu:#2b5578; --blu-soft:#e2eaf2;
  --shadow:0 1px 2px rgba(23,32,26,.06),0 4px 14px rgba(23,32,26,.05);
  --f-disp:"Archivo","Segoe UI",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1310; --paper:#151c17; --ink:#e2e9e1; --mut:#97a59a; --line:#28322b;
    --acc:#8cc39a; --acc-ink:#0d130f; --acc-soft:#1a2b1f;
    --amb:#e3ac54; --amb-soft:#2b2415; --red:#f08a80; --red-soft:#341a1a; --blu:#8db7dd; --blu-soft:#162331;
    --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1310; --paper:#151c17; --ink:#e2e9e1; --mut:#97a59a; --line:#28322b;
  --acc:#8cc39a; --acc-ink:#0d130f; --acc-soft:#1a2b1f;
  --amb:#e3ac54; --amb-soft:#2b2415; --red:#f08a80; --red-soft:#341a1a; --blu:#8db7dd; --blu-soft:#162331;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.62 var(--f-body)}
a{color:var(--acc)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.mono{font-family:var(--f-mono)}

/* bara de sus */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:21}
.top-in{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font:700 15px/1.2 var(--f-disp);letter-spacing:.01em;color:var(--ink);text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:480px){.brand small{display:none}}
.brand small{display:block;font:500 12px/1.2 var(--f-disp);color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.tbtn{font:600 14px/1 var(--f-disp);border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 12px;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.tbtn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}

/* schelet */
.shell{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media(min-width:1000px){.shell{grid-template-columns:290px minmax(0,1fr);gap:40px}}
.side{display:none}
@media(min-width:1000px){.side{display:block;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding-block:24px}}
main{min-width:0;padding-block:24px 80px;max-width:740px;width:100%}

/* cuprins */
.toc-h{font:700 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px}
.toc a{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:baseline;padding:7px 8px;border-radius:7px;color:var(--ink);text-decoration:none;font:500 14px/1.35 var(--f-disp)}
.toc a:hover{background:var(--paper)}
.toc a.on{background:var(--acc-soft);color:var(--ink)}
.toc .n{font:700 12px/1 var(--f-mono);color:var(--mut)}
.toc .ok{color:var(--acc);font-size:13px}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.35);display:flex}
.drawer-in{background:var(--bg);width:min(340px,88vw);height:100%;overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(24px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px))}

/* coperta */
.cover{padding:26px 0 8px}
.eyebrow{font:600 12px/1.3 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--amb)}
h1{font:800 clamp(30px,6vw,46px)/1.05 var(--f-disp);letter-spacing:-.015em;margin:10px 0 12px;text-wrap:balance}
.lead{font-size:18px;color:var(--mut);margin:0 0 18px;max-width:60ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:12px}
.stat b{display:block;font:700 26px/1.1 var(--f-mono);font-variant-numeric:tabular-nums}
.stat span{font:500 13px/1.3 var(--f-disp);color:var(--mut)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 15px/1.2 var(--f-disp);border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:13px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn:disabled{opacity:.45;cursor:default}
.steps{display:grid;gap:10px;margin:22px 0 6px;counter-reset:s}
.steps div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;font-size:16px}
.steps div::before{counter-increment:s;content:counter(s);font:700 14px/34px var(--f-mono);text-align:center;width:34px;height:34px;border-radius:50%;background:var(--acc-soft);color:var(--acc)}
.chlist{display:grid;gap:8px;margin-top:10px}
.chi{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.chi:hover{border-color:var(--acc)}
.chi .num{font:700 18px/1 var(--f-mono);color:var(--mut);text-align:center}
.chi.done .num{color:var(--acc)}
.chi h3{font:700 16.5px/1.25 var(--f-disp);margin:0 0 4px}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;font:500 12.5px/1.3 var(--f-disp);color:var(--mut)}
.tag{display:inline-block;font:700 11px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.tag.S{background:var(--blu-soft);color:var(--blu)}
.tag.L{background:var(--amb-soft);color:var(--amb)}
.stars{color:var(--amb);letter-spacing:1px}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--acc)}

/* capitol */
.ch-head{padding:18px 0 6px}
.ch-no{font:700 13px/1 var(--f-mono);letter-spacing:.08em;color:var(--amb);text-transform:uppercase}
.ch-tema{color:var(--mut);margin:0 0 12px;font-size:16px}
.ps{background:var(--acc-soft);border-radius:12px;padding:14px 16px;margin:16px 0 26px}
.ps .lbl{font:700 12px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.ps p{margin:.3em 0}
.fisa{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 18px 8px;margin:0 0 18px;box-shadow:var(--shadow)}
.fisa-h{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.fisa-h .n{font:700 13px/1 var(--f-mono);color:var(--mut);flex:none}
.fisa-h h2{font:700 20px/1.25 var(--f-disp);margin:0;text-wrap:balance}
.fisa p{margin:.55em 0}
.fisa ul,.fisa ol{padding-left:1.25em;margin:.5em 0}
.fisa li{margin:.25em 0}
.fisa h3{font:700 16px/1.3 var(--f-disp);margin:16px 0 4px}
.fisa strong{font-weight:600}
.fisa code{font:500 .88em var(--f-mono);background:var(--acc-soft);padding:1px 5px;border-radius:4px}
.fisa pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;font:500 13px/1.5 var(--f-mono)}
.fisa pre code{background:none;padding:0}
.tw{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font:500 14.5px/1.4 var(--f-disp)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;background:var(--bg);font-size:13px;letter-spacing:.02em}
tr:last-child td{border-bottom:0}
td strong{font-weight:700}
.co{border-radius:10px;padding:10px 14px;margin:12px 0}
.co-h{font:700 11.5px/1 var(--f-disp);letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.co p{margin:.3em 0}
.co-analog{background:var(--blu-soft)} .co-analog .co-h{color:var(--blu)}
.co-analog .co-h::before{content:"◎ "}
.co-capcana{background:var(--red-soft)} .co-capcana .co-h{color:var(--red)}
.co-capcana .co-h::before{content:"! "}
.co-retine{background:var(--acc-soft)} .co-retine .co-h{color:var(--acc)}
.co-retine .co-h::before{content:"✓ "}
.co-info{background:var(--bg)} .co-info .co-h{color:var(--mut)}
.co-calc{background:var(--amb-soft)} .co-calc .co-h{color:var(--amb)}
.co-calc .co-h::before{content:"= "}
figure.dg{margin:14px 0;padding:12px;background:var(--bg);border-radius:10px;overflow-x:auto}
figure.dg svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto}
figure.dg figcaption{font:500 13px/1.4 var(--f-disp);color:var(--mut);text-align:center;margin-top:8px}
/* culori desene */
.dg svg{font-family:var(--f-disp);font-size:13px}
.dg text{fill:var(--ink)}
.dg .t-mut{fill:var(--mut)} .dg .t-acc{fill:var(--acc)} .dg .t-amb{fill:var(--amb)} .dg .t-red{fill:var(--red)} .dg .t-blu{fill:var(--blu)}
.dg .t-b{font-weight:700} .dg text.t-s,.dg .t-s{font-size:11px} .dg text.t-l,.dg .t-l{font-size:15px} .dg .t-m{font-family:var(--f-mono)}
.dg .f-ink{fill:var(--ink)} .dg .f-paper{fill:var(--paper)} .dg .f-line{fill:var(--line)} .dg .f-acc{fill:var(--acc)} .dg .f-acs{fill:var(--acc-soft)}
.dg .f-amb{fill:var(--amb)} .dg .f-ams{fill:var(--amb-soft)} .dg .f-red{fill:var(--red)} .dg .f-res{fill:var(--red-soft)} .dg .f-blu{fill:var(--blu)} .dg .f-bls{fill:var(--blu-soft)} .dg .f-none{fill:none}
.dg .s-ink{stroke:var(--ink)} .dg .s-mut{stroke:var(--mut)} .dg .s-line{stroke:var(--line)} .dg .s-acc{stroke:var(--acc)} .dg .s-amb{stroke:var(--amb)} .dg .s-red{stroke:var(--red)} .dg .s-blu{stroke:var(--blu)}
.ch-end{border-top:1px solid var(--line);margin-top:28px;padding-top:20px}
.ch-end h3{font:700 18px/1.3 var(--f-disp);margin:0 0 10px}

/* flashcards */
.fc-wrap{perspective:1200px;margin:16px 0}
.fc{position:relative;min-height:260px;cursor:pointer;transition:transform .45s;transform-style:preserve-3d;border:0;background:none;width:100%;padding:0;text-align:left}
.fc.flip{transform:rotateY(180deg)}
.fc-side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.fc-f{background:var(--paper)}
.fc-b{background:var(--acc-soft);transform:rotateY(180deg)}
.fc-side .k{font:700 11.5px/1 var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.fc-side .x{font:600 21px/1.35 var(--f-disp)}
.fc-b .x{font:500 19px/1.45 var(--f-body)}
.fc-side .hint{margin-top:auto;padding-top:14px;font:500 13px/1 var(--f-disp);color:var(--mut)}
@media (prefers-reduced-motion: reduce){.fc{transition:none}}

/* grile */
.q{font:600 19px/1.4 var(--f-disp);margin:6px 0 14px;text-wrap:pretty}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font:400 16.5px/1.45 var(--f-body);color:var(--ink)}
.opt b{font:700 15px/1.45 var(--f-mono);color:var(--mut)}
.opt:hover{border-color:var(--acc)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.ok{background:var(--acc-soft);border-color:var(--acc)}
.opt.bad{background:var(--red-soft);border-color:var(--red)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin:12px 0;background:var(--bg);border:1px solid var(--line);font-size:16px}
.prio{font:700 11px/1 var(--f-disp);letter-spacing:.06em;text-transform:uppercase;padding:4px 7px;border-radius:5px}
.prio.p1{background:var(--amb-soft);color:var(--amb)}
.prio.p2{background:var(--bg);color:var(--mut);border:1px solid var(--line)}
.prio.p3{background:var(--bg);color:var(--mut)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font:500 13.5px/1.3 var(--f-disp);color:var(--mut)}
.big{font:800 54px/1 var(--f-mono);margin:6px 0}
.okc{color:var(--acc)} .badc{color:var(--red)}
.rev{border-top:1px solid var(--line);padding:12px 0;font-size:15.5px}
.rev small{display:block;color:var(--mut);font:500 13.5px/1.4 var(--f-disp);margin-top:3px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:8px 12px;font:600 13.5px/1 var(--f-disp);cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.alf{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;margin:10px 0}
.alf span{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:600 14px/1.2 var(--f-disp)}
.alf b{font:700 16px/1 var(--f-mono);color:var(--acc);margin-right:6px}
.alf.num{grid-template-columns:repeat(auto-fill,minmax(92px,1fr))}
.page h2{font:700 22px/1.25 var(--f-disp);margin:28px 0 8px}
.page h3{font:700 17px/1.3 var(--f-disp);margin:18px 0 6px}
.muted{color:var(--mut)}
</style>

<div class="top"><div class="top-in">
  <button class="tbtn" id="menuBtn" aria-label="Cuprins">☰ Cuprins</button>
  <a class="brand" href="#"><small>Admitere SOF · Comunicații 017</small>Manualul candidatului</a>
  <a class="tbtn pri" href="#simulare">Simulare</a>
</div></div>
<div class="shell">
  <aside class="side" id="side"></aside>
  <main id="app"></main>
</div>

<script>
const D = {"ch": [{"nr": 1, "id": "radiotelefonie", "t": "Cum vorbești la stația radio", "tema": "Rețele radio militare, disciplina radio, reguli de radiotelefonie", "parte": "S", "stele": 3, "itemi": "3–5", "timp": "60 min", "sursa": "C.I.-7.1 Manualul de operare în comunicațiile radiotelefonice militare (2014), Cap. I art. 0105–0116, Cap. IV art. 0401–0409", "ps": "<p>Capitolul cu <strong>cel mai bun raport puncte/efort<\/strong>: e mult de memorat, dar nimic greu de înțeles. Înveți <strong>cum e organizată o rețea radio<\/strong>, <strong>regulile de disciplină<\/strong> și <strong>„limba” stației radio<\/strong>: alfabetul NATO, cifrele și cuvintele de procedură (OVER, OUT, ROGER, WILCO…).<\/p>", "fise": [{"t": "Direcție radio și rețea radio", "h": "<ul>\n<li><strong>Direcție radio<\/strong> = legătura dintre <strong>2 stații<\/strong>.<\/li>\n<li><strong>Rețea radio<\/strong> = <strong>3 sau mai multe stații<\/strong> pe <strong>aceeași frecvență<\/strong> (sau același set de salt de frecvență).<\/li>\n<li>Fiecare stație are un <strong>indicativ de apel<\/strong>, adică un „nume radio” (ex.: ALFA 1). <strong>Nu se folosesc nume reale<\/strong> de persoane sau de unități.<\/li>\n<\/ul>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 330\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Rețea radio cu stația de control în centru și o direcție radio\">\n  <g stroke-width=\"2.5\" stroke-dasharray=\"6 5\" class=\"s-acc\">\n    <line x1=\"140\" y1=\"120\" x2=\"50\" y2=\"40\"/><line x1=\"140\" y1=\"120\" x2=\"50\" y2=\"200\"/><line x1=\"140\" y1=\"120\" x2=\"230\" y2=\"40\"/><line x1=\"140\" y1=\"120\" x2=\"230\" y2=\"200\"/>\n  <\/g>\n  <circle cx=\"140\" cy=\"120\" r=\"40\" class=\"f-acc\"/>\n  <text x=\"140\" y=\"117\" text-anchor=\"middle\" class=\"t-b t-l\" style=\"fill:var(--acc-ink)\">NCS<\/text>\n  <text x=\"140\" y=\"135\" text-anchor=\"middle\" style=\"fill:var(--acc-ink);font-size:12px\">comandantul<\/text>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\">\n    <rect x=\"8\" y=\"20\" width=\"84\" height=\"38\" rx=\"8\"/><rect x=\"8\" y=\"182\" width=\"84\" height=\"38\" rx=\"8\"/>\n    <rect x=\"188\" y=\"20\" width=\"84\" height=\"38\" rx=\"8\"/><rect x=\"188\" y=\"182\" width=\"84\" height=\"38\" rx=\"8\"/>\n  <\/g>\n  <g class=\"t-b\"><text x=\"50\" y=\"44\" text-anchor=\"middle\">ALFA 1<\/text><text x=\"50\" y=\"206\" text-anchor=\"middle\">ALFA 2<\/text>\n  <text x=\"230\" y=\"44\" text-anchor=\"middle\">ALFA 3<\/text><text x=\"230\" y=\"206\" text-anchor=\"middle\">ALFA 4<\/text><\/g>\n  <text x=\"140\" y=\"250\" text-anchor=\"middle\" class=\"t-b\">REȚEA RADIO<\/text>\n  <text x=\"140\" y=\"268\" text-anchor=\"middle\" class=\"t-mut\">3+ stații, aceeași frecvență<\/text>\n  <line x1=\"298\" y1=\"10\" x2=\"298\" y2=\"290\" class=\"s-line\" stroke-width=\"1.5\"/>\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\"><rect x=\"312\" y=\"40\" width=\"80\" height=\"38\" rx=\"8\"/><rect x=\"312\" y=\"162\" width=\"80\" height=\"38\" rx=\"8\"/><\/g>\n  <line x1=\"352\" y1=\"78\" x2=\"352\" y2=\"162\" class=\"s-amb\" stroke-width=\"2.5\" stroke-dasharray=\"6 5\"/>\n  <text x=\"352\" y=\"64\" text-anchor=\"middle\" class=\"t-b\">BRAVO<\/text><text x=\"352\" y=\"186\" text-anchor=\"middle\" class=\"t-b\">CHARLIE<\/text>\n  <text x=\"352\" y=\"250\" text-anchor=\"middle\" class=\"t-b\">DIRECȚIE<\/text>\n  <text x=\"352\" y=\"268\" text-anchor=\"middle\" class=\"t-mut\">2 stații<\/text>\n  <text x=\"200\" y=\"318\" text-anchor=\"middle\" class=\"t-amb t-b\">NCS = stația de control a rețelei<\/text>\n<\/svg><figcaption>O rețea radio: stația de control (NCS) în centru, stațiile subordonate în jur. Două stații singure = direcție radio.<\/figcaption><\/figure>\n\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>O <strong>direcție radio<\/strong> e ca un apel telefonic între doi oameni. O <strong>rețea radio<\/strong> e ca un <strong>grup de WhatsApp pe stație<\/strong>: toți aud tot ce se spune, dar vorbește doar unul odată.<\/p><\/aside>"}, {"t": "Stația de control a rețelei (NCS)", "h": "<p><strong>NCS<\/strong> (<em>Net Control Station<\/em>) este „șeful” rețelei. De regulă e <strong>stația comandantului<\/strong>, adică a <strong>eșalonului superior<\/strong>.<\/p>\n<p>Ce face NCS-ul:<\/p>\n<ul>\n<li><strong>deschide și închide<\/strong> rețeaua;<\/li>\n<li><strong>controlează traficul<\/strong>: cine vorbește și în ce ordine;<\/li>\n<li>face <strong>verificările de legătură<\/strong> (<em>radio check<\/em>);<\/li>\n<li><strong>impune și ridică tăcerea radio<\/strong>;<\/li>\n<li><strong>menține disciplina<\/strong> și corectează operatorii;<\/li>\n<li>decide <strong>schimbarea frecvenței<\/strong> (de exemplu la bruiaj).<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>NCS-ul e <strong>moderatorul ședinței<\/strong>: dă cuvântul, oprește discuția și decide când se încheie.<\/p><\/aside>"}, {"t": "Rețea dirijată sau rețea liberă", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Rețea dirijată<\/strong> (<em>directed net<\/em>)<\/th>\n<th><strong>Rețea liberă<\/strong> (<em>free net<\/em>)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Cum se vorbește<\/td>\n<td>stațiile subordonate vorbesc între ele <strong>numai cu aprobarea NCS<\/strong><\/td>\n<td>stațiile vorbesc <strong>direct<\/strong>, fără aprobare<\/td>\n<\/tr>\n<tr>\n<td>Când se folosește<\/td>\n<td>trafic mare, operatori începători, nevoie de ordine<\/td>\n<td>trafic mic, operatori experimentați, nevoie de viteză<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cine decide tipul rețelei?<\/strong> → <strong>NCS-ul<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Dirijată = „cer voie”<\/strong>. <strong>Liberă = „vorbesc direct”<\/strong>.<\/p><\/aside>"}, {"t": "Disciplina radio – cele 10 reguli", "h": "<p><strong>De ce contează:<\/strong> inamicul <strong>ascultă<\/strong> tot ce emiți. <strong>Fiecare secundă de emisie<\/strong> îl ajută să te <strong>localizeze<\/strong> și apoi să te lovească.<\/p>\n<ol>\n<li><strong>Ascultă înainte să emiți<\/strong>, ca să nu întrerupi pe altcineva.<\/li>\n<li>Gândește mesajul <strong>înainte<\/strong>: <strong>scurt, clar, concis<\/strong>.<\/li>\n<li>Folosește <strong>numai<\/strong> procedurile, cuvintele de procedură și indicativele stabilite.<\/li>\n<li><strong>Niciodată informații clasificate în clar.<\/strong> Doar criptat sau cu coduri aprobate.<\/li>\n<li><strong>Fără nume reale<\/strong> de oameni, unități sau localități.<\/li>\n<li><strong>Fără discuții personale<\/strong> și fără limbaj necuviincios.<\/li>\n<li><strong>Nu emite fără rost<\/strong> (fără „teste” inutile).<\/li>\n<li>Folosește <strong>puterea minimă<\/strong> necesară.<\/li>\n<li>Respectă <strong>tăcerea radio<\/strong> când e impusă.<\/li>\n<li><strong>Autentifică<\/strong> stațiile suspecte. Inamicul se poate da drept o stație de-a ta.<\/li>\n<\/ol>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>La grilă apare des „Care e o încălcare a disciplinei radio?” → răspunsul e de obicei <strong>folosirea numelor reale<\/strong> sau <strong>transmiterea în clar<\/strong> a informațiilor clasificate.<\/p><\/aside>"}, {"t": "Tăcerea radio", "h": "<ul>\n<li><strong>Tăcere radio<\/strong> (<em>SILENCE<\/em>) = <strong>nimeni nu emite<\/strong>. Stațiile <strong>ascultă în continuare<\/strong>, dar nu transmit (excepție: urgențele prevăzute).<\/li>\n<li>O impune <strong>NCS-ul / comandantul<\/strong>.<\/li>\n<li>O ridică <strong>numai cel care a impus-o<\/strong> (sau eșalonul superior): <strong>„SILENCE LIFTED”<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la examen, când profesorul spune „liniște!”. Toți rămân în sală și ascultă, dar nu vorbește nimeni până nu spune el „puteți vorbi”.<\/p><\/aside>"}, {"t": "Alfabetul fonetic NATO", "h": "<p>De ce există: la radio, „B”, „D”, „P” și „T” sună la fel. Așa că fiecare literă are un <strong>cuvânt<\/strong> care nu poate fi confundat.<\/p>\n<div class=\"alf\"><span><b>A<\/b>ALFA<\/span><span><b>B<\/b>BRAVO<\/span><span><b>C<\/b>CHARLIE<\/span><span><b>D<\/b>DELTA<\/span><span><b>E<\/b>ECHO<\/span><span><b>F<\/b>FOXTROT<\/span><span><b>G<\/b>GOLF<\/span><span><b>H<\/b>HOTEL<\/span><span><b>I<\/b>INDIA<\/span><span><b>J<\/b>JULIETT<\/span><span><b>K<\/b>KILO<\/span><span><b>L<\/b>LIMA<\/span><span><b>M<\/b>MIKE<\/span><span><b>N<\/b>NOVEMBER<\/span><span><b>O<\/b>OSCAR<\/span><span><b>P<\/b>PAPA<\/span><span><b>Q<\/b>QUEBEC<\/span><span><b>R<\/b>ROMEO<\/span><span><b>S<\/b>SIERRA<\/span><span><b>T<\/b>TANGO<\/span><span><b>U<\/b>UNIFORM<\/span><span><b>V<\/b>VICTOR<\/span><span><b>W<\/b>WHISKEY<\/span><span><b>X<\/b>X-RAY<\/span><span><b>Y<\/b>YANKEE<\/span><span><b>Z<\/b>ZULU<\/span><\/div>\n\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Cum îl înveți repede:<\/strong> silabisește-ți <strong>numele<\/strong>, <strong>orașul<\/strong> și <strong>numărul mașinii<\/strong> de 3 ori pe zi. În 4 zile îl știi.<\/p>\n<p>Exemplu: POPESCU = PAPA – OSCAR – PAPA – ECHO – SIERRA – CHARLIE – UNIFORM.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcane: <strong>J = JULIETT<\/strong> (nu Johnny), <strong>Q = QUEBEC<\/strong> (nu Queen), <strong>W = WHISKEY<\/strong> (nu William), <strong>A = ALFA<\/strong> (scris cu F).<\/p><\/aside>"}, {"t": "Cum se pronunță cifrele", "h": "<div class=\"alf num\"><span><b>0<\/b>ZE-RO<\/span><span><b>1<\/b>WUN<\/span><span><b>2<\/b>TOO<\/span><span><b>3<\/b>TREE<\/span><span><b>4<\/b>FOW-ER<\/span><span><b>5<\/b>FIFE<\/span><span><b>6<\/b>SIX<\/span><span><b>7<\/b>SEV-EN<\/span><span><b>8<\/b>AIT<\/span><span><b>9<\/b>NIN-ER<\/span><\/div>\n\n<ul>\n<li>Numerele se spun <strong>cifră cu cifră<\/strong>: <strong>1500<\/strong> → „WUN FIFE ZE-RO ZE-RO”.<\/li>\n<li>Ora are <strong>4 cifre<\/strong>, în <strong>ora ZULU (UTC)<\/strong>: 14:30 → „WUN FOW-ER TREE ZE-RO ZULU”.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>De ce „NIN-ER” și nu „nine”? Pentru că „nine” seamănă cu germanul „nein” (nu) și, prin stație, cu „five”. Pronunțiile ciudate sunt făcute ca să <strong>nu poată fi confundate<\/strong>.<\/p><\/aside>"}, {"t": "Cuvintele de procedură esențiale", "h": "<p>Sunt „cuvinte-semnal” cu sens fix. <strong>Acestea pică cel mai des:<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cuvânt<\/th>\n<th>Ce înseamnă<\/th>\n<th>Când îl spui<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>THIS IS<\/strong><\/td>\n<td>„Aici …”<\/td>\n<td>urmat de <strong>indicativul TĂU<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>OVER<\/strong><\/td>\n<td>„Recepție” – <strong>aștept răspuns<\/strong><\/td>\n<td>la final, când vrei răspuns<\/td>\n<\/tr>\n<tr>\n<td><strong>OUT<\/strong><\/td>\n<td>„Terminat” – <strong>nu aștept răspuns<\/strong><\/td>\n<td>la finalul ultimei transmisii<\/td>\n<\/tr>\n<tr>\n<td><strong>ROGER<\/strong><\/td>\n<td>„Am <strong>recepționat<\/strong>”<\/td>\n<td>confirmi doar că ai primit<\/td>\n<\/tr>\n<tr>\n<td><strong>WILCO<\/strong><\/td>\n<td>„Am înțeles <strong>și execut<\/strong>”<\/td>\n<td>confirmi un ordin<\/td>\n<\/tr>\n<tr>\n<td><strong>SAY AGAIN<\/strong><\/td>\n<td>„<strong>Repetă<\/strong>”<\/td>\n<td>n-ai înțeles<\/td>\n<\/tr>\n<tr>\n<td><strong>I SAY AGAIN<\/strong><\/td>\n<td>„<strong>Repet<\/strong>”<\/td>\n<td>repeți tu<\/td>\n<\/tr>\n<tr>\n<td><strong>I SPELL<\/strong><\/td>\n<td>„<strong>Spun pe litere<\/strong>”<\/td>\n<td>urmează alfabetul fonetic<\/td>\n<\/tr>\n<tr>\n<td><strong>CORRECTION<\/strong><\/td>\n<td>„<strong>Corectez<\/strong>”<\/td>\n<td>ai greșit, continui de la ultimul cuvânt bun<\/td>\n<\/tr>\n<tr>\n<td><strong>WAIT<\/strong><\/td>\n<td>„<strong>Așteaptă<\/strong>” câteva secunde<\/td>\n<td>revii imediat<\/td>\n<\/tr>\n<tr>\n<td><strong>WAIT OUT<\/strong><\/td>\n<td>„Așteaptă, revin <strong>mai târziu<\/strong>”<\/td>\n<td>pauză lungă<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Capcana nr. 1:<\/strong> <strong>„OVER and OUT” e GREȘIT.<\/strong> Nu poți aștepta răspuns (OVER) și închide (OUT) în același timp.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Capcana nr. 2:<\/strong> <strong>ROGER ≠ WILCO.<\/strong> ROGER = „am primit mesajul”. WILCO = „am primit, am înțeles și <strong>voi executa<\/strong>”. WILCO îl include pe ROGER, deci nu spui „Roger, wilco”.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Capcana nr. 3:<\/strong> pentru „repetă” se spune <strong>SAY AGAIN<\/strong>, <strong>niciodată „REPEAT”<\/strong>. În artilerie, „REPEAT” înseamnă „<strong>trage din nou<\/strong>”.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>OVER e ca atunci când <strong>îi dai cuiva cuvântul<\/strong> într-o discuție. OUT e ca atunci când <strong>închizi telefonul<\/strong>.<\/p><\/aside>"}, {"t": "Alte cuvinte de procedură", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cuvânt<\/th>\n<th>Ce înseamnă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>RADIO CHECK<\/strong><\/td>\n<td>verificare radio: „Cum mă auzi?”<\/td>\n<\/tr>\n<tr>\n<td><strong>READ BACK<\/strong><\/td>\n<td>„Repetă-mi mesajul înapoi”, ca verificare<\/td>\n<\/tr>\n<tr>\n<td><strong>THAT IS CORRECT<\/strong> / <strong>WRONG<\/strong><\/td>\n<td>read back-ul a fost corect / greșit<\/td>\n<\/tr>\n<tr>\n<td><strong>FIGURES<\/strong><\/td>\n<td>„Urmează cifre”<\/td>\n<\/tr>\n<tr>\n<td><strong>BREAK<\/strong><\/td>\n<td>separă părțile mesajului<\/td>\n<\/tr>\n<tr>\n<td><strong>DISREGARD THIS TRANSMISSION – OUT<\/strong><\/td>\n<td>„Ignoră ce am spus” – anulezi o transmisie greșită<\/td>\n<\/tr>\n<tr>\n<td><strong>AUTHENTICATE<\/strong><\/td>\n<td>„Autentifică-te” – verifici identitatea<\/td>\n<\/tr>\n<tr>\n<td><strong>ACKNOWLEDGE<\/strong><\/td>\n<td>„Confirmă primirea”<\/td>\n<\/tr>\n<tr>\n<td><strong>NOTHING HEARD<\/strong><\/td>\n<td>stația chemată nu a răspuns<\/td>\n<\/tr>\n<tr>\n<td><strong>UNKNOWN STATION<\/strong><\/td>\n<td>nu știi cine te-a chemat<\/td>\n<\/tr>\n<tr>\n<td><strong>WORDS TWICE<\/strong><\/td>\n<td>condiții grele: spune fiecare cuvânt de două ori<\/td>\n<\/tr>\n<tr>\n<td><strong>SILENCE<\/strong> (de 3 ori) / <strong>SILENCE LIFTED<\/strong><\/td>\n<td>impunerea / ridicarea tăcerii radio<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"t": "Verificarea radio: cum răspunzi", "h": "<p>Răspunsul are <strong>două părți<\/strong>: <strong>cât de tare<\/strong> te aude și <strong>cât de clar<\/strong> te înțelege.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tăria semnalului<\/th>\n<th>Claritatea (inteligibilitatea)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LOUD<\/strong> – tare<\/td>\n<td><strong>CLEAR<\/strong> – clar, excelent<\/td>\n<\/tr>\n<tr>\n<td><strong>GOOD<\/strong> – bun<\/td>\n<td><strong>READABLE<\/strong> – se înțelege fără greutate<\/td>\n<\/tr>\n<tr>\n<td><strong>WEAK<\/strong> – slab<\/td>\n<td><strong>UNREADABLE<\/strong> – nu se înțelege<\/td>\n<\/tr>\n<tr>\n<td><strong>VERY WEAK<\/strong> – foarte slab<\/td>\n<td><strong>DISTORTED<\/strong> – distorsionat<\/td>\n<\/tr>\n<tr>\n<td><strong>FADING<\/strong> – scade din când în când<\/td>\n<td><strong>WITH INTERFERENCE<\/strong> – cu interferențe<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><strong>INTERMITTENT<\/strong> – întrerupt<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Cel mai bun răspuns posibil: „LOUD AND CLEAR”.<\/strong><\/p>\n<p>Un schimb complet:\n<code>ALFA 1:  BRAVO 2, THIS IS ALFA 1, RADIO CHECK, OVER.\nBRAVO 2: ALFA 1, THIS IS BRAVO 2, LOUD AND CLEAR, OVER.\nALFA 1:  THIS IS ALFA 1, ROGER, OUT.<\/code><\/p>"}, {"t": "Cum vorbești corect la stație", "h": "<ul>\n<li><strong>Apasă PTT, așteaptă o clipă, apoi vorbește.<\/strong> Altfel se taie primul cuvânt (mai ales în salt de frecvență sau la criptare).<\/li>\n<li>Vorbește <strong>rar, clar, cu voce normală<\/strong>. Nu striga.<\/li>\n<li>Ține microfonul la <strong>câțiva centimetri<\/strong> de gură.<\/li>\n<li>Mesajele lungi le împarți în <strong>fraze scurte<\/strong>.<\/li>\n<li><strong>Eliberează PTT<\/strong> după ce ai terminat. O tastă blocată „ocupă” toată rețeaua și transmite tot ce se aude în jur.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>PTT-ul (<em>Push To Talk<\/em>) e ca butonul de <strong>mesaj vocal din WhatsApp<\/strong>: ții apăsat cât vorbești, dai drumul când ai terminat.<\/p><\/aside>"}], "flash": [["Câte stații are o <b>rețea radio<\/b>?", "<b>3 sau mai multe<\/b>. Două stații formează o <b>direcție radio<\/b>."], ["Ce este NCS?", "<b>Stația de control a rețelei<\/b>, de regulă stația comandantului (eșalonului superior)."], ["Rețea <b>dirijată<\/b> – ce înseamnă?", "Stațiile subordonate vorbesc între ele <b>numai cu aprobarea NCS<\/b>."], ["Rețea <b>liberă<\/b> – ce înseamnă?", "Stațiile vorbesc <b>direct<\/b>, fără aprobare."], ["Cine stabilește dacă rețeaua e liberă sau dirijată?", "<b>NCS-ul<\/b>."], ["Cine ridică tăcerea radio?", "<b>Cel care a impus-o<\/b> (sau eșalonul superior). Se spune „SILENCE LIFTED”."], ["Ce faci înainte să emiți?", "<b>Asculți<\/b> frecvența, ca să nu întrerupi alt trafic."], ["De ce transmisiile trebuie să fie scurte?", "Fiecare secundă de emisie ajută inamicul să te <b>intercepteze și să te localizeze<\/b>."], ["Informații clasificate în clar prin radio?", "<b>Interzis.<\/b> Doar criptat."], ["Ce e indicativul de apel?", "„Numele radio” al stației, folosit <b>în locul numelor reale<\/b>."], ["J, Q, W în alfabetul NATO?", "<b>JULIETT, QUEBEC, WHISKEY<\/b>"], ["Cum se pronunță 9? Dar 3? Dar 5?", "<b>NIN-ER<\/b>, <b>TREE<\/b>, <b>FIFE<\/b>"], ["Cum transmiți 1500?", "<b>WUN FIFE ZE-RO ZE-RO<\/b> (cifră cu cifră)"], ["OVER = ?", "„Recepție”: am terminat și <b>aștept răspuns<\/b>."], ["OUT = ?", "„Terminat”: am terminat și <b>nu aștept răspuns<\/b>."], ["„Over and out” e corect?", "<b>Nu<\/b>, e o greșeală: sensurile se contrazic."], ["ROGER = ?", "Am <b>recepționat<\/b> ultima transmisie."], ["WILCO = ?", "Am înțeles și <b>voi executa<\/b>."], ["Cum ceri „repetă”?", "<b>SAY AGAIN<\/b> (niciodată „REPEAT”)."], ["Ce urmează după THIS IS?", "<b>Indicativul tău<\/b> (al stației care transmite)."], ["I SPELL = ?", "Urmează un cuvânt <b>spus pe litere<\/b> cu alfabetul fonetic."], ["CORRECTION = ?", "Am greșit; continui de la <b>ultimul cuvânt corect<\/b>."], ["WAIT vs WAIT OUT?", "WAIT = câteva secunde. WAIT OUT = <b>revin mai târziu<\/b>."], ["READ BACK = ?", "„<b>Repetă-mi mesajul<\/b>” ca verificare."], ["Răspunsul la radio check când totul e perfect?", "<b>LOUD AND CLEAR<\/b>"], ["UNREADABLE = ?", "Transmisia <b>nu poate fi înțeleasă<\/b>."], ["Cum anulezi o transmisie greșită?", "<b>DISREGARD THIS TRANSMISSION – OUT<\/b>"], ["Cum verifici identitatea unei stații suspecte?", "<b>AUTHENTICATE<\/b> (autentificare)."]], "q": [{"id": "S03-001", "p": 1, "q": "O rețea radio este formată din:", "o": ["stații care lucrează pe frecvențe diferite, fără legătură între ele", "o singură stație și un releu", "trei sau mai multe stații care lucrează pe aceeași frecvență (același set de salt) și în același regim", "exact două stații"], "a": 2, "e": "Două stații formează o direcție radio."}, {"id": "S03-002", "p": 1, "q": "Legătura radio realizată între două stații se numește:", "o": ["direcție radio", "trunchi", "rețea radio", "nod de comunicații"], "a": 0, "e": "Organizarea legăturilor radio."}, {"id": "S03-003", "p": 1, "q": "Stația care conduce rețeaua radio (deschide/închide rețeaua, controlează traficul, impune tăcerea radio) se numește:", "o": ["stația necunoscută", "stația de retranslație", "stația de control al rețelei (NCS)", "stația subordonată"], "a": 2, "e": "NCS."}, {"id": "S03-005", "p": 1, "q": "Într-o rețea dirijată (directed net):", "o": ["nu există stație de control al rețelei", "se transmite numai în clar", "stațiile subordonate pot comunica între ele numai cu aprobarea stației de control al rețelei", "stațiile comunică liber, fără aprobare"], "a": 2, "e": "Tipuri de rețele."}, {"id": "S03-006", "p": 1, "q": "Într-o rețea liberă (free net):", "o": ["tăcerea radio este permanentă", "se lucrează numai pe frecvență fixă", "stațiile pot comunica direct între ele, fără aprobarea prealabilă a stației de control", "nicio stație nu poate emite fără aprobare"], "a": 2, "e": "Tipuri de rețele."}, {"id": "S03-010", "p": 1, "q": "Transmisiile radio trebuie să fie cât mai scurte deoarece:", "o": ["regulamentul interzice frazele cu peste 3 cuvinte", "fiecare secundă de emisie ajută inamicul să intercepteze și să localizeze stația", "receptorul se supraîncălzește", "bateriile nu permit transmisii mai lungi de 5 secunde"], "a": 1, "e": "Disciplina radio."}, {"id": "S03-011", "p": 1, "q": "Transmiterea în clar, prin radio, a informațiilor clasificate este:", "o": ["permisă dacă se vorbește în limba engleză", "permisă în frecvență fixă", "interzisă", "permisă dacă rețeaua este militară"], "a": 2, "e": "Disciplina radio; Legea 182/2002, art. 38."}, {"id": "S03-013", "p": 1, "q": "Pe timpul tăcerii radio, stațiile din rețea:", "o": ["emit numai mesaje personale", "trec pe altă frecvență și lucrează normal", "se închid complet", "rămân pe recepție (ascultă), dar nu emit, cu excepțiile prevăzute"], "a": 3, "e": "Tăcerea radio."}, {"id": "S03-016", "p": 1, "q": "Litera „J” se transmite, conform alfabetului fonetic NATO, prin cuvântul:", "o": ["JULIUS", "JIG", "JULIETT", "JOHNNY"], "a": 2, "e": "Alfabetul fonetic NATO."}, {"id": "S03-021", "p": 1, "q": "Cifra 9 se pronunță, în radiotelefonie (NATO):", "o": ["NINE-TEN", "NOVEM", "NAIN", "NIN-ER"], "a": 3, "e": "Pronunția cifrelor."}, {"id": "S03-023", "p": 1, "q": "Cuvântul de procedură „OVER” înseamnă:", "o": ["schimbul s-a încheiat și nu aștept răspuns", "am înțeles și voi executa", "transmisia mea s-a încheiat și aștept răspuns", "repetă transmisia"], "a": 2, "e": "Prowords."}, {"id": "S03-024", "p": 1, "q": "Cuvântul de procedură „OUT” înseamnă:", "o": ["așteaptă câteva secunde", "aștept răspuns", "repetă", "transmisia s-a încheiat și nu aștept răspuns"], "a": 3, "e": "Prowords."}, {"id": "S03-025", "p": 1, "q": "Folosirea împreună a cuvintelor de procedură „OVER” și „OUT” la sfârșitul unei transmisii este:", "o": ["obligatorie în rețelele dirijate", "corectă, este forma oficială de încheiere", "greșită, deoarece au sensuri contradictorii", "permisă numai de NCS"], "a": 2, "e": "„Over and out” este o greșeală de procedură."}, {"id": "S03-026", "p": 1, "q": "Cuvântul de procedură „ROGER” înseamnă:", "o": ["corectez", "am recepționat satisfăcător ultima transmisie", "am înțeles și voi executa", "repetă"], "a": 1, "e": "Prowords."}, {"id": "S03-027", "p": 1, "q": "Cuvântul de procedură „WILCO” înseamnă:", "o": ["repetă mesajul", "am primit mesajul, l-am înțeles și voi executa", "așteaptă", "am recepționat, dar nu voi executa"], "a": 1, "e": "WILCO include sensul lui ROGER."}, {"id": "S03-028", "p": 1, "q": "Pentru a cere repetarea unei transmisii (sau a unei părți din ea) se folosește cuvântul de procedură:", "o": ["ROGER", "OVER", "SAY AGAIN", "REPEAT"], "a": 2, "e": "„REPEAT” nu se folosește, deoarece în artilerie înseamnă repetarea tragerii."}, {"id": "S03-029", "p": 1, "q": "Cuvântul de procedură folosit înaintea unui cuvânt spus pe litere cu alfabetul fonetic este:", "o": ["FIGURES", "BREAK", "WAIT", "I SPELL"], "a": 3, "e": "Prowords."}, {"id": "S03-033", "p": 1, "q": "Răspunsul la o verificare radio, atunci când semnalul este puternic și perfect inteligibil, este:", "o": ["NOTHING HEARD", "LOUD AND CLEAR", "GOOD AND DISTORTED", "WEAK AND READABLE"], "a": 1, "e": "Radio check."}, {"id": "S03-004", "p": 2, "q": "De regulă, stația de control al rețelei este stația:", "o": ["comandantului / eșalonului superior", "celui mai tânăr operator", "de retranslație", "cea mai îndepărtată de punctul de comandă"], "a": 0, "e": "Organizarea rețelelor."}, {"id": "S03-007", "p": 2, "q": "Tipul de rețea (liberă sau dirijată) se stabilește de:", "o": ["stația de control al rețelei", "fiecare operator, după preferință", "operatorul care emite primul", "inamic"], "a": 0, "e": "NCS decide modul de control."}, {"id": "S03-014", "p": 2, "q": "Tăcerea radio impusă poate fi ridicată de:", "o": ["inamic", "oricare operator din rețea", "cel care a impus-o (sau de eșalonul superior)", "stația cu cel mai puternic semnal"], "a": 2, "e": "„SILENCE LIFTED”."}, {"id": "S03-015", "p": 2, "q": "Procedura prin care se verifică identitatea unei stații suspecte în rețea se numește:", "o": ["autentificare (AUTHENTICATE)", "read back", "radio check", "break"], "a": 0, "e": "Protecție împotriva intruziunii."}, {"id": "S03-017", "p": 2, "q": "Litera „Q” se transmite, conform alfabetului fonetic NATO, prin cuvântul:", "o": ["QUOTA", "QUARTZ", "QUEBEC", "QUEEN"], "a": 2, "e": "Alfabetul fonetic NATO."}, {"id": "S03-018", "p": 2, "q": "Litera „W” se transmite, conform alfabetului fonetic NATO, prin cuvântul:", "o": ["WILLIAM", "WINTER", "WHISKEY", "WOLF"], "a": 2, "e": "Alfabetul fonetic NATO."}, {"id": "S03-020", "p": 2, "q": "Indicativul „ABC” se silabisește, conform alfabetului fonetic NATO:", "o": ["ADAM BRAVO CHARLIE", "ALFA BRAVO CHARLIE", "ALFA BRAVO CHARLES", "ALPHA BETA CHARLIE"], "a": 1, "e": "Alfabetul fonetic NATO."}, {"id": "S03-022", "p": 2, "q": "Cifra 3 se pronunță, în radiotelefonie (NATO):", "o": ["TEREI", "THRI", "TREE", "TRES"], "a": 2, "e": "Pronunția cifrelor."}, {"id": "S03-032", "p": 2, "q": "Pentru a cere corespondentului să repete mesajul primit, ca verificare, se folosește:", "o": ["I SAY AGAIN", "ACKNOWLEDGE", "READ BACK", "SAY AGAIN"], "a": 2, "e": "Prowords."}, {"id": "S03-035", "p": 2, "q": "Cuvântul de procedură „THIS IS” este urmat de:", "o": ["indicativul stației care transmite (propriul indicativ)", "indicativul stației chemate", "textul mesajului", "frecvența de lucru"], "a": 0, "e": "Ex.: „BRAVO 2, THIS IS ALFA 1”."}, {"id": "S03-039", "p": 2, "q": "Numărul 1500 se transmite, cifră cu cifră, astfel:", "o": ["WUN FIFE ZE-RO ZE-RO", "ONE FIVE HUNDRED", "WUN FIVE OH OH", "FIFTEEN HUNDRED"], "a": 0, "e": "Pronunția cifrelor."}, {"id": "S03-008", "p": 3, "q": "Indicativul de apel (call sign) reprezintă:", "o": ["puterea emițătorului", "codul de criptare", "denumirea convențională a unei stații radio, folosită în locul numelor reale", "frecvența de lucru"], "a": 2, "e": "Indicativele protejează identitatea stațiilor."}, {"id": "S03-009", "p": 3, "q": "Înainte de a emite, operatorul trebuie, în primul rând:", "o": ["să transmită un ton de test lung", "să schimbe antena", "să mărească puterea la maximum", "să asculte frecvența, pentru a nu întrerupe alt trafic"], "a": 3, "e": "Disciplina radio."}, {"id": "S03-012", "p": 3, "q": "Care dintre următoarele constituie o încălcare a disciplinei radio?", "o": ["folosirea numelor reale ale persoanelor și unităților, în locul indicativelor", "folosirea cuvintelor de procedură stabilite", "folosirea puterii minime necesare", "ascultarea frecvenței înainte de emisie"], "a": 0, "e": "Disciplina radio."}, {"id": "S03-019", "p": 3, "q": "Cuvântul „DELTA” corespunde, în alfabetul fonetic NATO, literei:", "o": ["T", "A", "L", "D"], "a": 3, "e": "Alfabetul fonetic NATO."}, {"id": "S03-030", "p": 3, "q": "Cuvântul de procedură „CORRECTION” se folosește atunci când:", "o": ["se impune tăcerea radio", "se încheie schimbul de mesaje", "operatorul cere corespondentului să corecteze antena", "operatorul a greșit și continuă de la ultimul cuvânt transmis corect"], "a": 3, "e": "Prowords."}, {"id": "S03-031", "p": 3, "q": "Cuvântul de procedură „WAIT OUT” înseamnă:", "o": ["așteaptă, voi reveni mai târziu (pauză mai lungă)", "tăcere radio", "am terminat definitiv", "așteaptă câteva secunde, revin imediat"], "a": 0, "e": "Prowords."}, {"id": "S03-034", "p": 3, "q": "În răspunsul la verificarea radio, termenul „UNREADABLE” arată că:", "o": ["semnalul are fading", "semnalul este foarte puternic", "transmisia nu poate fi înțeleasă", "transmisia este perfect clară"], "a": 2, "e": "Radio check – inteligibilitate."}, {"id": "S03-036", "p": 3, "q": "Cuvântul de procedură folosit pentru a anula o transmisie greșită este:", "o": ["CORRECTION", "I SAY AGAIN", "DISREGARD THIS TRANSMISSION – OUT", "WAIT"], "a": 2, "e": "Prowords."}, {"id": "S03-037", "p": 3, "q": "Atunci când stația chemată nu răspunde, stația care cheamă poate raporta:", "o": ["WILCO", "ROGER", "LOUD AND CLEAR", "NOTHING HEARD"], "a": 3, "e": "Prowords."}, {"id": "S03-038", "p": 3, "q": "Când operatorul nu a identificat stația care l-a chemat, folosește:", "o": ["UNKNOWN STATION", "BREAK", "THIS IS", "WILCO"], "a": 0, "e": "Prowords."}, {"id": "S03-040", "p": 3, "q": "La apăsarea tastei de emisie (PTT), operatorul trebuie:", "o": ["să vorbească imediat, foarte tare", "să aștepte o clipă înainte de a vorbi, pentru a nu pierde primul cuvânt", "să elibereze imediat tasta", "să sufle în microfon pentru test"], "a": 1, "e": "Reguli de vorbire."}]}, {"nr": 2, "id": "constitutia", "t": "Constituția României", "tema": "Statul, drepturile și îndatoririle cetățenilor, Președintele și armata", "parte": "L", "stele": 3, "itemi": "3–5", "timp": "90 min", "sursa": "Constituția României (2003) – Titlul I art. 1, 2, 3, 4, 6, 11, 12; Titlul II art. 15–57; art. 92, 93, 118, 119", "ps": "<p>Cel mai mare capitol de legislație și cel mai probabil la examen. Grilele întreabă aproape mereu <strong>cifre<\/strong> (ore, zile, vârste), <strong>cine decide<\/strong> (Președintele, Parlamentul, judecătorul) și <strong>excepții<\/strong>. Constituția are 3 părți logice: <strong>statul<\/strong> → <strong>omul<\/strong> (drepturi și îndatoriri) → <strong>apărarea<\/strong>.<\/p>", "fise": [{"t": "Statul român în 5 cuvinte (art. 1)", "h": "<p>România este stat <strong>național, suveran și independent, unitar și indivizibil<\/strong>.<\/p>\n<ul>\n<li>Forma de guvernământ: <strong>republica<\/strong>.<\/li>\n<li>Este stat <strong>de drept, democratic și social<\/strong>.<\/li>\n<li>Puterea e împărțită în trei: <strong>legislativă<\/strong> (Parlamentul), <strong>executivă<\/strong> (Președintele și Guvernul), <strong>judecătorească<\/strong> (instanțele). Principiul se numește <strong>separația și echilibrul puterilor<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>N-S-I-U-I<\/strong> → <strong>N<\/strong>ațional, <strong>S<\/strong>uveran, <strong>I<\/strong>ndependent, <strong>U<\/strong>nitar, <strong>I<\/strong>ndivizibil.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Separația puterilor<\/strong> e ca la un meci: unul face regulile (Parlamentul), altul joacă după ele (Guvernul) și un al treilea arbitrează (judecătorii). Niciunul nu le face pe toate.<\/p><\/aside>"}, {"t": "Suveranitatea și teritoriul (art. 2, 3, 4)", "h": "<p><strong>Suveranitatea<\/strong> (puterea supremă în stat) <strong>aparține poporului român<\/strong>. Poporul o exercită prin:<\/p>\n<ul>\n<li><strong>organele reprezentative<\/strong> alese (Parlament, Președinte);<\/li>\n<li><strong>referendum<\/strong>.<\/li>\n<\/ul>\n<p>⚠️ <strong>Niciun grup și nicio persoană<\/strong> nu pot exercita suveranitatea <strong>în nume propriu<\/strong>.<\/p>\n<p><strong>Teritoriul<\/strong> este <strong>inalienabil<\/strong>: nu poate fi vândut, cedat sau dat.<\/p>\n<ul>\n<li>Frontierele se stabilesc prin <strong>lege organică<\/strong>.<\/li>\n<li>Teritoriul se organizează în <strong>comune, orașe și județe<\/strong>. Unele orașe sunt <strong>municipii<\/strong>.<\/li>\n<li><strong>Este interzisă<\/strong> strămutarea sau colonizarea de <strong>populații străine<\/strong>.<\/li>\n<\/ul>\n<p><strong>Fundamentul statului<\/strong> = <strong>unitatea poporului român<\/strong> și <strong>solidaritatea cetățenilor<\/strong>.<\/p>"}, {"t": "Minoritățile, tratatele și simbolurile (art. 6, 11, 12)", "h": "<ul>\n<li><strong>Art. 6:<\/strong> <strong>minoritățile naționale<\/strong> au dreptul să-și păstreze <strong>identitatea<\/strong> etnică, culturală, lingvistică și religioasă.<\/li>\n<li><strong>Art. 11:<\/strong> tratatele <strong>ratificate de Parlament<\/strong> fac <strong>parte din dreptul intern<\/strong>. ⚠️ Dacă un tratat <strong>contrazice Constituția<\/strong>, poate fi ratificat <strong>numai după revizuirea Constituției<\/strong>.<\/li>\n<\/ul>\n<p><strong>Simbolurile naționale (art. 12):<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Drapelul<\/td>\n<td>tricolor, culori <strong>verticale<\/strong>, de la lance: <strong>albastru – galben – roșu<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Ziua națională<\/td>\n<td><strong>1 Decembrie<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Imnul<\/td>\n<td><strong>„Deșteaptă-te, române!”<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Stema și sigiliul<\/td>\n<td>se stabilesc prin <strong>legi organice<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 190\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Drapelul României\">\n  <rect x=\"40\" y=\"10\" width=\"8\" height=\"175\" rx=\"3\" class=\"f-ink\"/>\n  <circle cx=\"44\" cy=\"10\" r=\"7\" class=\"f-amb\"/>\n  <rect x=\"48\" y=\"22\" width=\"90\" height=\"120\" fill=\"#002B7F\"/>\n  <rect x=\"138\" y=\"22\" width=\"90\" height=\"120\" fill=\"#FCD116\"/>\n  <rect x=\"228\" y=\"22\" width=\"90\" height=\"120\" fill=\"#CE1126\"/>\n  <text x=\"93\" y=\"165\" text-anchor=\"middle\" class=\"t-b\">1. albastru<\/text>\n  <text x=\"183\" y=\"165\" text-anchor=\"middle\" class=\"t-b\">2. galben<\/text>\n  <text x=\"273\" y=\"165\" text-anchor=\"middle\" class=\"t-b\">3. roșu<\/text>\n  <text x=\"56\" y=\"184\" class=\"t-s t-mut\">← lancea<\/text>\n<\/svg><figcaption>De la lance spre exterior: albastru, galben, roșu.<\/figcaption><\/figure>"}, {"t": "Reguli comune pentru toate drepturile (art. 15–21)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Art.<\/th>\n<th>Regula<\/th>\n<th>Ce se întreabă la grilă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>15<\/td>\n<td>Legea se aplică <strong>numai pentru viitor<\/strong><\/td>\n<td><strong>Excepție:<\/strong> legea <strong>penală sau contravențională mai favorabilă<\/strong><\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>Toți sunt <strong>egali<\/strong> în fața legii; <strong>nimeni nu e mai presus de lege<\/strong><\/td>\n<td>Funcțiile publice, <strong>civile sau militare<\/strong> → doar cei cu <strong>cetățenia română și domiciliul în țară<\/strong><\/td>\n<\/tr>\n<tr>\n<td>17<\/td>\n<td>Românii din străinătate sunt <strong>protejați<\/strong> de stat<\/td>\n<td>Își îndeplinesc obligațiile, <strong>mai puțin<\/strong> cele incompatibile cu absența din țară<\/td>\n<\/tr>\n<tr>\n<td>19<\/td>\n<td>Cetățeanul român <strong>nu poate fi expulzat<\/strong><\/td>\n<td>Poate fi <strong>extrădat<\/strong> doar pe bază de <strong>convenții internaționale<\/strong> și <strong>reciprocitate<\/strong>. <strong>Decide justiția.<\/strong><\/td>\n<\/tr>\n<tr>\n<td>20<\/td>\n<td>Tratatele privind drepturile omului <strong>au prioritate<\/strong><\/td>\n<td><strong>Excepție:<\/strong> când legea internă e <strong>mai favorabilă<\/strong><\/td>\n<\/tr>\n<tr>\n<td>21<\/td>\n<td><strong>Acces liber la justiție<\/strong>, proces echitabil, termen rezonabil<\/td>\n<td>Jurisdicțiile speciale administrative sunt <strong>facultative și gratuite<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Legea doar pentru viitor:<\/strong> dacă mâine se interzice fumatul în parc, nu poți fi amendat pentru o țigară fumată ieri. <strong>Excepția „mai favorabilă”:<\/strong> dacă o faptă nu mai e pedepsită, nici cel care a făcut-o ieri nu mai e pedepsit.<\/p><\/aside>"}, {"t": "Libertatea persoanei – cifrele care pică (art. 22–24)", "h": "<ul>\n<li><strong>Pedeapsa cu moartea este interzisă.<\/strong> Tortura și tratamentele inumane, la fel.<\/li>\n<\/ul>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 210\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Termenele reținerii și arestării preventive\">\n  <text x=\"10\" y=\"22\" class=\"t-b\">Reținere<\/text>\n  <rect x=\"10\" y=\"32\" width=\"46\" height=\"30\" rx=\"6\" class=\"f-ams s-amb\" stroke-width=\"1.5\"/>\n  <text x=\"33\" y=\"52\" text-anchor=\"middle\" class=\"t-b t-m t-amb\">24 h<\/text>\n  <text x=\"66\" y=\"52\" class=\"t-mut\">maximum<\/text>\n  <text x=\"10\" y=\"94\" class=\"t-b\">Arest preventiv (doar judecătorul)<\/text>\n  <g class=\"f-acs s-acc\" stroke-width=\"1.5\">\n    <rect x=\"10\" y=\"104\" width=\"58\" height=\"30\" rx=\"6\"/><rect x=\"72\" y=\"104\" width=\"58\" height=\"30\" rx=\"6\"/><rect x=\"134\" y=\"104\" width=\"58\" height=\"30\" rx=\"6\"/>\n    <rect x=\"196\" y=\"104\" width=\"58\" height=\"30\" rx=\"6\"/><rect x=\"258\" y=\"104\" width=\"58\" height=\"30\" rx=\"6\"/><rect x=\"320\" y=\"104\" width=\"58\" height=\"30\" rx=\"6\"/>\n  <\/g>\n  <g class=\"t-m t-b t-acc\" text-anchor=\"middle\"><text x=\"39\" y=\"124\">30<\/text><text x=\"101\" y=\"124\">+30<\/text><text x=\"163\" y=\"124\">+30<\/text><text x=\"225\" y=\"124\">+30<\/text><text x=\"287\" y=\"124\">+30<\/text><text x=\"349\" y=\"124\">+30<\/text><\/g>\n  <path d=\"M10 146 h368\" class=\"s-ink\" stroke-width=\"1.5\"/><path d=\"M10 141 v10 M378 141 v10\" class=\"s-ink\" stroke-width=\"1.5\"/>\n  <text x=\"194\" y=\"172\" text-anchor=\"middle\" class=\"t-b t-l\">total maximum 180 de zile<\/text>\n  <text x=\"194\" y=\"196\" text-anchor=\"middle\" class=\"t-mut\">la judecată, verificare cel mult la 60 de zile<\/text>\n<\/svg><figcaption>Cât poate fi ținută o persoană: reținere maximum 24 de ore, arest preventiv 30 + 30 + ... maximum 180 de zile.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Cât<\/th>\n<th>Cine decide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Reținerea<\/strong><\/td>\n<td><strong>max 24 de ore<\/strong><\/td>\n<td>poliția / procurorul<\/td>\n<\/tr>\n<tr>\n<td><strong>Arestarea preventivă<\/strong> (în urmărirea penală)<\/td>\n<td><strong>30 de zile<\/strong>, prelungiri de câte <strong>30<\/strong>, <strong>total max 180 de zile<\/strong><\/td>\n<td><strong>numai judecătorul<\/strong>, numai în procesul penal<\/td>\n<\/tr>\n<tr>\n<td>Verificarea arestării la judecată<\/td>\n<td>cel mult la <strong>60 de zile<\/strong><\/td>\n<td>instanța<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Persoana reținută e informată <strong>de îndată<\/strong>, <strong>în limba pe care o înțelege<\/strong>. Învinuirea i se comunică <strong>doar în prezența unui avocat<\/strong>.<\/li>\n<li><strong>Prezumția de nevinovăție:<\/strong> ești nevinovat până la <strong>hotărârea definitivă<\/strong> de condamnare.<\/li>\n<li>Pedeapsa cu închisoarea poate fi <strong>doar de natură penală<\/strong>.<\/li>\n<li><strong>Dreptul la apărare:<\/strong> avocat <strong>ales sau numit din oficiu<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>24 – 30 – 180 – 60<\/strong>: 24 h reținere, 30 de zile arest, 180 total, verificare la 60.<\/p><\/aside>"}, {"t": "Casa, corespondența, conștiința (art. 25–31)", "h": "<ul>\n<li><strong>Domiciliul este inviolabil.<\/strong> Nimeni nu intră fără voia ta. <strong>4 excepții<\/strong> prevăzute de lege:\n  1. executarea unui <strong>mandat de arestare<\/strong> sau a unei <strong>hotărâri judecătorești<\/strong>;\n  2. înlăturarea unei <strong>primejdii<\/strong> pentru viață sau bunuri;\n  3. apărarea <strong>securității naționale<\/strong> sau a <strong>ordinii publice<\/strong>;\n  4. prevenirea unei <strong>epidemii<\/strong>.<\/li>\n<li><strong>Percheziția<\/strong> o dispune <strong>judecătorul<\/strong>. ⚠️ <strong>Noaptea e interzisă<\/strong>, cu excepția <strong>delictului flagrant<\/strong>.<\/li>\n<li><strong>Secretul corespondenței:<\/strong> scrisori, telegrame, <strong>convorbiri telefonice<\/strong> = inviolabile.<\/li>\n<li><strong>Libertatea conștiinței:<\/strong> cultele sunt libere și <strong>autonome<\/strong>. Statul sprijină <strong>asistența religioasă în armată<\/strong>, spitale, penitenciare.<\/li>\n<li><strong>Libertatea de exprimare:<\/strong> <strong>cenzura de orice fel este interzisă<\/strong>. Sunt interzise: <strong>defăimarea țării<\/strong>, <strong>îndemnul la război de agresiune<\/strong>, la ură, la separatism teritorial.<\/li>\n<li><strong>Dreptul la informație<\/strong> nu trebuie să afecteze <strong>protecția tinerilor<\/strong> sau <strong>securitatea națională<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Flagrant delict<\/strong> = „prins cu mâța în sac”. Dacă poliția vede infracțiunea în timp ce se petrece, poate intra și noaptea.<\/p><\/aside>"}, {"t": "Vârstele din Constituție (art. 36, 37, 49, 55)", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 150\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Vârstele din Constituție\">\n  <line x1=\"15\" y1=\"70\" x2=\"390\" y2=\"70\" class=\"s-mut\" stroke-width=\"2\"/>\n  <g class=\"f-acc\"><circle cx=\"40\" cy=\"70\" r=\"7\"/><circle cx=\"120\" cy=\"70\" r=\"7\"/><circle cx=\"155\" cy=\"70\" r=\"7\"/><circle cx=\"245\" cy=\"70\" r=\"7\"/><circle cx=\"315\" cy=\"70\" r=\"7\"/><circle cx=\"350\" cy=\"70\" r=\"7\"/><\/g>\n  <g text-anchor=\"middle\" class=\"t-m t-b t-l\"><text x=\"40\" y=\"52\">15<\/text><text x=\"120\" y=\"52\">18<\/text><text x=\"155\" y=\"40\">20<\/text><text x=\"245\" y=\"52\">23<\/text><text x=\"315\" y=\"52\">33<\/text><text x=\"350\" y=\"40\">35<\/text><\/g>\n  <g text-anchor=\"middle\" style=\"font-size:12px\"><text x=\"40\" y=\"96\">angajare<\/text><text x=\"40\" y=\"111\">permisă<\/text>\n  <text x=\"120\" y=\"96\">vot<\/text><text x=\"168\" y=\"125\" class=\"t-amb\">20–35: încorporare<\/text>\n  <text x=\"245\" y=\"96\">deputat<\/text><text x=\"315\" y=\"96\">senator<\/text><text x=\"356\" y=\"114\">Președinte<\/text><\/g>\n<\/svg><figcaption>Vârstele care apar la grilă, pe o singură axă.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Vârsta<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Votezi<\/strong><\/td>\n<td><strong>18 ani<\/strong> (împliniți până în ziua alegerilor inclusiv)<\/td>\n<\/tr>\n<tr>\n<td><strong>Deputat<\/strong> sau consilier/primar<\/td>\n<td><strong>23 de ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Senator<\/strong><\/td>\n<td><strong>33 de ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Președinte<\/strong><\/td>\n<td><strong>35 de ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Interzis ca salariat<\/strong><\/td>\n<td>sub <strong>15 ani<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Încorporare<\/strong> (armată)<\/td>\n<td>între <strong>20 și 35 de ani<\/strong> (excepție: voluntarii)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>18 – 23 – 33 – 35<\/strong>: votezi la 18, deputat la 23, senator la 33, Președinte la 35.<\/p><\/aside>"}, {"t": "Asociere, muncă, proprietate (art. 39–53)", "h": "<ul>\n<li><strong>Întrunirile<\/strong> sunt libere, dar <strong>pașnice și fără arme<\/strong>.<\/li>\n<li><strong>Partidele:<\/strong> ⚠️ <strong>NU pot face parte din partide<\/strong>: judecătorii Curții Constituționale, <strong>Avocatul Poporului<\/strong>, <strong>magistrații<\/strong>, <strong>militarii activi<\/strong>, <strong>polițiștii<\/strong>. <strong>Asociațiile secrete sunt interzise.<\/strong><\/li>\n<li><strong>Munca:<\/strong> ziua de lucru are <strong>în medie cel mult 8 ore<\/strong>. La muncă egală, salariu egal.<\/li>\n<li><strong>Nu e muncă forțată:<\/strong> serviciul <strong>militar<\/strong>, munca condamnatului, munca la <strong>calamități<\/strong>.<\/li>\n<li><strong>Proprietatea:<\/strong> exproprierea doar pentru <strong>utilitate publică<\/strong>, cu <strong>dreaptă și prealabilă despăgubire<\/strong>. ⚠️ <strong>Averea dobândită licit nu poate fi confiscată<\/strong>, iar <strong>caracterul licit se prezumă<\/strong>.<\/li>\n<li><strong>Căsătoria religioasă<\/strong> se face <strong>numai după cea civilă<\/strong>.<\/li>\n<li><strong>Petițiile<\/strong> sunt <strong>scutite de taxă<\/strong>.<\/li>\n<li><strong>Erorile judiciare:<\/strong> răspunde <strong>statul<\/strong>.<\/li>\n<li><strong>Restrângerea unui drept:<\/strong> ⚠️ <strong>numai prin lege<\/strong>, numai dacă e <strong>necesară<\/strong>, <strong>proporțională<\/strong>, <strong>nediscriminatorie<\/strong> și fără să distrugă dreptul. Motive: securitate națională, ordine, sănătate, morală, instrucție penală, calamități.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>„Caracterul licit se prezumă”<\/strong>: statul trebuie să <strong>dovedească<\/strong> că ai furat ceva, nu tu că l-ai câștigat cinstit.<\/p><\/aside>"}, {"t": "Îndatoririle fundamentale (art. 54–57)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Art.<\/th>\n<th>Îndatorirea<\/th>\n<th>De reținut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>54<\/td>\n<td><strong>Fidelitatea față de țară<\/strong><\/td>\n<td>e <strong>sacră<\/strong>. Militarii <strong>depun jurământ<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>55<\/td>\n<td><strong>Apărarea țării<\/strong><\/td>\n<td>este un <strong>drept și o obligație<\/strong>. Încorporare <strong>20–35 de ani<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td>56<\/td>\n<td><strong>Contribuții financiare<\/strong><\/td>\n<td>impozite și taxe; alte prestații doar în situații excepționale<\/td>\n<\/tr>\n<tr>\n<td>57<\/td>\n<td><strong>Exercitarea drepturilor<\/strong><\/td>\n<td><strong>cu bună-credință<\/strong>, fără să-i lezezi pe alții<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>F-A-C-B<\/strong> → <strong>F<\/strong>idelitate, <strong>A<\/strong>părare, <strong>C<\/strong>ontribuții, <strong>B<\/strong>ună-credință.<\/p><\/aside>"}, {"t": "Președintele și armata (art. 92, 93) – cel mai important", "h": "<p><strong>Președintele României<\/strong> este:<\/p>\n<ul>\n<li><strong>comandantul forțelor armate<\/strong>;<\/li>\n<li><strong>președintele CSAT<\/strong> (Consiliul Suprem de Apărare a Țării).<\/li>\n<\/ul>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Termenele Parlamentului\">\n  <g class=\"f-paper s-ink\" stroke-width=\"1.5\"><rect x=\"8\" y=\"10\" width=\"122\" height=\"150\" rx=\"10\"/><rect x=\"139\" y=\"10\" width=\"122\" height=\"150\" rx=\"10\"/><rect x=\"270\" y=\"10\" width=\"122\" height=\"150\" rx=\"10\"/><\/g>\n  <rect x=\"8\" y=\"10\" width=\"122\" height=\"34\" rx=\"10\" class=\"f-res\"/><rect x=\"139\" y=\"10\" width=\"122\" height=\"34\" rx=\"10\" class=\"f-ams\"/><rect x=\"270\" y=\"10\" width=\"122\" height=\"34\" rx=\"10\" class=\"f-acs\"/>\n  <g text-anchor=\"middle\" class=\"t-b\"><text x=\"69\" y=\"32\" class=\"t-red\">AGRESIUNE<\/text><text x=\"200\" y=\"32\" class=\"t-amb\">ASEDIU/URGENȚĂ<\/text><text x=\"331\" y=\"32\" class=\"t-acc\">APROBARE<\/text><\/g>\n  <g text-anchor=\"middle\" class=\"t-m t-b\" style=\"font-size:34px\"><text x=\"69\" y=\"96\">24h<\/text><text x=\"200\" y=\"96\">48h<\/text><text x=\"331\" y=\"96\">5 zile<\/text><\/g>\n  <g text-anchor=\"middle\" style=\"font-size:12px\"><text x=\"69\" y=\"122\">Parlamentul<\/text><text x=\"69\" y=\"138\">se convoacă<\/text>\n  <text x=\"200\" y=\"122\">Parlamentul<\/text><text x=\"200\" y=\"138\">se convoacă<\/text>\n  <text x=\"331\" y=\"122\">mobilizare excepț.<\/text><text x=\"331\" y=\"138\">și asediu/urgență<\/text><\/g>\n  <text x=\"200\" y=\"192\" text-anchor=\"middle\" class=\"t-b\">Războiul e mai urgent (24 h) decât asediul (48 h).<\/text>\n  <text x=\"200\" y=\"214\" text-anchor=\"middle\" class=\"t-mut\">Mobilizare / război: Parlamentul lucrează tot timpul.<\/text>\n<\/svg><figcaption>Cât timp are Parlamentul să reacționeze în fiecare situație.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Situația<\/th>\n<th>Ce face Președintele<\/th>\n<th>Termenul<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Mobilizare<\/strong><\/td>\n<td>o declară <strong>cu aprobarea prealabilă a Parlamentului<\/strong><\/td>\n<td><strong>în cazuri excepționale<\/strong>, aprobarea poate veni <strong>după<\/strong>, în <strong>max 5 zile<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Agresiune armată<\/strong><\/td>\n<td>ia măsuri și anunță <strong>imediat<\/strong> Parlamentul<\/td>\n<td>Parlamentul se convoacă <strong>în 24 de ore<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Mobilizare / război<\/strong><\/td>\n<td>—<\/td>\n<td>Parlamentul <strong>lucrează tot timpul<\/strong>; dacă nu e în sesiune, se convoacă în <strong>24 de ore<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Stare de asediu / urgență<\/strong><\/td>\n<td>o <strong>instituie<\/strong> el<\/td>\n<td>cere încuviințarea în <strong>max 5 zile<\/strong>; Parlamentul se convoacă în <strong>max 48 de ore<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Capcana:<\/strong> <strong>războiul e mai urgent (24 h)<\/strong> decât <strong>asediul/urgența (48 h)<\/strong>. <strong>5 zile<\/strong> = termenul pentru <strong>aprobarea<\/strong> Parlamentului.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>E ca la pompieri: la <strong>incendiu<\/strong> (agresiune) vin în <strong>24 h<\/strong>, la o <strong>inundație anunțată<\/strong> (asediu/urgență) au <strong>48 h<\/strong>, iar hârtiile (aprobarea) le semnează în <strong>5 zile<\/strong>.<\/p><\/aside>"}, {"t": "Forțele armate și CSAT (art. 118, 119)", "h": "<p><strong>Armata (art. 118):<\/strong><\/p>\n<ul>\n<li>e subordonată <strong>exclusiv voinței poporului<\/strong>;<\/li>\n<li>garantează <strong>suveranitatea, independența, unitatea, integritatea teritorială<\/strong> și <strong>democrația constituțională<\/strong>;<\/li>\n<li>participă la <strong>apărarea colectivă<\/strong> (NATO) și la misiuni de <strong>pace<\/strong>;<\/li>\n<li>structura apărării și <strong>statutul cadrelor militare<\/strong> se stabilesc prin <strong>lege organică<\/strong>;<\/li>\n<li>⚠️ activitățile militare sau paramilitare <strong>în afara unei autorități statale<\/strong> sunt <strong>interzise<\/strong>;<\/li>\n<li><strong>trupele străine<\/strong> intră, staționează sau trec <strong>numai<\/strong> în condițiile <strong>legii<\/strong> sau ale <strong>tratatelor<\/strong>.<\/li>\n<\/ul>\n<p><strong>CSAT (art. 119)<\/strong> = organismul care <strong>organizează și coordonează unitar<\/strong> activitățile privind <strong>apărarea țării și securitatea națională<\/strong>.<\/p>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Cine conduce ce:<\/strong> <strong>Președintele<\/strong> comandă armata și conduce CSAT. <strong>CSAT<\/strong> coordonează apărarea. <strong>Parlamentul<\/strong> aprobă mobilizarea și stările excepționale.<\/p><\/aside>"}], "flash": [["Ce fel de stat este România (art. 1)?", "<b>Național, suveran și independent, unitar și indivizibil<\/b>. Republică."], ["Cui aparține suveranitatea?", "<b>Poporului român<\/b> (prin organe alese și referendum)."], ["Teritoriul României este…?", "<b>Inalienabil<\/b>. Frontierele se stabilesc prin lege organică."], ["Ordinea culorilor drapelului, de la lance?", "<b>Albastru – galben – roșu<\/b>, vertical."], ["Ziua națională? Imnul?", "<b>1 Decembrie<\/b>. <b>„Deșteaptă-te, române!”<\/b>"], ["Tratat contrar Constituției?", "Se ratifică <b>numai după revizuirea Constituției<\/b>."], ["Legea retroactivează?", "Nu. <b>Excepție:<\/b> legea penală sau contravențională <b>mai favorabilă<\/b>."], ["Cine poate ocupa funcții publice civile sau militare?", "Cei cu <b>cetățenia română și domiciliul în țară<\/b>."], ["Poate fi expulzat un cetățean român?", "<b>Nu.<\/b> Poate fi doar extrădat, pe bază de convenții și reciprocitate. Decide justiția."], ["Reținerea durează maximum…?", "<b>24 de ore<\/b>."], ["Arestarea preventivă în urmărirea penală?", "<b>30 de zile<\/b>, prelungiri de câte 30, <b>total max 180 de zile<\/b>. O dispune <b>doar judecătorul<\/b>."], ["Pedeapsa cu moartea?", "<b>Interzisă.<\/b>"], ["Cine dispune percheziția? Se poate noaptea?", "<b>Judecătorul<\/b>. Noaptea <b>nu<\/b>, cu excepția <b>delictului flagrant<\/b>."], ["Cenzura?", "<b>Interzisă<\/b>, de orice fel."], ["Vârsta: vot / deputat / senator / Președinte?", "<b>18 / 23 / 33 / 35<\/b>"], ["Cine NU poate face parte din partide?", "Judecătorii CCR, Avocatul Poporului, magistrații, <b>militarii activi<\/b>, polițiștii."], ["Ziua de lucru?", "În medie <b>max 8 ore<\/b>."], ["Angajare ca salariat sub ce vârstă e interzisă?", "Sub <b>15 ani<\/b>."], ["Averea dobândită licit?", "<b>Nu poate fi confiscată<\/b>; caracterul licit <b>se prezumă<\/b>."], ["Căsătoria religioasă?", "<b>Numai după cea civilă<\/b>."], ["Restrângerea unui drept se face…?", "<b>Numai prin lege<\/b>, dacă e necesară și proporțională."], ["Încorporarea, între ce vârste?", "<b>20 și 35 de ani<\/b> (exceptând voluntarii)."], ["Fidelitatea față de țară este…?", "<b>Sacră<\/b>. Militarii depun jurământ."], ["Cine e comandantul forțelor armate?", "<b>Președintele României<\/b>, care conduce și CSAT."], ["Mobilizarea se declară…?", "De Președinte, <b>cu aprobarea prealabilă a Parlamentului<\/b>. Excepțional, aprobarea vine în <b>max 5 zile<\/b>."], ["Agresiune armată – în cât timp se convoacă Parlamentul?", "<b>24 de ore<\/b>."], ["Stare de asediu/urgență – termenele?", "Încuviințare în <b>5 zile<\/b>; Parlamentul se convoacă în <b>48 de ore<\/b>."], ["Armata e subordonată exclusiv…?", "<b>Voinței poporului<\/b>."], ["Trupe străine pe teritoriul României?", "<b>Numai<\/b> în condițiile legii sau ale tratatelor."], ["Ce face CSAT?", "<b>Organizează și coordonează unitar<\/b> apărarea țării și securitatea națională."]], "q": [{"id": "L01-001", "p": 1, "q": "Potrivit Constituției, România este stat:", "o": ["național, suveran și federal", "suveran, independent și confederal", "unitar, divizibil în regiuni autonome", "național, suveran și independent, unitar și indivizibil"], "a": 3, "e": "Art. 1 alin. (1)."}, {"id": "L01-002", "p": 1, "q": "Forma de guvernământ a statului român este:", "o": ["republica federală", "republica", "republica prezidențială federativă", "monarhia constituțională"], "a": 1, "e": "Art. 1 alin. (2)."}, {"id": "L01-004", "p": 1, "q": "Suveranitatea națională aparține:", "o": ["Președintelui României", "Parlamentului României", "Guvernului și Parlamentului împreună", "poporului român"], "a": 3, "e": "Art. 2 alin. (1). Poporul o exercită prin organele reprezentative și prin referendum."}, {"id": "L01-007", "p": 1, "q": "Teritoriul României este:", "o": ["alienabil prin lege organică", "inalienabil doar în timp de război", "inalienabil", "divizibil prin referendum"], "a": 2, "e": "Art. 3 alin. (1)."}, {"id": "L01-015", "p": 1, "q": "Drapelul României este tricolor, culorile fiind așezate vertical, în ordinea următoare începând de la lance:", "o": ["albastru, galben, roșu", "albastru, roșu, galben", "galben, albastru, roșu", "roșu, galben, albastru"], "a": 0, "e": "Art. 12 alin. (1)."}, {"id": "L01-016", "p": 1, "q": "Ziua națională a României este:", "o": ["1 Decembrie", "10 Mai", "26 Iunie", "24 Ianuarie"], "a": 0, "e": "Art. 12 alin. (2)."}, {"id": "L01-027", "p": 1, "q": "Reținerea unei persoane nu poate depăși:", "o": ["72 de ore", "48 de ore", "24 de ore", "30 de zile"], "a": 2, "e": "Art. 23 alin. (3)."}, {"id": "L01-028", "p": 1, "q": "Arestarea preventivă se dispune:", "o": ["de comandantul unității, pentru militari", "de judecător și numai în cursul procesului penal", "de poliție, pentru maximum 24 de ore", "de procuror, în orice moment"], "a": 1, "e": "Art. 23 alin. (4)."}, {"id": "L01-029", "p": 1, "q": "În cursul urmăririi penale, arestarea preventivă se poate dispune pentru cel mult ... și nu poate depăși în total ...", "o": ["30 de zile; 180 de zile", "30 de zile; 60 de zile", "24 de ore; 30 de zile", "60 de zile; 120 de zile"], "a": 0, "e": "Art. 23 alin. (5). Prelungirea se face cu câte cel mult 30 de zile."}, {"id": "L01-036", "p": 1, "q": "Percheziția pe timp de noapte:", "o": ["este permisă oricând cu aprobarea procurorului", "este interzisă, cu excepția delictului flagrant", "este permisă numai în cazul militarilor", "este permisă doar în stare de urgență"], "a": 1, "e": "Art. 27 alin. (4)."}, {"id": "L01-042", "p": 1, "q": "Dreptul de vot se exercită de la vârsta de:", "o": ["16 ani", "18 ani, împliniți până la începutul anului electoral", "21 de ani", "18 ani, împliniți până în ziua alegerilor inclusiv"], "a": 3, "e": "Art. 36 alin. (1)."}, {"id": "L01-043", "p": 1, "q": "Vârsta minimă pentru a fi ales în Senat este:", "o": ["30 de ani", "35 de ani", "33 de ani", "23 de ani"], "a": 2, "e": "Art. 37 alin. (2)."}, {"id": "L01-044", "p": 1, "q": "Vârsta minimă pentru a fi ales Președinte al României este:", "o": ["40 de ani", "35 de ani", "30 de ani", "33 de ani"], "a": 1, "e": "Art. 37 alin. (2)."}, {"id": "L01-047", "p": 1, "q": "Care dintre următoarele categorii NU poate face parte din partide politice, potrivit art. 40 alin. (3)?", "o": ["pensionarii militari", "funcționarii din administrația locală aleși", "membrii activi ai armatei", "studenții instituțiilor civile de învățământ"], "a": 2, "e": "Art. 40 alin. (3): judecătorii CCR, avocații poporului, magistrații, membrii activi ai armatei, polițiștii și alte categorii stabilite prin lege organică."}, {"id": "L01-060", "p": 1, "q": "Potrivit art. 55, cetățenii pot fi încorporați:", "o": ["de la 18 ani până la 40 de ani", "de la 20 de ani până la 45 de ani, inclusiv voluntarii", "de la 18 ani până la 35 de ani", "de la vârsta de 20 de ani și până la vârsta de 35 de ani, cu excepția voluntarilor"], "a": 3, "e": "Art. 55 alin. (3)."}, {"id": "L01-063", "p": 1, "q": "Comandantul forțelor armate ale României este:", "o": ["șeful Statului Major al Apărării", "ministrul apărării naționale", "prim-ministrul", "Președintele României"], "a": 3, "e": "Art. 92 alin. (1)."}, {"id": "L01-064", "p": 1, "q": "Funcția de președinte al Consiliului Suprem de Apărare a Țării este îndeplinită de:", "o": ["ministrul apărării naționale", "prim-ministrul", "președintele Senatului", "Președintele României"], "a": 3, "e": "Art. 92 alin. (1)."}, {"id": "L01-065", "p": 1, "q": "Mobilizarea parțială sau totală a forțelor armate se declară de Președinte:", "o": ["prin decret, fără nicio aprobare", "cu aprobarea prealabilă a Parlamentului", "la propunerea șefului Statului Major al Apărării", "cu avizul Guvernului, fără aprobarea Parlamentului"], "a": 1, "e": "Art. 92 alin. (2)."}, {"id": "L01-066", "p": 1, "q": "În cazuri excepționale, hotărârea Președintelui privind mobilizarea se supune ulterior aprobării Parlamentului în cel mult:", "o": ["48 de ore de la adoptare", "5 zile de la adoptare", "24 de ore de la adoptare", "10 zile de la adoptare"], "a": 1, "e": "Art. 92 alin. (2)."}, {"id": "L01-067", "p": 1, "q": "În caz de agresiune armată îndreptată împotriva țării, dacă Parlamentul nu se află în sesiune, acesta se convoacă de drept în:", "o": ["48 de ore de la declanșarea agresiunii", "24 de ore de la declanșarea agresiunii", "5 zile de la declanșarea agresiunii", "72 de ore de la declanșarea agresiunii"], "a": 1, "e": otecția statului român și trebuie să-și îndeplinească obligațiile, cu excepția celor incompatibile cu absența din țară"], "a": 3, "e": "Art. 17."}, {"id": "L01-025", "p": 3, "q": "Jurisdicțiile speciale administrative sunt:", "o": ["facultative și gratuite", "facultative și cu taxă", "obligatorii și cu taxă", "obligatorii și gratuite"], "a": 0, "e": "Art. 21 alin. (4)."}, {"id": "L01-030", "p": 3, "q": "În faza de judecată, instanța este obligată să verifice periodic legalitatea și temeinicia arestării preventive:", "o": ["nu mai târziu de 60 de zile", "nu mai târziu de 180 de zile", "numai la cererea inculpatului", "nu mai târziu de 30 de zile"], "a": 0, "e": "Art. 23 alin. (6)."}, {"id": "L01-031", "p": 3, "q": "Învinuirea se aduce la cunoștința persoanei reținute sau arestate:", "o": ["în cel mai scurt termen, numai în prezența unui avocat ales sau numit din oficiu", "numai la prima înfățișare în instanță", "în 48 de ore, fără prezența avocatului", "în scris, prin poștă"], "a": 0, "e": "Art. 23 alin. (8)."}, {"id": "L01-033", "p": 3, "q": "Sancțiunea privativă de libertate poate fi:", "o": ["de natură penală sau disciplinară", "de natură administrativă, dacă o decide prefectul", "numai de natură penală", "de natură penală sau contravențională"], "a": 2, "e": "Art. 23 alin. (13)."}, {"id": "L01-037", "p": 3, "q": "Care dintre următoarele este garantat ca inviolabil de art. 28 (secretul corespondenței)?", "o": ["registrele publice", "declarațiile de avere", "convorbirile telefonice", "datele publicate pe site-urile publice"], "a": 2, "e": "Art. 28 – scrisori, telegrame, trimiteri poștale, convorbiri telefonice și alte mijloace legale de comunicare."}, {"id": "L01-038", "p": 3, "q": "Potrivit art. 29, statul sprijină cultele religioase inclusiv prin înlesnirea asistenței religioase în:", "o": ["numai în instituțiile publice centrale", "numai în școli", "armată, spitale, penitenciare, aziluri și orfelinate", "în partidele politice"], "a": 2, "e": "Art. 29 alin. (5)."}, {"id": "L01-041", "p": 3, "q": "Dreptul la informație nu trebuie să prejudicieze:", "o": ["interesele partidelor politice", "activitatea comercială a firmelor", "imaginea autorităților publice", "măsurile de protecție a tinerilor sau securitatea națională"], "a": 3, "e": "Art. 31 alin. (3)."}, {"id": "L01-046", "p": 3, "q": "Întrunirile (mitingurile, demonstrațiile, procesiunile) sunt libere și se pot organiza:", "o": ["oricând, inclusiv cu arme de autoapărare", "numai cu aprobarea Guvernului", "numai de partidele politice", "numai în mod pașnic, fără niciun fel de arme"], "a": 3, "e": "Art. 39."}, {"id": "L01-049", "p": 3, "q": "Durata normală a zilei de lucru este:", "o": ["în medie, de cel mult 8 ore", "de cel mult 10 ore", "de cel mult 12 ore, pentru militari", "de exact 8 ore, fără excepție"], "a": 0, "e": "Art. 41 alin. (3)."}, {"id": "L01-050", "p": 3, "q": "Care dintre următoarele NU constituie muncă forțată, potrivit art. 42?", "o": ["munca impusă unui salariat de angajator fără plată", "munca impusă unui minor de către o firmă privată", "activitățile pentru îndeplinirea îndatoririlor militare", "munca impusă pentru motive politice"], "a": 2, "e": "Art. 42 alin. (2) lit. a)."}, {"id": "L01-051", "p": 3, "q": "Exproprierea se poate face:", "o": ["prin hotărâre a consiliului local, cu despăgubire ulterioară", "numai pentru cauză de utilitate publică, stabilită potrivit legii, cu dreaptă și prealabilă despăgubire", "numai în timp de război", "pentru orice interes al statului, fără despăgubire"], "a": 1, "e": "Art. 44 alin. (3)."}, {"id": "L01-052", "p": 3, "q": "Potrivit art. 44 alin. (8), averea dobândită licit:", "o": ["se prezumă ilicită până la proba contrară", "poate fi confiscată dacă proprietarul nu poate dovedi proveniența", "nu poate fi confiscată, iar caracterul licit al dobândirii se prezumă", "poate fi confiscată în stare de urgență"], "a": 2, "e": "Art. 44 alin. (8)."}, {"id": "L01-053", "p": 3, "q": "Potrivit art. 48, căsătoria religioasă:", "
