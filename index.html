/strong><\/td>\n<\/tr>\n<tr>\n<td>Capacitatea<\/td>\n<td><strong>fixă, rezervată<\/strong><\/td>\n<td><strong>la cerere, statistică<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Eficiență la trafic în rafale<\/td>\n<td><strong>mică<\/strong><\/td>\n<td><strong>mare<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Seamănă cu<\/td>\n<td><strong>comutația de circuite<\/strong><\/td>\n<td><strong>comutația de pachete (circuit virtual)<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: în ATM „asincron” <strong>nu<\/strong> înseamnă start-stop. Înseamnă că celulele <strong>nu au loc fix<\/strong> în timp.<\/p><\/aside>"}, {"t": "X.25 și Frame Relay", "h": "<ul>\n<li><strong>X.25<\/strong> – rețea veche de pachete, cu circuite virtuale și <strong>control al erorilor la fiecare nod<\/strong>. <strong>Lentă, dar sigură<\/strong> pe linii proaste.<\/li>\n<li><strong>Frame Relay<\/strong> – urmașul simplificat: <strong>nu corectează erorile în noduri<\/strong> (le lasă la capete), deci <strong>mai rapid<\/strong>. A apărut odată cu liniile digitale de calitate.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Frame Relay e mai rapid<\/strong> pentru că <strong>nu verifică erorile în fiecare nod<\/strong>.<\/p><\/aside>"}], "flash": [["Ce se face între corespondenți în comutația de circuite?", "O <b>cale rezervată<\/b>, cap la cap, pe toată durata."], ["Cele 3 faze ale comutației de circuite?", "<b>Stabilire – transfer – eliberare<\/b>."], ["Rețeaua telefonică clasică folosește…?", "<b>Comutație de circuite<\/b>."], ["Avantajul circuitelor pentru voce?", "<b>Întârziere mică și constantă<\/b>."], ["Dezavantajul circuitelor la date în rafale?", "Calea e <b>ocupată și în pauze<\/b> → ineficient."], ["„Memorează și retransmite” tot mesajul?", "<b>Comutație de mesaje<\/b> (store-and-forward)."], ["Dezavantaj comutație de mesaje?", "<b>Întârzieri mari și variabile<\/b>, memorie mare în noduri."], ["Exemplu istoric de comutație de mesaje?", "<b>Telegrafia (telex)<\/b>."], ["În comutația de pachete, mesajul este…?", "<b>Împărțit în pachete<\/b> de lungime limitată, cu antet."], ["Avantajul principal al pachetelor?", "<b>Folosire foarte eficientă<\/b> a liniilor (împărțire statistică)."], ["De ce pachetele au întârziere mai mică decât mesajele?", "<b>Bandă rulantă<\/b>: nodul trimite un pachet în timp ce îl primește pe următorul."], ["Datagramă – ce face fiecare pachet?", "Merge <b>independent<\/b>; pot sosi în altă ordine."], ["Circuit virtual – cum merg pachetele?", "Pe <b>aceeași cale<\/b>, <b>în ordine<\/b>."], ["IP folosește…?", "<b>Datagrame<\/b>."], ["Exemple cu circuite virtuale?", "<b>X.25, Frame Relay, ATM<\/b>."], ["Transmisia asincronă (start-stop)?", "<b>Bit de start + bit(i) de stop<\/b> la fiecare caracter."], ["Transmisia sincronă?", "<b>Blocuri lungi<\/b>, ceasuri <b>sincronizate permanent<\/b>."], ["Transmisia plesiocronă?", "Ceasuri <b>aproape<\/b> sincrone → <b>biți de justificare<\/b>."], ["În STM canalul e identificat prin…?", "<b>Poziția (slotul) în cadru<\/b>."], ["Dezavantajul STM?", "Capacitatea e <b>rezervată și când nu se transmite<\/b>."], ["Lungimea celulei ATM?", "<b>53 de octeți<\/b>."], ["Antetul ATM? Payload-ul?", "<b>5 octeți<\/b>; <b>48 de octeți<\/b>."], ["„Asincron” în ATM înseamnă…?", "Celulele <b>nu au poziții fixe<\/b> în timp; se trimit când există date."], ["Identificatorii din antetul ATM?", "<b>VPI<\/b> (cale virtuală) și <b>VCI<\/b> (canal virtual)."], ["De ce celule mici și fixe?", "<b>Comutare rapidă în hardware<\/b> și <b>întârziere mică, previzibilă<\/b>."], ["Stratul care adaptează datele la celule?", "<b>AAL<\/b> (ATM Adaptation Layer)."], ["Clasa ATM cu rată constantă?", "<b>CBR<\/b>."], ["De ce Frame Relay e mai rapid decât X.25?", "<b>Nu corectează erorile în noduri<\/b>."]], "q": [{"id": "S06-001", "p": 1, "q": "În comutația de circuite, între cei doi corespondenți:", "o": ["fiecare pachet urmează o rută independentă", "se stabilește în prealabil o cale rezervată pe toată durata comunicării", "nu se stabilește nicio cale", "mesajul este memorat integral în fiecare nod"], "a": 1, "e": "Comutația de circuite."}, {"id": "S06-003", "p": 1, "q": "Rețeaua telefonică clasică folosește:", "o": ["transmisia asincronă start-stop", "comutația de pachete prin datagrame", "comutația de circuite", "comutația de mesaje"], "a": 2, "e": "Exemplu clasic."}, {"id": "S06-008", "p": 1, "q": "În comutația de pachete, mesajul este:", "o": ["transmis pe o cale rezervată", "transmis integral, ca un singur bloc", "transformat în semnal analogic", "împărțit în pachete de lungime limitată, fiecare cu propriul antet"], "a": 3, "e": "Comutația de pachete."}, {"id": "S06-010", "p": 1, "q": "În varianta datagramă a comutației de pachete:", "o": ["fiecare pachet este rutat independent și pachetele pot sosi în altă ordine", "toate pachetele urmează aceeași cale stabilită în prealabil", "pachetele nu au adresă", "se rezervă o cale fizică"], "a": 0, "e": "Datagramă."}, {"id": "S06-011", "p": 1, "q": "În varianta circuit virtual a comutației de pachete:", "o": ["fiecare pachet urmează o cale diferită", "se stabilește o cale logică, iar toate pachetele urmează aceeași cale și sosesc în ordine", "nu există fază de stabilire a conexiunii", "pachetele conțin întotdeauna adresa completă a destinației"], "a": 1, "e": "Circuit virtual."}, {"id": "S06-019", "p": 1, "q": "Celula ATM are o lungime fixă de:", "o": ["53 de octeți", "64 de octeți", "1500 de octeți", "48 de octeți"], "a": 0, "e": "5 octeți antet + 48 octeți utili."}, {"id": "S06-020", "p": 1, "q": "Antetul unei celule ATM are:", "o": ["48 de octeți", "53 de octeți", "5 octeți", "20 de octeți"], "a": 2, "e": "Celula ATM."}, {"id": "S06-021", "p": 1, "q": "Câmpul de informație utilă (payload) al unei celule ATM are:", "o": ["53 de octeți", "5 octeți", "48 de octeți", "128 de octeți"], "a": 2, "e": "Celula ATM."}, {"id": "S06-022", "p": 1, "q": "Denumirea „asincron” din ATM (Asynchronous Transfer Mode) se referă la faptul că:", "o": ["celulele unei surse nu ocupă poziții fixe, periodice, în timp, ci se transmit numai când există date", "celulele au lungime variabilă", "se transmite caracter cu caracter, cu start-stop", "nu există niciun ceas în rețea"], "a": 0, "e": "ATM – multiplexare statistică."}, {"id": "S06-002", "p": 2, "q": "Fazele unei comunicări prin comutație de circuite sunt:", "o": ["modularea, amplificarea, demodularea", "împachetarea, rutarea, reasamblarea", "stabilirea conexiunii, transferul datelor, eliberarea conexiunii", "eșantionarea, cuantizarea, codarea"], "a": 2, "e": "Comutația de circuite."}, {"id": "S06-004", "p": 2, "q": "Un dezavantaj al comutației de circuite pentru traficul de date în rafale este:", "o": ["întârzierea foarte variabilă", "capacitatea rezervată rămâne neutilizată în pauzele de transmisie", "nodurile au nevoie de memorie foarte mare", "pachetele sosesc în altă ordine"], "a": 1, "e": "Comutația de circuite."}, {"id": "S06-005", "p": 2, "q": "Principalul avantaj al comutației de circuite pentru convorbirile telefonice este:", "o": ["ocolirea automată a nodurilor defecte în timpul convorbirii", "folosirea foarte eficientă a liniilor la trafic în rafale", "nu necesită stabilirea legăturii", "întârzierea mică și constantă după stabilirea legăturii"], "a": 3, "e": "Comutația de circuite."}, {"id": "S06-006", "p": 2, "q": "Tehnica în care întregul mesaj este recepționat și memorat într-un nod, apoi retransmis către nodul următor, se numește:", "o": ["multiplexare în frecvență", "comutație de circuite", "transmisie sincronă", "comutație de mesaje (store-and-forward)"], "a": 3, "e": "Comutația de mesaje."}, {"id": "S06-007", "p": 2, "q": "Un dezavantaj al comutației de mesaje este:", "o": ["imposibilitatea transmiterii de text", "întârzierile mari și variabile și necesarul mare de memorie în noduri", "rezervarea permanentă a căii", "necesitatea fibrei optice"], "a": 1, "e": "Comutația de mesaje."}, {"id": "S06-009", "p": 2, "q": "Avantajul principal al comutației de pachete este:", "o": ["lipsa antetelor", "folosirea eficientă a liniilor, prin partajarea statistică între utilizatori", "întârzierea perfect constantă", "garantarea ordinii pachetelor în orice variantă"], "a": 1, "e": "Comutația de pachete."}, {"id": "S06-012", "p": 2, "q": "Protocolul IP (Internet) folosește comutația de pachete de tip:", "o": ["datagramă (fără conexiune)", "comutație de circuite", "circuit virtual", "comutație de mesaje"], "a": 0, "e": "Exemplu."}, {"id": "S06-013", "p": 2, "q": "Care dintre următoarele tehnologii folosește circuite virtuale?", "o": ["ATM", "Ethernet clasic", "IP", "radiodifuziunea AM"], "a": 0, "e": "ATM, X.25 și Frame Relay sunt orientate pe conexiune."}, {"id": "S06-017", "p": 2, "q": "În modul de transfer sincron (STM), un canal este identificat prin:", "o": ["eticheta din antetul celulei", "poziția intervalului de timp (slot) pe care îl ocupă în cadru", "frecvența purtătoarei", "adresa IP"], "a": 1, "e": "STM."}, {"id": "S06-018", "p": 2, "q": "Dezavantajul principal al modului de transfer sincron (STM) este:", "o": ["celulele au lungime variabilă", "capacitatea alocată unui canal este rezervată chiar dacă sursa nu transmite", "nu poate transmite voce", "nu are ceas"], "a": 1, "e": "STM."}, {"id": "S06-023", "p": 2, "q": "Identificatorii căii virtuale și ai canalului virtual din antetul celulei ATM sunt:", "o": ["VPI și VCI", "TCP și UDP", "IP și MAC", "SSID și BSSID"], "a": 0, "e": "ATM."}, {"id": "S06-014", "p": 3, "q": "În transmisia asincronă (start-stop):", "o": ["se transmite doar semnal analogic", "nu există biți de sincronizare", "datele se transmit în blocuri mari, cu ceasuri permanent sincronizate", "fiecare caracter este încadrat de un bit de start și de unul sau mai mulți biți de stop"], "a": 3, "e": "Transmisia asincronă."}, {"id": "S06-015", "p": 3, "q": "Transmisia în care datele se transmit în blocuri (cadre) lungi, cu ceasurile emițătorului și receptorului permanent sincronizate, se numește:", "o": ["asincronă (start-stop)", "analogică", "plesiocronă", "sincronă"], "a": 3, "e": "Transmisia sincronă."}, {"id": "S06-016", "p": 3, "q": "Transmisia plesiocronă se caracterizează prin:", "o": ["transmiterea fiecărui caracter cu start-stop", "lipsa totală a ceasurilor", "ceasuri perfect sincrone, de la o sursă unică", "ceasuri aproape sincrone (aceeași frecvență nominală, cu mici abateri), compensate prin biți de justificare"], "a": 3, "e": "Plesiocron."}, {"id": "S06-024", "p": 3, "q": "Celulele ATM sunt mici și de lungime fixă pentru a permite:", "o": ["transmisia exclusiv analogică", "comutarea rapidă în hardware și întârzieri mici și previzibile, potrivite pentru voce și video", "eliminarea completă a antetelor", "folosirea antenelor mai scurte"], "a": 1, "e": "ATM."}, {"id": "S06-025", "p": 3, "q": "Stratul ATM care adaptează datele utilizatorului la formatul celulelor se numește:", "o": ["stratul MAC", "AAL (ATM Adaptation Layer)", "stratul fizic", "stratul de aplicație"], "a": 1, "e": "Straturile ATM."}, {"id": "S06-026", "p": 3, "q": "Clasa de serviciu ATM care asigură o rată de transfer constantă (de exemplu pentru voce) este:", "o": ["ABR (Available Bit Rate)", "UBR (Unspecified Bit Rate)", "VBR (Variable Bit Rate)", "CBR (Constant Bit Rate)"], "a": 3, "e": "QoS în ATM."}, {"id": "S06-027", "p": 3, "q": "Comparativ cu X.25, tehnologia Frame Relay este mai rapidă deoarece:", "o": ["folosește comutație de circuite", "folosește celule de 53 de octeți", "folosește doar linii analogice", "nu face corecția erorilor în fiecare nod, ci o lasă la capetele legăturii"], "a": 3, "e": "Frame Relay."}, {"id": "S06-028", "p": 3, "q": "Întârzierea totală mai mică a comutației de pachete față de cea de mesaje se explică prin faptul că:", "o": ["pachetele nu au antet", "se rezervă o cale fizică", "un nod poate retransmite un pachet în timp ce recepționează următorul (pipelining)", "pachetele sunt transmise analogic"], "a": 2, "e": "Comutația de pachete."}]}, {"nr": 12, "id": "medii-transmisie", "t": "Medii de transmisie", "tema": "Medii de transmisie", "parte": "S", "stele": 2, "itemi": "1–2", "timp": "55 min", "sursa": "A. S. Tanenbaum, Rețele de calculatoare, ed. a III-a 1998, pag. 76–92 · ed. a IV-a 2003, pag. 82–98 · T. Rădulescu, Rețele de telecomunicații, 2005, pag. 94–98", "ps": "<p><strong>Prin ce merge semnalul<\/strong>: fire răsucite, cablu coaxial, fibră optică sau aer (radio, microunde, infraroșu, laser). Plus <strong>două formule<\/strong> care spun <strong>câți biți pe secundă<\/strong> încap într-un canal: <strong>Nyquist<\/strong> și <strong>Shannon<\/strong>, și <strong>decibelii<\/strong>. Pică des: <strong>de ce se răsucesc firele<\/strong>, <strong>50 Ω / 75 Ω<\/strong>, <strong>reflexia totală<\/strong> și <strong>calculele simple<\/strong>.<\/p>", "fise": [{"t": "Lărgimea de bandă", "h": "<ul>\n<li>Orice mediu <strong>atenuează<\/strong> frecvențele diferit. Lasă să treacă bine doar un <strong>interval de frecvențe<\/strong> = <strong>lărgimea de bandă B<\/strong>, în <strong>Hz<\/strong>.<\/li>\n<li>Un semnal digital (dreptunghiular) este o <strong>sumă de sinusoide<\/strong> (<strong>Fourier<\/strong>).<\/li>\n<li>Dacă banda e <strong>prea îngustă<\/strong>, semnalul se <strong>deformează<\/strong> și biții nu mai pot fi deosebiți.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Banda e ca <strong>lățimea unei țevi<\/strong>: cu cât e mai lată, cu atât trece mai multă apă (mai mulți biți) pe secundă.<\/p><\/aside>"}, {"t": "Nyquist – canal FĂRĂ zgomot ⚠️", "h": "<p><strong>Debitul maxim = 2 · B · log₂(V)<\/strong> [bit/s]<\/p>\n<ul>\n<li><strong>B<\/strong> = lărgimea de bandă (Hz);<\/li>\n<li><strong>V<\/strong> = câte <strong>niveluri<\/strong> distincte are semnalul.<\/li>\n<\/ul>\n<p>Pentru semnal <strong>binar<\/strong> (V = 2, log₂2 = 1): <strong>D_max = 2B<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>V (niveluri)<\/th>\n<th>log₂V<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>2<\/td>\n<td>1<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>2<\/td>\n<\/tr>\n<tr>\n<td>8<\/td>\n<td>3<\/td>\n<\/tr>\n<tr>\n<td>16<\/td>\n<td>4<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Canal <strong>3 kHz<\/strong>, binar → 2 × 3000 × 1 = <strong>6000 bit/s<\/strong>.\nCu <strong>4 niveluri<\/strong> → 2 × 3000 × 2 = <strong>12.000 bit/s<\/strong>.\nCanal <strong>4 kHz<\/strong>, <strong>8 niveluri<\/strong> → 2 × 4000 × 3 = <strong>24 kbit/s<\/strong>.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Nyquist = „N”o noise<\/strong> (fără zgomot) și are <strong>2<\/strong> în față.<\/p><\/aside>"}, {"t": "Shannon – canal CU zgomot ⚠️", "h": "<p><strong>C = B · log₂(1 + S/N)<\/strong> [bit/s]<\/p>\n<ul>\n<li><strong>S/N<\/strong> = raportul semnal/zgomot, ca <strong>raport de puteri<\/strong> (<strong>nu<\/strong> în dB!).<\/li>\n<li>Dacă ți se dă în dB, îl <strong>transformi întâi<\/strong>: 30 dB → 1000.<\/li>\n<\/ul>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>Exemplul clasic (Tanenbaum):<\/strong> canal telefonic <strong>3000 Hz<\/strong>, <strong>30 dB<\/strong> → S/N = 1000 → C = 3000 × log₂(1001) ≈ 3000 × 9,97 ≈ <strong>30.000 bit/s<\/strong>.<\/p><\/aside><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Canal <strong>1 MHz<\/strong>, <strong>20 dB<\/strong> → S/N = 100 → C = 10⁶ × log₂101 ≈ 10⁶ × 6,66 ≈ <strong>6,66 Mbit/s<\/strong>.<\/p><\/aside>\n<ul>\n<li>⚠️ <strong>Shannon este o limită absolută<\/strong>: <strong>niciun<\/strong> truc de codare nu o poate depăși.<\/li>\n<li><strong>Nyquist<\/strong> = cât poți scoate <strong>fără zgomot<\/strong>. <strong>Shannon<\/strong> = maximul posibil <strong>cu zgomot<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Shannon e ca o <strong>discuție într-un bar gălăgios<\/strong>: cu cât muzica (zgomotul) e mai tare față de vocea ta (semnalul), cu atât poți spune mai puține lucruri pe minut.<\/p><\/aside>"}, {"t": "Decibelii, rapid", "h": "<p><strong>S/N [dB] = 10 · log₁₀(S/N)<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Raport de puteri<\/th>\n<th>dB<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>×2<\/td>\n<td><strong>+3 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>×10<\/td>\n<td><strong>+10 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>×100<\/td>\n<td><strong>+20 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>×1000<\/td>\n<td><strong>+30 dB<\/strong><\/td>\n<\/tr>\n<tr>\n<td>×½<\/td>\n<td><strong>−3 dB<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>dBm<\/strong> = puterea raportată la <strong>1 mW<\/strong>: <strong>0 dBm = 1 mW<\/strong>; <strong>30 dBm = 1 W<\/strong>; <strong>40 dBm = 10 W<\/strong>.<\/li>\n<li><strong>Atenuarea<\/strong> unui cablu se dă în <strong>dB/km<\/strong> (sau dB/100 m). Atenuările în dB <strong>se adună<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Un cablu atenuează <strong>3 dB<\/strong> → ajunge <strong>jumătate<\/strong> din putere (50%).\nStația emite <strong>10 W<\/strong> = 10.000 mW → 10 · log₁₀(10.000) = <strong>40 dBm<\/strong>.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Fiecare zero = 10 dB.<\/strong> 1000 are 3 zerouri → <strong>30 dB<\/strong>. 100 → <strong>20 dB<\/strong>. Iar <strong>3 dB = dublu sau jumătate<\/strong>.<\/p><\/aside>"}, {"t": "Perechea torsadată", "h": "<p><strong>Două fire de cupru izolate, răsucite<\/strong> unul în jurul celuilalt.<\/p>\n<p>⚠️ <strong>De ce se răsucesc?<\/strong> Ca să <strong>reducă interferențele electromagnetice<\/strong> și <strong>diafonia<\/strong> (<em>crosstalk<\/em>, „scurgerea” semnalului între perechi vecine). Perturbațiile induse în cele două fire se <strong>anulează<\/strong>.<\/p>\n<ul>\n<li>Folosire: <strong>bucla locală telefonică<\/strong> și <strong>rețele locale (Ethernet)<\/strong>.<\/li>\n<li><strong>UTP<\/strong> = <strong>neecranată<\/strong> (<em>Unshielded<\/em>): ieftină, cea mai răspândită.<\/li>\n<li><strong>STP<\/strong> = <strong>ecranată<\/strong> (<em>Shielded<\/em>): mai bună la perturbații, mai scumpă.<\/li>\n<li><strong>Cat 3<\/strong> – telefonie, 10 Mbit/s. <strong>Cat 5<\/strong> – <strong>mai multe răsuciri pe cm<\/strong> și izolație mai bună → <strong>100 Mbit/s<\/strong>. <strong>Cat 5e/6<\/strong> → 1 Gbit/s și peste.<\/li>\n<li>Distanța: câțiva <strong>km<\/strong> în analogic; pentru date de mare viteză, ~<strong>100 m<\/strong> (Ethernet).<\/li>\n<li>✅ ieftină, ușor de instalat. ❌ bandă limitată, sensibilă la perturbații, atenuare mare.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>U<\/strong>TP = <strong>U<\/strong>nshielded = fără ecran. <strong>S<\/strong>TP = <strong>S<\/strong>hielded = cu ecran.<\/p><\/aside>"}, {"t": "Cablul coaxial", "h": "<p>Din interior spre exterior: <strong>conductor central<\/strong> de cupru → <strong>izolator (dielectric)<\/strong> → <strong>ecran<\/strong> (tresă / folie) → <strong>manta<\/strong>.<\/p>\n<p><strong>Ecranul<\/strong> îi dă <strong>imunitate mai bună la zgomot<\/strong> și <strong>bandă mai mare<\/strong> decât perechea torsadată.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th><strong>Bandă de bază<\/strong><\/th>\n<th><strong>Bandă largă<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Impedanță<\/td>\n<td><strong>50 Ω<\/strong><\/td>\n<td><strong>75 Ω<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Semnal<\/td>\n<td><strong>digital<\/strong><\/td>\n<td><strong>analogic<\/strong> (cu FDM)<\/td>\n<\/tr>\n<tr>\n<td>Folosire<\/td>\n<td>rețele locale vechi (Ethernet 10Base2/10Base5)<\/td>\n<td><strong>televiziunea prin cablu<\/strong> (CATV)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>75 Ω = televizorul<\/strong> din sufragerie. <strong>50 Ω = digital<\/strong>, rețelele vechi.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>E cablul care intră în <strong>televizor<\/strong> de la cablu TV.<\/p><\/aside>"}, {"t": "Fibra optică – cum funcționează ⚠️", "h": "<p>Informația merge ca <strong>impulsuri de lumină<\/strong>: <strong>1 = lumină<\/strong>, <strong>0 = întuneric<\/strong>.<\/p>\n<p><strong>3 componente:<\/strong><\/p>\n<ol>\n<li><strong>sursa de lumină<\/strong> – <strong>LED<\/strong> sau <strong>dioda laser<\/strong>;<\/li>\n<li><strong>mediul<\/strong> – <strong>fibra<\/strong> de sticlă (sau plastic), foarte subțire;<\/li>\n<li><strong>detectorul<\/strong> – <strong>fotodioda<\/strong>, care transformă lumina în impuls electric.<\/li>\n<\/ol>\n<p><strong>De ce rămâne lumina în fibră?<\/strong> Prin <strong>reflexie totală internă<\/strong>. <strong>Miezul<\/strong> (<em>core<\/em>) are <strong>indicele de refracție mai mare<\/strong> decât <strong>învelișul<\/strong> (<em>cladding<\/em>). O rază care lovește peretele sub un unghi mai mare decât <strong>unghiul critic<\/strong> se <strong>reflectă total<\/strong> și rămâne în miez.<\/p>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 230\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Raza de lumină ricoșează în miezul fibrei optice prin reflexie totală internă\">\n  <text x=\"20\" y=\"24\" class=\"t-b\">sursă (LED / laser)<\/text>\n  <text x=\"380\" y=\"24\" text-anchor=\"end\" class=\"t-b\">detector (fotodiodă)<\/text>\n  <rect x=\"20\" y=\"56\" width=\"360\" height=\"118\" rx=\"6\" class=\"f-bls s-blu\" stroke-width=\"1.5\"/>\n  <rect x=\"20\" y=\"82\" width=\"360\" height=\"66\" class=\"f-paper s-blu\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"74\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-blu t-b\">înveliș · indice de refracție mic<\/text>\n  <text x=\"200\" y=\"166\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-blu t-b\">înveliș · indice de refracție mic<\/text>\n\n  <polyline points=\"20,115 80,84 160,146 240,84 320,146 380,115\" fill=\"none\" class=\"s-amb\" stroke-width=\"3\"/>\n  <text x=\"200\" y=\"118\" text-anchor=\"middle\" style=\"font-size:12px;paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round\" class=\"t-b\">miez · indice de refracție mare<\/text>\n  <g class=\"f-amb\"><circle cx=\"80\" cy=\"84\" r=\"4\"/><circle cx=\"160\" cy=\"146\" r=\"4\"/><circle cx=\"240\" cy=\"84\" r=\"4\"/><circle cx=\"320\" cy=\"146\" r=\"4\"/><\/g>\n  <text x=\"200\" y=\"204\" text-anchor=\"middle\" class=\"t-b t-amb\">reflexie totală internă<\/text>\n  <text x=\"200\" y=\"222\" text-anchor=\"middle\" style=\"font-size:12px\" class=\"t-mut\">raza lovește peretele sub unghi mai mare decât unghiul critic<\/text>\n<\/svg><figcaption>Raza de lumină se lovește de peretele miezului și se întoarce înapoi, iar și iar: reflexia totală internă. Miezul are indice de refracție mai mare decât învelișul.<\/figcaption><\/figure>\n\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>minge de biliard<\/strong> care tot ricoșează de mantinele și merge înainte pe masa lungă.<\/p><\/aside>"}, {"t": "Multimod sau monomod", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Tip<\/th>\n<th>Miezul<\/th>\n<th>Cum merge lumina<\/th>\n<th>Folosire<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Multimod<\/strong><\/td>\n<td>mare (<strong>~50 µm<\/strong>)<\/td>\n<td><strong>multe raze<\/strong> (moduri), la unghiuri diferite → <strong>dispersie modală<\/strong><\/td>\n<td>distanțe <strong>scurte<\/strong>, <strong>LED<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Monomod<\/strong><\/td>\n<td>foarte mic (<strong>~8–10 µm<\/strong>)<\/td>\n<td>practic <strong>în linie dreaptă<\/strong>, <strong>un singur mod<\/strong><\/td>\n<td><strong>distanțe mari<\/strong>, viteze mari, <strong>laser<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Dispersia<\/strong> = impulsurile se <strong>lățesc<\/strong> pe drum și ajung să se suprapună. Limitează viteza și distanța. Soluții: impulsuri speciale (<strong>solitoni<\/strong>), fibră <strong>monomod<\/strong>.<\/li>\n<li><strong>Ferestrele de transmisie<\/strong> (atenuare minimă), în infraroșu: <strong>0,85 µm<\/strong>, <strong>1,30 µm<\/strong>, <strong>1,55 µm<\/strong>. Cea mai mică atenuare: <strong>1,55 µm<\/strong>, ~<strong>0,2 dB/km<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: <strong>dispersia modală<\/strong> apare la <strong>multimod<\/strong>, pentru că razele merg pe drumuri de <strong>lungimi diferite<\/strong> și ajung la momente diferite.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Mono = unu<\/strong>: un singur drum, deci merge <strong>departe<\/strong>.<\/p><\/aside>"}, {"t": "Fibra față de cupru", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>✅ Avantaje fibră<\/th>\n<th>❌ Dezavantaje fibră<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>lărgime de bandă uriașă<\/strong><\/td>\n<td>interfețele (emițătoare/receptoare) sunt <strong>scumpe<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>atenuare foarte mică<\/strong> → repetoare la <strong>zeci de km<\/strong><\/td>\n<td><strong>fragilă<\/strong> la îndoire<\/td>\n<\/tr>\n<tr>\n<td><strong>imună<\/strong> la perturbații electromagnetice (și la fulgere)<\/td>\n<td><strong>un singur sens<\/strong> pe o fibră → trebuie <strong>2 fibre<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>greu de interceptat<\/strong> (nu radiază) → <strong>securitate<\/strong><\/td>\n<td>joncțiunile (sudurile, conectorii) sunt delicate<\/td>\n<\/tr>\n<tr>\n<td><strong>ușoară, subțire<\/strong>, nu se corodează<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>La grilă „avantaj al fibrei” → de obicei <strong>imunitatea la perturbații EM<\/strong> sau <strong>banda uriașă<\/strong>. „Dezavantaj” → <strong>interfețe scumpe<\/strong> / <strong>fragilă<\/strong> / <strong>un singur sens<\/strong>.<\/p><\/aside>"}, {"t": "Mediile fără fir", "h": "<p>Undele se propagă cu <strong>c = 3·10⁸ m/s<\/strong>; <strong>λ · f = c<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Mediu<\/th>\n<th>Ce trebuie să știi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Radio<\/strong> (LF–VHF)<\/td>\n<td><strong>omnidirecțional<\/strong>, <strong>trece prin clădiri<\/strong>. Frecvențele joase urmăresc solul; HF se reflectă pe ionosferă<\/td>\n<\/tr>\n<tr>\n<td><strong>Microunde<\/strong> (&gt; 100 MHz, GHz)<\/td>\n<td><strong>linie dreaptă<\/strong>, <strong>antene parabolice directive<\/strong>, <strong>relee (turnuri)<\/strong> la câteva zeci de km din cauza curburii Pământului; <strong>absorbite de ploaie<\/strong> la frecvențe mari; sensibile la <strong>fading multicale<\/strong>. Folosire: <strong>radioreleu<\/strong>, telefonie la distanță, satelit<\/td>\n<\/tr>\n<tr>\n<td><strong>Infraroșu<\/strong><\/td>\n<td>distanțe <strong>foarte mici<\/strong> (telecomenzi); <strong>nu trece prin pereți<\/strong> → securitate bună într-o cameră<\/td>\n<\/tr>\n<tr>\n<td><strong>Laser în aer liber<\/strong><\/td>\n<td>legătură între <strong>două clădiri<\/strong>, bandă mare, ieftină; <strong>afectat de ploaie, ceață<\/strong> și de curenții de convecție (aer cald)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Spectrul<\/strong>, crescător în frecvență: <strong>radio → microunde → infraroșu → lumină vizibilă → ultraviolet → raze X → raze gamma<\/strong>. Comunicațiile folosesc partea de jos, până la lumina vizibilă.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Infraroșul<\/strong> e <strong>telecomanda televizorului<\/strong>: nu poți schimba canalul din altă cameră, pentru că nu trece prin perete.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p>Spectrul: <strong>„Radioul Mic Inventează Lumini Ultra Xtra Gama”<\/strong>: Radio, Microunde, Infraroșu, Lumină, Ultraviolet, X, Gamma.<\/p><\/aside>"}], "flash": [["Formula Nyquist?", "<b>2 · B · log₂V<\/b> (canal fără zgomot)."], ["3 kHz, semnal binar – debit Nyquist?", "<b>6000 bit/s<\/b>."], ["4 kHz, 8 niveluri – debit Nyquist?", "<b>24 kbit/s<\/b> (2 × 4000 × 3)."], ["Formula Shannon?", "<b>B · log₂(1 + S/N)<\/b> (canal cu zgomot)."], ["30 dB = ce raport de puteri?", "<b>1000<\/b>."], ["20 dB = ?", "<b>100<\/b>."], ["3000 Hz, 30 dB – capacitatea Shannon?", "≈ <b>30.000 bit/s<\/b>."], ["Atenuare 3 dB – cât ajunge?", "≈ <b>jumătate<\/b> din putere."], ["1 W în dBm?", "<b>30 dBm<\/b>."], ["10 W în dBm?", "<b>40 dBm<\/b>."], ["Se poate depăși limita Shannon?", "<b>Nu<\/b>, e limită absolută."], ["De ce se răsucesc firele?", "Ca să <b>reducă interferențele și diafonia<\/b>."], ["UTP?", "Pereche torsadată <b>neecranată<\/b>."], ["Cat 5 față de Cat 3?", "<b>Mai multe răsuciri pe cm<\/b>, izolație mai bună → 100 Mbit/s."], ["Coaxial de bandă de bază?", "<b>50 Ω<\/b>, digital."], ["Coaxial de bandă largă (CATV)?", "<b>75 Ω<\/b>, analogic."], ["Coaxial față de torsadat?", "<b>Imunitate mai bună la zgomot<\/b> și <b>bandă mai mare<\/b>."], ["Cele 3 componente ale sistemului optic?", "<b>Sursă (LED/laser) + fibră + detector (fotodiodă)<\/b>."], ["Ce transformă lumina în semnal electric?", "<b>Fotodioda<\/b>."], ["De ce rămâne lumina în fibră?", "<b>Reflexie totală internă<\/b>."], ["Fibra monomod?", "Miez <b>~8–10 µm<\/b>, un singur mod, <b>distanțe mari<\/b>, laser."], ["De ce apare dispersia modală la multimod?", "Razele merg pe <b>drumuri de lungimi diferite<\/b>."], ["Ferestrele optice?", "<b>0,85 / 1,30 / 1,55 µm<\/b>."], ["Fereastra cu cea mai mică atenuare?", "<b>1,55 µm<\/b> (~0,2 dB/km)."], ["Lățirea impulsurilor de lumină se numește…?", "<b>Dispersie<\/b>."], ["Un avantaj al fibrei?", "<b>Imună la perturbații EM<\/b>, bandă uriașă, greu de interceptat."], ["Un dezavantaj al fibrei?", "<b>Interfețe scumpe<\/b>, fragilă, un singur sens pe fibră."], ["Microundele se propagă…?", "<b>În linie dreaptă<\/b>, cu antene parabolice și relee; absorbite de ploaie."], ["Avantajul de securitate al infraroșului?", "<b>Nu trece prin pereți<\/b>."], ["Laserul în aer liber e afectat de…?", "<b>Ploaie, ceață<\/b>, curenți de convecție."]], "q": [{"id": "S08-001", "p": 1, "q": "Potrivit teoremei lui Nyquist, debitul maxim pe un canal fără zgomot, cu lărgimea de bandă B și V niveluri ale semnalului, este:", "o": ["2 · B · log₂V", "B · log₂(1 + S/N)", "B / 2", "V / (2B)"], "a": 0, "e": "Teorema lui Nyquist."}, {"id": "S08-004", "p": 1, "q": "Potrivit teoremei lui Shannon, capacitatea maximă a unui canal cu zgomot este:", "o": ["C = B · S/N", "C = S/N / B", "C = 2 · B · log₂V", "C = B · log₂(1 + S/N)"], "a": 3, "e": "Teorema lui Shannon."}, {"id": "S08-005", "p": 1, "q": "Un raport semnal/zgomot de 30 dB corespunde unui raport de puteri de:", "o": ["100", "30", "3", "1000"], "a": 3, "e": "10 · log₁₀(1000) = 30 dB."}, {"id": "S08-007", "p": 1, "q": "Un canal telefonic de 3000 Hz are raportul S/N de 30 dB. Capacitatea maximă (Shannon) este de aproximativ:", "o": ["6 kbit/s", "30 kbit/s", "3 kbit/s", "90 kbit/s"], "a": 1, "e": "3000 × log₂(1001) ≈ 30.000 bit/s."}, {"id": "S08-010", "p": 1, "q": "Firele perechii torsadate sunt răsucite pentru a:", "o": ["reduce interferențele electromagnetice și diafonia", "permite transmisia luminii", "reduce greutatea cablului", "crește rezistența mecanică"], "a": 0, "e": "Perechea torsadată."}, {"id": "S08-016", "p": 1, "q": "Un sistem de transmisie pe fibră optică are trei componente:", "o": ["microfonul, emițătorul și antena", "antena, amplificatorul și difuzorul", "sursa de lumină, mediul de transmisie (fibra) și detectorul", "modemul, routerul și switch-ul"], "a": 2, "e": "Fibra optică."}, {"id": "S08-019", "p": 1, "q": "Lumina rămâne în miezul fibrei optice datorită fenomenului de:", "o": ["absorbție", "difracție", "polarizare", "reflexie totală internă"], "a": 3, "e": "Indicele de refracție al miezului este mai mare decât al învelișului."}, {"id": "S08-020", "p": 1, "q": "Fibra optică monomod se caracterizează prin:", "o": ["folosirea exclusivă a LED-urilor", "diametrul mare al miezului (~50 µm) și distanțe scurte", "transmiterea simultană a multor raze la unghiuri diferite", "diametrul foarte mic al miezului (~8–10 µm) și folosirea la distanțe mari"], "a": 3, "e": "Monomod."}, {"id": "S08-024", "p": 1, "q": "Care dintre următoarele este un avantaj al fibrei optice față de cablul de cupru?", "o": ["interfețele foarte ieftine", "comunicarea bidirecțională pe o singură fibră, în mod obișnuit", "rezistența foarte mare la îndoire", "imunitatea la perturbații electromagnetice și dificultatea interceptării"], "a": 3, "e": "Avantajele fibrei."}, {"id": "S08-002", "p": 2, "q": "Un canal fără zgomot de 3 kHz transmite un semnal binar. Debitul maxim (Nyquist) este:", "o": ["12.000 bit/s", "30.000 bit/s", "6000 bit/s", "3000 bit/s"], "a": 2, "e": "2 × 3000 × log₂2 = 6000."}, {"id": "S08-008", "p": 2, "q": "O atenuare de 3 dB înseamnă că la ieșire ajunge aproximativ:", "o": ["jumătate din puterea de la intrare", "dublul puterii", "o treime din putere", "o zecime din putere"], "a": 0, "e": "3 dB ≈ factor 2."}, {"id": "S08-011", "p": 2, "q": "Abrevierea UTP desemnează:", "o": ["cablul coaxial de bandă largă", "perechea torsadată neecranată", "perechea torsadată ecranată", "fibra optică monomod"], "a": 1, "e": "UTP = Unshielded Twisted Pair."}, {"id": "S08-013", "p": 2, "q": "Cablul coaxial de bandă de bază (folosit pentru transmisii digitale) are impedanța de:", "o": ["600 Ω", "50 Ω", "75 Ω", "300 Ω"], "a": 1, "e": "Coaxial."}, {"id": "S08-014", "p": 2, "q": "Cablul coaxial de bandă largă, folosit la televiziunea prin cablu, are impedanța de:", "o": ["75 Ω", "50 Ω", "600 Ω", "120 Ω"], "a": 0, "e": "Coaxial."}, {"id": "S08-018", "p": 2, "q": "Detectorul dintr-un sistem cu fibră optică, care transformă lumina în semnal electric, este:", "o": ["LED-ul", "laserul", "fotodioda", "multiplexorul"], "a": 2, "e": "Fibra optică."}, {"id": "S08-023", "p": 2, "q": "Fereastra optică cu cea mai mică atenuare este cea de:", "o": ["0,85 µm", "1,30 µm", "1,55 µm", "0,40 µm"], "a": 2, "e": "~0,2 dB/km."}, {"id": "S08-025", "p": 2, "q": "Care dintre următoarele este un dezavantaj al fibrei optice?", "o": ["atenuarea foarte mare", "costul ridicat al interfețelor optice și fragilitatea la îndoire", "lărgimea de bandă mică", "sensibilitatea la fulgere"], "a": 1, "e": "Dezavantajele fibrei."}, {"id": "S08-027", "p": 2, "q": "Transmisia prin microunde se caracterizează prin:", "o": ["imunitate totală la ploaie", "trecerea prin munți", "propagare prin reflexie pe ionosferă la mii de km", "propagare în linie dreaptă, antene directive și necesitatea releelor la distanțe mari"], "a": 3, "e": "Microunde."}, {"id": "S08-003", "p": 3, "q": "Un canal fără zgomot de 4 kHz transmite un semnal cu 8 niveluri. Debitul maxim (Nyquist) este:", "o": ["32 kbit/s", "24 kbit/s", "12 kbit/s", "8 kbit/s"], "a": 1, "e": "2 × 4000 × log₂8 = 24.000."}, {"id": "S08-006", "p": 3, "q": "Un raport semnal/zgomot de 20 dB corespunde unui raport de puteri de:", "o": ["20", "10", "1000", "100"], "a": 3, "e": "10 · log₁₀(100) = 20 dB."}, {"id": "S08-009", "p": 3, "q": "O putere de 1 W exprimată în dBm este:", "o": ["0 dBm", "1 dBm", "10 dBm", "30 dBm"], "a": 3, "e": "1 W = 1000 mW → 10 · log₁₀(1000) = 30 dBm."}, {"id": "S08-012", "p": 3, "q": "Comparativ cu categoria 3, cablul torsadat de categoria 5 are:", "o": ["mai multe răsuciri pe unitatea de lungime și izolație mai bună, permițând viteze mai mari", "mai puține răsuciri și viteze mai mici", "miez din sticlă", "ecran din plumb"], "a": 0, "e": "Categorii UTP."}, {"id": "S08-015", "p": 3, "q": "Comparativ cu perechea torsadată, cablul coaxial are:", "o": ["miez din sticlă", "imunitate mai mică la zgomot", "bandă mai îngustă", "ecranare mai bună, deci imunitate mai mare la zgomot și bandă mai largă"], "a": 3, "e": "Coaxial."}, {"id": "S08-017", "p": 3, "q": "Sursa de lumină dintr-un sistem cu fibră optică poate fi:", "o": ["o fotodiodă", "un dipol", "un tranzistor de putere", "un LED sau o diodă laser"], "a": 3, "e": "Fibra optică."}, {"id": "S08-021", "p": 3, "q": "În fibra optică multimod apare fenomenul de dispersie modală deoarece:", "o": ["nu există înveliș", "fibra este din cupru", "lumina se propagă în linie dreaptă", "razele de lumină parcurg drumuri de lungimi diferite (unghiuri diferite)"], "a": 3, "e": "Multimod."}, {"id": "S08-022", "p": 3, "q": "Ferestrele de transmisie folosite în comunicațiile pe fibră optică sunt centrate pe lungimile de undă:", "o": ["1 m, 10 m și 100 m", "30 MHz, 88 MHz și 300 MHz", "0,85 µm, 1,30 µm și 1,55 µm", "400 nm, 500 nm și 600 nm"], "a": 2, "e": "Infraroșu apropiat."}, {"id": "S08-026", "p": 3, "q": "Lățirea impulsurilor de lumină pe măsură ce se propagă prin fibră se numește:", "o": ["polarizare", "multiplexare", "dispersie", "reflexie totală"], "a": 2, "e": "Dispersia limitează viteza și distanța."}, {"id": "S08-028", "p": 3, "q": "Comunicațiile prin infraroșu au avantajul de securitate că:", "o": ["au bătaie de sute de kilometri", "trec prin orice obstacol", "nu trec prin pereți, deci nu „ies” din încăpere", "se reflectă pe ionosferă"], "a": 2, "e": "Infraroșu."}, {"id": "S08-029", "p": 3, "q": "Legătura cu laser în aer liber între două clădiri este afectată în principal de:", "o": ["lungimea cablului", "câmpul magnetic terestru", "ionosferă", "ploaie, ceață și curenții de convecție"], "a": 3, "e": "Undele luminoase."}, {"id": "S08-030", "p": 3, "q": "În ordinea crescătoare a frecvenței, spectrul electromagnetic cuprinde:", "o": ["ultraviolet, lumină vizibilă, radio, infraroșu", "radio, microunde, infraroșu, lumină vizibilă, ultraviolet", "microunde, radio, ultraviolet, infraroșu", "lumină vizibilă, infraroșu, radio, microunde"], "a": 1, "e": "Spectrul EM."}]}, {"nr": 13, "id": "aparare-nationala", "t": "Legea apărării naționale", "tema": "Legea apărării naționale a României nr. 45/1994", "parte": "L", "stele": 2, "itemi": "1–2", "timp": "40 min", "sursa": "Legea nr. 45/1994 a apărării naționale a României – Cap. I (art. 1–4), Cap. II (art. 6–25), Cap. III (art. 26–30), Cap. IV (art. 31–35)", "ps": "<p>Legea răspunde la <strong>4 întrebări<\/strong>: <strong>ce este<\/strong> apărarea națională, <strong>din ce e făcut<\/strong> sistemul de apărare (<strong>4 componente<\/strong>), <strong>cum e organizată armata<\/strong> și <strong>ce face fiecare autoritate<\/strong>. Pică des: <strong>cele 4 componente<\/strong>, <strong>cine conduce<\/strong>, <strong>ce aprobă CSAT<\/strong> și <strong>categoriile de forțe<\/strong>.<\/p>", "fise": [{"t": "Ce este apărarea națională (art. 1–4)", "h": "<p><strong>Art. 1. Apărarea națională<\/strong> = ansamblul de <strong>măsuri și activități<\/strong> ale statului român ca să garanteze:<\/p>\n<ul>\n<li><strong>suveranitatea națională<\/strong>;<\/li>\n<li><strong>independența și unitatea statului<\/strong>;<\/li>\n<li><strong>integritatea teritorială<\/strong> a țării;<\/li>\n<li><strong>democrația constituțională<\/strong>.<\/li>\n<\/ul>\n<p><strong>Art. 2.<\/strong> Apărarea o fac <strong>autoritățile publice<\/strong> prevăzute de lege. ⚠️ Măsurile de apărare sunt <strong>obligatorii pentru toți<\/strong>: cetățeni, instituții publice și private, agenți economici, <strong>indiferent de forma de proprietate<\/strong>.<\/p>\n<p><strong>Art. 3.<\/strong> Normele de apărare se bazează pe: <strong>Constituție<\/strong>, <strong>legile țării<\/strong>, <strong>doctrina militară<\/strong>, <strong>dreptul internațional<\/strong> recunoscut și <strong>tratatele<\/strong> la care România e parte.<\/p>\n<p><strong>Art. 4.<\/strong> La o <strong>agresiune armată de mare amploare<\/strong>, care depășește capacitatea forțelor armate → se mobilizează <strong>toate resursele umane și materiale<\/strong> necesare.<\/p>\n<aside class=\"co co-info\"><div class=\"co-h\">Bine de știut<\/div><p>Există un proiect de lege nouă a apărării, dar bibliografia cere <strong>Legea 45/1994<\/strong>, în forma ei actuală.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană (art. 3): o variantă greșită tipică e ceva care <strong>nu<\/strong> e pe listă (de exemplu „ordinele comandanților” sau „deciziile partidelor”). Lista are doar <strong>Constituția, legile, doctrina militară, dreptul internațional, tratatele<\/strong>.<\/p><\/aside>"}, {"t": "Cele 4 componente ale sistemului (art. 6)", "h": "<p>Sistemul național de apărare are <strong>4 componente<\/strong>:<\/p>\n<ol>\n<li><strong>Conducerea<\/strong>;<\/li>\n<li><strong>Forțele<\/strong>;<\/li>\n<li><strong>Resursele<\/strong>;<\/li>\n<li><strong>Infrastructura teritorială<\/strong>.<\/li>\n<\/ol>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Cele 4 componente ale sistemului național de apărare\">\n  <g class=\"s-acc\" stroke-width=\"2\" stroke-dasharray=\"6 5\"><line x1=\"170\" y1=\"118\" x2=\"120\" y2=\"76\"/><line x1=\"230\" y1=\"118\" x2=\"280\" y2=\"76\"/><line x1=\"170\" y1=\"182\" x2=\"120\" y2=\"224\"/><line x1=\"230\" y1=\"182\" x2=\"280\" y2=\"224\"/><\/g>\n  <circle cx=\"200\" cy=\"150\" r=\"52\" class=\"f-acc\"/>\n  <g text-anchor=\"middle\" class=\"t-b\" style=\"fill:var(--acc-ink);font-size:12px\"><text x=\"200\" y=\"140\" style=\"fill:var(--acc-ink)\">SISTEMUL<\/text><text x=\"200\" y=\"156\" style=\"fill:var(--acc-ink)\">NAȚIONAL DE<\/text><text x=\"200\" y=\"172\" style=\"fill:var(--acc-ink)\">APĂRARE<\/text><\/g>\n  <g stroke-width=\"1.5\">\n    <rect x=\"10\" y=\"10\" width=\"180\" height=\"66\" rx=\"10\" class=\"f-acs s-acc\"/><rect x=\"210\" y=\"10\" width=\"180\" height=\"66\" rx=\"10\" class=\"f-ams s-amb\"/>\n    <rect x=\"10\" y=\"224\" width=\"180\" height=\"66\" rx=\"10\" class=\"f-bls s-blu\"/><rect x=\"210\" y=\"224\" width=\"180\" height=\"66\" rx=\"10\" class=\"f-res s-red\"/>\n  <\/g>\n  <g class=\"t-b\"><text x=\"22\" y=\"32\">1 · CONDUCERE<\/text><text x=\"222\" y=\"32\">2 · FORȚE<\/text><text x=\"22\" y=\"246\">3 · RESURSE<\/text><text x=\"222\" y=\"246\">4 · INFRASTRUCTURĂ<\/text><\/g>\n  <g style=\"font-size:12px\"><text x=\"22\" y=\"50\">Parlament · Președinte<\/text><text x=\"22\" y=\"66\">CSAT · Guvern · MApN<\/text>\n  <text x=\"222\" y=\"50\">forțe armate<\/text><text x=\"222\" y=\"66\">forțe de protecție<\/text>\n  <text x=\"22\" y=\"264\">umane · financiare<\/text><text x=\"22\" y=\"280\">materiale<\/text>\n  <text x=\"222\" y=\"264\">teritorială: lucrări<\/text><text x=\"222\" y=\"280\">și amenajări<\/text><\/g>\n<\/svg><figcaption>Cele 4 componente ale sistemului național de apărare: conducerea, forțele, resursele și infrastructura teritorială.<\/figcaption><\/figure>\n\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>„C-F-R-I”<\/strong>: <strong>C<\/strong>onducere, <strong>F<\/strong>orțe, <strong>R<\/strong>esurse, <strong>I<\/strong>nfrastructură teritorială. Ca <strong>CFR<\/strong> + <strong>I<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca o <strong>echipă de fotbal<\/strong>: are <strong>antrenor<\/strong> (conducerea), <strong>jucători<\/strong> (forțele), <strong>bani și echipament<\/strong> (resursele) și <strong>stadion și terenuri de antrenament<\/strong> (infrastructura).<\/p><\/aside>"}, {"t": "Conducerea (art. 7–9)", "h": "<p><strong>Art. 7.<\/strong> Conducerea se face <strong>exclusiv de autoritățile constituționale<\/strong>:<\/p>\n<ul>\n<li><strong>Parlamentul<\/strong>;<\/li>\n<li><strong>Președintele României<\/strong>;<\/li>\n<li><strong>CSAT<\/strong> (Consiliul Suprem de Apărare a Țării);<\/li>\n<li><strong>Guvernul<\/strong>;<\/li>\n<li><strong>Ministerul Apărării Naționale<\/strong>;<\/li>\n<li><strong>autoritățile administrației publice locale<\/strong> cu atribuții de apărare.<\/li>\n<\/ul>\n<p><strong>Art. 8.<\/strong> <strong>Conducerea strategică militară<\/strong> se face prin <strong>Centrul Național Militar de Comandă<\/strong>. Subordonarea lui și numirea comandantului se schimbă la agresiune, la starea de urgență sau de asediu, la mobilizare ori la război.<\/p>\n<p><strong>Art. 9.<\/strong> <strong>În timp de război<\/strong>, în fiecare <strong>județ<\/strong> și în <strong>municipiul București<\/strong> există un <strong>comandant militar<\/strong>, subordonat Centrului Național Militar de Comandă și numit de șeful acestuia.<\/p>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: „Care NU face parte din conducere?” → caută ceva care <strong>nu e autoritate constituțională<\/strong> de pe listă (de exemplu un partid, un sindicat, o firmă).<\/p><\/aside>"}, {"t": "Forțele (art. 10–13)", "h": "<p>Două grupe:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><strong>Forțele armate<\/strong><\/th>\n<th><strong>Forțele de protecție<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>armata<\/strong><\/td>\n<td><strong>protecția civilă<\/strong><\/td>\n<\/tr>\n<tr>\n<td>trupele și unitățile <strong>Ministerului Afacerilor Interne<\/strong><\/td>\n<td>voluntarii <strong>Crucii Roșii<\/strong><\/td>\n<\/tr>\n<tr>\n<td>forțele <strong>serviciilor de informații<\/strong><\/td>\n<td>alte structuri de protecție<\/td>\n<\/tr>\n<tr>\n<td>alte formațiuni armate prevăzute de lege<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li>Forțele se instruiesc pe spațiul național <strong>terestru, aerian, maritim și fluvial<\/strong>.<\/li>\n<li>Pot folosi terenuri și bunuri <strong>în condițiile legii rechizițiilor<\/strong>, cu obligația de a le <strong>restitui în starea inițială<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Forțele armate<\/strong> se luptă. <strong>Forțele de protecție<\/strong> salvează și ajută populația, ca <strong>pompierii de la protecția civilă<\/strong> sau <strong>Crucea Roșie<\/strong>.<\/p><\/aside>"}, {"t": "Resursele (art. 14–19)", "h": "<ul>\n<li><strong>Art. 14.<\/strong> Resursele sunt: <strong>umane, financiare, materiale<\/strong> și de altă natură.<\/li>\n<li><strong>Art. 15.<\/strong> <strong>Resursele umane<\/strong> = <strong>populația aptă<\/strong> să desfășoare activități de apărare.<\/li>\n<li><strong>Art. 16.<\/strong> ⚠️ Cei apți pentru serviciul militar care <strong>s-au sustras din vina lor<\/strong> <strong>nu pot ocupa funcții de conducere<\/strong> în instituțiile publice.<\/li>\n<li><strong>Art. 17.<\/strong> Demnitarii și conducătorii locali cu atribuții de mobilizare se pregătesc prin grija <strong>Statului Major General<\/strong> (azi <strong>Statul Major al Apărării<\/strong>), pe baza unei <strong>hotărâri a Guvernului<\/strong>.<\/li>\n<li><strong>Art. 18.<\/strong> Celelalte resurse, pregătirea economiei și a teritoriului → prin <strong>legi speciale<\/strong>.<\/li>\n<li><strong>Art. 19.<\/strong> Cheltuielile de apărare se plătesc de la <strong>bugetul de stat<\/strong> și din alte surse legale.<\/li>\n<\/ul>"}, {"t": "Infrastructura teritorială (art. 20–25)", "h": "<ul>\n<li><strong>Art. 20.<\/strong> Infrastructura teritorială = <strong>lucrările și amenajările<\/strong> de pe teritoriu care pot fi folosite pentru apărare.<\/li>\n<li><strong>Art. 21.<\/strong> Pentru <strong>obiective de investiții noi<\/strong> (sau dezvoltarea celor existente) e nevoie de <strong>avizul Statului Major General<\/strong>. Guvernul stabilește care obiective au nevoie de aviz.<\/li>\n<li><strong>Art. 22.<\/strong> La starea de <strong>asediu<\/strong> sau <strong>urgență<\/strong>, la <strong>mobilizare<\/strong> sau <strong>război<\/strong>:<\/li>\n<li>se pot face <strong>rechiziții de bunuri<\/strong>;<\/li>\n<li>cetățenii apți pot fi <strong>chemați la prestări de servicii<\/strong>;<\/li>\n<li>⚠️ <strong>CSAT<\/strong> poate dispune <strong>militarizarea agenților economici<\/strong> care susțin direct efortul de apărare.<\/li>\n<li><strong>Art. 23.<\/strong> Încă <strong>din timp de pace<\/strong> se fac <strong>rezerve<\/strong> de tehnică și materiale. <strong>CSAT aprobă nomenclatorul și nivelul<\/strong> lor; Guvernul reglementează împrospătarea lor.<\/li>\n<li><strong>Art. 24.<\/strong> Pregătirea se verifică prin <strong>exerciții de mobilizare<\/strong>, după un <strong>plan aprobat de CSAT<\/strong>.<\/li>\n<li><strong>Art. 25.<\/strong> <strong>Comenzile pentru apărare<\/strong> se execută <strong>integral și la termen<\/strong>: pe <strong>contract în timp de pace<\/strong> și <strong>cu prioritate în timp de război<\/strong>.<\/li>\n<\/ul>"}, {"t": "Ce decide fiecare – tabelul care pică ⚠️", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Cine<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Militarizarea<\/strong> agenților economici<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Nomenclatorul și nivelul rezervelor<\/strong><\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Planul exercițiilor de mobilizare<\/strong><\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Avizul<\/strong> pentru investiții noi<\/td>\n<td><strong>Statul Major General<\/strong> (azi Statul Major al Apărării)<\/td>\n<\/tr>\n<tr>\n<td>Pregătirea demnitarilor cu atribuții de mobilizare<\/td>\n<td>prin grija <strong>Statului Major General<\/strong>, pe bază de <strong>HG<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Comandantul militar de județ (în război)<\/td>\n<td>numit de <strong>șeful Centrului Național Militar de Comandă<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Conducerea apărării în <strong>județe<\/strong><\/td>\n<td><strong>Guvernul, prin prefecți<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Monografiile economico-militare<\/strong><\/td>\n<td><strong>autoritățile administrației publice locale<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>CSAT = „3 M”<\/strong>: <strong>M<\/strong>ilitarizarea, <strong>M<\/strong>aterialele de rezervă (nomenclatorul), <strong>M<\/strong>obilizarea (planul exercițiilor).<\/p><\/aside>"}, {"t": "Cum e organizată armata (art. 26–30)", "h": "<ul>\n<li><strong>Art. 26.<\/strong> <strong>Armata<\/strong> este <strong>nucleul forțelor armate<\/strong> și unifică activitățile de apărare.<\/li>\n<li><strong>Art. 27.<\/strong> Armata are <strong>3 părți<\/strong>:\n  1. <strong>organele centrale ale MApN<\/strong> (stabilite <strong>prin lege<\/strong>, art. 28);\n  2. <strong>categoriile de forțe<\/strong>;\n  3. <strong>organele militare teritoriale<\/strong>.<\/li>\n<li><strong>Art. 29. Categoriile de forțe<\/strong>: <strong>forțele terestre<\/strong>, <strong>forțele aeriene<\/strong> (aviație și apărare antiaeriană) și <strong>forțele navale<\/strong>.<\/li>\n<li><strong>Art. 30. Organele militare teritoriale<\/strong>: <strong>centrele militare zonale, județene și de sector<\/strong> (în București).<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>3 + 3:<\/strong> armata are <strong>3 părți<\/strong>, iar categoriile de forțe sunt tot <strong>3<\/strong>: <strong>pe uscat, în aer, pe apă<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Centrul militar județean<\/strong> e „ghișeul” armatei din județul tău: acolo se țin evidențele și de acolo se cheamă rezerviștii.<\/p><\/aside>"}, {"t": "Ce face fiecare autoritate (art. 31–35)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Art.<\/th>\n<th>Cine<\/th>\n<th>Ce face<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>31<\/strong><\/td>\n<td>Parlament, Președinte, Guvern, CSAT<\/td>\n<td>atribuțiile de apărare, potrivit <strong>Constituției și legilor<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>32<\/strong><\/td>\n<td><strong>Guvernul<\/strong><\/td>\n<td>organizează apărarea, coordonează ministerele, alocă fonduri, stabilește obligațiile economiei pentru război, constituie rezervele, conduce activitatea din județe <strong>prin prefecți<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>33<\/strong><\/td>\n<td><strong>MApN<\/strong><\/td>\n<td>transpune politica de apărare în acțiuni militare, <strong>pregătește forțele<\/strong>, <strong>planifică și conduce mobilizarea<\/strong> armatei, controlează pregătirea altor instituții<\/td>\n<\/tr>\n<tr>\n<td><strong>34<\/strong><\/td>\n<td>ministerele, serviciile de informații<\/td>\n<td>aplică măsurile în domeniul lor; la mobilizare și război alocă resursele <strong>cu prioritate pentru apărare<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>35<\/strong><\/td>\n<td><strong>autoritățile locale<\/strong><\/td>\n<td>execută <strong>rechizițiile<\/strong> și <strong>chemările la prestări de servicii<\/strong>, țin la zi <strong>monografiile economico-militare<\/strong>, dau spații <strong>centrelor militare<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}], "flash": [["Apărarea națională garantează…?", "<b>Suveranitatea, independența și unitatea statului, integritatea teritorială, democrația constituțională<\/b>."], ["Măsurile de apărare sunt obligatorii pentru…?", "<b>Toți<\/b>: cetățeni, instituții publice și private, agenți economici, <b>indiferent de proprietate<\/b>."], ["Pe ce se bazează normele de apărare?", "<b>Constituție, legi, doctrina militară, drept internațional, tratate<\/b>."], ["La agresiune de mare amploare?", "Se mobilizează <b>toate resursele umane și materiale<\/b>."], ["Cele 4 componente ale sistemului de apărare?", "<b>Conducere, forțe, resurse, infrastructură teritorială<\/b>."], ["Cine conduce sistemul național de apărare?", "<b>Exclusiv autoritățile constituționale<\/b>."], ["Autoritățile din conducere?", "<b>Parlament, Președinte, CSAT, Guvern, MApN, autorități locale<\/b> cu atribuții de apărare."], ["Prin ce se face conducerea strategică militară?", "<b>Centrul Național Militar de Comandă<\/b>."], ["În război, în fiecare județ există…?", "Un <b>comandant militar<\/b>."], ["Forțele sistemului de apărare?", "<b>Forțele armate<\/b> și <b>forțele de protecție<\/b>."], ["Din forțele de protecție fac parte…?", "<b>Protecția civilă<\/b>, voluntarii <b>Crucii Roșii<\/b>, alte structuri."], ["Bunurile folosite la instruire (rechiziții) se…?", "<b>Restituie în starea inițială<\/b>."], ["Resursele umane ale apărării?", "<b>Populația aptă<\/b> pentru activități de apărare."], ["Cei sustrași din vina lor de la serviciul militar?", "<b>Nu pot ocupa funcții de conducere<\/b> în instituțiile publice."], ["Cheltuielile de apărare?", "De la <b>bugetul de stat<\/b> și alte surse legale."], ["Infrastructura teritorială?", "<b>Lucrările și amenajările<\/b> de pe teritoriu folosibile pentru apărare."], ["Avizul pentru investiții noi îl dă…?", "<b>Statul Major General<\/b> (azi Statul Major al Apărării)."], ["Cine dispune militarizarea agenților economici?", "<b>CSAT<\/b>."], ["Cine aprobă nomenclatorul rezervelor?", "<b>CSAT<\/b>."], ["Planul exercițiilor de mobilizare îl aprobă…?", "<b>CSAT<\/b>."], ["Comenzile pentru apărare?", "Integral și la termen: <b>contract în pace<\/b>, <b>prioritate în război<\/b>."], ["Armata este…?", "<b>Nucleul forțelor armate<\/b>."], ["Armata se compune din…?", "<b>Organele centrale MApN, categoriile de forțe, organele militare teritoriale<\/b>."], ["Categoriile de forțe?", "<b>Terestre, aeriene, navale<\/b>."], ["Organele militare teritoriale?", "<b>Centrele militare zonale, județene și de sector<\/b>."], ["Guvernul conduce apărarea în județe prin…?", "<b>Prefecți<\/b>."], ["Cine pregătește forțele și conduce mobilizarea armatei?", "<b>MApN<\/b>."], ["La mobilizare, miniștrii alocă resursele…?", "<b>Cu prioritate pentru apărare<\/b>."], ["Monografiile economico-militare le țin…?", "<b>Autoritățile administrației publice locale<\/b>."]], "q": [{"id": "L02-005", "p": 1, "q": "Sistemul național de apărare cuprinde:", "o": ["Parlamentul, Guvernul și CSAT", "armata, poliția, jandarmeria și serviciile de informații", "conducerea, forțele, resursele și infrastructura teritorială", "forțele terestre, aeriene și navale"], "a": 2, "e": "Art. 6."}, {"id": "L02-006", "p": 1, "q": "Conducerea sistemului național de apărare se realizează:", "o": ["de comandanții militari județeni", "exclusiv de autoritățile constituționale", "exclusiv de Ministerul Apărării Naționale", "de Statul Major al Apărării, în pace și război"], "a": 1, "e": "Art. 7."}, {"id": "L02-007", "p": 1, "q": "Care dintre următoarele NU face parte din conducerea sistemului național de apărare, potrivit art. 7?", "o": ["Consiliul Suprem de Apărare a Țării", "comandanții unităților militare", "autoritățile administrației publice locale cu atribuții în domeniul apărării", "Parlamentul"], "a": 1, "e": "Art. 7: Parlament, Președinte, CSAT, Guvern, MApN, autorități locale cu atribuții."}, {"id": "L02-018", "p": 1, "q": "Militarizarea agenților economici care susțin direct efortul de apărare poate fi dispusă de:", "o": ["ministerul economiei", "prefect", "Consiliul Suprem de Apărare a Țării", "consiliul județean"], "a": 2, "e": "Art. 22."}, {"id": "L02-022", "p": 1, "q": "Potrivit Legii 45/1994, armata constituie:", "o": ["o structură subordonată Ministerului Afacerilor Interne", "singura componentă a sistemului de apărare", "nucleul forțelor armate", "componenta de protecție civilă"], "a": 2, "e": "Art. 26."}, {"id": "L02-023", "p": 1, "q": "Armata se compune din:", "o": ["unitățile de luptă și unitățile de rezervă", "organele centrale ale MApN, categoriile de forțe și organele militare teritoriale", "statul major, centrele de selecție și școlile militare", "forțele terestre, poliția și jandarmeria"], "a": 1, "e": "Art. 27."}, {"id": "L02-024", "p": 1, "q": "Categoriile de forțe ale armatei sunt:", "o": ["forțele terestre, jandarmeria și poliția de frontieră", "forțele de protecție și forțele armate", "forțele speciale, forțele aeriene și forțele cibernetice", "forțele terestre, forțele aeriene și forțele navale"], "a": 3, "e": "Art. 29 (textul legii folosește denumirile „forțele terestre, aviația și apărarea antiaeriană, marina militară”)."}, {"id": "L02-025", "p": 1, "q": "Organele militare teritoriale sunt:", "o": ["comandamentele de brigadă", "prefecturile", "statele majore ale categoriilor de forțe", "centrele militare zonale, județene și de sector"], "a": 3, "e": "Art. 30."}, {"id": "L02-001", "p": 2, "q": "Potrivit Legii nr. 45/1994, apărarea națională reprezintă:", "o": ["activitatea desfășurată exclusiv de Ministerul Apărării Naționale în timp de război", "ansamblul de măsuri și activități adoptate și desfășurate de statul român pentru a garanta suveranitatea națională, independența și unitatea statului, integritatea teritorială și democrația constituțională", "ansamblul alianțelor militare din care face parte România", "totalitatea forțelor armate ale României"], "a": 1, "e": "Art. 1."}, {"id": "L02-002", "p": 2, "q": "Măsurile privind apărarea națională sunt obligatorii pentru:", "o": ["numai pentru instituțiile publice", "numai pentru militari", "toți cetățenii, instituțiile publice și private și agenții economici, indiferent de forma de proprietate", "numai pentru agenții economici cu capital de stat"], "a": 2, "e": "Art. 2."}, {"id": "L02-004", "p": 2, "q": "În cazul unei agresiuni armate de mare amploare, care depășește capacitatea forțelor armate:", "o": ["se suspendă activitatea Parlamentului", "se solicită exclusiv sprijinul NATO", "se mobilizează toate resursele umane și materiale necesare", "se declară automat starea de urgență în toate județele"], "a": 2, "e": "Art. 4."}, {"id": "L02-008", "p": 2, "q": "Conducerea strategică militară se realizează prin:", "o": ["Centrul Militar Zonal", "Consiliul Suprem de Apărare a Țării", "Comandamentul Logistic Întrunit", "Centrul Național Militar de Comandă"], "a": 3, "e": "Art. 8."}, {"id": "L02-009", "p": 2, "q": "În timp de război, în fiecare județ și în municipiul București există:", "o": ["un consiliu militar ales de consiliul județean", "un comandament NATO", "un comandant militar, subordonat Centrului Național Militar de Comandă", "un prefect militar numit de ministrul apărării"], "a": 2, "e": "Art. 9."}, {"id": "L02-010", "p": 2, "q": "Forțele sistemului național de apărare cuprind:", "o": ["numai armata", "armata și poliția locală", "forțele terestre și forțele navale", "forțele armate și forțele de protecție"], "a": 3, "e": "Art. 10–12."}, {"id": "L02-011", "p": 2, "q": "Din forțele de protecție fac parte:", "o": ["forțele serviciilor de informații", "forțele terestre", "protecția civilă și voluntarii Crucii Roșii", "unitățile de poliție militară"], "a": 2, "e": "Art. 12."}, {"id": "L02-013", "p": 2, "q": "Resursele umane ale apărării sunt reprezentate de:", "o": ["populația aptă să desfășoare activități în domeniul apărării", "numai militarii activi", "toți cetățenii, indiferent de vârstă și aptitudini", "numai rezerviștii"], "a": 0, "e": "Art. 15."}, {"id": "L02-014", "p": 2, "q": "Cetățenii apți pentru serviciul militar care s-au sustras, din vina lor, de la îndeplinirea acestuia:", "o": ["nu pot ocupa funcții de conducere în instituțiile publice", "nu pot vota", "nu pot călători în străinătate", "pierd cetățenia română"], "a": 0, "e": "Art. 16."}, {"id": "L02-017", "p": 2, "q": "Pentru amplasarea unor obiective de investiții noi, ministerele, autoritățile și agenții economici au nevoie de avizul:", "o": ["Centrului Militar Județean", "Statului Major General (în prezent Statul Major al Apărării)", "consiliului local", "Parlamentului"], "a": 1, "e": "Art. 21."}, {"id": "L02-019", "p": 2, "q": "Nomenclatorul și nivelul rezervelor de tehnică și materiale constituite din timp de pace se aprobă de:", "o": ["Consiliul Suprem de Apărare a Țării", "ministrul finanțelor", "comandanții de unități", "Parlament"], "a": 0, "e": "Art. 23."}, {"id": "L02-020", "p": 2, "q": "Exercițiile de mobilizare pentru verificarea pregătirii se execută după un plan aprobat de:", "o": ["Consiliul Suprem de Apărare a Țării", "consiliile locale", "Guvern", "Statul Major al Forțelor Terestre"], "a": 0, "e": "Art. 24."}, {"id": "L02-026", "p": 2, "q": "Guvernul conduce activitatea de apărare la nivelul județelor prin:", "o": ["primari", "comandanții de brigăzi", "prefecți", "centrele militare de sector"], "a": 2, "e": "Art. 32."}, {"id": "L02-027", "p": 2, "q": "Pregătirea forțelor și planificarea și conducerea mobilizării armatei este atribuția:", "o": ["Ministerului Finanțelor", "Crucii Roșii", "autorităților administrației publice locale", "Ministerului Apărării Naționale"], "a": 3, "e": "Art. 33."}, {"id": "L02-003", "p": 3, "q": "Normele privind apărarea națională NU se bazează, potrivit art. 3, pe:", "o": ["Constituție", "doctrina militară", "regulamentele interne ale agenților economici", "tratatele la care România este parte"], "a": 2, "e": "Art. 3: Constituție, legi, doctrina militară, normele de drept internațional recunoscute, tratatele."}, {"id": "L02-012", "p": 3, "q": "Forțele sistemului de apărare pot folosi pentru instruire terenuri și bunuri în condițiile legii rechizițiilor, cu obligația:", "o": ["de a le păstra până la finalul anului", "de a le restitui în starea inițială", "de a plăti o taxă anuală fixă", "de a le cumpăra după exercițiu"], "a": 1, "e": "Art. 13."}, {"id": "L02-015", "p": 3, "q": "Cheltuielile pentru apărare se asigură:", "o": ["din contribuția obligatorie a cetățenilor", "numai din donații", "numai din fondurile NATO", "de la bugetul de stat și din alte surse prevăzute de lege"], "a": 3, "e": "Art. 19."}, {"id": "L02-016", "p": 3, "q": "Infrastructura teritorială a sistemului de apărare cuprinde:", "o": ["numai cazărmile", "clădirile ministerelor", "numai drumurile naționale", "lucrările și amenajările de pe teritoriu care pot fi utilizate pentru apărare"], "a": 3, "e": "Art. 20."}, {"id": "L02-021", "p": 3, "q": "Comenzile pentru apărare se execută de instituții și agenți economici:", "o": ["facultativ, în timp de pace", "numai în timp de război", "numai dacă sunt finanțate de NATO", "integral și la termen, pe bază de contract în timp de pace și cu prioritate în timp de război"], "a": 3, "e": "Art. 25."}, {"id": "L02-028", "p": 3, "q": "Pe timpul mobilizării și războiului, miniștrii alocă resursele din domeniul lor:", "o": ["cu prioritate pentru nevoile apărării", "numai după aprobarea consiliilor locale", "proporțional cu populația județelor", "numai pentru protecția civilă"], "a": 0, "e": "Art. 34."}, {"id": "L02-029", "p": 3, "q": "Monografiile economico-militare sunt ținute la zi de:", "o": ["Statul Major al Forțelor Navale", "autoritățile administrației publice locale", "comandanții de pluton", "Parlament"], "a": 1, "e": "Art. 35."}]}, {"nr": 14, "id": "mapn", "t": "Legea de organizare a MApN", "tema": "Legea nr. 346/2006 privind organizarea și funcționarea Ministerului Apărării Naționale", "parte": "L", "stele": 2, "itemi": "1–2", "timp": "45 min", "sursa": "Legea nr. 346/2006 (republicată) – Cap. II art. 5–6; Cap. V art. 28–38; Cap. VII art. 43–46", "ps": "<p>Legea spune <strong>ce face MApN<\/strong>, <strong>în ce domenii e autoritate națională<\/strong>, <strong>din ce forțe e făcută armata<\/strong> și <strong>cine e personalul<\/strong>. Nu memora tot art. 5: reții <strong>categoriile mari<\/strong> și mai ales ce ține de <strong>comunicații<\/strong>. Pică des: <strong>cele 4 domenii (art. 6)<\/strong>, <strong>cele 6 categorii de forțe<\/strong>, <strong>cele 4 niveluri de capacitate<\/strong> și <strong>ce aprobă CSAT<\/strong>.<\/p>", "fise": [{"t": "Harta legii", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Capitol<\/th>\n<th>Articole<\/th>\n<th>Despre ce e<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>II<\/strong><\/td>\n<td>5–6<\/td>\n<td><strong>atribuțiile<\/strong> MApN și cele <strong>4 domenii<\/strong> în care e autoritate națională<\/td>\n<\/tr>\n<tr>\n<td><strong>V<\/strong><\/td>\n<td>28–38<\/td>\n<td><strong>structura de forțe<\/strong> a armatei<\/td>\n<\/tr>\n<tr>\n<td><strong>VII<\/strong><\/td>\n<td>43–46<\/td>\n<td><strong>personalul<\/strong> MApN<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p>Art. 5 are o listă foarte lungă. <strong>Nu o înveți pe toată.<\/strong> Citești categoriile și te oprești la ce ține de <strong>arma ta<\/strong>: comunicații, IT, spectru radio, criptografie, apărare cibernetică.<\/p><\/aside>"}, {"t": "Art. 5 – atribuțiile MApN (cele care pică)", "h": "<p>Printre altele, MApN se ocupă de:<\/p>\n<ul>\n<li><strong>capacitatea operațională<\/strong> a armatei (realizare și menținere);<\/li>\n<li><strong>înființarea, desființarea, reorganizarea și redislocarea<\/strong> structurilor militare;<\/li>\n<li><strong>planificarea integrată a apărării<\/strong>;<\/li>\n<li><strong>instruirea<\/strong> comandamentelor și forțelor; <strong>educația și formarea profesională<\/strong> în instituțiile proprii;<\/li>\n<li><strong>organizarea și conducerea mobilizării<\/strong> armatei, <strong>rechiziția de bunuri<\/strong>, <strong>chemarea persoanelor la prestări de servicii<\/strong> în interes public;<\/li>\n<li><strong>înzestrarea<\/strong> cu armament și tehnică; relația cu industria de apărare; <strong>controlul exporturilor/importurilor<\/strong> de produse militare;<\/li>\n<li><strong>sistemul pensiilor militare de stat<\/strong>;<\/li>\n<li>protecție socială și asistență <strong>religioasă, medicală, psihologică și juridică<\/strong>;<\/li>\n<li><strong>poliție militară<\/strong>, în țară și în misiuni;<\/li>\n<li><strong>serviciul medical militar de urgență<\/strong>;<\/li>\n<li><strong>standardizare și interoperabilitate<\/strong>;<\/li>\n<li><strong>cadrele în rezervă și în retragere<\/strong>, veteranii, invalizii și văduvele de război;<\/li>\n<li><strong>tradiții militare<\/strong>, ceremonii;<\/li>\n<li>informații <strong>geospațiale, geografice, hidrografice, hidrometeorologice<\/strong>;<\/li>\n<li><strong>siguranța aeriană, navală și terestră<\/strong>.<\/li>\n<\/ul>\n<blockquote><p>📡 <strong>Pentru arma ta (Comunicații)<\/strong>: MApN are în atribuții\n- <strong>managementul resurselor de comunicații și tehnologia informației<\/strong>;\n- <strong>managementul spectrului de frecvențe radio<\/strong> alocat apărării;\n- <strong>activitatea oficială de cifru<\/strong> și <strong>sistemele criptografice<\/strong>;\n- <strong>protecția informațiilor clasificate<\/strong> (naționale, NATO, UE);\n- participarea la dezvoltarea <strong>apărării cibernetice<\/strong>.<\/p><\/blockquote><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: la „Spectrul de frecvențe radio al apărării îl gestionează…” răspunsul este <strong>MApN<\/strong> (nu Guvernul, nu un minister civil).<\/p><\/aside>"}, {"t": "Art. 6 – autoritate națională în 4 domenii", "h": "<p>Prin structurile desemnate, MApN este autoritate națională în:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lit.<\/th>\n<th>Domeniul<\/th>\n<th>Ce înseamnă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td><strong>Navală militară<\/strong><\/td>\n<td>stabilește <strong>zonele de siguranță<\/strong> ale navelor militare, <strong>perimetrul și regimul porturilor militare<\/strong>, investigarea evenimentelor de navigație<\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td><strong>Scafandri<\/strong><\/td>\n<td><strong>pregătește, brevetează și perfecționează<\/strong> scafandrii, îi <strong>verifică periodic<\/strong>, <strong>autorizează și inspectează<\/strong> activitățile subacvatice<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td><strong>Informații geospațiale<\/strong><\/td>\n<td>proiectarea, realizarea și asigurarea informațiilor geospațiale <strong>pentru apărare<\/strong><\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td><strong>Criptologie<\/strong><\/td>\n<td><strong>activitatea oficială de criptologie<\/strong> pentru componentele specifice<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>„N-S-G-C”<\/strong>: <strong>N<\/strong>avală, <strong>S<\/strong>cafandri, <strong>G<\/strong>eospațial, <strong>C<\/strong>riptologie.<\/p><\/aside><aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: la „MApN <strong>NU<\/strong> este autoritate națională în domeniul…” caută ceva ce <strong>nu e pe listă<\/strong> (la grilă a apărut <strong>aviația civilă<\/strong>).<\/p><\/aside>\n<p>Metodologiile și procedurile se stabilesc prin <strong>ordin al ministrului apărării naționale<\/strong>.<\/p>"}, {"t": "Structura de forțe – 6 categorii (art. 28)", "h": "<p>Structura de forțe are <strong>state majore, comandamente, mari unități, unități, formațiuni<\/strong>, grupate în <strong>6 categorii<\/strong>:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lit.<\/th>\n<th>Grupare<\/th>\n<th>Cine o conduce<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td><strong>Forțe terestre, aeriene, navale<\/strong> (categorii de forțe)<\/td>\n<td>statele majore ale forțelor<\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td><strong>Forțe pentru sprijin de luptă<\/strong><\/td>\n<td>comandamente de sprijin<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td><strong>Forțe pentru sprijin logistic<\/strong><\/td>\n<td><strong>Comandamentul Logistic Întrunit<\/strong><\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td><strong>Forțe pentru operații speciale<\/strong><\/td>\n<td><strong>Comandamentul Forțelor pentru Operații Speciale<\/strong><\/td>\n<\/tr>\n<tr>\n<td>e)<\/td>\n<td><strong>Forțe pentru apărare cibernetică<\/strong><\/td>\n<td><strong>Comandamentul Apărării Cibernetice<\/strong><\/td>\n<\/tr>\n<tr>\n<td>f)<\/td>\n<td><strong>Alte forțe<\/strong><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Dimensiunea<\/strong> structurii se stabilește prin <strong>documentele de planificare a apărării<\/strong>.<\/li>\n<li>Cerințele de constituire se stabilesc prin <strong>ordin al ministrului<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Cele 6<\/strong>: <strong>TAN<\/strong> (terestre, aeriene, navale) + <strong>Luptă<\/strong> (sprijin) + <strong>Logistic<\/strong> + <strong>Speciale<\/strong> + <strong>Cibernetic<\/strong> + <strong>Alte<\/strong>.<\/p><\/aside>"}, {"t": "Ce cuprinde fiecare categorie (art. 29–33)", "h": "<ul>\n<li><strong>Art. 29. Categoriile de forțe<\/strong>: statele majore ale forțelor terestre, aeriene, navale; comandamente, mari unități și unități <strong>de manevră, de sprijin de luptă și logistice<\/strong>; <strong>unități de instrucție<\/strong>; <strong>instituții militare de învățământ<\/strong>.<\/li>\n<li><strong>Art. 30. Sprijinul de luptă<\/strong> (nivel strategic): <strong>comandamente de sprijin<\/strong>, cu mari unități, unități, unități de instrucție și învățământ preuniversitar.<\/li>\n<li><strong>Art. 31. Sprijinul logistic<\/strong> = <strong>Comandamentul Logistic Întrunit<\/strong>. Poate avea în subordine și creșe, grădinițe, structuri de cultură, baze sportive, lăcașuri de cult, cimitire etc.<\/li>\n<li><strong>Art. 32. Operații speciale<\/strong> = <strong>Comandamentul Forțelor pentru Operații Speciale<\/strong> + structuri luptătoare, de sprijin și logistice.<\/li>\n<li><strong>Art. 33. Apărare cibernetică<\/strong> = <strong>Comandamentul Apărării Cibernetice<\/strong> + mari unități, unități, alte structuri. 📡<\/li>\n<\/ul>"}, {"t": "Cine dă misiunile (art. 34)", "h": "<p>Misiunile și responsabilitățile structurii de forțe se stabilesc prin <strong>ordin al ministrului apărării naționale<\/strong> sau al <strong>șefului Statului Major al Apărării<\/strong>, <strong>când este împuternicit de ministru<\/strong>.<\/p>"}, {"t": "Cele 4 niveluri de capacitate de luptă (art. 35)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Lit.<\/th>\n<th>Nivelul<\/th>\n<th>Ce înseamnă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>a)<\/td>\n<td><strong>Gata de acțiune permanent<\/strong><\/td>\n<td>sunt pregătite oricând<\/td>\n<\/tr>\n<tr>\n<td>b)<\/td>\n<td><strong>Nivel ridicat<\/strong> al capacității de luptă<\/td>\n<td>pregătire ridicată<\/td>\n<\/tr>\n<tr>\n<td>c)<\/td>\n<td><strong>Nivel redus<\/strong> al capacității de luptă<\/td>\n<td>devin gata de acțiune <strong>după completare sau mobilizare<\/strong><\/td>\n<\/tr>\n<tr>\n<td>d)<\/td>\n<td><strong>Structuri constituite la mobilizare<\/strong><\/td>\n<td>pentru <strong>generarea și regenerarea forțelor<\/strong> și pentru <strong>rezistența armată<\/strong> pe teritoriul național<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Ca la un <strong>spital<\/strong>: unii medici sunt <strong>de gardă<\/strong> (gata permanent), alții <strong>pe tură<\/strong> (nivel ridicat), alții <strong>acasă<\/strong> și îi chemi la nevoie (nivel redus), iar la o catastrofă <strong>se mai angajează oameni noi<\/strong> (constituite la mobilizare).<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>De la gata la mobilizare<\/strong>: <strong>4<\/strong> niveluri, de la „sunt aici” la „se formează abia când e mobilizare”.<\/p><\/aside>"}, {"t": "Poliția militară (art. 36)", "h": "<p>Structurile de poliție militară asigură:<\/p>\n<ul>\n<li><strong>ordinea interioară și disciplina militară<\/strong> în obiective militare și zone militare restricționate;<\/li>\n<li><strong>sprijinul manevrei și al mobilității<\/strong>;<\/li>\n<li><strong>controlul și îndrumarea circulației<\/strong> autovehiculelor și coloanelor militare;<\/li>\n<li><strong>protecția personalului<\/strong> și <strong>securitatea obiectivelor<\/strong> militare;<\/li>\n<li>contribuția la supraveghere, escortare, pază, inclusiv <strong>paza și escortarea prizonierilor de război<\/strong>;<\/li>\n<li>îndrumarea și evacuarea <strong>persoanelor strămutate<\/strong>.<\/li>\n<\/ul>\n<p>Organizarea și funcționarea se stabilesc prin <strong>lege specială<\/strong>.<\/p>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: „Care NU e atribuție a poliției militare?” → ceva ce nu are legătură cu ordinea, circulația militară, paza sau escortarea (la grilă a apărut <strong>conducerea operațiilor speciale în străinătate<\/strong>, care nu ține de poliția militară).<\/p><\/aside>"}, {"t": "Operații speciale și NATO (art. 37–38)", "h": "<p><strong>Art. 37. Forțele pentru operații speciale:<\/strong><\/p>\n<ul>\n<li>sunt componenta <strong>specializată, de reacție rapidă, la nivel strategic<\/strong>, cu structuri <strong>terestre, navale și aeriene<\/strong>;<\/li>\n<li><strong>5 misiuni:<\/strong> <strong>cercetare specială<\/strong>, <strong>acțiuni directe<\/strong>, <strong>asistență militară<\/strong>, <strong>acțiuni neconvenționale<\/strong>, <strong>misiuni complementare<\/strong>;<\/li>\n<li>se execută în țară sau în străinătate, <strong>independent<\/strong> ori <strong>împreună cu forțele speciale ale aliaților<\/strong>;<\/li>\n<li>le conduce <strong>șeful Statului Major al Apărării<\/strong>, prin <strong>Comandamentul Forțelor pentru Operații Speciale<\/strong>.<\/li>\n<\/ul>\n<p><strong>Art. 38.<\/strong> MApN poate constitui structuri de conducere și de forțe <strong>puse la dispoziția NATO<\/strong>, integrate în structura de comandă și control și de forțe a NATO. Nivelul de autoritate se stabilește <strong>după procedurile NATO<\/strong>.<\/p>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Capcană: „Care NU e misiune a forțelor speciale?” → ceva în afara celor 5 (la grilă a apărut <strong>paza obiectivelor civile de interes local<\/strong>).<\/p><\/aside>"}, {"t": "Personalul MApN (art. 43–46)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Art.<\/th>\n<th>Ce trebuie să știi<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>43<\/strong><\/td>\n<td>Personal <strong>militar<\/strong> și <strong>civil<\/strong>. ⚠️ <strong>Nomenclatorul funcțiilor de general<\/strong> îl aprobă <strong>CSAT<\/strong>. <strong>Transformarea<\/strong> unei funcții de general în funcție civilă o aprobă tot <strong>CSAT<\/strong>, la propunerea ministrului.<\/td>\n<\/tr>\n<tr>\n<td><strong>44<\/strong><\/td>\n<td>Evidența efectivelor <strong>Direcției generale de informații a apărării<\/strong> se ține <strong>separat<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>45<\/strong><\/td>\n<td><strong>Nu intră în necesarul de efective:<\/strong> personalul care lucrează <strong>în afara ministerului<\/strong>; structurile finanțate <strong>integral din venituri proprii<\/strong>; <strong>militarii în termen și cu termen redus<\/strong>, <strong>soldații și gradații profesioniști aflați în instrucția de bază<\/strong>, <strong>elevii și studenții<\/strong> instituțiilor militare; unitățile sanitare în relație cu casa de asigurări. Evidența lor e <strong>separată<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>46<\/strong><\/td>\n<td>Personalul lucrează după legislația fiecărei categorii și <strong>regulamentele interne<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>CSAT<\/strong> aprobă tot ce ține de <strong>generali<\/strong>: și lista funcțiilor, și transformarea în funcție civilă.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Elevii și cursanții, cât învață, sunt ca <strong>ucenicii<\/strong> dintr-un atelier: nu sunt numărați în schema de angajați.<\/p><\/aside>"}], "flash": [["Ci
