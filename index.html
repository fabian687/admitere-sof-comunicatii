adio este mai îndepărtat decât orizontul optic datorită:", "o": ["absorbției în vegetație", "reflexiei pe stratul D", "refracției troposferice, care curbează ușor unda spre Pământ", "polarizării verticale"], "a": 2, "e": "~15% mai departe."}, {"id": "S10-024", "p": 3, "q": "Antenele a două stații VHF sunt la 9 m și 16 m înălțime. Orizontul radio este de aproximativ:", "o": ["29 km", "104 km", "15 km", "7 km"], "a": 0, "e": "4,12 × (3 + 4) ≈ 28,8 km."}, {"id": "S10-025", "p": 3, "q": "Propagarea anormal de lungă a undelor VHF/UHF, ghidate de straturi atmosferice în anumite condiții meteo, se numește:", "o": ["ducting troposferic", "unda de suprafață", "zonă de tăcere", "NVIS"], "a": 0, "e": "Fenomen rar."}, {"id": "S10-026", "p": 3, "q": "Legăturile dincolo de orizont prin împrăștierea undelor de neomogenitățile troposferei se numesc:", "o": ["legături prin difuzie troposferică (tropo-scatter)", "legături prin undă de suprafață", "legături NVIS", "legături prin fibră optică"], "a": 0, "e": "Tropo-scatter."}, {"id": "S10-027", "p": 3, "q": "La frecvențele de ordinul GHz, ploaia:", "o": ["reflectă semnalul spre ionosferă", "absoarbe și atenuează semnalul", "amplifică semnalul", "nu are niciun efect"], "a": 1, "e": "Absorbția în hidrometeori."}, {"id": "S10-029", "p": 3, "q": "Pierderea de propagare în spațiu liber crește atunci când:", "o": ["scade distanța", "crește înălțimea antenelor", "cresc distanța și frecvența", "scade frecvența"], "a": 2, "e": "FSPL ≈ 32,45 + 20 log f + 20 log d."}]}, {"nr": 6, "id": "salt-frecventa", "t": "Stația radio VHF și saltul de frecvență", "tema": "Generalități despre comunicațiile radio, performanțele saltului de frecvență, propagarea în VHF", "parte": "S", "stele": 3, "itemi": "2–3", "timp": "50 min", "sursa": "F.T.-T.-5.2 Manualul instrucției operatorului stațiilor radio cu salt de frecvență în gama VHF (2007), Cap. II art. 11–31", "ps": "<p>Stațiile radio de luptă lucrează în <strong>VHF (30–88 MHz)<\/strong> și folosesc <strong>saltul de frecvență (FH)<\/strong>: sar de pe o frecvență pe alta de sute de ori pe secundă, ca inamicul să nu le poată <strong>asculta<\/strong>, <strong>bruia<\/strong> sau <strong>localiza<\/strong>. La grilă se întreabă <strong>avantajele FH<\/strong> și <strong>ce trebuie să aibă stațiile în comun<\/strong>.<\/p>", "fise": [{"t": "Radioul: plusuri și minusuri", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>✅ Avantaje<\/th>\n<th>❌ Dezavantaje<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>legătura se face <strong>repede<\/strong><\/td>\n<td>poate fi <strong>interceptată<\/strong> (ascultată)<\/td>\n<\/tr>\n<tr>\n<td>merge <strong>în mișcare<\/strong><\/td>\n<td>poate fi <strong>bruiată<\/strong><\/td>\n<\/tr>\n<tr>\n<td>ajunge în locuri <strong>greu accesibile<\/strong><\/td>\n<td>stația poate fi <strong>localizată prin radiogoniometrie<\/strong>, apoi lovită<\/td>\n<\/tr>\n<tr>\n<td>un mesaj ajunge <strong>la mulți deodată<\/strong> (rețea)<\/td>\n<td>depinde de <strong>teren<\/strong> și de propagare<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Radiogoniometrie<\/strong> = aflarea <strong>poziției<\/strong> unui emițător după <strong>direcția<\/strong> din care vine semnalul.<\/p>"}, {"t": "Războiul electronic, pe scurt", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Prescurtare<\/th>\n<th>Cine o face<\/th>\n<th>Ce înseamnă<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>ESM<\/strong> (sprijin electronic)<\/td>\n<td>inamicul<\/td>\n<td><strong>ascultă<\/strong>, interceptează, <strong>localizează<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>ECM<\/strong> (contramăsuri)<\/td>\n<td>inamicul<\/td>\n<td><strong>bruiază<\/strong>, înșală<\/td>\n<\/tr>\n<tr>\n<td><strong>ECCM<\/strong> (contra-contramăsuri)<\/td>\n<td><strong>noi<\/strong><\/td>\n<td><strong>ne apărăm<\/strong>: <strong>salt de frecvență<\/strong>, criptare, putere mică, disciplină radio<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>Saltul de frecvență este o măsură ECCM<\/strong>: ne protejează de bruiaj și interceptare.<\/p><\/aside>"}, {"t": "Ce este saltul de frecvență (FH)", "h": "<p>În loc să emită mereu pe <strong>aceeași<\/strong> frecvență, stația <strong>sare<\/strong> pe altă frecvență de <strong>sute de ori pe secundă<\/strong>, după o ordine <strong>pseudo-aleatoare<\/strong> (pare la întâmplare, dar e calculată). <strong>Toate stațiile din rețea sar deodată<\/strong>, pe aceleași frecvențe și în aceeași ordine.<\/p>\n<figure class=\"dg\"><svg viewBox=\"0 0 400 240\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Saltul de frecvență în timp\">\n  <line x1=\"40\" y1=\"200\" x2=\"390\" y2=\"200\" class=\"s-ink\" stroke-width=\"1.5\"/>\n  <line x1=\"40\" y1=\"200\" x2=\"40\" y2=\"14\" class=\"s-ink\" stroke-width=\"1.5\"/>\n  <text x=\"386\" y=\"220\" text-anchor=\"end\" class=\"t-mut\">timp →<\/text>\n  <text x=\"14\" y=\"110\" transform=\"rotate(-90 14 110)\" text-anchor=\"middle\" class=\"t-mut\">frecvența →<\/text>\n  <g class=\"s-line\" stroke-width=\"1\"><line x1=\"40\" y1=\"40\" x2=\"390\" y2=\"40\"/><line x1=\"40\" y1=\"72\" x2=\"390\" y2=\"72\"/><line x1=\"40\" y1=\"104\" x2=\"390\" y2=\"104\"/><line x1=\"40\" y1=\"136\" x2=\"390\" y2=\"136\"/><line x1=\"40\" y1=\"168\" x2=\"390\" y2=\"168\"/><\/g>\n  <rect x=\"44\" y=\"108\" width=\"346\" height=\"28\" class=\"f-res\" opacity=\".85\"/>\n  <polyline points=\"62,58 102,154 142,90 182,186 222,58 262,122 302,26 342,154\" class=\"s-acc f-none\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/>\n  <g class=\"f-acc\">\n    <rect x=\"48\" y=\"44\" width=\"28\" height=\"28\" rx=\"4\"/><rect x=\"88\" y=\"140\" width=\"28\" height=\"28\" rx=\"4\"/><rect x=\"128\" y=\"76\" width=\"28\" height=\"28\" rx=\"4\"/><rect x=\"168\" y=\"172\" width=\"28\" height=\"24\" rx=\"4\"/>\n    <rect x=\"208\" y=\"44\" width=\"28\" height=\"28\" rx=\"4\"/><rect x=\"288\" y=\"14\" width=\"28\" height=\"26\" rx=\"4\"/><rect x=\"328\" y=\"140\" width=\"28\" height=\"28\" rx=\"4\"/>\n  <\/g>\n  <rect x=\"248\" y=\"108\" width=\"28\" height=\"28\" rx=\"4\" class=\"f-red\"/>\n  <text x=\"52\" y=\"127\" class=\"t-red t-b\" style=\"font-size:12px\">bruiaj pe o frecvență<\/text>\n  <text x=\"215\" y=\"236\" text-anchor=\"middle\" class=\"t-b\" style=\"font-size:12px\">bruiajul lovește doar 1 salt din 8; restul trec<\/text>\n<\/svg><figcaption>Fiecare pătrățel e un „salt” de câteva milisecunde. Doar stațiile care știu cheia pot urmări traseul.<\/figcaption><\/figure>\n\n<p>Tehnica face parte din familia <strong>spectrului împrăștiat<\/strong>: semnalul ocupă, în timp, o bandă <strong>mult mai largă<\/strong> decât are nevoie.<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Doi prieteni care schimbă canalul TV după un plan secret<\/strong>, la fiecare secundă. Cine se uită din afară vede doar bucăți fără sens. Ei doi, pentru că au același plan și același ceas, urmăresc filmul întreg.<\/p><\/aside>"}, {"t": "Ce trebuie să aibă stațiile în comun", "h": "<p>Ca să poată lucra împreună în FH, stațiile trebuie să aibă <strong>aceleași 4 lucruri<\/strong>:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>La ce folosește<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Setul de frecvențe<\/strong> (<em>hopset<\/em>)<\/td>\n<td><strong>pe ce frecvențe<\/strong> se sare<\/td>\n<\/tr>\n<tr>\n<td><strong>Cheia de salt (TRANSEC)<\/strong><\/td>\n<td><strong>în ce ordine<\/strong> se sare. E <strong>secretă<\/strong>.<\/td>\n<\/tr>\n<tr>\n<td><strong>Sincronizarea timpului<\/strong><\/td>\n<td><strong>când<\/strong> se sare: toate în același moment<\/td>\n<\/tr>\n<tr>\n<td><strong>Identificatorul rețelei<\/strong><\/td>\n<td>ca mai multe rețele să lucreze în aceeași bandă fără să se încurce<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Fără sincronizarea timpului NU există legătură în FH.<\/strong> Variantele de grilă care spun „nu necesită sincronizare” sunt greșite.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>E ca un <strong>dans în grup<\/strong>: toți trebuie să știe <strong>pașii<\/strong> (cheia), <strong>muzica<\/strong> (setul de frecvențe) și să pornească <strong>pe aceeași bătaie<\/strong> (sincronizarea).<\/p><\/aside>"}, {"t": "Avantajele saltului de frecvență – pică sigur", "h": "<ol>\n<li><strong>Rezistă la bruiaj<\/strong>: bruiajul pe o frecvență strică doar <strong>câteva salturi<\/strong>, iar erorile se corectează.<\/li>\n<li><strong>Greu de interceptat (LPI)<\/strong>: cel care ascultă <strong>nu știe unde vei fi<\/strong> în clipa următoare.<\/li>\n<li><strong>Greu de detectat și localizat (LPD)<\/strong>: fiecare salt e foarte scurt, iar energia e împrăștiată.<\/li>\n<li><strong>Rezistă la fading<\/strong>: o frecvență proastă afectează doar câteva salturi.<\/li>\n<li><strong>Mai multe rețele în aceeași bandă<\/strong>: cu chei și identificatori diferiți, rețelele se „ciocnesc” rar.<\/li>\n<li><strong>Securitate mai mare<\/strong>, mai ales împreună cu <strong>criptarea<\/strong>.<\/li>\n<\/ol>\n<p><strong>Dezavantaje:<\/strong> cere <strong>sincronizare<\/strong>, gestionarea <strong>cheilor<\/strong> și <strong>planurilor de frecvențe<\/strong>, echipamente <strong>mai complexe<\/strong>.<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Frecvență fixă<\/th>\n<th>Salt de frecvență<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Bruiaj<\/td>\n<td>vulnerabil<\/td>\n<td><strong>rezistent<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Interceptare / localizare<\/td>\n<td>ușoare<\/td>\n<td><strong>dificile<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Complexitate<\/td>\n<td>mică<\/td>\n<td>mare (chei, sincronizare)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"t": "VHF: totul depinde de înălțime și de teren", "h": "<p><strong>VHF<\/strong> = <strong>30–300 MHz<\/strong>, lungimi de undă <strong>10 m – 1 m<\/strong>. Stațiile de luptă folosesc <strong>30–88 MHz<\/strong>.<\/p>\n<ul>\n<li>Se propagă prin <strong>undă directă<\/strong>, <strong>în linie de vedere<\/strong>.<\/li>\n<li>⚠️ <strong>Nu se întoarce din ionosferă<\/strong>: o <strong>străbate<\/strong>. Deci VHF <strong>nu face legături la mii de km<\/strong>.<\/li>\n<li>Ocolește puțin crestele prin <strong>difracție<\/strong> (mai bine la frecvențele de jos, 30–50 MHz).<\/li>\n<li><strong>Pădurea<\/strong> (mai ales udă) <strong>absoarbe<\/strong> semnalul.<\/li>\n<li>În spatele unui deal apare o <strong>zonă de umbră radio<\/strong>.<\/li>\n<li>Reflexiile pe clădiri și stânci produc <strong>propagare multicale<\/strong> și <strong>fading<\/strong>.<\/li>\n<\/ul>\n<p><strong>Orizontul radio:<\/strong> d ≈ <strong>4,12 × (√h₁ + √h₂)<\/strong> km.<\/p>\n<aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>Antene la <strong>4 m<\/strong> ambele: d ≈ 4,12 × 4 ≈ <strong>16 km<\/strong>. Releu la <strong>100 m<\/strong> + stație la <strong>4 m<\/strong>: d ≈ 4,12 × 12 ≈ <strong>49 km<\/strong>. De aceea <strong>releele stau pe dealuri<\/strong>.<\/p><\/aside>"}, {"t": "Ce faci practic dacă nu ai legătură", "h": "<ul>\n<li><strong>Urcă<\/strong> pe un punct mai înalt sau <strong>mută-te<\/strong> câțiva metri. Contează mult.<\/li>\n<li>Nu sta <strong>în spatele<\/strong> unui deal sau al unei clădiri față de corespondent.<\/li>\n<li>Verifică <strong>antena<\/strong>: să fie întinsă <strong>vertical<\/strong>, cu aceeași polarizare.<\/li>\n<li>Folosește <strong>puterea minimă necesară<\/strong>: te ascunzi de inamic și economisești bateria.<\/li>\n<li>Cere <strong>retranslație<\/strong> (releu).<\/li>\n<\/ul>"}], "flash": [["Principalul avantaj al radioului față de fir?", "Se realizează <b>repede<\/b> și merge <b>în mișcare<\/b>."], ["Dezavantajele radioului?", "Poate fi <b>interceptat, bruiat<\/b>, iar stația poate fi <b>localizată<\/b>."], ["Ce e radiogoniometria?", "Aflarea <b>poziției<\/b> unui emițător după direcția semnalului."], ["FH e ESM, ECM sau ECCM?", "<b>ECCM<\/b> (protecția noastră)."], ["Ce e saltul de frecvență?", "Schimbarea <b>pseudo-aleatoare și sincronă<\/b> a frecvenței, de multe ori pe secundă, de toate stațiile din rețea."], ["FH face parte din tehnica…?", "<b>Spectrului împrăștiat<\/b>."], ["Cele 4 lucruri comune pentru FH?", "<b>Setul de frecvențe, cheia (TRANSEC), sincronizarea timpului, ID-ul rețelei<\/b>."], ["Cheia de salt e de tip…?", "<b>TRANSEC<\/b>."], ["Fără sincronizare în FH?", "<b>Nu există legătură.<\/b>"], ["De ce rezistă FH la bruiaj?", "Bruiajul atinge doar <b>câteva salturi<\/b>, iar erorile se corectează."], ["LPI = ?", "<b>Probabilitate mică de interceptare<\/b>: nu se știe unde va fi următorul salt."], ["Mai multe rețele FH în aceeași bandă – cum?", "Cu <b>chei/identificatori diferiți<\/b>."], ["Banda VHF și lungimea de undă?", "<b>30–300 MHz<\/b>, <b>10 m – 1 m<\/b> (tactic 30–88 MHz)."], ["Cum se propagă VHF?", "Prin <b>undă directă<\/b>, în linie de vedere."], ["VHF și ionosfera?", "O <b>străbate<\/b>; nu se întoarce."], ["Ce e zona din spatele dealului?", "<b>Zonă de umbră radio<\/b>."], ["Cum ocolește VHF crestele?", "Prin <b>difracție<\/b>."], ["Pădurea udă în VHF?", "<b>Absoarbe<\/b> semnalul."], ["Semnal venit pe mai multe drumuri?", "<b>Propagare multicale<\/b> → fading."], ["Antene la 4 m – orizontul radio?", "Aproximativ <b>16 km<\/b>."], ["Cea mai eficientă măsură pentru bătaie mai mare în VHF?", "<b>Antene mai sus<\/b>, puncte dominante."], ["Ce putere folosești?", "<b>Puterea minimă necesară<\/b>."]], "q": [{"id": "S02-005", "p": 1, "q": "Saltul de frecvență (FH) reprezintă:", "o": ["schimbarea manuală a frecvenței de către operator la fiecare mesaj", "schimbarea pseudo-aleatoare și sincronă a frecvenței de lucru de către toate stațiile din rețea, de multe ori pe secundă", "creșterea frecvenței pe măsură ce stația se încălzește", "lucrul pe două frecvențe fixe, una pentru emisie și una pentru recepție"], "a": 1, "e": "Definiția FH."}, {"id": "S02-007", "p": 1, "q": "Care dintre următoarele NU este un avantaj al saltului de frecvență?", "o": ["rezistența la bruiaj", "nu necesită sincronizarea stațiilor din rețea", "posibilitatea funcționării mai multor rețele în aceeași bandă", "probabilitatea redusă de interceptare"], "a": 1, "e": "FH necesită obligatoriu sincronizare."}, {"id": "S02-008", "p": 1, "q": "Rezistența la bruiaj a stațiilor cu salt de frecvență se explică prin faptul că:", "o": ["stațiile nu emit deloc în timpul bruiajului", "stațiile emit cu putere de 10 ori mai mare", "stațiile folosesc numai modulație de amplitudine", "bruiajul pe o frecvență afectează doar o mică parte din salturi, iar erorile pot fi corectate"], "a": 3, "e": "Performanțele FH."}, {"id": "S02-009", "p": 1, "q": "Probabilitatea redusă de interceptare (LPI) a stațiilor FH se datorează faptului că:", "o": ["ascultătorul neautorizat nu cunoaște frecvența pe care va emite stația în momentul următor", "stațiile nu folosesc antene", "stațiile lucrează doar noaptea", "semnalul este transmis prin cablu"], "a": 0, "e": "Performanțele FH."}, {"id": "S02-010", "p": 1, "q": "Pentru ca stațiile să poată lucra în salt de frecvență în aceeași rețea, trebuie să aibă în comun:", "o": ["doar aceeași putere de emisie", "doar același tip de antenă", "setul de frecvențe, cheia de salt (TRANSEC), sincronizarea de timp și identificatorul rețelei", "doar același indicativ de apel"], "a": 2, "e": "Elementele necesare lucrului în FH."}, {"id": "S02-012", "p": 1, "q": "Fără sincronizarea timpului între stații, în regim de salt de frecvență:", "o": ["legătura se realizează automat pe AM", "legătura se realizează, dar cu volum mai mic", "nu se poate realiza legătura", "legătura se realizează numai noaptea"], "a": 2, "e": "Sincronizarea este obligatorie."}, {"id": "S02-016", "p": 1, "q": "Propagarea principală a undelor în gama VHF se face prin:", "o": ["undă de suprafață pe sute de kilometri", "undă directă, în linie de vedere", "ghid de undă Pământ–ionosferă", "reflexie pe ionosferă"], "a": 1, "e": "Propagarea VHF."}, {"id": "S02-017", "p": 1, "q": "În condiții normale, undele din gama VHF, la întâlnirea ionosferei:", "o": ["o străbat și nu se mai întorc spre Pământ", "sunt absorbite total de stratul F", "se transformă în unde lungi", "se reflectă și revin la mii de kilometri"], "a": 0, "e": "De aceea VHF nu asigură legături la distanțe mari prin ionosferă."}, {"id": "S02-019", "p": 1, "q": "Formula aproximativă a orizontului radio (în km), cu înălțimile antenelor h₁ și h₂ în metri, este:", "o": ["d ≈ 4,12 · (√h₁ + √h₂)", "d ≈ 4,12 · (h₁ + h₂)", "d ≈ (h₁ + h₂) / 4,12", "d ≈ 3,57 · h₁ · h₂"], "a": 0, "e": "Orizontul radio cu factorul de refracție standard."}, {"id": "S02-020", "p": 1, "q": "Două stații VHF au antenele la 4 m înălțime pe teren plat. Distanța aproximativă maximă (orizontul radio) este:", "o": ["circa 50 km", "circa 16 km", "circa 160 km", "circa 4 km"], "a": 1, "e": "d ≈ 4,12 · (2 + 2) ≈ 16,5 km."}, {"id": "S02-022", "p": 1, "q": "Pentru a mări distanța unei legături VHF, cea mai eficientă măsură este:", "o": ["amplasarea stației lângă o clădire înaltă, în spatele ei față de corespondent", "ridicarea antenelor și amplasarea stațiilor pe puncte dominante", "amplasarea stației într-o vale", "coborârea antenelor la nivelul solului"], "a": 1, "e": "Înălțimea antenei este decisivă în VHF."}, {"id": "S02-023", "p": 1, "q": "Zona din spatele unui obstacol de teren (deal), în care semnalul VHF nu ajunge sau ajunge foarte slab, se numește:", "o": ["zonă Fresnel", "zonă de umbră radio", "zonă de tăcere ionosferică", "zonă de acoperire"], "a": 1, "e": "Factori de teren."}, {"id": "S02-001", "p": 2, "q": "Principalul avantaj al legăturii radio față de legătura prin fir este:", "o": ["independența totală față de teren", "realizarea rapidă a legăturii și posibilitatea de a lucra în mișcare", "imposibilitatea interceptării", "imposibilitatea bruierii"], "a": 1, "e": "Radioul poate fi însă interceptat, bruiat și localizat."}, {"id": "S02-002", "p": 2, "q": "Care dintre următoarele este un dezavantaj al legăturii radio?", "o": ["poate fi interceptată, bruiată, iar stația poate fi localizată prin radiogoniometrie", "nu permite legătura în mișcare", "nu poate transmite voce", "se realizează foarte greu"], "a": 0, "e": "Dezavantajele radioului."}, {"id": "S02-015", "p": 2, "q": "Comparativ cu lucrul în frecvență fixă, lucrul în salt de frecvență este:", "o": ["mai vulnerabil la bruiaj", "identic din punctul de vedere al securității", "mai rezistent la bruiaj și interceptare, dar mai complex (chei, sincronizare)", "mai simplu și nu necesită chei"], "a": 2, "e": "Comparație FF vs FH."}, {"id": "S02-018", "p": 2, "q": "Distanța maximă a legăturii prin undă directă este limitată în principal de:", "o": ["ora din zi", "culoarea antenei", "curbura Pământului (orizontul radio) și obstacolele de teren", "tipul de baterie"], "a": 2, "e": "Orizontul radio."}, {"id": "S02-021", "p": 2, "q": "O stație de retranslație are antena la 100 m deasupra terenului, iar o stație portabilă are antena la 4 m. Orizontul radio dintre ele este de aproximativ:", "o": ["16 km", "104 km", "49 km", "412 km"], "a": 2, "e": "d ≈ 4,12 · (10 + 2) ≈ 49 km."}, {"id": "S02-024", "p": 2, "q": "În gama VHF, ocolirea parțială a obstacolelor (de exemplu a crestelor) se realizează prin fenomenul de:", "o": ["polarizare", "absorbție", "multiplexare", "difracție"], "a": 3, "e": "Difracția, mai bună la frecvențe mai joase."}, {"id": "S02-027", "p": 2, "q": "Pentru a reduce riscul de interceptare și pentru a economisi bateria, operatorul trebuie să folosească:", "o": ["puterea minimă necesară realizării legăturii", "frecvența cea mai mare", "antena de rezervă", "întotdeauna puterea maximă"], "a": 0, "e": "Disciplină și ECCM."}, {"id": "S02-028", "p": 2, "q": "Dacă o stație VHF nu are legătură, prima măsură practică este:", "o": ["oprirea stației pentru 24 de ore", "trecerea pe frecvența altei rețele", "mărirea volumului difuzorului", "schimbarea poziției (pe un punct mai înalt) și verificarea antenei"], "a": 3, "e": "Concluzii practice."}, {"id": "S02-003", "p": 3, "q": "Determinarea poziției unei stații radio inamice prin măsurarea direcției din care vin emisiile ei se numește:", "o": ["multiplexare", "modulație", "radiolocație activă", "radiogoniometrie"], "a": 3, "e": "Localizarea emițătoarelor."}, {"id": "S02-004", "p": 3, "q": "Măsurile luate de propriile forțe pentru a-și proteja comunicațiile împotriva bruiajului și interceptării (de exemplu saltul de frecvență) fac parte din:", "o": ["contra-contramăsurile electronice (ECCM)", "măsurile de protecție civilă", "măsurile de sprijin electronic (ESM)", "contramăsurile electronice (ECM)"], "a": 0, "e": "FH este ECCM (EPM)."}, {"id": "S02-006", "p": 3, "q": "Saltul de frecvență este o tehnică de tip:", "o": ["spectru împrăștiat (spread spectrum)", "modulație de amplitudine cu purtătoare", "multiplexare în frecvență pe fir", "comutație de circuite"], "a": 0, "e": "FH împrăștie semnalul pe o bandă largă."}, {"id": "S02-011", "p": 3, "q": "Cheia care determină ordinea pseudo-aleatoare a salturilor de frecvență este de tip:", "o": ["TRANSEC (securitatea transmisiei)", "parolă de rețea Wi-Fi", "PIN de acces la stație", "cod Morse"], "a": 0, "e": "Cheia de salt."}, {"id": "S02-013", "p": 3, "q": "Saltul de frecvență oferă rezistență la fadingul selectiv deoarece:", "o": ["elimină complet reflexiile", "crește automat înălțimea antenei", "o frecvență afectată de fading influențează doar câteva salturi", "folosește o singură frecvență foarte stabilă"], "a": 2, "e": "Performanțele FH."}, {"id": "S02-014", "p": 3, "q": "Posibilitatea ca mai multe rețele FH să lucreze în aceeași bandă de frecvențe se obține prin:", "o": ["folosirea de chei/identificatori diferiți pentru fiecare rețea", "folosirea aceleiași chei pentru toate rețelele", "reducerea numărului de stații la două", "lucrul exclusiv în frecvență fixă"], "a": 0, "e": "Utilizare eficientă a spectrului."}, {"id": "S02-025", "p": 3, "q": "În gama VHF, vegetația densă (pădurea), mai ales umedă:", "o": ["amplifică semnalul", "nu are niciun efect", "absoarbe și atenuează semnalul", "reflectă semnalul spre ionosferă"], "a": 2, "e": "Factori de teren."}, {"id": "S02-026", "p": 3, "q": "Recepționarea aceluiași semnal pe mai multe drumuri (direct și prin reflexii pe clădiri/stânci) se numește:", "o": ["retranslație", "modulație de fază", "salt de frecvență", "propagare multicale, care poate produce fading"], "a": 3, "e": "Factori de propagare."}, {"id": "S02-029", "p": 3, "q": "Lungimea de undă a semnalelor din gama VHF este cuprinsă între:", "o": ["1 km și 100 m", "100 m și 10 m", "10 m și 1 m", "1 m și 10 cm"], "a": 2, "e": "Undele metrice."}]}, {"nr": 7, "id": "informatii-clasificate", "t": "Informațiile clasificate (secretele)", "tema": "Legea 182/2002 privind protecția informațiilor clasificate și HG 585/2002 – standardele naționale de protecție", "parte": "L", "stele": 3, "itemi": "2–4", "timp": "80 min", "sursa": "Legea 182/2002 – art. 1–33, 36–40; HG 585/2002 – art. 1–23, 25–28, 33–37, 40–69, 79–82, 93–94, 96–139, 183–190", "ps": "<p>Două acte care merg împreună: <strong>Legea 182/2002<\/strong> spune <strong>ce<\/strong> e un secret, iar <strong>HG 585/2002<\/strong> spune <strong>cum<\/strong> lucrezi cu el. Tot capitolul se sprijină pe <strong>o singură schemă<\/strong>: 2 clase și 3 niveluri, cu echivalentele NATO, termenele și prefixele lor. Învață desenul de mai jos și ai jumătate din puncte.<\/p>", "fise": [{"t": "Schema care explică tot", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 300\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Clase și niveluri de secretizare\">\n  <text x=\"200\" y=\"16\" text-anchor=\"middle\" class=\"t-b\">SECRETE DE STAT<\/text>\n  <path d=\"M200 26 L254 96 L146 96 Z\" class=\"f-res s-red\" stroke-width=\"1.5\"/>\n  <path d=\"M146 100 L254 100 L290 146 L110 146 Z\" class=\"f-ams s-amb\" stroke-width=\"1.5\"/>\n  <path d=\"M110 150 L290 150 L326 196 L74 196 Z\" class=\"f-acs s-acc\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"76\" text-anchor=\"middle\" class=\"t-b t-red\">SSID<\/text>\n  <text x=\"200\" y=\"128\" text-anchor=\"middle\" class=\"t-b t-amb\">STRICT SECRET<\/text>\n  <text x=\"200\" y=\"178\" text-anchor=\"middle\" class=\"t-b t-acc\">SECRET<\/text>\n  <g class=\"t-m t-b\" style=\"font-size:12px\"><text x=\"262\" y=\"56\">100 ani · 000<\/text><text x=\"300\" y=\"118\">50 ani<\/text><text x=\"300\" y=\"133\">00<\/text><text x=\"334\" y=\"168\">30 ani<\/text><text x=\"334\" y=\"183\">0<\/text><\/g>\n  <g class=\"t-mut\" style=\"font-size:11.5px\" text-anchor=\"end\"><text x=\"140\" y=\"56\">NATO<\/text><text x=\"140\" y=\"70\">TOP SECRET<\/text><text x=\"104\" y=\"118\">NATO<\/text><text x=\"104\" y=\"132\">SECRET<\/text><text x=\"68\" y=\"168\">NATO<\/text><text x=\"68\" y=\"182\">CONFIDENT.<\/text><\/g>\n  <line x1=\"20\" y1=\"214\" x2=\"380\" y2=\"214\" class=\"s-line\" stroke-width=\"1.5\"/>\n  <rect x=\"74\" y=\"226\" width=\"252\" height=\"40\" rx=\"8\" class=\"f-bls s-blu\" stroke-width=\"1.5\"/>\n  <text x=\"200\" y=\"251\" text-anchor=\"middle\" class=\"t-b t-blu\">SECRET DE SERVICIU<\/text>\n  <text x=\"200\" y=\"286\" text-anchor=\"middle\" class=\"t-mut\" style=\"font-size:12px\">NATO RESTRICTED · prefix S · îl stabilește conducătorul instituției<\/text>\n<\/svg><figcaption>Clasele și nivelurile de secretizare, cu echivalentul NATO, termenul maxim de clasificare și prefixul numărului de înregistrare.<\/figcaption><\/figure>\n\n<p><strong>2 clase:<\/strong><\/p>\n<ul>\n<li><strong>Secrete de stat<\/strong>: divulgarea poate afecta <strong>siguranța națională și apărarea țării<\/strong>;<\/li>\n<li><strong>Secrete de serviciu<\/strong>: divulgarea poate prejudicia <strong>o persoană juridică<\/strong> (o instituție, o firmă).<\/li>\n<\/ul>\n<p><strong>3 niveluri<\/strong> pentru secretele de stat:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Nivel<\/th>\n<th>Prejudiciul la divulgare<\/th>\n<th>NATO<\/th>\n<th>Termen maxim<\/th>\n<th>Prefix nr.<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Strict secret de importanță deosebită (SSID)<\/strong><\/td>\n<td><strong>excepțional de grav<\/strong><\/td>\n<td>NATO <strong>TOP SECRET<\/strong><\/td>\n<td><strong>100 de ani<\/strong><\/td>\n<td><strong>000<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Strict secret (SS)<\/strong><\/td>\n<td><strong>grav<\/strong><\/td>\n<td>NATO <strong>SECRET<\/strong><\/td>\n<td><strong>50 de ani<\/strong><\/td>\n<td><strong>00<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Secret (S)<\/strong><\/td>\n<td><strong>prejudiciu<\/strong><\/td>\n<td>NATO <strong>CONFIDENTIAL<\/strong><\/td>\n<td><strong>30 de ani<\/strong><\/td>\n<td><strong>0<\/strong><\/td>\n<\/tr>\n<tr>\n<td><em>Secret de serviciu<\/em><\/td>\n<td>prejudiciu unei persoane juridice<\/td>\n<td>NATO <strong>RESTRICTED<\/strong><\/td>\n<td>—<\/td>\n<td><strong>S<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p><strong>Capcana nr. 1:<\/strong> „<strong>secret<\/strong>” românesc = NATO <strong>CONFIDENTIAL<\/strong>, nu NATO SECRET. Totul e decalat cu o treaptă.<\/p><\/aside><aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p><strong>100 – 50 – 30 de ani<\/strong> și <strong>000 – 00 – 0<\/strong>: cu cât e mai secret, cu atât <strong>mai mulți ani<\/strong> și <strong>mai multe zerouri<\/strong>.<\/p><\/aside><aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Gândește-te la <strong>3 seifuri<\/strong>: unul de bancă (SSID), unul de birou (SS), un sertar încuiat (S). Și la <strong>un dulap<\/strong> cu cheie al firmei (secret de serviciu).<\/p><\/aside>"}, {"t": "Ce înseamnă „informație” și cum se protejează", "h": "<ul>\n<li><strong>Informație<\/strong> = <strong>orice<\/strong> document, dată, obiect sau activitate, <strong>indiferent de suport sau formă<\/strong> (hârtie, fișier, conversație, obiect).<\/li>\n<li><strong>Certificatul de securitate<\/strong> atestă că o persoană a fost <strong>verificată și acreditată<\/strong> să lucreze cu informații clasificate.<\/li>\n<\/ul>\n<p><strong>Cele 5 forme de protecție:<\/strong><\/p>\n<ol>\n<li><strong>juridică<\/strong> (legile);<\/li>\n<li><strong>procedurală<\/strong> (regulile interne de lucru);<\/li>\n<li><strong>fizică<\/strong> (pază, seifuri, alarme);<\/li>\n<li><strong>a personalului<\/strong> (verificarea oamenilor);<\/li>\n<li><strong>a surselor<\/strong> care furnizează informațiile.<\/li>\n<\/ol>\n<p><strong>Obiectivele:<\/strong> protecția împotriva <strong>spionajului, compromiterii, accesului neautorizat, sabotajului<\/strong>, plus 📡 <strong>securitatea sistemelor informatice și de transmisie<\/strong>.<\/p>"}, {"t": "Cine coordonează (cine e șeful pe secrete)", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ce<\/th>\n<th>Cine<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Coordonarea națională<\/strong> a programelor de protecție<\/td>\n<td><strong>CSAT<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Standardele naționale<\/strong><\/td>\n<td><strong>SRI<\/strong>, cu acordul <strong>ANS<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Coordonarea și controlul<\/strong> protecției secretelor de stat<\/td>\n<td><strong>SRI<\/strong> (unitate specializată)<\/td>\n<\/tr>\n<tr>\n<td><strong>Informațiile NATO<\/strong><\/td>\n<td><strong>ANS<\/strong> (Autoritatea Națională de Securitate)<\/td>\n<\/tr>\n<tr>\n<td><strong>Evidența listelor<\/strong> și a termenelor<\/td>\n<td><strong>ORNISS<\/strong> (subordonat <strong>Guvernului<\/strong>)<\/td>\n<\/tr>\n<tr>\n<td><strong>Aprobarea listelor<\/strong> de secrete de stat<\/td>\n<td><strong>Guvernul<\/strong>, prin hotărâre<\/td>\n<\/tr>\n<tr>\n<td><strong>Declasificarea<\/strong> secretelor de stat<\/td>\n<td><strong>Guvernul<\/strong>, la cererea emitentului<\/td>\n<\/tr>\n<tr>\n<td>Protecția la <strong>atașații militari<\/strong><\/td>\n<td>structura specializată a <strong>MApN<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Secretele de serviciu<\/strong><\/td>\n<td><strong>conducătorul instituției<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-capcana\"><div class=\"co-h\">Capcană la grilă<\/div><p>Dacă regulile românești <strong>contrazic<\/strong> regulile <strong>NATO<\/strong>, se aplică <strong>regulile NATO<\/strong>.<\/p><\/aside>\n<p><strong>ADS (Autoritățile Desemnate de Securitate):<\/strong> <strong>MApN, MAI, MJ, SRI, SIE, SPP, STS<\/strong>. Fiecare își organizează singură protecția.<\/p>"}, {"t": "Cine are acces la un secret", "h": "<p><strong>Două condiții, obligatoriu amândouă:<\/strong><\/p>\n<ol>\n<li><strong>autorizație sau certificat<\/strong> pentru <strong>nivelul<\/strong> respectiv;<\/li>\n<li><strong>„necesitatea de a cunoaște”<\/strong>: ai nevoie de informație <strong>pentru serviciul tău<\/strong>.<\/li>\n<\/ol>\n<ul>\n<li>Autorizația o emite <strong>conducătorul instituției<\/strong>, după <strong>notificarea ORNISS<\/strong>.<\/li>\n<li>⚠️ <strong>Autorizația e valabilă maximum 4 ani.<\/strong><\/li>\n<li><strong>Refuzul sau retragerea<\/strong> autorizației = <strong>automat interdicție de acces<\/strong>.<\/li>\n<li><strong>Înainte<\/strong> să ocupi postul, semnezi un <strong>angajament scris de confidențialitate<\/strong>.<\/li>\n<li>⚠️ <strong>Obligația de a păstra secretul continuă și după ce pleci<\/strong> din post, <strong>cât timp informația rămâne clasificată<\/strong>.<\/li>\n<li>Cine accesează <strong>SSID<\/strong> e trecut în <strong>fișa de consultare<\/strong>.<\/li>\n<li>În <strong>crize sau calamități<\/strong>, comandantul poate da <strong>acces temporar<\/strong>, cu angajament semnat și anunțarea ORNISS.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>„Necesitatea de a cunoaște”<\/strong> e ca la spital: și portarul, și chirurgul au legitimație de spital, dar <strong>numai chirurgul<\/strong> intră în sala de operație.<\/p><\/aside>"}, {"t": "Reguli de marcare și lucru cu documentele", "h": "<ul>\n<li>Nivelul de secretizare se scrie <strong>pe FIECARE pagină<\/strong>, sus și jos. Paginile se numerotează „3 din 12”.<\/li>\n<li>Mențiunea <strong>„Personal”<\/strong> = documentul e destinat <strong>doar anumitor persoane<\/strong>.<\/li>\n<li><strong>Anexele<\/strong> se clasifică după <strong>conținutul lor<\/strong>, nu după documentul principal.<\/li>\n<li>Un document făcut din <strong>mai multe extrase<\/strong> primește nivelul <strong>celui mai înalt extras<\/strong>.<\/li>\n<li>Cine <strong>copiază, extrage sau rezumă<\/strong> un secret <strong>preia marcajele<\/strong> originalului.<\/li>\n<li><strong>Schimbarea nivelului:<\/strong> noul nivel se scrie deasupra/dedesubt, iar <strong>vechiul se taie cu o linie oblică<\/strong>.<\/li>\n<li><strong>Multiplicarea<\/strong>: doar persoane <strong>autorizate<\/strong>, doar în <strong>încăperi speciale<\/strong>. „Nu se multiplică” interzice copierea.<\/li>\n<li><strong>Distrugerea<\/strong>: astfel încât <strong>reconstituirea să fie imposibilă<\/strong>, cu <strong>proces-verbal<\/strong>.<\/li>\n<li>⚠️ 📡 <strong>Secretele de stat NU se transmit prin radio sau cablu fără criptare<\/strong> (cifrul de stat). Asta te privește direct ca operator.<\/li>\n<\/ul>"}, {"t": "Ce e interzis să fie secretizat", "h": "<p>⚠️ <strong>Nu poți clasifica o informație ca să:<\/strong><\/p>\n<ul>\n<li><strong>ascunzi încălcări ale legii<\/strong> sau <strong>greșeli administrative<\/strong>;<\/li>\n<li><strong>limitezi accesul la informațiile de interes public<\/strong>;<\/li>\n<li>restrângi ilegal drepturile cuiva.<\/li>\n<\/ul>\n<p><strong>Cercetarea științifică fundamentală<\/strong> fără legătură cu securitatea națională <strong>nu poate fi secretizată<\/strong>. Informațiile menite să <strong>informeze cetățenii<\/strong> <strong>nu pot fi secrete de serviciu<\/strong>.<\/p>\n<p>Orice persoană poate <strong>contesta<\/strong> clasificarea la <strong>autoritatea care a clasificat<\/strong>. Contestația se judecă în <strong>contencios administrativ<\/strong>.<\/p>"}, {"t": "Ce secrete de stat te privesc ca operator de comunicații", "h": "<p>Art. 17 enumeră ce e secret de stat. Pentru tine contează:<\/p>\n<ul>\n<li><strong>planurile și dispozitivele militare<\/strong>, operațiile;<\/li>\n<li><strong>cifrul de stat<\/strong> și elementele <strong>criptologice<\/strong>;<\/li>\n<li>📡 <strong>rețelele de calculatoare și sistemele de comunicații militare<\/strong>: <strong>datele, schemele, programele<\/strong> și <strong>mecanismele lor de securitate<\/strong>.<\/li>\n<\/ul>\n<p><strong>Zonele de securitate (HG 585):<\/strong><\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Zona<\/th>\n<th>Ce informații<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Clasa I<\/strong><\/td>\n<td><strong>SSID<\/strong> și <strong>strict secret<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Clasa II<\/strong><\/td>\n<td><strong>secret<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Zona administrativă<\/strong><\/td>\n<td>în jurul lor, cu control al accesului<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<ul>\n<li><strong>Aparatele foto, video, telefoanele<\/strong> sunt <strong>interzise<\/strong> în zonele de lucru cu secrete.<\/li>\n<li><strong>Fotografierea și filmarea<\/strong> obiectivelor importante sunt <strong>interzise<\/strong>, în afara celor autorizate.<\/li>\n<li><strong>Combinațiile seifurilor<\/strong> se schimbă periodic, <strong>de regulă la 6 luni, cel mult la 12 luni<\/strong>, și la schimbarea personalului.<\/li>\n<\/ul>"}, {"t": "Răspunderi și sancțiuni", "h": "<ul>\n<li>Încălcarea regulilor atrage răspundere <strong>disciplinară, contravențională, civilă sau penală<\/strong>.<\/li>\n<li>⚠️ <strong>Neglijența<\/strong> în păstrarea <strong>secretelor de serviciu<\/strong> atrage <strong>răspundere penală<\/strong>.<\/li>\n<li>Militarii vinovați de <strong>divulgare intenționată<\/strong> sau de <strong>neglijență<\/strong> care a permis scurgerea <strong>își pierd irevocabil calitatea<\/strong>.<\/li>\n<li><strong>Răspunderea<\/strong> pentru protecție o are <strong>conducătorul<\/strong> instituției.<\/li>\n<li>Contravențiile se stabilesc prin <strong>hotărâre a Guvernului<\/strong> și se pot aplica și <strong>firmelor<\/strong>.<\/li>\n<\/ul>"}], "flash": [["Cele 2 clase de secretizare?", "<b>Secrete de stat<\/b> și <b>secrete de serviciu<\/b>."], ["Cele 3 niveluri ale secretelor de stat?", "<b>Strict secret de importanță deosebită, strict secret, secret<\/b>."], ["SSID – ce prejudiciu?", "Daune de o gravitate <b>excepțională<\/b>."], ["SS – ce prejudiciu?", "Daune <b>grave<\/b>."], ["„Secret” românesc = ce nivel NATO?", "<b>NATO CONFIDENTIAL<\/b> (nu SECRET!)"], ["„Strict secret” = ? NATO", "<b>NATO SECRET<\/b>"], ["SSID = ? NATO", "<b>NATO TOP SECRET<\/b>"], ["Secret de serviciu = ? NATO", "<b>NATO RESTRICTED<\/b>"], ["Termenele maxime SSID / SS / S?", "<b>100 / 50 / 30 de ani<\/b>"], ["Cine poate prelungi termenele?", "<b>Guvernul<\/b>, prin hotărâre."], ["Prefixul nr. de înregistrare: S / SS / SSID / serviciu?", "<b>0 / 00 / 000 / S<\/b>"], ["Cine coordonează național protecția secretelor?", "<b>CSAT<\/b>."], ["Cine stabilește standardele naționale?", "<b>SRI<\/b>, cu acordul <b>ANS<\/b>."], ["Cine se ocupă de informațiile NATO?", "<b>ANS<\/b>."], ["Ce e ORNISS și cui e subordonat?", "Ține evidența secretelor de stat; e subordonat <b>Guvernului<\/b>."], ["Regulile românești contrazic NATO – ce aplici?", "<b>Regulile NATO<\/b>."], ["Cele 2 condiții de acces la un secret?", "<b>Autorizație/certificat<\/b> pe nivel + <b>necesitatea de a cunoaște<\/b>."], ["Valabilitatea autorizației de acces?", "<b>Max 4 ani<\/b>."], ["Cine emite autorizația?", "<b>Conducătorul instituției<\/b>, după notificarea ORNISS."], ["Obligația de secret după plecarea din post?", "<b>Continuă<\/b> cât timp informația e clasificată."], ["Unde se scrie nivelul de secretizare?", "Pe <b>fiecare pagină<\/b>."], ["Document din mai multe extrase – ce nivel?", "Nivelul <b>celui mai înalt extras<\/b>."], ["Cum marchezi schimbarea nivelului?", "Vechiul nivel <b>tăiat cu o linie oblică<\/b>, noul scris deasupra/dedesubt."], ["Secrete de stat prin radio în clar?", "<b>Interzis<\/b>, doar cu cifrul de stat."], ["Cine stabilește secretele de serviciu?", "<b>Conducătorul instituției<\/b>."], ["Neglijența cu secretele de serviciu?", "Atrage <b>răspundere penală<\/b>."], ["Poți secretiza ca să ascunzi o greșeală?", "<b>Nu<\/b>, e interzis."], ["Zona de securitate clasa I? Clasa II?", "Clasa I: <b>SSID și SS<\/b>. Clasa II: <b>secret<\/b>."], ["Formele de protecție?", "<b>Juridică, procedurală, fizică, a personalului, a surselor<\/b>."], ["ADS-urile?", "<b>MApN, MAI, MJ, SRI, SIE, SPP, STS<\/b>."]], "q": [{"id": "L07-001", "p": 1, "q": "Potrivit Legii 182/2002, clasele de secretizare sunt:", "o": ["secrete de stat și secrete de serviciu", "secret, strict secret și strict secret de importanță deosebită", "secrete militare și secrete civile", "confidențial, secret și top secret"], "a": 0, "e": "Art. 15 lit. c)."}, {"id": "L07-002", "p": 1, "q": "Nivelurile de secretizare atribuite informațiilor secrete de stat sunt:", "o": ["strict secret de importanță deosebită, strict secret și secret", "confidențial, secret și strict secret", "nesecret, secret și strict secret", "secret de serviciu, secret și strict secret"], "a": 0, "e": "Art. 15 lit. f) și art. 18."}, {"id": "L07-003", "p": 1, "q": "Informațiile a căror divulgare neautorizată este de natură să producă daune de o gravitate excepțională securității naționale se clasifică:", "o": ["secret", "strict secret", "strict secret de importanță deosebită", "secret de serviciu"], "a": 2, "e": "Art. 15 lit. f)."}, {"id": "L07-004", "p": 1, "q": "Informațiile a căror divulgare neautorizată este de natură să producă daune grave securității naționale se clasifică:", "o": ["strict secret de importanță deosebită", "strict secret", "secret de serviciu", "secret"], "a": 1, "e": "Art. 15 lit. f)."}, {"id": "L07-005", "p": 1, "q": "Informațiile a căror divulgare poate prejudicia o persoană juridică de drept public sau privat sunt:", "o": ["informații strict secrete", "informații secrete de stat de nivel secret", "informații secrete de serviciu", "informații de interes public"], "a": 2, "e": "Art. 15 lit. e)."}, {"id": "L07-007", "p": 1, "q": "Certificatul de securitate este documentul care atestă:", "o": ["nivelul de pregătire militară", "verificarea și acreditarea persoanei de a deține, de a avea acces și de a lucra cu informații clasificate", "calificarea profesională în comunicații", "dreptul de a purta armă"], "a": 1, "e": "Art. 15 lit. k)."}, {"id": "L07-009", "p": 1, "q": "Coordonarea la nivel național a programelor de protecție a informațiilor clasificate este asigurată de:", "o": ["Ministerul Apărării Naționale", "Consiliul Suprem de Apărare a Țării", "Parlament", "Ministerul Afacerilor Interne"], "a": 1, "e": "Art. 14."}, {"id": "L07-014", "p": 1, "q": "Potrivit art. 17, constituie secrete de stat informațiile care reprezintă:", "o": ["numărul de telefon al centralei publice a ministerului", "programul de lucru public al unității", "denumirea unităților militare publicată oficial", "datele, schemele și programele referitoare la sistemele de comunicații și la rețelele de calculatoare speciale și militare, inclusiv mecanismele de protecție"], "a": 3, "e": "Art. 17 lit. e)."}, {"id": "L07-015", "p": 1, "q": "Cifrul de stat și alte elemente criptologice stabilite de autoritățile competente reprezintă:", "o": ["informații secrete de serviciu", "informații de interes public", "informații secrete de stat", "informații neclasificate"], "a": 2, "e": "Art. 17 lit. c)."}, {"id": "L07-018", "p": 1, "q": "Oficiul Registrului Național al Informațiilor Secrete de Stat (ORNISS) este organizat:", "o": ["în cadrul SRI", "în subordinea Parlamentului", "în subordinea MApN", "în subordinea Guvernului"], "a": 3, "e": "Art. 21 alin. (1)."}, {"id": "L07-026", "p": 1, "q": "Accesul la informațiile secrete de stat este permis:", "o": ["pe baza unei cereri verbale aprobate de șeful direct", "oricărei persoane cu cazier curat", "numai pe baza unei autorizații scrise, emise de conducătorul persoanei juridice care deține informațiile, după notificarea prealabilă a ORNISS", "pe baza gradului militar"], "a": 2, "e": "Art. 28 alin. (1)."}, {"id": "L07-027", "p": 1, "q": "Autorizația de acces la informații secrete de stat este valabilă:", "o": ["cel mult 1 an", "pe durată nedeterminată", "cel mult 10 ani", "cel mult 4 ani"], "a": 3, "e": "Art. 28 alin. (4)."}, {"id": "L07-029", "p": 1, "q": "Informațiile secrete de serviciu se stabilesc de:", "o": ["Parlament", "ANS", "ORNISS", "conducătorul persoanei juridice, pe baza normelor prevăzute prin hotărâre a Guvernului"], "a": 3, "e": "Art. 31 alin. (1)."}, {"id": "L07-032", "p": 1, "q": "Obligația persoanelor de a proteja informațiile clasificate care le-au fost încredințate:", "o": ["încetează la data încetării raporturilor de muncă", "continuă și după încetarea raporturilor de muncă sau de serviciu, pe toată perioada menținerii clasificării", "durează 1 an după încetarea raporturilor de muncă", "încetează la trecerea în rezervă"], "a": 1, "e": "Art. 36 alin. (2)."}, {"id": "L07-035", "p": 1, "q": "Transmiterea informațiilor secrete de stat prin cablu sau eter:", "o": ["este interzisă fără folosirea cifrului de stat sau a altor elemente criptologice stabilite de autoritățile competente", "este permisă pe frecvențe VHF", "este permisă în timp de război", "este permisă dacă rețeaua este militară"], "a": 0, "e": "Art. 38 alin. (2)."}, {"id": "L08-001", "p": 1, "q": "Potrivit HG 585/2002, nivelului „strict secret de importanță deosebită” îi corespunde nivelul NATO:", "o": ["NATO TOP SECRET", "NATO SECRET", "NATO CONFIDENTIAL", "NATO RESTRICTED"], "a": 0, "e": "Art. 2."}, {"id": "L08-002", "p": 1, "q": "Nivelului național „strict secret” îi corespunde nivelul NATO:", "o": ["NATO SECRET", "NATO RESTRICTED", "NATO TOP SECRET", "NATO CONFIDENTIAL"], "a": 0, "e": "Art. 2."}, {"id": "L08-003", "p": 1, "q": "Nivelului național „secret” îi corespunde nivelul NATO:", "o": ["NATO SECRET", "NATO TOP SECRET", "NATO CONFIDENTIAL", "NATO RESTRICTED"], "a": 2, "e": "Art. 2 – atenție, nu „NATO SECRET”."}, {"id": "L08-004", "p": 1, "q": "Informațiilor „secret de serviciu” le corespunde nivelul NATO:", "o": ["NATO RESTRICTED", "NATO SECRET", "NATO UNCLASSIFIED", "NATO CONFIDENTIAL"], "a": 0, "e": "Art. 2."}, {"id": "L08-007", "p": 1, "q": "Principiul „necesității de a cunoaște” înseamnă că:", "o": ["informațiile se fac publice la cerere", "accesul la informații clasificate se acordă numai persoanelor care au nevoie de ele pentru îndeplinirea atribuțiilor de serviciu", "comandantul cunoaște toate informațiile din unitate", "orice persoană cu certificat are acces la orice informație de nivelul respectiv"], "a": 1, "e": "Art. 3 și art. 33."}, {"id": "L08-011", "p": 1, "q": "Termenul maxim de clasificare pentru informațiile „strict secret de importanță deosebită” este de până la:", "o": ["75 de ani", "50 de ani", "30 de ani", "100 de ani"], "a": 3, "e": "Art. 12."}, {"id": "L08-012", "p": 1, "q": "Termenul maxim de clasificare pentru informațiile „strict secret” este de până la:", "o": ["25 de ani", "100 de ani", "30 de ani", "50 de ani"], "a": 3, "e": "Art. 12."}, {"id": "L08-013", "p": 1, "q": "Termenul maxim de clasificare pentru informațiile „secret” este de până la:", "o": ["10 ani", "30 de ani", "50 de ani", "100 de ani"], "a": 1, "e": "Art. 12."}, {"id": "L08-021", "p": 1, "q": "Accesul la informații clasificate se acordă numai persoanelor care:", "o": ["sunt rude cu emitentul", "dețin certificat de securitate sau autorizație de acces valabilă pentru nivelul respectiv și au nevoie de informații pentru îndeplinirea atribuțiilor", "au grad de ofițer", "au peste 5 ani vechime în instituție"], "a": 1, "e": "Art. 33."}, {"id": "L07-010", "p": 2, "q": "Standardele naționale de protecție a informațiilor clasificate se stabilesc de:", "o": ["fiecare unitate militară", "Serviciul Român de Informații, cu acordul Autorității Naționale de Securitate", "Ministerul Apărării Naționale, singur", "Guvern, cu avizul Parlamentului"], "a": 1, "e": "Art. 6 alin. (1)."}, {"id": "L07-011", "p": 2, "q": "Dacă normele interne privind protecția informațiilor clasificate contravin normelor NATO:", "o": ["se aplică reglementările NATO", "se aplică normele interne", "decide instanța de contencios", "se aplică norma mai favorabilă cetățeanului"], "a": 0, "e": "Art. 6 alin. (3)."}, {"id": "L07-016", "p": 2, "q": "Nivelul „strict secret de importanță deosebită” poate fi atribuit, între alții, de:", "o": ["comandanți de batalion", "prim-ministru și miniștri", "subsecretari de stat", "directori de direcție din ministere"], "a": 1, "e": "Art. 19 lit. a)."}, {"id": "L07-019", "p": 2, "q": "Listele cuprinzând informațiile secrete de stat pe niveluri de secretizare se aprobă și se actualizează prin:", "o": ["decizie a ORNISS", "lege organică", "hotărâre a Guvernului", "ordin al ministrului apărării"], "a": 2, "e": "Art. 22 alin. (2)."}, {"id": "L07-020", "p": 2, "q": "Potrivit art. 24, nivelul de secretizare se înscrie:", "o": ["numai pe coperta dosarului", "numai pe prima pagină", "pe fiecare pagină a documentului", "numai în registrul de evidență"], "a": 2, "e": "Art. 24 alin. (1)."}, {"id": "L07-021", "p": 2, "q": "Este interzisă clasificarea ca secrete de stat a informațiilor în scopul:", "o": ["protecției cifrului de stat", "protecției planurilor militare", "protecției sistemelor de comunicații militare", "ascunderii încălcărilor legii sau a erorilor administrative"], "a": 3, "e": "Art. 24 alin. (5)."}, {"id": "L07-023", "p": 2, "q": "Coordonarea generală și controlul măsurilor de protecție a secretelor de stat se realizează de:", "o": ["Ministerul Afacerilor Externe", "Serviciul Român de Informații, printr-o unitate specializată", "Statul Major al Apărării", "Curtea de Conturi"], "a": 1, "e": "Art. 25 alin. (1)."}, {"id": "L07-025", "p": 2, "q": "Protecția informațiilor clasificate NATO este reglementată, autorizată și controlată de:", "o": ["Ministerul Apărării Naționale", "Comandamentul NATO de la Bruxelles", "Autoritatea Națională de Securitate (ANS)", "STS"], "a": 2, "e": "Art. 27."}, {"id": "L07-028", "p": 2, "q": "Refuzul eliberării autorizației sau retragerea motivată a acesteia determină:", "o": ["trecerea în rezervă", "suspendarea din funcție pe 30 de zile", "automat interdicția de acces la informațiile secrete de stat", "obligația de a plăti o amendă"], "a": 2, "e": "Art. 28 alin. (5)."}, {"id": "L07-030", "p": 2, "q": "Neglijența în păstrarea informațiilor secrete de serviciu atrage:", "o": ["doar răspunderea civilă", "numai avertisment", "răspunderea penală a persoanelor vinovate, potrivit legii", "nicio răspundere"], "a": 2, "e": "Art. 31 alin. (4)."}, {"id": "L07-031", "p": 2, "q": "Este interzisă clasificarea ca secrete de serviciu a informațiilor care:", "o": ["privesc structura internă a unei unități militare", "sunt destinate să asigure informarea cetățenilor asupra unor probleme de interes public sau personal", "privesc programul de pază al unității", "privesc datele personale ale angajaților"], "a": 1, "e": "Art. 33."}, {"id": "L07-033", "p": 2, "q": "Înainte de ocuparea unui post care presupune acces la informații clasificate, persoana:", "o": ["depune o garanție bănească", "trece un examen la ORNISS", "semnează un contract cu SRI", "dă un angajament scris de confidențialitate"], "a": 3, "e": "Art. 36 alin. (3)."}, {"id": "L07-034", "p": 2, "q": "Răspunderea pentru protecția informațiilor clasificate revine:", "o": ["conducătorului autorității sau persoanei juridice deținătoare", "fiecărui cetățean", "exclusiv ORNISS", "exclusiv SRI"], "a": 0, "e": "Art. 37 alin. (2)."}, {"id": "L07-037", "p": 2, "q": "Încălcarea normelor privind protecția informațiilor clasificate atrage răspunderea:", "o": ["exclusiv civilă", "disciplinară, contravențională, civilă sau penală, după caz", "exclusiv disciplinară", "exclusiv penală"], "a": 1, "e": "Art. 39 alin. (1)."}, {"id": "L08-005", "p": 2, "q": "Standardele naționale de protecție a informațiilor clasificate sunt obligatorii pentru:", "o": ["numai persoanele cu grad de ofițer", "orice persoană fizică sau juridică ce gestionează informații clasificate", "numai instituțiile militare", "numai SRI"], "a": 1, "e": "Art. 2."}, {"id": "L08-006", "p": 2, "q": "Care dintre următoarele NU este Autoritate Desemnată de Securitate (ADS) potrivit HG 585/2002?", "o": ["Serviciul de Protecție și Pază", "Serviciul de Telecomunicații Speciale", "Ministerul Educației", "Ministerul Apărării Naționale"], "a": 2, "e": "Art. 3: MApN, MAI, MJ, SRI, SIE, SPP, STS."}, {"id": "L08-008", "p": 2, "q": "Ghidul de clasificare a informațiilor se aprobă:", "o": ["de șeful compartimentului de documente clasificate", "prin hotărâre a Guvernului", "personal și în scris de împuterniciții sau funcționarii superiori abilitați să atribuie niveluri de secretizare", "de ORNISS"], "a": 2, "e": "Art. 5."}, {"id": "L08-014", "p": 2, "q": "Termenele de clasificare pot fi prelungite prin:", "o": ["lege organică", "decizie a emitentului, fără alte formalități", "ordin al ministrului apărării", "hotărâre a Guvernului"], "a": 3, "e": "Art. 12."}, {"id": "L08-017", "p": 2, "q": "Informațiile secrete de stat se declasifică prin:", "o": ["expirarea a 5 ani de la emitere", "hotărâre a Guvernului, la solicitarea motivată a emitentului", "ordin al ministrului", "decizia oricărui deținător"], "a": 1, "e": "Art. 19."}, {"id": "L08-018", "p": 2, "q": "Care dintre următoarele NU este un caz de declasificare prevăzut de art. 20?", "o": ["termenul de clasificare a expirat", "divulgarea informației nu mai poate prejudicia siguranța națională", "informația a fost clasificată de o persoană neîmputernicită", "informația a fost copiată de mai multe ori"], "a": 3, "e": "Art. 20."}, {"id": "L08-024", "p": 2, "q": "Numărul de înregistrare al unui document „strict secret de importanță deosebită” este precedat de:", "o": ["litera S", "un zero (0)", "două zerouri (00)", "trei zerouri (000)"], "a": 3, "e": "Prefixele: 0 – secret; 00 – strict secret; 000 – SSID; S – secret de serviciu."}, {"id": "L08-025", "p": 2, "q": "Numărul de înregistrare al unui document „secret de serviciu” este precedat de:", "o": ["două zerouri (00)", "litera S", "litera X", "un zero (0)"], "a": 1, "e": "HG 585/2002, Cap. III – marcarea."}, {"id": "L08-026", "p": 2, "q": "Numărul de înregistrare al unui document „secret” este precedat de:", "o": ["litera S", "trei zerouri (000)", "un zero (0)", "două zerouri (00)"], "a": 2, "e": "HG 585/2002, Cap. III."}, {"id": "L08-030", "p": 2, "q": "Informațiile „strict secret de importanță deosebită” și „strict secret” se gestionează în:", "o": ["zone de securitate clasa I", "zona administrativă", "zone de securitate clasa II", "orice birou închis cu cheia"], "a": 0, "e": "HG 585/2002, Cap. IV."}, {"id": "L08-031", "p": 2, "q": "Informațiile „secret” se gestionează, de regulă, în:", "o": ["spații publice", "zona administrativă", "zone de securitate clasa III", "zone de securitate clasa II"], "a": 3, "e": "HG 585/2002, Cap. IV."}, {"id": "L07-006", "p": 3, "q": "Potrivit art. 15, noțiunea de „informații” cuprinde:", "o": ["numai documentele scrise pe hârtie", "numai documentele cu ștampilă", "orice documente, date, obiecte sau activități, indiferent de suport, formă, mod de exprimare sau de punere în circulație", "numai datele stocate electronic"], "a": 2, "e": "Art. 15 lit. a)."}, {"id": "L07-008", "p": 3, "q": "Care dintre următoarele NU este o formă de protecție a informațiilor clasificate potrivit art. 9?", "o": ["protecția fizică", "protecția personalului", "protecția juridică", "protecția comercială"], "a": 3, "e": "Art. 9: juridică, procedurală, fizică, a personalului, a surselor."}, {"id": "L07-012", "p": 3, "q": "Potrivit art. 4, unul dintre obiectivele protecției informațiilor clasificate este:", "o": ["facilitarea accesului presei la documentele militare", "publicarea listelor de secrete de stat", "promovarea imaginii instituțiilor", "asigurarea securității sistemelor informatice și de transmitere a informațiilor clasificate"], "a": 3, "e": "Art. 4 lit. b)."}, {"id": "L07-013", "p": 3, "q": "Reverificarea autorizațiilor de acces este obligatorie și se face cu prioritate atunci când:", "o": ["persoana își schimbă domiciliul în același oraș", "există indicii că autorizația nu mai este compatibilă cu interesele de securitate", "persoana este avansată în grad", "persoana pleacă în concediu de odihnă"], "a": 1, "e": "Art. 10 alin. (3)."}, {"id": "L07-017", "p": 3, "q": "Contestarea clasificării informațiilor, a duratei sau a nivelului de secretizare se face la:", "o": ["ORNISS", "Curtea Constituțională", "autoritatea care a clasificat informația, iar soluționarea se face potrivit legii contenciosului administrativ", "Ministerul Justiției"], "a": 2, "e": "Art. 20."}, {"id": "L07-022", "p": 3, "q": "Persoanele autorizate care copiază, extrag sau rezumă conținutul unor documente secrete:", "o": ["au obligația de a aplica pe noul document mențiunile aflate pe documentul original", "trebuie să declasifice documentul", "pot reduce nivelul de secretizare", "pot elimina mențiunile de clasificare"], "a": 0, "e": "Art. 24 alin. (9)."}, {"id": "L07-024", "p": 3, "q": "Coordonarea și controlul protecției secretelor de stat pentru atașații militari și reprezentanții militari la organismele internaționale revin:", "o": ["Ministerului Afacerilor Externe", "structurii specializate a Ministerului Apărării Naționale", "ORNISS", "SIE"], "a": 1, "e": "Art. 26 alin. (2)."}, {"id": "L07-036", "p": 3, "q": "Persoanele din armată vinovate de divulgarea intenționată a secretelor de stat sau de neglijență care a facilitat divulgarea:", "o": ["sunt mutate în altă unitate", "pierd 10% din soldă pe 3 luni", "primesc avertisment", "își pierd irevocabil calitatea pe care o au"], "a": 3, "e": "Art. 39 alin. (2)."}, {"id": "L07-038", "p": 3, "q": "Contravențiile la normele privind protecția informațiilor clasificate se stabilesc prin:", "o": ["ordin al ministrului apărării", "decizie a CSAT", "regulament al SRI", "hotărâre a Guvernului"], "a": 3, "e": "Art. 40 alin. (1)."}, {"id": "L07-039", "p": 3, "q": "Sancțiunile contravenționale privind informațiile clasificate se pot aplica:", "o": ["numai funcționarilor publici", "numai persoanelor fizice", "și persoanelor juridice", "numai militarilor"], "a": 2, "e": "Art. 40 alin. (2)."}, {"id": "L08-009", "p": 3, "q": "Listele informațiilor secrete de serviciu se stabilesc de:", "o": ["ORNISS", "Guvern", "SRI", "conducătorii unităților deținătoare"], "a": 3, "e": "Art. 7."}, {"id": "L08-010", "p": 3, "q": "Verificarea corectitudinii clasificării unei informații se face, potrivit art. 11, de:", "o": ["destinatarul documentului", "instanța de contencios", "ORNISS", "șeful ierarhic al emitentului"], "a": 3, "e": "Art. 11."}, {"id": "L08-015", "p": 3, "q": "Un document realizat din extrase cumulate cu niveluri diferite de secretizare primește:", "o": ["nivelul „secret de serviciu”", "automat nivelul „strict secret de importanță deosebită”", "cel mai mic nivel dintre extrase", "nivelul de secretizare al extrasului cu cea mai înaltă clasificare"], "a": 3, "e": "Art. 14."}, {"id": "L08-016", "p": 3, "q": "Supraevaluarea sau subevaluarea clasificării unei informații poate fi contestată de:", "o": ["orice persoană fizică sau juridică română, în contencios administrativ", "numai de ORNISS", "numai de SRI", "numai de emitent"], "a": 0, "e": "Art. 17."}, {"id": "L08-019", "p": 3, "q": "La schimbarea nivelului de secretizare, vechea inscripție:", "o": ["se acoperă cu o etichetă opacă", "se taie cu o linie oblică, iar noua clasă și data se scriu deasupra sau dedesubtul ei", "rămâne neschimbată, iar noul nivel se trece doar în registru", "se șterge cu corector"], "a": 1, "e": "Art. 22."}, {"id": "L08-020", "p": 3, "q": "Informațiile clasificate compromise sau pierdute se declasifică:", "o": ["după 30 de zile de la pierdere", "numai după o cercetare care confirmă compromiterea sau pierderea, cu acordul scris al emitentului", "automat, la constatarea pierderii", "la cererea oricărui angajat"], "a": 1, "e": "Art. 23."}, {"id": "L08-022", "p": 3, "q": "Persoanele care au acces la informații „strict secret de importanță deosebită” sunt consemnate în:", "o": ["carnetul de muncă", "condica de serviciu", "registrul de intrări-ieșiri al unității", "fișa de consultare"], "a": 3, "e": "Art. 34."}, {"id": "L08-023", "p": 3, "q": "În situații de criză, calamități sau evenimente neprevăzute, conducătorul unității poate acorda acces temporar la informații clasificate unor persoane fără certificat, cu condiția ca acestea să semneze:", "o": ["un proces-verbal de distrugere", "un contract de muncă pe durată determinată", "angajamentul de confidențialitate, iar ORNISS să fie anunțat cât mai curând", "o declarație de avere"], "a": 2, "e": "Art. 36."}, {"id": "L08-027", "p": 3, "q": "Anexele unui document clasificat se clasifică:", "o": ["obligatoriu cu nivelul documentului principal", "întotdeauna cu un nivel mai mic", "după conținutul propriu", "nu se clasifică"], "a": 2, "e": "HG 585/2002 – marcarea."}, {"id": "L08-028", "p": 3, "q": "Multiplicarea documentelor clasificate se face:", "o": ["numai la firme specializate din exterior", "de orice angajat, la orice copiator", "numai cu aprobarea ORNISS pentru fiecare copie", "numai de persoane autorizate și numai în încăperi special destinate"], "a": 3, "e": "HG 585/2002, art. 66–74."}, {"id": "L08-029", "p": 3, "q": "Distrugerea documentelor clasificate se face astfel încât:", "o": ["să poată fi reconstituite la nevoie", "să se păstreze prima pagină", "reconstituirea lor să fie imposibilă", "să se arhiveze o copie scanată nesecurizată"], "a": 2, "e": "HG 585/2002, art. 76–80."}, {"id": "L08-032", "p": 3, "q": "Combinațiile încuietorilor containerelor de securitate se schimbă periodic, de regulă la ... și nu mai rar de ...", "o": ["6 luni; 12 luni", "1 lună; 3 luni", "1 an; 5 ani", "3 luni; 2 ani"], "a": 0, "e": "HG 585/2002, Cap. IV. Se schimbă și la schimbarea personalului sau la compromitere."}, {"id": "L08-033", "p": 3, "q": "În zonele în care se lucrează cu informații clasificate, accesul cu aparate de fotografiat, filmat sau înregistrat audio-video:", "o": ["este permis numai personalului civil", "este interzis, în afara situațiilor aprobate", "este permis dacă aparatele sunt închise", "este permis oricui"], "a": 1, "e": "HG 585/2002, Cap. IV."}, {"id": "L08-034", "p": 3, "q": "Fotografierea, filmarea și cartografierea în obiectivele care prezintă importanță deosebită pentru protecția secretelor de stat sunt:", "o": ["permise oricui de pe domeniul public", "permise turiștilor", "permise jurnaliștilor acreditați fără alte formalități", "interzise, cu excepția celor autorizate"], "a": 3, "e": "HG 585/2002, Cap. V."}, {"id": "L08-035", "p": 3, "q": "Potrivit HG 585/2002, persoanele cu certificat de securitate sau autorizație de acces sunt instruite:", "o": ["numai în caz de incident de securitate", "o singură dată, la angajare", "la acordarea certificatului și periodic, instruirea consemnându-se în fișa de pregătire individuală", "numai la cerere"], "a": 2, "e": "Art. 35."}]}, {"nr": 8, "id": "voce-digitala", "t": "Cum devine vocea digitală (PCM)", "tema": "Conversia analog-numerică a semnalelor – eșantionare, cuantizare, codare", "parte": "S", "stele": 3, "itemi": "1–3", "timp": "45 min", "sursa": "T. Rădulescu, Rețele de telecomunicații (2005), pag. 13–17", "ps": "<p>Capitolul <strong>cel mai logic<\/strong>: <strong>3 pași<\/strong> (eșantionare → cuantizare → codare) și <strong>o înmulțire<\/strong>: <strong>8000 × 8 = 64 kbit/s<\/strong>. Dacă înțelegi desenul, rezolvi aproape orice grilă <strong>fără să tocești<\/strong>. Tot aici sunt și grilele de calcul din toată specialitatea.<\/p>", "fise": [{"t": "De ce digitizăm vocea", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Avantaj<\/th>\n<th>De ce<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Regenerare<\/strong><\/td>\n<td>pe drum, repetoarele <strong>refac perfect<\/strong> semnalul (doar decid „0 sau 1”). <strong>Zgomotul nu se adună.<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Criptare<\/strong><\/td>\n<td>biții se criptează ușor → <strong>secret<\/strong> (esențial în armată)<\/td>\n<\/tr>\n<tr>\n<td><strong>Multiplexare<\/strong><\/td>\n<td>multe canale pe același fir (vezi cap. 10)<\/td>\n<\/tr>\n<tr>\n<td><strong>Totul în aceeași rețea<\/strong><\/td>\n<td>voce, date, imagine – toate devin biți<\/td>\n<\/tr>\n<tr>\n<td>❌ <strong>Dezavantaj<\/strong><\/td>\n<td>ocupă <strong>bandă mai mare<\/strong> (64 kbit/s față de 4 kHz analogic)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Copiezi o casetă de pe altă casetă: fiecare copie e mai <strong>hârâită<\/strong> (analogic). Copiezi un fișier MP3: a 100-a copie e <strong>identică<\/strong> cu prima (digital).<\/p><\/aside>"}, {"t": "Cei 3 pași", "h": "<figure class=\"dg\"><svg viewBox=\"0 0 400 290\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"Eșantionare, cuantizare și codare\">\n  <g class=\"s-line\" stroke-width=\"1\"><line x1=\"40\" y1=\"40\" x2=\"390\" y2=\"40\"/><line x1=\"40\" y1=\"72\" x2=\"390\" y2=\"72\"/><line x1=\"40\" y1=\"104\" x2=\"390\" y2=\"104\"/><line x1=\"40\" y1=\"136\" x2=\"390\" y2=\"136\"/><line x1=\"40\" y1=\"168\" x2=\"390\" y2=\"168\"/><line x1=\"40\" y1=\"200\" x2=\"390\" y2=\"200\"/><\/g>\n  <g class=\"t-m t-mut\" style=\"font-size:11px\" text-anchor=\"end\"><text x=\"34\" y=\"44\">101<\/text><text x=\"34\" y=\"76\">100<\/text><text x=\"34\" y=\"108\">011<\/text><text x=\"34\" y=\"140\">010<\/text><text x=\"34\" y=\"172\">001<\/text><text x=\"34\" y=\"204\">000<\/text><\/g>\n  <path d=\"M40 120 C 80 20, 120 20, 160 100 S 240 220, 280 160 S 350 60, 390 90\" class=\"s-blu f-none\" stroke-width=\"2.5\"/>\n  <g class=\"s-amb\" stroke-width=\"2\">\n    <line x1=\"70\" y1=\"206\" x2=\"70\" y2=\"58\"/><line x1=\"120\" y1=\"206\" x2=\"120\" y2=\"44\"/><line x1=\"170\" y1=\"206\" x2=\"170\" y2=\"120\"/>\n    <line x1=\"220\" y1=\"206\" x2=\"220\" y2=\"183\"/><line x1=\"270\" y1=\"206\" x2=\"270\" y2=\"164\"/><line x1=\"320\" y1=\"206\" x2=\"320\" y2=\"104\"/><line x1=\"370\" y1=\"206\" x2=\"370\" y2=\"83\"/>\n  <\/g>\n  <g class=\"f-acc\"><circle cx=\"70\" cy=\"72\" r=\"6\"/><circle cx=\"120\" cy=\"40\" r=\"6\"/><circle cx=\"170\" cy=\"104\" r=\"6\"/><circle cx=\"220\" cy=\"168\" r=\"6\"/><circle cx=\"270\" cy=\"168\" r=\"6\"/><circle cx=\"320\" cy=\"104\" r=\"6\"/><circle cx=\"370\" cy=\"72\" r=\"6\"/><\/g>\n  <g class=\"t-m t-b t-acc\" text-anchor=\"middle\" style=\"font-size:12px\"><text x=\"70\" y=\"226\">100<\/text><text x=\"120\" y=\"226\">101<\/text><text x=\"170\" y=\"226\">011<\/text><text x=\"220\" y=\"226\">001<\/text><text x=\"270\" y=\"226\">001<\/text><text x=\"320\" y=\"226\">011<\/text><text x=\"370\" y=\"226\">100<\/text><\/g>\n  <g style=\"font-size:12px\"><text x=\"40\" y=\"254\" class=\"t-blu t-b\">— semnalul (analogic)<\/text><text x=\"210\" y=\"254\" class=\"t-amb t-b\">| eșantioane<\/text>\n  <text x=\"40\" y=\"276\" class=\"t-acc t-b\">● nivelul rotunjit<\/text><text x=\"210\" y=\"276\" class=\"t-acc t-b t-m\">101 = codul binar<\/text><\/g>\n<\/svg><figcaption>1. Iei „poze” ale undei la intervale egale. 2. Rotunjești fiecare valoare la cea mai apropiată treaptă. 3. Scrii treapta în binar.<\/figcaption><\/figure>\n\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Pas<\/th>\n<th>Ce faci<\/th>\n<th>Pe scurt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Eșantionare<\/strong><\/td>\n<td>măsori semnalul la <strong>intervale egale de timp<\/strong><\/td>\n<td>discret <strong>în timp<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>2. Cuantizare<\/strong><\/td>\n<td><strong>rotunjești<\/strong> fiecare valoare la cel mai apropiat <strong>nivel<\/strong><\/td>\n<td>discret <strong>în valoare<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Codare<\/strong><\/td>\n<td>scrii fiecare nivel ca <strong>număr binar<\/strong> (0 și 1)<\/td>\n<td>biți<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Toți trei la un loc se numesc <strong>PCM<\/strong> (<em>modulația impulsurilor în cod<\/em>).<\/p>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Filmezi o mașină: <strong>eșantionarea<\/strong> = câte cadre pe secundă faci. <strong>Cuantizarea<\/strong> = câte culori are aparatul. <strong>Codarea<\/strong> = salvezi poza ca fișier.<\/p><\/aside>"}, {"t": "Pasul 1: eșantionarea și regula lui 2", "h": "<blockquote><p><strong>Teorema eșantionării:<\/strong> ca să poți reface semnalul, eșantionezi cu o frecvență <strong>cel puțin dublă<\/strong> față de cea mai mare frecvență din semnal.<\/p>\n<p><strong>fₑ ≥ 2 × f_max<\/strong><\/p><\/blockquote>\n<ul>\n<li><strong>Vocea la telefon<\/strong> e limitată la <strong>3,4 kHz<\/strong> → s-ar cere minimum 6,8 kHz → se folosește <strong>8 kHz<\/strong> (8000 de eșantioane pe secundă).<\/li>\n<li>Un eșantion la fiecare <strong>1/8000 s = 125 µs<\/strong>.<\/li>\n<li>Dacă eșantionezi <strong>prea rar<\/strong>, apare <strong>aliasing<\/strong>: semnalul se „deghizează” în altă frecvență și <strong>nu mai poate fi refăcut<\/strong>.<\/li>\n<li>De aceea, <strong>înainte<\/strong> de eșantionare se pune un <strong>filtru trece-jos (anti-aliasing)<\/strong>.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p><strong>Aliasing-ul<\/strong> îl vezi în filmele cu mașini: roțile par că se învârt <strong>invers<\/strong>. Camera face prea puține cadre pe secundă față de cât de repede se învârte roata.<\/p><\/aside><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p>f_max = <strong>4 kHz<\/strong> → fₑ ≥ <strong>8 kHz<\/strong>. Un semnal de <strong>5 kHz<\/strong> eșantionat la <strong>8 kHz<\/strong>? 8 &lt; 10 → <strong>aliasing<\/strong>.<\/p><\/aside>"}, {"t": "Pasul 2: cuantizarea și eroarea ei", "h": "<ul>\n<li>Cu <strong>n biți<\/strong> ai <strong>2ⁿ niveluri<\/strong>: <strong>8 biți → 256<\/strong> de niveluri, <strong>7 biți → 128<\/strong>, <strong>16 biți → 65.536<\/strong>.<\/li>\n<li><strong>Eroarea de cuantizare<\/strong> = diferența dintre valoarea reală și treapta aleasă. E de <strong>maximum ±jumătate de pas<\/strong>.<\/li>\n<li>⚠️ E <strong>singura pierdere ireversibilă<\/strong> din tot procesul.<\/li>\n<li><strong>Mai mulți biți = trepte mai mici = eroare mai mică.<\/strong> Fiecare bit în plus aduce <strong>≈ +6 dB<\/strong> calitate.<\/li>\n<li><strong>Compandarea<\/strong> (cuantizare neuniformă): trepte <strong>mici<\/strong> pentru sunetele <strong>slabe<\/strong> și <strong>mari<\/strong> pentru cele puternice. Calitate bună cu <strong>același număr de biți<\/strong>.<\/li>\n<li><strong>Legea A<\/strong> → <strong>Europa (și România)<\/strong>. <strong>Legea µ<\/strong> → America de Nord, Japonia.<\/li>\n<\/ul>\n<aside class=\"co co-analog\"><div class=\"co-h\">Ca în viața reală<\/div><p>Cuantizarea e ca o <strong>scară<\/strong>: nu poți sta între două trepte. Cu cât treptele sunt mai mici (mai mulți biți), cu atât poți sta mai aproape de înălțimea dorită.<\/p><\/aside>"}, {"t": "Formula de aur: debitul PCM", "h": "<blockquote><p><strong>Debit = frecvența de eșantionare × biți pe eșantion<\/strong><\/p><\/blockquote><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>Telefonia digitală:<\/strong> 8000 × 8 = <strong>64.000 bit/s = 64 kbit/s<\/strong>. Acesta e <strong>canalul telefonic digital de bază<\/strong>.<\/p><\/aside><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>Muzică de CD:<\/strong> 44.100 × 16 biți × 2 canale (stereo) ≈ <strong>1,41 Mbit/s<\/strong>.<\/p><\/aside><aside class=\"co co-calc\"><div class=\"co-h\">Exemplu rezolvat<\/div><p><strong>ADPCM:<\/strong> 8000 × 4 biți = <strong>32 kbit/s<\/strong>.<\/p><\/aside>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Metodă<\/th>\n<th>Ideea<\/th>\n<th>Debit voce<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>PCM<\/strong><\/td>\n<td>codezi <strong>valoarea<\/strong> fiecărui eșantion<\/td>\n<td><strong>64 kbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>DPCM / ADPCM<\/strong><\/td>\n<td>codezi doar <strong>diferența<\/strong> față de eșantionul anterior<\/td>\n<td><strong>32 kbit/s<\/strong> (ADPCM)<\/td>\n<\/tr>\n<tr>\n<td><strong>Modulație delta<\/strong><\/td>\n<td><strong>1 bit pe eșantion<\/strong>: „crește” sau „scade”. Defect: <strong>supraîncărcarea pantei<\/strong> (nu ține pasul cu variațiile rapide).<\/td>\n<td>16–32 kbit/s<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>"}, {"t": "La recepție", "h": "<p><strong>Decodare<\/strong> (din biți în trepte) → <strong>filtru trece-jos de refacere<\/strong> (netezește treptele) → <strong>sunetul inițial<\/strong>.<\/p>"}, {"t": "Toate calculele din specialitate, pe o pagină", "h": "<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Formula<\/th>\n<th>Exemplu<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>λ = 300 / f[MHz]<\/strong><\/td>\n<td>50 MHz → <strong>6 m<\/strong>; 3 MHz → <strong>100 m<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>bici = λ/4, dipol = λ/2<\/strong><\/td>\n<td>60 MHz → λ = 5 m → bici <strong>1,25 m<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>orizont d ≈ 4,12(√h₁+√h₂)<\/strong><\/td>\n<td>4 m și 25 m → 4,12 × 7 ≈ <strong>29 km<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>fₑ ≥ 2 f_max<\/strong><\/td>\n<td>3,4 kHz → <strong>6,8 kHz<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>debit PCM = fₑ × n<\/strong><\/td>\n<td>8 kHz × 8 = <strong>64 kbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>niveluri = 2ⁿ<\/strong><\/td>\n<td>8 biți → <strong>256<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Nyquist: D = 2B·log₂V<\/strong><\/td>\n<td>3 kHz, 16 niveluri → 2 × 3000 × 4 = <strong>24 kbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Shannon: C = B·log₂(1+S/N)<\/strong><\/td>\n<td>3 kHz, 30 dB (=1000) → ≈ <strong>30 kbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>dB = 10·log₁₀(raport)<\/strong><\/td>\n<td>3 dB = ×2; 10 dB = ×10; 20 dB = ×100; 30 dB = ×1000<\/td>\n<\/tr>\n<tr>\n<td><strong>dBm<\/strong> (față de 1 mW)<\/td>\n<td>1 mW = <strong>0 dBm<\/strong>; 100 mW = <strong>20 dBm<\/strong>; 1 W = <strong>30 dBm<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>E1 = 32 × 8 × 8000<\/strong><\/td>\n<td><strong>2,048 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>T1 = 193 × 8000<\/strong><\/td>\n<td><strong>1,544 Mbit/s<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>crossbar n × n<\/strong><\/td>\n<td>50 × 50 → <strong>2500<\/strong> de puncte<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<aside class=\"co co-retine\"><div class=\"co-h\">Ține minte<\/div><p>La examen <strong>nu ai calculator<\/strong>. De aceea toate grilele folosesc <strong>numere rotunde<\/strong>: puteri ale lui 2 (2, 4, 8, 16), pătrate (1, 4, 9, 16, 25, 100) și puteri ale lui 10.<\/p><\/aside>"}], "flash": [["Cei 3 pași ai conversiei analog-numerice?", "<b>Eșantionare → cuantizare → codare<\/b>"], ["Ce e eșantionarea?", "Măsurarea semnalului la <b>intervale egale de timp<\/b>."], ["Ce e cuantizarea?", "<b>Rotunjirea<\/b> fiecărui eșantion la cel mai apropiat nivel."], ["Ce e codarea?", "Scrierea fiecărui nivel în <b>binar<\/b>."], ["Cum se numesc toți trei la un loc?", "<b>PCM<\/b> – modulația impulsurilor în cod."], ["Teorema eșantionării?", "<b>fₑ ≥ 2 × f_max<\/b>"], ["Frecvența de eșantionare la telefon?", "<b>8 kHz<\/b> (vocea până la 3,4 kHz)."], ["Timpul dintre două eșantioane la 8 kHz?", "<b>125 µs<\/b>"], ["Ce apare dacă eșantionezi prea rar?", "<b>Aliasing<\/b>."], ["Ce filtru pui înainte de eșantionare?", "<b>Trece-jos (anti-aliasing)<\/b>."], ["Câte niveluri cu 8 biți? Cu 7?", "<b>256<\/b>; <b>128<\/b>."], ["Eroarea maximă de cuantizare?", "<b>±jumătate de pas<\/b>; e ireversibilă."], ["Cum reduci zgomotul de cuantizare?", "Cu <b>mai mulți biți<\/b> pe eșantion (+6 dB/bit)."], ["Legea de compandare în Europa?", "<b>Legea A<\/b> (legea µ în SUA/Japonia)."], ["Formula debitului PCM?", "<b>fₑ × n<\/b> (eșantioane/s × biți)"], ["Debitul canalului telefonic digital?", "<b>8000 × 8 = 64 kbit/s<\/b>"], ["ADPCM – debit?", "<b>32 kbit/s<\/b>"], ["Modulația delta – câți biți pe eșantion?", "<b>1 bit<\/b>."], ["Defectul modulației delta?", "<b>Supraîncărcarea pantei<\/b>."], ["Avantajul principal al digitalului pe distanțe mari?", "<b>Regenerarea<\/b>: zgomotul nu se acumulează."], ["Dezavantajul PCM față de analogic?", "Cere <b>bandă mai mare<\/b>."], ["Ce refăce semnalul la recepție?", "<b>Filtrul trece-jos de refacere<\/b>."]], "q": [{"id": "S09-001", "p": 1, "q": "Etapele conversiei analog-numerice a unui semnal sunt, în ordine:", "o": ["modularea, multiplexarea, codarea", "eșantionarea, cuantizarea, codarea", "codarea, cuantizarea, eșantionarea", "cuantizarea, eșantionarea, codarea"], "a": 1, "e": "Conversia A/N."}, {"id": "S09-002", "p": 1, "q": "Eșantionarea reprezintă:", "o": ["rotunjirea valorilor la un număr finit de niveluri", "atribuirea de cuvinte binare fiecărui nivel", "prelevarea valorilor semnalului la intervale de timp egale", "amplificarea semnalului"], "a": 2, "e": "Pasul 1."}, {"id": "S09-003", "p": 1, "q": "Cuantizarea reprezintă:", "o": ["transmiterea semnalului prin fibră", "criptarea biților", "aproximarea fiecărui eșantion cu cel mai apropiat nivel dintr-un număr finit de niveluri", "prelevarea eșantioanelor la intervale egale"], "a": 2, "e": "Pasul 2."}, {"id": "S09-004", "p": 1, "q": "Codarea, în conversia analog-numerică, reprezintă:", "o": ["eșantionarea semnalului", "modularea purtătoarei", "filtrarea semnalului", "atribuirea unui cuvânt binar fiecărui nivel de cuantizare"], "a": 3, "e": "Pasul 3."}, {"id": "S09-005", "p": 1, "q": "Potrivit teoremei eșantionării, un semnal cu frecvența maximă f_max poate fi refăcut fără pierderi dacă frecvența de eșantionare este:", "o": ["cel puțin 2 · f_max", "cel puțin f_max / 2", "cel mult f_max", "exact f_max"], "a": 0, "e": "Teorema Nyquist–Shannon (Kotelnikov)."}, {"id": "S09-006", "p": 1, "q": "Frecvența minimă de eșantionare pentru un semnal cu frecvența maximă de 4 kHz este:", "o": ["4 kHz", "2 kHz", "16 kHz", "8 kHz"], "a": 3, "e": "fₑ ≥ 2 × 4 kHz."}, {"id": "S09-007", "p": 1, "q": "Fenomenul care apare atunci când frecvența de eșantionare este mai mică decât dublul frecvenței maxime a semnalului se numește:", "o": ["fading", "dispersie", "diafonie", "aliasing (suprapunerea spectrelor)"], "a": 3, "e": "Eșantionare insuficientă."}, {"id": "S09-009", "p": 1, "q": "În telefonia digitală, frecvența de eșantionare standard a vocii este:", "o": ["4 kHz", "44,1 kHz", "8 kHz", "64 kHz"], "a": 2, "e": "Vocea e limitată la 3,4 kHz."}, {"id": "S09-011", "p": 1, "q": "Numărul de niveluri de cuantizare disponibile la codarea pe 8 biți este:", "o": ["128", "512", "8", "256"], "a": 3, "e": "2⁸ = 256."}, {"id": "S09-018", "p": 1, "q": "Modulația care cuprinde eșantionarea, cuantizarea și codarea binară a semnalului se numește:", "o": ["FDM", "AM", "FM", "PCM (modulația impulsurilor în cod)"], "a": 3, "e": "PCM."}, {"id": "S09-019", "p": 1, "q": "Debitul unui semnal PCM se calculează ca:", "o": ["2 × frecvența maximă a semnalului", "frecvența de eșantionare × numărul de biți pe eșantion", "lărgimea de bandă × raportul S/N", "frecvența de eșantionare / numărul de biți"], "a": 1, "e": "Debitul PCM."}, {"id": "S09-020", "p": 1, "q": "Debitul canalului telefonic digital standard (8 kHz × 8 biți) este:", "o": ["128 kbit/s", "64 kbit/s", "16 kbit/s", "8 kbit/s"], "a": 1, "e": "8000 × 8."}, {"id": "S11-001", "p": 1, "q": "Lungimea de undă a unui semnal cu frecvența de 50 MHz este:", "o": ["6 m", "0,6 m", "60 m", "15 m"], "a": 0, "e": "λ = 300 / 50."}, {"id": "S11-002", "p": 1, "q": "Frecvența corespunzătoare unei lungimi de undă de 2 m este:", "o": ["1,5 MHz", "150 MHz", "15 MHz", "600 MHz"], "a": 1, "e": "f = 300 / 2."}, {"id": "S11-003", "p": 1, "q": "O antenă bici λ/4 pentru frecvența de 60 MHz are lungimea teoretică de:", "o": ["0,5 m", "2,5 m", "1,25 m", "5 m"], "a": 2, "e": "λ = 5 m; λ/4 = 1,25 m."}, {"id": "S11-005", "p": 1, "q": "Orizontul radio dintre două antene aflate la 1 m înălțime fiecare este de aproximativ:", "o": ["1 km", "8 km", "4 km", "16 km"], "a": 1, "e": "4,12 × (1 + 1)."}, {"id": "S11-008", "p": 1, "q": "Frecvența minimă de eșantionare a unui semnal vocal limitat la 3,4 kHz este:", "o": ["1,7 kHz", "6,8 kHz", "13,6 kHz", "3,4 kHz"], "a": 1, "e": "2 × 3,4 kHz."}, {"id": "S11-010", "p": 1, "q": "Voce eșantionată la 8 kHz și codată pe 4 biți/eșantion produce un debit de:", "o": ["12 kbit/s", "64 kbit/s", "2 kbit/s", "32 kbit/s"], "a": 3, "e": "8000 × 4."}, {"id": "S11-018", "p": 1, "q": "Câte canale de 64 kbit/s corespund debitului de 2,048 Mbit/s?", "o": ["24", "64", "30", "32"], "a": 3, "e": "2048 / 64 = 32 (30 utile + 2 de serviciu)."}, {"id": "S09-008", "p": 2, "q": "Pentru a evita aliasingul, înaintea eșantionării se folosește:", "o": ["un filtru trece-sus", "un amplificator de putere", "un filtru trece-jos (anti-aliasing)", "o antenă directivă"], "a": 2, "e": "Eșantionare."}, {"id": "S09-010", "p": 2, "q": "Intervalul de timp dintre două eșantioane succesive, la o frecvență de eșantionare de 8 kHz, este:", "o": ["1 ms", "125 µs", "8 ms", "64 µs"], "a": 1, "e": "1/8000 s."}, {"id": "S09-013", "p": 2, "q": "Eroarea de cuantizare are valoarea maximă de:", "o": ["un pas de cuantizare întreg", "zero, dacă se folosește cuantizare uniformă", "dublul p
